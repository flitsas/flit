          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No es SuperAdmin (sin cuerpo).
        "503":
          description: >
            IDENTIDAD_NO_CONFIGURADA (sin Retry-After), IDENTIDAD_NO_DISPONIBLE (con Retry-After), PLATAFORMA_NO_DISPONIBLE (con
            Retry-After) o PLATAFORMA_NO_CONFIGURADA.
          headers:
            Retry-After: { schema: { type: integer, example: 30 }, description: Segundos para reintentar. }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Sin sesión, token inválido o de otro producto.
    ProhibidoUsuarios:
      description: >
        Sin diagnostico.usuarios.gestionar (o, en el backoffice, sin SuperAdmin), o la plataforma rechazó al actor: sin cuerpo.
        Con cuerpo: SIN_EMPRESA, PRODUCTO_NO_HABILITADO o ROL_NO_ASIGNABLE (un admin_diagnostico intenta dar admin_diagnostico).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    ProhibidoAccionUsuario:
      description: >
        OBJETIVO_PROTEGIDO (el objetivo es AdminCompany o SuperAdmin: se gestiona en el hub) o ROL_NO_ASIGNABLE (solo el SuperAdmin da o
        quita admin_diagnostico; un admin_diagnostico no actúa sobre otro). Sin cuerpo: sin permiso.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    UsuarioNoEncontrado:
      description: >
        USUARIO_NO_ENCONTRADO: el usuario no es de la compañía o no tiene ni tuvo rol de Diagnóstico (mismo cuerpo en los dos casos, SP-13).
        En el backoffice, EMPRESA_NO_ENCONTRADA si la compañía no tiene Diagnóstico.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    PlataformaUsuariosNoDisponible:
      description: >
        PLATAFORMA_NO_DISPONIBLE: core-api no respondió (con Retry-After). PLATAFORMA_NO_CONFIGURADA: el servicio no tiene la dirección
        gRPC de core-api (Diagnostico:Tramites:Address, sin Retry-After). En el backoffice, IDENTIDAD_NO_DISPONIBLE si no se pudo verificar
        la compañía.
      headers:
        Retry-After: { schema: { type: integer, example: 30 }, description: Segundos para reintentar (30). }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    CuerpoMuyGrande:
      description: >
        CUERPO_MUY_GRANDE. El cuerpo JSON de las rutas nuevas del saneamiento admite hasta 65536 bytes (64 KiB, CR-11). Se
        rechaza sin parsearlo, con Content-Length mayor o al pasar el tope si llega por trozos.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    ReporteDemasiadoGrande:
      description: >
        REPORTE_DEMASIADO_GRANDE. El conteo previo supera el máximo del formato (5 000 filas en Excel y 1 000 en PDF por defecto). No
        genera el archivo, no descifra nada y no escribe accesos_reporte. En B5/B6 el intento ya quedó en lecturas_backoffice (lo
        registra la empresa explícita antes del conteo); en R2/R3 y B2/B3 no queda fila.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorReporteDemasiadoGrande" } } }
    DemasiadasSolicitudes:
      description: >
        DEMASIADAS_SOLICITUDES (HU #14582, SP-5). Se superó el límite de solicitudes de la ruta: diagnostico-express (30/min por
        usuario) o diagnostico-confirmacion (10/min por usuario y 60/min por compañía), configurables en
        Diagnostico:LimitesSolicitudes. No se procesa nada.
      headers:
        Retry-After: { schema: { type: integer, example: 60 }, description: Segundos para reintentar. }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    ExportacionEnCurso:
      description: >
        EXPORTACION_EN_CURSO. El usuario ya tiene una exportación en curso, o el proceso ya tiene 4. No escribe accesos_reporte; en
        B5/B6 el intento ya quedó en lecturas_backoffice (lo registra la empresa explícita antes del freno). Al log va sin PII.
      headers:
        Retry-After: { schema: { type: integer, example: 10 }, description: Segundos para reintentar (10). }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    IdentidadNoDisponible:
      description: >
        IDENTIDAD_NO_DISPONIBLE (E3, B4–B6). No se pudo verificar con Identidad la compañía pedida; nunca se lee sin verificar. Si el
        servicio no tiene Identidad configurada, estas rutas no responden 503: decide la suscripción de la compañía, que falla
        cerrada (404 EMPRESA_NO_ENCONTRADA si no se puede confirmar).
      headers:
        Retry-After: { schema: { type: integer, example: 30 }, description: Segundos para reintentar (30). }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
    IdentidadListaNoDisponible:
      description: >
        Vistas globales (E2, B1–B3): sin la lista de compañías con Diagnóstico activo de Identidad no se lee nada, ni con una lista
        vacía que parezca real. `code` = IDENTIDAD_NO_CONFIGURADA: el servicio no tiene Diagnostico:Identidad:Address (sin
        Retry-After). `code` = IDENTIDAD_NO_DISPONIBLE: Identidad no respondió o rechazó al cliente de servicio (con Retry-After).
      headers:
        Retry-After: { schema: { type: integer, example: 30 }, description: "Segundos para reintentar (30); solo con IDENTIDAD_NO_DISPONIBLE." }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }

  parameters:
    UsuarioDiagnosticoId:
      name: usuario
      in: path
      required: true
      description: id de UsuarioDiagnostico (uuid).
      schema: { type: string, format: uuid }
    EmpresaUsuariosBackoffice:
      name: empresa
      in: path
      required: true
      description: id de la compañía (EmpresaUsuarios.id), con Diagnóstico activo.
      schema: { type: string, format: uuid }
    BusquedaUsuarios:
      name: busqueda
      in: query
      required: false
      description: Contiene, sin tildes ni mayúsculas, sobre nombre o correo; hasta 100 caracteres.
      schema: { type: string, maxLength: 100 }
    RolUsuarios:
      name: rol
      in: query
      required: false
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/RolDiagnostico" } }
    EstadoUsuarios:
      name: estado
      in: query
      required: false
      style: form
      explode: true
      schema: { type: array, items: { type: string, enum: [ACTIVO, INVITADO, SUSPENDIDO] } }
    PaginaUsuarios:
      name: pagina
      in: query
      required: false
      description: ">= 1; pagina x tamano <= 10000."
      schema: { type: integer, minimum: 1, default: 1 }
    TamanoUsuarios:
      name: tamano
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    SaneamientoId:
      name: sid
      in: path
      required: true
      description: Id del saneamiento; una ruta con un valor que no es uuid no existe (404, SP-6).
      schema: { type: string, format: uuid }
    RenglonId:
      name: rid
      in: path
      required: true
      description: Id del renglón, del mismo saneamiento y no quitado (404 si no, SP-6).
      schema: { type: string, format: uuid }
    EmpresaExplicitaSaneamiento:
      name: empresa
      in: query
      required: true
      description: Empresa explícita del backoffice (ADR-0073); los GET quedan auditados en lecturas_backoffice.
      schema: { type: string, format: uuid }
    DesdeReporte:
      name: desde
      in: query
      required: true
      description: Día inicial (AAAA-MM-DD, hora Colombia UTC−5, inclusive). Falta, 400 FILTRO_INVALIDO (campo desde).
      schema: { type: string, format: date }
    HastaReporte:
      name: hasta
      in: query
      required: true
      description: Día final (inclusive). Falta, 400 FILTRO_INVALIDO (campo hasta); hasta < desde, hasta > hoy o más de 366 días, 400 RANGO_INVALIDO.
      schema: { type: string, format: date }
    EmpresaReporte:
      name: empresa
      in: query
      required: true
      description: >
        Empresa explícita del backoffice (ADR-0073). Se valida contra las compañías con Diagnóstico activo antes de leer y de auditar
        (SP-3); los GET quedan auditados en lecturas_backoffice.
      schema: { type: string, format: uuid }
    TipoReporteCompania:
      name: tipo
      in: path
      required: true
      description: Tipo de reporte; otro valor, o consumo, responde 404 REPORTE_NO_ENCONTRADO.
      schema: { type: string, enum: [vehiculos, consultas, saneamientos, derivaciones] }
    TipoReporteBackoffice:
      name: tipo
      in: path
      required: true
      description: Tipo de reporte; otro valor responde 404 (REPORTE_NO_ENCONTRADO en B1–B3; sin cuerpo en B4–B6, ver TipoReporte).
      schema: { $ref: "#/components/schemas/TipoReporte" }
    ModalidadReporte:
      name: modalidad
      in: query
      description: Solo vehiculos. Un valor fuera de la lista, o repetido, 400 FILTRO_INVALIDO.
      schema: { type: string, enum: [EXPRESS, MASIVO] }
    TipoAnalisisReporte:
      name: tipo_analisis
      in: query
      description: Solo vehiculos.
      schema: { type: string, enum: [SIMPLE, CON_ANALISIS] }
    VeredictoReporte:
      name: veredicto
      in: query
      description: Solo vehiculos.
      schema: { type: string, enum: [VIABLE, BLOQUEADO, SIN_DICTAMEN] }
    FuenteReporte:
      name: fuente
      in: query
      description: Solo consultas; repetible.
      style: form
      explode: true
      schema: { type: array, items: { $ref: "#/components/schemas/Fuente" } }
    EstadoReporte:
      name: estado
      in: query
      description: >
        Repetible. consultas: PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA; saneamientos: SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE,
        ANULADO; derivaciones: PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO. Un valor que no es del tipo, 400 FILTRO_INVALIDO.
      style: form
      explode: true
      schema: { type: array, items: { type: string } }
    PlacaReporte:
      name: placa
      in: query
      description: >
        Prefijo de hasta 20 caracteres sobre el identificador normalizado (StartsWith). Vacío tras normalizar, 400 FILTRO_INVALIDO. En
        accesos_reporte se guarda como placa_filtrada, nunca su valor. No hay filtro documento ni nombre (400 FILTRO_INVALIDO, SP-9).
      schema: { type: string, maxLength: 20 }
    PaginaReporte:
      name: pagina
      in: query
      description: 1 o más; pagina × tamano hasta 10 000 (si no, 400 PAGINACION_INVALIDA).
      schema: { type: integer, minimum: 1, default: 1 }
    TamanoReporte:
      name: tamano
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  schemas:
    Sesion:
      type: object
      required: [usuario, empresa, roles, permisos, capacidades]
      properties:
        usuario:
          type: object
          required: [id, email, esSuperAdmin]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            esSuperAdmin:
              type: boolean
        empresa:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Claim tenant_id del token.
            nombre:
              type: string
              nullable: true
            tipo:
              type: string
              nullable: true
              description: Claim tenant_type (FLIT para la compañía FLIT).
        roles:
          type: array
          description: Códigos de rol del token (claim role_code).
          items:
            type: string
          example: [usuario_diagnostico]
        permisos:
          type: array
          description: Slugs diagnostico.* que tiene el usuario.
          items:
            type: string
          example: [diagnostico.diagnosticos.crear, diagnostico.diagnosticos.ver]
        capacidades:
          $ref: "#/components/schemas/Capacidades"

    Capacidades:
      type: object
      description: >
        Ayuda para armar el menú; cada endpoint vuelve a exigir su permiso. Backoffice (ajustes 2026-11-11, punto 1):
        backoffice, editarContrato y verAuditoria siguen la política de configuración (SuperAdmin de cualquier
        compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) junto con su permiso; backofficeOperacion,
        llenarConsultas y corregirDictamen, la de operación FLIT (el SuperAdmin de cualquier compañía, o compañía FLIT con
        el permiso); verVolumetria exige tenant_type=FLIT salvo al SuperAdmin. El SuperAdmin tiene todas las capacidades
        (decisión D23, HU #14563).
      required:
        - crearDiagnosticos
        - verDiagnosticos
        - descargarReportes
        - derivar
        - verConfiguracion
        - editarConfiguracion
        - reprocesarConsultas
        - backoffice
        - editarContrato
        - llenarConsultas
        - corregirDictamen
        - verAuditoria
        - verVolumetria
        - backofficeOperacion
        - gestionarUsuarios
      properties:
        crearDiagnosticos:
          type: boolean
        verDiagnosticos:
          type: boolean
        descargarReportes:
          type: boolean
        derivar:
          type: boolean
        verConfiguracion:
          type: boolean
        editarConfiguracion:
          type: boolean
        reprocesarConsultas:
          type: boolean
        backoffice:
          type: boolean
        editarContrato:
          type: boolean
        llenarConsultas:
          type: boolean
        corregirDictamen:
          type: boolean
        verAuditoria:
          type: boolean
        verVolumetria:
          type: boolean
        sanear:
          type: boolean
          description: HU #14576. diagnostico.saneamiento.solicitar (el SuperAdmin la tiene por la regla general, decisión E3). Opcional para el front.
        gestionarSaneamiento:
          type: boolean
          description: HU #14576. Política de operación FLIT y diagnostico.saneamiento.gestionar. Opcional para el front.
        verReportes:
          type: boolean
          description: >
            1.5.0 (ADR-0088). diagnostico.reportes.ver, la misma regla que /reportes* (el SuperAdmin la tiene por la regla general).
            Opcional para el front.
        verEstadisticasGlobales:
          type: boolean
          description: >
            1.5.0 (ADR-0088). Política de configuración del backoffice y diagnostico.volumetria.ver, la misma regla que
            /backoffice/estadisticas*. Una compañía cliente con los permisos armados a mano la tiene en false. Opcional para el front.
        gestionarUsuarios:
          type: boolean
          description: >
            HU #14587 (ADR-0089). diagnostico.usuarios.gestionar (solo admin_diagnostico) o SuperAdmin, la misma regla que /usuarios*.
        backofficeOperacion:
          type: boolean
          description: >
            Override del dictamen, versiones del dictamen y llenado manual del backoffice (política de operación FLIT). El
            SuperAdmin la tiene siempre (de cualquier compañía o sin tenant_type, decisión D23); un usuario de una compañía
            que no es FLIT, aunque tenga el permiso, tiene backofficeOperacion=false.

    ResumenEmpresaBackoffice:
      type: object
      required: [empresa, configuracion, diagnosticos, vehiculos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía indicada en ?empresa=.
        configuracion:
          type: boolean
          description: La compañía ya tiene fila en configuracion_empresa.
        diagnosticos:
          type: integer
          format: int32
          minimum: 0
        vehiculos:
          type: integer
          format: int32
          minimum: 0

    IntentosConsulta:
      type: object
      required: [consulta, intentos]
      properties:
        consulta:
          type: string
          format: uuid
        intentos:
          type: array
          items:
            $ref: "#/components/schemas/IntentoConsulta"

    IntentoConsulta:
      type: object
      required: [id, fuente, servicio, identificador, disparador, inicio, fin, estado, tipo_error, mensaje_error, transaccion_proveedor_id, desde_cache, usuario_id]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        servicio:
          type: string
          nullable: true
          enum: [VERIFIK, KYVERUM, INTEMPO, SMARTCLOUD, FASECOLDA, MERCADOLIBRE, BASEGRAVABLE, SCRAPING, FLITFINES, OTRO, null]
          description: Proveedor que respondió; null si no llegó a ninguno.
        identificador:
          type: string
          nullable: true
          maxLength: 17
          description: >
            Placa o VIN consultado; null si la consulta es por persona (nunca un documento). Las celdas de persona
            (HU #13792, #13794) dejan un intento por cada persona consultada.
        disparador:
          type: string
          enum: [AUTO, REPROCESO, MANUAL]
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        estado:
          type: string
          enum: [SUCCESS, ERROR]
        tipo_error:
          type: string
          nullable: true
          description: >
            Código del error (null si SUCCESS). Transitorios, que se reintentan con backoff 5 s × 2^(n−1) hasta
            Diagnostico:Consultas:MaxReintentos ∈ [0, 3] (por defecto 1): TIMEOUT, RED, HTTP_5XX, LIMITE_PROVEEDOR (el
            proveedor respondió 429). Definitivos: RESPUESTA_INVALIDA, AUTENTICACION (también credencial del proveedor
            rechazada, 401/403: error de configuración), ESTADO_NO_OK (también solicitud rechazada por el proveedor, 400/422),
            NO_CONECTADO y cualquier otro.
        mensaje_error:
          type: string
          nullable: true
        transaccion_proveedor_id:
          type: string
          nullable: true
        desde_cache:
          type: boolean
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Usuario del reproceso o del llenado manual; null si fue el procesador.

    Fuente:
      type: string
      enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    FuenteConfigurable:
      type: string
      description: Valor del enum Fuente salvo RUNT, que no se configura en el catálogo de fuentes obligatorias.
      enum: [RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    DefinicionFuentesObligatorias:
      type: object
      required: [familia, tipo_tramite_codigo, fuentes, tipo_tramite_etiqueta, familia_etiqueta]
      description: >
        Una definición del catálogo global. familia y tipo_tramite_codigo son excluyentes; la que no aplica es null.
        fuentes vacío con la definición presente es la lista vacía explícita. tipo_tramite_etiqueta y familia_etiqueta
        (punto 5, 2026-11-11) son los nombres que se muestran: el del tipo es el que publica Trámites y, si no responde o el
        tipo no está publicado, el respaldo del servicio; null cuando su código es null.
      properties:
        familia:
          type: string
          nullable: true
          example: TRASPASO
        tipo_tramite_codigo:
          type: string
          nullable: true
          example: TRASPASO_STANDARD
        fuentes:
          type: array
          items:
            $ref: "#/components/schemas/FuenteConfigurable"
        tipo_tramite_etiqueta:
          type: string
          nullable: true
          example: Traspaso
        familia_etiqueta:
          type: string
          nullable: true
          example: Traspaso
      example:
        familia: null
        tipo_tramite_codigo: TRASPASO_STANDARD
        fuentes: [SIMIT_PROPIETARIO]
        tipo_tramite_etiqueta: Traspaso
        familia_etiqueta: null

    ListaDefinicionesFuentesObligatorias:
      type: object
      required: [definiciones]
      properties:
        definiciones:
          type: array
          items:
            $ref: "#/components/schemas/DefinicionFuentesObligatorias"

    VisibilidadUsuario:
      type: string
      enum: [PROPIOS, EMPRESA]

    EstimadoConsultas:
      type: string
      enum: [NO_MOSTRAR, ANTES_DE_LANZAR, AL_FINALIZAR]

    FuentesDisponibles:
      type: array
      description: >
        Fuentes que hoy se pueden habilitar en el contrato y pedir en un diagnóstico (HU #13863, F09-C8), en el orden
        del enum Fuente. Se calcula con la misma regla del 422 FUENTE_NO_DISPONIBLE: la fuente tiene ejecutor y su
        adaptador no es el no conectado; para IMPUESTO_DEPARTAMENTAL además la bandera
        Diagnostico:Fuentes:ImpuestoDisponible en true y al menos un departamento soportado en la réplica
        departamentos_impuesto (Q5). No depende de la compañía: una fuente habilitada que dejó de estar disponible
        sigue en fuentes_habilitadas pero no aparece aquí (pedirla responde 422).
      items:
        $ref: "#/components/schemas/Fuente"
      example: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO]

    Configuracion:
      type: object
      required: [empresa, contrato, operacion, fuentes_disponibles]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía del token.
        contrato:
          type: object
          required: [solo_lectura, fuentes_habilitadas, limite_vehiculos_lote, actualizado_en]
          properties:
            solo_lectura:
              type: boolean
              description: Siempre true para la compañía; el contrato lo edita el backoffice FLIT.
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        operacion:
          type: object
          required: [visibilidad_usuario, fuentes_por_defecto, estimado_consultas, actualizado_por, actualizado_en]
          properties:
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              description: Subconjunto de contrato.fuentes_habilitadas.
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
            actualizado_por:
              type: string
              format: uuid
              nullable: true
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        fuentes_disponibles:
          $ref: "#/components/schemas/FuentesDisponibles"
      example:
        empresa: 3f1c2b9e-0d4a-4c1e-9a77-2b5d8e6f1a10
        contrato:
          solo_lectura: true
          fuentes_habilitadas: [RUNT, AVALUO, IMPUESTO_DEPARTAMENTAL]
          limite_vehiculos_lote: 500
          actualizado_en: "2026-10-22T14:00:00Z"
        operacion:
          visibilidad_usuario: EMPRESA
          fuentes_por_defecto: [RUNT]
          estimado_consultas: NO_MOSTRAR
          actualizado_por: null
          actualizado_en: null
        fuentes_disponibles: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO]

    EdicionOperativa:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        visibilidad_usuario:
          $ref: "#/components/schemas/VisibilidadUsuario"
        fuentes_por_defecto:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        estimado_consultas:
          $ref: "#/components/schemas/EstimadoConsultas"
      example:
        visibilidad_usuario: PROPIOS
        estimado_consultas: ANTES_DE_LANZAR

    EmpresaBackoffice:
      type: object
      description: Una empresa con Diagnóstico encendido, según Identidad (HU #13741).
      required: [id, nombre, nit]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        nit:
          type: string
          nullable: true
          description: NIT tal como lo tiene Identidad; null si no lo informa.
      example:
        id: 3f2a9c1e-0000-4000-8000-000000000001
        nombre: Empresa Ficticia SAS
        nit: "900000001"

    ContratoBackoffice:
      type: object
      required: [empresa, fuentes_habilitadas, limite_vehiculos_lote, redaccion_ia_suspendida, fuentes_por_defecto, actualizado_por, actualizado_en, fuentes_disponibles]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía de la ruta.
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
          description: Interruptor de emergencia de la redacción IA (R-2). Solo lo ve el backoffice.
        fuentes_por_defecto:
          type: array
          description: Solo lectura aquí (las edita el admin de la compañía); se recortan al reducir las habilitadas.
          items:
            $ref: "#/components/schemas/Fuente"
        actualizado_por:
          type: string
          format: uuid
          nullable: true
          description: Usuario del backoffice del último cambio contractual.
        actualizado_en:
          type: string
          format: date-time
          nullable: true
        fuentes_disponibles:
          $ref: "#/components/schemas/FuentesDisponibles"
      example:
        empresa: 3f1c2b9e-0d4a-4c1e-9a77-2b5d8e6f1a10
        fuentes_habilitadas: [RUNT, AVALUO]
        limite_vehiculos_lote: 500
        redaccion_ia_suspendida: false
        fuentes_por_defecto: [RUNT]
        actualizado_por: 7a0e5d3c-1b2f-4e8a-9c6d-5f4e3d2c1b0a
        actualizado_en: "2026-10-22T14:00:00Z"
        fuentes_disponibles: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO]

    EdicionContrato:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
      example:
        limite_vehiculos_lote: 200

    TiposTramite:
      type: object
      required: [tipos]
      properties:
        tipos:
          type: array
          items:
            $ref: "#/components/schemas/TipoTramite"

    TipoTramite:
      type: object
      required: [codigo, nombre, familia, fuentesObligatorias]
      properties:
        codigo:
          type: string
          description: Código estable del tipo en Trámites.
          example: TRASPASO_STANDARD
        nombre:
          type: string
          example: TRASPASO
        familia:
          type: string
          description: MATRICULAS, TRASPASO u OTROS.
          example: TRASPASO
        fuentesObligatorias:
          type: array
          description: >
            Fuentes que el tipo exige en el alcance. Sale del catálogo global de FLIT (ADR-0078): la cabecera del
            tipo, aunque no tenga líneas; si no hay cabecera de tipo, la de su familia; si tampoco, vacío. No llega
            vacío por defecto. Con la semilla, TRASPASO_STANDARD y TRASPASO_TRANSFERENCIA_DE_DOMINIO incluyen
            SIMIT_PROPIETARIO, y TRASPASO_UNILATERAL queda vacío. RUNT no forma parte de esta lista.
          items:
            $ref: "#/components/schemas/FuenteConfigurable"

    ModoDiagnostico:
      type: string
      enum: [SIMPLE, CON_ANALISIS]

    EstadoDiagnostico:
      type: string
      enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO]

    Alcance:
      type: object
      description: >
        Fuentes en sus tres grupos (R-24). por_vehiculo: RUNT, SIMIT_VEHICULO, AVALUO, IMPUESTO_DEPARTAMENTAL;
        por_propietario: RUNT_PROPIETARIO, SIMIT_PROPIETARIO; por_locatario: RUNT_LOCATARIO, SIMIT_LOCATARIO. Una fuente
        en un grupo que no es el suyo responde 422 FUENTE_EN_GRUPO_AJENO. RUNT siempre. Un grupo ausente equivale a vacío.
      properties:
        por_vehiculo:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_propietario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_locatario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"

    CabeceraEntrada:
      type: object
      required: [nombre, modo, alcance]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS (código de GET /tipos-tramite); se descarta con SIMPLE.
          example: TRASPASO_STANDARD
        alcance:
          $ref: "#/components/schemas/Alcance"
      example:
        nombre: Flota norte
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT, SIMIT_VEHICULO]
          por_propietario: [RUNT_PROPIETARIO]
          por_locatario: []

    Diagnostico:
      type: object
      required: [id, nombre, modo, tipo_tramite_codigo, es_express, estado, alcance, configuracion, usuario_creador_id, creado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        alcance:
          $ref: "#/components/schemas/Alcance"
        configuracion:
          type: object
          description: Copia inmutable de la configuración de la compañía al crear (sin redaccion_ia_suspendida).
          required: [fuentes_habilitadas, limite_vehiculos_lote, visibilidad_usuario, fuentes_por_defecto, estimado_consultas]
          properties:
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
        usuario_creador_id:
          type: string
          format: uuid
        creado_en:
          type: string
          format: date-time

    ResumenValidacion:
      type: object
      required: [total_filas, validos, erroneos, duplicados, puede_continuar, limite_vehiculos_lote, supera_limite, avisos, filas]
      properties:
        total_filas:
          type: integer
          description: Filas de datos no vacías del archivo.
        validos:
          type: integer
        erroneos:
          type: integer
        duplicados:
          type: integer
          description: Repeticiones de un identificador válido ya presente (consolidadas en su primera fila).
        puede_continuar:
          type: boolean
          description: false sin válidos o con más válidos que el límite por lote.
        limite_vehiculos_lote:
          type: integer
          description: Límite de la copia de configuración de la cabecera.
        supera_limite:
          type: boolean
        avisos:
          type: array
          items:
            $ref: "#/components/schemas/AvisoCarga"
        filas:
          type: array
          description: Una por fila leída, salvo los duplicados consolidados, en el orden del archivo.
          items:
            $ref: "#/components/schemas/FilaResumen"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración; en otro caso no viene.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    AvisoCarga:
      type: object
      required: [code, mensaje]
      properties:
        code:
          type: string
          enum: [SIN_VALIDOS, LIMITE_SUPERADO]
        mensaje:
          type: string

    FilaResumen:
      type: object
      description: >
        Una fila de la vista previa de la carga. El documento es el propietario actual declarado (HU #14582), leído de las
        cabeceras Tipo_Documento_Propietario y Documento_Propietario (o de su alias anterior); siempre enmascarado.
      required: [fila, identificador, identificador_norm, tipo_identificador, tipo_documento_propietario, documento_propietario, valida, filas_duplicadas, errores]
      properties:
        fila:
          type: integer
          description: Número de fila de la hoja o del CSV (el encabezado es la 1).
        identificador:
          type: string
          description: Tal como vino en el archivo.
        identificador_norm:
          type: string
          description: Normalizado con la regla de Trámites; si es demasiado largo, el valor limpio sin recortar.
        tipo_identificador:
          type: string
          nullable: true
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, PLACA_MOTOCARRO, VIN, null]
        tipo_documento_propietario:
          type: string
          nullable: true
          example: CC
        documento_propietario:
          type: string
          nullable: true
          description: Propietario actual declarado, siempre enmascarado.
          example: "****4050"
        valida:
          type: boolean
        filas_duplicadas:
          type: array
          items:
            type: integer
        errores:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFila"

    ErrorFila:
      type: object
      required: [campo, code, mensaje]
      properties:
        campo:
          type: string
          enum: [Identificador_Vehiculo, Tipo_Documento_Propietario, Documento_Propietario]
        code:
          type: string
          enum: [IDENTIFICADOR_REQUERIDO, IDENTIFICADOR_INVALIDO, IDENTIFICADOR_DEMASIADO_LARGO, TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO]
        mensaje:
          type: string

    EstimadoFuente:
      type: object
      description: >-
        Consultas previstas de una fuente del alcance (HU #13747). Lo usan el resumen de carga, la confirmación de
        vehículos, Express y la vista previa de Express. Las fuentes de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO,
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO) consultan una vez por persona, que antes de lanzar aún no se conocen: su
        número es un mínimo de uno por vehículo y llevan `minimo=true`, para rotularlo «al menos N» (HU #13796, Q7). Las de
        locatario cuentan 0 antes del RUNT: el locatario solo se conoce con el RUNT y el documento declarado es el propietario
        actual, que no alimenta consultas (HU #14582).
      required: [fuente, consultas, minimo]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        consultas:
          type: integer
        minimo:
          type: boolean
          description: >-
            true si `consultas` es un mínimo («al menos N»): fuente de persona con algún vehículo válido cuyas personas
            aún no se conocen. Siempre false en las fuentes del vehículo y en un lote sin vehículos válidos.
      example: { fuente: SIMIT_PROPIETARIO, consultas: 10, minimo: true }

    FilaCapturada:
      type: object
      description: >
        Una fila capturada (HU #13751). El documento del propietario actual es opcional (HU #14582); si viene, tipo y número
        juntos. Los nombres de locatario son un alias obsoleto: con el nombre nuevo y el alias a la vez responde 400
        CAMPOS_EXCLUYENTES.
      properties:
        fila:
          type: integer
          description: Número de fila del archivo (para el resumen de validar-filas).
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_propietario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_propietario:
          type: string
          nullable: true
          description: "@pii:high Número del documento del propietario actual; se guarda cifrado y nunca vuelve en claro."
        tipo_documento_locatario:
          type: string
          nullable: true
          deprecated: true
          description: Alias obsoleto de tipo_documento_propietario (se retira en 1.7.0).
        documento_locatario:
          type: string
          nullable: true
          deprecated: true
          description: "@pii:high Alias obsoleto de documento_propietario (se retira en 1.7.0)."

    FilasAValidar:
      type: object
      properties:
        filas:
          type: array
          items:
            $ref: "#/components/schemas/FilaCapturada"

    ConfirmacionVehiculos:
      type: object
      description: Multipart de POST /diagnosticos/{id}/vehiculos (HU #13751, «Reenviar el archivo»).
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: "@pii:high El MISMO .xlsx o .csv enviado a POST /diagnosticos/{id}/carga."
        correcciones:
          type: string
          description: >
            JSON (texto del campo del formulario) con una lista de CorreccionFila; vacío o ausente es sin correcciones.
            Ejemplo: [{"fila": 2, "identificador": "ABC123"}, {"fila": 5, "tipo_documento_propietario": "CC", "documento_propietario": "1020304050"}]

    CorreccionFila:
      type: object
      description: >
        Corrección de una fila del archivo (va dentro del JSON de `correcciones`). `fila` es el número de fila del análisis
        (encabezado en la fila 1). Un campo ausente conserva el valor del archivo; con null o vacío lo deja vacío. No envíe
        el documento enmascarado del análisis («****…»): es inválido y la fila se descarta; omita el campo para conservar
        el del archivo. El documento es el propietario actual (HU #14582); los nombres de locatario son un alias obsoleto y,
        junto con el nombre nuevo, responden 400 CAMPOS_EXCLUYENTES.
      required: [fila]
      properties:
        fila:
          type: integer
        identificador:
          type: string
          nullable: true
        tipo_documento_propietario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_propietario:
          type: string
          nullable: true
          description: "@pii:high Número completo del documento del propietario actual; se guarda cifrado y nunca vuelve en claro."
        tipo_documento_locatario:
          type: string
          nullable: true
          deprecated: true
          description: Alias obsoleto de tipo_documento_propietario (se retira en 1.7.0).
        documento_locatario:
          type: string
          nullable: true
          deprecated: true
          description: "@pii:high Alias obsoleto de documento_propietario (se retira en 1.7.0)."

    ResultadoConfirmacion:
      type: object
      required: [diagnostico_id, confirmados, invalidos, duplicados, limite_vehiculos_lote, vehiculos]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        confirmados:
          type: integer
        invalidos:
          type: integer
          description: Vehículos descartados por identificador o documento inválido.
        duplicados:
          type: integer
          description: Vehículos descartados por repetir un identificador válido anterior.
        limite_vehiculos_lote:
          type: integer
        vehiculos:
          type: array
          items:
            $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    VehiculoConfirmado:
      type: object
      description: Un vehículo guardado del lote. Sin ningún dato personal (HU #14582 SP-4).
      required: [id, orden, identificador, identificador_norm, tipo_identificador]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
        identificador_norm:
          type: string
        tipo_identificador:
          type: string
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, PLACA_MOTOCARRO, VIN]

    ExpressEntrada:
      type: object
      description: >
        Cuerpo de POST /express y POST /express/estimado (HU #13753): la cabecera como en CabeceraEntrada, pero con el
        nombre opcional, y el único vehículo con el documento del propietario actual opcional (tipo y número juntos; HU
        #14582). Los nombres de locatario son un alias obsoleto: con el nombre nuevo y el alias a la vez responde 400
        CAMPOS_EXCLUYENTES.
      required: [modo, alcance, identificador]
      properties:
        nombre:
          type: string
          nullable: true
          maxLength: 150
          description: Vacío o ausente se autogenera «Express IDENTIFICADOR» (sin fecha, HU #14087).
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS; se descarta con SIMPLE.
        alcance:
          $ref: "#/components/schemas/Alcance"
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_propietario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_propietario:
          type: string
          nullable: true
          description: "@pii:high Número del documento del propietario actual; se guarda cifrado y nunca vuelve en claro."
        tipo_documento_locatario:
          type: string
          nullable: true
          deprecated: true
          description: Alias obsoleto de tipo_documento_propietario (se retira en 1.7.0).
        documento_locatario:
          type: string
          nullable: true
          deprecated: true
          description: "@pii:high Alias obsoleto de documento_propietario (se retira en 1.7.0)."
      example:
        identificador: ABC123
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT]
          por_propietario: []
          por_locatario: []

    ExpressCreado:
      type: object
      required: [id, nombre, modo, es_express, estado, creado_en, vehiculo]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        creado_en:
          type: string
          format: date-time
        vehiculo:
          $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    EstimadoExpress:
      type: object
      required: [mostrar_estimado]
      properties:
        mostrar_estimado:
          type: boolean
          description: Verdadero con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de la compañía.
        estimado_consultas:
          type: array
          description: Solo cuando mostrar_estimado es verdadero.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    Grilla:
      type: object
      required: [id, nombre, estado, estado_etiqueta, version, desde, columnas, avance, vehiculos]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo de negocio del estado del lote (Sin lanzar, En proceso, Completado, Incompleto); el código sigue en estado.
          example: En proceso
        version:
          type: integer
          format: int64
          description: Versión actual del tablero; el cliente la manda como `desde` en el siguiente sondeo.
        desde:
          type: integer
          format: int64
          description: La versión pedida (eco).
        columnas:
          $ref: "#/components/schemas/Alcance"
        avance:
          $ref: "#/components/schemas/AvanceLote"
        vehiculos:
          type: array
          description: Solo los vehículos con celdas cambiadas desde `desde` (todos con desde=0), en el orden del lote. HU #14563: los conteos (`conteos`) se calculan siempre con todo el lote.
          items:
            $ref: "#/components/schemas/FilaVehiculo"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas=AL_FINALIZAR y el lote COMPLETADO o INCOMPLETO; si no, la clave no viene.
          items:
            $ref: "#/components/schemas/EstimadoVsConsumido"
        total_pegadas:
          type: integer
          minimum: 0
          description: >
            Ajuste 2026-11-11 (Punto 3). Grilla de la compañía (no la de backoffice): placas del lote con alguna consulta pegada
            (ERROR, o PENDIENTE/EN_CURSO sin cambio hace más de 10 min; con la RUNT sin completar cuenta solo la RUNT). Viene
            siempre, también en el sondeo incremental (una placa se pega sin que cambie ninguna celda). Es la N de
            «Reintentar pegadas (N)».
        vehiculos_pegados:
          type: array
          description: Punto 3. Ids de las placas pegadas (las de total_pegadas), en el orden del lote; siempre presente.
          items:
            type: string
            format: uuid
        conteos:
          $ref: "#/components/schemas/ConteosGrilla"
        lote:
          $ref: "#/components/schemas/LoteGrilla"

    ConteosGrilla:
      type: object
      description: >
        HU #14563 (B1). Grilla de la compañía. Conteos calculados siempre con todo el lote, también en el sondeo incremental
        (mismo criterio que total_pegadas). Opcional para los clientes actuales.
      required: [vehiculos, terminados, con_error, con_deuda, bloqueados, listos_tramite]
      properties:
        vehiculos: { type: integer, minimum: 0, description: Vehículos del lote. }
        terminados: { type: integer, minimum: 0, description: Vehículos con todas sus celdas en COMPLETADO o NA (R-7). }
        con_error: { type: integer, minimum: 0, description: Vehículos con al menos una celda en ERROR. }
        con_deuda: { type: integer, minimum: 0, description: Vehículos con deuda de impuesto confirmada (la misma definición que tiene_deuda del semáforo). }
        bloqueados: { type: integer, minimum: 0, description: Vehículos con dictamen vigente BLOQUEADO (0 en SIMPLE). }
        listos_tramite:
          type: integer
          minimum: 0
          description: Terminados, VIABLE si el modo exige dictamen, sin trámite y sin ítem de derivación vivo (regla de DerivacionFila.elegible).

    LoteGrilla:
      type: object
      description: HU #14563 (B2). Grilla de la compañía. Metadatos del lote; viaja siempre, con o sin desde. Opcional para los clientes actuales.
      required: [modo, tipo_tramite, creado_en, es_express, usuario_creador]
      properties:
        modo:
          type: string
          enum: [SIMPLE, CON_ANALISIS]
        tipo_tramite:
          allOf:
            - $ref: "#/components/schemas/TipoTramiteLote"
          nullable: true
          description: Null en SIMPLE. El nombre sale del catálogo de tipos de trámite; si el código ya no está publicado o el catálogo no responde, es el código.
        creado_en:
          type: string
          format: date-time
        es_express:
          type: boolean
        usuario_creador:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
              nullable: true
              description: Nombre visible que da Identidad (caché de 10 min); null si no responde o no conoce al usuario (la grilla sigue en 200).

    TipoTramiteLote:
      type: object
      description: HU #14563. Tipo de trámite del lote (código y nombre del catálogo; el código si ya no está publicado).
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
          example: TRASPASO_STANDARD
        nombre:
          type: string
          example: TRASPASO

    AvanceLote:
      type: object
      required: [vehiculos, terminados]
      properties:
        vehiculos:
          type: integer
          description: Vehículos del lote.
        terminados:
          type: integer
          description: Vehículos con todas sus celdas en COMPLETADO o NA (R-7).

    FilaVehiculo:
      type: object
      required: [id, orden, identificador, tipo_identificador, tipo_identificador_etiqueta, placa, vin, terminado, celdas, cambio_propietario]
      properties:
        saneamiento:
          $ref: "#/components/schemas/SaneamientoFila"
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
          description: Placa o VIN normalizado.
        tipo_identificador:
          type: string
          example: PLACA_CARRO
        tipo_identificador_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo del tipo de identificador (Placa de carro, Placa de moto, Placa de remolque, Placa de maquinaria, Placa de motocarro, VIN).
          example: Placa de carro
        placa:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        terminado:
          type: boolean
          description: Todas sus celdas (no solo las de esta respuesta) en COMPLETADO o NA.
        celdas:
          type: array
          description: Solo las celdas cambiadas desde `desde`, en el orden del alcance.
          items:
            $ref: "#/components/schemas/CeldaGrilla"
        cambio_propietario:
          type: boolean
          nullable: true
          description: >
            HU #14582. true si el propietario actual declarado no coincide con ningún propietario del RUNT; false si coincide
            con alguno; null sin declarado, sin celda RUNT cerrada, RUNT sin propietarios o tipo no homologable. Se calcula una
            vez al cerrar la celda RUNT y viaja también en el delta. Ningún documento acompaña al valor.
        pegada:
          type: boolean
          description: >
            Ajuste 2026-11-11 (Punto 3). Grilla de la compañía (no la de backoffice): la placa tiene alguna consulta que
            «Reintentar placa» reencolaría. Solo viaja en las filas de la respuesta; para las que no viajan, usar
            vehiculos_pegados del lote.
        veredicto:
          type: string
          nullable: true
          enum: [VIABLE, BLOQUEADO, null]
          description: >
            HU #14563 (B1). Grilla de la compañía. Veredicto del dictamen vigente; null si está pendiente o el lote es SIMPLE.
            Solo viaja en las filas de la respuesta.
        dictamen_ajustado:
          type: boolean
          description: >
            HU #14563 (B7, D6). true si el dictamen vigente es un ajuste de soporte FLIT (P1 = a); false sin dictamen, en SIMPLE
            o tras un recálculo automático (D7).
        version:
          type: integer
          format: int64
          minimum: 0
          description: >
            HU #14563 (B1, ADR-0086 D-1). Versión de fila: la versión del tablero en el último cambio de la fila (dictamen
            nuevo o ajustado, trámite creado, omitido o fallido); 0 = sin cambios de fila. Nunca supera `version` del lote.
        derivacion:
          allOf:
            - $ref: "#/components/schemas/DerivacionFila"
          nullable: true
          description: >
            Punto 4 (ADR-0084). Crear trámite de la fila; null con Diagnostico:Derivacion:Habilitada=false. Solo viaja en las
            filas de la respuesta (en el sondeo incremental, las que cambiaron celdas): tras crear el trámite, el cliente
            actualiza la fila con la respuesta del POST.

    DerivacionFila:
      type: object
      required: [elegible, motivo_no_elegible, estado, tramite]
      properties:
        elegible:
          type: boolean
          description: Se puede crear el trámite ahora (misma regla que revalida el POST).
        motivo_no_elegible:
          type: string
          nullable: true
          enum: [NO_TERMINADO, NO_VIABLE, YA_TIENE_TRAMITE, EN_CURSO, null]
          description: Null si es elegible. En orden de prioridad YA_TIENE_TRAMITE, EN_CURSO, NO_TERMINADO, NO_VIABLE.
        estado:
          type: string
          nullable: true
          enum: [PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO, null]
          description: Estado del último intento del vehículo; null si nunca se intentó. OMITIDO y FALLIDO no impiden volver a intentar.
        tramite:
          allOf:
            - $ref: "#/components/schemas/TramiteFila"
          nullable: true
          description: El borrador creado (Ver trámite #N); null si no hay.

    TramiteFila:
      type: object
      required: [id, numero, url]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: reference_number del trámite en Trámites.
          example: TR-000123
        url:
          type: string
          description: >
            Enlace al borrador en Trámites ({Diagnostico:Derivacion:UrlTramites}/tramites/{id}?t={empresa}); relativo
            (/tramites/{id}?t={empresa}) si no hay base configurada.

    CrearTramiteEntrada:
      type: object
      properties:
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio en lotes SIMPLE (código de GET /tipos-tramite); ignorado en CON_ANALISIS.
          example: TRASPASO_STANDARD

    CrearTramitesEntrada:
      type: object
      required: [vehiculo_ids]
      properties:
        vehiculo_ids:
          type: array
          minItems: 1
          maxItems: 5000
          description: Vehículos elegidos del lote, en el orden de la selección (Diagnostico:Derivacion:MaxItemsPorOperacion).
          items:
            type: string
            format: uuid
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio en lotes SIMPLE (código de GET /tipos-tramite); ignorado en CON_ANALISIS.
          example: TRASPASO_STANDARD

    OperacionEncolada:
      type: object
      required: [operacion_id, total, encolados, no_elegibles]
      properties:
        operacion_id:
          type: string
          format: uuid
        total:
          type: integer
          description: Vehículos de la operación (sin repetidos).
        encolados:
          type: integer
          description: Ítems PENDIENTE (los primeros, hasta el crédito de la compañía, ya salieron hacia Trámites).
        no_elegibles:
          type: array
          description: Vehículos que quedaron OMITIDO de inmediato.
          items:
            type: object
            required: [vehiculo_id, motivo_codigo]
            properties:
              vehiculo_id:
                type: string
                format: uuid
              motivo_codigo:
                type: string
                enum: [NO_TERMINADO, NO_VIABLE, YA_TIENE_TRAMITE, EN_CURSO]
      example:
        operacion_id: 0199f3a1-0000-7000-8000-0000000000a1
        total: 3
        encolados: 2
        no_elegibles:
          - { vehiculo_id: 0199f3a1-0000-7000-8000-0000000000b3, motivo_codigo: NO_VIABLE }

    ProgresoOperacion:
      type: object
      required: [operacion_id, tipo, estado, tipo_tramite_codigo, total, creadas, omitidas, fallidas, pendientes, creada_en, terminada_en]
      properties:
        operacion_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [INDIVIDUAL, MASIVA]
        estado:
          type: string
          enum: [EN_CURSO, TERMINADA]
        tipo_tramite_codigo:
          type: string
        total:
          type: integer
        creadas:
          type: integer
        omitidas:
          type: integer
        fallidas:
          type: integer
        pendientes:
          type: integer
          description: total − creadas − omitidas − fallidas (PENDIENTE y ENVIADO).
        creada_en:
          type: string
          format: date-time
        terminada_en:
          type: string
          format: date-time
          nullable: true

    DetalleOperacionDerivacion:
      allOf:
        - $ref: "#/components/schemas/ProgresoOperacion"
        - type: object
          required: [motivos, pagina, tamano_pagina, total_items, items]
          properties:
            motivos:
              type: array
              description: Ítems OMITIDO y FALLIDO por motivo (resumen «omitidas por motivo»), de más a menos.
              items:
                type: object
                required: [estado, motivo_codigo, motivo, cantidad]
                properties:
                  estado:
                    type: string
                    enum: [OMITIDO, FALLIDO]
                  motivo_codigo:
                    type: string
                  motivo:
                    type: string
                    description: Texto claro, sin datos personales.
                  cantidad:
                    type: integer
            pagina:
              type: integer
            tamano_pagina:
              type: integer
              example: 50
            total_items:
              type: integer
              description: Ítems que cumplen el filtro estado.
            items:
              type: array
              items:
                type: object
                required: [vehiculo_id, orden, placa, estado, motivo_codigo, motivo, tramite_id, tramite_numero, tramite_url]
                properties:
                  vehiculo_id:
                    type: string
                    format: uuid
                  orden:
                    type: integer
                  placa:
                    type: string
                    description: Placa (o VIN, o el identificador cargado).
                  estado:
                    type: string
                    enum: [PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO]
                  motivo_codigo:
                    type: string
                    nullable: true
                  motivo:
                    type: string
                    nullable: true
                  tramite_id:
                    type: string
                    format: uuid
                    nullable: true
                  tramite_numero:
                    type: string
                    nullable: true
                  tramite_url:
                    type: string
                    nullable: true
                    description: Igual que TramiteFila.url.

    ReintentoFallidas:
      type: object
      required: [reencolados, omitidas]
      properties:
        reencolados:
          type: integer
          description: FALLIDO que volvieron a PENDIENTE (el mismo ítem).
        omitidas:
          type: integer
          description: FALLIDO que ya no eran elegibles y quedaron OMITIDO.

    TramiteCreado:
      type: object
      required: [tramite_id, numero, url, ya_existia]
      properties:
        tramite_id:
          type: string
          format: uuid
        numero:
          type: string
          example: TR-000123
        url:
          type: string
          description: Igual que TramiteFila.url.
        ya_existia:
          type: boolean
          description: Trámites ya tenía el borrador de este vehículo (idempotencia por empresa y external_ref).

    ConflictoTramite:
      type: object
      required: [code, error, tramite_id, numero]
      properties:
        code:
          type: string
          example: YA_TIENE_TRAMITE
        error:
          type: string
        tramite_id:
          type: string
          format: uuid
        numero:
          type: string

    NoElegibleDerivacion:
      type: object
      required: [code, error, motivo_codigo, motivo]
      properties:
        code:
          type: string
          example: NO_ELEGIBLE
        error:
          type: string
          description: Igual a motivo.
        motivo_codigo:
          type: string
          example: OT_NO_HABILITADO
        motivo:
          type: string
          example: OT no habilitado para la compañía


    CeldaGrilla:
      type: object
      description: Sin origen, usuario manual, payload ni documentos (R-20).
      required: [id, fuente, estado, estado_etiqueta, motivo_na, motivo_na_etiqueta, tipo_error, dato_obtenido_en, reutilizada, version]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA]
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo del estado de la celda (Pendiente, En curso, Completado, Error, No aplica).
          example: No aplica
        motivo_na:
          type: string
          nullable: true
          description: "Solo con estado NA: SERVICIO_PUBLICO, DEPARTAMENTO_NO_SOPORTADO o SIN_DOCUMENTO_LOCATARIO."
        motivo_na_etiqueta:
          type: string
          nullable: true
          description: Punto 5 (2026-11-11). Texto de negocio del motivo de N/A; null cuando motivo_na es null.
          example: "El vehículo es de servicio público: esta consulta no aplica."
        tipo_error:
          type: string
          nullable: true
          description: >
            Solo con estado ERROR: código del tipo de error de la fuente o BLOQUEADA_POR_RUNT. En las celdas de persona
            (RUNT_PROPIETARIO, RUNT_LOCATARIO, HU #13792; SIMIT_PROPIETARIO, SIMIT_LOCATARIO, HU #13794), PERSONAS_CON_ERROR si falló al menos una persona y no todas por
            la misma causa (si fallan todas por la misma, esa causa); lo que sí respondió se conserva. En SIMIT_VEHICULO
            (HU #13793), SIN_PLACA si el vehículo no tiene placa tras el RUNT (definitivo, sin consulta ni consumo). En AVALUO
            (HU #13795), SIN_IDENTIFICADOR si no tiene placa ni VIN tras el RUNT (definitivo); un avalúo sin valor en ninguna
            fuente NO es error: la celda queda COMPLETADO con sin_valor_comercial=true y no se reprocesa.
          example: TIMEOUT
        dato_obtenido_en:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora del dato (D-10); en la reutilizada, la del dato original.
        reutilizada:
          type: boolean
          description: El dato se reutilizó de una consulta del mismo día de la compañía, sin consumo (D-10).
        tiene_deuda:
          type: boolean
          description: >
            Solo IMPUESTO_DEPARTAMENTAL en COMPLETADO cuando la fuente confirmó deuda, con o sin monto.
            Ausente si es false. El semáforo no se pinta en verde.
        version:
          type: integer
          format: int64
          description: Versión del tablero en el último cambio de la celda.

    EstimadoVsConsumido:
      type: object
      required: [fuente, estimadas, consumidas, minimo]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        estimadas:
          type: integer
          description: >-
            Estimado de la fuente (vehículos menos N/A previsibles, HU #13747). En las fuentes de persona, las personas
            registradas del rol en los vehículos del lote (personas_vehiculo, HU #13796).
        consumidas:
          type: integer
          description: >-
            Intentos con desde_cache=false, sin los de llenado manual. En las fuentes de persona hay un intento por
            persona (cada reintento real también consume).
        minimo:
          type: boolean
          description: >-
            true solo si la fuente es de persona y algún vehículo del lote no tiene personas registradas (lote anterior a
            D3 o RUNT sin respuesta): ese vehículo cuenta uno, y el estimado es «al menos N».
      example: { fuente: RUNT_PROPIETARIO, estimadas: 3, consumidas: 3, minimo: false }

    CierrePanel:
      type: object
      required: [id, estado, cerrado_en]
      properties:
        id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        cerrado_en:
          type: string
          format: date-time

    ReprocesoConsulta:
      type: object
      required: [id, diagnostico_id, estado, estado_lote, version]
      properties:
        id:
          type: string
          format: uuid
          description: Id de la celda.
        diagnostico_id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [PENDIENTE]
        estado_lote:
          $ref: "#/components/schemas/EstadoDiagnostico"
        version:
          type: integer
          format: int64
          description: version_tablero del lote tras el reproceso (la celda la lleva para el sondeo ?desde=).

    ReintentoPegadas:
      type: object
      required: [reencoladas]
      properties:
        reencoladas:
          type: integer
          minimum: 0
          description: Celdas que se reencolaron con un trabajo_id nuevo (0 si no había ninguna pegada).

    HistorialLote:
      type: object
      required: [diagnostico_id, estado, transiciones]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        transiciones:
          type: array
          items:
            $ref: "#/components/schemas/TransicionLote"

    TransicionLote:
      type: object
      required: [estado_anterior, estado_nuevo, disparador, usuario_id, en]
      properties:
        estado_anterior:
          type: string
          nullable: true
          description: Null en la creación del lote; si no, CREADO, EN_PROCESO, COMPLETADO o INCOMPLETO.
        estado_nuevo:
          $ref: "#/components/schemas/EstadoDiagnostico"
        disparador:
          type: string
          enum: [AUTO, CIERRE_PANEL, REPROCESO]
          description: El llenado manual (MANUAL) se presenta a la compañía como AUTO (HU #13798, Q5); el backoffice ve el real.
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Usuario que la provocó; null si fue el procesador o el llenado manual.
        en:
          type: string
          format: date-time

    ListaDiagnosticos:
      type: object
      description: Página de lotes de la compañía del token visibles para el usuario (HU #13845).
      required: [pagina, tamano, total, diagnosticos]
      properties:
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          description: Lotes visibles que cumplen los filtros (todas las páginas).
        diagnosticos:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoListado"
      example:
        pagina: 1
        tamano: 10
        total: 2
        diagnosticos:
          - id: 0199f3a1-2222-7000-8000-000000000002
            nombre: Flota octubre
            creado_en: "2026-10-22T14:00:00+00:00"
            modo: CON_ANALISIS
            tipo_tramite: { codigo: TRASPASO_STANDARD, nombre: TRASPASO }
            estado: EN_PROCESO
            usuario_creador: { id: 5f0c7a2e-1b2c-4d3e-8f90-0a1b2c3d4e5f, nombre: Ana Prueba }
            es_express: false
          - id: 0199f3a1-1111-7000-8000-000000000001
            nombre: Lote sin lanzar
            creado_en: "2026-10-21T13:00:00+00:00"
            modo: SIMPLE
            tipo_tramite: null
            estado: CREADO
            usuario_creador: { id: 6a1d8b3f-2c3d-4e5f-9a01-1b2c3d4e5f60, nombre: No disponible }
            es_express: false

    DiagnosticoListado:
      type: object
      required: [id, nombre, creado_en, modo, tipo_tramite, estado, estado_etiqueta, usuario_creador, es_express]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        creado_en:
          type: string
          format: date-time
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite:
          type: object
          nullable: true
          description: null en SIMPLE; el nombre es el código si el tipo ya no está publicado.
          required: [codigo, nombre]
          properties:
            codigo:
              type: string
            nombre:
              type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo de negocio del estado del lote (Sin lanzar, En proceso, Completado, Incompleto); el código sigue en estado.
          example: En proceso
        usuario_creador:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
              description: Nombre visible según Identidad; «No disponible» si no se pudo resolver.
        es_express:
          type: boolean
          description: HU #14087. true si el lote nació del Diagnóstico Express (columna «Modalidad»); false en el masivo.

    ListaDiagnosticosBackoffice:
      type: object
      description: Página de lotes de una compañía para el backoffice FLIT (HU #13799).
      required: [empresa, pagina, tamano, total, diagnosticos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía consultada (eco de ?empresa=).
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          description: Lotes que cumplen los filtros (todas las páginas).
        diagnosticos:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoBackoffice"
      example:
        empresa: 7b1f0c2e-6d1a-4c55-9a43-2f6f0d1b9e10
        pagina: 1
        tamano: 10
        total: 1
        diagnosticos:
          - { id: 0199f3a1-1111-7000-8000-000000000001, nombre: Lote octubre, estado: EN_PROCESO, estado_etiqueta: En proceso, creado_en: "2026-10-22T14:00:00+00:00", vehiculos: 2, celdas_en_error: 2 }

    DiagnosticoBackoffice:
      type: object
      required: [id, nombre, estado, estado_etiqueta, creado_en, vehiculos, celdas_en_error]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo de negocio del estado del lote (Sin lanzar, En proceso, Completado, Incompleto); el código sigue en estado.
          example: En proceso
        creado_en:
          type: string
          format: date-time
        vehiculos:
          type: integer
          description: Vehículos del lote.
        celdas_en_error:
          type: integer
          description: Celdas del lote en estado ERROR.
        modo:
          type: string
          enum: [SIMPLE, CON_ANALISIS]
          description: HU #14563 (B3).
        tipo_tramite:
          allOf:
            - $ref: "#/components/schemas/TipoTramiteLote"
          nullable: true
          description: HU #14563 (B3). Null en SIMPLE; nombre del catálogo (una llamada por página) o el código si no responde.
        es_express:
          type: boolean
          description: HU #14563 (B3).

    GrillaBackoffice:
      description: Grilla (schema Grilla) más la empresa consultada; las celdas llevan origen y usuario_manual_id (HU #13799).
      allOf:
        - $ref: "#/components/schemas/Grilla"
        - type: object
          required: [empresa, vehiculos]
          properties:
            empresa:
              type: string
              format: uuid
            vehiculos:
              type: array
              items:
                $ref: "#/components/schemas/FilaVehiculoBackoffice"

    FilaVehiculoBackoffice:
      description: FilaVehiculo (con cambio_propietario y sin documentos, HU #14582) con celdas del backoffice.
      allOf:
        - $ref: "#/components/schemas/FilaVehiculo"
        - type: object
          required: [celdas]
          properties:
            saneamiento:
              description: HU #14576 AC35. Reemplaza el saneamiento de FilaVehiculo en el backoffice, sin elegibilidad; null si no hay.
              allOf:
                - $ref: "#/components/schemas/SaneamientoFilaBackoffice"
            celdas:
              type: array
              items:
                $ref: "#/components/schemas/CeldaGrillaBackoffice"

    CeldaGrillaBackoffice:
      description: CeldaGrilla más el origen del dato y el usuario del llenado manual (solo backoffice, HU #13799).
      allOf:
        - $ref: "#/components/schemas/CeldaGrilla"
        - type: object
          required: [origen, usuario_manual_id]
          properties:
            origen:
              type: string
              nullable: true
              enum: [API, MANUAL]
              description: >
                API = consulta a la fuente (también la reutilizada del mismo día, que se distingue con reutilizada=true);
                MANUAL = llenado del backoffice; null mientras la celda no tiene dato.
            usuario_manual_id:
              type: string
              format: uuid
              nullable: true
              description: Usuario del backoffice que la llenó a mano; null si origen no es MANUAL.

    HistorialLoteBackoffice:
      type: object
      required: [diagnostico_id, estado, transiciones]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        transiciones:
          type: array
          items:
            $ref: "#/components/schemas/TransicionLoteBackoffice"

    TransicionLoteBackoffice:
      type: object
      description: Transición con el disparador y el usuario reales (HU #13799, Q5).
      required: [estado_anterior, estado_nuevo, disparador, usuario_id, en]
      properties:
        estado_anterior:
          type: string
          nullable: true
        estado_nuevo:
          $ref: "#/components/schemas/EstadoDiagnostico"
        disparador:
          type: string
          enum: [AUTO, CIERRE_PANEL, REPROCESO, MANUAL]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Null si fue el procesador (AUTO); MANUAL trae el usuario del backoffice.
        en:
          type: string
          format: date-time

    AlertaDictamen:
      type: object
      additionalProperties: false
      required: [codigo, texto, efecto, fuente, etiqueta, fuente_etiqueta]
      properties:
        codigo: { type: string }
        texto: { type: string }
        efecto: { type: string }
        fuente: { type: string }
        etiqueta:
          type: string
          description: >
            Punto 5 (2026-11-11). Rótulo de negocio de la regla (p. ej. «SOAT no vigente», «Multas del propietario»;
            FUENTE_PENDIENTE da «Consulta pendiente: nombre de la fuente»). Calculado al responder; un código sin rótulo
            da «Novedad sin clasificar», nunca el código.
          example: SOAT no vigente
        fuente_etiqueta:
          type: string
          description: Punto 5. Nombre de la fuente (RUNT, RUNT propietarios, SIMIT vehículo…); sin rótulo, «Novedad sin clasificar».
          example: RUNT

    DictamenVehiculo:
      type: object
      additionalProperties: false
      description: >
        Dictamen vigente que ve la compañía. Sin override, lease, intentos ni empresa. HU #14563 (D6, P1 = a): la marca
        ajustado_por_flit y ajustado_en; nunca el autor, el motivo, la versión anterior ni la marca ajuste por alertamiento.
        HU #14582: cambio_propietario del vehículo. 1.6.1: redaccion_en_cola.
      required: [version, veredicto, estado_redaccion, alertamientos, catalogo_version, creado_en, cambio_propietario, redaccion_en_cola]
      properties:
        version: { type: integer, minimum: 1 }
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        estado_redaccion: { type: string, enum: [PENDIENTE, COMPLETADA] }
        alertamientos:
          type: array
          items:
            $ref: "#/components/schemas/AlertaDictamen"
        catalogo_version: { type: integer }
        creado_en: { type: string, format: date-time }
        ajustado_por_flit:
          type: boolean
          description: >
            HU #14563. true si la vigente es un ajuste de soporte FLIT posterior al despliegue de B7 (ajuste_motivo no nulo;
            P1 = a). Un recálculo automático la deja en false (D7).
        ajustado_en:
          type: string
          format: date-time
          nullable: true
          description: HU #14563. Fecha del ajuste FLIT; null sin ajuste.
        cambio_propietario:
          type: boolean
          nullable: true
          description: HU #14582. El del vehículo (FilaVehiculo.cambio_propietario); sin documentos.
        redaccion_en_cola:
          type: boolean
          description: >
            Versión 1.6.1. true si la redacción del modelo de este dictamen sigue en cola (redacción encendida, PENDIENTE, con fecha
            de toma y sin agotar reintentos). false con COMPLETADA, con la redacción apagada o suspendida, o con los reintentos agotados.

    DictamenVehiculoBackoffice:
      type: object
      additionalProperties: false
      description: El de la compañía más los tres campos de override. Sin lease, intentos ni texto de cola.
      required: [version, veredicto, estado_redaccion, alertamientos, catalogo_version, creado_en, analisis_override, usuario_override_id, override_en, cambio_propietario, redaccion_en_cola]
      properties:
        version: { type: integer, minimum: 1 }
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        estado_redaccion: { type: string, enum: [PENDIENTE, COMPLETADA] }
        alertamientos:
          type: array
          items:
            $ref: "#/components/schemas/AlertaDictamen"
        catalogo_version: { type: integer }
        creado_en: { type: string, format: date-time }
        analisis_override: { type: boolean }
        usuario_override_id: { type: string, format: uuid, nullable: true }
        override_en: { type: string, format: date-time, nullable: true }
        cambio_propietario:
          type: boolean
          nullable: true
          description: HU #14582. El del vehículo (FilaVehiculo.cambio_propietario); sin documentos.
        redaccion_en_cola:
          type: boolean
          description: >
            Versión 1.6.1. true si la redacción del modelo de este dictamen sigue en cola (redacción encendida, PENDIENTE, con fecha
            de toma y sin agotar reintentos). false con COMPLETADA, con la redacción apagada o suspendida, o con los reintentos agotados.

    CuerpoOverrideDictamen:
      type: object
      additionalProperties: false
      description: >
        HU #14563 B7. Estado deseado del dictamen. motivo y version_esperada son obligatorios en todo PUT (D9; B-PR6 retiró
        el cuerpo legado, así que también el ajuste de solo veredicto lleva version_esperada). Una clave fuera de estas
        propiedades responde 422 VALOR_INVALIDO. confirmado se mantiene opcional por compatibilidad.
      required: [veredicto, motivo, version_esperada]
      properties:
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        motivo:
          type: string
          minLength: 10
          maxLength: 500
          description: >
            Motivo del ajuste (10 a 500 caracteres tras recortar). @pii:low: texto libre de soporte, solo backoffice; no se
            filtra (P3 = b) y nunca sale a la compañía, a eventos, a logs ni a mensajes de error.
        version_esperada:
          type: integer
          minimum: 1
          description: >
            Versión vigente que leyó soporte (obligatoria). Distinta de la vigente → 409 DICTAMEN_DESACTUALIZADO; ausente o
            null → 422 VERSION_ESPERADA_INVALIDA.
        alertamientos:
          type: array
          maxItems: 50
          description: Lista completa deseada (lo que no venga se elimina). Ausente = solo veredicto.
          items:
            $ref: "#/components/schemas/AlertamientoAjuste"
        confirmar_con_tramite:
          type: boolean
          description: Necesario (true) si el vehículo ya tiene trámite; sin él, 409 VEHICULO_CON_TRAMITE.
        confirmado: { type: boolean, description: Opcional. Si viene debe ser true; otro valor es 422 CONFIRMADO_REQUERIDO. }

    AlertamientoAjuste:
      type: object
      additionalProperties: false
      required: [codigo, texto, efecto, fuente]
      properties:
        codigo:
          type: string
          description: Código del catálogo de reglas, uno que ya estaba en la vigente, o AJUSTE_FLIT (redactado por soporte).
        texto:
          type: string
          minLength: 1
          maxLength: 500
          description: >
            Lo ve la compañía. El largo se cuenta en puntos de código, como el motivo. En AJUSTE_FLIT no admite 6 o más dígitos
            seguidos (422 ALERTAMIENTO_CON_DIGITOS).
        efecto: { type: string, enum: [BLOQUEA, ADVIERTE] }
        fuente: { type: string, description: "Código de fuente (RUNT, RUNT_PROPIETARIO, SIMIT_VEHICULO…)." }

    VersionesDictamen:
      type: object
      additionalProperties: false
      required: [versiones]
      properties:
        versiones:
          type: array
          items:
            $ref: "#/components/schemas/VersionDictamen"

    VersionDictamen:
      type: object
      additionalProperties: false
      required: [version, veredicto, vigente, alertamientos, eliminados, origen, usuario, motivo, en, superado_por_recalculo, ajuste_con_tramite]
      properties:
        version: { type: integer, minimum: 1 }
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        vigente: { type: boolean }
        alertamientos:
          type: array
          items:
            $ref: "#/components/schemas/AlertaVersionDictamen"
        eliminados:
          type: array
          description: Alertamientos de la versión anterior que ya no están (por código y fuente). Vacío en la versión 1.
          items:
            $ref: "#/components/schemas/AlertaVersionDictamen"
        origen: { type: string, enum: [AUTOMATICO, AJUSTE_FLIT] }
        usuario:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, nombre]
          description: Autor del ajuste; null en las automáticas.
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string, nullable: true, description: Resuelto por Identidad; null si no responde. }
        motivo: { type: string, nullable: true, description: "@pii:low. Motivo del ajuste; null en las automáticas y en overrides históricos." }
        en: { type: string, format: date-time, description: Instante del ajuste o de la emisión automática. }
        superado_por_recalculo: { type: boolean, description: "D7: la versión es un ajuste y la siguiente es automática." }
        ajuste_con_tramite:
          type: boolean
          description: >
            HU #14563 AC23 (aditivo, 1.3.0). True si el ajuste se confirmó con confirmar_con_tramite sobre un vehículo que ya
            tenía trámite (el trámite no se revierte ni se cancela). False en las automáticas y en los ajustes sin trámite.

    AlertaVersionDictamen:
      type: object
      additionalProperties: false
      required: [codigo, texto, efecto, fuente, ajuste, etiqueta]
      properties:
        codigo: { type: string }
        texto: { type: string }
        efecto: { type: string }
        fuente: { type: string }
        ajuste: { type: string, nullable: true, enum: [AGREGADO, EDITADO, null] }
        etiqueta: { type: string, description: Rótulo de la regla (el mismo de AlertaDictamen). }

    DetalleCelda:
      type: object
      description: >
        Detalle de una celda (HU #13798). DTO cerrado: sin origen, usuario manual, transacción ni payload en campos
        propios (R-20). Todas las claves van siempre. Desde HU #14087 AC8 (decisión del usuario 2026-10-27, enmienda de
        ADR-0075 en Propuesto) `respuesta_fuente` trae además la respuesta COMPLETA de la fuente, con datos personales.
      required: [id, vehiculo_id, fuente, estado, motivo_na, tipo_error, dato_obtenido_en, reutilizada, resultado, personas, respuesta_fuente, identificador, nombre_diagnostico, respuesta_proveedor]
      properties:
        id:
          type: string
          format: uuid
          description: Id de la celda (el mismo de la grilla).
        identificador:
          type: string
          description: >
            HU #14087 (detalle en pestaña nueva): la placa del vehículo; sin placa, su VIN (y sin ninguno, el identificador
            normalizado de la carga). Para que la página se titule sola.
        nombre_diagnostico:
          type: string
          description: HU #14087 (detalle en pestaña nueva) — nombre del diagnóstico (lote) al que pertenece el vehículo.
        vehiculo_id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA]
        motivo_na:
          type: string
          nullable: true
          description: "Solo con estado NA: SERVICIO_PUBLICO, DEPARTAMENTO_NO_SOPORTADO o SIN_DOCUMENTO_LOCATARIO."
        tipo_error:
          type: string
          nullable: true
          description: >
            Solo con estado ERROR; mismos códigos que CeldaGrilla.tipo_error. El impuesto añade NO_CONFIRMADO,
            MODELO_NO_ACEPTADO, DOCUMENTO_NO_COINCIDE, DOCUMENTO_NO_HOMOLOGADO, VEHICULO_NO_ENCONTRADO,
            VEHICULO_NO_CONSULTABLE, REQUIERE_ACTUALIZACION, SIN_DOCUMENTO, SIN_MODELO, ORGANISMO_INCOMPLETO
            y SIN_NOMBRE_PROPIETARIO.
        dato_parcial:
          type: boolean
          description: >
            Solo impuesto en ERROR cuando la fuente marcó dato parcial. El detalle lo rotula y no muestra el monto.
            Ausente cuando es false. No sale en PDF, Excel ni dictamen.
        auditoria:
          nullable: true
          description: >
            HU #14563 B5: auditoría saneada de la consulta. Excluye los intentos MANUAL (llenado de soporte) de la lista y de
            los agregados; `fin` es el del último intento no manual. Null si no hay intentos no manuales. Nunca trae
            servicio, transacción, mensaje de error, usuario, identificador ni persona.
          allOf:
            - $ref: "#/components/schemas/AuditoriaConsulta"
        dato_obtenido_en:
          type: string
          format: date-time
          nullable: true
        reutilizada:
          type: boolean
        resultado:
          nullable: true
          description: Solo en RUNT, SIMIT_VEHICULO, AVALUO e IMPUESTO_DEPARTAMENTAL con la celda COMPLETADO; el tipo depende de `fuente`.
          oneOf:
            - $ref: "#/components/schemas/ResultadoRuntDetalle"
            - $ref: "#/components/schemas/ResultadoSimitDetalle"
            - $ref: "#/components/schemas/ResultadoAvaluoDetalle"
            - $ref: "#/components/schemas/ResultadoImpuestoDetalle"
        personas:
          type: array
          nullable: true
          description: Solo en las fuentes de persona (null en las demás); una entrada por persona del rol, en orden.
          items:
            $ref: "#/components/schemas/PersonaDetalle"
        respuesta_fuente:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14087 AC8 — la respuesta COMPLETA de la fuente tal como la devolvió core-consultas: el `*Response` del rpc
            en proto-JSON, con los nombres de campo del .proto (snake_case) y los valores por defecto incluidos (false, 0,
            "" y listas vacías). Sin proyección: incluye datos personales (nombres, direcciones, teléfonos, documentos,
            histórico, acreedores, demandantes…) y lo que la fuente agregue. Solo en las fuentes del vehículo (RUNT,
            SIMIT_VEHICULO, AVALUO, IMPUESTO_DEPARTAMENTAL) con la celda COMPLETADO o ERROR; en las de persona va en cada
            `PersonaDetalle`. Null si no hay respuesta guardada (llenado manual, ERROR sin respuesta, celda anterior al
            AC8) o si no se pudo descifrar.
        respuesta_proveedor:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14183 — misma semántica que `PersonaDetalle.respuesta_proveedor`: el texto de
            `respuesta_fuente.resultado.respuesta_cruda.json` parseado como objeto JSON. Solo se llena en SIMIT_VEHICULO.
            En las celdas de persona el crudo sigue en `personas[].respuesta_proveedor`. Null si no hay crudo (llenado
            manual, consulta sin `incluir_respuesta_cruda`, otra fuente del vehículo), si no es JSON válido o si no es
            un objeto (se registra en el log sin el contenido).

    PersonaDetalle:
      type: object
      description: >
        Una persona de una celda de persona. El documento va enmascarado en `documento_enmascarado`; desde HU #14087 AC8
        `respuesta_fuente` trae la respuesta completa de la fuente para esa persona (con nombre, documento y lo que la
        fuente responda).
      required: [orden, rol, tipo_documento, documento_enmascarado, declarado_por_cliente, consulta, estado, tipo_error, consultado_en, resultado, respuesta_fuente, respuesta_proveedor]
      properties:
        orden:
          type: integer
          description: Posición dentro del rol, desde 1.
        rol:
          type: string
          enum: [PROPIETARIO, LOCATARIO]
        tipo_documento:
          type: string
          example: C
        documento_enmascarado:
          type: string
          description: "`****` más los cuatro últimos caracteres alfanuméricos; solo `****` si el documento tiene cuatro o menos."
          example: "****5678"
        declarado_por_cliente:
          type: boolean
          description: El documento lo declaró el cliente en la captura (locatario declarado), no el RUNT.
        consulta:
          type: string
          nullable: true
          enum: [RUNT_PERSONA, RUES, SIMIT]
          description: Qué se consultó para esta persona (RUES si es NIT, decisión Q2); null sin resultado.
        estado:
          type: string
          enum: [OK, ERROR, SIN_RESULTADO]
          description: SIN_RESULTADO si la celda aún no tiene dato de esta persona (pendiente, en curso o N/A).
        tipo_error:
          type: string
          nullable: true
        consultado_en:
          type: string
          format: date-time
          nullable: true
        resultado:
          nullable: true
          description: Solo con estado OK; RUNT_PERSONA, RUES o SIMIT según `consulta`.
          oneOf:
            - $ref: "#/components/schemas/ResultadoRuntPersonaDetalle"
            - $ref: "#/components/schemas/ResultadoRuesDetalle"
            - $ref: "#/components/schemas/ResultadoSimitDetalle"
        respuesta_fuente:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14087 AC8 — la respuesta COMPLETA de la fuente para esta persona (el `*Response` del rpc en proto-JSON, nombres
            del .proto en snake_case y valores por defecto incluidos), con datos personales. Null si la persona no tiene
            respuesta guardada (llenado manual, error sin respuesta, celda anterior al AC8) o no se pudo descifrar.
        respuesta_proveedor:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14153 (decisión del usuario 2026-10-28) — la respuesta ÍNTEGRA del proveedor para esta persona: el texto de
            `respuesta_fuente.resultado.respuesta_cruda.json` parseado como objeto JSON, tal cual lo devolvió el proveedor
            (Kyverum/Verifik conductor en RUNT_PERSONA, Verifik en RUES, Verifik SIMIT en SIMIT_PROPIETARIO y
            SIMIT_LOCATARIO), sin quitar ningún dato: identificadores internos,
            firma y campos técnicos incluidos. Objeto libre (su forma es la del proveedor). Incluye datos personales (licencias de
            conducción, representantes legales). Null si no hay respuesta cruda guardada (consulta anterior a la HU, llenado
            manual, error, otras fuentes), si no es JSON válido o si no es un objeto (se registra en el log sin el contenido).

    ResultadoRuntDetalle:
      type: object
      required: [placa, vin, servicio, clase, organismo, propietarios, locatarios]
      properties:
        placa: { type: string, nullable: true }
        vin: { type: string, nullable: true }
        servicio: { type: string, nullable: true, description: "Servicio del vehículo (PARTICULAR, PUBLICO...), no el proveedor." }
        clase: { type: string, nullable: true }
        organismo: { type: string, nullable: true }
        propietarios:
          type: array
          items:
            type: object
            required: [tipo_documento, tipo_propiedad]
            properties:
              tipo_documento: { type: string, nullable: true }
              tipo_propiedad: { type: string, nullable: true }
        locatarios: { type: integer }

    ResultadoSimitDetalle:
      type: object
      required: [semaforo, cantidad_comparendos, comparendos, comparendos_truncados]
      properties:
        semaforo: { type: string, nullable: true, enum: [VERDE, AMARILLO, ROJO] }
        cantidad_comparendos: { type: integer, description: "Total de comparendos (aunque la lista se corte)." }
        comparendos:
          type: array
          maxItems: 100
          items:
            type: object
            required: [numero, fecha, valor, estado, organismo]
            properties:
              numero: { type: string, nullable: true }
              fecha: { type: string, nullable: true, example: "2026-01-02" }
              valor: { type: string, nullable: true, description: "Texto decimal en pesos.", example: "500000" }
              estado: { type: string, nullable: true }
              organismo: { type: string, nullable: true }
        comparendos_truncados: { type: boolean, description: "true si había más de 100 comparendos." }
        total_general: { type: string, nullable: true, description: "HU #14563 B4. Texto decimal en pesos. Se omite si la fuente no lo informó (nunca 0 inferido)." }
        total_por_pagar: { type: string, nullable: true, description: "HU #14563 B4. Se omite si la fuente no lo informó (nunca 0 inferido)." }
        paz_y_salvo: { type: boolean, nullable: true, description: "HU #14563 B4. Solo si la fuente lo afirma; nunca se deduce de 0 comparendos. Se omite si no vino." }
        suspendida: { type: boolean, nullable: true, description: "HU #14563 B4. Se omite si la fuente no lo informó." }
        cancelada: { type: boolean, nullable: true, description: "HU #14563 B4. Se omite si la fuente no lo informó." }
        multas:
          type: array
          nullable: true
          description: "HU #14563 B4. Multas del SIMIT, sin el infractor. Se omite si la fuente no trae."
          items: { $ref: "#/components/schemas/MultaSimit" }
        acuerdos_pago:
          type: array
          nullable: true
          description: "HU #14563 B4. Acuerdos de pago, sin el infractor. Se omite si la fuente no trae."
          items: { $ref: "#/components/schemas/AcuerdoPagoSimit" }
        resoluciones:
          type: array
          nullable: true
          description: "HU #14563 B4. Resoluciones, sin el infractor. Se omite (null) si la fuente no las informó; lista vacía si la fuente informó que no hay."
          items: { $ref: "#/components/schemas/ResolucionSimit" }
        cantidad_resoluciones: { type: integer, nullable: true, description: "HU #14563 B4. Se omite (null, no 0) si la fuente no informó resoluciones." }

    AuditoriaConsulta:
      type: object
      description: "HU #14563 B5. Auditoría de la consulta visible a la compañía."
      required: [inicio, fin, duracion_ms, intentos, intentos_detalle]
      properties:
        inicio: { type: string, format: date-time, description: "Inicio del primer intento no manual." }
        fin: { type: string, format: date-time, description: "Fin del último intento no manual." }
        duracion_ms: { type: integer, format: int64 }
        intentos: { type: integer, description: "Cantidad de intentos no manuales." }
        intentos_detalle:
          type: array
          items: { $ref: "#/components/schemas/IntentoConsultaCliente" }

    IntentoConsultaCliente:
      type: object
      description: "HU #14563 B5. Un intento no manual, sin datos internos."
      required: [n, inicio, fin, duracion_ms, resultado, disparador, desde_cache]
      properties:
        n: { type: integer, description: "Orden del intento, desde 1." }
        inicio: { type: string, format: date-time }
        fin: { type: string, format: date-time }
        duracion_ms: { type: integer, format: int64 }
        resultado: { type: string, enum: [EXITOSO, ERROR] }
        disparador: { type: string, enum: [AUTOMATICO, REPROCESO] }
        desde_cache: { type: boolean }
        tipo_error:
          type: string
          nullable: true
          example: TIMEOUT
          description: "D15. Solo en ERROR: el mismo código de negocio que la grilla expone en la celda; nunca el mensaje técnico. null si el intento fue exitoso."

    MultaSimit:
      type: object
      description: "HU #14563 B4. Una multa del SIMIT. Sin nombre ni documento del infractor."
      properties:
        numero: { type: string, nullable: true }
        fecha: { type: string, nullable: true }
        valor: { type: string, nullable: true, description: "Texto decimal en pesos." }
        valor_pagar: { type: string, nullable: true }
        estado_cartera: { type: string, nullable: true }
        organismo: { type: string, nullable: true }
        codigos: { type: string, nullable: true, description: "Códigos de infracción unidos por coma (compatibilidad)." }
        infracciones:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/InfraccionSimit" }

    InfraccionSimit:
      type: object
      description: "HU #14563 B4. Infracción de una multa."
      properties:
        codigo: { type: string, nullable: true, example: C24 }
        descripcion: { type: string, nullable: true, description: "null si la fuente no la trae." }

    AcuerdoPagoSimit:
      type: object
      description: "HU #14563 B4. Acuerdo de pago del SIMIT, sin el infractor."
      properties:
        estado: { type: string, nullable: true }
        cuotas_abonadas: { type: string, nullable: true }
        cuotas_pendientes: { type: string, nullable: true }
        pendiente: { type: string, nullable: true }
        fecha: { type: string, nullable: true }
        organismo: { type: string, nullable: true }

    ResolucionSimit:
      type: object
      description: "HU #14563 B4. Resolución del SIMIT, sin el infractor."
      properties:
        numero: { type: string, nullable: true }
        fecha: { type: string, nullable: true }
        estado: { type: string, nullable: true }
        valor: { type: string, nullable: true, description: "Texto decimal en pesos." }
        organismo: { type: string, nullable: true }

    ResultadoAvaluoDetalle:
      type: object
      required: [sin_valor_comercial, valor_sugerido, fuente_principal, fuentes]
      properties:
        sin_valor_comercial: { type: boolean, description: "Ninguna fuente con valor: mostrar «sin valor comercial» (Q4 = b)." }
        valor_sugerido: { type: integer, format: int64, nullable: true, description: "Pesos colombianos." }
        fuente_principal: { type: string, nullable: true, enum: [fasecolda, mercado_libre, base_gravable] }
        fuentes:
          type: array
          items:
            type: object
            required: [fuente, estado, valor, muestras, fecha]
            properties:
              fuente: { type: string, nullable: true, example: fasecolda }
              estado: { type: string, nullable: true, enum: [OK, SIN_DATOS, ERROR] }
              valor: { type: integer, format: int64, nullable: true }
              muestras: { type: integer, nullable: true }
              fecha: { type: string, nullable: true, example: "2026-10-22" }

    ResultadoImpuestoDetalle:
      type: object
      description: >
        Impuesto vehicular departamental. `tiene_deuda` confirma la deuda. `monto_total` es null y se omite cuando el
        servicio no informó valor: la pantalla, el PDF y el Excel dicen «Deuda sin valor informado», nunca `$ 0`.
        Sin deuda no trae fechas ni valores que no vinieron. Sin proveedor, transacción, origen ni departamento (R-20).
      required: [tiene_deuda, vigencias]
      properties:
        tiene_deuda: { type: boolean, description: "true si la fuente confirmó deuda, también sin monto." }
        monto_total:
          type: integer
          format: int64
          nullable: true
          description: "Total adeudado en pesos. Ausente o null si no se informó (no es 0)."
          example: 350000
        intereses_mora: { type: integer, format: int64, nullable: true }
        sanciones: { type: integer, format: int64, nullable: true }
        avaluo_comercial: { type: integer, format: int64, nullable: true }
        ultimo_pago: { $ref: "#/components/schemas/UltimoPagoImpuestoDetalle" }
        liquidacion_consolidada_id: { type: string, nullable: true }
        periodo_certificacion: { type: string, nullable: true }
        fecha_consulta: { type: string, nullable: true }
        vigencias:
          type: array
          description: Por año ascendente; vacía si no registra vigencias.
          items:
            $ref: "#/components/schemas/VigenciaImpuestoDetalle"
      example:
        tiene_deuda: true
        monto_total: 350000
        vigencias:
          - { anio: 2025, valor: 180000, pagada: true }
          - { anio: 2026, valor: 350000, pagada: false }

    UltimoPagoImpuestoDetalle:
      type: object
      properties:
        anio: { type: integer, nullable: true }
        valor: { type: integer, format: int64, nullable: true }
        fecha: { type: string, nullable: true }

    VigenciaImpuestoDetalle:
      type: object
      required: [anio, valor, pagada]
      properties:
        anio: { type: integer, example: 2026 }
        valor: { type: integer, format: int64, description: "Pesos colombianos.", example: 350000 }
        pagada: { type: boolean }

    ResultadoRuntPersonaDetalle:
      type: object
      required: [inscrito, estado_conductor, licencias]
      properties:
        inscrito: { type: boolean }
        estado_conductor: { type: string, nullable: true }
        licencias:
          type: array
          items:
            type: object
            required: [categoria, estado, vigente_hasta]
            properties:
              categoria: { type: string, nullable: true }
              estado: { type: string, nullable: true }
              vigente_hasta: { type: string, nullable: true }

    ResultadoRuesDetalle:
      type: object
      required: [encontrada, estado_matricula, ultima_renovacion]
      properties:
        encontrada: { type: boolean }
        estado_matricula: { type: string, nullable: true }
        ultima_renovacion: { type: string, nullable: true }

    FormularioLlenadoManual:
      type: object
      description: Formulario del llenado manual (HU #13800). Todas las claves van siempre.
      required: [id, diagnostico_id, vehiculo_id, fuente, estado, tipo_error, version, admite_manual, motivo, personas, referencia]
      properties:
        id: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        vehiculo_id: { type: string, format: uuid }
        fuente: { type: string, enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL] }
        estado: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA] }
        tipo_error: { type: string, nullable: true }
        version: { type: integer, format: int64, description: "Versión de la celda; va en el cuerpo del PUT." }
        admite_manual: { type: boolean }
        motivo: { type: string, nullable: true, enum: [FUENTE_NO_ADMITE_MANUAL, CELDA_NO_EN_ERROR, CELDA_BLOQUEADA_POR_RUNT, SIN_PERSONAS_EN_ERROR, null] }
        personas:
          type: array
          nullable: true
          description: Solo en fuentes de persona (null en las del vehículo); solo las personas en ERROR, por orden.
          items:
            $ref: "#/components/schemas/PersonaEnErrorManual"
        referencia:
          type: object
          nullable: true
          description: >
            HU #14563 B6 + hallazgo M1 de seguridad (R-20, opción a). Referencia Fasecolda del avalúo llenado a mano con ella;
            null en cualquier otro caso. Solo la ve el backoffice: el detalle de la compañía, su PDF y el contenido del reporte no
            la traen, porque revelaría el llenado manual.
          required: [codigo_fasecolda, marca, linea, modelo]
          properties:
            codigo_fasecolda: { type: string, nullable: true, pattern: "^[0-9]{8}$", example: "01601234" }
            marca: { type: string, nullable: true }
            linea: { type: string, nullable: true }
            modelo: { type: integer, nullable: true, example: 2020 }

    PersonaEnErrorManual:
      type: object
      required: [persona_id, orden, rol, tipo_documento, documento_enmascarado, declarado_por_cliente, consulta, tipo_error]
      properties:
        persona_id: { type: string, format: uuid, description: "Va en personas[].persona_id del PUT." }
        orden: { type: integer }
        rol: { type: string, enum: [PROPIETARIO, LOCATARIO] }
        tipo_documento: { type: string }
        documento_enmascarado: { type: string, example: "****0102" }
        declarado_por_cliente: { type: boolean }
        consulta: { type: string, enum: [RUNT_PERSONA, RUES, SIMIT], description: "Define el esquema del resultado de esa persona." }
        tipo_error: { type: string, nullable: true }

    LlenadoManualVehiculo:
      type: object
      description: Cuerpo para SIMIT_VEHICULO (resultado ResultadoManualSimit) y AVALUO (resultado ResultadoManualAvaluo).
      additionalProperties: false
      required: [version, resultado]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        resultado:
          oneOf:
            - $ref: "#/components/schemas/ResultadoManualSimit"
            - $ref: "#/components/schemas/ResultadoManualAvaluo"

    LlenadoManualPersonas:
      type: object
      description: Cuerpo para las fuentes de persona; todas las personas en ERROR de la celda y solo ellas, sin repetir.
      additionalProperties: false
      required: [version, personas]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        personas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [persona_id, resultado]
            properties:
              persona_id: { type: string, format: uuid }
              resultado:
                oneOf:
                  - $ref: "#/components/schemas/ResultadoManualRuntPersona"
                  - $ref: "#/components/schemas/ResultadoManualRues"
                  - $ref: "#/components/schemas/ResultadoManualSimit"

    ResultadoManualSimit:
      type: object
      description: >
        SIMIT (del vehículo o consulta SIMIT de una persona). `cantidad_comparendos`, si viene, debe ser igual al número de
        comparendos; sin él se calcula. Números de comparendo sin repetir.
      additionalProperties: false
      required: [comparendos]
      properties:
        semaforo: { type: string, nullable: true, enum: [VERDE, AMARILLO, ROJO, null] }
        cantidad_comparendos: { type: integer, minimum: 0 }
        comparendos:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [numero]
            properties:
              numero: { type: string, maxLength: 60 }
              fecha: { type: string, format: date, nullable: true }
              valor: { type: string, nullable: true, pattern: '^\d{1,15}(\.\d{1,2})?$', description: "Texto decimal en pesos.", example: "468500" }
              estado: { type: string, nullable: true, maxLength: 60 }
              organismo: { type: string, nullable: true, maxLength: 120 }

    ResultadoManualAvaluo:
      type: object
      description: >
        AVALUO. Con `sin_valor_comercial=false`, `valor_sugerido` (mayor que 0) y `fuente_principal` (una fuente enviada con
        estado OK) son obligatorios; con `true` no van y ninguna fuente puede estar en OK. `valor` solo (y obligatorio) en
        fuentes OK. Sin `fecha`: la pone el servidor (día de hoy en Colombia). HU #14563 B6: `referencia` opcional (aditiva).
        Con ella `sin_valor_comercial` va en false, `valor_sugerido` (entero mayor que 0) es obligatorio y entra en `fuentes` como
        `fasecolda` OK (si ya viene `fasecolda`, en OK y con el mismo valor) y `fuente_principal` es `fasecolda` (si se envía, debe
        ser `fasecolda`). No se valida que el código exista en Fasecolda.
      additionalProperties: false
      required: [sin_valor_comercial, fuentes]
      properties:
        sin_valor_comercial: { type: boolean }
        valor_sugerido: { type: integer, format: int64, minimum: 1, nullable: true }
        fuente_principal: { type: string, nullable: true, enum: [fasecolda, mercado_libre, base_gravable, null] }
        fuentes:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [fuente, estado]
            properties:
              fuente: { type: string, enum: [fasecolda, mercado_libre, base_gravable] }
              estado: { type: string, enum: [OK, SIN_DATOS, ERROR] }
              valor: { type: integer, format: int64, minimum: 1, nullable: true }
              muestras: { type: integer, minimum: 1, nullable: true }
        referencia:
          type: object
          nullable: true
          additionalProperties: false
          required: [codigo_fasecolda, modelo]
          description: "HU #14563 B6. Referencia Fasecolda; un campo desconocido responde 422 con su ruta en `campo`."
          properties:
            codigo_fasecolda: { type: string, pattern: "^[0-9]{8}$", example: "01601234", description: "Texto de 8 dígitos." }
            marca: { type: string, nullable: true, maxLength: 120 }
            linea: { type: string, nullable: true, maxLength: 120 }
            modelo: { type: integer, minimum: 1950, description: "Año del modelo, hasta el año actual (Colombia) + 1.", example: 2020 }

    ResultadoManualRuntPersona:
      type: object
      description: RUNT de una persona natural (consulta RUNT_PERSONA).
      additionalProperties: false
      required: [inscrito, licencias]
      properties:
        inscrito: { type: boolean }
        estado_conductor: { type: string, nullable: true, maxLength: 60 }
        licencias:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [categoria]
            properties:
              categoria: { type: string, maxLength: 10 }
              estado: { type: string, nullable: true, maxLength: 60 }
              vigente_hasta: { type: string, format: date, nullable: true }

    ResultadoManualRues:
      type: object
      description: RUES de una persona jurídica (consulta RUES).
      additionalProperties: false
      required: [encontrada]
      properties:
        encontrada: { type: boolean }
        estado_matricula: { type: string, nullable: true, maxLength: 60 }
        ultima_renovacion: { type: string, nullable: true, description: "AAAA-MM-DD o el año AAAA.", example: "2026-03-31" }

    LlenadoManualRespuesta:
      type: object
      required: [id, diagnostico_id, vehiculo_id, fuente, estado, origen, usuario_manual_id, dato_obtenido_en, version, estado_lote]
      properties:
        id: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        vehiculo_id: { type: string, format: uuid }
        fuente: { type: string }
        estado: { type: string, enum: [COMPLETADO] }
        origen: { type: string, enum: [MANUAL] }
        usuario_manual_id: { type: string, format: uuid }
        dato_obtenido_en: { type: string, format: date-time }
        version: { type: integer, format: int64, description: "Nueva versión del tablero (la de la celda)." }
        estado_lote: { type: string, enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO] }

    SolicitudEvidencia:
      type: object
      description: Pedido de una evidencia en segundo plano (HU #13850). Hoy solo el ZIP de los PDF del lote.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [ZIP]
    EstadoEvidencia:
      type: object
      description: >
        Estado del ZIP del lote (HU #13850). vehiculos_incluidos = vehículos con su PDF (los esperados mientras está en la cola, los
        del archivo cuando está LISTA); vehiculos_pendientes = los que quedan fuera por no haber terminado (van en el índice).
      required: [id, tipo, estado, vehiculos_incluidos, vehiculos_pendientes, creado_en, generado_en, tipo_error]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ZIP]
        estado:
          type: string
          enum: [PENDIENTE, GENERANDO, LISTA, ERROR]
        vehiculos_incluidos:
          type: integer
          minimum: 0
        vehiculos_pendientes:
          type: integer
          minimum: 0
        creado_en:
          type: string
          format: date-time
          description: Instante del pedido.
        generado_en:
          type: string
          format: date-time
          nullable: true
          description: Instante en que quedó LISTA; null mientras no.
        tipo_error:
          type: string
          nullable: true
          enum: [ALMACEN_NO_DISPONIBLE, GENERACION_FALLIDA, GENERACION_INTERRUMPIDA, SIN_VEHICULOS_TERMINADOS, null]
          description: Solo con estado ERROR. Nunca la causa técnica de una fuente.
    BandejaNotificaciones:
      type: object
      required: [no_leidas, items, siguiente]
      properties:
        no_leidas:
          type: integer
          minimum: 0
          description: Sin leer en toda la bandeja visible (no solo en esta página).
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificacionCampana"
        siguiente:
          type: string
          format: uuid
          nullable: true
          description: Cursor para `antes` de la página siguiente; null si no hay más.
    NotificacionCampana:
      type: object
      required: [id, tipo, creada_en, leida_en, diagnostico_id, titulo, mensaje, accion]
      description: Sin placa, VIN, documento, nombre de persona ni archivo (O2).
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ZIP_EVIDENCIAS_LISTO, ZIP_EVIDENCIAS_FALLIDO, DERIVACION_TERMINADA, LOTE_TERMINADO, SANEAMIENTO_TOMADO, SANEAMIENTO_CERRADO, SANEAMIENTO_REABIERTO, SANEAMIENTO_ANULADO]
          description: Los cuatro SANEAMIENTO_* son de la 1.4.0 (HU #14576, aditivo).
        creada_en:
          type: string
          format: date-time
        leida_en:
          type: string
          format: date-time
          nullable: true
        diagnostico_id:
          type: string
          format: uuid
        titulo:
          type: string
          description: Rótulo fijo por tipo (provisional).
          example: Diagnóstico terminado
        mensaje:
          type: string
          description: Rótulo fijo por tipo con el nombre del lote (provisional).
          example: "El lote «Flota norte» terminó sus consultas."
        accion:
          $ref: "#/components/schemas/AccionNotificacion"
        datos:
          type: object
          nullable: true
          description: >
            Objeto plano: solo contadores y códigos, sin PII (CHECK ck_notificaciones_datos). SANEAMIENTO_* lleva cantidad (entero, mínimo 1)
            y SANEAMIENTO_CERRADO además resultado (SANEADO | NO_PROCEDE); DERIVACION_TERMINADA, creadas/omitidas/fallidas.
            Agregado en la 1.4.0 (HU #14576, aditivo).
          additionalProperties:
            oneOf:
              - type: integer
              - type: string
          example: { cantidad: 2, resultado: SANEADO }
    AccionNotificacion:
      type: object
      required: [tipo, href]
      properties:
        tipo:
          type: string
          enum: [VER_EVIDENCIAS, VER_DERIVACION, VER_LOTE]
          description: VER_EVIDENCIAS para los dos tipos de ZIP, VER_DERIVACION para DERIVACION_TERMINADA y VER_LOTE para LOTE_TERMINADO y los SANEAMIENTO_*.
        href:
          type: string
          description: Ruta relativa del frontend, /diagnosticos/{diagnostico_id} para todos los tipos (la página del lote).
          example: /diagnosticos/01a1d385-0649-766f-a224-cf68b10c52a7
    EstadoSaneamiento:
      type: string
      enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE, ANULADO]
      description: Estado del saneamiento (plan §3.2). ANULADO es final.

    SaneamientoFila:
      type: object
      description: >
        Saneamiento en una fila de la grilla del lote (HU #14576 AC35): estado del no anulado (null si no hay), si se puede
        marcar y por qué no.
      required: [estado, elegible, motivo_no_elegible]
      properties:
        estado: { type: string, nullable: true, enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE] }
        elegible: { type: boolean }
        motivo_no_elegible: { type: string, nullable: true, enum: [NO_TERMINADO, YA_SOLICITADO] }

    SaneamientoFilaBackoffice:
      type: object
      nullable: true
      description: Saneamiento no anulado en una fila de la grilla del backoffice (AC35), sin elegibilidad; null si no hay.
      required: [estado, id]
      properties:
        estado: { type: string, enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE] }
        id: { type: string, format: uuid }

    EvidenciaSaneamiento:
      type: object
      nullable: true
      description: Evidencia del renglón. Nunca se exponen la referencia del almacén ni el sha (§6.3, D-22).
      required: [nombre, tamano, subida_en]
      properties:
        nombre: { type: string, maxLength: 200, description: Nombre original saneado (sin rutas ni caracteres de control). }
        tamano: { type: integer, format: int64, minimum: 1 }
        subida_en: { type: string, format: date-time }

    RenglonSaneamiento:
      type: object
      description: Renglón no quitado. version es su xmin, para el PUT del renglón.
      required: [id, version, fuente, hallazgo, descripcion, automatico, resultado, nota, evidencia]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        fuente: { type: string, enum: [SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, IMPUESTO, SOAT, RTM, OTRO] }
        hallazgo: { type: string, nullable: true, enum: [DEUDA, NO_VIGENTE, SIN_VERIFICAR] }
        descripcion: { type: string, nullable: true, maxLength: 200 }
        automatico: { type: boolean }
        resultado: { type: string, enum: [PENDIENTE, SANEADO, NO_PROCEDE] }
        nota: { type: string, nullable: true, maxLength: 500 }
        evidencia: { $ref: "#/components/schemas/EvidenciaSaneamiento" }

    EventoSaneamientoCliente:
      type: object
      description: Evento para la compañía, con actor genérico; sin RENGLON_ACTUALIZADO ni OBSERVACION_EDITADA.
      required: [evento, ocurrido_en, actor, fuente, motivo]
      properties:
        evento:
          type: string
          enum: [SOLICITADO, DESMARCADO, TOMADO, RENGLON_AGREGADO, RENGLON_QUITADO, RENGLON_ACTUALIZADO, EVIDENCIA_CARGADA, EVIDENCIA_QUITADA, OBSERVACION_EDITADA, CERRADO_SANEADO, CERRADO_NO_PROCEDE, REABIERTO, ANULADO_FLIT]
        ocurrido_en: { type: string, format: date-time }
        actor: { type: string, enum: [COMPANIA, FLIT] }
        fuente: { type: string, nullable: true }
        motivo: { type: string, nullable: true, maxLength: 500 }

    SaneamientoCliente:
      type: object
      description: >
        Saneamiento que ve la compañía (§6.3, SP-15). version es el xmin. Nunca trae usuario_id, quién tomó, cerró o anuló, la
        referencia del almacén ni el sha.
      required: [id, version, estado, solicitado_en, solicitado_por_mi, tomado_en, cerrado_en, motivo_cierre, motivo_anulacion, observacion_flit, renglones, historial]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        estado: { $ref: "#/components/schemas/EstadoSaneamiento" }
        solicitado_en: { type: string, format: date-time }
        solicitado_por_mi: { type: boolean }
        tomado_en: { type: string, format: date-time, nullable: true }
        cerrado_en: { type: string, format: date-time, nullable: true }
        motivo_cierre: { type: string, nullable: true, maxLength: 500 }
        motivo_anulacion: { type: string, nullable: true, maxLength: 500 }
        observacion_flit: { type: string, nullable: true, maxLength: 1000 }
        renglones: { type: array, items: { $ref: "#/components/schemas/RenglonSaneamiento" } }
        historial: { type: array, items: { $ref: "#/components/schemas/EventoSaneamientoCliente" } }

    EventoSaneamientoBackoffice:
      allOf:
        - $ref: "#/components/schemas/EventoSaneamientoCliente"
        - type: object
          description: El de la compañía más quién actuó y los estados de la transición (null en las ediciones, D-63).
          required: [usuario_id, estado_anterior, estado_nuevo]
          properties:
            usuario_id: { type: string, format: uuid }
            estado_anterior: { type: string, nullable: true, enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE, ANULADO] }
            estado_nuevo: { type: string, nullable: true, enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE, ANULADO] }

    SaneamientoBackoffice:
      type: object
      description: >
        Saneamiento que ve FLIT (§6.2, SP-15, D-22): historial completo con usuario_id; sin el indicador de quién solicitó, la referencia del almacén ni la huella.
        Con el contexto del encabezado de la gestión (D-60): empresa, lote, vehículo, placa (o identificador) y veredicto vigente.
      required: [id, version, empresa, diagnostico_id, diagnostico_nombre, vehiculo_id, placa, veredicto, estado, solicitado_en, tomado_en, cerrado_en, motivo_cierre, motivo_anulacion, observacion_flit, renglones, historial]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        empresa: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        diagnostico_nombre: { type: string }
        vehiculo_id: { type: string, format: uuid }
        placa: { type: string, nullable: true }
        veredicto: { type: string, nullable: true, enum: [VIABLE, BLOQUEADO] }
        estado: { $ref: "#/components/schemas/EstadoSaneamiento" }
        solicitado_en: { type: string, format: date-time }
        tomado_en: { type: string, format: date-time, nullable: true }
        cerrado_en: { type: string, format: date-time, nullable: true }
        motivo_cierre: { type: string, nullable: true }
        motivo_anulacion: { type: string, nullable: true }
        observacion_flit: { type: string, nullable: true }
        renglones: { type: array, items: { $ref: "#/components/schemas/RenglonSaneamiento" } }
        historial: { type: array, items: { $ref: "#/components/schemas/EventoSaneamientoBackoffice" } }

    ListaVehiculosIds:
      type: object
      required: [vehiculo_ids]
      properties:
        vehiculo_ids:
          type: array
          minItems: 1
          description: Ids distintos (los repetidos no cuentan); 500 en el masivo y 200 en el Excel de varias placas.
          items: { type: string, format: uuid }

    SolicitudesSaneamiento:
      type: object
      required: [solicitados, omitidos]
      properties:
        solicitados: { type: integer, minimum: 0 }
        omitidos:
          type: array
          items:
            type: object
            required: [vehiculo_id, motivo]
            properties:
              vehiculo_id: { type: string, format: uuid }
              motivo: { type: string, enum: [NO_TERMINADO, YA_SOLICITADO, NO_ENCONTRADO] }

    PersonaDeuda:
      type: object
      description: Persona de la fuente SIMIT (SP-11, BE-C-1), sin nombre; el documento completo solo en el JSON (no-store) y en el PDF.
      required: [tipo_documento, documento]
      properties:
        tipo_documento: { type: string }
        documento: { type: string }

    FuenteDeuda:
      type: object
      description: >
        Una fuente del panel (plan §6.5). Las claves opcionales solo vienen cuando aplican a la fuente. En SIMIT de persona hay
        una entrada por persona. El valor de cada comparendo y el saldo de los acuerdos van como texto, tal como llegan (S17).
      required: [fuente, estado]
      properties:
        fuente: { type: string, enum: [SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, IMPUESTO, SOAT, RTM] }
        estado: { type: string, enum: [CON_DEUDA, NO_VIGENTE, SIN_VERIFICAR, SIN_HALLAZGO, NO_APLICA] }
        consultado_en: { type: string, format: date-time }
        motivo_na: { type: string }
        persona: { $ref: "#/components/schemas/PersonaDeuda" }
        paz_y_salvo: { type: boolean }
        comparendos:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              numero: { type: string, nullable: true }
              fecha: { type: string, nullable: true }
              valor: { type: string, nullable: true }
              estado: { type: string, nullable: true }
        comparendos_truncados: { type: boolean }
        acuerdos_pago:
          type: array
          items:
            type: object
            properties:
              estado: { type: string, nullable: true }
              saldo_pendiente: { type: string, nullable: true }
        monto_total: { type: integer, format: int64 }
        vigencias:
          type: array
          items:
            type: object
            required: [anio, valor, pagada]
            properties:
              anio: { type: integer }
              valor: { type: integer, format: int64 }
              pagada: { type: boolean }
        vence: { type: string }

    PanelDeuda:
      type: object
      description: Panel de deuda (plan §6.5, BE-C). dictamen es null en modo Simple o sin dictamen vigente. Sin totales del SIMIT (S17).
      required: [vehiculo, modo, dictamen, fuentes, saneamiento]
      properties:
        vehiculo:
          type: object
          required: [id, placa]
          properties:
            id: { type: string, format: uuid }
            placa: { type: string, description: Placa, o VIN, o el identificador normalizado. }
        modo: { $ref: "#/components/schemas/ModoDiagnostico" }
        dictamen:
          type: object
          nullable: true
          required: [veredicto, catalogo_version, motivos]
          properties:
            veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
            catalogo_version: { type: integer }
            motivos:
              type: array
              items:
                type: object
                required: [codigo, efecto, texto]
                properties:
                  codigo: { type: string }
                  efecto: { type: string, enum: [BLOQUEA, ADVIERTE] }
                  texto: { type: string }
        fuentes: { type: array, items: { $ref: "#/components/schemas/FuenteDeuda" } }
        saneamiento:
          type: object
          nullable: true
          required: [estado]
          properties:
            estado: { type: string, enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE] }

    FilaPlaca:
      type: object
      description: >
        Una fila de GET /vehiculos (plan §6.6). estado es EN_PROCESO o TERMINADO, calculado sobre las celdas (C1). UA-5: vin e
        identificador (el valor cargado), nullables, para nombrar una fila sin placa. HU #14582: cambio_propietario del vehículo.
      required: [vehiculo_id, placa, diagnostico_id, diagnostico_nombre, diagnostico_creado_en, modo, estado, veredicto, saneamiento, tramite, vin, identificador, cambio_propietario]
      properties:
        vehiculo_id: { type: string, format: uuid }
        placa: { type: string, description: Placa, o VIN, o el identificador normalizado. }
        vin: { type: string, nullable: true }
        identificador: { type: string, nullable: true }
        diagnostico_id: { type: string, format: uuid }
        diagnostico_nombre: { type: string }
        diagnostico_creado_en: { type: string, format: date-time }
        modo: { $ref: "#/components/schemas/ModoDiagnostico" }
        estado: { type: string, enum: [EN_PROCESO, TERMINADO] }
        veredicto: { type: string, nullable: true, enum: [VIABLE, BLOQUEADO] }
        saneamiento: { $ref: "#/components/schemas/SaneamientoFila" }
        tramite:
          type: object
          nullable: true
          required: [id, numero]
          properties:
            id: { type: string, format: uuid }
            numero: { type: string, nullable: true }
        cambio_propietario:
          type: boolean
          nullable: true
          description: HU #14582. El del vehículo (FilaVehiculo.cambio_propietario); sin filtro en servidor.

    ListadoVehiculos:
      type: object
      required: [pagina, tamano, total, vehiculos]
      properties:
        pagina: { type: integer, minimum: 1 }
        tamano: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        vehiculos: { type: array, items: { $ref: "#/components/schemas/FilaPlaca" }, description: D-19. }

    FilaBandejaSaneamiento:
      type: object
      description: >
        Fila de la bandeja entre compañías, sin datos personales (ADR-0087 D-5). AP-1: vin e identificador (el valor cargado),
        nullables, para nombrar una fila sin placa, como en FilaPlaca.
      required: [id, empresa, diagnostico_id, diagnostico_nombre, vehiculo_id, placa, modo, veredicto, estado, solicitado_en, tomado_en, cerrado_en, renglones_total, renglones_pendientes, vin, identificador]
      properties:
        id: { type: string, format: uuid }
        empresa: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        diagnostico_nombre: { type: string }
        vehiculo_id: { type: string, format: uuid }
        placa: { type: string, nullable: true }
        modo: { $ref: "#/components/schemas/ModoDiagnostico" }
        veredicto: { type: string, nullable: true, enum: [VIABLE, BLOQUEADO] }
        estado: { $ref: "#/components/schemas/EstadoSaneamiento" }
        solicitado_en: { type: string, format: date-time }
        tomado_en: { type: string, format: date-time, nullable: true }
        cerrado_en: { type: string, format: date-time, nullable: true }
        renglones_total: { type: integer, minimum: 0 }
        renglones_pendientes: { type: integer, minimum: 0 }
        vin: { type: string, nullable: true }
        identificador: { type: string, nullable: true }

    ListaBandejaSaneamientos:
      type: object
      required: [pagina, tamano, total, saneamientos]
      properties:
        pagina: { type: integer, minimum: 1 }
        tamano: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        saneamientos: { type: array, items: { $ref: "#/components/schemas/FilaBandejaSaneamiento" }, description: D-19. }

    ResumenSaneamientos:
      type: object
      required: [solicitados]
      properties:
        solicitados: { type: integer, minimum: 0 }

    CuerpoTomarSaneamientos:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [empresa, id]
            properties:
              empresa: { type: string, format: uuid }
              id: { type: string, format: uuid }

    ResultadoTomarSaneamientos:
      type: object
      required: [tomados, omitidos]
      properties:
        tomados: { type: integer, minimum: 0 }
        omitidos:
          type: array
          items:
            type: object
            required: [id, motivo]
            properties:
              id: { type: string, format: uuid }
              motivo: { type: string, enum: [TRANSICION_INVALIDA, NO_ENCONTRADO] }

    VersionSaneamiento:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
      description: >
        xmin leído (del saneamiento, o del renglón en su PUT). Distinto del vigente: 409 VERSION_DESACTUALIZADA. Ausente o no
        entero: 422 VERSION_INVALIDA (brief C6).

    CuerpoObservacionSaneamiento:
      type: object
      required: [version]
      properties:
        observacion: { type: string, nullable: true, maxLength: 1000, description: "0 a 1000 puntos de código; vacía o null la borra. Sin caracteres de control ni bidireccionales (422 TEXTO_INVALIDO)." }
        version: { $ref: "#/components/schemas/VersionSaneamiento" }

    CuerpoRenglonOtro:
      type: object
      required: [descripcion]
      properties:
        descripcion: { type: string, minLength: 3, maxLength: 200 }

    CuerpoRenglonSaneamiento:
      type: object
      required: [resultado, version]
      properties:
        resultado: { type: string, enum: [PENDIENTE, SANEADO, NO_PROCEDE] }
        nota: { type: string, nullable: true, maxLength: 500 }
        version: { $ref: "#/components/schemas/VersionSaneamiento" }

    CuerpoCerrarSaneamiento:
      type: object
      required: [resultado, version]
      properties:
        resultado: { type: string, enum: [SANEADO, NO_PROCEDE] }
        motivo: { type: string, minLength: 10, maxLength: 500, description: Obligatorio con NO_PROCEDE (422 MOTIVO_REQUERIDO). }
        version: { $ref: "#/components/schemas/VersionSaneamiento" }

    CuerpoMotivoSaneamiento:
      type: object
      required: [motivo, version]
      properties:
        motivo: { type: string, minLength: 10, maxLength: 500, description: "Sin espacios al inicio ni al final (422 MOTIVO_REQUERIDO); sin caracteres de control (422 TEXTO_INVALIDO)." }
        version: { $ref: "#/components/schemas/VersionSaneamiento" }

    RolDiagnostico:
      type: string
      description: Lista blanca de roles de Diagnóstico (SP-10), por código.
      enum: [usuario_diagnostico, admin_diagnostico]
    UsuarioDiagnostico:
      type: object
      description: >
        Una fila del módulo Usuarios (SP-18): sin roles de otros productos ni datos de sesión. acciones y motivo_sin_acciones los calcula
        core-api para el actor que pide.
      required: [id, tipo, nombre, correo, rol, rol_etiqueta, estado, acciones, motivo_sin_acciones]
      properties:
        id: { type: string, format: uuid, description: Usuario (tipo USUARIO) o invitación (tipo INVITACION). }
        tipo: { type: string, enum: [USUARIO, INVITACION] }
        nombre: { type: string }
        correo: { type: string, description: "@pii:medium. Solo en la celda visible (SP-20)." }
        rol: { $ref: "#/components/schemas/RolDiagnostico" }
        rol_etiqueta: { type: string, example: Usuario de Diagnóstico }
        estado:
          type: string
          enum: [ACTIVO, INVITADO, SUSPENDIDO]
          description: SUSPENDIDO = sin acceso a Diagnóstico (rol retirado, SP-12 = a); la cuenta de la plataforma no cambia.
        acciones:
          type: array
          items: { type: string, enum: [CAMBIAR_ROL, SUSPENDER, REACTIVAR] }
        motivo_sin_acciones:
          type: string
          nullable: true
          enum: [USTED_MISMO, ADMIN_COMPANIA, SOLO_SUPERADMIN, INVITACION, CUENTA_INACTIVA, null]
    ListaUsuariosDiagnostico:
      type: object
      required: [pagina, tamano, total, usuarios, roles_asignables]
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
        roles_asignables:
          type: array
          description: "Lo que el actor puede dar al invitar o cambiar rol (SP-11): admin_diagnostico solo [usuario_diagnostico]; SuperAdmin los dos."
          items: { $ref: "#/components/schemas/RolDiagnostico" }
        usuarios:
          type: array
          items: { $ref: "#/components/schemas/UsuarioDiagnostico" }
    EmpresaCabecera:
      type: object
      description: D-6. Cabecera de la compañía del backoffice, de la misma resolución de Identidad que valida la ruta.
      required: [id, nombre, nit]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string, description: Vacío solo en local sin Identidad configurada. }
        nit: { type: string, nullable: true }
    ListaUsuariosDiagnosticoBackoffice:
      allOf:
        - $ref: "#/components/schemas/ListaUsuariosDiagnostico"
        - type: object
          required: [empresa]
          properties:
            empresa: { $ref: "#/components/schemas/EmpresaCabecera" }
    InvitacionUsuarioDiagnostico:
      type: object
      required: [correo, nombre, rol]
      properties:
        correo: { type: string, format: email, maxLength: 254 }
        nombre: { type: string, minLength: 1, maxLength: 150 }
        rol: { $ref: "#/components/schemas/RolDiagnostico" }
    CambioRolDiagnostico:
      type: object
      required: [rol]
      properties:
        rol: { $ref: "#/components/schemas/RolDiagnostico" }
    InvitacionAceptada:
      type: object
      required: [resultado, mensaje]
      properties:
        resultado: { type: string, enum: [ACEPTADA] }
        mensaje: { type: string, example: "Si el correo es válido, la persona recibirá la invitación o el acceso a Diagnóstico." }
    EmpresaUsuarios:
      type: object
      required: [id, nombre, nit, estado, usuarios_diagnostico, administradores_diagnostico]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        nit: { type: string, nullable: true }
        estado: { type: string, enum: [ACTIVA] }
        usuarios_diagnostico: { type: integer }
        administradores_diagnostico: { type: integer }
    ListaEmpresasUsuarios:
      type: object
      required: [pagina, tamano, total, empresas]
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
        empresas:
          type: array
          items: { $ref: "#/components/schemas/EmpresaUsuarios" }

    ErrorRegla:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: SIN_EMPRESA
        error:
          type: string
        campo:
          type: string
          description: Campo del cuerpo que incumple la regla (solo en las reglas de un campo, HU #13750).
          example: alcance.por_vehiculo

    EstadisticasDto:
      type: object
      description: >
        Estadísticas de Diagnóstico (E1–E3, ADR-0088). Sin PII en ninguna profundidad (SP-16): ni placa, VIN, documento ni nombre de
        usuario. Cohorte = lotes con creado_en en el rango y visibles para el usuario (saneamientos por solicitado_en, derivaciones por
        creada_en).
      required: [ambito, periodo, generado_en, resumen, serie, veredictos, tipos_analisis, fuentes, saneamientos, derivaciones, top_empresas]
      properties:
        ambito:
          type: object
          required: [tipo, empresa_id, empresa_nombre]
          properties:
            tipo: { type: string, enum: [EMPRESA, GLOBAL], description: EMPRESA en E1 y E3; GLOBAL en E2. }
            empresa_id: { type: string, format: uuid, nullable: true, description: "E1: la compañía del token; E3: la pedida; E2: null." }
            empresa_nombre: { type: string, nullable: true, description: "E1: de la sesión; E3: de Identidad; E2: null." }
        periodo:
          type: object
          required: [desde, hasta, granularidad]
          properties:
            desde: { type: string, format: date }
            hasta: { type: string, format: date }
            granularidad: { type: string, enum: [DIA, SEMANA, MES], description: "DIA hasta 62 días, SEMANA (cubeta desde el lunes) hasta 183, si no MES." }
        generado_en: { type: string, format: date-time, description: ISO 8601 con offset (-05:00). }
        resumen: { $ref: "#/components/schemas/ResumenEstadisticas" }
        serie:
          type: array
          description: Una entrada por cubeta del rango, con ceros, ordenada.
          items: { $ref: "#/components/schemas/CubetaEstadisticas" }
        veredictos:
          type: object
          required: [viables, bloqueados, sin_dictamen]
          description: Dictamen vigente de los vehículos de la cohorte.
          properties:
            viables: { type: integer }
            bloqueados: { type: integer }
            sin_dictamen: { type: integer }
        tipos_analisis:
          type: object
          required: [simple, con_analisis]
          properties:
            simple: { type: integer }
            con_analisis: { type: integer }
        fuentes:
          type: array
          description: Solo las fuentes con al menos 1 celda en la cohorte, en el orden del enum; tiempo_promedio_ms excluye los intentos MANUAL.
          items: { $ref: "#/components/schemas/FuenteEstadisticas" }
        saneamientos:
          type: array
          description: Siempre los 5 estados en este orden (SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE, ANULADO), con ceros.
          items:
            type: object
            required: [estado, cantidad]
            properties:
              estado: { $ref: "#/components/schemas/EstadoSaneamiento" }
              cantidad: { type: integer }
        derivaciones:
          type: object
          required: [creadas, omitidas, fallidas, en_curso]
          properties:
            creadas: { type: integer }
            omitidas: { type: integer }
            fallidas: { type: integer }
            en_curso: { type: integer, description: Ítems PENDIENTE o ENVIADO de las operaciones del rango. }
        top_empresas:
          type: array
          maxItems: 10
          description: Solo en E2 (en E1 y E3 es []). Por diagnosticos desc, vehiculos desc y empresa_nombre; solo compañías habilitadas.
          items: { $ref: "#/components/schemas/TopEmpresaEstadisticas" }

    ResumenEstadisticas:
      type: object
      required: [diagnosticos, diagnosticos_express, diagnosticos_masivos, vehiculos, vehiculos_unicos, consultas, consultas_exitosas, consultas_con_error, consultas_no_aplica, consultas_pendientes, tasa_exito, tiempo_promedio_consulta_ms, saneamientos_solicitados, tramites_creados]
      properties:
        diagnosticos: { type: integer }
        diagnosticos_express: { type: integer }
        diagnosticos_masivos: { type: integer }
        vehiculos: { type: integer }
        vehiculos_unicos: { type: integer, description: "COUNT(DISTINCT (tenant_id, identificador_norm))." }
        consultas: { type: integer }
        consultas_exitosas: { type: integer }
        consultas_con_error: { type: integer }
        consultas_no_aplica: { type: integer }
        consultas_pendientes: { type: integer, description: PENDIENTE + EN_CURSO. }
        tasa_exito: { type: number, nullable: true, minimum: 0, maximum: 1, description: "exitosas / (exitosas + con_error), 4 decimales; null si el divisor es 0." }
        tiempo_promedio_consulta_ms: { type: integer, nullable: true, description: Promedio de fin − inicio de los intentos no MANUAL; null sin intentos. }
        saneamientos_solicitados: { type: integer }
        tramites_creados: { type: integer }

    CubetaEstadisticas:
      type: object
      required: [inicio, diagnosticos, express, masivos, vehiculos]
      properties:
        inicio: { type: string, format: date }
        diagnosticos: { type: integer }
        express: { type: integer }
        masivos: { type: integer }
        vehiculos: { type: integer }

    FuenteEstadisticas:
      type: object
      required: [fuente, consultas, exitosas, con_error, no_aplica, pendientes, tasa_exito, tiempo_promedio_ms]
      properties:
        fuente: { $ref: "#/components/schemas/Fuente" }
        consultas: { type: integer }
        exitosas: { type: integer }
        con_error: { type: integer }
        no_aplica: { type: integer }
        pendientes: { type: integer }
        tasa_exito: { type: number, nullable: true }
        tiempo_promedio_ms: { type: integer, nullable: true }

    TopEmpresaEstadisticas:
      type: object
      required: [empresa_id, empresa_nombre, diagnosticos, vehiculos]
      properties:
        empresa_id: { type: string, format: uuid }
        empresa_nombre: { type: string, description: De Identidad; nunca null. }
        diagnosticos: { type: integer }
        vehiculos: { type: integer }

    TipoReporte:
      type: string
      enum: [vehiculos, consultas, saneamientos, derivaciones, consumo]
      description: >
        Enum cerrado; consumo solo existe en el backoffice. En R1–R3 y B1–B3 otro valor responde 404 REPORTE_NO_ENCONTRADO. En B4–B6
        es restricción de ruta: otro valor responde 404 sin cuerpo, sin auditoría y sin consultar a Identidad.

    CatalogoReportesDto:
      type: object
      required: [reportes]
      description: R0 devuelve 4 tipos (sin consumo); B0, los 5.
      properties:
        reportes:
          type: array
          items: { $ref: "#/components/schemas/ReporteCatalogo" }

    ReporteCatalogo:
      type: object
      required: [tipo, nombre, descripcion, contiene_pii, fecha_referencia, filtros, maximo_excel, maximo_pdf]
      properties:
        tipo: { $ref: "#/components/schemas/TipoReporte" }
        nombre: { type: string, example: Vehículos diagnosticados }
        descripcion: { type: string }
        contiene_pii: { type: boolean, description: "true solo en vehiculos (documentos completos). false = sin documentos; la placa sigue siendo @pii:low." }
        fecha_referencia: { type: string, example: Fecha de creación del diagnóstico }
        filtros:
          type: array
          description: Sin desde ni hasta (implícitos y obligatorios).
          items: { $ref: "#/components/schemas/FiltroReporteCatalogo" }
        maximo_excel: { type: integer, example: 5000 }
        maximo_pdf: { type: integer, example: 1000 }

    FiltroReporteCatalogo:
      type: object
      required: [clave, tipo, repetible, valores]
      properties:
        clave: { type: string, enum: [modalidad, tipo_analisis, veredicto, fuente, estado, placa] }
        tipo: { type: string, enum: [enum, prefijo] }
        repetible: { type: boolean }
        valores: { type: array, items: { type: string }, description: Vacío en placa. }

    PaginaReporteDto:
      type: object
      required: [tipo, ambito, pagina, tamano, total, acceso_id, columnas, filas]
      description: >
        Reporte en pantalla (R1, B1, B4). Cada fila es un objeto cuyas claves son exactamente las columnas[].clave (valor o null), en
        el orden de la lista blanca cerrada del tipo (SP-16), que publica x-columnas. Nunca usuario_*, persona_id, consulta_id,
        tenant_id ni nombre de persona. En BACKOFFICE_GLOBAL las columnas empiezan con empresa_nombre (salvo consumo, que ya la trae
        primero); origen de consultas solo sale en BACKOFFICE_*. Los documentos salen «<tipo> <número>» separados por «; » en orden;
        un documento que no se pudo descifrar sale como «<tipo> No disponible» (por ejemplo «CC No disponible»), sin el número. En
        consumo, consultas_exitosas, consultas_con_error y consultas_runt|simit|avaluo|impuesto cuentan solo lo que consume: celdas
        COMPLETADO y ERROR no reutilizadas (sin NA, PENDIENTE, EN_CURSO ni reutilizadas del mismo día, D-10); las tres fuentes RUNT y
        las tres SIMIT se suman. En vehiculos (HU #14582, SP-6): propietario_declarado_documento es el propietario actual que
        declaró el cliente, cambio_propietario es «Sí», «No» o null y locatario_runt_documento es solo el locatario del RUNT.
      x-columnas:
        vehiculos: [fecha_diagnostico, diagnostico_nombre, modalidad, tipo_analisis, tipo_tramite, placa, vin, servicio, organismo, departamento, propietarios_documentos, propietario_declarado_documento, cambio_propietario, locatario_runt_documento, veredicto, estado_consultas, saneamiento_estado, tramite_numero]
        consultas: [fecha_diagnostico, diagnostico_nombre, placa, fuente, estado, motivo_na, tipo_error, intentos, duracion_ms, dato_obtenido_en, reutilizada, origen]
        saneamientos: [solicitado_en, placa, diagnostico_nombre, estado, tomado_en, cerrado_en, dias_hasta_cierre, motivo_cierre, renglones_total, renglones_pendientes]
        derivaciones: [fecha, placa, diagnostico_nombre, tipo_operacion, tipo_tramite, estado, motivo, tramite_numero]
        consumo: [empresa_nombre, empresa_nit, diagnosticos, vehiculos, consultas_exitosas, consultas_con_error, tasa_exito, consultas_runt, consultas_simit, consultas_avaluo, consultas_impuesto, saneamientos, tramites_creados]
      properties:
        tipo: { $ref: "#/components/schemas/TipoReporte" }
        ambito: { type: string, enum: [COMPANIA, BACKOFFICE_EMPRESA, BACKOFFICE_GLOBAL] }
        pagina: { type: integer, minimum: 1 }
        tamano: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer }
        acceso_id: { type: string, format: uuid, description: Id de la fila de accesos_reporte de esta petición. }
        columnas:
          type: array
          items: { $ref: "#/components/schemas/ColumnaReporte" }
        filas:
          type: array
          items:
            type: object
            additionalProperties: { nullable: true }

    ColumnaReporte:
      type: object
      required: [clave, titulo, tipo, pii]
      properties:
        clave: { type: string, example: placa }
        titulo: { type: string, example: Placa }
        tipo: { type: string, enum: [texto, numero, fecha, fecha_hora, moneda, porcentaje], description: "fecha AAAA-MM-DD; fecha_hora ISO; moneda COP entero; porcentaje 0..1." }
        pii: { type: boolean }

    ErrorReporteDemasiadoGrande:
      type: object
      required: [code, error, filas, maximo]
      properties:
        code: { type: string, enum: [REPORTE_DEMASIADO_GRANDE] }
        error: { type: string, example: "El reporte tiene más filas de las que admite el formato. Acota el rango o los filtros." }
        filas: { type: integer, example: 6120 }
        maximo: { type: integer, example: 5000 }
