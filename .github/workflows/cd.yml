      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HU #13329 (Epic #13316): si nada de lo que compila la imagen cambió, se reetiqueta la vigente en vez de
      # reconstruirla (acción .github/actions/reuse-image, la misma lógica que nació aquí en la HU #13234).
      - name: Reuse previous image when unchanged
        id: reuse
        uses: ./.github/actions/reuse-image
        with:
          image: ${{ env.CORE_IDENTITY_IMAGE }}
          tag: ${{ needs.setup.outputs.image_tag }}
          paths: |
            services/core-identity
            services/core-api/global.json
            services/core-api/Directory.Build.props
            services/core-api/Directory.Packages.props
            services/core-api/src/Flit.Api/appsettings.json
            services/core-api/src/Flit.Api/appsettings.Development.json
            services/core-api/src/Flit.Admin.Application
            services/core-api/src/Flit.Admin.Domain
            services/core-api/src/Flit.Identity.Infrastructure
            services/core-api/src/Flit.Modules.Improntas.Domain
            services/core-api/src/Flit.Modules.Notificaciones
            services/core-api/src/Flit.Modules.Platform
            services/core-api/src/Flit.Modules.Security.Application
            services/core-api/src/Flit.Modules.Security.Domain
            services/core-api/src/Flit.Platform.Sdk
            services/core-api/src/Flit.Queries.Domain
            services/core-api/src/Flit.Suite.AspNetCore
            contracts/proto

      - name: Extract metadata — core-identity
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_IDENTITY_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push core-identity
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          # Context = services/: core-identity compila librerías compartidas de core-api (ver su Dockerfile).
          context: ./services
          # HU #13334: los contratos gRPC entran como contexto con nombre (COPY --from=contracts en el Dockerfile).
          build-contexts: |
            contracts=./contracts/proto
          file: ./services/core-identity/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-identity
          cache-to: type=gha,mode=max,scope=core-identity


