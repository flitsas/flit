name: Contratos → Flit Atlas

# Publica los contratos de FLIT 2.0 (OpenAPI, AsyncAPI y proto de contracts/, más los proto de core-ict) en Flit Atlas con el
# workflow reutilizable de flit-atlas (atlas-publicar.yml, ATLAS-ADR-0035 de Atlas). Un job por contrato, con la lista en
# .github/ci/contratos-atlas.yml. En los PR y en develop solo corren los contratos cuyo archivo cambió (job «seleccion»,
# .github/scripts/ci-contratos-atlas-seleccion.py): cada job se cobra redondeado al minuto y ~30 jobs de ~1 min por PR
# eran ~2.650 min/semana. staging, release y workflow_dispatch corren todos.
#   - pull_request: solo valida (vacuum y, en OpenAPI, oasdiff breaking contra la rama release o la rama base).
#   - push a develop, staging o release (y workflow_dispatch): valida y publica con el token OIDC de GitHub Actions,
#     sin secretos. develop publica X.Y.Z-dev.<sha7>, staging X.Y.Z-rc.<sha7> y release la versión estable X.Y.Z.
#   - staging marca el canal qa y release el canal pdn en el Atlas central (ATLAS_URL).
#   - contratos-qa: desde staging, publica además en el Atlas de QA (ATLAS_URL_QA), como el CD de flit-atlas (ATLAS-ADR-0052).
# Sin la variable ATLAS_URL (de la organización o del repo) solo valida; sin ATLAS_URL_QA, contratos-qa se omite.
#
# La versión de OpenAPI y AsyncAPI es info.version del spec: súbela cuando cambie el contrato (en release, un spec
# distinto con la misma versión falla; un breaking sin subir la MAJOR falla siempre). En proto la versión va en la matriz
# (MAJOR = la vN del paquete): súbela al cambiar el .proto.
#
# Lo que valida aquí no reemplaza contracts.yml (redocly, @asyncapi/parser y buf lint/breaking siguen allí).
# modo_lint: advertencia mientras los contratos no cumplen el ruleset de Atlas (los errores se ven como aviso).
#
# Sin publicar: contracts/proto/flit/personanatural/v1/personanatural.proto, porque core-personanatural aún no es un
# aplicativo del catálogo de Atlas (la publicación fallaría). Se agrega cuando exista.
#
# Esta rama publica lo que corre en su ambiente: los contratos son los de staging y la matriz solo tiene lo que existe aquí
# y se despliega desde su cd.yml. No trae consultas-runt-intempo, diagnostico-grpc ni tramites-persona-natural (sus .proto
# no están en staging), ni diagnostico ni diagnostico-events (core-diagnostico no está en su cd.yml). Llegan con la
# promoción del producto, junto con sus contratos.

on:
  push:
    branches: [develop, staging, release]
    paths:
      - 'contracts/**'
      - '.github/workflows/atlas-publicar-contratos.yml'
      - '.github/ci/contratos-atlas.yml'
      - '.github/scripts/ci-contratos-atlas-seleccion.py'
      - 'services/core-ict/src/Flit.Ict.Grpc.Contracts/Protos/**'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/atlas-publicar-contratos.yml'
      - '.github/ci/contratos-atlas.yml'
      - '.github/scripts/ci-contratos-atlas-seleccion.py'
      - 'services/core-ict/src/Flit.Ict.Grpc.Contracts/Protos/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: atlas-contratos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seleccion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matriz: ${{ steps.elegir.outputs.matriz }}
      hay: ${{ steps.elegir.outputs.hay }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: elegir
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.ref_name }}
          BASE: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          CONTRATOS: ${{ runner.temp }}/contratos-atlas.json
        run: |
          yq -o=json '.' .github/ci/contratos-atlas.yml > "$CONTRATOS"
          python3 .github/scripts/ci-contratos-atlas-seleccion.py

  contrato:
    name: ${{ matrix.contrato }} (${{ matrix.tipo }})
    needs: seleccion
    if: needs.seleccion.outputs.hay == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.seleccion.outputs.matriz) }}
    uses: flitsas/flit-atlas/.github/workflows/atlas-publicar.yml@v1
    with:
      aplicativo: ${{ matrix.aplicativo }}
      contrato: ${{ matrix.contrato }}
      tipo: ${{ matrix.tipo }}
      ruta: ${{ matrix.ruta }}
      version: ${{ matrix.version || '' }}
      ruleset: ${{ matrix.ruleset || '' }}
      modo_lint: ${{ matrix.lint || 'error' }}
      modo_breaking: ${{ matrix.breaking || 'error' }}
      atlas_url: ${{ vars.ATLAS_URL }}
      ambiente: ${{ github.ref_name == 'staging' && 'qa' || github.ref_name == 'release' && 'pdn' || '' }}

  contratos-qa:
    name: QA · ${{ matrix.contrato }} (${{ matrix.tipo }})
    needs: seleccion
    if: github.ref_name == 'staging' && github.event_name != 'pull_request' && vars.ATLAS_URL_QA != '' && needs.seleccion.outputs.hay == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.seleccion.outputs.matriz) }}
    uses: flitsas/flit-atlas/.github/workflows/atlas-publicar.yml@v1
    with:
      aplicativo: ${{ matrix.aplicativo }}
      contrato: ${{ matrix.contrato }}
      tipo: ${{ matrix.tipo }}
      ruta: ${{ matrix.ruta }}
      version: ${{ matrix.version || '' }}
      ruleset: ${{ matrix.ruleset || '' }}
      modo_lint: ${{ matrix.lint || 'error' }}
      modo_breaking: ${{ matrix.breaking || 'error' }}
      atlas_url: ${{ vars.ATLAS_URL_QA }}
      ambiente: qa
