name: CD - Build & Deploy to VPS

on:
  push:
    branches: [release, staging, develop]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Nombres de imagen UNIFICADOS y con prefijo de registry ghcr.io/ (GHCR), igual que
  # el pull del docker-compose.prod.yml en el VPS. El ambiente se diferencia por TAG
  # (dev/qa/pdn), no por nombre de repo.
  CORE_API_IMAGE: ghcr.io/flitsas/flitdev/core-api
  CORE_ICT_IMAGE: ghcr.io/flitsas/flitdev/core-ict
  FRONTEND_IMAGE: ghcr.io/flitsas/flitdev/frontend
  PYTHON_ML_IMAGE: ghcr.io/flitsas/flitdev/python-ml

jobs:
  # ── Resolver ambiente segun la rama ─────────────────────────────────────────
  # develop -> dev, staging -> qa, release -> pdn.
  # Centraliza el mapeo rama -> {ambiente, dominios, tag} en un solo lugar.
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      gh_env: ${{ steps.env.outputs.gh_env }}
      front_domain: ${{ steps.env.outputs.front_domain }}
      api_domain: ${{ steps.env.outputs.api_domain }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      deploy_tag: ${{ steps.env.outputs.deploy_tag }}
      front_port: ${{ steps.env.outputs.front_port }}
      gateway_port: ${{ steps.env.outputs.gateway_port }}
      core_port: ${{ steps.env.outputs.core_port }}
      python_port: ${{ steps.env.outputs.python_port }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          # Puertos por ambiente: DEV 40xx, QA 50xx, PDN 60xx (front/gateway/core/python).
          # gh_env: nombre del GitHub Environment donde viven los secrets del VPS
          # (los Environments configurados son develop/staging/production). env_name
          # (dev/qa/pdn) se usa solo para tags de imagen y etiquetas de display.
          case "${{ github.ref_name }}" in
            release)
              env_name=pdn
              gh_env=production
              front_domain=pdn.flitsas.online
              api_domain=api.pdn.flitsas.online
              image_tag=pdn
              front_port=6001; gateway_port=6002; core_port=6003; python_port=6012
              ;;
            staging)
              env_name=qa
              gh_env=staging
              front_domain=qa.flitsas.online
              api_domain=api.qa.flitsas.online
              image_tag=qa
              front_port=5001; gateway_port=5002; core_port=5003; python_port=5012
              ;;
            develop)
              env_name=dev
              gh_env=develop
              front_domain=dev.flitsas.online
              api_domain=api.dev.flitsas.online
              image_tag=dev
              front_port=4001; gateway_port=4002; core_port=4003; python_port=4012
              ;;
            *)
              echo "::error::Rama no soportada para deploy: ${{ github.ref_name }}"
              exit 1
              ;;
          esac
          # Tag con el que se DESPLIEGA (lo que el VPS hace pull):
          #   PDN -> sha-<commit> inmutable (rollback determinista en produccion).
          #   DEV/QA -> tag movil del ambiente (siempre lo ultimo de la rama).
          if [ "$env_name" = "pdn" ]; then
            deploy_tag="sha-${GITHUB_SHA}"
          else
            deploy_tag="$image_tag"
          fi
          {
            echo "env_name=$env_name"
            echo "gh_env=$gh_env"
            echo "front_domain=$front_domain"
            echo "api_domain=$api_domain"
            echo "image_tag=$image_tag"
            echo "deploy_tag=$deploy_tag"
            echo "front_port=$front_port"
            echo "gateway_port=$gateway_port"
            echo "core_port=$core_port"
            echo "python_port=$python_port"
          } >> "$GITHUB_OUTPUT"
          echo "Ambiente: $env_name | front: $front_domain ($front_port) | api: $api_domain ($gateway_port) | build-tag: $image_tag | deploy-tag: $deploy_tag"

  build-core-api:
    name: Build & push core-api (.NET) image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El driver docker-container de Buildx baja moby/buildkit de Docker Hub al
      # arrancar y a veces da timeout (context deadline exceeded). La pre-descargamos
      # con reintentos; si queda local, Buildx no la vuelve a bajar.
      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — core-api
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_API_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push core-api
        uses: docker/build-push-action@v6
        with:
          # Context = services/ para incluir Flit.Ict.Grpc.Contracts (ProjectReference desde core-api).
          context: ./services
          file: ./services/core-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api


  build-frontend:
    name: Build & push frontend image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El driver docker-container de Buildx baja moby/buildkit de Docker Hub al
      # arrancar y a veces da timeout (context deadline exceeded). La pre-descargamos
      # con reintentos; si queda local, Buildx no la vuelve a bajar.
      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La URL del API depende del ambiente (api.<env>.flitsas.online).
          # Prefijo NEXT_PUBLIC_: Next.js solo embebe en el bundle del cliente las
          # variables con este prefijo presentes durante `next build`.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ needs.setup.outputs.api_domain }}/api/v1
            NEXT_PUBLIC_TRASPASOS_API_BASE_URL=https://${{ needs.setup.outputs.api_domain }}/api/v1/procedures
            NEXT_PUBLIC_DEV_USER_ID=01900000-100b-7001-8001-000000000001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-python-ml:
    name: Build & push python-ml image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El driver docker-container de Buildx baja moby/buildkit de Docker Hub al
      # arrancar y a veces da timeout (context deadline exceeded). La pre-descargamos
      # con reintentos; si queda local, Buildx no la vuelve a bajar.
      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — python-ml
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PYTHON_ML_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push python-ml
        uses: docker/build-push-action@v6
        with:
          context: ./services/python-ml
          file: ./services/python-ml/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=python-ml
          cache-to: type=gha,mode=max,scope=python-ml

  build-core-ict:
    name: Build & push core-ict (.NET) image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — core-ict
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_ICT_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push core-ict
        uses: docker/build-push-action@v6
        with:
          context: ./services/core-ict
          file: ./services/core-ict/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-ict
          cache-to: type=gha,mode=max,scope=core-ict

  deploy-to-vps:
    name: Deploy to VPS (${{ needs.setup.outputs.env_name }})
    needs: [setup, build-core-api, build-core-ict, build-frontend, build-python-ml]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub Environment por ambiente: cada uno (dev/qa/pdn) tiene SUS PROPIOS secrets
    # (HOSTINGER_SSH_*, HOSTINGER_DEPLOY_PATH, GHCR_PAT). Asi un mismo workflow despliega
    # al VPS correcto segun la rama.
    environment:
      name: ${{ needs.setup.outputs.gh_env }}
      url: https://${{ needs.setup.outputs.front_domain }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copia robusta via appleboy/scp-action (mismo manejo de clave/host-key que el
      # paso de deploy). Crea el directorio destino automaticamente.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          source: docker-compose.prod.yml
          # target debe ser directorio (trailing slash) para no anidar rutas.
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}/
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            set -eo pipefail
            DEPLOY_PATH="${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "::error::docker-compose.prod.yml no encontrado en $DEPLOY_PATH"
              ls -la "$DEPLOY_PATH" || true
              exit 1
            fi

            # Carpeta de intercambio del migrador V1->V2 (perfil `migracion`): por aqui
            # entran los archivos de ids y salen los reportes. Se crea aqui, con el
            # usuario del deploy, y no se deja que la cree Docker al montar el bind:
            # Docker la crearia como root y quien entre por SSH no podria escribir
            # dentro, con un "permission denied" que no dice de donde viene.
            mkdir -p migracion

            # Tag + puertos segun ambiente (override del .env del VPS).
            # deploy_tag: sha-<commit> inmutable en PDN; tag movil (dev/qa) en DEV/QA.
            export CORE_API_TAG=${{ needs.setup.outputs.deploy_tag }}
            export CORE_ICT_TAG=${{ needs.setup.outputs.deploy_tag }}
            export FRONTEND_TAG=${{ needs.setup.outputs.deploy_tag }}
            export PYTHON_ML_TAG=${{ needs.setup.outputs.deploy_tag }}
            export FRONTEND_PORT=${{ needs.setup.outputs.front_port }}
            export GATEWAY_PORT=${{ needs.setup.outputs.gateway_port }}
            export CORE_API_PORT=${{ needs.setup.outputs.core_port }}
            export PYTHON_ML_PORT=${{ needs.setup.outputs.python_port }}

            # GHCR login: el usuario DEBE ser el dueño del PAT (GHCR_USERNAME), NO github.actor.
            # Si el merge lo hace otro usuario, login con github.actor falla en ~10s (exit 1).
            GHCR_USER="${{ secrets.GHCR_USERNAME }}"
            if [ -z "$GHCR_USER" ]; then
              GHCR_USER="${{ vars.GHCR_USERNAME }}"
            fi
            if [ -z "$GHCR_USER" ]; then
              # Fallback histórico: PAT del equipo asociado a deploys exitosos previos.
              GHCR_USER="jormancopeteflit"
              echo "::warning::GHCR_USERNAME no configurado; usando fallback $GHCR_USER. Configura secret GHCR_USERNAME en el repo."
            fi
            if ! echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              echo "::error::docker login ghcr.io falló para usuario $GHCR_USER"
              exit 1
            fi

            # Pull latest images and restart services
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove dangling images to free space
            docker image prune -f

            # Health check: hit the container directly (bypass host nginx)
            echo "Waiting for application to start..."
            sleep 15
            ok=0
            for i in 1 2 3 4 5 6; do
              # Front + API publica del gateway (puertos del ambiente) deben responder.
              if curl -fsS http://127.0.0.1:${{ needs.setup.outputs.front_port }}/ > /dev/null \
                 && curl -fsS http://127.0.0.1:${{ needs.setup.outputs.gateway_port }}/health > /dev/null; then
                echo "Health check OK (attempt $i)"
                ok=1
                break
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check FAILED"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            echo "Deploy OK."

      - name: Notify success
        if: success()
        run: echo "Deploy a ${{ needs.setup.outputs.env_name }} (https://${{ needs.setup.outputs.front_domain }}) exitoso."

      - name: Notify failure
        if: failure()
        run: |
          echo "Deploy a ${{ needs.setup.outputs.env_name }} FALLIDO. Revisa los logs arriba."
          echo "Rollback manual: ssh al VPS y ejecuta:"
          echo "  cd <deploy-path> && docker compose down && docker compose up -d"
