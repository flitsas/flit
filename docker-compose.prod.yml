# Production docker-compose — VPS deploy (front + gateway + core-api + python-ml).
#
# CONVENCION DE PUERTOS: cada servicio usa el MISMO puerto en host e interno
# (expuesto == interno), publicado solo en 127.0.0.1 (el reverse-proxy del HOST
# termina TLS y enruta los dominios). Los puertos son PARAMETRIZABLES por ambiente:
#
#   Servicio   var               DEV    QA     PDN
#   frontend   FRONTEND_PORT     4001   5001   6001   (Next.js)
#   gateway    GATEWAY_PORT      4002   5002   6002   (API publica YARP: /api, /hubs, /ml)
#   core-api   CORE_API_PORT     4003   5003   6003   (Flit.Api interno/debug, detras de YARP)
#   core-ict   CORE_ICT_PORT     4020   5020   6020   (Flit.Ict.Api interno, detras de YARP)
#   python-ml  PYTHON_ML_PORT    4012   5012   6012   (FastAPI OCR/ML, detras de YARP)
#   migracion  MIGRACION_API_PORT 4030  5030   6030   (Flit.DataMigration.Api, SOLO red interna)
#
# gRPC este-oeste (interno, NO publicado): core-ict -> core-api en CORE_API_GRPC_PORT (default 8082);
# el callback de estados va core-api -> core-ict en CORE_ICT_PORT (h2c en el mismo puerto REST).
#
# Los defaults son los de DEV. El CD exporta las vars segun la rama (develop/staging/
# release); para operacion manual, fijalas en el .env del VPS de ese ambiente.
#
# Mapeo de dominios en el reverse-proxy del HOST (ejemplo DEV):
#   dev.flitsas.online      -> 127.0.0.1:${FRONTEND_PORT}  (frontend)
#   api.dev.flitsas.online  -> 127.0.0.1:${GATEWAY_PORT}   (gateway / API publica)
#   core.dev.flitsas.online -> 127.0.0.1:${CORE_API_PORT}  (core-api, opcional/debug)
#   <dominio de cliente>    -> 127.0.0.1:${GATEWAY_PORT} (/api/v1) y 127.0.0.1:${FRONTEND_PORT} (/)
#                              (Marca Blanca, HU #12421 — catch-all sin entrada por cliente,
#                              ver deploy/edge/nginx/flit-network-domains.conf.example y
#                              deploy/edge/README.md)
#
# Postgres NO esta aqui: corre en el HOST (host.docker.internal:5432).
#
# Variables requeridas en .env (junto al compose):
#   CONNECTION_STRING_CORE  cadena Npgsql .NET (Host=...;Port=5432;Database=...;Username=...;Password=...)
#   CORS_ORIGIN             origen permitido del frontend (https://<env>.flitsas.online) y URL
#                           base de los enlaces de los correos de core-api (Bug #13194).
#                           OBLIGATORIA: sin ella `docker compose` aborta (ver servicio core-api)
#   CORS_ORIGIN_MARCA_BLANCA  segundo origen del gateway: dominio de marca blanca
#                             (https://marcablanca<env>.flitsas.online, mismo front)
#   VERIFIK_API_TOKEN       token Verifik (RUNT)
#   ICT_SERVICE_TOKEN_SECRET  secreto HMAC del canal gRPC este-oeste ICT (core-api <-> core-ict).
#                             Sin el, la orquestacion y el callback quedan fail-closed.
#   FLIT_INTERNAL_API_KEY   clave compartida Gateway <-> core-api para GET /internal/domains/active
#                           (Marca Blanca, #12417/#12421). Vacia = fail-closed (ver servicio gateway).
#   FLIT_INTERNAL_SUBNET    CIDR de la red interna Docker de ESTE stack (Marca Blanca, #12421) —
#                           DISTINTO por ambiente si DEV/QA/PDN comparten VPS (ver bloque `networks`
#                           al final de este archivo y deploy/edge/README.md).
# Variables de puerto (defaults DEV; el CD las inyecta por ambiente):
#   FRONTEND_PORT / GATEWAY_PORT / CORE_API_PORT / PYTHON_ML_PORT
# Variables para AISLAR este proyecto del resto del VPS:
#   COMPOSE_PROJECT_NAME    nombre del proyecto Compose (default: flitdev)
# Variables opcionales:
#   CORE_API_TAG / FRONTEND_TAG / PYTHON_ML_TAG   tag de imagen (default: latest)
#   VERIFIK_BASE_URL / VERIFIK_TIMEOUT_SECONDS
#
# NOTA: login deshabilitado temporalmente -> NO se requieren llaves JWT.
# NOTA: la imagen python-ml debe construirse/publicarse en el pipeline CD
#       (ghcr.io/flitsas/flitdev/python-ml) para que `docker compose pull` la encuentre.
# NOTA: todas las imagenes se publican en GHCR (ghcr.io). El VPS debe hacer
#       `docker login ghcr.io` (lo hace el CD con GHCR_PAT) antes del pull.
#
# Despliegue:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

# Nombre del proyecto: UNICO por proyecto en el VPS. Si dos repos comparten el
# mismo nombre, `up --remove-orphans` borra los contenedores del otro. Sobrescribir
# con COMPOSE_PROJECT_NAME en el .env de cada proyecto.
name: flitdev

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Configuracion del migrador V1 -> V2. UNA sola definicion para los DOS consumidores
# (`migrador`, por comando; `migracion-api`, por HTTP) porque ejecutan el MISMO motor.
#
# No es cosmetico: si los dos bloques divergieran —por ejemplo en TargetFileManager—
# uno subiria los binarios a un file-manager y el otro leeria de otro. Los adjuntos
# existirian en la tabla, el tramite se veria completo, y no abriria ninguno.
#
# REGLA: las TRES variables de origen (V1Source, SourceFileManager, V1Snapshot) tienen
# que apuntar al MISMO ambiente de V1. Los ids de V1 son enteros y se repiten entre
# ambientes: una base copia de pdn con la API de snapshot de dev le pide a dev el
# tramite 26350, que existe, es otro y es de otra empresa. No da error.
x-flitmig-env: &flitmig-env
  # ── Bases de datos ──
  # V1 es SOLO LECTURA: el migrador nunca escribe en el origen.
  FLITMIG_ConnectionStrings__V1Source: ${FLITMIG_V1_SOURCE}
  FLITMIG_ConnectionStrings__V2Target: ${FLITMIG_V2_TARGET:-${CONNECTION_STRING_CORE}}
  # ── Lote y usuario ──
  # En el endpoint HTTP este es el valor POR DEFECTO: cada peticion puede
  # sobreescribirlo con ?batchId=, para no reiniciar el contenedor entre olas.
  FLITMIG_Migration__BatchId: ${FLITMIG_BATCH_ID:-sin-lote}
  FLITMIG_Migration__SystemUserEmail: ${FLITMIG_SYSTEM_USER_EMAIL:-migracion.v1@flitsas.io}
  # NUNCA true en produccion: un NIT sin tenant es cuarentena, no algo que se
  # cree solo. tenant_id es NOT NULL pero SIN foreign key, asi que la base no
  # frena un id inventado y RLS esconderia los tramites de su dueño real.
  # El host HTTP ademas lo fuerza a false en codigo, pase lo que pase aqui.
  FLITMIG_Migration__CreateTenantIfMissing: "false"
  # ── Adjuntos (instancia 2) ──
  # Copy porque V2 se pasa a MinIO: origen y destino son stores distintos.
  # Reference solo valdria si V2 leyera del MISMO file-manager que V1.
  FLITMIG_Attachments__Mode: ${FLITMIG_ATTACHMENTS_MODE:-Copy}
  FLITMIG_SourceFileManager__BaseUrl: ${FLITMIG_SOURCE_FM_BASE_URL}
  FLITMIG_SourceFileManager__FilesPath: ${FLITMIG_SOURCE_FM_FILES_PATH:-api/v1/files}
  FLITMIG_SourceFileManager__AuthToken: ${FLITMIG_SOURCE_FM_AUTH_TOKEN:-}
  # MISMA URL que FileManager__BaseUrl de core-api. Ver el comentario del servicio.
  FLITMIG_TargetFileManager__BaseUrl: ${FILE_MANAGER_BASE_URL}
  FLITMIG_TargetFileManager__FilesPath: ${FLITMIG_TARGET_FM_FILES_PATH:-api/v1/files}
  FLITMIG_TargetFileManager__AuthToken: ${FLITMIG_TARGET_FM_AUTH_TOKEN:-}
  # ── Documentos generados (instancia 3) ──
  # API de V1 del MISMO ambiente, con el endpoint de snapshot desplegado.
  FLITMIG_V1Snapshot__BaseUrl: ${FLITMIG_V1_SNAPSHOT_BASE_URL:-}
  FLITMIG_V1Snapshot__AuthToken: ${FLITMIG_V1_SNAPSHOT_AUTH_TOKEN:-}
  FLITMIG_V1Snapshot__Include: ${FLITMIG_V1_SNAPSHOT_INCLUDE:-generated}
  FLITMIG_V1Snapshot__Consolidated: ${FLITMIG_V1_SNAPSHOT_CONSOLIDATED:-auto}

services:
  # ── Flit.Api (interno, detras de YARP) — CORE_API_PORT ────────────────────
  core-api:
    image: ghcr.io/flitsas/flitdev/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/api/Flit.Api.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # HU #13226: ancla — core-identity reusa TODO este bloque (misma llave de firma, clientes OIDC, correo, base), así
    # los dos procesos no pueden quedar con valores distintos. Lo que cambie aquí cambia en los dos.
    environment: &core-api-env
      # HU #13332 (Epic #13316): trazas y logs hacia el colector OTLP. Vacía = apagado (como hasta ahora).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # HU #12895 (FLIT Suite A-02) — nombre del ambiente .NET, igual en core-api, core-ict y gateway. Sin la variable
      # sigue en Development, como hoy. Tiene nombre propio (no ASPNETCORE_ENVIRONMENT) para que otra variable del .env
      # no lo cambie sin querer. Qué depende del nombre: docs/suite/frentes/a-inventario-ambientes.md.
      ASPNETCORE_ENVIRONMENT: ${FLIT_DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${CORE_API_PORT:-4003}
      ConnectionStrings__Core: ${CONNECTION_STRING_CORE}
      Cors__AllowedOrigins: ${CORS_ORIGIN}
      # URLs publicas que viajan en los CORREOS (Bug #13194). Este servicio corre con
      # ASPNETCORE_ENVIRONMENT=Development en los tres ambientes, asi que appsettings.QA.json
      # nunca se carga y sin estas lineas gana appsettings.json, que apunta a DEV: en QA y PDN
      # los enlaces de activacion y de recuperacion llevaban a dev.flitsas.online.
      # Salen de CORS_ORIGIN porque ya es "el front de ESTE ambiente" (sin barra final: el
      # navegador no la admite en un Origin) y QA/PDN ya la tienen bien, o su CORS fallaria.
      # SIN valor por defecto a proposito: un respaldo a DEV repetiria el bug en silencio.
      # Si falta, `docker compose` aborta antes de crear contenedores con el mensaje de abajo.
      # Los sufijos son los de appsettings.json; si cambian alla, cambian aqui. La recuperacion va a
      # /auth/reset-password: es la pagina que existe en el front (la /reset-password de appsettings.json no).
      Invitations__ActivateUrlBase: ${CORS_ORIGIN:?CORS_ORIGIN es obligatoria (URL publica del front de este ambiente, p. ej. https://qa.flitsas.online); definela en el .env del VPS}/invite/activate
      PasswordRecovery__ResetUrlBase: ${CORS_ORIGIN:?CORS_ORIGIN es obligatoria (URL publica del front de este ambiente, p. ej. https://qa.flitsas.online); definela en el .env del VPS}/auth/reset-password
      Notifications__EmailAssets__BaseUrl: ${CORS_ORIGIN:?CORS_ORIGIN es obligatoria (URL publica del front de este ambiente, p. ej. https://qa.flitsas.online); definela en el .env del VPS}/email-assets
      PublicBranding__PublicBaseUrl: ${CORS_ORIGIN:?CORS_ORIGIN es obligatoria (URL publica del front de este ambiente, p. ej. https://qa.flitsas.online); definela en el .env del VPS}
      # Marca Blanca (#12417/#12421): MISMA clave que Internal__ApiKey del servicio gateway
      # de abajo. Si difieren, el Gateway no puede autenticar GET /internal/domains/active
      # (responde 401 SIEMPRE) y su CORS dinamico cae a la lista fija de Cors__AllowedOrigins__0
      # — los dominios de red activos dejan de aceptarse hasta que coincidan. Vacia en ambos
      # lados = fail-closed (comportamiento de hoy, sin dominios de red).
      Internal__ApiKey: ${FLIT_INTERNAL_API_KEY:-}
      # File Manager: DONDE LEE V2 los binarios de los adjuntos. Sin esta variable
      # cae al default de appsettings.json, que apunta a AWS pdn. Al pasar V2 a MinIO
      # hay que definirla, y tiene que ser EXACTAMENTE la misma URL que recibe el
      # migrador en FLITMIG_TargetFileManager__BaseUrl: si difieren, el migrador sube
      # a un sitio y la API lee de otro, los adjuntos migrados existen en la tabla
      # pero no abren. Falla en silencio.
      FileManager__BaseUrl: ${FILE_MANAGER_BASE_URL:-https://ny46zhyeti.execute-api.us-east-1.amazonaws.com/pdn/}
      # Bearer del file-manager. El legado es publico y el de MinIO de la 177 tambien,
      # asi que por defecto va VACIO y no se manda cabecera: comportamiento de siempre.
      # El file-manager sobre Contabo (filemanager.flitsas.com) SI lo exige y responde
      # 401 sin el. Tiene que ir en el MISMO valor que en core-ict (ADR-0057).
      FileManager__AuthToken: ${FILE_MANAGER_AUTH_TOKEN:-}
      # HU #12895 (A-02) — lo que antes decidía el nombre del ambiente, ahora explícito. Los valores por defecto son los
      # de hoy (los tres ambientes corren como Development), así que desplegar esto no cambia nada. Cada uno se apaga
      # con una línea en el .env:
      #   FLIT_SEED_RBAC_CATALOG  roles de sistema, módulos, permisos y catálogo de organismos (dejar en true)
      #   FLIT_SEED_DEMO_USERS    cuentas demo con contraseña fija y sus empresas (false fuera de DEV)
      #   FLIT_SWAGGER_ENABLED    /swagger público (false en PDN)
      #   SMTP_USE_CONSOLE_WHEN_NO_HOST  sin SMTP_HOST, el correo sale por consola en vez de fallar
      #   FLIT_DEV_SEED           las migraciones de datos demo también siembran con otro nombre de ambiente
      Seed__RbacCatalog: ${FLIT_SEED_RBAC_CATALOG:-true}
      Seed__DemoUsers: ${FLIT_SEED_DEMO_USERS:-true}
      Swagger__Enabled: ${FLIT_SWAGGER_ENABLED:-true}
      Smtp__UseConsoleWhenNoHost: ${SMTP_USE_CONSOLE_WHEN_NO_HOST:-true}
      FLIT_DEV_SEED: ${FLIT_DEV_SEED:-}
      # HU #12896 (FLIT Suite A-03) — la API firma con una llave PERSISTENTE (security.jwt_signing_keys,
      # cifrada con Data Protection) en vez de una efímera que cambiaba en cada despliegue, y VALIDA firma,
      # emisor, audiencia y vencimiento de sus tokens. Antes aceptaba cualquier token (a-inventario-ambientes.md,
      # punto 4). No requiere llaves en el .env. Si algo fallara, poner JWT_VALIDATE_ISSUED_TOKENS=false en el .env
      # vuelve al comportamiento anterior sin redesplegar código.
      Jwt__PersistSigningKey: ${JWT_PERSIST_SIGNING_KEY:-true}
      Jwt__ValidateIssuedTokens: ${JWT_VALIDATE_ISSUED_TOKENS:-true}
      # FLIT Suite — prefijo de ambiente de los hosts (contrato §1): dev, qa o vacío en PDN. Lo exporta el CD según la
      # rama; sin él, me/apps y el emisor OIDC apuntarían a los hosts de PDN.
      Suite__Hosts__Environment: ${FLIT_SUITE_ENV?FLIT_SUITE_ENV debe estar definida (dev, qa o vacía en PDN); sin ella los clientes OIDC se reescriben con los hosts de PDN}
      # HU #12990 (A-05) — servidor OIDC del hub. Apagado: /connect/* responde 404 y el login actual no cambia.
      Suite__Oidc__Enabled: ${FLIT_OIDC_ENABLED:-false}
      # HU #13333 (Epic #13316, contrato v1.3 §3): secretos de los clientes de servicio, uno por servicio y por ambiente.
      # Vacío = el cliente no se registra (como hasta ahora). Los scopes de cada uno están en appsettings.json.
      Suite__Oidc__ServiceClients__svc-tramites__Secret: ${SVC_TRAMITES_CLIENT_SECRET:-}
      Suite__Oidc__ServiceClients__svc-ict__Secret: ${SVC_ICT_CLIENT_SECRET:-}
      Suite__Oidc__ServiceClients__svc-consultas__Secret: ${SVC_CONSULTAS_CLIENT_SECRET:-}
      Suite__Oidc__ServiceClients__svc-notificaciones__Secret: ${SVC_NOTIFICACIONES_CLIENT_SECRET:-}
      Suite__Oidc__ServiceClients__svc-identidad__Secret: ${SVC_IDENTIDAD_CLIENT_SECRET:-}
      # Verifik se configura por env vars CRUDAS (no por convención .NET `Verifik__`):
      # InfrastructureExtensions lee Environment.GetEnvironmentVariable("VERIFIK_*").
      # Pasar las claves `Verifik__*` NO funciona (el código no las lee) → token vacío → 401.
      VERIFIK_API_TOKEN: ${VERIFIK_API_TOKEN:-}
      VERIFIK_BASE_URL: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      VERIFIK_TIMEOUT_SECONDS: ${VERIFIK_TIMEOUT_SECONDS:-30}
      # Modos real|mock por proveedor (explícitos para un deploy determinista).
      VERIFIK_VEHICLE_MODE: ${VERIFIK_VEHICLE_MODE:-real}
      VERIFIK_CONDUCTOR_MODE: ${VERIFIK_CONDUCTOR_MODE:-mock}
      VERIFIK_SIMIT_MODE: ${VERIFIK_SIMIT_MODE:-mock}
      VERIFIK_RNMC_MODE: ${VERIFIK_RNMC_MODE:-mock}
      VERIFIK_RUES_MODE: ${VERIFIK_RUES_MODE:-mock}
      INTEMPO_MODE: ${INTEMPO_MODE:-mock}
      # Avalúo Fasecolda (Feature #10707). Mismo patrón CRUDO que Verifik/Kyverum:
      # InfrastructureExtensions lee Environment.GetEnvironmentVariable("FASECOLDA_*");
      # pasar `Fasecolda__*` NO funciona. Sin FASECOLDA_MODE el proveedor cae a mock y
      # suggested-value responde "Sin valor de referencia mock para el VIN".
      # Credenciales solo en el .env del VPS — NUNCA en el repo.
      FASECOLDA_MODE: ${FASECOLDA_MODE:-mock}
      FASECOLDA_API_USERNAME: ${FASECOLDA_API_USERNAME:-}
      FASECOLDA_API_PASSWORD: ${FASECOLDA_API_PASSWORD:-}
      FASECOLDA_BY_VIN_API_BASE_URL: ${FASECOLDA_BY_VIN_API_BASE_URL:-https://fasecoldaback.quantil.co}
      FASECOLDA_BY_VIN_API_PATH: ${FASECOLDA_BY_VIN_API_PATH:-/api/busquedaVin}
      FASECOLDA_API_BASE_URL: ${FASECOLDA_API_BASE_URL:-https://guiadevalores.fasecolda.com/apifasecolda}
      FASECOLDA_AUTH_API_PATH: ${FASECOLDA_AUTH_API_PATH:-/token}
      FASECOLDA_LIST_CODE_API_PATH: ${FASECOLDA_LIST_CODE_API_PATH:-/api/listacodigosid/consultabycodigo}
      FASECOLDA_API_GRANT_TYPE: ${FASECOLDA_API_GRANT_TYPE:-password}
      FASECOLDA_API_SECONDS_TIMEOUT: ${FASECOLDA_API_SECONDS_TIMEOUT:-55}
      # HU #10970 — modo por AMBIENTE de las validaciones transversales del ciclo de vida:
      #   · CF-01 duplicidad de trámite en curso (409 DUPLICATE_ACTIVE_PROCEDURE)
      #   · CF-03 precondición registral / vehículo ya matriculado (422 VEHICLE_STATE_INVALID_FOR_TYPE)
      # Valores: block (bloquea) | warn (no bloquea, deja el check amarillo) | off (no evalúa).
      # Este compose es el MISMO en DEV, QA y PDN y los tres corren con ASPNETCORE_ENVIRONMENT=Development,
      # así que el ambiente se distingue por el .env del VPS, NO por appsettings.{Environment}.json.
      # Default block en los tres: si el .env no define la variable, la regla sigue bloqueando (fail-safe).
      # Matriz acordada: DEV warn/warn · QA block/warn · PDN block/block (local va por appsettings.Development.json).
      TramiteValidations__DuplicateActiveProcedure__Mode: ${TRAMITE_VALIDATION_DUPLICATE_MODE:-block}
      TramiteValidations__VehicleRegistrationState__Mode: ${TRAMITE_VALIDATION_VEHICLE_STATE_MODE:-block}
      # Cambio de carrocería sobre un vehículo que el RUNT reporta SIN CARROCERIA (o sin el dato).
      TramiteValidations__VehicleBodyTypeRequired__Mode: ${TRAMITE_VALIDATION_BODY_TYPE_MODE:-block}
      # HU #13143 (ADR-0066) — el trámite que se radica necesita un mandatario activo, vigente y con firma
      # válida (409 mandatario_no_configurado / mandatario_firma_invalida). EXCEPCIÓN DELIBERADA al patrón
      # block de las demás: el default es warn porque el código nuevo con datos sin migrar (firma física,
      # OT legados sin mandatarios) detendría radicaciones en PDN. El paso a block es solo esta variable en
      # el .env del VPS (TRAMITE_VALIDATION_MANDATARIO_MODE=block) más un reinicio, sin despliegue; lo decide
      # el Líder Técnico tras migrar la firma física. En código, ausente o inválido resuelve a block.
      TramiteValidations__MandatarioRequerido__Mode: ${TRAMITE_VALIDATION_MANDATARIO_MODE:-warn}
      # SMTP — vars ya presentes en el .env del VPS
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Smtp__DisableAuthentication: ${SMTP_DISABLE_AUTH:-false}
      Smtp__DefaultSenderEmail: ${SMTP_FROM:-}
      Smtp__DefaultSenderPassword: ${SMTP_PASSWORD:-}
      Smtp__DefaultSenderName: ${SMTP_FROM_NAME:-FLIT Tramites}
      # Comprobación de revocación (CRL/OCSP) del certificado del servidor SMTP. Default true:
      # un despliegue que no defina la variable sigue comprobándola. Ponerla en false NO
      # desactiva la validación TLS —cadena, emisor, host y vigencia se siguen verificando—,
      # solo deja de consultarse si el certificado fue revocado antes de expirar. Se expone
      # porque en redes con proxy o antivirus que inspecciona TLS la consulta de revocación no
      # llega, y el handshake falla ANTES de autenticar (visto en local el 2026-08-11).
      Smtp__CheckCertificateRevocation: ${SMTP_CHECK_CERT_REVOCATION:-true}
      # Biometría (HU #10233 — Kyverum Verify). Mismo patrón que Verifik: el código
      # lee env vars CRUDAS (BIOMETRICS_PROVIDER / KYVERUM_*), no `Kyverum__*`.
      # Default mock ⇒ no rompe regresión si el .env no define el proveedor.
      BIOMETRICS_PROVIDER: ${BIOMETRICS_PROVIDER:-mock}
      KYVERUM_API_KEY: ${KYVERUM_API_KEY:-}
      KYVERUM_BASE_URL: ${KYVERUM_BASE_URL:-https://verify.kyverum.com}
      KYVERUM_AUTH_SCHEME: ${KYVERUM_AUTH_SCHEME:-Bearer}
      KYVERUM_TIMEOUT_SECONDS: ${KYVERUM_TIMEOUT_SECONDS:-30}
      KYVERUM_WEBHOOK_CALLBACK_URL: ${KYVERUM_WEBHOOK_CALLBACK_URL:-}
      # Kyverum RUNT — dominio DISTINTO de Kyverum Verify (runt.kyverum.com vs
      # verify.kyverum.com): mismo proveedor, otro producto y otra API key/scope.
      # UN SOLO bloque alimenta DOS consumidores porque comparten ImprontaRuntOptions:
      #   · improntas (HU #10465, ImprontaRuntClient — endpoint improntas:generar)
      #   · consultas RUNT (HU #10478, KyverumRuntApiClient — vehículo/conductor default,
      #     con fallback a Verifik).
      # Mismo patrón CRUDO: InfrastructureExtensions.AddImprontas lee
      # Environment.GetEnvironmentVariable("KYVERUM_RUNT_*"), NO `ImprontaRunt__*`.
      KYVERUM_RUNT_BASE_URL: ${KYVERUM_RUNT_BASE_URL:-https://runt.kyverum.com}
      KYVERUM_RUNT_API_KEY: ${KYVERUM_RUNT_API_KEY:-}
      KYVERUM_RUNT_AUTH_SCHEME: ${KYVERUM_RUNT_AUTH_SCHEME:-Bearer}
      KYVERUM_RUNT_TIMEOUT_SECONDS: ${KYVERUM_RUNT_TIMEOUT_SECONDS:-30}
      # OCR de trámites (Anthropic). Mismo patrón: el código lee env vars CRUDAS
      # (OCR_PROVIDER / ANTHROPIC_*), no `Anthropic__*`. Default mock ⇒ no rompe si el .env no lo define.
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-60}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2000}
      # DR. FLIT (Épica #12718, ADR-0060): chat con LLM sobre el manual, mismo cliente y API key del
      # OCR. Env CRUDAS igual que arriba. DR_FLIT_DEPLOY_ENVIRONMENT (DEV|QA|PDN) va al campo
      # Custom.Environment del caso de soporte: NO se infiere de ASPNETCORE_ENVIRONMENT (los 3 VPS
      # corren Development) y por omisión es DEV, nunca PDN. DR_FLIT_ADO_PAT: PAT de la cuenta de
      # servicio "Dr. FLIT" (Work Items R/W solo en FLIT - SOPORTE); vacío ⇒ los casos responden 502.
      ANTHROPIC_DRFLIT_ENABLED: ${ANTHROPIC_DRFLIT_ENABLED:-true}
      ANTHROPIC_DRFLIT_MODEL: ${ANTHROPIC_DRFLIT_MODEL:-claude-haiku-4-5}
      ANTHROPIC_DRFLIT_DAILY_MESSAGE_LIMIT: ${ANTHROPIC_DRFLIT_DAILY_MESSAGE_LIMIT:-30}
      DR_FLIT_DEPLOY_ENVIRONMENT: ${DR_FLIT_DEPLOY_ENVIRONMENT:-DEV}
      DR_FLIT_ADO_PAT: ${DR_FLIT_ADO_PAT:-}
      # ── Integración con Terceros (ICT, Feature #10888) ──────────────────────
      # gRPC este-oeste dedicado (SOLO HTTP/2, puerto aparte del REST): core-ict llama la
      # orquestación/consulta aquí. Puerto interno (no publicado a host).
      Ict__GrpcPort: ${CORE_API_GRPC_PORT:-8082}
      # Secreto HMAC compartido con core-ict (valida el canal directo y firma el inverso).
      Ict__ServiceToken__Secret: ${ICT_SERVICE_TOKEN_SECRET:-}
      # Epic #13316 (HU #13335): transición al token de servicio de Identidad (svc-ict). AcceptIdentity=true acepta
      # además el de Identidad; AcceptLegacy=false es el corte (el HMAC deja de entrar). Sin tocarlas, como siempre.
      Ict__ServiceToken__AcceptIdentity: ${ICT_SERVICE_TOKEN_ACCEPT_IDENTITY:-false}
      Ict__ServiceToken__AcceptLegacy: ${ICT_SERVICE_TOKEN_ACCEPT_LEGACY:-true}
      # Epic #13316 (HU #13344): Consultas remoto (core-consultas). Apagado por defecto: core-api consulta en proceso como
      # siempre. Encendido, la configuración por empresa que guarda el SuperAdmin también va a Consultas. core-api pide su
      # token de servicio como svc-tramites (SVC_TRAMITES_CLIENT_SECRET).
      Consultas__Remoto__Habilitado: ${CONSULTAS_REMOTO_HABILITADO:-false}
      Consultas__Remoto__Address: ${CONSULTAS_REMOTO_ADDRESS:-http://core-consultas:8084}
      # HU #13346: si core-consultas no responde, Trámites consulta en proceso (y lo registra). false = «consulta no disponible».
      Consultas__Remoto__Respaldo: ${CONSULTAS_REMOTO_RESPALDO:-true}
      # HU #13351: Kyverum Verify por Consultas y su aviso por el bus (exige TRAMITES_BUS_HABILITADO=true).
      Consultas__Remoto__ValidacionIdentidad: ${CONSULTAS_REMOTO_VALIDACION_IDENTIDAD:-false}
      # HU #13350: Trámites publica sus eventos en flit.tramites (outbox del SDK). Apagado por defecto. Encendido necesita
      # el broker (perfil bus) y el usuario tramites (deploy/rabbitmq/usuario-de-servicio.sh tramites "$CLAVE").
      # TRAMITES_BUS_ENTREGA_EN_PROCESO=false solo en el corte (#13359): sin ella dejan de salir correo, webhook OT y reflejo ICT.
      Tramites__Bus__Habilitado: ${TRAMITES_BUS_HABILITADO:-false}
      Tramites__Bus__EntregaEnProceso: ${TRAMITES_BUS_ENTREGA_EN_PROCESO:-true}
      Platform__Messaging__Producer: tramites
      Platform__Messaging__ConnectionString: ${RABBITMQ_URL_TRAMITES:-}
      Platform__ServiceClient__ClientId: svc-tramites
      Platform__ServiceClient__ClientSecret: ${SVC_TRAMITES_CLIENT_SECRET:-}
      Platform__ServiceClient__TokenEndpoint: http://gateway:${GATEWAY_PORT:-4002}/connect/token
      # Plano C: reflejo del estado del trámite hacia core-ict (callback gRPC).
      Ict__StateCallback__Address: http://core-ict:${CORE_ICT_PORT:-4020}
      # ── Canal de notificaciones "API Renting cliente" (Feature #11348) ──────
      # Mismo patrón CRUDO que Verifik/Kyverum/Fasecolda: el código lee
      # Environment.GetEnvironmentVariable("RENTING_API_*"); pasar `Notifications__Renting__*`
      # NO funciona. Plantilla completa y trampas en .env.renting.example.
      # OPT-IN: con RENTING_API_ENABLED distinto de "true" no se exige ninguna de las demás
      # ni el certificado, y el servicio arranca igual que hoy.
      RENTING_API_ENABLED: ${RENTING_API_ENABLED:-false}
      # Ruta ABSOLUTA del .pfx. Se interpola con EL MISMO VALOR aquí y en la sección volumes a
      # propósito: el archivo se monta dentro del contenedor en la misma ruta que tiene en el
      # HOST. Así este nombre significa UNA sola cosa y `ls -l <ruta>` en el VPS comprueba
      # exactamente el archivo que la app va a abrir (antes eran dos rutas distintas con el
      # mismo nombre de variable, y el error de "no se encontró el certificado" no daba forma
      # de comprobar cuál de las dos estaba mal).
      # TRAMPA de Docker: si el archivo NO existe en el host, el bind mount no falla — Docker
      # crea un DIRECTORIO vacío en esa ruta y lo monta. La app reporta que no encuentra el
      # certificado aunque `ls` muestre algo ahí. Hay que borrar ese directorio (rmdir) ANTES
      # de dejar el .pfx y recrear el contenedor.
      RENTING_API_PFX_CERTIFICATE_PATH: ${RENTING_API_PFX_CERTIFICATE_PATH:-/opt/certs/email/renting.rc.prod.pfx}
      RENTING_API_PASSPHRASE: ${RENTING_API_PASSPHRASE:-}
      RENTING_API_BASE_URL: ${RENTING_API_BASE_URL:-}
      RENTING_API_KEY_NAME: ${RENTING_API_KEY_NAME:-Ocp-Apim-Subscription-Key}
      RENTING_API_KEY_VALUE: ${RENTING_API_KEY_VALUE:-}
      RENTING_API_SECONDS_TIMEOUT: ${RENTING_API_SECONDS_TIMEOUT:-30}
      RENTING_API_LOGIN_PATH: ${RENTING_API_LOGIN_PATH:-}
      RENTING_API_LOGIN_SECONDS_TIMEOUT: ${RENTING_API_LOGIN_SECONDS_TIMEOUT:-30}
      # Debe coincidir CARÁCTER A CARÁCTER con el Subject del .pfx montado, o no arranca.
      RENTING_API_LOGIN_SUBJECT: ${RENTING_API_LOGIN_SUBJECT:-}
      # No se exige al arrancar (default vacío) pero el login la manda como "secretName":
      # si falta, el servicio arranca sin quejarse y el login falla en caliente.
      RENTING_API_LOGIN_SECRET_NAME: ${RENTING_API_LOGIN_SECRET_NAME:-}
      RENTING_API_LOGIN_CACHE_KEY: ${RENTING_API_LOGIN_CACHE_KEY:-renting-api-login-token}
      RENTING_API_LOGIN_CACHE_SECONDS_TTL: ${RENTING_API_LOGIN_CACHE_SECONDS_TTL:-3600}
      RENTING_API_SEND_EMAIL_PATH: ${RENTING_API_SEND_EMAIL_PATH:-RentingNotification/emailNotification/sendEmailFile}
      RENTING_API_SEND_EMAIL_SECONDS_TIMEOUT: ${RENTING_API_SEND_EMAIL_SECONDS_TIMEOUT:-30}
      RENTING_API_SEND_EMAIL_SENDER_EMAIL: ${RENTING_API_SEND_EMAIL_SENDER_EMAIL:-}
      RENTING_API_SEND_EMAIL_SENDER_USERNAME: "${RENTING_API_SEND_EMAIL_SENDER_USERNAME:-Tramites Renting}"
      RENTING_API_SEND_EMAIL_DEFAULT_SENDER_EMAIL: ${RENTING_API_SEND_EMAIL_DEFAULT_SENDER_EMAIL:-}
      RENTING_API_SEND_EMAIL_DEFAULT_SENDER_USERNAME: "${RENTING_API_SEND_EMAIL_DEFAULT_SENDER_USERNAME:-Tramites Vehiculos}"
      # ATENCIÓN — ADR-0044 (2026-08-12): el desvío de destinatario YA NO lo decide
      # ASPNETCORE_ENVIRONMENT (este servicio corre con Development en DEV, QA y PDN por igual,
      # ver arriba). Lo decide, únicamente, RENTING_API_SEND_EMAIL_REAL_RECIPIENTS_ENABLED:
      # "true" ⇒ envía a destinatarios REALES; "false"/vacío ⇒ desvía al buzón de control.
      # Default de este compose: true (envío real). Para desviar en un ambiente, declarar
      # RENTING_API_SEND_EMAIL_REAL_RECIPIENTS_ENABLED=false en el .env de ese despliegue.
      # Cualquier otro valor no vacío tumba el arranque a propósito (no degrada en silencio).
      # RENTING_API_SEND_EMAIL_DEVELOPMENT_RECIPIENT_OVERRIDE_ENABLED queda DEROGADA: su sola
      # presencia (con el canal encendido) tumba el arranque con un mensaje de migración — no la
      # declares en ningún despliegue. Única excepción al desvío (aplica en ambos modos): los
      # envíos del banco de pruebas de notificaciones, que van a su buzón configurado (decisión
      # del PO 2026-08-11) — no aplica a los envíos reales de notificaciones. Ver .env.renting.example.
      RENTING_API_SEND_EMAIL_REAL_RECIPIENTS_ENABLED: ${RENTING_API_SEND_EMAIL_REAL_RECIPIENTS_ENABLED:-true}
      RENTING_API_SEND_EMAIL_DEVELOPMENT_RECIPIENT_EMAIL: ${RENTING_API_SEND_EMAIL_DEVELOPMENT_RECIPIENT_EMAIL:-}
      RENTING_API_SEND_EMAIL_DEVELOPMENT_RECIPIENT_USERNAME: "${RENTING_API_SEND_EMAIL_DEVELOPMENT_RECIPIENT_USERNAME:-Equipo de desarrollo FLIT}"
    volumes:
      # Certificado cliente mTLS del canal API Renting. Solo lectura; NUNCA dentro de la
      # imagen ni en el repositorio. Vence el 2027-03-22.
      # MISMA RUTA a ambos lados (host:contenedor) — ver RENTING_API_PFX_CERTIFICATE_PATH
      # arriba. El certificado se abre en el PRIMER ENVÍO del canal, no al arrancar: un .pfx
      # ausente o ilegible NO impide que el servicio levante, se manifiesta como un envío
      # fallido. No confíes en que un arranque limpio signifique canal operativo.
      - ${RENTING_API_PFX_CERTIFICATE_PATH:-/opt/certs/email/renting.rc.prod.pfx}:${RENTING_API_PFX_CERTIFICATE_PATH:-/opt/certs/email/renting.rc.prod.pfx}:ro
    ports:
      - "127.0.0.1:${CORE_API_PORT:-4003}:${CORE_API_PORT:-4003}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${CORE_API_PORT:-4003}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${CORE_API_MEM_LIMIT:-0}
    cpus: ${CORE_API_CPUS:-0}
    oom_score_adj: ${CORE_API_OOM_SCORE_ADJ:-0}
    logging: *default-logging

  # ── core-identity (Epic #13217, HU #13233) — CORE_IDENTITY_PORT ──────────────
  # El servicio de identidad de la FLIT Suite, con su propia imagen (services/core-identity): login (el de siempre y
  # OIDC del hub), recuperación de cuenta, productos de la empresa y marca pública. No carga Trámites ni corre procesos
  # de negocio ni migraciones (las corre core-api). Ver docs/suite/identidad-frontera.md.
  # Perfil "identity": no arranca si no se pide (COMPOSE_PROFILES=identity), y aun arrancado no recibe tráfico hasta
  # que el gateway tenga FLIT_IDENTITY_CLUSTER_ENABLED=true. Volver atrás = apagar esa bandera.
  # Sin depends_on de core-api a propósito: tiene que poder arrancar aunque core-api esté caído.
  core-identity:
    profiles: ["identity"]
    image: ghcr.io/flitsas/flitdev/core-identity:${CORE_IDENTITY_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Mismo bloque de variables que core-api (ancla): llave de firma, clientes OIDC, correo, base. Lo que cambie allá
      # cambia aquí; si difirieran, un proceso rechazaría los tokens del otro.
      <<: *core-api-env
      ASPNETCORE_URLS: http://+:${CORE_IDENTITY_PORT:-4025}
      # Epic #13316 (HU #13334): gRPC de Identidad (flit.identidad.v1) para los demás servicios, solo en la red interna
      # (sin mapeo en ports, como el 8082 de core-api). Sin la variable no escucha gRPC: todo queda como antes.
      Identidad__GrpcPort: ${CORE_IDENTITY_GRPC_PORT:-}
    volumes:
      # Mismo certificado del canal API Renting que core-api: identidad envía los correos de recuperación e invitación.
      - ${RENTING_API_PFX_CERTIFICATE_PATH:-/opt/certs/email/renting.rc.prod.pfx}:${RENTING_API_PFX_CERTIFICATE_PATH:-/opt/certs/email/renting.rc.prod.pfx}:ro
    ports:
      - "127.0.0.1:${CORE_IDENTITY_PORT:-4025}:${CORE_IDENTITY_PORT:-4025}"
    healthcheck:
      # Listo = base alcanzable y sin migraciones que falten (no solo «vivo»). El gateway también lo consulta.
      test: ["CMD", "wget", "-qO-", "http://localhost:${CORE_IDENTITY_PORT:-4025}/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${CORE_IDENTITY_MEM_LIMIT:-0}
    cpus: ${CORE_IDENTITY_CPUS:-0}
    oom_score_adj: ${CORE_IDENTITY_OOM_SCORE_ADJ:-0}
    logging: *default-logging

  # ── rabbitmq (Epic #13316, HU #13349) — bus de eventos, perfil "bus" ─────────
  # Un broker por ambiente (ADR-0064) hasta k3s. Vhost "flit" y exchanges de los productores desde
  # deploy/rabbitmq/definitions.json; un usuario por servicio con deploy/rabbitmq/usuario-de-servicio.sh. AMQP solo en
  # la red interna; la consola de administración solo en 127.0.0.1 (túnel SSH). Ver deploy/rabbitmq/README.md.
  rabbitmq:
    profiles: ["bus"]
    image: rabbitmq:4.1-management-alpine
    # Nombre de nodo fijo: el volumen guarda los datos por nombre de nodo.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-flit-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:-}
    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-flit.conf:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-4672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: *restart
    mem_limit: ${RABBITMQ_MEM_LIMIT:-0}
    logging: *default-logging

  # ── core-consultas (Epic #13316, HU #13347) — CORE_CONSULTAS_PORT / CORE_CONSULTAS_GRPC_PORT, sin publicar ──
  # Consultas a proveedores como servicio (ADR-0065): Trámites e ICT lo llaman por gRPC en la red interna. Perfil
  # "consultas": no arranca si no se pide (COMPOSE_PROFILES=...,consultas). Sin `ports`: ni REST ni gRPC se publican.
  # Si falta configuración o el secreto de un proveedor en modo real, no arranca y el log dice qué variable falta.
  # Pasos en docs/suite/handoff-vps-suite.md §4.9.
  core-consultas:
    profiles: ["consultas"]
    image: ghcr.io/flitsas/flitdev/core-consultas:${CORE_CONSULTAS_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${FLIT_DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${CORE_CONSULTAS_PORT:-4026}
      Servicio__GrpcPort: ${CORE_CONSULTAS_GRPC_PORT:-8084}
      # Usuario de base dueño del esquema consultas (deploy/postgres/servicio-con-esquema-propio.sql).
      ConnectionStrings__Servicio: ${CONNECTION_STRING_CONSULTAS:-}
      Platform__ServiceClient__ClientSecret: ${SVC_CONSULTAS_CLIENT_SECRET:-}
      Platform__ServiceClient__TokenEndpoint: http://gateway:${GATEWAY_PORT:-4002}/connect/token
      Platform__Auth__JwksUri: http://gateway:${GATEWAY_PORT:-4002}/.well-known/jwks.json
      Platform__Auth__Issuers__0: ${FLIT_HUB_URL:-https://dev.flitsas.online}/
      # Su usuario del broker (deploy/rabbitmq/usuario-de-servicio.sh consultas).
      Platform__Messaging__ConnectionString: ${RABBITMQ_URL_CONSULTAS:-amqp://consultas:sin-clave@rabbitmq:5672/flit}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Proveedores: las MISMAS variables que hoy tiene core-api (hasta el corte, HU #13348, conviven en los dos).
      VERIFIK_API_TOKEN: ${VERIFIK_API_TOKEN:-}
      VERIFIK_BASE_URL: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      VERIFIK_TIMEOUT_SECONDS: ${VERIFIK_TIMEOUT_SECONDS:-30}
      VERIFIK_VEHICLE_MODE: ${VERIFIK_VEHICLE_MODE:-real}
      VERIFIK_CONDUCTOR_MODE: ${VERIFIK_CONDUCTOR_MODE:-mock}
      VERIFIK_SIMIT_MODE: ${VERIFIK_SIMIT_MODE:-mock}
      VERIFIK_RNMC_MODE: ${VERIFIK_RNMC_MODE:-mock}
      VERIFIK_RUES_MODE: ${VERIFIK_RUES_MODE:-mock}
      INTEMPO_MODE: ${INTEMPO_MODE:-mock}
      FASECOLDA_MODE: ${FASECOLDA_MODE:-mock}
      FASECOLDA_API_USERNAME: ${FASECOLDA_API_USERNAME:-}
      FASECOLDA_API_PASSWORD: ${FASECOLDA_API_PASSWORD:-}
      FASECOLDA_BY_VIN_API_BASE_URL: ${FASECOLDA_BY_VIN_API_BASE_URL:-https://fasecoldaback.quantil.co}
      FASECOLDA_BY_VIN_API_PATH: ${FASECOLDA_BY_VIN_API_PATH:-/api/busquedaVin}
      FASECOLDA_API_BASE_URL: ${FASECOLDA_API_BASE_URL:-https://guiadevalores.fasecolda.com/apifasecolda}
      FASECOLDA_AUTH_API_PATH: ${FASECOLDA_AUTH_API_PATH:-/token}
      FASECOLDA_LIST_CODE_API_PATH: ${FASECOLDA_LIST_CODE_API_PATH:-/api/listacodigosid/consultabycodigo}
      FASECOLDA_API_GRANT_TYPE: ${FASECOLDA_API_GRANT_TYPE:-password}
      FASECOLDA_API_SECONDS_TIMEOUT: ${FASECOLDA_API_SECONDS_TIMEOUT:-55}
      KYVERUM_RUNT_BASE_URL: ${KYVERUM_RUNT_BASE_URL:-https://runt.kyverum.com}
      KYVERUM_RUNT_API_KEY: ${KYVERUM_RUNT_API_KEY:-}
      KYVERUM_RUNT_AUTH_SCHEME: ${KYVERUM_RUNT_AUTH_SCHEME:-Bearer}
      KYVERUM_RUNT_TIMEOUT_SECONDS: ${KYVERUM_RUNT_TIMEOUT_SECONDS:-30}
      # HU #13351: Kyverum Verify por Consultas (misma llave que core-api). La URL del aviso es la del receptor de
      # Consultas (https://<host>/api/v1/consultas/avisos/kyverum-verify), distinta de la de core-api.
      KYVERUM_API_KEY: ${KYVERUM_API_KEY:-}
      KYVERUM_BASE_URL: ${KYVERUM_BASE_URL:-https://verify.kyverum.com}
      KYVERUM_AUTH_SCHEME: ${KYVERUM_AUTH_SCHEME:-Bearer}
      KYVERUM_TIMEOUT_SECONDS: ${KYVERUM_TIMEOUT_SECONDS:-30}
      KYVERUM_WEBHOOK_CALLBACK_URL: ${CONSULTAS_KYVERUM_WEBHOOK_CALLBACK_URL:-}
    healthcheck:
      # Listo = base alcanzable y sin migraciones pendientes (aplica las suyas al arrancar, solo su esquema).
      test: ["CMD", "wget", "-qO-", "http://localhost:${CORE_CONSULTAS_PORT:-4026}/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    mem_limit: ${CORE_CONSULTAS_MEM_LIMIT:-0}
    cpus: ${CORE_CONSULTAS_CPUS:-0}
    logging: *default-logging

  # ── Flit.Ict.Api (Integración con Terceros, detras de YARP) — CORE_ICT_PORT ─
  core-ict:
    image: ghcr.io/flitsas/flitdev/core-ict:${CORE_ICT_TAG:-latest}
    # content root = working_dir, para que .NET encuentre su appsettings.json (dll en /app/api).
    working_dir: /app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # HU #12895 (A-02) — mismo nombre de ambiente que core-api (ver su comentario).
      ASPNETCORE_ENVIRONMENT: ${FLIT_DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${CORE_ICT_PORT:-4020}
      Urls: http://0.0.0.0:${CORE_ICT_PORT:-4020}
      # HU #12895 (A-02) — misma variable que core-api.
      Swagger__Enabled: ${FLIT_SWAGGER_ENABLED:-true}
      ConnectionStrings__Core: ${CONNECTION_STRING_CORE}
      # gRPC hacia core-api (orquestación + consultas): puerto interno dedicado HTTP/2.
      CoreApiGrpc__Address: http://core-api:${CORE_API_GRPC_PORT:-8082}
      # Secreto HMAC compartido con core-api (canal directo e inverso).
      Ict__ServiceToken__Secret: ${ICT_SERVICE_TOKEN_SECRET:-}
      # Epic #13316 (HU #13335): con UseIdentity=true core-ict pide su token a Identidad (cliente svc-ict, mismo secreto
      # que SVC_ICT_CLIENT_SECRET) en vez de firmar el HMAC. Encenderla solo después de AcceptIdentity en core-api.
      Ict__ServiceToken__UseIdentity: ${ICT_SERVICE_TOKEN_USE_IDENTITY:-false}
      Ict__ServiceToken__TokenEndpoint: ${ICT_IDENTITY_TOKEN_ENDPOINT:-http://gateway:${GATEWAY_PORT:-4002}/connect/token}
      Ict__ServiceToken__ClientSecret: ${SVC_ICT_CLIENT_SECRET:-}
      # Epic #13316 (HU #13346): con la dirección, ICT consulta directo a core-consultas (svc-ict, producto ict) y cae a
      # core-api si no responde (CoreConsultas__Respaldo). Vacía = como siempre, por core-api. Necesita UseIdentity.
      CoreConsultas__Address: ${ICT_CORE_CONSULTAS_ADDRESS:-}
      CoreConsultas__Respaldo: ${CONSULTAS_REMOTO_RESPALDO:-true}
      # File Manager: DONDE SUBE ICT los binarios de los adjuntos. Tiene que ser EXACTAMENTE la
      # misma URL que FileManager__BaseUrl de core-api (misma var FILE_MANAGER_BASE_URL): si difieren,
      # ICT sube a un sitio y core-api lee de otro → el adjunto transferido por referencia al borrador
      # existe en la tabla pero no abre. Falla en silencio.
      FileManager__BaseUrl: ${FILE_MANAGER_BASE_URL:-https://ny46zhyeti.execute-api.us-east-1.amazonaws.com/pdn/}
      # MISMO valor que en core-api (misma var FILE_MANAGER_AUTH_TOKEN). Si solo se
      # pone en uno de los dos, ese sube y el otro recibe 401: el adjunto existe en la
      # tabla pero no abre, igual que con BaseUrl (ADR-0057).
      FileManager__AuthToken: ${FILE_MANAGER_AUTH_TOKEN:-}
      # Lever B (default false): synchronous_commit=off LOCAL en el camino del registro para no esperar el
      # fsync del WAL por fila (el registro hace 1 commit por fila). Solo afecta al registro (staging
      # reprocesable), no a reads/abort/edit. Para activarlo en un ambiente, poner
      # ICT_RELAX_REGISTER_COMMIT_DURABILITY=true en su .env (p.ej. DEV/QA para pruebas de carga).
      # Ver services/core-ict/docs/adr/ADR-0001-... y el commit de lever B.
      Ingest__RelaxRegisterCommitDurability: ${ICT_RELAX_REGISTER_COMMIT_DURABILITY:-false}
    ports:
      - "127.0.0.1:${CORE_ICT_PORT:-4020}:${CORE_ICT_PORT:-4020}"
    depends_on:
      core-api:
        condition: service_started
    healthcheck:
      # 127.0.0.1 y NO localhost: core-ict arranca con URLS=http://0.0.0.0:<puerto>, que
      # es solo IPv4, y `localhost` resuelve antes a ::1 -> "Connection refused". El
      # contenedor quedaba unhealthy con la aplicacion respondiendo perfectamente
      # (verificado 2026-09-12 en dev, qa y pdn). core-api no lo sufre porque no fuerza
      # URLS y Kestrel abre las dos pilas.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${CORE_ICT_PORT:-4020}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${CORE_ICT_MEM_LIMIT:-0}
    cpus: ${CORE_ICT_CPUS:-0}
    logging: *default-logging

  # ── Migrador V1 -> V2 (herramienta de operacion, NO un servicio) ──────────
  #
  # Vive tras el perfil `migracion`, asi que `docker compose up` NO lo levanta.
  # Se invoca a mano cuando toca migrar:
  #
  #   docker compose -f docker-compose.prod.yml --profile migracion run --rm \
  #     migrador --tipo registration --ids-file /work/ids.txt --dry-run
  #
  # Los ids y los reportes se intercambian por el volumen ./migracion -> /work.
  # Las credenciales salen del .env del VPS (ver .env.prod.example, bloque FLITMIG_).
  migrador:
    profiles: ["migracion"]
    image: ghcr.io/flitsas/flitdev/core-api:${CORE_API_TAG:-latest}
    entrypoint: ["dotnet", "/app/migrador/Flit.DataMigration.V1.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/migrador
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Archivos de ids de entrada y reportes de salida. Se crea en el VPS.
      - ./migracion:/work
    environment: *flitmig-env
    # Sin restart: es un proceso de un solo uso, no un servicio. Si falla, se
    # revisa el reporte y se vuelve a lanzar a mano.
    restart: "no"
    logging: *default-logging

  # ── API de migracion V1 -> V2 (mismo motor, un tramite por peticion) ───────
  #
  # Existe para que quien haga la migracion la dispare desde Postman (Runner sobre un
  # CSV de ids) sin entrar por SSH al VPS. Es un servicio normal del stack: sube con
  # `docker compose up -d` como cualquier otro y se alcanza por el gateway:
  #
  #   POST https://api.<env>.flitsas.online/api/v1/migracion/registration/26350
  #        ?instancias=todas&dryRun=true   +   cabecera X-Migration-Key
  #
  # NO publica puerto en el host: el gateway lo alcanza por la red interna del compose
  # (migracion-api:${MIGRACION_API_PORT}). El puerto sigue la convencion del ambiente
  # (DEV 4030 / QA 5030 / PDN 6030) y lo exporta el CD como las demas *_PORT.
  #
  # El puerto vive en DOS sitios de este archivo y TIENEN que coincidir: el
  # ASPNETCORE_URLS de este servicio y el destino de `migracion-cluster` que se le
  # inyecta al gateway mas abajo. Por eso ambos leen la MISMA variable. Cuando
  # divergieron (2026-07 -> 2026-09: el servicio escuchaba en 5030 y el gateway
  # seguia apuntando al 4030 de su appsettings.json) el sintoma fue un 502 pelado en
  # /admin/migracion, sin ninguna pista de que era un puerto.
  #
  # El gateway lo enruta por un cluster PROPIO (`migracion-cluster`, ActivityTimeout
  # 00:30:00). No usar core-api-cluster: sus 30 s convertirian en 504 migraciones de
  # instancia 3 que SI se completaron.
  #
  # La cabecera X-Migration-Key es la UNICA cerradura: el gateway no exige JWT en
  # ningun ambiente (JwtRequired = RequireAssertion(true)). Si se filtra, se cambia
  # FLITMIG_MIGRACION_API_KEY en el .env y se recrea el contenedor; no exige desplegar.
  #
  # OJO al ser un servicio normal: un despliegue (`up -d`) RECREA este contenedor y
  # corta la migracion que este en vuelo. Se pierde solo la peticion en curso — cada
  # tramite va en su propia transaccion y el candado es de sesion, asi que no queda a
  # medias — pero ese id hay que volver a lanzarlo. No desplegar durante una ola.
  migracion-api:
    image: ghcr.io/flitsas/flitdev/core-api:${CORE_API_TAG:-latest}
    entrypoint: ["dotnet", "/app/migracion-api/Flit.DataMigration.Api.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/migracion-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # El MISMO bloque que el migrador de consola: si divergieran, el comando subiria
      # los adjuntos a un file-manager y el endpoint leeria de otro. Falla en silencio.
      <<: *flitmig-env
      # Misma variable que el destino de migracion-cluster en el gateway (ver abajo).
      ASPNETCORE_URLS: http://+:${MIGRACION_API_PORT:-4030}
      # Con false las rutas ni se registran: responden 404, no 403. Cambiarlo NO exige
      # desplegar, solo recrear el contenedor.
      FLITMIG_MigracionApi__Enabled: ${FLITMIG_MIGRACION_API_ENABLED:-false}
      # Sin llave configurada el host arranca pero NADA valida (fail-closed).
      FLITMIG_MigracionApi__ApiKey: ${FLITMIG_MIGRACION_API_KEY:-}
      FLITMIG_MigracionApi__MaxConcurrentRuns: ${FLITMIG_MIGRACION_API_MAX_CONCURRENT:-2}
    # Healthcheck propio: el HEALTHCHECK de la imagen trae el puerto 8081 en duro y se
    # heredaria roto.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${MIGRACION_API_PORT:-4030}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${MIGRACION_API_MEM_LIMIT:-0}
    cpus: ${MIGRACION_API_CPUS:-0}
    logging: *default-logging

  # ── Flit.Gateway (API publica YARP: /api, /hubs, /ml) — GATEWAY_PORT ──────
  gateway:
    image: ghcr.io/flitsas/flitdev/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/gateway/Flit.Gateway.dll"]
    # content root = working_dir, para que YARP cargue sus rutas de appsettings.json
    working_dir: /app/gateway
    environment:
      # HU #13332 (Epic #13316): trazas y logs hacia el colector OTLP. Vacía = apagado (como hasta ahora).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # HU #12895 (A-02) — mismo nombre de ambiente que core-api (ver su comentario).
      ASPNETCORE_ENVIRONMENT: ${FLIT_DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:${GATEWAY_PORT:-4002}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN}
      # Segundo origen: el dominio de marca blanca sirve el MISMO front (mismo
      # contenedor, otro vhost de nginx) y por tanto llama al mismo gateway.
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_MARCA_BLANCA:-https://marcablancadev.flitsas.online}
      # Destinos internos del YARP: apuntan al puerto interno de cada servicio.
      # (sobrescriben appsettings.json, que trae los puertos por defecto)
      ReverseProxy__Clusters__core-api-cluster__Destinations__core-api-1__Address: http://core-api:${CORE_API_PORT:-4003}/
      ReverseProxy__Clusters__python-ml-cluster__Destinations__python-ml-1__Address: http://python-ml:${PYTHON_ML_PORT:-4012}/
      ReverseProxy__Clusters__core-ict-cluster__Destinations__core-ict-1__Address: http://core-ict:${CORE_ICT_PORT:-4020}/
      # HU #13351: avisos de proveedores al receptor de core-consultas (/api/v1/consultas/avisos/*).
      ReverseProxy__Clusters__core-consultas-cluster__Destinations__core-consultas-1__Address: http://core-consultas:${CORE_CONSULTAS_PORT:-4026}/
      # HU #13225/#13226 — rutas del login hacia core-identity. Apagada (por defecto) todo va a core-api como siempre;
      # encenderla exige core-identity arriba (perfil "identity"). Volver atrás = false + recrear el gateway.
      Gateway__IdentityCluster__Enabled: ${FLIT_IDENTITY_CLUSTER_ENABLED:-false}
      # Primero core-identity y de respaldo core-api (el gateway elige el primero sano por /health/ready).
      ReverseProxy__Clusters__core-identity-cluster__Destinations__a-core-identity__Address: http://core-identity:${CORE_IDENTITY_PORT:-4025}/
      ReverseProxy__Clusters__core-identity-cluster__Destinations__b-core-api__Address: http://core-api:${CORE_API_PORT:-4003}/
      # MISMA variable que el ASPNETCORE_URLS de migracion-api. appsettings.json trae
      # el 4030 de DEV/local; sin este override, en QA/PDN el gateway apunta a un
      # puerto donde nadie escucha y responde 502 sin cuerpo.
      ReverseProxy__Clusters__migracion-cluster__Destinations__migracion-api-1__Address: http://migracion-api:${MIGRACION_API_PORT:-4030}/
      # El gateway no valida el token ni exige autenticación (ver Flit.Gateway/Program.cs): lo hace core-api con su
      # llave persistente (HU #12896). El filtro que quita la policy de las rutas lo decide Gateway__DisableJwtPolicy
      # (por defecto, solo en Development); sin efecto funcional mientras JwtRequired deje pasar todo.
      # ── Marca Blanca (#12417/#12421) ────────────────────────────────────────
      # Como llega a core-api para resolver la lista de dominios activos (CORS dinamico)
      # y la MISMA clave que Internal__ApiKey de core-api arriba (ver ese comentario si
      # difieren). Vacia = fail-closed: /internal/domains/active responde 401 SIEMPRE y
      # el CORS del gateway se queda solo con Cors__AllowedOrigins__0.
      Internal__ApiBaseUrl: http://core-api:${CORE_API_PORT:-4003}
      Internal__ApiKey: ${FLIT_INTERNAL_API_KEY:-}
      # CIDR de la red interna Docker de ESTE stack (bloque `networks` al final del
      # archivo). SOLO una peticion que llegue desde aqui puede traer un X-Flit-Domain de
      # confianza (DomainSealTransform — delta-hechos-post-adr.md hecho 20); es el camino
      # del frontend Next.js resolviendo marca server-side por la red interna
      # (BRANDING_INTERNAL_API_URL, servicio frontend abajo), NUNCA trafico publico via
      # nginx. Vacio/no listado = nunca se confia en el sello entrante (fail-closed, el
      # Gateway usa siempre Request.Host.Host — comportamiento de hoy).
      DomainSeal__InternalAllowedNetworks__0: ${FLIT_INTERNAL_SUBNET:-10.114.40.0/24}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4002}:${GATEWAY_PORT:-4002}"
    depends_on:
      core-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${GATEWAY_PORT:-4002}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${GATEWAY_MEM_LIMIT:-0}
    cpus: ${GATEWAY_CPUS:-0}
    logging: *default-logging

  # ── python-ml (FastAPI OCR/ML, detras de YARP /ml) — PYTHON_ML_PORT ────────
  python-ml:
    image: ghcr.io/flitsas/flitdev/python-ml:${PYTHON_ML_TAG:-latest}
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${PYTHON_ML_PORT:-4012}"]
    ports:
      - "127.0.0.1:${PYTHON_ML_PORT:-4012}:${PYTHON_ML_PORT:-4012}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PYTHON_ML_PORT:-4012}/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${PYTHON_ML_MEM_LIMIT:-0}
    cpus: ${PYTHON_ML_CPUS:-0}
    logging: *default-logging

  # ── Frontend (Next.js) — FRONTEND_PORT ────────────────────────────────────
  frontend:
    image: ghcr.io/flitsas/flitdev/frontend:${FRONTEND_TAG:-latest}
    environment:
      # Next.js (next dev/start) escucha en este puerto interno.
      PORT: "${FRONTEND_PORT:-4001}"
      HOSTNAME: "0.0.0.0"
      # ── Consola de migración (/admin/migracion) ─────────────────────────────
      # Estas dos NO llevan NEXT_PUBLIC_: se leen en el servidor, dentro del BFF de
      # `app/api/migracion/*`. Con ese prefijo quedarían horneadas en el JS que descarga el
      # navegador, y X-Migration-Key es la llave maestra del host que reescribe trámites.
      #
      # No hay ninguna variable NUEVA en el .env: se reutiliza la MISMA llave que ya consume
      # migracion-api, que es justo lo que se quiere. Si fueran dos, podrían divergir y el
      # frontend hablaría con un host que no lo reconoce, con un 401 que no dice por qué.
      MIGRACION_API_KEY: ${FLITMIG_MIGRACION_API_KEY:-}
      # Por la red interna de Docker, NO por el dominio público: ese salto pasa por nginx, cuyo
      # proxy_read_timeout de 60 s corta migraciones de instancia 3 que sí se completan.
      MIGRACION_API_URL: http://gateway:${GATEWAY_PORT:-4002}
      # ── Marca Blanca (#12419/#12421) ────────────────────────────────────────
      # Resolucion de marca en el SERVIDOR (layout.tsx, resolve-brand.server.ts) por la
      # red interna de Docker — MISMO patron y MISMO motivo que MIGRACION_API_URL de
      # arriba (evita el hairpin por nginx y su proxy_read_timeout de 60 s). Server-only:
      # SIN prefijo NEXT_PUBLIC_, no se hornea en el bundle que descarga el navegador.
      # resolve-brand.server.ts manda la cabecera X-Flit-Domain: <host> explicita en esa
      # llamada — el Gateway SOLO confia en ese valor si la conexion viene de
      # DomainSeal__InternalAllowedNetworks (servicio gateway arriba); para cualquier
      # peticion publica (via nginx) el Gateway ignora X-Flit-Domain entrante y usa
      # siempre Request.Host.Host (hecho 20/21).
      BRANDING_INTERNAL_API_URL: http://gateway:${GATEWAY_PORT:-4002}
      # Follow-up de seguridad de #12417 (delta-hechos-post-adr.md hecho 24): el CIDR interno solo
      # NO basta (docker-proxy/DNAT puede hacer que una conexion externa llegue con IP del gateway
      # del bridge). resolve-brand.server.ts manda esta clave como X-Internal-Key junto con
      # X-Flit-Domain (#12419); server-only, SIN prefijo NEXT_PUBLIC_. MISMA clave que
      # Internal__ApiKey de gateway y core-api (ver mas abajo).
      FLIT_INTERNAL_API_KEY: ${FLIT_INTERNAL_API_KEY:-}
      # -- Reescritura /api/v1/* del BFF (Marca Blanca #12419/#12421/#12761) -----------
      # En un dominio de RED el navegador llama a la API en el MISMO origen: base-url.ts
      # (frontend/lib/api) devuelve "" cuando isFlitHost(host) es false, en vez de la base
      # cross-origin horneada en build (NEXT_PUBLIC_API_BASE_URL). Lo normal es que el borde
      # resuelva ese /api/v1/* con su propio location hacia el Gateway (plantilla
      # deploy/edge/nginx/flit-network-domains.conf.example); pero si el server{} que sirve
      # ese host NO lo tiene, la peticion aterriza en ESTE contenedor y la atiende el rewrite
      # de next.config.ts, que la reenvia a CORE_API_ORIGIN / CORE_ICT_ORIGIN.
      #
      # Sin estas dos variables el rewrite cae a su respaldo de desarrollo local
      # (http://localhost:4003 / :4020) — dentro de ESTE contenedor, donde no escucha nadie —
      # y CUALQUIER /api/v1/* que llegue aqui responde 500 "Internal Server Error" en texto
      # plano, sin cuerpo de error de la plataforma y sin rastro en los logs de core-api.
      #
      # Apuntan al GATEWAY, nunca a core-api:4003 / core-ict:4020 directo: el Gateway es quien
      # sella X-Flit-Domain (DomainSealTransform, #12417). Ir directo dejaria la peticion SIN
      # sello y DomainContextMiddleware la trataria como dominio FLIT — un 401/403 silencioso
      # en vez de un 500 ruidoso, que es peor de diagnosticar. Mismo criterio y mismo motivo
      # que MIGRACION_API_URL y BRANDING_INTERNAL_API_URL de arriba.
      CORE_API_ORIGIN: http://gateway:${GATEWAY_PORT:-4002}
      # ict-admin-route del Gateway (/api/v1/ict/{**catch-all}) -> core-ict-cluster.
      CORE_ICT_ORIGIN: http://gateway:${GATEWAY_PORT:-4002}
      # HU #13001 (FLIT Suite A-10) — sesión de Trámites. legacy (por defecto) = la de siempre. oidc = login por el hub
      # con @flit/auth: el token queda en el servidor y el navegador llama /api/v1 por el mismo origen. Encender oidc
      # exige el hub desplegado en FLIT_HUB_URL y Trámites en su propio host (A-11); se revierte volviendo a legacy.
      FLIT_SESSION_MODE: ${FLIT_SESSION_MODE:-legacy}
      FLIT_HUB_URL: ${FLIT_HUB_URL:-https://dev.flitsas.online}
      FLIT_OIDC_INTERNAL_URL: http://gateway:${GATEWAY_PORT:-4002}
      FLIT_SESSION_SECRET: ${FLIT_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4001}:${FRONTEND_PORT:-4001}"
    depends_on:
      - gateway
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${FRONTEND_MEM_LIMIT:-0}
    cpus: ${FRONTEND_CPUS:-0}
    logging: *default-logging

  # ── FLIT Suite: hub en flitsas.online (B-09) — HUB_PORT ────────────────────
  # Perfil `suite`: `docker compose up` NO lo levanta todavía. Se enciende agregando
  # COMPOSE_PROFILES=suite al .env del ambiente, cuando el borde (nginx, DNS y certificado)
  # tenga el host del hub. Mientras tanto el CD construye la imagen y no cambia nada en el servidor.
  # Una sola imagen para DEV, QA y PDN: todo lo de abajo se lee en runtime (frontend-hub/lib/config.server.ts).
  frontend-hub:
    profiles: ["suite"]
    image: ghcr.io/flitsas/flitdev/frontend-hub:${FRONTEND_HUB_TAG:-latest}
    environment:
      PORT: "${HUB_PORT:-4022}"
      HOSTNAME: "0.0.0.0"
      # /api/v1/* del navegador y la marca del host van al gateway por la red interna, con el
      # sello X-Flit-Domain y la clave interna (mismo criterio que el servicio frontend).
      CORE_API_ORIGIN: http://gateway:${GATEWAY_PORT:-4002}
      BRANDING_INTERNAL_API_URL: http://gateway:${GATEWAY_PORT:-4002}
      FLIT_INTERNAL_API_KEY: ${FLIT_INTERNAL_API_KEY:-}
      # @flit/auth (HU #13000, A-09): el hub es cliente `plataforma` de su propio servidor OIDC. FLIT_HUB_URL es la URL
      # pública del hub (la exporta el CD); el canje de tokens va por la red interna al gateway. FLIT_SESSION_SECRET
      # cifra la cookie de sesión: obligatoria, al menos 32 caracteres, distinta por ambiente y solo en el .env.
      FLIT_HUB_URL: ${FLIT_HUB_URL:-https://dev.flitsas.online}
      FLIT_OIDC_INTERNAL_URL: http://gateway:${GATEWAY_PORT:-4002}
      FLIT_SESSION_SECRET: ${FLIT_SESSION_SECRET:-}
      # HU #13002 (A-11): con true el hub ocupa la raíz y redirige con 308 las rutas de Trámites a su host. Se enciende
      # junto con el cambio del borde (deploy/edge/nginx/flit-suite-hosts.conf.example). FLIT_TRAMITES_URL la exporta el CD.
      FLIT_TRAMITES_HOST_ENABLED: ${FLIT_TRAMITES_HOST_ENABLED:-false}
      TRAMITES_URL: ${FLIT_TRAMITES_URL:-https://dev.tramites.flitsas.online}
      # Hosts FLIT (sin marca de red). Mismo valor que NEXT_PUBLIC_FLIT_HOSTS de Trámites en cd.yml.
      FLIT_HOSTS: ${FLIT_HOSTS:-flitsas.online,*.flitsas.online,flitsas.com,*.flitsas.com,!marcablancadev.flitsas.online,!marcablancaqa.flitsas.online,!marcablancapdn.flitsas.online}
    ports:
      - "127.0.0.1:${HUB_PORT:-4022}:${HUB_PORT:-4022}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${HUB_PORT:-4022}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - gateway
    restart: *restart
    # HU #13331 (Epic #13316): límites por contenedor. Sin la variable (o en 0) no hay límite: los valores los fija el
    # líder en el .env de cada ambiente después de medir (handoff-vps-identidad.md, paso 3).
    mem_limit: ${FRONTEND_HUB_MEM_LIMIT:-0}
    cpus: ${FRONTEND_HUB_CPUS:-0}
    logging: *default-logging

  # HU #13332 (Epic #13316) — colector OpenTelemetry + Tempo (trazas) + Loki (logs) + Grafana en un contenedor. Solo
  # con el perfil `observabilidad`. Para usarlo: COMPOSE_PROFILES=...,observabilidad y
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://observabilidad:4317 en el .env. Grafana queda solo en 127.0.0.1 (túnel SSH o
  # nginx con acceso restringido); el colector no se publica: lo alcanzan los servicios por la red interna.
  observabilidad:
    profiles: ["observabilidad"]
    image: grafana/otel-lgtm:0.30.0
    ports:
      - "127.0.0.1:${OBSERVABILIDAD_GRAFANA_PORT:-4090}:3000"
    volumes:
      - observabilidad-datos:/data
    restart: *restart
    mem_limit: ${OBSERVABILIDAD_MEM_LIMIT:-0}
    cpus: ${OBSERVABILIDAD_CPUS:-0}
    logging: *default-logging

# ── Red interna (Marca Blanca, #12421) ──────────────────────────────────────
# Subred EXPLICITA de la red "default" (la que TODO servicio de arriba usa ya
# de forma implicita, al no declarar `networks:` propio — este bloque no
# cambia a que red se conecta cada servicio, SOLO le fija el CIDR).
#
# Por que hace falta: sin `ipam.config`, Docker asigna la subred del bridge al
# azar entre recreaciones de la red (`docker compose down` + `up`, no un simple
# restart) y entre distintos stacks del mismo host. DomainSeal__InternalAllowedNetworks
# (servicio gateway) necesita un CIDR DETERMINISTA para decidir si confiar en el
# X-Flit-Domain que manda el frontend server-side (hecho 19/20 de
# delta-hechos-post-adr.md) — con una subred que cambia sola, ese filtro
# quedaria adivinando o, en el peor caso, vacio (fail-closed: NINGUNA peticion
# del frontend interno se confiaria, /public/branding cachearia FLIT para todo
# el mundo aunque la red SI tenga marca).
#
# OJO si DEV/QA/PDN comparten el mismo VPS (topologia real de este repo, ver
# cabecera del archivo): cada stack necesita un FLIT_INTERNAL_SUBNET DISTINTO —
# Docker rechaza crear dos redes con subredes que se solapan en el mismo host
# ("Pool overlaps with other one on this address space"). Los que exporta el CD (cd.yml):
# DEV 10.114.40.0/24 · QA 10.114.50.0/24 · PDN 10.114.60.0/24 (mismo digito de decenas
# que los puertos 4xxx/5xxx/6xxx; 172.28.x ya estaba ocupado en el VPS compartido).
networks:
  default:
    ipam:
      config:
        - subnet: ${FLIT_INTERNAL_SUBNET:-10.114.40.0/24}

# HU #13332: datos de trazas y logs del perfil `observabilidad`.
volumes:
  observabilidad-datos:
  rabbitmq-datos:
