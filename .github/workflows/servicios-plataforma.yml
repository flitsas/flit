name: Servicios de plataforma (.NET 10)

# Epic #13316 (HU #13341): CI de todos los servicios que nacieron de la plantilla (services/core-plantilla). Se
# descubren solos (.github/scripts/servicios-plataforma.sh): un servicio nuevo no edita este archivo. Por cada uno:
# exige su contrato en contracts/proto, compila y corre sus pruebas contra Postgres y RabbitMQ.

on:
  push:
    branches: [develop, main]
    paths:
      - 'services/core-*/**'
      - '!services/core-api/**'
      - '!services/core-ict/**'
      - '!services/core-identity/**'
      - 'services/core-api/Directory.*'
      - 'services/core-api/src/Flit.Platform.Sdk/**'
      - 'services/core-api/src/Flit.Modules.Consultas/**'
      - 'services/core-api/src/Flit.Modules.Improntas.Domain/**'
      - 'services/core-api/src/Flit.Queries.Domain/**'
      - 'services/core-api/src/Flit.Tramites.Grpc.Contracts/**'
      - 'services/core-identity/src/Flit.Platform.Grpc.Contracts/**'
      # HU #13734: core-diagnostico y core-comparendos compilan también el contrato gRPC de Identidad.
      - 'services/core-identity/src/Flit.Identidad.Grpc.Contracts/**'
      - 'contracts/proto/**'
      - '.github/workflows/servicios-plataforma.yml'
      - '.github/scripts/servicios-plataforma.sh'
  pull_request:
    branches: [develop]
    paths:
      - 'services/core-*/**'
      - '!services/core-api/**'
      - '!services/core-ict/**'
      - '!services/core-identity/**'
      - 'services/core-api/Directory.*'
      - 'services/core-api/src/Flit.Platform.Sdk/**'
      - 'services/core-api/src/Flit.Modules.Consultas/**'
      - 'services/core-api/src/Flit.Modules.Improntas.Domain/**'
      - 'services/core-api/src/Flit.Queries.Domain/**'
      - 'services/core-api/src/Flit.Tramites.Grpc.Contracts/**'
      - 'services/core-identity/src/Flit.Platform.Grpc.Contracts/**'
      # HU #13734: core-diagnostico y core-comparendos compilan también el contrato gRPC de Identidad.
      - 'services/core-identity/src/Flit.Identidad.Grpc.Contracts/**'
      - 'contracts/proto/**'
      - '.github/workflows/servicios-plataforma.yml'
      - '.github/scripts/servicios-plataforma.sh'

jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      servicios: ${{ steps.listar.outputs.servicios }}
    steps:
      - uses: actions/checkout@v4
      - name: Servicios de plataforma
        id: listar
        run: .github/scripts/servicios-plataforma.sh listar | tee -a "$GITHUB_OUTPUT"

  servicio:
    needs: descubrir
    if: ${{ needs.descubrir.outputs.servicios != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.descubrir.outputs.servicios) }}
    name: ${{ matrix.servicio }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flit_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flit_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # ADR-0075 (H11): broker real para las pruebas de bus de los servicios (consultas, diagnóstico, notificaciones), igual
      # que en core-api.yml: servicio del job, sin Testcontainers, con usuario propio porque guest solo entra desde
      # loopback dentro del contenedor. Con CI=true las pruebas de broker no se saltan: fallan si no lo alcanzan.
      # Imagen con el plugin de administración y 15672 publicado: las pruebas T12 (ConsultasDiagnosticoBrokerTests de
      # diagnóstico y consultas, ConsumidoresDiagnosticoBrokerTests) crean y borran vhosts y usuarios desechables por la
      # API HTTP (FLIT_TEST_RABBITMQ_ADMIN), autenticadas con el usuario de FLIT_TEST_RABBITMQ (el por defecto, con la
      # etiqueta administrator). El healthcheck espera a que escuchen AMQP y la API, no solo a que el nodo arranque.
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: flit
          RABBITMQ_DEFAULT_PASS: flit-prueba
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_listener 5672 && rabbitmq-diagnostics -q check_port_listener 15672"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Contrato gRPC
        run: .github/scripts/servicios-plataforma.sh contrato "${{ matrix.servicio }}"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/${{ matrix.servicio }}/global.json

      - name: Build y pruebas
        env:
          ConnectionStrings__Core: "Host=localhost;Port=5432;Database=flit_dev;Username=postgres;Password=postgres"
          FLIT_TEST_RABBITMQ: "amqp://flit:flit-prueba@localhost:5672/"
          FLIT_TEST_RABBITMQ_ADMIN: "http://localhost:15672/"
        run: |
          solucion=$(.github/scripts/servicios-plataforma.sh solucion "${{ matrix.servicio }}")
          dotnet restore "$solucion"
          dotnet build "$solucion" --no-restore --configuration Release
          dotnet test "$solucion" --no-build --configuration Release --logger "trx"
