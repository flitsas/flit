                      locatarios: 0
                    personas: null
                simitVehiculo:
                  summary: SIMIT del vehículo
                  value:
                    id: 01a1647a-4975-7c17-97ae-f10bc09287ae
                    vehiculo_id: 01a1647a-4975-7574-933e-133cadd1ea42
                    fuente: SIMIT_VEHICULO
                    estado: COMPLETADO
                    motivo_na: null
