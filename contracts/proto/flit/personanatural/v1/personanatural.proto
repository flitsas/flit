syntax = "proto3";

package flit.personanatural.v1;

option csharp_namespace = "Flit.PersonaNatural.Grpc.V1";

// Lo que core-personanatural (el servicio del portal de persona natural, ADR-0075) ofrece a otros servicios de FLIT.
// El portal es un BFF: su front habla con él por REST; este contrato es solo para llamadas internas de plataforma
// (contrato v1.3 §6.1), por ejemplo para que FLIT 2 lea el estado de una solicitud.
//
// Autenticación: token de servicio con `aud=personanatural`. La empresa viaja en la metadata `x-flit-tenant-id`.
service SolicitudesService {
  // Estado de una solicitud del portal. NOT_FOUND con `reason = solicitud_no_encontrada` si no existe.
  rpc ObtenerEstadoSolicitud(ObtenerEstadoSolicitudRequest) returns (ObtenerEstadoSolicitudResponse);
}

message ObtenerEstadoSolicitudRequest {
  // Id de la solicitud en el portal.
  string solicitud_id = 1;
}

message ObtenerEstadoSolicitudResponse {
  string solicitud_id = 1;
  // Radicado visible para el ciudadano antes de que exista el trámite en FLIT 2.
  string codigo_publico = 2;
  // borrador | pendiente_validacion | en_cola | creada | rechazada_creacion | cancelada
  string estado = 3;
  // Código del tipo de trámite (el mismo de tramites.procedure_types).
  string tipo_tramite_codigo = 4;
  // Vacío mientras el trámite no exista en FLIT 2.
  string procedure_instance_id = 5;
}

// Lectura por PULL de lo que core-api necesita para crear el trámite de una solicitud radicada (HU #14049, D4).
// El evento `tramites.persona_natural.radicacion_solicitada` NO lleva datos personales (ni siquiera cifrados): avisa
// que hay una solicitud en cola y core-api viene por los datos con este RPC. Es un servicio aparte de SolicitudesService
// a propósito: el scope que abre datos personales no se comparte con otras lecturas.
//
// Autenticación: token de servicio del cliente `svc-tramites` con `aud=personanatural` y scope
// `platform.personanatural.leer`; la empresa viaja en `x-flit-tenant-id` y debe ser la de la solicitud. Cada llamada
// queda en la auditoría de acceso a datos personales (quién, qué solicitud y cuándo; nunca los datos).
service RadicacionService {
  // Solo para solicitudes en estado `en_cola`: con otro estado, FAILED_PRECONDITION con `reason = solicitud_no_radicable`.
  // NOT_FOUND con `reason = solicitud_no_encontrada` si no existe (o es de otra empresa).
  rpc ObtenerSolicitudParaRadicar(ObtenerSolicitudParaRadicarRequest) returns (ObtenerSolicitudParaRadicarResponse);
}

message ObtenerSolicitudParaRadicarRequest {
  // Id de la solicitud en el portal (el `solicitudId` del evento).
  string solicitud_id = 1;
}

message ObtenerSolicitudParaRadicarResponse {
  string solicitud_id = 1;
  // Radicado visible para el ciudadano (PN-AAAA-NNNNNN).
  string codigo_publico = 2;
  // Código del tipo de trámite (tramites.procedure_types.code).
  string tipo_tramite_codigo = 3;
  // Versión de la definición con la que el ciudadano llenó el trámite y huella SHA-256 de esa definición congelada.
  int32 definicion_version = 4;
  string definicion_huella = 5;
  string organismo_id = 6;
  string organismo_nombre = 7;
  // Vehículo; vacíos si el tipo no los pide.
  string placa = 8;
  string vin = 9;
  // Valores de los campos del tipo por `field_key`.
  map<string, string> field_values = 10;
  // JSON de los bloques que el tipo pide además de los campos (comercial, prenda, requisitos, diagnóstico). Sin datos personales.
  string datos_json = 11;
  repeated ParteSolicitud partes = 12;
  repeated AdjuntoSolicitud adjuntos = 13;
  // Id del adjunto vigente del pago; vacío si no hay.
  string comprobante_pago_id = 14;
  // Llave de idempotencia con la que se radicó y correlación de la solicitud.
  string idempotency_key = 15;
  string correlation_id = 16;
  // Pago del portal (HU #14468). Solo canal del punto (pn_punto) ya pagado; ausente en la web.
  PagoPortal pago = 17;
}

// Pago confirmado de una solicitud del punto. Sin datos personales.
message PagoPortal {
  // Total cobrado en pesos colombianos, sin decimales.
  int64 valor_cop = 1;
  // caja | sin_cobro
  string medio = 2;
  // efectivo | datafono | transferencia | otro; vacío si medio = sin_cobro.
  string medio_caja = 3;
  // Detalle libre cuando medio_caja = otro; vacío en los demás casos.
  string medio_detalle = 4;
  // Fecha y hora del pago, ISO-8601 en UTC.
  string pagado_en = 5;
  // Id del cobro en el portal; sirve para idempotencia en core-api.
  string cobro_id = 6;
}

// Una parte del trámite con sus datos personales en claro (solo viajan en este RPC autenticado y auditado).
message ParteSolicitud {
  // Rol según la definición del tipo (vendedor | comprador | locatario…) y posición dentro del rol.
  string rol = 1;
  int32 ordinal = 2;
  // CC | CE | PAS | TI
  string tipo_documento = 3;
  string numero_documento = 4;
  string nombre = 5;
  string correo = 6;
  string celular = 7;
  string direccion = 8;
  // Validación de identidad de ESTA solicitud (vacía si no hay) y su estado (aprobada, …).
  string validacion_id = 9;
  string validacion_estado = 10;
  // Ciudad que eligió el ciudadano. Vacía si el borrador es anterior a este dato.
  string ciudad = 11;
}

// Un archivo del trámite, por referencia opaca al almacenamiento: no son los bytes.
message AdjuntoSolicitud {
  string id = 1;
  // `doc_code` del documento del tipo o `comprobante_pago`.
  string tipo = 2;
  string referencia = 3;
  string sha256 = 4;
  int64 tamano_bytes = 5;
  string mime_type = 6;
  string nombre_archivo = 7;
}

// Administración del cobro en caja desde el hub del OT. Token de svc-tramites con aud=personanatural y scope
// platform.personanatural.caja. El organismo lo resuelve core-api desde el token del administrador; el BFF no lo discute.
service CajaAdminService {
  rpc ListarCobros(ListarCobrosRequest) returns (ListarCobrosResponse);
  rpc AnularCobro(AnularCobroRequest) returns (AnularCobroResponse); // FAILED_PRECONDITION reason=cobro_no_anulable | NOT_FOUND reason=cobro_no_encontrado
  // La caja del organismo es un modulo de FLIT 2.0 (core-api /api/v1/ot/caja): core-api resuelve el organismo y el usuario desde el JWT
  // y el BFF solo verifica que el tramite sea de ESE organismo. Errores: status gRPC + ErrorInfo.reason con el mismo codigo estable de la
  // caja (no_encontrado, otro_organismo, ya_pagado, cobro_vencido, no_habilitado, total_cambio, medio_invalido, detalle_requerido,
  // prefactura_invalida, idempotency_key_requerida, idempotency_key_reutilizada, demasiados_intentos). ErrorInfo.metadata trae los extras:
  // totalActualCop (total_cambio) y retryAfterSegundos (demasiados_intentos, RESOURCE_EXHAUSTED).
  rpc BuscarTramite(BuscarTramiteRequest) returns (BuscarTramiteResponse);
  rpc ConfirmarCobro(ConfirmarCobroRequest) returns (ConfirmarCobroResponse);
}
message ListarCobrosRequest { string organismo_id = 1; string fecha = 2; /* AAAA-MM-DD Colombia; vacio = hoy */ int32 pagina = 3; int32 tamano = 4; }
message CobroResumen {
  string cobro_id = 1; string codigo = 2; int64 valor_cop = 3; string medio = 4; string medio_detalle = 5;
  string pagado_en = 6; string pagado_por_nombre = 7; string estado = 8; // pagado | anulado
  bool anulable = 9; string motivo_no_anulable = 10; string anulado_en = 11; string anulado_por_nombre = 12; string anulacion_motivo = 13;
  int64 row_version = 14;
}
message ListarCobrosResponse { repeated CobroResumen items = 1; int32 total = 2; int64 total_dia_cop = 3; }
message AnularCobroRequest { string organismo_id = 1; string cobro_id = 2; string motivo = 3; /* 10..300 */ string actor_user_id = 4; string actor_nombre = 5; int64 row_version = 6; }
message AnularCobroResponse { string cobro_id = 1; string estado = 2; }
// ip_hash: SHA-256 hexadecimal de la IP del cajero (la IP en claro no viaja); el BFF la firma de nuevo con su llave antes de guardarla.
message BuscarTramiteRequest { string organismo_id = 1; string codigo = 2; string usuario_id = 3; string ip_hash = 4; }
message LineaCobroCaja { string concepto = 1; int64 valor_cop = 2; }
message BuscarTramiteResponse {
  string codigo = 1; string tipo_tramite_codigo = 2; string tipo_tramite_nombre = 3; repeated LineaCobroCaja lineas = 4;
  int64 total_cop = 5; string version_tarifa = 6; string vence_en = 7; // ISO 8601
}
message ConfirmarCobroRequest {
  string organismo_id = 1; string codigo = 2; string usuario_id = 3; string usuario_nombre = 4;
  string medio_caja = 5; // efectivo | datafono | transferencia | otro
  string detalle = 6; // obligatorio y <= 120 con medio otro
  optional int64 total_visto = 7; // solo se COMPARA; el BFF cobra siempre su propio total
  string idempotency_key = 8; // <= 100
  bytes prefactura = 9; // opcional, <= 5 MB, PDF/JPG/PNG validado por firma
  string prefactura_content_type = 10; // informativo
  string prefactura_nombre = 11;
  string ip_hash = 12;
}
message ConfirmarCobroResponse { string codigo = 1; int64 valor_cop = 2; string medio = 3; string medio_detalle = 4; string pagado_en = 5; }
