syntax = "proto3";

package flit.impuestos.v1;

option csharp_namespace = "Flit.Impuestos.Grpc.V1";

// Impuestos (HU #14694, M05; ADR-0093, ADR-0070). Lo que otros servicios de la suite pueden pedirle a Impuestos por la red
// interna. Hoy solo el resumen de una empresa (para el hub); la operación del producto va por su REST (/api/v1/impuestos/*)
// con el token del usuario.
//
// Autenticación: token de servicio con `aud=impuestos`; la empresa en la metadata `x-flit-tenant-id`. Se publica cuando
// exista el primer consumidor y su scope en el contrato de plataforma (§3).
service ImpuestosService {
  // Totales de liquidaciones de la empresa de la metadata.
  rpc ObtenerResumenEmpresa(ObtenerResumenEmpresaRequest) returns (ObtenerResumenEmpresaResponse);
}

message ObtenerResumenEmpresaRequest {}

message ObtenerResumenEmpresaResponse {
  // Liquidaciones de la empresa que todavía no terminan (CREADO o EN_PROCESO).
  int32 en_proceso = 1;
  // Liquidaciones de la empresa ya terminadas (COMPLETADO, COMPLETADO_CON_NOVEDADES o CERRADO_MANUALMENTE).
  int32 finalizados = 2;
}
