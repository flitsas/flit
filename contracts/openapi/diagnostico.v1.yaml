openapi: 3.0.3
info:
  title: FLIT Suite — API de Diagnóstico Vehicular
  version: "1.0.0"
  description: >
    Endpoints REST del producto Diagnóstico (core-diagnostico) bajo /api/v1/diagnostico, plan
    docs/diagnosticos/plan-implementacion-diagnostico-vehicular-v2.md §6.1. La app web llega por el
    gateway con el token del producto (aud=diagnostico). Una sesión = una compañía (D-03): la compañía
    sale siempre del token y ningún parámetro la cambia. Los permisos tienen el formato
    diagnostico.<modulo>.<accion> (§6.2) y se registran con el manifiesto del producto
    (PUT /api/v1/platform/products/diagnostico/manifest, ver platform.v1.yaml). Diagnóstico no publica
    rutas para crear o modificar compañías, usuarios, roles ni suscripciones (R-4). Los errores de
    regla responden { code, error } con un code estable. Toda ruta bajo /api/v1/diagnostico pasa por el
    guard de suscripción (HU #13726): si la compañía del token no tiene Diagnóstico activo, o no se puede
    verificar con Identidad (fail-closed), responde 403 con code PRODUCTO_NO_HABILITADO. /health y
    /health/ready no pasan por el guard.
  license:
    name: Propietario FLIT
    url: https://flitsas.com

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4029
    description: Local (core-diagnostico)

security:
  - bearerAuth: []

tags:
  - name: Sesion
    description: Lo que la app necesita al abrir.
  - name: Configuracion
    description: >
      Configuración de Diagnóstico en dos niveles (D-04, HU #13741): el contractual lo edita solo el backoffice
      FLIT y el operativo el admin de la compañía. Los valores son los códigos de la base (RUNT, EMPRESA,
      NO_MOSTRAR...) y los campos van en snake_case.
  - name: Catalogos
    description: Catálogos de la plataforma que Diagnóstico ofrece (tipos de trámite de Trámites).
  - name: Backoffice
    description: >
      Lectura entre compañías del backoffice FLIT (D-16, ADR-0073): permiso diagnostico.backoffice.ver y
      tenant_type=FLIT a la vez, empresa explícita y auditoría de cada lectura.

paths:
  /api/v1/diagnostico/sesion:
    get:
      tags: [Sesion]
      operationId: obtenerSesionDiagnostico
      summary: Sesión del usuario en Diagnóstico
      description: >
        Usuario, compañía, roles, permisos de Diagnóstico y capacidades, todo leído del token (HU #13724).
        Usuario del producto (política diagnostico.usuario): al menos un permiso diagnostico.* o SuperAdmin;
        un token de servicio o un rol de otro producto sin permisos de Diagnóstico recibe 403 (HU #13726). No acepta parámetros: si llega un parámetro o la cabecera X-Flit-Tenant-Id con otra
        compañía, se ignora. `permisos` solo trae slugs diagnostico.* (el token también lleva los de
        plataforma). Las capacidades del backoffice FLIT exigen además tenant_type=FLIT (D-16).
      responses:
        "200":
          description: Sesión de la compañía del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Token de servicio o usuario sin permisos de Diagnóstico; usuario sin compañía (`code` = SIN_EMPRESA);
            compañía sin Diagnóstico activo o suscripción no verificable (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/configuracion:
    get:
      tags: [Configuracion]
      operationId: obtenerConfiguracionDiagnostico
      summary: Configuración de la compañía del token (dos niveles)
      description: >
        Permiso diagnostico.configuracion.ver. Devuelve el nivel contractual marcado de solo lectura y el
        operativo de la compañía del token (HU #13741). Nunca trae redaccion_ia_suspendida ni el autor de los
        cambios contractuales. Sin fila guardada devuelve los valores por defecto (RUNT, 500, EMPRESA, RUNT,
        NO_MOSTRAR) sin escribir.
      responses:
        "200":
          description: Configuración de la compañía del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.configuracion.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Configuracion]
      operationId: editarConfiguracionOperativa
      summary: Edita el nivel operativo de la compañía del token
      description: >
        Permiso diagnostico.configuracion.editar. Solo visibilidad_usuario, fuentes_por_defecto y
        estimado_consultas; se guardan los campos que llegan, con el usuario y la fecha (sin fila, la crea con
        los valores contractuales por defecto). Orden de validación: un campo que no es operativo (los
        contractuales, redaccion_ia_suspendida, usuarios, roles, suscripción o cualquier otro) responde 403
        CAMPO_NO_EDITABLE y no guarda ningún campo; un valor fuera de su conjunto responde 422
        VALOR_FUERA_DE_CONJUNTO; una fuente por defecto que no está habilitada, 422
        POR_DEFECTO_FUERA_DE_HABILITADAS. Una regla de la base que aun así falle (CHECK, SQLSTATE 23514)
        responde 422 VALOR_INVALIDO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionOperativa"
      responses:
        "200":
          description: Configuración guardada (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracion"
        "400":
          description: El cuerpo no es un objeto JSON o repite un campo (`code` = CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.configuracion.editar (sin cuerpo); campo no operativo (`code` = CAMPO_NO_EDITABLE);
            sin usuario (`code` = SIN_USUARIO), sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico
            activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, POR_DEFECTO_FUERA_DE_HABILITADAS o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/tipos-tramite:
    get:
      tags: [Catalogos]
      operationId: listarTiposTramiteDiagnostico
      summary: Tipos de trámite de la etapa (modo Con Análisis IA)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13742). Proxy del rpc ListarTiposTramite de
        flit.tramites.v1.CatalogosService (core-api, token de servicio svc-diagnostico con scope
        platform.tramites.catalogos). Solo los tipos publicados cuyo código está en la lista blanca
        Diagnostico:TiposTramite:Habilitados (TRASPASO_STANDARD, TRASPASO_UNILATERAL,
        TRASPASO_TRANSFERENCIA_DE_DOMINIO), filtrados por código y nunca por nombre, en el orden de la
        publicación. Catálogo global, igual para toda compañía. La última respuesta correcta se guarda 5
        minutos; con esa copia vigente no se llama al rpc. Si el rpc falla con Unavailable o DeadlineExceeded
        se reintenta 2 veces (200 ms y 600 ms, 3 s por llamada); PermissionDenied y Unauthenticated no se
        reintentan. fuentesObligatorias llega vacía en D1 (R-17, hasta el catálogo de reglas de D6).
      responses:
        "200":
          description: Tipos de trámite de la etapa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiposTramite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = CATALOGO_NO_DISPONIBLE: Trámites no respondió tras los reintentos (o rechazó al cliente de
            servicio) y no hay copia vigente. No se devuelve ninguna lista fija ni una copia vencida.
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas/{empresa}/configuracion/contrato:
    parameters:
      - name: empresa
        in: path
        required: true
        description: >
          Compañía cuyo contrato se lee o edita (uuid distinto de cero). Si además llega ?empresa=, debe
          coincidir (si no, 400 EMPRESA_REQUERIDA).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice, Configuracion]
      operationId: obtenerContratoEmpresaBackoffice
      summary: Contrato de una compañía para el backoffice FLIT
      description: >
        Política diagnostico.backoffice (diagnostico.backoffice.ver + tenant_type=FLIT) y además
        diagnostico.configuracion.contrato.editar (HU #13741). La lectura queda en diagnostico.lecturas_backoffice
        antes de leer. Sin fila guardada devuelve los valores por defecto.
      responses:
        "200":
          description: Contrato de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida o distinta en la ruta y en la consulta (`code` = EMPRESA_REQUERIDA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); token sin
            compañía (SIN_EMPRESA) o sin usuario (SIN_USUARIO); PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Configuracion]
      operationId: editarContratoEmpresaBackoffice
      summary: Edita el contrato de una compañía (backoffice FLIT)
      description: >
        Mismos permisos que el GET. Edita fuentes_habilitadas, limite_vehiculos_lote (mayor que cero) y el
        interruptor de emergencia redaccion_ia_suspendida (R-2) de la compañía de la ruta, por la vía de
        escritura entre compañías del módulo Backoffice (ADR-0073). Se guardan los campos que llegan. Reducir
        las habilitadas recorta fuentes_por_defecto en el mismo comando. Cada campo que cambia (también el
        recorte) queda en diagnostico.cambios_contrato con el usuario, la compañía, el valor anterior y el nuevo;
        el PUT no se registra en lecturas_backoffice. Orden de validación: un campo que no es del contrato da
        403 CAMPO_NO_EDITABLE; un valor fuera de conjunto, 422 VALOR_FUERA_DE_CONJUNTO; un límite que no es un
        entero positivo, 422 LIMITE_INVALIDO; habilitar IMPUESTO_DEPARTAMENTAL mientras
        Diagnostico:Fuentes:ImpuestoDisponible sea false (C3, R-9), 422 FUENTE_NO_DISPONIBLE. Con un error no
        se guarda ningún campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionContrato"
      responses:
        "200":
          description: Contrato guardado (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida (EMPRESA_REQUERIDA) o cuerpo que no es un objeto o repite un campo (CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); campo que no
            es del contrato (CAMPO_NO_EDITABLE); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, LIMITE_INVALIDO, FUENTE_NO_DISPONIBLE o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/resumen:
    get:
      tags: [Backoffice]
      operationId: obtenerResumenEmpresaBackoffice
      summary: Resumen de una compañía cliente para el backoffice FLIT
      description: >
        Ruta mínima de D0 (HU #13728): si la compañía indicada tiene configuración y cuántos diagnósticos y
        vehículos tiene. Política diagnostico.backoffice: exige a la vez el permiso diagnostico.backoffice.ver
        (o SuperAdmin) y el claim tenant_type=FLIT del token; con el rol backoffice_diagnostico en una compañía
        que no es FLIT, o en la compañía FLIT sin el permiso, responde 403, igual que cualquier otra ruta
        /backoffice/* (también una que no existe). La compañía nunca sale del token: se indica en ?empresa=
        (o en el segmento {empresa} de las rutas que lo lleven; si llegan los dos deben coincidir). Cada
        lectura queda en diagnostico.lecturas_backoffice con el usuario, la empresa consultada, la ruta y la
        fecha, antes de leer. Sin empresa válida responde 400 y no se audita.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía a consultar (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen de la compañía indicada (solo sus datos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenEmpresaBackoffice"
        "400":
          description: Falta ?empresa=, no es un uuid, es cero, llega repetido o no coincide con la ruta (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT (falta el permiso o tenant_type no es FLIT; sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Sin sesión, token inválido o de otro producto.

  schemas:
    Sesion:
      type: object
      required: [usuario, empresa, roles, permisos, capacidades]
      properties:
        usuario:
          type: object
          required: [id, email, esSuperAdmin]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            esSuperAdmin:
              type: boolean
        empresa:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Claim tenant_id del token.
            nombre:
              type: string
              nullable: true
            tipo:
              type: string
              nullable: true
              description: Claim tenant_type (FLIT para la compañía FLIT).
        roles:
          type: array
          description: Códigos de rol del token (claim role_code).
          items:
            type: string
          example: [usuario_diagnostico]
        permisos:
          type: array
          description: Slugs diagnostico.* que tiene el usuario.
          items:
            type: string
          example: [diagnostico.diagnosticos.crear, diagnostico.diagnosticos.ver]
        capacidades:
          $ref: "#/components/schemas/Capacidades"

    Capacidades:
      type: object
      description: >
        Ayuda para armar el menú; cada endpoint vuelve a exigir su permiso. Las seis últimas son del
        backoffice FLIT y exigen además tenant_type=FLIT.
      required:
        - crearDiagnosticos
        - verDiagnosticos
        - descargarReportes
        - derivar
        - verConfiguracion
        - editarConfiguracion
        - reprocesarConsultas
        - backoffice
        - editarContrato
        - llenarConsultas
        - corregirDictamen
        - verAuditoria
        - verVolumetria
      properties:
        crearDiagnosticos:
          type: boolean
        verDiagnosticos:
          type: boolean
        descargarReportes:
          type: boolean
        derivar:
          type: boolean
        verConfiguracion:
          type: boolean
        editarConfiguracion:
          type: boolean
        reprocesarConsultas:
          type: boolean
        backoffice:
          type: boolean
        editarContrato:
          type: boolean
        llenarConsultas:
          type: boolean
        corregirDictamen:
          type: boolean
        verAuditoria:
          type: boolean
        verVolumetria:
          type: boolean

    ResumenEmpresaBackoffice:
      type: object
      required: [empresa, configuracion, diagnosticos, vehiculos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía indicada en ?empresa=.
        configuracion:
          type: boolean
          description: La compañía ya tiene fila en configuracion_empresa.
        diagnosticos:
          type: integer
          format: int32
          minimum: 0
        vehiculos:
          type: integer
          format: int32
          minimum: 0

    Fuente:
      type: string
      enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    VisibilidadUsuario:
      type: string
      enum: [PROPIOS, EMPRESA]

    EstimadoConsultas:
      type: string
      enum: [NO_MOSTRAR, ANTES_DE_LANZAR, AL_FINALIZAR]

    Configuracion:
      type: object
      required: [empresa, contrato, operacion]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía del token.
        contrato:
          type: object
          required: [solo_lectura, fuentes_habilitadas, limite_vehiculos_lote, actualizado_en]
          properties:
            solo_lectura:
              type: boolean
              description: Siempre true para la compañía; el contrato lo edita el backoffice FLIT.
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        operacion:
          type: object
          required: [visibilidad_usuario, fuentes_por_defecto, estimado_consultas, actualizado_por, actualizado_en]
          properties:
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              description: Subconjunto de contrato.fuentes_habilitadas.
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
            actualizado_por:
              type: string
              format: uuid
              nullable: true
            actualizado_en:
              type: string
              format: date-time
              nullable: true

    EdicionOperativa:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        visibilidad_usuario:
          $ref: "#/components/schemas/VisibilidadUsuario"
        fuentes_por_defecto:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        estimado_consultas:
          $ref: "#/components/schemas/EstimadoConsultas"
      example:
        visibilidad_usuario: PROPIOS
        estimado_consultas: ANTES_DE_LANZAR

    ContratoBackoffice:
      type: object
      required: [empresa, fuentes_habilitadas, limite_vehiculos_lote, redaccion_ia_suspendida, fuentes_por_defecto, actualizado_por, actualizado_en]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía de la ruta.
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
          description: Interruptor de emergencia de la redacción IA (R-2). Solo lo ve el backoffice.
        fuentes_por_defecto:
          type: array
          description: Solo lectura aquí (las edita el admin de la compañía); se recortan al reducir las habilitadas.
          items:
            $ref: "#/components/schemas/Fuente"
        actualizado_por:
          type: string
          format: uuid
          nullable: true
          description: Usuario del backoffice del último cambio contractual.
        actualizado_en:
          type: string
          format: date-time
          nullable: true

    EdicionContrato:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
      example:
        limite_vehiculos_lote: 200

    TiposTramite:
      type: object
      required: [tipos]
      properties:
        tipos:
          type: array
          items:
            $ref: "#/components/schemas/TipoTramite"

    TipoTramite:
      type: object
      required: [codigo, nombre, familia, fuentesObligatorias]
      properties:
        codigo:
          type: string
          description: Código estable del tipo en Trámites.
          example: TRASPASO_STANDARD
        nombre:
          type: string
          example: TRASPASO
        familia:
          type: string
          description: MATRICULAS, TRASPASO u OTROS.
          example: TRASPASO
        fuentesObligatorias:
          type: array
          description: Fuentes que el tipo exige en el alcance (códigos RUNT, SIMIT_VEHICULO...). Vacía en D1.
          items:
            type: string

    ErrorRegla:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: SIN_EMPRESA
        error:
          type: string
