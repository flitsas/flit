  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/dictamen:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema: { type: string, format: uuid }
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote.
        schema: { type: string, format: uuid }
    get:
      tags: [Tablero]
      operationId: obtenerDictamenVehiculo
      summary: Dictamen vigente de un vehículo
      description: >
        Corte 7. Permiso diagnostico.diagnosticos.ver y la misma visibilidad que la grilla (AccesoLote). Devuelve la fila
        vigente: versión, veredicto, estado de redacción, alertamientos en el orden guardado, versión del catálogo y fecha.
        No trae override, lease, intentos ni empresa. Sin fila vigente, 404 SIN_DICTAMEN (el panel lo trata como vacío).
        No hay PUT en esta ruta: el reemplazo es del backoffice y un PUT aquí responde 404.
      responses:
        "200":
          description: Dictamen vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictamenVehiculo"
              example:
                version: 1
                veredicto: BLOQUEADO
                estado_redaccion: PENDIENTE
                alertamientos:
                  - { codigo: SOAT_NO_VIGENTE, texto: "El SOAT no está vigente, así que el traspaso queda bloqueado.", efecto: BLOQUEA, fuente: RUNT }
                catalogo_version: 1
                creado_en: "2026-11-03T15:00:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO si el lote no se ve o el vehículo no es de ese lote. `code` = SIN_DICTAMEN si el
            vehículo se ve y no tiene fila vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote (el de la grilla).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarPdfVehiculo
      summary: PDF corporativo de un vehículo
      description: >
        HU #13848 (F07-H3, F07-C1..C4/C8..C11). Permiso diagnostico.reportes.descargar y la misma visibilidad que la grilla.
        Se emite si el vehículo terminó (todas sus celdas en COMPLETADO o N/A) aunque el lote siga EN_PROCESO, o si el lote está
        INCOMPLETO con todas sus celdas cerradas: la fuente en ERROR sale «consulta no disponible», sin código de error ni causa
        (Q7). Encabezado con ID del diagnóstico, nombre del lote, empresa (claim company_name), creador («No disponible» si
        Identidad no responde), fecha y hora de creación (hora Colombia), tipo de análisis («Diagnóstico Simple» o «Diagnóstico
        Con Análisis IA — TRÁMITE») e identificación; una sección por fuente del alcance en el orden de la grilla (SIMIT con hasta
        100 comparendos y «y N más»; avalúo con valor sugerido o «sin valor comercial»; personas con «****» + 4 últimos y el
        rótulo «Declarado por el cliente»; impuesto departamental con «Total adeudado» y la grilla Vigencia / Valor / Estado
        «Pagada» o «Pendiente», o «No registra vigencias», HU #13864; N/A con su motivo); pie con «Generado el …» y «Página X de Y». Sin origen, usuario
        manual, proveedor ni transacción (R-20): una celda llenada a mano produce el mismo texto que una de API. Mientras no
        cambie ninguna entrada (celdas, versión del tablero, nombres del encabezado, documentos enmascarados), la descarga
        devuelve los mismos bytes ya guardados; si cambió, genera un PDF nuevo e invalida el anterior (se conserva).
      responses:
        "200":
          description: El PDF del vehículo.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}-{placa o VIN}.pdf
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario; o el vehículo no es
            de ese lote. El cuerpo no trae datos del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = VEHICULO_NO_TERMINADO: el vehículo todavía tiene consultas sin terminar y el lote no está INCOMPLETO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/excel:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarExcelLote
      summary: Excel del lote con columnas según el alcance y lo ya completado
      description: >
        HU #13849 (F07-H4, F07-C5/C6/C8..C11). Permiso diagnostico.reportes.descargar y la misma visibilidad que la grilla. Se
        emite con el lote EN_PROCESO, COMPLETADO o INCOMPLETO (lo no terminado sale con su estado). Hojas, en este orden:
        «Vehículos»: una fila por vehículo en el orden de la carga. Columnas fijas Orden, Identificador, Tipo de identificador
        (código, p. ej. PLACA_CARRO), Placa, VIN, Propietario actual declarado («TIPO ****1234» o vacío), Cambio de propietario
        (Sí, No o vacío; HU #14582) y Estado del vehículo (Terminado, En proceso o Con error). Luego, por cada fuente
        del alcance en el orden de la grilla, «{fuente} — Estado» (Completado, Pendiente, «No aplica: {motivo}» o «Consulta no
        disponible», sin código de error ni causa) y sus columnas de dato, que solo se llenan con la fuente Completado (catálogo
        ColumnasExcel): RUNT → Servicio, Clase, Organismo de tránsito, Marca, Línea, Modelo, Propietarios (cantidad), Locatarios
        (cantidad); SIMIT vehículo → Semáforo, Comparendos, Valor total; RUNT propietarios / RUNT locatarios → Personas
        consultadas, Personas con error, Documentos («TIPO ****1234» separados por «; »; los locatarios son solo los del RUNT: las
        personas históricas declaradas por el cliente no se pintan, HU #14582); SIMIT propietarios / SIMIT locatarios → las mismas más Comparendos y Valor total sumados de las
        personas; Avalúo → Valor sugerido, Fuente principal, Sin valor comercial (Sí/No); Impuesto departamental → Total adeudado (número,
        pesos enteros) y Vigencias pendientes (cantidad de vigencias no pagadas), HU #13864.
        El valor total en pesos es número; si el SIMIT trajo más comparendos de los que se listan (tope 100) sale el texto
        «al menos N». «Diagnóstico»: ID del diagnóstico, nombre del lote, empresa (claim company_name), usuario creador («No
        disponible» si Identidad no responde), fecha de creación (hora Colombia) y tipo de análisis («Diagnóstico Simple» o
        «Diagnóstico Con Análisis IA — TRÁMITE»). «Consultas»: solo con estimado_consultas=AL_FINALIZAR en la copia de
        configuración del lote y el lote COMPLETADO o INCOMPLETO; fuente, consultas estimadas, consultas consumidas y
        «al menos» si el estimado es mínimo (el mismo cálculo de la grilla). Sin origen, usuario manual, proveedor ni transacción
        (R-20): una celda llenada a mano produce la misma fila que una de API. Toda celda de texto que empiece por =, +, -, @,
        tabulador o retorno de carro se escribe como texto literal (sin fórmula, con quotePrefix). Mientras no cambie ninguna
        entrada (celdas, versión del tablero, nombres del encabezado, documentos enmascarados, estado del lote, lo que muestra
        el libro), la descarga devuelve los mismos bytes ya guardados; si cambió, genera un Excel nuevo e invalida el anterior
        (se conserva).
      responses:
        "200":
          description: El Excel del lote.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}.xlsx
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario. El cuerpo no trae datos
            del lote. Se comprueba antes del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = LOTE_SIN_LANZAR: el lote sigue CREADO (sin vehículos lanzados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    post:
      tags: [Reportes]
      operationId: pedirZipLote
      summary: Pide el ZIP con los PDF del lote, que se genera en segundo plano
      description: >
        HU #13850 (F07-H5, F07-C4/C7/C8/C9/C11/C12; decisiones Q2, Q5 y Q7). Permiso diagnostico.reportes.descargar y la misma
        visibilidad que la grilla. Solo `tipo` = ZIP. Entran los vehículos que pueden emitir su PDF (la regla del PDF del vehículo:
        terminados, aunque el lote siga EN_PROCESO, y con el lote INCOMPLETO también los que tienen fuentes en ERROR, que salen
        «consulta no disponible»); los demás van en el índice. Huella del ZIP = versión de la plantilla + entradas del lote (celdas con
        su versión del tablero, cabecera, empresa, creador, documentos enmascarados, estado del lote) + lista ordenada de los
        vehículos incluidos. Si el ZIP vigente está LISTA con esa huella responde 200 con él (no encola); si hay uno PENDIENTE o
        GENERANDO con esa huella responde 202 con el mismo id (no duplica, tampoco con pedidos simultáneos); si no, encola uno nuevo
        (202) con quien lo pidió (claim sub) y la empresa del claim company_name. Mientras el nuevo está en la cola, el anterior LISTA
        sigue vigente y descargable; al quedar LISTA el nuevo, el anterior pasa a no vigente (se conserva). Sin tope propio de
        vehículos: lo acota limite_vehiculos_lote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudEvidencia"
      responses:
        "200":
          description: Ya hay un ZIP LISTA y vigente con la misma huella (nada cambió desde que se generó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "202":
          description: El ZIP está en la cola (nuevo, o el que ya estaba con la misma huella). Sondear el estado hasta LISTA o ERROR.
          headers:
            Location:
              description: /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid} (estado del ZIP).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario. Sin datos del lote. Se
            comprueba antes del 422 y del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = SIN_VEHICULOS_TERMINADOS: ningún vehículo del lote puede emitir todavía su PDF. No se crea evidencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `code` = TIPO_INVALIDO, `campo` = tipo: el tipo no es ZIP (los PDF y el Excel se descargan directo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: eid
        in: path
        required: true
        description: Id del ZIP (el que devolvió el pedido).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: estadoZipLote
      summary: Estado del ZIP del lote
      description: >
        HU #13850 (F07-H5). Permiso diagnostico.reportes.descargar y la visibilidad de la grilla. Para sondear tras el pedido
        (Cache-Control no-store). PENDIENTE → GENERANDO → LISTA, o ERROR tras agotar los reintentos (por defecto 2, con espera
        creciente). Un fallo con reintentos pendientes vuelve a PENDIENTE.
      responses:
        "200":
          description: El estado del ZIP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.reportes.descargar (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no se ve (otra compañía o PROPIOS de otro usuario) o el ZIP no es de ese lote. Sin datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid}/archivo:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: eid
        in: path
        required: true
        description: Id del ZIP.
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarZipLote
      summary: Descarga el ZIP del lote cuando está LISTA
      description: >
        HU #13850 (F07-H5, F07-C9/C11). Permiso diagnostico.reportes.descargar y la visibilidad de la grilla. Un PDF por vehículo
        incluido (diagnostico-{8 primeros del id}-{placa o VIN}.pdf, el mismo PDF del vehículo: si su huella coincide se reutiliza el
        PDF vigente) e indice.xlsx (ajustes 2026-11-11, punto 8; reemplaza a indice.txt), una sola hoja: arriba el nombre del
        diagnóstico, la fecha y hora de generación (Colombia) y «N de M vehículos con PDF»; debajo una tabla con encabezado y
        autofiltro con todos los vehículos del lote en el orden de la carga: Orden, Placa/VIN (texto), Estado (Terminado, En proceso
        o Con error), En el ZIP (Sí / No), Archivo (nombre del PDF con vínculo relativo dentro del ZIP; vacío si no va), Dictamen
        (Viable, Bloqueado o Pendiente si no hay dictamen emitido), Motivos de bloqueo (rótulos de las reglas que bloquean,
        separados por «; », solo con Bloqueado) y Trámite (número del borrador creado desde el diagnóstico; vacío si no hay).
        Sin documentos completos, nombres de personas, origen, usuario manual, proveedor ni transacción
        (R-20). Un ZIP LISTA que ya no es el vigente se sigue pudiendo descargar por su id.
      responses:
        "200":
          description: El ZIP.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}.zip
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.reportes.descargar (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no se ve o el ZIP no es de ese lote. Se comprueba antes del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = EVIDENCIA_NO_LISTA: el ZIP está PENDIENTE, GENERANDO o en ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/consultas/{cid}/reprocesar:
    parameters:
      - name: cid
        in: path
        required: true
        description: Id de la celda (diagnostico.consultas).
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reprocesarConsulta
      summary: Reprocesa una celda en ERROR repitiendo la consulta real
      description: >
        HU #13746 (F03-H8, R-1, R-8, plan §6.1 fila 03). Permiso diagnostico.consultas.reprocesar (admin de la compañía;
        el usuario del producto recibe 403). Sin cuerpo: lo que venga se ignora y nunca se escriben datos de resultado.
        La celda vuelve a PENDIENTE con intentos_auto=0 y sube version_tablero (el sondeo de la grilla la ve volver a
        gris); el procesador repite la consulta real, sin reutilizar el dato del mismo día, y el intento queda con
        disparador=REPROCESO y el usuario del token. Si el lote estaba COMPLETADO o INCOMPLETO vuelve a EN_PROCESO, sin
        cerrado_en, con una fila del historial disparador=REPROCESO y el usuario; al terminar, el recalculador fija el
        estado final (COMPLETADO con historial AUTO si todo quedó bien). Las celdas COMPLETADO no se tocan. Al reprocesar
        la RUNT de un vehículo y terminar en OK, sus celdas BLOQUEADA_POR_RUNT vuelven a PENDIENTE en la misma
        transacción (pasando por las reglas de no aplica) y corren con disparador=REPROCESO y el mismo usuario; si la RUNT
        vuelve a fallar, siguen en ERROR. En una celda de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO, HU #13792;
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO, HU #13794) solo se vuelve a consultar a las personas que quedaron en
        ERROR: las que respondieron conservan su resultado y no se vuelven a consumir.
      responses:
        "202":
          description: La celda quedó en cola para repetir la consulta real.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocesoConsulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe, es de otra compañía o su lote (con PROPIOS) es de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            No es reprocesable y nada cambia: `code` = CELDA_NO_EN_ERROR (la celda no está en ERROR),
            CELDA_BLOQUEADA_POR_RUNT (tipo_error=BLOQUEADA_POR_RUNT y la RUNT del vehículo no está COMPLETADO: se
            reprocesa la RUNT) o CELDA_MODIFICADA (la celda cambió mientras se pedía: volver a leer la grilla).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/reintentar:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reintentarPlaca
      summary: Reencola las consultas pegadas de una placa
      description: >
        Ajuste 2026-11-11 (Punto 3, decisiones 3.2-3.4). Permiso diagnostico.consultas.reprocesar. Sin cuerpo. Reencola solo
        las celdas pegadas de la placa: en ERROR, o en PENDIENTE/EN_CURSO sin cambio hace más de
        Diagnostico:Consultas:UmbralPegada (10 min por defecto). Si la RUNT del vehículo no está COMPLETADO solo se reencola
        la RUNT (las demás esperan su cierre). Las COMPLETADO, NA y las recientes no se tocan. Cada celda sale por el camino
        del reproceso: PENDIENTE, intentos_auto=0 (vuelve a tener sus reintentos automáticos), disponible_desde=ahora, intento
        con disparador=REPROCESO y el usuario, y un trabajo con trabajo_id NUEVO; la respuesta tardía del trabajo anterior se
        descarta. Un lote COMPLETADO o INCOMPLETO vuelve a EN_PROCESO (historial REPROCESO). Idempotente: pulsar dos veces
        seguidas responde reencoladas=0 la segunda (una celda recién reencolada no cuenta como pegada). El dictamen de la placa
        se recalcula al completarse sus consultas.
      responses:
        "200":
          description: Celdas reencoladas (0 si no había ninguna pegada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReintentoPegadas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario, o el vehículo no es del lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = CELDA_MODIFICADA: una celda cambió mientras se pedía el reintento; volver a leer la grilla."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/tramite:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Derivacion]
      operationId: crearTramiteDesdeVehiculo
      summary: Crea el borrador del trámite de una placa (individual, síncrono)
      description: >
        Punto 4, incremento 2 (ADR-0084, diseño §5.1). Permiso diagnostico.derivacion.crear (el rol de backoffice no lo tiene).
        Solo existe con Diagnostico:Derivacion:Habilitada=true (apagada por defecto: 404). Desde el contexto de backoffice
        (petición con la empresa explícita ?empresa=) responde 403 DERIVACION_DESDE_BACKOFFICE aunque se tenga el permiso.
        Revalida en el servidor la misma regla de la grilla (fila derivacion): vehículo terminado, dictamen vigente VIABLE
        (solo en lotes CON_ANALISIS; los SIMPLE no tienen dictamen), sin trámite y sin otro intento en curso. Tipo de trámite:
        en CON_ANALISIS el del lote (se ignora el del cuerpo); en SIMPLE el tipo_tramite_codigo del cuerpo, validado contra
        GET /tipos-tramite. Llama al rpc CrearBorradorDesdeDiagnostico de core-api con la empresa del lote, el usuario que
        lanza como autor, external_ref = id del vehículo y el OT de matrícula del RUNT (nombre y código de la réplica). Es
        idempotente en Trámites: si el borrador ya existía responde 201 con ya_existia=true. Un rechazo de Trámites deja el
        intento OMITIDO (la placa se puede volver a intentar); Trámites caído lo deja FALLIDO. Al crearse, el vehículo guarda
        el trámite (id y número) una sola vez.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTramiteEntrada"
      responses:
        "201":
          description: Borrador creado (o ya existente en Trámites).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TramiteCreado"
        "400":
          description: >
            code = TIPO_TRAMITE_REQUERIDO (lote SIMPLE sin tipo_tramite_codigo, campo = tipo_tramite_codigo),
            TIPO_TRAMITE_INVALIDO (no está en el catálogo de la etapa) o CUERPO_INVALIDO (JSON inválido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.derivacion.crear; desde el backoffice (code = DERIVACION_DESDE_BACKOFFICE); sin compañía
            (code = SIN_EMPRESA); compañía sin Diagnóstico activo (code = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            code = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario, o el vehículo no es
            del lote. También si la derivación está apagada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "code = YA_TIENE_TRAMITE: el vehículo ya tiene su trámite; no se llama a Trámites."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictoTramite"
        "422":
          description: >
            code = NO_ELEGIBLE. motivo_codigo: NO_TERMINADO, NO_VIABLE, EN_CURSO (otro intento del vehículo en vuelo, p. ej.
            doble clic) o un rechazo de Trámites (TIPO_NO_DISPONIBLE, FAMILIA_BLOQUEADA, USUARIO_SIN_PERMISO, OT_NO_HABILITADO,
            REGLA_COMPANIA, TRAMITE_ACTIVO_DUPLICADO, EMPRESA_INACTIVA, REFERENCIA_DE_OTRO_ORIGEN, DATOS_INVALIDOS,
            RECHAZO_TRAMITES). motivo en lenguaje claro, sin datos personales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoElegibleDerivacion"
        "503":
          description: >
            code = TRAMITES_NO_DISPONIBLE (o CATALOGO_NO_DISPONIBLE si en un lote SIMPLE el catálogo no responde). Con
            Retry-After solo si es transitorio (UNAVAILABLE, RESOURCE_EXHAUSTED, DEADLINE_EXCEEDED, INTERNAL); sin él si es de
            configuración (cliente de servicio rechazado o derivación apagada en core-api). El intento queda FALLIDO y se puede
            volver a pedir. Incremento 3: con el freno hacia Trámites abierto (varios transitorios seguidos) responde 503 sin
            llamar ni crear el intento, con Retry-After = lo que falta de la pausa.
          headers:
            Retry-After:
              description: Segundos antes de reintentar (solo transitorio).
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Derivacion]
      operationId: crearTramitesDesdeDiagnostico
      summary: Crea los borradores de trámite de una selección del lote (masivo, encolado)
      description: >
        Punto 4, incremento 3 (ADR-0084, diseño §5.1 y §5.3). Permiso diagnostico.derivacion.crear; 403
        DERIVACION_DESDE_BACKOFFICE desde el contexto de backoffice. Solo existe con Diagnostico:Derivacion:Habilitada=true.
        vehiculo_ids son los vehículos elegidos, en el orden de la selección (los repetidos cuentan una vez), entre 1 y
        Diagnostico:Derivacion:MaxItemsPorOperacion (5000). Todos deben ser del lote (si no, 400 VEHICULO_FUERA_DEL_LOTE y no
        se crea nada). Tipo de trámite: el del lote en CON_ANALISIS (se ignora el del cuerpo); en SIMPLE el del cuerpo,
        validado contra GET /tipos-tramite. En una transacción crea la operación MASIVA con un ítem por vehículo: los
        elegibles PENDIENTE y los no elegibles OMITIDO de inmediato con su motivo (no_elegibles); luego libera como mucho
        Diagnostico:Derivacion:CreditoPorCompania ítems de la compañía (2 por defecto) publicando por la outbox el evento
        diagnostico.derivacion.solicitada (solo ids). Cada ítem que cierra libera el siguiente de la compañía. No llama a
        Trámites en la petición. Idempotente ante el doble clic: un vehículo con un ítem vivo (de este envío o de otro) queda
        en no_elegibles con EN_CURSO; nunca hay dos ítems vivos del mismo vehículo. El progreso se lee en Location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTramitesEntrada"
      responses:
        "202":
          description: Operación creada y encolada.
          headers:
            Location:
              description: /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones/{operacion_id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacionEncolada"
        "400":
          description: >
            code = VEHICULOS_REQUERIDOS (lista vacía o ausente, campo = vehiculo_ids), DEMASIADOS_VEHICULOS (más de
            MaxItemsPorOperacion), VEHICULO_FUERA_DEL_LOTE (algún vehículo no es del lote), TIPO_TRAMITE_REQUERIDO,
            TIPO_TRAMITE_INVALIDO o CUERPO_INVALIDO. Las dos primeras y CUERPO_INVALIDO se deciden sin tocar la base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.derivacion.crear o desde el backoffice (code = DERIVACION_DESDE_BACKOFFICE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no existe o no es visible para el usuario. También con la derivación apagada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "code = CATALOGO_NO_DISPONIBLE: lote SIMPLE y el catálogo de tipos no responde (con Retry-After)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: ultima
        in: query
        required: false
        description: Con true, las operaciones EN_CURSO del lote y la más reciente (para retomar al volver a la pantalla).
        schema:
          type: boolean
    get:
      tags: [Derivacion]
      operationId: listarOperacionesDerivacion
      summary: Operaciones «Crear trámite» del lote
      description: >
        Punto 4, incremento 3. Permiso diagnostico.diagnosticos.ver. De la más reciente a la más antigua (20). Lee solo los
        contadores propios de Diagnóstico; nunca llama a core-api.
      responses:
        "200":
          description: Operaciones del lote.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgresoOperacion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no existe o no es visible. También con la derivación apagada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones/{opId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: opId
        in: path
        required: true
        description: Id de la operación.
        schema:
          type: string
          format: uuid
      - name: estado
        in: query
        required: false
        description: Filtra los ítems por estado.
        schema:
          type: string
          enum: [PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO]
      - name: pagina
        in: query
        required: false
        description: Página de ítems (50 por página), desde 1.
        schema:
          type: integer
          minimum: 1
          default: 1
    get:
      tags: [Derivacion]
      operationId: leerOperacionDerivacion
      summary: Progreso de una operación «Crear trámite»
      description: >
        Punto 4, incremento 3. Permiso diagnostico.diagnosticos.ver. Contadores (pendientes = total − creadas − omitidas −
        fallidas, incluye los en vuelo), motivos agrupados de OMITIDO y FALLIDO y una página de ítems por orden de la
        selección. El front lo sondea cada 3 s mientras está EN_CURSO. Lee solo tablas de Diagnóstico; nunca llama a core-api.
      responses:
        "200":
          description: Progreso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleOperacionDerivacion"
        "400":
          description: "code = ESTADO_INVALIDO: el filtro estado no es uno de los cinco."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no es visible o la operación no es de ese lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones/{opId}/reintentar-fallidas:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: opId
        in: path
        required: true
        description: Id de la operación.
        schema:
          type: string
          format: uuid
    post:
      tags: [Derivacion]
      operationId: reintentarFallidasDerivacion
      summary: Vuelve a encolar los ítems FALLIDO de una operación
      description: >
        Punto 4, incremento 3. Permiso diagnostico.derivacion.crear; 403 DERIVACION_DESDE_BACKOFFICE desde el backoffice.
        Solo con la operación sin ítems PENDIENTE ni ENVIADO (si no, 409 OPERACION_EN_CURSO). Cada FALLIDO se revalida:
        si sigue elegible se reabre el MISMO ítem a PENDIENTE (sin motivo ni intentos) y la operación vuelve a EN_CURSO; si ya
        no lo es, queda OMITIDO con su motivo. Luego se libera el crédito de la compañía. Sin fallidos responde 202 con 0.
      responses:
        "202":
          description: Fallidos reencolados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReintentoFallidas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.derivacion.crear o desde el backoffice (code = DERIVACION_DESDE_BACKOFFICE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no es visible o la operación no es de ese lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "code = OPERACION_EN_CURSO: quedan ítems en vuelo, otro reintento corre a la vez o algún vehículo ya tiene otro ítem vivo."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/reintentar-pegadas:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reintentarPegadasLote
      summary: Reencola las consultas pegadas de todo el lote
      description: >
        Ajuste 2026-11-11 (Punto 3). Igual que reintentarPlaca, para todas las placas del lote en una sola transacción. Permiso
        diagnostico.consultas.reprocesar. Idempotente. El tablero lo ofrece como «Reintentar pegadas (N)» con N = total_pegadas
        de la grilla.
      responses:
        "200":
          description: Celdas reencoladas (0 si no había ninguna pegada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReintentoPegadas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = CELDA_MODIFICADA: una celda cambió mientras se pedía el reintento; volver a leer la grilla."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express:
    post:
      tags: [Express]
      operationId: crearDiagnosticoExpress
      summary: Crea un diagnóstico Express de un solo vehículo (cabecera y vehículo en una transacción)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F02-H6, F02-C4/C12/C13, F01-C10). El backoffice FLIT no lo tiene
        (R-6): 403. Primero revalida el vehículo con la regla de fila de la carga y de la confirmación: identificador
        ausente (IDENTIFICADOR_REQUERIDO), que no es placa ni VIN (IDENTIFICADOR_INVALIDO), de más de 8 caracteres de placa
        o 17 de VIN después de limpiar, nunca recortado (IDENTIFICADOR_DEMASIADO_LARGO), o documento del locatario mal
        formado (TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO): 422 con `campo` y no se crea nada.
        Después, en una sola transacción, crea la cabecera en CREADO con es_express = true y las mismas reglas de
        POST /diagnosticos (422 con su campo; 503 con CON_ANALISIS y el catálogo caído) y confirma el vehículo como
        POST /diagnosticos/{id}/vehiculos (documento del locatario cifrado con origen DECLARADO_CLIENTE, estimado en la
        cabecera, entrega al motor de consultas, que crea las celdas y deja el lote EN_PROCESO, HU #13727; por eso
        `estado` llega EN_PROCESO). Si algo falla no queda cabecera ni vehículo. Sin nombre (o solo
        espacios) se autogenera «Express IDENTIFICADOR» con el identificador normalizado, sin fecha (HU #14087; los
        nombres ya guardados no cambian); un nombre enviado se valida como en POST /diagnosticos (máximo 150).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "201":
          description: Diagnóstico Express creado con su único vehículo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressCreado"
        "400":
          description: Cuerpo que no es JSON válido.
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.crear (sin cuerpo; el backoffice FLIT, R-6); sin usuario (`code` = SIN_USUARIO),
            sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Regla del vehículo (`campo` = identificador, tipo_documento_propietario o documento_propietario) o de la cabecera
            (los códigos de POST /diagnosticos). No se crea nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "`code` = CATALOGO_NO_DISPONIBLE: CON_ANALISIS y el catálogo de tipos de trámite no está disponible. No se crea nada."
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express/estimado:
    post:
      tags: [Express]
      operationId: estimarDiagnosticoExpress
      summary: Estimado de consultas por fuente del Express antes de lanzarlo (no persiste nada)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F01-C11). Endpoint nuevo frente al plan §6.1. Recibe el mismo
        cuerpo que POST /express y no guarda nada. Con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de
        la compañía del token responde mostrar_estimado = true y el estimado por fuente del alcance para un vehículo (las
        fuentes del locatario cuentan 0 sin documento de locatario); con otro valor responde mostrar_estimado = false sin
        estimado_consultas. Un código de fuente desconocido es 422 VALOR_FUERA_DE_CONJUNTO y un documento del locatario mal
        formado es 422 con su campo. No valida el identificador ni las fuentes habilitadas (eso lo hace POST /express).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "200":
          description: Estimado de vista previa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimadoExpress"
        "400":
          description: Cuerpo que no es JSON válido.
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear (el backoffice FLIT, R-6); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: "`code` = VALOR_FUERA_DE_CONJUNTO (fuente desconocida) o error de forma del documento del locatario, con `campo`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/fuentes-obligatorias:
    get:
      tags: [Backoffice, Catalogos]
      operationId: listarFuentesObligatoriasBackoffice
      summary: Catálogo global de fuentes obligatorias por trámite (backoffice FLIT)
      description: >
        ADR-0078. Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT). No pide
        ?empresa=: el dato es de FLIT, no de una compañía. Mandar ?empresa= no cambia la respuesta y no responde
        EMPRESA_REQUERIDA. No se registra en lecturas_backoffice. Lista las cabeceras guardadas con sus líneas;
        una cabecera con fuentes vacías va en el arreglo y una definición que no existe no va (en el alta, eso es
        heredar). Orden: familias por código, después tipos por código. Dentro de fuentes, el orden del enum
        Fuente sin RUNT.
      responses:
        "200":
          description: Definiciones guardadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDefinicionesFuentesObligatorias"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            La política no pasa (sin cuerpo). También SIN_EMPRESA, SIN_USUARIO si el token no trae compañía o
            usuario, y PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Catalogos]
      operationId: guardarFuentesObligatoriasBackoffice
      summary: Reemplaza las fuentes de una definición (backoffice FLIT)
      description: >
        Misma política que el GET, sin permiso distinto y sin ?empresa=. El cuerpo es la lista completa. Si la
        cabecera no existe, la crea con uuid v7. Si existe, la conserva y reemplaza las líneas. fuentes vacío
        deja la cabecera (vacío explícito) y no la borra. Una fuente repetida cuenta una vez. La respuesta trae
        fuentes en el orden del enum Fuente sin RUNT. actualizado_por toma el sub del token. Con un error no se
        escribe ninguna línea. Orden de validación: forma (CUERPO_INVALIDO, DEFINICION_AMBIGUA) y después
        negocio (FUENTE_DESCONOCIDA, FUENTE_RUNT_NO_CONFIGURABLE, SIMIT_PROHIBIDO_EN_UNILATERAL,
        PISO_NO_DISPENSABLE). No hay DELETE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinicionFuentesObligatorias"
      responses:
        "200":
          description: Definición guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinicionFuentesObligatorias"
        "400":
          description: >
            `code` = CUERPO_INVALIDO si el cuerpo no es un objeto JSON o no trae el arreglo fuentes.
            `code` = DEFINICION_AMBIGUA (`campo` = familia) si vienen familia y tipo, no viene ninguno, o el
            texto no cumple ^[A-Z][A-Z0-9_]{0,63}$.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            La política no pasa (sin cuerpo). SIN_USUARIO si el sub no es un uuid, ya con el cuerpo aceptado y
            antes de escribir. También SIN_EMPRESA y PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `campo` = fuentes. `code` = FUENTE_DESCONOCIDA (no está en el enum), FUENTE_RUNT_NO_CONFIGURABLE
            (el arreglo incluye RUNT), SIMIT_PROHIBIDO_EN_UNILATERAL (TRASPASO_UNILATERAL incluye un SIMIT_*)
            o PISO_NO_DISPENSABLE (falta SIMIT_PROPIETARIO en la familia TRASPASO, en TRASPASO_STANDARD o en
            TRASPASO_TRANSFERENCIA_DE_DOMINIO). VALOR_INVALIDO si un CHECK de la base se escapa (SQLSTATE 23514).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas:
    get:
      tags: [Backoffice, Configuracion]
      operationId: listarEmpresasBackoffice
      summary: Empresas con Diagnóstico para el selector del editor de contrato (backoffice FLIT)
      description: >
        HU #13741 (escenarios 15 y 16). Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT). Desde los ajustes 2026-11-11 (punto 6) ya no exige
        diagnostico.configuracion.contrato.editar: también la usa el selector del listado de diagnósticos.
        Devuelve las empresas activas con Diagnóstico encendido tal como las tiene Identidad
        (EmpresasService.ListarEmpresasConProducto, producto diagnostico), ordenadas por nombre (sin distinguir
        mayúsculas ni tildes). Solo lectura de la plataforma: no lleva empresa explícita ni se registra en
        lecturas_backoffice. Nunca responde una lista vacía cuando Identidad no está configurada o no responde:
        en esos casos, 503 con `code`.
      responses:
        "200":
          description: Empresas con Diagnóstico encendido (puede ser vacía solo si Identidad respondió sin ninguna).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmpresaBackoffice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o
            PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = IDENTIDAD_NO_CONFIGURADA: el servicio no tiene Diagnostico:Identidad:Address (sin Retry-After).
            `code` = IDENTIDAD_NO_DISPONIBLE: Identidad no respondió o rechazó al cliente de servicio (con Retry-After).
          headers:
            Retry-After:
              description: Segundos antes de reintentar (solo con IDENTIDAD_NO_DISPONIBLE).
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas/{empresa}/configuracion/contrato:
    parameters:
      - name: empresa
        in: path
        required: true
        description: >
          Compañía cuyo contrato se lee o edita (uuid distinto de cero). Si además llega ?empresa=, debe
          coincidir (si no, 400 EMPRESA_REQUERIDA).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice, Configuracion]
      operationId: obtenerContratoEmpresaBackoffice
      summary: Contrato de una compañía para el backoffice FLIT
      description: >
        Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y además
        diagnostico.configuracion.contrato.editar (HU #13741). La lectura queda en diagnostico.lecturas_backoffice
        antes de leer. Sin fila guardada devuelve los valores por defecto.
      responses:
        "200":
          description: Contrato de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida o distinta en la ruta y en la consulta (`code` = EMPRESA_REQUERIDA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); token sin
            compañía (SIN_EMPRESA) o sin usuario (SIN_USUARIO); PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Configuracion]
      operationId: editarContratoEmpresaBackoffice
      summary: Edita el contrato de una compañía (backoffice FLIT)
      description: >
        Mismos permisos que el GET. Edita fuentes_habilitadas, limite_vehiculos_lote (mayor que cero) y el
        interruptor de emergencia redaccion_ia_suspendida (R-2) de la compañía de la ruta, por la vía de
        escritura entre compañías del módulo Backoffice (ADR-0073). Se guardan los campos que llegan. Reducir
        las habilitadas recorta fuentes_por_defecto en el mismo comando. Cada campo que cambia (también el
        recorte) queda en diagnostico.cambios_contrato con el usuario, la compañía, el valor anterior y el nuevo;
        el PUT no se registra en lecturas_backoffice. Orden de validación: un campo que no es del contrato da
        403 CAMPO_NO_EDITABLE; un valor fuera de conjunto, 422 VALOR_FUERA_DE_CONJUNTO; un límite que no es un
        entero positivo, 422 LIMITE_INVALIDO; habilitar una fuente sin adaptador registrado (en D2 solo RUNT lo
        tiene, HU #13733) o IMPUESTO_DEPARTAMENTAL mientras no esté disponible (C3, R-9; HU #13863: bandera
        Diagnostico:Fuentes:ImpuestoDisponible en true, adaptador conectado y al menos un departamento soportado
        en la réplica), 422 FUENTE_NO_DISPONIBLE: es la misma regla de fuentes_disponibles. Quitar del contrato
        una fuente habilitada que dejó de estar disponible sigue permitido. Con un error no
        se guarda ningún campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionContrato"
      responses:
        "200":
          description: Contrato guardado (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida (EMPRESA_REQUERIDA) o cuerpo que no es un objeto o repite un campo (CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); campo que no
            es del contrato (CAMPO_NO_EDITABLE); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, LIMITE_INVALIDO, FUENTE_NO_DISPONIBLE o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/consultas/{consulta}/intentos:
    get:
      tags: [Backoffice]
      operationId: listarIntentosConsultaBackoffice
      summary: Intentos de una celda (auditoría del backoffice FLIT)
      description: >
        HU #13737 (F03-H6, F03-C11, plan §6.1 fila 03). Cada ejecución de una celda deja un intento de solo
        inserción en diagnostico.intentos_consulta (disparador AUTO y usuario_id nulo cuando lo hace el
        procesador; los reintentos de errores transitorios con backoff también dejan su intento). Política
        diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y además diagnostico.auditoria.ver:
        un usuario de la compañía recibe 403. Empresa explícita en ?empresa=; la lectura queda en
        diagnostico.lecturas_backoffice. Los intentos nunca llevan documentos: solo la placa o el VIN consultado.
        Orden: inicio ascendente.
      parameters:
        - name: consulta
          in: path
          required: true
          description: Id de la celda (diagnostico.consultas.id).
          schema:
            type: string
            format: uuid
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña de la celda (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Intentos de la celda, del más antiguo al más reciente (lista vacía si aún no se ejecutó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentosConsulta"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice o le falta diagnostico.auditoria.ver (sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: La celda no existe en la compañía indicada (`code` = CONSULTA_NO_ENCONTRADA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/consultas/{consulta}/manual:
    parameters:
      - name: consulta
        in: path
        required: true
        description: Id de la celda (`vehiculos[].celdas[].id` de obtenerGrillaDiagnosticoBackoffice).
        schema:
          type: string
          format: uuid
      - name: empresa
        in: query
        required: true
        description: Id de la compañía dueña de la celda (uuid distinto de cero, un solo valor).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerFormularioLlenadoManualBackoffice
      summary: Formulario del llenado manual de una celda (backoffice FLIT)
      description: >
        HU #13800 (F06-H3). Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT), además
        la política de operación FLIT diagnostico.backoffice.operacion (el SuperAdmin de cualquier compañía, o compañía FLIT con diagnostico.backoffice.ver; decisión D23) y diagnostico.consultas.llenar; empresa explícita en ?empresa= (la lectura queda en diagnostico.lecturas_backoffice).
        Devuelve la versión de la celda que se manda en el PUT, si admite el llenado (`admite_manual`) y, si no, el `motivo`
        (FUENTE_NO_ADMITE_MANUAL, CELDA_NO_EN_ERROR, CELDA_BLOQUEADA_POR_RUNT o SIN_PERSONAS_EN_ERROR). En las fuentes de persona
        (RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO) trae SOLO las personas en ERROR con su
        `persona_id` (el que va en el PUT), el documento enmascarado y la `consulta` que define el esquema de su resultado
        (RUNT_PERSONA, RUES o SIMIT); en las del vehículo, `personas` es null. Nunca el documento en claro ni el payload.
        En el avalúo llenado con referencia Fasecolda trae `referencia` (HU #14563 B6, solo backoffice). Responde con
        Cache-Control no-store y Pragma no-cache (hallazgo M2).
      responses:
        "200":
          description: Formulario de la celda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormularioLlenadoManual"
              example:
                id: 0199f3a1-6666-7000-8000-000000000006
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                vehiculo_id: 0199f3a1-2222-7000-8000-000000000002
                fuente: SIMIT_PROPIETARIO
                estado: ERROR
                tipo_error: PERSONAS_CON_ERROR
                version: 2
                admite_manual: true
                motivo: null
                personas:
                  - { persona_id: 0199f3a1-7777-7000-8000-000000000007, orden: 2, rol: PROPIETARIO, tipo_documento: C, documento_enmascarado: "****0102", declarado_por_cliente: false, consulta: SIMIT, tipo_error: TIMEOUT }
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (usuario de otra compañía que no es SuperAdmin) o le falta diagnostico.consultas.llenar (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice]
      operationId: llenarConsultaManualBackoffice
      summary: Llenar a mano una celda en ERROR (backoffice FLIT)
      description: >
        HU #13800 (F06-H3, F06-C8..C11, R-1, R-8, R-20). Misma autorización que el GET (sin diagnostico.consultas.llenar: 403;
        el admin y el usuario de la compañía: 403). Solo una celda en ERROR que no sea BLOQUEADA_POR_RUNT, de una fuente distinta
        de RUNT e IMPUESTO_DEPARTAMENTAL (Q3, R-9). El cuerpo lleva la `version` de la celda que vio el backoffice (la de la
        grilla del backoffice o la del GET) y, según la fuente, `resultado` (SIMIT_VEHICULO: ResultadoManualSimit; AVALUO:
        ResultadoManualAvaluo) o `personas` (fuentes de persona: TODAS las personas en ERROR y solo ellas, cada una con el
        esquema de su `consulta`: RUNT_PERSONA, ResultadoManualRuntPersona; RUES, ResultadoManualRues; SIMIT,
        ResultadoManualSimit). Esquema cerrado: un campo desconocido es 422. La fecha del dato la fija el servidor (el avalúo
        no acepta `fecha`). En una transacción: la celda queda COMPLETADO con origen MANUAL y el usuario, tipo_error null y
        dato_obtenido_en del servidor; sube la versión del tablero; queda un intento disparador=MANUAL con el usuario, sin
        servicio ni transacción del proveedor (uno por persona llenada en las de persona; no consume); si el lote estaba
        COMPLETADO o INCOMPLETO vuelve a EN_PROCESO (historial MANUAL con el usuario) y se recalcula (sin más errores pasa a
        COMPLETADO, historial AUTO). Las personas que respondieron por API no cambian. La compañía no distingue el dato
        (mismo payload que la API; su historial muestra MANUAL como AUTO, Q5). Una celda MANUAL nunca se reutiliza el mismo día.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LlenadoManualVehiculo"
                - $ref: "#/components/schemas/LlenadoManualPersonas"
            examples:
              simitVehiculo:
                summary: SIMIT_VEHICULO
                value:
                  version: 14
                  resultado:
                    semaforo: AMARILLO
                    cantidad_comparendos: 1
                    comparendos:
                      - { numero: TST-C-0001, fecha: "2026-09-30", valor: "468500", estado: PENDIENTE, organismo: Organismo de prueba }
              avaluo:
                summary: AVALUO con valor
                value:
                  version: 9
                  resultado:
                    sin_valor_comercial: false
                    valor_sugerido: 48500000
                    fuente_principal: fasecolda
                    fuentes:
                      - { fuente: fasecolda, estado: OK, valor: 48500000, muestras: 3 }
                      - { fuente: mercado_libre, estado: SIN_DATOS }
              avaluoSinValor:
                summary: AVALUO sin valor comercial
                value:
                  version: 9
                  resultado: { sin_valor_comercial: true, fuentes: [{ fuente: fasecolda, estado: SIN_DATOS }] }
              simitPersona:
                summary: SIMIT_PROPIETARIO (solo las personas en ERROR)
                value:
                  version: 2
                  personas:
                    - persona_id: 0199f3a1-7777-7000-8000-000000000007
                      resultado: { semaforo: VERDE, cantidad_comparendos: 0, comparendos: [] }
              runtPersona:
                summary: RUNT_PROPIETARIO, persona natural (consulta RUNT_PERSONA)
                value:
                  version: 5
                  personas:
                    - persona_id: 0199f3a1-8888-7000-8000-000000000008
                      resultado: { inscrito: true, estado_conductor: ACTIVO, licencias: [{ categoria: B1, estado: VIGENTE, vigente_hasta: "2030-01-01" }] }
              rues:
                summary: RUNT_PROPIETARIO con NIT (consulta RUES)
                value:
                  version: 5
                  personas:
                    - persona_id: 0199f3a1-9999-7000-8000-000000000009
                      resultado: { encontrada: true, estado_matricula: ACTIVA, ultima_renovacion: "2026-03-31" }
      responses:
        "200":
          description: Celda llenada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlenadoManualRespuesta"
              example:
                id: 0199f3a1-4444-7000-8000-000000000004
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                vehiculo_id: 0199f3a1-2222-7000-8000-000000000002
                fuente: SIMIT_VEHICULO
                estado: COMPLETADO
                origen: MANUAL
                usuario_manual_id: 0199f3a1-5555-7000-8000-000000000005
                dato_obtenido_en: "2026-10-22T17:30:00+00:00"
                version: 15
                estado_lote: COMPLETADO
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA), o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (usuario de otra compañía que no es SuperAdmin) o le falta diagnostico.consultas.llenar (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe en la compañía indicada (nada cambia)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            Nada cambia. `code` = CELDA_MODIFICADA (la `version` enviada no es la actual, p. ej. un reproceso en curso:
            recargar la grilla), CELDA_NO_EN_ERROR (COMPLETADO, también el avalúo «sin valor comercial»; PENDIENTE, EN_CURSO o NA)
            o CELDA_BLOQUEADA_POR_RUNT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Nada cambia. `code` = FUENTE_NO_ADMITE_MANUAL (RUNT o IMPUESTO_DEPARTAMENTAL), RESULTADO_INVALIDO con `campo` (ruta del
            cuerpo, p. ej. `version`, `resultado`, `resultado.proveedor`, `resultado.fuentes[0].valor`, `personas`,
            `personas[0].resultado.licencias[1].categoria`) o PERSONA_NO_EN_ERROR con `campo` = `personas[i].persona_id` (la persona
            no está en ERROR en la celda: las que respondieron por API no se llenan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
              example: { code: RESULTADO_INVALIDO, error: "El campo «proveedor» no existe en el esquema de esta fuente.", campo: resultado.proveedor }

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/vehiculos/{vid}/dictamen:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote de la compañía indicada.
        schema: { type: string, format: uuid }
      - name: vid
        in: path
        required: true
        description: Id del vehículo de ese lote.
        schema: { type: string, format: uuid }
      - name: empresa
        in: query
        required: true
        description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
        schema: { type: string, format: uuid }
    get:
      tags: [Backoffice]
      operationId: obtenerDictamenVehiculoBackoffice
      summary: Dictamen vigente de un vehículo (backoffice FLIT)
      description: >
        Corte 7. Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y empresa explícita en
        ?empresa= (la lectura queda en diagnostico.lecturas_backoffice antes de tocar la fila). El mismo cuerpo que la
        compañía más analisis_override, usuario_override_id (uuid, sin nombre) y override_en. Sin lease, intentos ni texto
        de cola. Un usuario de la compañía recibe 403.
      responses:
        "200":
          description: Dictamen vigente, con los tres campos de override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictamenVehiculoBackoffice"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de configuración del backoffice (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO si el lote o el vehículo no son de la compañía indicada. `code` = SIN_DICTAMEN si no
            hay fila vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice]
      operationId: corregirDictamenVehiculoBackoffice
      summary: Ajuste FLIT del dictamen vigente (backoffice FLIT)
      description: >
        Corte 7; HU #14563 B7 (ADR-0086 D-2, D6, D7, D8, D9). La misma política del GET, además la política de operación FLIT
        diagnostico.backoffice.operacion (el SuperAdmin de cualquier compañía, o compañía FLIT con diagnostico.backoffice.ver;
        decisión D23) y diagnostico.dictamen.override. El admin de la compañía recibe 403.
        El cuerpo es el estado deseado y el motivo es obligatorio en todo PUT (B-PR6: el cuerpo legado {veredicto, confirmado}
        sin motivo se retiró). Sin alertamientos reemplaza solo el veredicto: los textos vuelven a la plantilla y la redacción
        queda PENDIENTE. Con alertamientos nace una versión redactada a mano (redactado_por MANUAL, estado_redaccion
        COMPLETADA, el LLM no la reescribe) y cada alertamiento lleva ajuste AGREGADO o EDITADO frente a la vigente (solo en
        backoffice). En los dos casos la anterior queda vigente=false, la nueva guarda el autor, la fecha, el motivo y
        ajustado_desde_version, y la fila del tablero sube su versión. Orden de bloqueo cabecera → vehículo → dictamen; toda
        carrera responde 409, nunca 500. No notifica (D8). No genera PDF ni toca el Excel; el PDF y el ZIP siguientes llevan
        la marca «Ajustado por FLIT» (su huella cambia). Publica diagnostico.dictamen.emitido con override=true (y
        ajuste_alertamientos=true si hubo alertamientos) en la misma transacción. Un recálculo automático posterior gana (D7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuerpoOverrideDictamen"
            example:
              version_esperada: 3
              veredicto: VIABLE
              alertamientos:
                - { codigo: SOAT_NO_VIGENTE, texto: "Soporte verificó el SOAT vigente con la aseguradora.", efecto: ADVIERTE, fuente: RUNT }
              motivo: "Soporte verificó el SOAT vigente con la aseguradora"
              confirmar_con_tramite: false
      responses:
        "200":
          description: Dictamen nuevo, con los tres campos de override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictamenVehiculoBackoffice"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se escribe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (usuario de otra compañía que no es SuperAdmin) o le falta diagnostico.dictamen.override. No se escribe.
        "404":
          description: "`code` = NO_ENCONTRADO o SIN_DICTAMEN. No se escribe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            Nada cambia. `code` = VEREDICTO_SIN_CAMBIO si el veredicto y los alertamientos pedidos son los de la vigente.
            `code` = DICTAMEN_DESACTUALIZADO si version_esperada no es la versión vigente (otro cambio llegó antes).
            `code` = DICTAMEN_EN_CONFLICTO si dos ajustes chocan en ux_dictamen_version, ux_dictamen_vigente o en el xmin
            de la vigente. `code` = VEHICULO_CON_TRAMITE si el vehículo ya tiene trámite y no llega confirmar_con_tramite=true
            (con él, el ajuste se aplica y el trámite no se revierte ni se cancela).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Nada cambia. `campo` señala el campo cuando aplica; el mensaje es fijo y nunca repite lo digitado.
            `code` = MOTIVO_REQUERIDO (campo motivo) si falta o tiene menos de 10 o más de 500 caracteres tras recortar.
            `code` = VERSION_ESPERADA_INVALIDA (campo version_esperada) si falta, es null o no es un entero mayor que cero,
            en todo PUT. `code` = VALOR_INVALIDO (campo con el nombre de la clave, o el objeto que la trae si no parece un
            nombre de campo) si el cuerpo o un alertamiento trae una clave desconocida (additionalProperties: false). `code` = DICTAMEN_INCOHERENTE (campo alertamientos) si un VIABLE
            trae un alertamiento que bloquea o un BLOQUEADO no trae ninguno. `code` = ALERTAMIENTO_INVALIDO (campo
            alertamientos) por un código fuera del catálogo (salvo AJUSTE_FLIT o uno de la vigente), un efecto distinto de
            BLOQUEA/ADVIERTE, una fuente desconocida o un texto vacío o de más de 500 caracteres. `code` =
            ALERTAMIENTO_CON_DIGITOS (campo alertamientos; supuesto aceptado, P3 = b) si un alertamiento AJUSTE_FLIT trae 6
            o más dígitos seguidos (el motivo no se filtra). `code` = CONFIRMADO_REQUERIDO si confirmado viene y no es true.
            `code` = VEREDICTO_INVALIDO si el veredicto no es VIABLE ni BLOQUEADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/vehiculos/{vid}/dictamen/versiones:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote de la compañía indicada.
        schema: { type: string, format: uuid }
      - name: vid
        in: path
        required: true
        description: Id del vehículo de ese lote.
        schema: { type: string, format: uuid }
      - name: empresa
        in: query
        required: true
        description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
        schema: { type: string, format: uuid }
    get:
      tags: [Backoffice]
      operationId: listarVersionesDictamenBackoffice
      summary: Auditoría de versiones del dictamen de un vehículo (backoffice FLIT)
      description: >
        HU #14563 B7 (D6, D7). Política diagnostico.backoffice de configuración, la de operación FLIT
        diagnostico.backoffice.operacion (hallazgo M3: trae el motivo y el autor; un usuario de otra compañía recibe 403 aunque
        tenga el permiso, el SuperAdmin pasa siempre, decisión D23) y
        diagnostico.auditoria.ver; empresa
        explícita en ?empresa= y la lectura queda en diagnostico.lecturas_backoffice. Todas las versiones en orden descendente:
        veredicto, alertamientos con la marca ajuste (AGREGADO/EDITADO), eliminados frente a la versión anterior (por código
        y fuente), origen (AUTOMATICO o AJUSTE_FLIT), usuario {id, nombre} (nombre resuelto por Identidad, no se guarda; null
        si no responde), motivo, en y superado_por_recalculo (derivado: la versión es un ajuste y la siguiente es automática).
        Es el único lugar donde sale el motivo del ajuste. La compañía nunca lo ve.
      responses:
        "200":
          description: Versiones del dictamen, de la más nueva a la más vieja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionesDictamen"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (usuario de otra compañía que no es SuperAdmin) o le falta diagnostico.auditoria.ver.
        "404":
          description: "`code` = NO_ENCONTRADO si el lote o el vehículo no son de la compañía indicada; SIN_DICTAMEN si no hay versiones."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/diagnosticos:
    get:
      tags: [Backoffice]
      operationId: listarDiagnosticosBackoffice
      summary: Lotes de una compañía para el backoffice FLIT
      description: >
        HU #13799 (F06-H2, F06-C6). Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT):
        un usuario con diagnostico.backoffice.ver en una compañía que no es FLIT (sin SuperAdmin), o el admin de la compañía,
        reciben 403 sin cuerpo.
        Empresa explícita en ?empresa= (nunca la del token); la lectura queda en diagnostico.lecturas_backoffice con el
        usuario, la empresa consultada, la ruta y la fecha, antes de leer. Solo lotes de esa compañía, del más reciente
        al más antiguo (creado_en, id), paginados. `celdas_en_error` = celdas del lote en estado ERROR.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          description: Filtra por estado del lote.
          schema:
            $ref: "#/components/schemas/EstadoDiagnostico"
        - name: con_errores
          in: query
          required: false
          description: true = solo lotes con al menos una celda en ERROR; false = solo lotes sin ERROR; sin él, todos.
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
      responses:
        "200":
          description: Página de lotes de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDiagnosticosBackoffice"
        "400":
          description: >
            `code` = EMPRESA_REQUERIDA (falta ?empresa= o no es válido; no se audita), ESTADO_INVALIDO (`campo` = estado)
            o PAGINACION_INVALIDA (`campo` = pagina o tamano). Un con_errores que no es booleano también responde 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice (sin cuerpo); token sin compañía (`code` = SIN_EMPRESA) o sin usuario
            (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/grilla:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerGrillaDiagnosticoBackoffice
      summary: Grilla de un lote de una compañía con el origen de cada celda (backoffice FLIT)
      description: >
        HU #13799 (F06-H2, F06-C5/C6). Misma política y empresa explícita que listarDiagnosticosBackoffice (la lectura
        queda auditada). Es la grilla de obtenerGrillaDiagnostico (misma semántica de `desde`/`version`, columnas, avance
        y estimado_consultas) más `empresa` y, en cada celda, `origen` y `usuario_manual_id`. Sin payload ni documentos
        en claro: cada fila lleva, como la de la compañía, `cambio_propietario` y ningún documento (HU #14582).
        No aplica la visibilidad_usuario de la compañía. El DTO de la compañía no cambia.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: >
            Versión del tablero que ya tiene el cliente (0 o mayor; por defecto 0 = todo). Trae las celdas o filas con
            versión mayor (HU #14563).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Grilla del lote con el origen de cada celda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillaBackoffice"
              example:
                empresa: 7b1f0c2e-6d1a-4c55-9a43-2f6f0d1b9e10
                id: 0199f3a1-1111-7000-8000-000000000001
                nombre: Lote octubre
                estado: COMPLETADO
                version: 14
                desde: 0
                columnas: { por_vehiculo: [RUNT, SIMIT_VEHICULO], por_propietario: [], por_locatario: [] }
                avance: { vehiculos: 1, terminados: 1 }
                vehiculos:
                  - id: 0199f3a1-2222-7000-8000-000000000002
                    orden: 1
                    identificador: TST611
                    tipo_identificador: PLACA_CARRO
                    placa: TST611
                    vin: null
                    terminado: true
                    celdas:
                      - { id: 0199f3a1-3333-7000-8000-000000000003, fuente: RUNT, estado: COMPLETADO, motivo_na: null, tipo_error: null, dato_obtenido_en: "2026-10-22T15:00:00+00:00", reutilizada: false, version: 1, origen: API, usuario_manual_id: null }
                      - { id: 0199f3a1-4444-7000-8000-000000000004, fuente: SIMIT_VEHICULO, estado: COMPLETADO, motivo_na: null, tipo_error: null, dato_obtenido_en: "2026-10-22T15:10:00+00:00", reutilizada: false, version: 14, origen: MANUAL, usuario_manual_id: 0199f3a1-5555-7000-8000-000000000005 }
        "400":
          description: "`code` = EMPRESA_REQUERIDA (no se audita) o DESDE_INVALIDO (`campo` = desde)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de configuración del backoffice (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/historial:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerHistorialDiagnosticoBackoffice
      summary: Historial real de un lote de una compañía (backoffice FLIT)
      description: >
        HU #13799 (F06-H2, F06-C5, decisión Q5). Política diagnostico.backoffice y además diagnostico.auditoria.ver.
        Empresa explícita en ?empresa= (la lectura queda auditada). A diferencia de obtenerHistorialDiagnostico (vista de
        la compañía, donde MANUAL llega como AUTO y sin usuario), aquí el disparador y el usuario son los reales.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado actual y transiciones reales del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialLoteBackoffice"
              example:
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                estado: COMPLETADO
                transiciones:
                  - { estado_anterior: INCOMPLETO, estado_nuevo: COMPLETADO, disparador: MANUAL, usuario_id: 0199f3a1-5555-7000-8000-000000000005, en: "2026-10-22T15:10:00+00:00" }
        "400":
          description: "`code` = EMPRESA_REQUERIDA (no se audita)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de configuración del backoffice o le falta diagnostico.auditoria.ver (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/resumen:
    get:
      tags: [Backoffice]
      operationId: obtenerResumenEmpresaBackoffice
      summary: Resumen de una compañía cliente para el backoffice FLIT
      description: >
        Ruta mínima de D0 (HU #13728): si la compañía indicada tiene configuración y cuántos diagnósticos y
        vehículos tiene. Política diagnostico.backoffice de configuración: pasa un SuperAdmin de cualquier compañía
        (ajustes 2026-11-11, punto 1) o un usuario con el permiso diagnostico.backoffice.ver y el claim
        tenant_type=FLIT del token; con el permiso en una compañía que no es FLIT (sin SuperAdmin),
        o en la compañía FLIT sin el permiso, responde 403, igual que cualquier otra ruta
        /backoffice/* (también una que no existe). La compañía nunca sale del token: se indica en ?empresa=
        (o en el segmento {empresa} de las rutas que lo lleven; si llegan los dos deben coincidir). Cada
        lectura queda en diagnostico.lecturas_backoffice con el usuario, la empresa consultada, la ruta y la
        fecha, antes de leer. Sin empresa válida responde 400 y no se audita.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía a consultar (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen de la compañía indicada (solo sus datos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenEmpresaBackoffice"
        "400":
          description: Falta ?empresa=, no es un uuid, es cero, llega repetido o no coincide con la ruta (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice (sin SuperAdmin: falta el permiso o tenant_type no es FLIT; sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/notificaciones:
    get:
      tags: [Notificaciones]
      operationId: bandejaNotificaciones
      summary: Bandeja de la campana del usuario
      description: >
        HU #14563 B8 (AC36, AC38). Permiso diagnostico.diagnosticos.ver. Lista las notificaciones del usuario del token (claim
        sub), de su compañía y de lotes que puede ver con la misma regla del listado de diagnósticos (con visibilidad PROPIOS,
        solo los lotes que creó, salvo el admin de la compañía). no_leidas usa la misma visibilidad. Orden: creada_en
        descendente, luego id. Paginación por cursor: `antes` es el `siguiente` de la página anterior. Lleva ETag débil
        W/"<no_leidas>-<total>-<max creada_en>-<max leida_en>-<antes>-<limite>-<hash de los nombres de los lotes>" (fechas
        en milisegundos Unix; el cursor y el límite distinguen páginas; el hash cambia si se renombra un lote de la página)
        y Cache-Control private, no-cache; con If-None-Match igual responde 304 sin cuerpo.
        Los literales de titulo y mensaje son provisionales: pendientes de confirmar por el PO. accion.href es la ruta
        del lote en el frontend (/diagnosticos/{diagnostico_id}).
      parameters:
        - name: limite
          in: query
          required: false
          description: Tamaño de página (1 a 50; por defecto 20; fuera de rango se acota).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: antes
          in: query
          required: false
          description: Cursor, el `siguiente` de la página anterior (id de la última notificación devuelta).
          schema:
            type: string
            format: uuid
        - name: If-None-Match
          in: header
          required: false
          description: ETag de una respuesta anterior.
          schema:
            type: string
      responses:
        "200":
          description: La página de la bandeja.
          headers:
            ETag:
              description: ETag débil de la bandeja visible para esta página.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BandejaNotificaciones"
        "304":
          description: Nada cambió desde el ETag de If-None-Match. Sin cuerpo.
          headers:
            ETag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/notificaciones/{nid}/leida:
    parameters:
      - name: nid
        in: path
        required: true
        description: Id de la notificación.
        schema:
          type: string
          format: uuid
    post:
      tags: [Notificaciones]
      operationId: marcarNotificacionLeida
      summary: Marca una notificación como leída
      description: >
        HU #14563 B8 (AC37, AC38). Permiso diagnostico.diagnosticos.ver. Idempotente: la primera vez fija leida_en con la mayor
        entre la hora del servidor y creada_en (nunca antes de creada_en); las siguientes no la cambian y también responden 204.
      responses:
        "204":
          description: Leída (o ya lo estaba).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: no existe, es de otro usuario, de otra compañía o de un lote que el usuario ya no ve
            (PROPIOS). Sin datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/notificaciones/leer-todas:
    post:
      tags: [Notificaciones]
      operationId: leerTodasNotificaciones
      summary: Marca como leídas todas las notificaciones visibles del usuario
      description: >
        HU #14563 B8 (AC37). Permiso diagnostico.diagnosticos.ver. Solo las que GET /notificaciones lista (misma visibilidad);
        leida_en con la misma regla que /leida. Después no_leidas es 0.
      responses:
        "204":
          description: Hecho (también si no había ninguna sin leer).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/saneamiento:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Saneamiento]
      operationId: obtenerSaneamientoVehiculo
      summary: Saneamiento no anulado del vehículo para la compañía (plan §6.3)
      description: diagnostico.diagnosticos.ver y la visibilidad del lote. Cache-Control no-store. Tipo separado del de FLIT (SP-15).
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoCliente" } } } }
        "404": { description: "NO_ENCONTRADO (lote o vehículo) o SIN_SANEAMIENTO.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
    put:
      tags: [Saneamiento]
      operationId: marcarSaneamientoVehiculo
      summary: Marca la bandera «Sanear» (sin cuerpo; idempotente en SOLICITADO)
      description: >
        diagnostico.saneamiento.solicitar (el SuperAdmin pasa por la regla general, decisión E3). Con ?empresa= responde 403
        SANEAMIENTO_DESDE_BACKOFFICE: desde el backoffice no se marca.
      responses:
        "201": { description: Creado., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoCliente" } } } }
        "200": { description: Ya estaba SOLICITADO., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoCliente" } } } }
        "403": { description: SANEAMIENTO_DESDE_BACKOFFICE o sin permiso., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: "VEHICULO_NO_TERMINADO o YA_SOLICITADO (hay uno en otro estado no anulado).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
    delete:
      tags: [Saneamiento]
      operationId: desmarcarSaneamientoVehiculo
      summary: Desmarca la bandera (solo en SOLICITADO)
      responses:
        "204": { description: Desmarcado (queda ANULADO). }
        "404": { description: NO_ENCONTRADO o SIN_SANEAMIENTO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: SANEAMIENTO_EN_GESTION., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/saneamiento/renglones/{rid}/evidencia:
    get:
      tags: [Saneamiento]
      operationId: descargarEvidenciaSaneamientoVehiculo
      summary: PDF de evidencia de un renglón para la compañía
      description: >
        diagnostico.reportes.descargar y la visibilidad del lote. Cadena lote, vehículo, saneamiento no anulado y renglón no
        quitado (404 sin distinguir el eslabón). Content-Disposition attachment con evidencia-{placa}-{fuente}.pdf (placa reducida
        a A-Z0-9), nunca el nombre original. Cabeceras X-Content-Type-Options nosniff, Content-Security-Policy sandbox y
        Cache-Control no-store.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: El PDF., content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: Sin evidencia o fuera de la cadena., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/saneamientos/solicitudes:
    post:
      tags: [Saneamiento]
      operationId: solicitarSaneamientosMasivo
      summary: Marca varios vehículos (1 a 500 ids distintos, de uno o varios lotes)
      description: diagnostico.saneamiento.solicitar. Síncrono y en una transacción. Los ids que el usuario no ve salen como NO_ENCONTRADO.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ListaVehiculosIds" } } }
      responses:
        "200": { description: Resultado., content: { application/json: { schema: { $ref: "#/components/schemas/SolicitudesSaneamiento" } } } }
        "400": { description: LISTA_INVALIDA (campo vehiculo_ids)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/deuda:
    get:
      tags: [Saneamiento]
      operationId: obtenerDeudaVehiculo
      summary: Panel de deuda por fuente (plan §6.5)
      description: diagnostico.diagnosticos.ver y la visibilidad del lote. Cache-Control no-store (trae el documento completo de la persona, sin nombre, SP-11).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: El panel., content: { application/json: { schema: { $ref: "#/components/schemas/PanelDeuda" } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: VEHICULO_NO_TERMINADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/deuda/pdf:
    get:
      tags: [Saneamiento]
      operationId: descargarPdfDeuda
      summary: PDF del panel de deuda (deuda-{placa}.pdf)
      description: diagnostico.reportes.descargar. Cabeceras de descarga segura (nosniff, CSP sandbox, no-store y attachment).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: El PDF., content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: VEHICULO_NO_TERMINADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/deuda/excel:
    get:
      tags: [Saneamiento]
      operationId: descargarExcelDeuda
      summary: Excel del panel de deuda (deuda-{placa}.xlsx; documento completo, como el panel)
      description: diagnostico.reportes.descargar. Hojas Resumen, SIMIT, Impuesto, SOAT y RTM y Saneamiento.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: vid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: El xlsx., content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: VEHICULO_NO_TERMINADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/vehiculos/deuda/excel:
    post:
      tags: [Saneamiento]
      operationId: descargarExcelDeudaVarios
      summary: Excel de deuda de varias placas (1 a 200 ids distintos; deuda-vehiculos.xlsx)
      description: >
        diagnostico.reportes.descargar. Los ids no visibles, inexistentes o sin terminar se omiten y solo suman a «Omitidos: n» en
        la hoja Resumen, sin ids (SP-9).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ListaVehiculosIds" } } }
      responses:
        "200": { description: El xlsx., content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
        "400": { description: LISTA_INVALIDA (campo vehiculo_ids)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }

  /api/v1/diagnostico/vehiculos:
    get:
      tags: [Saneamiento]
      operationId: listarVehiculosCompania
      summary: Grilla de placas de la compañía (plan §6.6)
      description: >
        diagnostico.diagnosticos.ver y la visibilidad de AccesoLote. Orden por creación del lote descendente y placa. Los lotes
        CREADO no salen. Filtros de lista cerrada: un valor fuera de lista o un parámetro único repetido es 400 FILTRO_INVALIDO;
        hasta antes de desde, RANGO_INVALIDO; tamano fuera de 1..100 o pagina × tamano mayor que 10 000, PAGINACION_INVALIDA.
      parameters:
        - { name: placa, in: query, schema: { type: string, maxLength: 20 }, description: Prefijo sobre el identificador normalizado. }
        - { name: estado, in: query, schema: { type: array, items: { type: string, enum: [EN_PROCESO, TERMINADO] } }, style: form, explode: true }
        - { name: veredicto, in: query, schema: { type: array, items: { type: string, enum: [VIABLE, BLOQUEADO, SIN_DICTAMEN] } }, style: form, explode: true }
        - { name: saneamiento, in: query, schema: { type: string, enum: [CON, SIN] } }
        - { name: saneamiento_estado, in: query, schema: { type: array, items: { type: string, enum: [SOLICITADO, EN_GESTION, SANEADO, NO_PROCEDE] } }, style: form, explode: true }
        - { name: modo, in: query, schema: { $ref: "#/components/schemas/ModoDiagnostico" } }
        - { name: con_tramite, in: query, schema: { type: boolean } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: La página., content: { application/json: { schema: { $ref: "#/components/schemas/ListadoVehiculos" } } } }
        "400": { description: FILTRO_INVALIDO, RANGO_INVALIDO o PAGINACION_INVALIDA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos:
    get:
      tags: [Backoffice]
      operationId: listarSaneamientosBackoffice
      summary: Bandeja de saneamientos entre compañías (grupo A, ADR-0087 D-5)
      description: >
        Política de operación FLIT y diagnostico.saneamiento.gestionar; sin empresa explícita (la empresa es un filtro). Orden
        solicitado_en ascendente. Antes de responder audita en lecturas_backoffice, en un solo guardado, cada empresa distinta de la
        página (y la del filtro empresa aunque la página salga vacía); si la auditoría falla, no hay filas (SP-4). Sin datos
        personales en la fila. Filtros inválidos: 400 FILTRO_INVALIDO, RANGO_INVALIDO o PAGINACION_INVALIDA (tamano 1 a 100 con
        25 por defecto, pagina × tamano hasta 10 000).
      parameters:
        - { name: estado, in: query, schema: { type: array, items: { $ref: "#/components/schemas/EstadoSaneamiento" } }, style: form, explode: true, description: Sin estado = todos. }
        - { name: empresa, in: query, schema: { type: string, format: uuid } }
        - { name: placa, in: query, schema: { type: string, maxLength: 20 }, description: Prefijo sobre el identificador normalizado. }
        - { name: desde, in: query, schema: { type: string, format: date }, description: Sobre solicitado_en, hora Colombia. }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: La página., content: { application/json: { schema: { $ref: "#/components/schemas/ListaBandejaSaneamientos" } } } }
        "400": { description: Filtro inválido., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "403": { description: Sin la operación FLIT o sin el permiso (también un usuario de otra compañía con los permisos). }

  /api/v1/diagnostico/backoffice/saneamientos/resumen:
    get:
      tags: [Backoffice]
      operationId: resumenSaneamientosBackoffice
      summary: Solicitudes sin tomar de todas las compañías, para la insignia del menú (no audita)
      responses:
        "200": { description: El conteo., content: { application/json: { schema: { $ref: "#/components/schemas/ResumenSaneamientos" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/excel:
    get:
      tags: [Backoffice]
      operationId: descargarExcelSaneamientosBackoffice
      summary: Excel de la bandeja con los mismos filtros (saneamientos.xlsx)
      description: Hasta 5 000 filas; más, 422 DEMASIADAS_FILAS. Audita las empresas exportadas. Cabeceras de descarga segura (SP-18). Texto literal, nunca fórmula (SP-21).
      parameters:
        - { name: estado, in: query, schema: { type: array, items: { $ref: "#/components/schemas/EstadoSaneamiento" } }, style: form, explode: true }
        - { name: empresa, in: query, schema: { type: string, format: uuid } }
        - { name: placa, in: query, schema: { type: string, maxLength: 20 } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: El xlsx., content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
        "422": { description: DEMASIADAS_FILAS., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/tomar:
    post:
      tags: [Backoffice]
      operationId: tomarSaneamientosBackoffice
      summary: Toma varios saneamientos (1 a 200 pares empresa/id distintos)
      description: >
        Única ruta donde la empresa viene en el cuerpo (excepción a ADR-0073, SP-1). Por empresa, en secuencia, en una sola
        transacción. Un par empresa/id que no coincide sale como NO_ENCONTRADO, igual que un id inexistente; uno que no está
        SOLICITADO, como TRANSICION_INVALIDA. Una empresa que no es uuid o es cero: 400 LISTA_INVALIDA. Un aviso
        SANEAMIENTO_TOMADO por par (solicitante, diagnóstico).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoTomarSaneamientos" } } }
      responses:
        "200": { description: Resultado., content: { application/json: { schema: { $ref: "#/components/schemas/ResultadoTomarSaneamientos" } } } }
        "400": { description: LISTA_INVALIDA (campo items)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: VERSION_DESACTUALIZADA si otro cambio se guardó al mismo tiempo., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    get:
      tags: [Backoffice]
      operationId: obtenerSaneamientoBackoffice
      summary: Detalle para FLIT con el historial completo (grupo B, auditado)
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "400": { description: EMPRESA_REQUERIDA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "404": { description: NO_ENCONTRADO (el sid no es de esa empresa o no es un uuid)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/deuda:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    get:
      tags: [Backoffice]
      operationId: obtenerDeudaSaneamientoBackoffice
      summary: Panel de deuda del vehículo del saneamiento (SP-7), auditado y sin caché
      responses:
        "200": { description: El panel (misma forma que el de la compañía)., content: { application/json: { schema: { $ref: "#/components/schemas/PanelDeuda" } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: VEHICULO_NO_TERMINADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/tomar:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    post:
      tags: [Backoffice]
      operationId: tomarSaneamientoBackoffice
      summary: SOLICITADO a EN_GESTION; genera los renglones con hallazgo la primera vez (sin cuerpo)
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: TRANSICION_INVALIDA o VERSION_DESACTUALIZADA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/observacion:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    put:
      tags: [Backoffice]
      operationId: editarObservacionSaneamientoBackoffice
      summary: Observación general de FLIT (0 a 1000 caracteres o null), visible para la compañía
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoObservacionSaneamiento" } } }
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "409": { description: NO_EDITABLE o VERSION_DESACTUALIZADA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }
        "422": { description: "VERSION_INVALIDA, VALOR_INVALIDO o TEXTO_INVALIDO (campo observacion).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/renglones:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    post:
      tags: [Backoffice]
      operationId: agregarRenglonSaneamientoBackoffice
      summary: Agrega un renglón OTRO (descripción de 3 a 200); devuelve el saneamiento completo (D-65)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoRenglonOtro" } } }
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "409": { description: NO_EDITABLE., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }
        "422": { description: VALOR_INVALIDO o TEXTO_INVALIDO (campo descripcion)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/renglones/{rid}:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/RenglonId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    put:
      tags: [Backoffice]
      operationId: editarRenglonSaneamientoBackoffice
      summary: Resultado y nota del renglón con su version; devuelve el renglón
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoRenglonSaneamiento" } } }
      responses:
        "200": { description: El renglón., content: { application/json: { schema: { $ref: "#/components/schemas/RenglonSaneamiento" } } } }
        "404": { description: NO_ENCONTRADO (el renglón no es de ese saneamiento o está quitado)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: NO_EDITABLE o VERSION_DESACTUALIZADA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }
        "422": { description: "VERSION_INVALIDA, VALOR_INVALIDO (resultado o nota) o TEXTO_INVALIDO (nota).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
    delete:
      tags: [Backoffice]
      operationId: quitarRenglonSaneamientoBackoffice
      summary: Quita el renglón (borrado lógico, queda en el historial); devuelve el saneamiento completo (D-65)
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: NO_EDITABLE., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/renglones/{rid}/evidencia:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/RenglonId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    put:
      tags: [Backoffice]
      operationId: subirEvidenciaSaneamientoBackoffice
      summary: Sube o reemplaza el PDF de evidencia (multipart, un solo archivo en el campo archivo)
      description: >
        Hasta Diagnostico:Saneamiento:EvidenciaMaximoBytes (10 485 760 por defecto); el tope actúa antes de leer el cuerpo.
        Content-Type application/pdf sin parámetros, extensión .pdf, %PDF- en el byte 0 y %%EOF en los últimos 1024 bytes; el
        servidor no abre el PDF. El almacén recibe un nombre generado por el servidor; el original solo se muestra, saneado. Tope de
        20 reemplazos por renglón. El archivo anterior queda huérfano (ADR-0087).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        "200": { description: El renglón., content: { application/json: { schema: { $ref: "#/components/schemas/RenglonSaneamiento" } } } }
        "400": { description: ARCHIVO_REQUERIDO (vacío, sin el campo archivo o con más de un archivo)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "404": { description: NO_ENCONTRADO., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: NO_EDITABLE o DEMASIADOS_REEMPLAZOS., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { description: ARCHIVO_MUY_GRANDE., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "422": { description: ARCHIVO_NO_ES_PDF., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
    delete:
      tags: [Backoffice]
      operationId: quitarEvidenciaSaneamientoBackoffice
      summary: Quita la evidencia; devuelve el saneamiento completo (D-65)
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "404": { description: NO_ENCONTRADO (también si no tenía evidencia)., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "409": { description: NO_EDITABLE., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
    get:
      tags: [Backoffice]
      operationId: descargarEvidenciaSaneamientoBackoffice
      summary: Descarga la evidencia (evidencia-{placa}-{fuente}.pdf, cabeceras de descarga segura)
      responses:
        "200": { description: El PDF., content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: Sin evidencia o fuera de la cadena., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/cerrar:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    post:
      tags: [Backoffice]
      operationId: cerrarSaneamientoBackoffice
      summary: EN_GESTION a SANEADO o NO_PROCEDE (con motivo)
      description: SANEADO exige al menos un renglón, ninguno PENDIENTE y uno SANEADO (422 CIERRE_INCOMPLETO). No toca el dictamen.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoCerrarSaneamiento" } } }
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "409": { description: TRANSICION_INVALIDA o VERSION_DESACTUALIZADA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }
        "422": { description: "CIERRE_INCOMPLETO, MOTIVO_REQUERIDO, TEXTO_INVALIDO, VERSION_INVALIDA o VALOR_INVALIDO (resultado).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/reabrir:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    post:
      tags: [Backoffice]
      operationId: reabrirSaneamientoBackoffice
      summary: SANEADO o NO_PROCEDE a EN_GESTION, con motivo (los renglones no se regeneran)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoMotivoSaneamiento" } } }
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "409": { description: TRANSICION_INVALIDA o VERSION_DESACTUALIZADA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }
        "422": { description: "MOTIVO_REQUERIDO, TEXTO_INVALIDO o VERSION_INVALIDA.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/backoffice/saneamientos/{sid}/anular:
    parameters:
      - { $ref: "#/components/parameters/SaneamientoId" }
      - { $ref: "#/components/parameters/EmpresaExplicitaSaneamiento" }
    post:
      tags: [Backoffice]
      operationId: anularSaneamientoBackoffice
      summary: SOLICITADO o EN_GESTION a ANULADO, con motivo
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuerpoMotivoSaneamiento" } } }
      responses:
        "200": { description: El saneamiento., content: { application/json: { schema: { $ref: "#/components/schemas/SaneamientoBackoffice" } } } }
        "409": { description: TRANSICION_INVALIDA o VERSION_DESACTUALIZADA., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "413": { $ref: "#/components/responses/CuerpoMuyGrande" }
        "422": { description: "MOTIVO_REQUERIDO, TEXTO_INVALIDO o VERSION_INVALIDA.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/estadisticas:
    get:
      tags: [Estadisticas]
      operationId: estadisticasCompania
      summary: Estadísticas de la compañía del token (E1)
      description: >
        diagnostico.diagnosticos.ver y la visibilidad del lote (AccesoLote, PROPIOS limita al creador salvo al admin; O9). Filtro de
        tenant normal: el SuperAdmin ve solo su compañía. Sin PII en ninguna profundidad (SP-16): solo conteos, sumas y porcentajes.
        No se audita. Cohorte = lotes con creado_en en el rango (saneamientos por solicitado_en y derivaciones por creada_en).
        Granularidad de la serie: DIA hasta 62 días, SEMANA (lunes) hasta 183 y MES después, con ceros. `empresa`, `documento` o
        `nombre` en la consulta: 400 FILTRO_INVALIDO. Cache-Control no-store.
      parameters:
        - { $ref: "#/components/parameters/DesdeReporte" }
        - { $ref: "#/components/parameters/HastaReporte" }
      responses:
        "200": { description: Las estadísticas., content: { application/json: { schema: { $ref: "#/components/schemas/EstadisticasDto" } } } }
        "400": { description: "FILTRO_INVALIDO (campo desde | hasta, o parámetro empresa/documento/nombre) o RANGO_INVALIDO (hasta < desde, hasta > hoy o más de 366 días).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "SIN_PERMISO, SIN_EMPRESA o PRODUCTO_NO_HABILITADO.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/reportes:
    get:
      tags: [Reportes]
      operationId: catalogoReportesCompania
      summary: Catálogo de reportes de la compañía (R0)
      description: >
        diagnostico.reportes.ver (permiso nuevo de la 1.5.0, O8; lo traen usuario_diagnostico y admin_diagnostico). Devuelve los 4
        tipos de la compañía (sin consumo). desde y hasta no van en filtros porque son implícitos y obligatorios. Los máximos salen
        de la configuración (Diagnostico:Reportes:MaximoFilasExcel, MaximoFilasPdf).
      responses:
        "200": { description: El catálogo., content: { application/json: { schema: { $ref: "#/components/schemas/CatalogoReportesDto" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sin diagnostico.reportes.ver., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/reportes/{tipo}:
    parameters:
      - { $ref: "#/components/parameters/TipoReporteCompania" }
    get:
      tags: [Reportes]
      operationId: reporteCompania
      summary: Reporte en pantalla de la compañía, paginado y con PII completa (R1)
      description: >
        diagnostico.reportes.ver y la visibilidad del lote (AccesoLote). Filtro de tenant normal: el SuperAdmin ve solo su compañía.
        Columnas de la lista blanca del tipo (SP-16, PaginaReporteDto.x-columnas); cada fila tiene exactamente las claves de columnas. Orden por la
        fecha de referencia descendente y luego id. Antes de responder deja una fila en accesos_reporte (formato PANTALLA, filas = las
        de la página; fail-closed): su id sale en acceso_id. Ningún filtro documento ni nombre (400 FILTRO_INVALIDO); ?empresa= da 400
        FILTRO_INVALIDO. Cache-Control no-store.
      parameters:
        - { $ref: "#/components/parameters/DesdeReporte" }
        - { $ref: "#/components/parameters/HastaReporte" }
        - { $ref: "#/components/parameters/ModalidadReporte" }
        - { $ref: "#/components/parameters/TipoAnalisisReporte" }
        - { $ref: "#/components/parameters/VeredictoReporte" }
        - { $ref: "#/components/parameters/FuenteReporte" }
        - { $ref: "#/components/parameters/EstadoReporte" }
        - { $ref: "#/components/parameters/PlacaReporte" }
        - { $ref: "#/components/parameters/PaginaReporte" }
        - { $ref: "#/components/parameters/TamanoReporte" }
      responses:
        "200": { description: La página (ambito COMPANIA)., content: { application/json: { schema: { $ref: "#/components/schemas/PaginaReporteDto" } } } }
        "400": { description: "FILTRO_INVALIDO, RANGO_INVALIDO o PAGINACION_INVALIDA (tamano 1 a 100, 25 por defecto; pagina × tamano hasta 10 000).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sin diagnostico.reportes.ver., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }
        "404": { description: "REPORTE_NO_ENCONTRADO: tipo desconocido, o consumo (solo backoffice).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } } }

  /api/v1/diagnostico/reportes/{tipo}/excel:
    parameters:
      - { $ref: "#/components/parameters/TipoReporteCompania" }
    get:
      tags: [Reportes]
      operationId: exportarReporteExcel
      summary: Exportación del reporte de la compañía a Excel (R2)
      description: >
        diagnostico.reportes.ver y diagnostico.reportes.descargar. Mismos filtros que la pantalla, sin pagina ni tamano (se ignoran).
        Hojas «Aviso» (Ley 1581 y «Registro {acceso_id}»), «Reporte» (aviso en la fila 1, encabezados en la 2) y «Filtros» (sin placa).
        Texto siempre como texto, nunca fórmula. Nombre diagnostico-reporte-{tipo}-{AAAAMMDD}-{AAAAMMDD}.xlsx. Antes de generar deja
