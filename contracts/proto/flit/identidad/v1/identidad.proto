syntax = "proto3";

package flit.identidad.v1;

option csharp_namespace = "Flit.Identidad.Grpc.V1";

// Lo que los servicios de la plataforma consultan a Identidad (core-identity), para no leer sus tablas
// (ADR-0064 decisión 1, contrato de plataforma v1.3 §6.1).
//
// Autenticación y alcance (ADR-0070, contrato §3):
//   - metadata `authorization`: token de servicio con `aud=plataforma` y scope `platform.identidad.read`.
//   - metadata `x-flit-tenant-id`: la empresa por la que se pregunta. Obligatoria en todos los métodos;
//     sin ella el servidor responde INVALID_ARGUMENT. Un token de usuario se rechaza con UNAUTHENTICATED.
// Ningún método devuelve datos de otra empresa que la de `x-flit-tenant-id`.
service IdentidadService {
  // Usuarios de la empresa: los que tienen al menos una asignación de rol vigente en ella. Si se indica
  // `producto`, solo los que tienen rol en ese producto, y en `roles` solo vienen los de ese producto.
  rpc ListarUsuariosEmpresa(ListarUsuariosEmpresaRequest) returns (ListarUsuariosEmpresaResponse);

  // Un usuario de la empresa. NOT_FOUND si no existe o no pertenece a la empresa de `x-flit-tenant-id`.
  rpc ObtenerUsuario(ObtenerUsuarioRequest) returns (ObtenerUsuarioResponse);

  // Productos encendidos para la empresa, con la regla fail-closed de la jerarquía (ADR-0057): un
  // producto cuenta como encendido solo si lo está para la empresa y para cada uno de sus ancestros.
  // `plataforma` siempre viene encendido.
  rpc ObtenerProductosHabilitados(ObtenerProductosHabilitadosRequest) returns (ObtenerProductosHabilitadosResponse);
}

message ListarUsuariosEmpresaRequest {
  // Código de producto (contrato §1). Vacío = todos los usuarios de la empresa.
  string producto = 1;
  // Incluir usuarios que no están activos (pendientes de activar o inactivos). Por defecto, solo activos.
  bool incluir_no_activos = 2;
  // Paginación (AIP-158). page_size 0 = 50; el servidor no devuelve más de 200 por página.
  int32 page_size = 3;
  string page_token = 4;
}

message ListarUsuariosEmpresaResponse {
  repeated Usuario usuarios = 1;
  // Vacío cuando no hay más páginas.
  string next_page_token = 2;
}

message ObtenerUsuarioRequest {
  // Id del usuario (UUID).
  string usuario_id = 1;
  // Si se indica, en `roles` solo vienen los de ese producto.
  string producto = 2;
}

message ObtenerUsuarioResponse {
  Usuario usuario = 1;
}

message ObtenerProductosHabilitadosRequest {}

message ObtenerProductosHabilitadosResponse {
  // Códigos de producto encendidos (contrato §1), ordenados.
  repeated string productos = 1;
}

message Usuario {
  // Id del usuario (UUID).
  string id = 1;
  string email = 2;
  string nombre = 3;
  EstadoUsuario estado = 4;
  // Roles vigentes del usuario en la empresa, filtrados por producto cuando el pedido lo indica.
  repeated Rol roles = 5;
}

message Rol {
  // Id del rol (UUID).
  string id = 1;
  // Código del rol, por ejemplo "Radicador" o "admin_tramites".
  string codigo = 2;
  // Producto al que pertenece el rol (contrato §1).
  string producto = 3;
}

enum EstadoUsuario {
  ESTADO_USUARIO_UNSPECIFIED = 0;
  // Invitado; todavía no activó su cuenta.
  ESTADO_USUARIO_PENDIENTE = 1;
  ESTADO_USUARIO_ACTIVO = 2;
  ESTADO_USUARIO_INACTIVO = 3;
}

// Empresas de la plataforma, para las pantallas del SuperAdmin de cada producto (GDC, hallazgos B2-1 y B2-4: el
// parametrizador de Comparendos elige la empresa de una lista y toma de aquí su nombre y su NIT, en vez de pedirlos a
// mano). Es un servicio GLOBAL: responde por todas las empresas y no usa `x-flit-tenant-id`. Por eso tiene su propio
// scope, `platform.identidad.empresas` (aud=plataforma), que solo se le da al servicio que lo necesita.
service EmpresasService {
  // Empresas activas que tienen `producto` encendido, con la misma regla fail-closed de la jerarquía que
  // ObtenerProductosHabilitados (ADR-0057). Ordenadas por nombre. `producto` es obligatorio y no puede ser `plataforma`.
  rpc ListarEmpresasConProducto(ListarEmpresasConProductoRequest) returns (ListarEmpresasConProductoResponse);

  // Datos para dar de alta la empresa en el proveedor del producto Impuestos (ADR-0093, plan §1.3 decisión P1). A
  // diferencia del resto de este servicio, va por UNA empresa: x-flit-tenant-id OBLIGATORIA (sin ella
  // INVALID_ARGUMENT). Solo svc-impuestos, con el scope platform.identidad.empresas.alta (otro sub -> PERMISSION_DENIED
  // reason CLIENTE_NO_PERMITIDO). Empresa inexistente -> NOT_FOUND. Responde lo mismo que el diálogo de activación
  // (GET /api/v1/platform/admin/tenants/{tenantId}/products/impuestos/alta-previa): un solo handler para los dos.
  rpc ObtenerDatosAltaProveedor(ObtenerDatosAltaProveedorRequest) returns (ObtenerDatosAltaProveedorResponse);
}

message ListarEmpresasConProductoRequest {
  // Código de producto (contrato §1).
  string producto = 1;
}

message ListarEmpresasConProductoResponse {
  repeated Empresa empresas = 1;
}

message Empresa {
  // Id de la empresa (UUID).
  string id = 1;
  // Razón social (identity.tenants.legal_name).
  string nombre = 2;
  // NIT tal como lo guarda la plataforma: solo el número, sin dígito de verificación. Vacío si no tiene. El dígito lo
  // calcula quien lo muestre (DIAN, módulo 11).
  string nit = 3;
  // HU #13882: «Enrutamiento de notificaciones» de la empresa en Trámites (admin.tenant_operational_policies):
  // "flit_smtp" (Colas FLIT) o "tenant_api" (API de correo de la empresa, hoy Renting). Sin política, "flit_smtp".
  // Comparendos lo usa como su canal de correo y su juego de plantillas.
  string canal_correo = 4;
}

// La empresa va en la metadata x-flit-tenant-id.
message ObtenerDatosAltaProveedorRequest {}

message ObtenerDatosAltaProveedorResponse {
  // Razón social (identity.tenants.legal_name), tal cual. Quien llama decide si supera el máximo del proveedor
  // (200 caracteres -> ERROR con motivo RAZON_SOCIAL_LARGA).
  string legal_name = 1;
  // NIT base sin dígito de verificación, normalizado con la regla D-TAXID (plan §1.3). Vacío si estado_nit no es VALIDO.
  string tax_id_base = 2;
  EstadoNit estado_nit = 3;
  // Correo del AdminCompany activo más antiguo de la empresa (D-EMAIL). Vacío = sin AdminCompany activo (SIN_ADMIN).
  string contact_email = 4;
  // false si la empresa está inactiva en la plataforma.
  bool empresa_activa = 5;
}

// Resultado de normalizar el NIT de la empresa (D-TAXID, DA-8). Todo lo que no es VALIDO es «Requiere revisión del NIT».
enum EstadoNit {
  ESTADO_NIT_UNSPECIFIED = 0;
  ESTADO_NIT_VALIDO = 1;
  // No se puede separar el dígito de verificación sin ambigüedad (10 dígitos o más sin guion, letras, o un guion sin
  // exactamente un dígito después).
  ESTADO_NIT_AMBIGUO = 2;
  // La empresa no tiene NIT.
  ESTADO_NIT_AUSENTE = 3;
  // La base es la misma de un ancestro de la jerarquía (hija sin NIT propio, DA-8).
  ESTADO_NIT_IGUAL_A_CABEZA = 4;
}
