# Configuracion de gitleaks para FLIT.
# Hereda el conjunto de reglas por defecto de gitleaks y agrega allowlists
# para archivos de ejemplo/plantilla y dependencias que no contienen secretos reales.
#
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "FLIT gitleaks config"

# Extiende el ruleset base oficial (detecta API keys, tokens, claves privadas, etc.)
[extend]
useDefault = true

# ADR-0091: privada RSA PKCS#8 en DER base64 de una linea (formato de DIAGNOSTICO_IA_CLAVE_PRIVADA), sin cabecera PEM:
# las reglas por defecto no la ven.
[[rules]]
id = "flit-rsa-pkcs8-der-base64"
description = "Clave privada RSA PKCS#8 en DER base64 (llave de IA de Diagnostico, ADR-0091)"
regex = '''MII[A-Za-z0-9+/]{2}QIBADANBgkqhkiG9w0BAQEFAASC'''
keywords = ["qibadanbgkqhkig9w0baqefaasc"]

[allowlist]
description = "Rutas y patrones que no deben marcarse como secretos"

paths = [
  # Plantillas de variables de entorno: contienen placeholders, no valores reales.
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
  # Dependencias y artefactos generados.
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)frontend/\.next/''',
  '''\.env\.verifik$''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  # ADR-0091: vector de prueba compartido (par RSA SOLO PRUEBA y centinela). Solo este archivo, no la carpeta.
  '''contracts/proto/flit/platform/v1/testdata/configuracion_ia_vector\.json$''',
]

# IDs de desarrollo conocidos (no son secretos). El VITE_DEV_USER_ID es un UUID
# de usuario semilla usado solo en builds de desarrollo.
regexes = [
  '''01900000-100b-7001-8001-000000000001''',
  # Nombres (ids) de las llaves OIDC de la FLIT Suite en appsettings (Suite:Oidc:SigningKeyId/EncryptionKeyId).
  # Son etiquetas; las llaves reales se generan y se guardan cifradas en security.jwt_signing_keys.
  '''flit-oidc-(signing|encryption)-v[0-9]+''',
]
