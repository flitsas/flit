name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'  # Lunes 6am

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend audit
        run: pnpm --filter @flit/backend audit --prod --audit-level high

      - name: Frontend audit
        run: pnpm --filter @flit/frontend audit --prod --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          for i in 1 2 3; do
            curl -fL --retry 3 --retry-all-errors --retry-delay 2 -o gitleaks.tgz "$url" \
              && tar -xzf gitleaks.tgz gitleaks \
              && break
            echo "intento $i falló; reintentando..."
            sleep $((i * 2))
          done
          test -f gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --exit-code 1
