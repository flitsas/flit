openapi: 3.0.3
info:
  title: FLIT Core API
  version: "1.0.0"
  description: >
    Contrato público de FLIT Core API (services/core-api). Cubre el carril de
    Seguridad/Autenticación (HU #10168 — login email/contraseña y emisión JWT 12h)
    y el módulo Administrador de Compañías (HU #10189 — index paginado y
    seguridad SuperAdmin).

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4002
    description: Local (Gateway)

tags:
  - name: Auth
    description: Autenticación y sesión (login, perfil del usuario).
  - name: Admin · Compañías
    description: Gestión multi-tenant de compañías B2B (rol SuperAdmin).
  - name: Admin · Tenants OT
    description: >
      Alta y listado de tenants Organismo de Tránsito (rol SuperAdmin, refactor
      adminOT). El self-service de usuarios OT vive bajo el tag Admin · OT.
  - name: Admin · OT
    description: >
      Perfil OT, módulo operativo y self-service de usuarios del tenant OT (rol
      SuperAdmin u ot_admin).
  - name: Admin · Documentos
    description: Catálogo maestro de tipos de documento por trámite (rol SuperAdmin).
  - name: Admin · Documentos por Trámite
    description: Asociación de tipos de documento a tipos de trámite (rol SuperAdmin).
  - name: Admin · Órdenes documentales
    description: >
      Overrides de orden documental por OT/Cliente y matriz documental resuelta
      con precedencia Cliente > OT > Default (rol SuperAdmin).
  - name: Trámites · Documentos
    description: >
      Alta de trámite con snapshot documental inmutable y lectura de los documentos
      requeridos congelados al crear el trámite (cualquier JWT válido).
  - name: Trámites · Traspaso
    description: Radicación de traspasos vehiculares.
  - name: Admin · Improntas
    description: >
      Generación del Certificado de Improntas Digitales vehicular (Res. 17145/2023
      Mintransporte) vía Kyverum RUNT, con persistencia de trazabilidad (rol SuperAdmin).

paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      security: []          # endpoint público: no requiere JWT (satisface la regla security-defined)
      summary: Login con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/me:
    get:
      operationId: authGetCurrentUser
      tags: [Auth]
      summary: Perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: No autenticado o sesión expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [Auth]
      summary: Solicitar recuperación de contraseña (HU #10169, RF19)
      security: []
      description: >
        Genera un token de un solo uso y envía un correo con el enlace de
        restablecimiento. Responde siempre 202 con un mensaje genérico, sin
        revelar si el email está registrado (anti-enumeración, AC2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Solicitud aceptada (respuesta genérica).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [Auth]
      summary: Restablecer contraseña con token de recuperación (HU #10169)
      security: []
      description: >
        Valida el token vigente y fija la nueva contraseña. El token se invalida
        tras su uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido/expirado o contraseña débil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/admin/companies/index:
    get:
      tags: [Admin · Compañías]
      operationId: adminCompaniesIndex
      summary: Listado paginado de compañías (RF02)
      description: >
        Retorna el listado paginado de compañías registradas, ordenado por
        fecha de creación descendente. Filtros opcionales e independientes.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: nit
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial sobre el NIT (tax_id).
        - name: razonSocial
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre la razón social.
        - name: estadoActivo
          in: query
          required: false
          schema: { type: boolean }
          description: Filtra por estado activo/inactivo.
        - name: fechaDesde
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite inferior inclusivo de fecha de creación (YYYY-MM-DD).
        - name: fechaHasta
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite superior inclusivo de fecha de creación (YYYY-MM-DD).
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies:
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyCreate
      summary: Alta de compañía (#10118)
      description: >
        Crea una compañía (tenant) en identity.tenants. El código debe ser único.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Compañía creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Datos inválidos (campos requeridos, longitudes, tipo o código duplicado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanyUpdate
      summary: Edita una compañía (#10118)
      description: >
        Actualiza razón social, NIT, tipo y estado de la compañía. El código es
        inmutable (no se acepta en el payload). Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Compañía actualizada; devuelve la compañía con sus datos nuevos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La compañía no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Edición concurrente: el `rowVersion` enviado no coincide con el actual
            (otra persona modificó la compañía). No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Datos inválidos (campos requeridos, longitudes o tipo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/status:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanySetStatus
      summary: Activa o desactiva una compañía (#10118)
      description: >
        Cambia el estado activo/inactivo de la compañía (identity.tenants.is_active).
        Idempotente: aplicar el mismo estado retorna 200 sin cambios. Requiere JWT con
        rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCompanyStatusRequest"
      responses:
        "200":
          description: Estado actualizado; devuelve la compañía con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La compañía no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/settings:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetSettings
      summary: Configuración operativa actual del tenant (RF03, AC3)
      description: >
        Retorna la configuración operativa vigente del tenant. Requiere JWT con
        rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración operativa actual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe configuración para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanyUpdateSettings
      summary: Guardado atómico de configuración operativa + audit log (RF03/RF07–RF10, AC1/AC2)
      description: >
        Persiste de forma atómica (todo o nada) la configuración operativa del
        tenant y genera una entrada de auditoría por cada campo modificado. Si la
        validación falla (p. ej. notificationTarget fuera del enum) retorna 422 sin
        persistir ni auditar. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSettingsUpdate"
      responses:
        "200":
          description: Configuración persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido. No se persiste ni se audita ningún cambio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/whitelist:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetWhitelist
      summary: Lista blanca de correos exentos de la regla de propiedad vehicular (RF05, AC6)
      description: >
        Retorna los correos activos exentos de la regla only_own_vehicles del tenant.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de correos exentos (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhitelistEntry"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyAddWhitelist
      summary: Alta masiva de correos en la lista blanca + audit log (RF05, AC4/AC5)
      description: >
        Da de alta de forma atómica uno o más correos en la lista blanca del tenant y
        genera una entrada de auditoría por cada correo insertado. Los duplicados ya
        existentes se omiten sin error (idempotente, 201 parcial). Si algún correo es
        inválido retorna 422 con la lista de inválidos sin persistir ninguno (atómico).
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhitelistAddRequest"
      responses:
        "201":
          description: Correos procesados. Devuelve insertados y omitidos (duplicados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistAddResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Uno o más correos inválidos. No se persiste ninguno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistValidationErrorResponse"

  /api/v1/internal/transfers/start:
    post:
      tags: [Trámites · Traspaso]
      operationId: internalTransfersStart
      summary: Stub de radicación de traspaso con interceptor de propiedad vehicular (RF04, AC1/AC2)
      description: >
        Endpoint mínimo que cablea el interceptor de propiedad vehicular: valida la
        regla only_own_vehicles efectiva del trámite (snapshot si está in-flight, AC3)
        contemplando la exención por lista blanca (AC2). Si el vehículo no es del
        tenant y el usuario no está exento, retorna 422 con el mensaje de bloqueo
        (AC1). Exige usuario autenticado (rol operador), no SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferStartRequest"
      responses:
        "200":
          description: El traspaso puede iniciarse.
        "401":
          description: No autenticado (sin token JWT).
        "422":
          description: El interceptor bloquea el traspaso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesSearch
      summary: Catálogo de organismos de tránsito con búsqueda (RF13, AC1)
      description: >
        Retorna el catálogo de organismos de tránsito desde `catalogs.transit_offices`.
        El parámetro opcional `search` filtra por nombre o código (case-insensitive e
        insensible a tildes). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Término opcional de búsqueda (nombre o código).
      responses:
        "200":
          description: Catálogo de organismos (filtrado si se informó `search`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitOffice"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/profile:
    get:
      tags: [Admin · OT]
      operationId: adminOtGetProfile
      summary: Perfil OT del tenant autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil OT (operationMode, quipuxReadOnly, transitOfficeId, featureFlags).
        "401":
          description: No autenticado.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
    patch:
      tags: [Admin · OT]
      operationId: adminOtPatchProfile
      summary: Actualizar modo Dashboard/QX
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil actualizado.

  /api/v1/admin/transit-office-tenants/index:
    get:
      tags: [Admin · Tenants OT]
      operationId: adminTransitOfficeTenantsIndex
      summary: Listado paginado de tenants OT (refactor adminOT)
      description: >
        Retorna el listado paginado de tenants Organismo de Tránsito (join
        identity.tenants + admin.transit_office_profiles), ordenado por fecha de
        creación descendente. Requiere JWT con rol SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: legalName
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre la razón social.
        - name: estadoActivo
          in: query
          required: false
          schema: { type: boolean }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitOfficeTenantPagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-office-tenants:
    post:
      tags: [Admin · Tenants OT]
      operationId: adminTransitOfficeTenantCreate
      summary: Alta de tenant OT (refactor adminOT)
      description: >
        Da de alta un tenant Organismo de Tránsito: tenant (tenant_type=RENTING,
        decisión intencional — ver RestrictTenantTypeCatalog), rol de sistema
        ot_admin SIN permisos (el SuperAdmin los cura después vía RBAC Admin,
        `PUT /api/v1/superadmin/roles/{id}/permissions`) y perfil OT vinculado a la
        oficina del catálogo. La oficina no debe tener ya un tenant OT asociado.
        Requiere JWT con rol SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransitOfficeRequest"
      responses:
        "201":
          description: Tenant OT creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitOfficeTenantItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Datos inválidos (campos requeridos, longitudes, código duplicado,
            oficina inexistente/inactiva u oficina ya asignada a otro tenant OT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/transit-office-tenants/{tenantId}/status:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant OT.
    put:
      tags: [Admin · Tenants OT]
      operationId: adminTransitOfficeTenantSetStatus
      summary: Activa o desactiva un tenant OT (refactor adminOT)
      description: >
        Cambia el estado activo/inactivo del tenant OT (identity.tenants.is_active).
        Reutiliza el mismo caso de uso genérico del alta de compañías. Idempotente.
        Requiere JWT con rol SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCompanyStatusRequest"
      responses:
        "200":
          description: Estado actualizado; devuelve el tenant con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tenant no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users/invite:
    post:
      tags: [Admin · OT]
      operationId: adminOtInviteUser
      summary: Invita un usuario al tenant OT (self-service, refactor adminOT)
      description: >
        Crea una invitación por email con el rol ot_admin del tenant resuelto.
        ot_admin invita colaboradores de su propio tenant (JWT); SuperAdmin debe
        indicar `?transitOfficeId=` (oficina del catálogo) para invitar al primer
        adminOT de un tenant recién creado. El rol se resuelve automáticamente:
        un tenant OT solo tiene el rol de sistema ot_admin (sin roles
        personalizados). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Oficina del catálogo cuyo tenant OT es el destino. Obligatorio para
            SuperAdmin; ignorado para ot_admin (siempre usa su propio tenant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteOtUserRequest"
      responses:
        "201":
          description: Invitación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteOtUserResponse"
        "400":
          description: SuperAdmin no indicó transitOfficeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un tenant OT vinculado al transitOfficeId indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitación pendiente duplicada o el correo ya tiene cuenta activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users:
    get:
      tags: [Admin · OT]
      operationId: adminOtListUsers
      summary: Lista los usuarios del tenant OT (self-service, refactor adminOT)
      description: >
        Usuarios activos, sin rol e invitaciones pendientes del tenant resuelto
        (propio para ot_admin, o el indicado por `?transitOfficeId=` para
        SuperAdmin). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usuarios del tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtUserListResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe un tenant OT vinculado al transitOfficeId indicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/users/{userId}/suspend:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
    post:
      tags: [Admin · OT]
      operationId: adminOtSuspendUser
      summary: Suspende temporalmente a un usuario del tenant OT (self-service, refactor adminOT)
      description: >
        Suspende a un usuario del tenant OT resuelto (propio para ot_admin, o el
        indicado por `?transitOfficeId=` para SuperAdmin). El usuario debe
        pertenecer al tenant resuelto (no se puede suspender usuarios de otro OT).
        Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendOtUserRequest"
      responses:
        "201":
          description: Suspensión creada.
        "400":
          description: Auto-suspensión no permitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no existe en el tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · OT]
      operationId: adminOtUnsuspendUser
      summary: Levanta la suspensión activa de un usuario del tenant OT (self-service, refactor adminOT)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Suspensión levantada.
        "401":
          description: No autenticado o falta el claim tenant_id.
        "403":
          description: Sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El usuario no tiene una suspensión activa en el tenant OT resuelto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/integrations/ot/webhooks/{subscriptionId}/callback:
    post:
      tags: [OT Integrations]
      operationId: otWebhookInboundCallback
      summary: Callback inbound Quipux → FLIT
      security: []          # endpoint público: autenticación vía HMAC en cabecera
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Callback procesado.
        "401":
          description: Firma HMAC inválida.
        "404":
          description: Suscripción no encontrada.

  /api/v1/admin/companies/{tenantId}/transit-grants:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetTransitGrants
      summary: Organismos de tránsito habilitados del tenant (RF13, AC5)
      description: >
        Retorna los ids de organismos de tránsito habilitados para el tenant.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de organismos habilitados (puede ser vacía).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitGrantListResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyAddTransitGrant
      summary: Habilita un organismo de tránsito para el tenant + audit log (RF13, AC2)
      description: >
        Habilita un organismo de tránsito (que debe existir en el catálogo estático)
        para el tenant y genera una entrada de auditoría. Idempotente: si el grant ya
        existe retorna 201 sin duplicar fila ni auditoría. Si el organismo no existe en
        el catálogo retorna 422 sin persistir. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitGrantRequest"
      responses:
        "201":
          description: Grant habilitado (alta nueva o idempotente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitGrantCreatedResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: El organismo no existe en el catálogo. No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitGrantValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/transit-grants/{transitOfficeId}:
    delete:
      tags: [Admin · Compañías]
      operationId: adminCompanyRemoveTransitGrant
      summary: Deshabilita un organismo de tránsito del tenant + audit log (RF13, AC3)
      description: >
        Elimina el grant del organismo para el tenant y genera una entrada de auditoría.
        Retorna 404 si el grant no existía. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del tenant (compañía).
        - name: transitOfficeId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del organismo de tránsito.
      responses:
        "204":
          description: Grant eliminado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe el grant para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/audit-log:
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetAuditLog
      summary: Historial de auditoría de gobernanza paginado (AC4)
      description: >
        Retorna el historial de cambios de configuración del tenant ordenado por
        `changedAt` descendente, paginado. Cada registro incluye el campo modificado,
        el valor anterior/nuevo, el operador y el timestamp. Requiere JWT con rol
        SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del tenant (compañía).
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página del historial de auditoría.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPageResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-types:
    post:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeCreate
      summary: Crea un tipo de documento (RF01)
      description: >
        Da de alta un tipo de documento en el catálogo maestro
        (tramites.document_types) con estado activo. El código es único global.
        El campo `obligatorio` se acepta pero no se persiste (la obligatoriedad
        vive por trámite en procedure_document_requirements). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentTypeRequest"
      responses:
        "201":
          description: Tipo de documento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido o código duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeList
      summary: Listado paginado de tipos de documento (RF02)
      description: >
        Retorna el catálogo paginado ordenado por nombre ascendente. Por defecto
        solo incluye activos. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Si es true incluye también los inactivos (soft-deleted).
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypePagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tipo de documento.
    put:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeUpdate
      summary: Actualiza un tipo de documento (RF03)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentTypeRequest"
      responses:
        "200":
          description: Tipo de documento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido o código duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeDelete
      summary: Baja lógica de un tipo de documento (RF04)
      description: >
        Soft-delete: marca is_active=false sin borrado físico. Si el tipo de
        documento está referenciado en procedure_document_requirements retorna
        409 y no se desactiva. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tipo de documento desactivado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Tiene asociaciones activas y no puede desactivarse. El cuerpo incluye los
            tipos de trámite que usan el documento (mensaje accionable en la consola).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTypeAssociationsError"

  /api/v1/admin/document-types/{id}/reactivate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tipo de documento.
    post:
      tags: [Admin · Documentos]
      operationId: adminDocumentTypeReactivate
      summary: Reactiva un tipo de documento desactivado
      description: >
        Contraparte del soft-delete: marca is_active=true para que el documento
        vuelva al catálogo y pueda asociarse a trámites. Idempotente (reactivar uno
        ya activo retorna 204). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Tipo de documento reactivado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/procedure-document-requirements:
    post:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementCreate
      summary: Asocia un documento a un tipo de trámite (RF05)
      description: >
        Crea la asociación (trámite, documento) con su orden default y
        obligatoriedad. El tipo de trámite debe existir (404 si no), el tipo de
        documento debe existir (404) y estar activo (422 si está inactivo), y el
        par debe ser único (422 si duplicado). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcedureDocumentRequirementRequest"
      responses:
        "201":
          description: Asociación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de trámite o el tipo de documento no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido, documento inactivo o par duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementList
      summary: Lista los documentos de un tipo de trámite (RF06)
      description: >
        Retorna las asociaciones del trámite ordenadas por orden default
        ascendente, enriquecidas con los datos del documento. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite cuyo catálogo de documentos se consulta.
      responses:
        "200":
          description: Listado de asociaciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementList"
        "400":
          description: Falta el parámetro procedureTypeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/procedure-document-requirements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador de la asociación.
    put:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementUpdate
      summary: Actualiza la configuración de una asociación (RF07)
      description: >
        Modifica únicamente el orden default y la obligatoriedad. El par
        (trámite, documento) es inmutable. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProcedureDocumentRequirementRequest"
      responses:
        "200":
          description: Asociación actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La asociación no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · Documentos por Trámite]
      operationId: adminProcedureDocumentRequirementDelete
      summary: Elimina una asociación (RF08)
      description: >
        Borrado físico de la asociación. Si está en uso en trámites activos
        retorna 409 y no se elimina. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Asociación eliminada.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La asociación no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La asociación está en uso y no puede eliminarse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-order-overrides:
    post:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideCreate
      summary: Crea un override de orden por OT o Cliente (RF09–RF16)
      description: >
        Registra un orden personalizado de un documento para un trámite a nivel de
        Organismo de Tránsito (scope=OT, usa transitOfficeId) o de Cliente
        (scope=CLIENTE, usa clienteId). El trámite debe existir (404), el documento
        debe existir (404) y estar asociado al trámite (422), la referencia del scope
        debe existir (404) y la tupla debe ser única (422). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [OT, CLIENTE] }
          description: Ámbito del override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentOrderOverrideRequest"
      responses:
        "201":
          description: Override creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOrderOverrideResponse"
        "400":
          description: Falta o es inválido el parámetro scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite, el documento o la referencia del scope no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Orden inválido, documento no asociado, referencia faltante o duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideList
      summary: Lista los overrides de una combinación trámite/scope (RF09–RF16)
      description: >
        Retorna los overrides de la combinación (trámite, scope, referencia) ordenados
        por orden ascendente. Requiere transitOfficeId si scope=OT o clienteId si
        scope=CLIENTE. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite.
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [OT, CLIENTE] }
          description: Ámbito del override.
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Organismo de tránsito (obligatorio si scope=OT).
        - name: clienteId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Cliente/tenant (obligatorio si scope=CLIENTE).
      responses:
        "200":
          description: Listado de overrides.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOrderOverrideList"
        "400":
          description: Faltan parámetros obligatorios (procedureTypeId, scope o la referencia).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-order-overrides/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del override.
    put:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideUpdate
      summary: Reordena un override (arrastre en la lista)
      description: >
        Actualiza únicamente el orden (sort_order) de un override existente. Lo usa el
        reordenamiento por arrastre de la lista de overrides; la tupla (trámite, documento,
        scope, referencia) no cambia, por lo que no hay conflicto de unicidad. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentOrderOverrideRequest"
      responses:
        "200":
          description: Override actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOrderOverrideResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El override no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Orden inválido (negativo o fuera de rango).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentOrderOverrideDelete
      summary: Elimina un override de orden (RF11-12, RF15-16)
      description: >
        Borrado físico del override. Tras eliminarlo, la matriz resuelta vuelve al
        nivel inmediatamente inferior (OT o Default). Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Override eliminado.
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El override no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/document-requirement-overrides:
    get:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentRequirementOverrideList
      summary: Lista la obligatoriedad por OT de un trámite (HU #10198)
      description: >
        Retorna los overrides de obligatoriedad (REQUIRED / OPTIONAL / NOT_APPLICABLE) de un
        trámite para un Organismo de Tránsito. Solo devuelve los documentos con override; los
        no listados heredan el default del trámite. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite.
        - name: transitOfficeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Organismo de tránsito.
      responses:
        "200":
          description: Listado de overrides de obligatoriedad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequirementOverrideList"
        "400":
          description: Faltan parámetros obligatorios (procedureTypeId o transitOfficeId).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Admin · Órdenes documentales]
      operationId: adminDocumentRequirementOverrideSet
      summary: Fija (o limpia) la obligatoriedad por OT de un documento (HU #10198)
      description: >
        Upsert por tupla natural (trámite, documento, OT). El documento debe existir (404) y
        estar asociado al trámite (422); el OT debe existir (404). estado=REQUIRED|OPTIONAL|
        NOT_APPLICABLE crea/actualiza el override (200); estado=DEFAULT limpia el override y
        el documento vuelve a heredar el default del trámite (204). Granular solo para OT.
        Requiere SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDocumentRequirementOverrideRequest"
      responses:
        "200":
          description: Override creado o actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRequirementOverrideResponse"
        "204":
          description: Override limpiado (estado=DEFAULT).
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El trámite, el documento o el OT no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Estado inválido o documento no asociado al trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/resolved-document-matrix:
    get:
      tags: [Admin · Órdenes documentales]
      operationId: adminResolvedDocumentMatrixGet
      summary: Resuelve la matriz documental de un trámite (RF18)
      description: >
        Devuelve el orden final de cada documento del trámite aplicando la precedencia
        Cliente > OT > Default. transitOfficeId y clienteId son opcionales: si no vienen,
        ese nivel se omite. Un trámite existente sin documentos retorna 200 con data
        vacío. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: procedureTypeId
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: Tipo de trámite a resolver.
        - name: transitOfficeId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Organismo de tránsito (nivel OT) — opcional.
        - name: clienteId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Cliente/tenant (nivel CLIENTE) — opcional.
      responses:
        "200":
          description: Matriz documental resuelta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedDocumentMatrix"
        "400":
          description: Falta el parámetro procedureTypeId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El tipo de trámite no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites:
    post:
      tags: [Trámites · Documentos]
      operationId: tramitesCreate
      summary: Crea un trámite y congela su snapshot documental (RF19)
      description: >
        Crea un trámite en estado draft y captura, en la misma transacción, un snapshot
        inmutable de la matriz documental resuelta vigente (precedencia Cliente > OT >
        Default). Si la generación del snapshot falla, toda la operación se revierte y no
        queda trámite creado (500). Requiere JWT autenticado (no SuperAdmin).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProcedureInstanceRequest"
      responses:
        "201":
          description: Trámite creado con su snapshot documental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureInstanceResponse"
        "401":
          description: No autenticado (sin token JWT).
        "404":
          description: El tipo de trámite o el cliente (tenant) no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Datos inválidos o número de referencia duplicado para el cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Falló la persistencia del trámite o del snapshot; operación revertida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/{tramiteId}/document-requirements:
    get:
      tags: [Trámites · Documentos]
      operationId: tramitesGetDocumentRequirements
      summary: Documentos requeridos del snapshot de un trámite (RF19)
      description: >
        Devuelve los documentos congelados en el snapshot del trámite, ordenados por el
        orden capturado al crearlo (ordenResuelto asc). Los cambios posteriores en el
        catálogo o los overrides no afectan la respuesta (inmutabilidad). Requiere JWT
        autenticado (no SuperAdmin).
      security:
        - bearerAuth: []
      parameters:
        - name: tramiteId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador del trámite (procedure_instance_id).
      responses:
        "200":
          description: Documentos del snapshot del trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDocumentRequirementSnapshotList"
        "401":
          description: No autenticado (sin token JWT).
        "404":
          description: El trámite no existe o no tiene snapshot documental.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/biometric-validations:
    get:
      operationId: listTenantBiometricValidations
      tags: [Tramites, Identidad]
      summary: Listar las validaciones de identidad del tenant (HU #10234, filtros HU #10347)
      description: >
        Vista transversal del submódulo "Validaciones de Identidad": lista TODAS las validaciones
        biométricas/de identidad del tenant (a través de todas sus instancias no eliminadas), las más
        recientes primero, junto con KPIs agregados por estado. No es por-instancia. La tabla se acota a
        un máximo de filas (vista de monitoreo); los KPIs se calculan aparte y son exactos. Con filtros
        activos, filas y KPIs reflejan el mismo subconjunto filtrado (antes del cap de 500 filas). El
        motivo de rechazo viaja SANITIZADO (sin PII), igual que en la vista por-instancia. Filtrar por
        estado=expirado incluye validaciones con estado persistido expirado y las que tienen el flag
        expired calculado (no aprobada y ExpiresAt &lt; now).
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: referenceNumber
          in: query
          required: false
          description: Coincidencia parcial (case-insensitive) sobre el número de referencia del trámite.
          schema: { type: string, maxLength: 100 }
        - name: modalidad
          in: query
          required: false
          description: Coincidencia parcial (case-insensitive) sobre la modalidad del trámite.
          schema: { type: string }
        - name: name
          in: query
          required: false
          description: Coincidencia parcial (case-insensitive) sobre el nombre de la persona validada.
          schema: { type: string, maxLength: 100 }
        - name: partyRole
          in: query
          required: false
          description: Filtro exacto por parte (comprador | vendedor). Los VALORES siguen en español.
          schema: { type: string, enum: [comprador, vendedor] }
        - name: documentType
          in: query
          required: false
          description: Filtro exacto por tipo de documento (p.ej. CC, CE).
          schema: { type: string, maxLength: 100 }
        - name: documentNumber
          in: query
          required: false
          description: Coincidencia parcial por número de documento (sin exponer PII en errores).
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          required: false
          description: >
            Filtro por estado. Valores (en español): enviado, en_proceso, aprobado, rechazado, expirado. El
            valor expirado incluye estado persistido y validaciones vencidas no aprobadas (flag expired).
          schema:
            type: string
            enum: [enviado, en_proceso, aprobado, rechazado, expirado, pendiente_envio, error_envio]
        - name: provider
          in: query
          required: false
          description: Filtro exacto por proveedor (mock | kyverum).
          schema: { type: string, enum: [mock, kyverum] }
        - name: scoreMin
          in: query
          required: false
          description: Score mínimo inclusive (solo filas con score informado).
          schema: { type: integer, minimum: 0 }
        - name: scoreMax
          in: query
          required: false
          description: Score máximo inclusive (solo filas con score informado).
          schema: { type: integer, minimum: 0 }
        - name: createdFrom
          in: query
          required: false
          description: Fecha/hora mínima inclusive de creación (ISO-8601).
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          required: false
          description: Fecha/hora máxima inclusive de creación (ISO-8601).
          schema: { type: string, format: date-time }
        - name: motivoRechazo
          in: query
          required: false
          description: >
            Coincidencia parcial case-insensitive en el motivo de rechazo sanitizado (solo filas
            rechazadas; busca en Detalle y ProviderPayload).
          schema: { type: string, maxLength: 100 }
        - name: vigenciaEstado
          in: query
          required: false
          description: >
            Filtro por estado de vigencia de la identidad APROBADA: vigente | por_vencer (≤ 7 días) | vencida.
          schema: { type: string, enum: [vigente, por_vencer, vencida] }
        - name: expiraDesde
          in: query
          required: false
          description: Fin de vigencia (validUntil) mínimo inclusive, ISO-8601 (HU #10350).
          schema: { type: string, format: date-time }
        - name: expiraHasta
          in: query
          required: false
          description: Fin de vigencia (validUntil) máximo inclusive, ISO-8601 (HU #10350).
          schema: { type: string, format: date-time }
        - name: venceEnDias
          in: query
          required: false
          description: >
            "Vence en ≤ N días": identidades vigentes cuya vigencia se agota dentro de N días calendario.
          schema: { type: integer, minimum: 0 }
        - name: page
          in: query
          required: false
          description: Página (1-based). Por defecto 1; valores < 1 se normalizan a 1.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          description: Filas por página. El cliente elige de 10 en 10 hasta 50; fuera de rango se acota.
          schema: { type: integer, minimum: 10, maximum: 50, default: 20 }
      responses:
        "200":
          description: Validaciones del tenant + KPIs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantBiometricValidationsResponse"
        "400":
          description: >
            Falta el header X-Tenant-Id, parámetros de filtro inválidos (estado/provider/parte fuera de
            catálogo, scoreMin &gt; scoreMax, createdFrom &gt; createdTo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/identity-validation/stuck:
    get:
      operationId: listStuckIdentityValidations
      tags: [Tramites, Identidad]
      summary: Eventos de validación de identidad atascados (dead-letter) (HU #10349 fase 2)
      description: >
        Observabilidad operativa del encadenamiento async de identidad (patrón outbox). Lista los eventos
        `completed` del tenant que quedaron ATASCADOS: pendientes (no despachados) que agotaron los
        reintentos del worker (`attempts >= maxDeliveryAttempts`) y, por lo tanto, NO se reintentan más.
        Útil para detectar trámites cuyo auto-flujo (firma/FUR) quedó trabado. Recuperación operativa:
        reencolar poniendo `attempts = 0` en la fila (el worker la retomará). Sin PII (no expone el payload).
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Eventos atascados + total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StuckIdentityValidationsResponse"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/identity-validation/stuck/{id}/requeue:
    post:
      operationId: requeueStuckIdentityValidation
      tags: [Tramites, Identidad]
      summary: Reencolar ("desatascar") un evento de identidad atascado (HU #10349 fase 2)
      description: >
        Reinicia los intentos de un evento ATASCADO (dead-letter) para que el worker lo vuelva a procesar
        en el próximo ciclo. Idempotente. 404 si no hay un evento atascado con ese id para el tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id del evento en la outbox (identity_validation_outbox.id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evento reencolado; el worker lo retomará en el próximo ciclo.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: boolean, example: true }
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No hay un evento atascado con ese id para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/identity-validation/stuck/requeue-all:
    post:
      operationId: requeueAllStuckIdentityValidations
      tags: [Tramites, Identidad]
      summary: Reencolar TODOS los eventos de identidad atascados del tenant (HU #10349 fase 2)
      description: >
        Reinicia los intentos de todos los eventos ATASCADOS (dead-letter) del tenant de una vez para que
        el worker los vuelva a procesar. Idempotente. Devuelve cuántos se reencolaron.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cantidad de eventos reencolados.
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer, example: 3 }
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/finalize-draft:
    post:
      operationId: finalizeDraftProcedureInstance
      tags: [Tramites]
      summary: Finalizar borrador del trámite (HU #10349)
      description: >
        Marca un borrador como "finalizado": valida que la captura de datos esté completa (actores de la
        modalidad, documentos obligatorios y organismo de tránsito) PERO **no** exige validación de
        identidad ni FUR. La instancia permanece en estado `draft` y se sella `draftFinalizedAt`, quedando
        a la espera de la validación de identidad asíncrona del cliente (fase 2). Idempotente: si el
        borrador ya estaba finalizado, devuelve el resumen actual sin re-sellar. La radicación real
        (`submit`, Draft→Submitted) sigue exigiendo identidad + FUR + reglas OT.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Identificador de la instancia (procedure_instance_id).
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Borrador finalizado; `draftFinalizedAt` sellado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureInstanceSummary"
        "400":
          description: Falta el header X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La instancia no existe para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            La instancia no está en `draft` (`not_draft`) o faltan datos para finalizar
            (`actores_incompletos`, `documentos_incompletos`, `organismo_requerido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/identity/ensure:
    post:
      operationId: ensureProcedureInstanceIdentity
      tags: [Tramites, Identidad]
      summary: Asegurar la identidad vigente de una parte (HU #10350)
      description: >
        Al guardar una parte (comprador/vendedor) el sistema asegura su validación de identidad sin
        esperar un clic manual: si la persona (tipoDoc+documento) tiene una validación APROBADA y VIGENTE
        (≤30 días calendario desde la aprobación; el día de aprobación es el día 1 y vence el día 31) en
        cualquier trámite del tenant, la reutiliza clonándola a este trámite (hereda la fecha de
        aprobación → conserva el mismo vencimiento). Si no hay vigente, responde `requiere_validacion`
        para que el cliente sea enviado a validar automáticamente. Idempotente.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parte]
              properties:
                parte:
                  type: string
                  enum: [comprador, vendedor]
      responses:
        "200":
          description: Desenlace de la verificación de identidad de la parte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnsureIdentityResult"
        "400":
          description: parte inválida o falta X-Tenant-Id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Instancia no encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tramites/instances/{id}/biometric:
    post:
      operationId: iniciarProcedureInstanceBiometric
      tags: [Tramites, Identidad]
      summary: Iniciar validación de identidad de una parte (HU #10233)
      description: >
        Inicia la validación biométrica/de identidad de una parte del trámite. El proveedor depende del
        flag de configuración `Biometrics:Provider`: con `mock` devuelve un magic-link (flujo de 3 fotos);
        con `kyverum` delega la captura a Kyverum Verify y devuelve la `captureUrl` (la validación queda
        `en_proceso` hasta que Kyverum notifique vía webhook). Requiere instancia en estado `draft`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Tenant-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarBiometriaInput"
      responses:
        "201":
          description: >
            Validación creada. El cuerpo varía según el proveedor: `IniciarKyverumVerifyResult`
            (kyverum) o el resultado del magic-link (mock).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarKyverumVerifyResult"
        "202":
          description: >
            El envío al proveedor falló de forma transitoria y quedó ENCOLADO para reintento automático
            (la validación está en `pendiente_envio`, `queued=true`, aún sin `captureUrl`). Un worker
            provider-agnostic reintenta el envío y la pasa a `en_proceso`, o a `error_envio` si agota intentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IniciarKyverumVerifyResult"
        "400":
          description: Datos incompletos o parte inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La instancia no está en draft o ya existe una validación activa para la parte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor de identidad rechazó la solicitud (error definitivo, AC7).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: El proveedor de identidad no está disponible (transitorio, AC7).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/kyverum-verify/{validationId}:
    post:
      operationId: kyverumVerifyWebhook
      tags: [Identidad]
      summary: Webhook de resultado de Kyverum Verify (HU #10233)
      security: []          # público: la credencial es la firma HMAC del cuerpo
      description: >
        Recibe la notificación de resultado de una validación de Kyverum. El `validationId` (nuestro id)
        viaja en el path porque el cuerpo del webhook no lo repite; se registra en la `webhookUrl` al
        crear la validación. La autenticidad se valida con la firma HMAC-SHA256 del cuerpo crudo en el
        header `x-kv-signature` con formato `sha256=<hex>` (firma inválida ⇒ 401, sin cambios).
        Idempotente: una validación ya resuelta devuelve 200 sin re-aplicar.
      parameters:
        - name: validationId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la validación FLIT (correlación).
        - name: x-kv-signature
          in: header
          required: true
          schema: { type: string }
          description: "sha256=<hex>, hex = HMAC_SHA256(webhookSecret, cuerpo crudo)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KyverumWebhookPayload"
      responses:
        "200":
          description: Webhook procesado (o ya procesado — idempotente).
        "400":
          description: Cuerpo del webhook inválido.
        "401":
          description: Firma HMAC inválida (sin cambios en BD).
        "404":
          description: Validación no encontrada.

  /api/v1/analytics/overview:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsOverview
      summary: Métricas por categoría/estado del tenant en un rango de fechas (RF01, RF02, RF07)
      description: >
        Devuelve conteos de trámites por categoría (matriculas/traspasos/otros) y estado para
        el rango [from, to]. El tenant se toma del claim JWT `tenant_id` (AC1); un SuperAdmin
        puede indicar `tenantId` por query para consultar otra compañía (AC2). Requiere JWT con
        rol de empresa o SuperAdmin (AdminCompany).
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: Fecha inicial inclusiva (YYYY-MM-DD).
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: Fecha final inclusiva (YYYY-MM-DD).
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; selecciona la compañía a consultar (AC2).
      responses:
        "200":
          description: Métricas agregadas del periodo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverviewResponse"
        "400":
          description: Rango inválido (`from` posterior a `to`) o falta tenant (AC4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Tenant Admin solicitando métricas de otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/productivity/top:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsTopProducers
      summary: Top de radicadores por trámites enviados en un rango (RF07, AC3)
      description: >
        Devuelve hasta `limit` usuarios ordenados por `submittedCount` descendente. Mismo
        modelo de tenant que el overview (claim `tenant_id`; SuperAdmin con `tenantId` opcional).
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 50 }
          description: Tamaño del ranking (por defecto 5).
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin (AC2).
      responses:
        "200":
          description: Ranking de productividad del periodo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopProducersResponse"
        "400":
          description: Rango inválido o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Tenant Admin solicitando otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/procedures:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsProcedureDetails
      summary: Detalle paginado de trámites filtrable por categoría y estado (RF04, RF05)
      description: >
        Lista el detalle de trámites del tenant en el rango [from, to], filtrable por
        `category` (matriculas/traspasos/otros) y `status`, con paginación. `totalCount`
        refleja el universo filtrado. Mismo modelo de tenant que el overview (claim
        `tenant_id`; SuperAdmin con `tenantId` opcional). Aislamiento multi-tenant por RLS.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [matriculas, traspasos, otros] }
        - name: status
          in: query
          required: false
          schema: { type: string, example: submitted }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin.
      responses:
        "200":
          description: Página de detalle (vacía con totalCount=0 si no hay trámites).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureDetailsPage"
        "400":
          description: Rango inválido o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Tenant Admin solicitando otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/export/excel:
    get:
      tags: [Analytics · Dashboard]
      operationId: analyticsExportExcel
      summary: Exporta a Excel (.xlsx) el detalle de trámites filtrado (RF06)
      description: >
        Descarga un .xlsx con el detalle de trámites del rango, con los mismos filtros que
        `/analytics/procedures`. El archivo se genera por streaming (OpenXmlWriter), procesando
        las filas por chunks sin materializar el conjunto completo en memoria (AC2). Sin datos,
        el archivo contiene solo la fila de encabezados (AC3).
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [matriculas, traspasos, otros] }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin.
      responses:
        "200":
          description: Archivo Excel con el detalle filtrado.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Rango inválido o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Tenant Admin solicitando otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/export/executive-pdf:
    post:
      tags: [Analytics · Dashboard]
      operationId: analyticsExecutivePdf
      summary: Genera el PDF de Resumen Ejecutivo del periodo (RF10)
      description: >
        Genera un PDF con los totales por categoría y el Top 5 de radicadores del periodo.
        El tenant se toma del claim `tenant_id` (AC2); un SuperAdmin puede indicar `tenantId`
        en el cuerpo. Si falta `from` o `to`, responde 400 (AC3).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutivePdfRequest"
      responses:
        "200":
          description: PDF del Resumen Ejecutivo.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Falta from/to, rango inválido o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Tenant Admin solicitando otro tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/improntas/generate:
    post:
      tags: [Admin · Improntas]
      operationId: adminImprontasGenerate
      summary: Genera, persiste y entrega el PDF del Certificado de Improntas Digitales (HU #10467)
      description: >
        Llama a Kyverum RUNT (HU #10465), decodifica el PDF del Data URI base64 devuelto, persiste
        el registro de trazabilidad (HU #10466: radicado, hash, fechaImpresa, datos del vehículo,
        organización, operador, tenant y usuario SuperAdmin que la generó) y responde con el binario
        íntegro, listo para descarga (`impronta_{radicado}.pdf`). Requiere rol SuperAdmin (AC2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarImprontaRequest"
      responses:
        "200":
          description: PDF del Certificado de Improntas Digitales.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: No autenticado, o Kyverum RUNT rechazó la autenticación (key inválida/scope insuficiente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario autenticado sin rol SuperAdmin (AC2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Falta placa/identificador de vehículo/organización/operador (validación local), o
            Kyverum RUNT respondió VALIDATION_ERROR (AC3).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Kyverum RUNT no disponible temporalmente (UPSTREAM_UNAVAILABLE, AC3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, expiresInSeconds, tokenType]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
        tokenType:
          type: string
          example: Bearer
    CurrentUserResponse:
      type: object
      required: [userId, email, tenantId, roleId, permissions]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        tenantId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        permissions:
          type: array
          items:
            type: string
    AuthErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CompanyListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        nit: { type: string }
        razonSocial: { type: string }
        code: { type: string, description: Código único del tenant (inmutable). }
        tenantType:
          type: string
          enum: [RENTING, CONCESIONARIO, FLIT]
          description: >-
            Tipo de compañía del catálogo B2B. La migración RestrictTenantTypeCatalog
            normalizó los tipos heredados (p.ej. standard, transit_office) a RENTING y
            agregó el CHECK ck_tenants_tenant_type, por lo que la BD solo admite estos tres.
        estadoActivo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        rowVersion:
          type: integer
          format: int64
          description: >-
            Token de concurrencia optimista (identity.tenants.row_version). Se reenvía en
            UpdateCompanyRequest para detectar ediciones concurrentes (409).
      required: [id, nit, razonSocial, code, tenantType, estadoActivo, fechaCreacion, rowVersion]

    CompanyPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CompanyListItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateCompanyRequest:
      type: object
      properties:
        razonSocial:
          type: string
          maxLength: 255
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Razón social (legal_name). Solo letras, números, espacios y puntuación básica
            de nombres (. , & ( ) / ' ° -).
        nit:
          type: string
          maxLength: 20
          pattern: "^(?=.*[0-9])[0-9.\\-]+$"
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        code:
          type: string
          maxLength: 32
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9_-]+$"
          description: Código único del tenant. Alfanumérico con guion y guion bajo.
        tenantType:
          type: string
          enum: [RENTING, CONCESIONARIO, FLIT]
        estadoActivo: { type: boolean, default: true, description: Estado activo inicial. }
      required: [razonSocial, nit, code, tenantType]

    UpdateCompanyRequest:
      type: object
      description: Edición de compañía. El código es inmutable, por lo que no se incluye.
      properties:
        razonSocial:
          type: string
          maxLength: 255
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Razón social (legal_name). Solo letras, números, espacios y puntuación básica
            de nombres (. , & ( ) / ' ° -).
        nit:
          type: string
          maxLength: 20
          pattern: "^(?=.*[0-9])[0-9.\\-]+$"
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        tenantType:
          type: string
          description: >-
            Tipo de compañía. Para cambiarlo debe ser del catálogo B2B (RENTING,
            CONCESIONARIO, FLIT). Si coincide (ignorando mayúsculas) con el tipo actual
            del tenant se preserva tal cual, lo que permite editar tenants con tipos
            heredados (p.ej. standard, transit_office) sin alterar su tipo.
        estadoActivo: { type: boolean, default: true, description: Estado activo. }
        rowVersion:
          type: integer
          format: int64
          description: >-
            Versión de fila leída al abrir la edición. Opcional: si se envía y no coincide
            con la actual del tenant, la edición se rechaza con 409 (lost update).
      required: [razonSocial, nit, tenantType]

    SetCompanyStatusRequest:
      type: object
      properties:
        estadoActivo:
          type: boolean
          description: "true activa la compañía; false la desactiva (identity.tenants.is_active)."
      required: [estadoActivo]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    DocumentTypeAssociationsError:
      type: object
      description: Error 409 del soft-delete con los trámites que usan el documento.
      properties:
        error: { type: string }
        procedureTypes:
          type: array
          description: Tipos de trámite que referencian el documento.
          items:
            type: object
            properties:
              codigo: { type: string }
              nombre: { type: string }
            required: [codigo, nombre]
      required: [error, procedureTypes]

    SwitchesMatricula:
      type: object
      properties:
        allowInitialRegistration: { type: boolean }
        allowMiscNewVehicles: { type: boolean }
        onlyOwnVehicles: { type: boolean }
      required: [allowInitialRegistration, allowMiscNewVehicles, onlyOwnVehicles]

    TenantSettings:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        switchesMatricula:
          $ref: "#/components/schemas/SwitchesMatricula"
        baulFirmasActivo: { type: boolean }
        enrutamientoSMTP:
          type: string
          enum: [FLIT_SMTP, TENANT_API]
        notificationTarget:
          type: string
          enum: [COMPRADOR, RADICADOR, NINGUNO]
        metodosRecaudo:
          type: array
          items: { type: string }
      required:
        [tenantId, switchesMatricula, baulFirmasActivo, enrutamientoSMTP, notificationTarget, metodosRecaudo]

    TenantSettingsUpdate:
      type: object
      properties:
        switchesMatricula:
          $ref: "#/components/schemas/SwitchesMatricula"
        baulFirmasActivo: { type: boolean }
        enrutamientoSMTP:
          type: string
          enum: [FLIT_SMTP, TENANT_API]
        notificationTarget:
          type: string
          enum: [COMPRADOR, RADICADOR, NINGUNO]
        metodosRecaudo:
          type: array
          items: { type: string }
      required:
        [switchesMatricula, baulFirmasActivo, enrutamientoSMTP, notificationTarget, metodosRecaudo]

    ValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
      required: [field, message]

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required: [errors]

    WhitelistEntry:
      type: object
      description: Correo activo de la lista blanca (AC6).
      properties:
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        addedBy: { type: string, format: uuid, nullable: true }
      required: [email, createdAt]

    WhitelistAddRequest:
      type: object
      description: Alta masiva de correos exentos (AC4).
      properties:
        emails:
          type: array
          minItems: 1
          items: { type: string, format: email }
          description: Correos a exentar. Se normalizan a minúsculas y se deduplican.
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Motivo opcional de la excepción.
      required: [emails]

    WhitelistAddResponse:
      type: object
      description: Resultado del alta masiva (AC4).
      properties:
        added:
          type: array
          items: { type: string, format: email }
          description: Correos insertados (uno por fila + una fila de auditoría).
        skipped:
          type: array
          items: { type: string, format: email }
          description: Correos omitidos por ya existir (idempotencia).
      required: [added, skipped]

    WhitelistValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
        value: { type: string, nullable: true }
      required: [field, message]

    WhitelistValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/WhitelistValidationError"
      required: [errors]

    TransferStartRequest:
      type: object
      description: >
        Payload del stub de radicación (AC1/AC2). onlyOwnVehicles es la política
        efectiva ya resuelta (snapshot si in-flight, live si nuevo; AC3).
      properties:
        tenantId: { type: string, format: uuid }
        vehicleIdentifier: { type: string, nullable: true }
        userEmail: { type: string, format: email, nullable: true }
        onlyOwnVehicles: { type: boolean }
      required: [tenantId, onlyOwnVehicles]

    TransitOffice:
      type: object
      description: Organismo de tránsito del catálogo estático (AC1).
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        departmentCode: { type: string }
        cityCode: { type: string }
      required: [id, code, name, departmentCode, cityCode]

    TransitGrantRequest:
      type: object
      description: Habilitación de un organismo de tránsito a un tenant (AC2).
      properties:
        transitOfficeId:
          type: string
          format: uuid
          description: Id del organismo a habilitar. Debe existir en el catálogo estático.
      required: [transitOfficeId]

    TransitGrantCreatedResponse:
      type: object
      description: Resultado del alta de un grant (AC2).
      properties:
        transitOfficeId: { type: string, format: uuid }
        created:
          type: boolean
          description: true si se creó el grant; false si ya existía (idempotente).
      required: [transitOfficeId, created]

    TransitGrantListResponse:
      type: object
      description: Organismos de tránsito habilitados del tenant (AC5).
      properties:
        transitOfficeIds:
          type: array
          items: { type: string, format: uuid }
      required: [transitOfficeIds]

    TransitGrantValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
        value: { type: string, nullable: true }
      required: [field, message]

    TransitGrantValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/TransitGrantValidationError"
      required: [errors]

    TransitOfficeTenantItem:
      type: object
      description: >
        Tenant Organismo de Tránsito (join identity.tenants +
        admin.transit_office_profiles, refactor adminOT).
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        taxId: { type: string }
        code: { type: string, description: Código único del tenant (inmutable). }
        tenantType:
          type: string
          enum: [RENTING]
          description: >-
            Siempre RENTING para tenants OT (decisión intencional — ver
            RestrictTenantTypeCatalog. admin.transit_office_profiles es la fuente de
            verdad de que un tenant "es" un OT, no tenantType).
        estadoActivo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        rowVersion: { type: integer, format: int64 }
        transitOfficeId:
          type: string
          format: uuid
          description: Oficina del catálogo vinculada (admin.transit_office_profiles.transit_office_id).
        transitOfficeName: { type: string }
        transitOfficeCode: { type: string }
        operationMode:
          type: string
          enum: [dashboard, quipux]
      required:
        [id, legalName, taxId, code, tenantType, estadoActivo, fechaCreacion, rowVersion,
