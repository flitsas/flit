                $ref: "#/components/schemas/ReintentoPegadas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = CELDA_MODIFICADA: una celda cambió mientras se pedía el reintento; volver a leer la grilla."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express:
    post:
      tags: [Express]
      operationId: crearDiagnosticoExpress
      summary: Crea un diagnóstico Express de un solo vehículo (cabecera y vehículo en una transacción)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F02-H6, F02-C4/C12/C13, F01-C10). El backoffice FLIT no lo tiene
        (R-6): 403. Primero revalida el vehículo con la regla de fila de la carga y de la confirmación: identificador
        ausente (IDENTIFICADOR_REQUERIDO), que no es placa ni VIN (IDENTIFICADOR_INVALIDO), de más de 8 caracteres de placa
        o 17 de VIN después de limpiar, nunca recortado (IDENTIFICADOR_DEMASIADO_LARGO), o documento del locatario mal
        formado (TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO): 422 con `campo` y no se crea nada.
        Después, en una sola transacción, crea la cabecera en CREADO con es_express = true y las mismas reglas de
        POST /diagnosticos (422 con su campo; 503 con CON_ANALISIS y el catálogo caído) y confirma el vehículo como
        POST /diagnosticos/{id}/vehiculos (documento del locatario cifrado con origen DECLARADO_CLIENTE, estimado en la
        cabecera, entrega al motor de consultas, que crea las celdas y deja el lote EN_PROCESO, HU #13727; por eso
        `estado` llega EN_PROCESO). Si algo falla no queda cabecera ni vehículo. Sin nombre (o solo
        espacios) se autogenera «Express IDENTIFICADOR» con el identificador normalizado, sin fecha (HU #14087; los
        nombres ya guardados no cambian); un nombre enviado se valida como en POST /diagnosticos (máximo 150).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "201":
          description: Diagnóstico Express creado con su único vehículo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressCreado"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.crear (sin cuerpo; el backoffice FLIT, R-6); sin usuario (`code` = SIN_USUARIO),
            sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Regla del vehículo (`campo` = identificador, tipo_documento_locatario o documento_locatario) o de la cabecera
            (los códigos de POST /diagnosticos). No se crea nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "`code` = CATALOGO_NO_DISPONIBLE: CON_ANALISIS y el catálogo de tipos de trámite no está disponible. No se crea nada."
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express/estimado:
    post:
      tags: [Express]
      operationId: estimarDiagnosticoExpress
      summary: Estimado de consultas por fuente del Express antes de lanzarlo (no persiste nada)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F01-C11). Endpoint nuevo frente al plan §6.1. Recibe el mismo
        cuerpo que POST /express y no guarda nada. Con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de
        la compañía del token responde mostrar_estimado = true y el estimado por fuente del alcance para un vehículo (las
        fuentes del locatario cuentan 0 sin documento de locatario); con otro valor responde mostrar_estimado = false sin
        estimado_consultas. Un código de fuente desconocido es 422 VALOR_FUERA_DE_CONJUNTO y un documento del locatario mal
        formado es 422 con su campo. No valida el identificador ni las fuentes habilitadas (eso lo hace POST /express).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "200":
          description: Estimado de vista previa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimadoExpress"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear (el backoffice FLIT, R-6); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: "`code` = VALOR_FUERA_DE_CONJUNTO (fuente desconocida) o error de forma del documento del locatario, con `campo`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/fuentes-obligatorias:
    get:
      tags: [Backoffice, Catalogos]
      operationId: listarFuentesObligatoriasBackoffice
      summary: Catálogo global de fuentes obligatorias por trámite (backoffice FLIT)
      description: >
        ADR-0078. Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT). No pide
        ?empresa=: el dato es de FLIT, no de una compañía. Mandar ?empresa= no cambia la respuesta y no responde
        EMPRESA_REQUERIDA. No se registra en lecturas_backoffice. Lista las cabeceras guardadas con sus líneas;
        una cabecera con fuentes vacías va en el arreglo y una definición que no existe no va (en el alta, eso es
        heredar). Orden: familias por código, después tipos por código. Dentro de fuentes, el orden del enum
        Fuente sin RUNT.
      responses:
        "200":
          description: Definiciones guardadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDefinicionesFuentesObligatorias"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            La política no pasa (sin cuerpo). También SIN_EMPRESA, SIN_USUARIO si el token no trae compañía o
            usuario, y PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Catalogos]
      operationId: guardarFuentesObligatoriasBackoffice
      summary: Reemplaza las fuentes de una definición (backoffice FLIT)
      description: >
        Misma política que el GET, sin permiso distinto y sin ?empresa=. El cuerpo es la lista completa. Si la
        cabecera no existe, la crea con uuid v7. Si existe, la conserva y reemplaza las líneas. fuentes vacío
        deja la cabecera (vacío explícito) y no la borra. Una fuente repetida cuenta una vez. La respuesta trae
        fuentes en el orden del enum Fuente sin RUNT. actualizado_por toma el sub del token. Con un error no se
        escribe ninguna línea. Orden de validación: forma (CUERPO_INVALIDO, DEFINICION_AMBIGUA) y después
        negocio (FUENTE_DESCONOCIDA, FUENTE_RUNT_NO_CONFIGURABLE, SIMIT_PROHIBIDO_EN_UNILATERAL,
        PISO_NO_DISPENSABLE). No hay DELETE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinicionFuentesObligatorias"
      responses:
        "200":
          description: Definición guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefinicionFuentesObligatorias"
        "400":
          description: >
            `code` = CUERPO_INVALIDO si el cuerpo no es un objeto JSON o no trae el arreglo fuentes.
            `code` = DEFINICION_AMBIGUA (`campo` = familia) si vienen familia y tipo, no viene ninguno, o el
            texto no cumple ^[A-Z][A-Z0-9_]{0,63}$.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            La política no pasa (sin cuerpo). SIN_USUARIO si el sub no es un uuid, ya con el cuerpo aceptado y
            antes de escribir. También SIN_EMPRESA y PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `campo` = fuentes. `code` = FUENTE_DESCONOCIDA (no está en el enum), FUENTE_RUNT_NO_CONFIGURABLE
            (el arreglo incluye RUNT), SIMIT_PROHIBIDO_EN_UNILATERAL (TRASPASO_UNILATERAL incluye un SIMIT_*)
            o PISO_NO_DISPENSABLE (falta SIMIT_PROPIETARIO en la familia TRASPASO, en TRASPASO_STANDARD o en
            TRASPASO_TRANSFERENCIA_DE_DOMINIO). VALOR_INVALIDO si un CHECK de la base se escapa (SQLSTATE 23514).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas:
    get:
      tags: [Backoffice, Configuracion]
      operationId: listarEmpresasBackoffice
      summary: Empresas con Diagnóstico para el selector del editor de contrato (backoffice FLIT)
      description: >
        HU #13741 (escenarios 15 y 16). Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT). Desde los ajustes 2026-11-11 (punto 6) ya no exige
        diagnostico.configuracion.contrato.editar: también la usa el selector del listado de diagnósticos.
        Devuelve las empresas activas con Diagnóstico encendido tal como las tiene Identidad
        (EmpresasService.ListarEmpresasConProducto, producto diagnostico), ordenadas por nombre (sin distinguir
        mayúsculas ni tildes). Solo lectura de la plataforma: no lleva empresa explícita ni se registra en
        lecturas_backoffice. Nunca responde una lista vacía cuando Identidad no está configurada o no responde:
        en esos casos, 503 con `code`.
      responses:
        "200":
          description: Empresas con Diagnóstico encendido (puede ser vacía solo si Identidad respondió sin ninguna).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmpresaBackoffice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o
            PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = IDENTIDAD_NO_CONFIGURADA: el servicio no tiene Diagnostico:Identidad:Address (sin Retry-After).
            `code` = IDENTIDAD_NO_DISPONIBLE: Identidad no respondió o rechazó al cliente de servicio (con Retry-After).
          headers:
            Retry-After:
              description: Segundos antes de reintentar (solo con IDENTIDAD_NO_DISPONIBLE).
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas/{empresa}/configuracion/contrato:
    parameters:
      - name: empresa
        in: path
        required: true
        description: >
          Compañía cuyo contrato se lee o edita (uuid distinto de cero). Si además llega ?empresa=, debe
          coincidir (si no, 400 EMPRESA_REQUERIDA).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice, Configuracion]
      operationId: obtenerContratoEmpresaBackoffice
      summary: Contrato de una compañía para el backoffice FLIT
      description: >
        Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y además
        diagnostico.configuracion.contrato.editar (HU #13741). La lectura queda en diagnostico.lecturas_backoffice
        antes de leer. Sin fila guardada devuelve los valores por defecto.
      responses:
        "200":
          description: Contrato de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida o distinta en la ruta y en la consulta (`code` = EMPRESA_REQUERIDA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); token sin
            compañía (SIN_EMPRESA) o sin usuario (SIN_USUARIO); PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Configuracion]
      operationId: editarContratoEmpresaBackoffice
      summary: Edita el contrato de una compañía (backoffice FLIT)
      description: >
        Mismos permisos que el GET. Edita fuentes_habilitadas, limite_vehiculos_lote (mayor que cero) y el
        interruptor de emergencia redaccion_ia_suspendida (R-2) de la compañía de la ruta, por la vía de
        escritura entre compañías del módulo Backoffice (ADR-0073). Se guardan los campos que llegan. Reducir
        las habilitadas recorta fuentes_por_defecto en el mismo comando. Cada campo que cambia (también el
        recorte) queda en diagnostico.cambios_contrato con el usuario, la compañía, el valor anterior y el nuevo;
        el PUT no se registra en lecturas_backoffice. Orden de validación: un campo que no es del contrato da
        403 CAMPO_NO_EDITABLE; un valor fuera de conjunto, 422 VALOR_FUERA_DE_CONJUNTO; un límite que no es un
        entero positivo, 422 LIMITE_INVALIDO; habilitar una fuente sin adaptador registrado (en D2 solo RUNT lo
        tiene, HU #13733) o IMPUESTO_DEPARTAMENTAL mientras no esté disponible (C3, R-9; HU #13863: bandera
        Diagnostico:Fuentes:ImpuestoDisponible en true, adaptador conectado y al menos un departamento soportado
        en la réplica), 422 FUENTE_NO_DISPONIBLE: es la misma regla de fuentes_disponibles. Quitar del contrato
        una fuente habilitada que dejó de estar disponible sigue permitido. Con un error no
        se guarda ningún campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionContrato"
      responses:
        "200":
          description: Contrato guardado (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida (EMPRESA_REQUERIDA) o cuerpo que no es un objeto o repite un campo (CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); campo que no
            es del contrato (CAMPO_NO_EDITABLE); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, LIMITE_INVALIDO, FUENTE_NO_DISPONIBLE o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/consultas/{consulta}/intentos:
    get:
      tags: [Backoffice]
      operationId: listarIntentosConsultaBackoffice
      summary: Intentos de una celda (auditoría del backoffice FLIT)
      description: >
        HU #13737 (F03-H6, F03-C11, plan §6.1 fila 03). Cada ejecución de una celda deja un intento de solo
        inserción en diagnostico.intentos_consulta (disparador AUTO y usuario_id nulo cuando lo hace el
        procesador; los reintentos de errores transitorios con backoff también dejan su intento). Política
        diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y además diagnostico.auditoria.ver:
        un usuario de la compañía recibe 403. Empresa explícita en ?empresa=; la lectura queda en
        diagnostico.lecturas_backoffice. Los intentos nunca llevan documentos: solo la placa o el VIN consultado.
        Orden: inicio ascendente.
      parameters:
        - name: consulta
          in: path
          required: true
          description: Id de la celda (diagnostico.consultas.id).
          schema:
            type: string
            format: uuid
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña de la celda (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Intentos de la celda, del más antiguo al más reciente (lista vacía si aún no se ejecutó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentosConsulta"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice o le falta diagnostico.auditoria.ver (sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: La celda no existe en la compañía indicada (`code` = CONSULTA_NO_ENCONTRADA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/consultas/{consulta}/manual:
    parameters:
      - name: consulta
        in: path
        required: true
        description: Id de la celda (`vehiculos[].celdas[].id` de obtenerGrillaDiagnosticoBackoffice).
        schema:
          type: string
          format: uuid
      - name: empresa
        in: query
        required: true
        description: Id de la compañía dueña de la celda (uuid distinto de cero, un solo valor).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerFormularioLlenadoManualBackoffice
      summary: Formulario del llenado manual de una celda (backoffice FLIT)
      description: >
        HU #13800 (F06-H3). Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT), además
        la política de operación FLIT diagnostico.backoffice.operacion (compañía FLIT con diagnostico.backoffice.ver o SuperAdmin de FLIT; un SuperAdmin de otra compañía recibe 403) y diagnostico.consultas.llenar; empresa explícita en ?empresa= (la lectura queda en diagnostico.lecturas_backoffice).
        Devuelve la versión de la celda que se manda en el PUT, si admite el llenado (`admite_manual`) y, si no, el `motivo`
        (FUENTE_NO_ADMITE_MANUAL, CELDA_NO_EN_ERROR, CELDA_BLOQUEADA_POR_RUNT o SIN_PERSONAS_EN_ERROR). En las fuentes de persona
        (RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO) trae SOLO las personas en ERROR con su
        `persona_id` (el que va en el PUT), el documento enmascarado y la `consulta` que define el esquema de su resultado
        (RUNT_PERSONA, RUES o SIMIT); en las del vehículo, `personas` es null. Nunca el documento en claro ni el payload.
      responses:
        "200":
          description: Formulario de la celda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormularioLlenadoManual"
              example:
                id: 0199f3a1-6666-7000-8000-000000000006
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                vehiculo_id: 0199f3a1-2222-7000-8000-000000000002
                fuente: SIMIT_PROPIETARIO
                estado: ERROR
                tipo_error: PERSONAS_CON_ERROR
                version: 2
                admite_manual: true
                motivo: null
                personas:
                  - { persona_id: 0199f3a1-7777-7000-8000-000000000007, orden: 2, rol: PROPIETARIO, tipo_documento: C, documento_enmascarado: "****0102", declarado_por_cliente: false, consulta: SIMIT, tipo_error: TIMEOUT }
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (también un SuperAdmin de otra compañía) o le falta diagnostico.consultas.llenar (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice]
      operationId: llenarConsultaManualBackoffice
      summary: Llenar a mano una celda en ERROR (backoffice FLIT)
      description: >
        HU #13800 (F06-H3, F06-C8..C11, R-1, R-8, R-20). Misma autorización que el GET (sin diagnostico.consultas.llenar: 403;
        el admin y el usuario de la compañía: 403). Solo una celda en ERROR que no sea BLOQUEADA_POR_RUNT, de una fuente distinta
        de RUNT e IMPUESTO_DEPARTAMENTAL (Q3, R-9). El cuerpo lleva la `version` de la celda que vio el backoffice (la de la
        grilla del backoffice o la del GET) y, según la fuente, `resultado` (SIMIT_VEHICULO: ResultadoManualSimit; AVALUO:
        ResultadoManualAvaluo) o `personas` (fuentes de persona: TODAS las personas en ERROR y solo ellas, cada una con el
        esquema de su `consulta`: RUNT_PERSONA, ResultadoManualRuntPersona; RUES, ResultadoManualRues; SIMIT,
        ResultadoManualSimit). Esquema cerrado: un campo desconocido es 422. La fecha del dato la fija el servidor (el avalúo
        no acepta `fecha`). En una transacción: la celda queda COMPLETADO con origen MANUAL y el usuario, tipo_error null y
        dato_obtenido_en del servidor; sube la versión del tablero; queda un intento disparador=MANUAL con el usuario, sin
        servicio ni transacción del proveedor (uno por persona llenada en las de persona; no consume); si el lote estaba
        COMPLETADO o INCOMPLETO vuelve a EN_PROCESO (historial MANUAL con el usuario) y se recalcula (sin más errores pasa a
        COMPLETADO, historial AUTO). Las personas que respondieron por API no cambian. La compañía no distingue el dato
        (mismo payload que la API; su historial muestra MANUAL como AUTO, Q5). Una celda MANUAL nunca se reutiliza el mismo día.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LlenadoManualVehiculo"
                - $ref: "#/components/schemas/LlenadoManualPersonas"
            examples:
              simitVehiculo:
                summary: SIMIT_VEHICULO
                value:
                  version: 14
                  resultado:
                    semaforo: AMARILLO
                    cantidad_comparendos: 1
                    comparendos:
                      - { numero: TST-C-0001, fecha: "2026-09-30", valor: "468500", estado: PENDIENTE, organismo: Organismo de prueba }
              avaluo:
                summary: AVALUO con valor
                value:
                  version: 9
                  resultado:
                    sin_valor_comercial: false
                    valor_sugerido: 48500000
                    fuente_principal: fasecolda
                    fuentes:
                      - { fuente: fasecolda, estado: OK, valor: 48500000, muestras: 3 }
                      - { fuente: mercado_libre, estado: SIN_DATOS }
              avaluoSinValor:
                summary: AVALUO sin valor comercial
                value:
                  version: 9
                  resultado: { sin_valor_comercial: true, fuentes: [{ fuente: fasecolda, estado: SIN_DATOS }] }
              simitPersona:
                summary: SIMIT_PROPIETARIO (solo las personas en ERROR)
                value:
                  version: 2
                  personas:
                    - persona_id: 0199f3a1-7777-7000-8000-000000000007
                      resultado: { semaforo: VERDE, cantidad_comparendos: 0, comparendos: [] }
              runtPersona:
                summary: RUNT_PROPIETARIO, persona natural (consulta RUNT_PERSONA)
                value:
                  version: 5
                  personas:
                    - persona_id: 0199f3a1-8888-7000-8000-000000000008
                      resultado: { inscrito: true, estado_conductor: ACTIVO, licencias: [{ categoria: B1, estado: VIGENTE, vigente_hasta: "2030-01-01" }] }
              rues:
                summary: RUNT_PROPIETARIO con NIT (consulta RUES)
                value:
                  version: 5
                  personas:
                    - persona_id: 0199f3a1-9999-7000-8000-000000000009
                      resultado: { encontrada: true, estado_matricula: ACTIVA, ultima_renovacion: "2026-03-31" }
      responses:
        "200":
          description: Celda llenada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlenadoManualRespuesta"
              example:
                id: 0199f3a1-4444-7000-8000-000000000004
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                vehiculo_id: 0199f3a1-2222-7000-8000-000000000002
                fuente: SIMIT_VEHICULO
                estado: COMPLETADO
                origen: MANUAL
                usuario_manual_id: 0199f3a1-5555-7000-8000-000000000005
                dato_obtenido_en: "2026-10-22T17:30:00+00:00"
                version: 15
                estado_lote: COMPLETADO
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA), o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (también un SuperAdmin de otra compañía) o le falta diagnostico.consultas.llenar (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe en la compañía indicada (nada cambia)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            Nada cambia. `code` = CELDA_MODIFICADA (la `version` enviada no es la actual, p. ej. un reproceso en curso:
            recargar la grilla), CELDA_NO_EN_ERROR (COMPLETADO, también el avalúo «sin valor comercial»; PENDIENTE, EN_CURSO o NA)
            o CELDA_BLOQUEADA_POR_RUNT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Nada cambia. `code` = FUENTE_NO_ADMITE_MANUAL (RUNT o IMPUESTO_DEPARTAMENTAL), RESULTADO_INVALIDO con `campo` (ruta del
            cuerpo, p. ej. `version`, `resultado`, `resultado.proveedor`, `resultado.fuentes[0].valor`, `personas`,
            `personas[0].resultado.licencias[1].categoria`) o PERSONA_NO_EN_ERROR con `campo` = `personas[i].persona_id` (la persona
            no está en ERROR en la celda: las que respondieron por API no se llenan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
              example: { code: RESULTADO_INVALIDO, error: "El campo «proveedor» no existe en el esquema de esta fuente.", campo: resultado.proveedor }

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/vehiculos/{vid}/dictamen:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote de la compañía indicada.
        schema: { type: string, format: uuid }
      - name: vid
        in: path
        required: true
        description: Id del vehículo de ese lote.
        schema: { type: string, format: uuid }
      - name: empresa
        in: query
        required: true
        description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
        schema: { type: string, format: uuid }
    get:
      tags: [Backoffice]
      operationId: obtenerDictamenVehiculoBackoffice
      summary: Dictamen vigente de un vehículo (backoffice FLIT)
      description: >
        Corte 7. Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y empresa explícita en
        ?empresa= (la lectura queda en diagnostico.lecturas_backoffice antes de tocar la fila). El mismo cuerpo que la
        compañía más analisis_override, usuario_override_id (uuid, sin nombre) y override_en. Sin lease, intentos ni texto
        de cola. Un usuario de la compañía recibe 403.
      responses:
        "200":
          description: Dictamen vigente, con los tres campos de override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictamenVehiculoBackoffice"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de configuración del backoffice (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO si el lote o el vehículo no son de la compañía indicada. `code` = SIN_DICTAMEN si no
            hay fila vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice]
      operationId: corregirDictamenVehiculoBackoffice
      summary: Reemplazar el veredicto del dictamen vigente (backoffice FLIT)
      description: >
        Corte 7. La misma política del GET, además la política de operación FLIT diagnostico.backoffice.operacion (compañía FLIT con diagnostico.backoffice.ver o SuperAdmin de FLIT; un SuperAdmin de otra compañía recibe 403) y
        diagnostico.dictamen.override. El admin de la compañía recibe 403.
        No vuelve a evaluar ni redacta. El veredicto nuevo es el del cuerpo. Los alertamientos conservan codigo, efecto
        y fuente, en el mismo orden; el texto vuelve a la plantilla del catálogo del tipo de trámite (si esa fila no está,
        se conserva el texto guardado). Nace otra versión (la anterior queda vigente=false), con analisis_override, el sub
        y la fecha del reloj. La redacción queda PENDIENTE para que la cola explique el veredicto nuevo. No genera PDF ni
        toca el Excel o el ZIP. Publica diagnostico.dictamen.emitido con override=true en la misma transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuerpoOverrideDictamen"
            example: { veredicto: BLOQUEADO, confirmado: true }
      responses:
        "200":
          description: Dictamen nuevo, con los tres campos de override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictamenVehiculoBackoffice"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se escribe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de operación FLIT (también un SuperAdmin de otra compañía) o le falta diagnostico.dictamen.override. No se escribe.
        "404":
          description: "`code` = NO_ENCONTRADO o SIN_DICTAMEN. No se escribe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            Nada cambia. `code` = VEREDICTO_SIN_CAMBIO si el veredicto pedido es el de la vigente.
            `code` = DICTAMEN_EN_CONFLICTO si dos overrides chocan en ux_dictamen_version o ux_dictamen_vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Nada cambia. `code` = CONFIRMADO_REQUERIDO si confirmado no es true. `code` = VEREDICTO_INVALIDO si el
            veredicto no es VIABLE ni BLOQUEADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/diagnosticos:
    get:
      tags: [Backoffice]
      operationId: listarDiagnosticosBackoffice
      summary: Lotes de una compañía para el backoffice FLIT
      description: >
        HU #13799 (F06-H2, F06-C6). Política diagnostico.backoffice de configuración (SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT):
        el rol backoffice_diagnostico en una compañía que no es FLIT, o el admin de la compañía, reciben 403 sin cuerpo.
        Empresa explícita en ?empresa= (nunca la del token); la lectura queda en diagnostico.lecturas_backoffice con el
        usuario, la empresa consultada, la ruta y la fecha, antes de leer. Solo lotes de esa compañía, del más reciente
        al más antiguo (creado_en, id), paginados. `celdas_en_error` = celdas del lote en estado ERROR.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          description: Filtra por estado del lote.
          schema:
            $ref: "#/components/schemas/EstadoDiagnostico"
        - name: con_errores
          in: query
          required: false
          description: true = solo lotes con al menos una celda en ERROR; false = solo lotes sin ERROR; sin él, todos.
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
      responses:
        "200":
          description: Página de lotes de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDiagnosticosBackoffice"
        "400":
          description: >
            `code` = EMPRESA_REQUERIDA (falta ?empresa= o no es válido; no se audita), ESTADO_INVALIDO (`campo` = estado)
            o PAGINACION_INVALIDA (`campo` = pagina o tamano). Un con_errores que no es booleano también responde 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice (sin cuerpo); token sin compañía (`code` = SIN_EMPRESA) o sin usuario
            (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/grilla:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerGrillaDiagnosticoBackoffice
      summary: Grilla de un lote de una compañía con el origen de cada celda (backoffice FLIT)
      description: >
        HU #13799 (F06-H2, F06-C5/C6). Misma política y empresa explícita que listarDiagnosticosBackoffice (la lectura
        queda auditada). Es la grilla de obtenerGrillaDiagnostico (misma semántica de `desde`/`version`, columnas, avance
        y estimado_consultas) más `empresa` y, en cada celda, `origen` y `usuario_manual_id`. Sin payload ni documentos
        en claro: cada fila lleva, como la de la compañía, `documento_declarado` y `propietarios` enmascarados (HU #14087).
        No aplica la visibilidad_usuario de la compañía. El DTO de la compañía no cambia.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: Versión del tablero que ya tiene el cliente (0 o mayor; por defecto 0 = todo).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Grilla del lote con el origen de cada celda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillaBackoffice"
              example:
                empresa: 7b1f0c2e-6d1a-4c55-9a43-2f6f0d1b9e10
                id: 0199f3a1-1111-7000-8000-000000000001
                nombre: Lote octubre
                estado: COMPLETADO
                version: 14
                desde: 0
                columnas: { por_vehiculo: [RUNT, SIMIT_VEHICULO], por_propietario: [], por_locatario: [] }
                avance: { vehiculos: 1, terminados: 1 }
                vehiculos:
                  - id: 0199f3a1-2222-7000-8000-000000000002
                    orden: 1
                    identificador: TST611
                    tipo_identificador: PLACA_CARRO
                    placa: TST611
                    vin: null
                    terminado: true
                    celdas:
                      - { id: 0199f3a1-3333-7000-8000-000000000003, fuente: RUNT, estado: COMPLETADO, motivo_na: null, tipo_error: null, dato_obtenido_en: "2026-10-22T15:00:00+00:00", reutilizada: false, version: 1, origen: API, usuario_manual_id: null }
                      - { id: 0199f3a1-4444-7000-8000-000000000004, fuente: SIMIT_VEHICULO, estado: COMPLETADO, motivo_na: null, tipo_error: null, dato_obtenido_en: "2026-10-22T15:10:00+00:00", reutilizada: false, version: 14, origen: MANUAL, usuario_manual_id: 0199f3a1-5555-7000-8000-000000000005 }
        "400":
          description: "`code` = EMPRESA_REQUERIDA (no se audita) o DESDE_INVALIDO (`campo` = desde)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de configuración del backoffice (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/historial:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerHistorialDiagnosticoBackoffice
      summary: Historial real de un lote de una compañía (backoffice FLIT)
      description: >
        HU #13799 (F06-H2, F06-C5, decisión Q5). Política diagnostico.backoffice y además diagnostico.auditoria.ver.
        Empresa explícita en ?empresa= (la lectura queda auditada). A diferencia de obtenerHistorialDiagnostico (vista de
        la compañía, donde MANUAL llega como AUTO y sin usuario), aquí el disparador y el usuario son los reales.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado actual y transiciones reales del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialLoteBackoffice"
              example:
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                estado: COMPLETADO
                transiciones:
                  - { estado_anterior: INCOMPLETO, estado_nuevo: COMPLETADO, disparador: MANUAL, usuario_id: 0199f3a1-5555-7000-8000-000000000005, en: "2026-10-22T15:10:00+00:00" }
        "400":
          description: "`code` = EMPRESA_REQUERIDA (no se audita)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No cumple la política de configuración del backoffice o le falta diagnostico.auditoria.ver (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/resumen:
    get:
      tags: [Backoffice]
      operationId: obtenerResumenEmpresaBackoffice
      summary: Resumen de una compañía cliente para el backoffice FLIT
      description: >
        Ruta mínima de D0 (HU #13728): si la compañía indicada tiene configuración y cuántos diagnósticos y
        vehículos tiene. Política diagnostico.backoffice de configuración: pasa un SuperAdmin de cualquier compañía
        (ajustes 2026-11-11, punto 1) o un usuario con el permiso diagnostico.backoffice.ver y el claim
        tenant_type=FLIT del token; con el rol backoffice_diagnostico en una compañía que no es FLIT (sin SuperAdmin),
        o en la compañía FLIT sin el permiso, responde 403, igual que cualquier otra ruta
        /backoffice/* (también una que no existe). La compañía nunca sale del token: se indica en ?empresa=
        (o en el segmento {empresa} de las rutas que lo lleven; si llegan los dos deben coincidir). Cada
        lectura queda en diagnostico.lecturas_backoffice con el usuario, la empresa consultada, la ruta y la
        fecha, antes de leer. Sin empresa válida responde 400 y no se audita.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía a consultar (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen de la compañía indicada (solo sus datos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenEmpresaBackoffice"
        "400":
          description: Falta ?empresa=, no es un uuid, es cero, llega repetido o no coincide con la ruta (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No cumple la política de configuración del backoffice (sin SuperAdmin: falta el permiso o tenant_type no es FLIT; sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Sin sesión, token inválido o de otro producto.

  schemas:
    Sesion:
      type: object
      required: [usuario, empresa, roles, permisos, capacidades]
      properties:
        usuario:
          type: object
          required: [id, email, esSuperAdmin]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            esSuperAdmin:
              type: boolean
        empresa:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Claim tenant_id del token.
            nombre:
              type: string
              nullable: true
            tipo:
              type: string
              nullable: true
              description: Claim tenant_type (FLIT para la compañía FLIT).
        roles:
          type: array
          description: Códigos de rol del token (claim role_code).
          items:
            type: string
          example: [usuario_diagnostico]
        permisos:
          type: array
          description: Slugs diagnostico.* que tiene el usuario.
          items:
            type: string
          example: [diagnostico.diagnosticos.crear, diagnostico.diagnosticos.ver]
        capacidades:
          $ref: "#/components/schemas/Capacidades"

    Capacidades:
      type: object
      description: >
        Ayuda para armar el menú; cada endpoint vuelve a exigir su permiso. Backoffice (ajustes 2026-11-11, punto 1):
        backoffice, editarContrato y verAuditoria siguen la política de configuración (SuperAdmin de cualquier
        compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) junto con su permiso; backofficeOperacion,
        llenarConsultas y corregirDictamen, la de operación FLIT (compañía FLIT con el permiso o SuperAdmin de FLIT);
        verVolumetria exige tenant_type=FLIT.
      required:
        - crearDiagnosticos
        - verDiagnosticos
        - descargarReportes
        - derivar
        - verConfiguracion
        - editarConfiguracion
        - reprocesarConsultas
        - backoffice
        - editarContrato
        - llenarConsultas
        - corregirDictamen
        - verAuditoria
        - verVolumetria
        - backofficeOperacion
      properties:
        crearDiagnosticos:
          type: boolean
        verDiagnosticos:
          type: boolean
        descargarReportes:
          type: boolean
        derivar:
          type: boolean
        verConfiguracion:
          type: boolean
        editarConfiguracion:
          type: boolean
        reprocesarConsultas:
          type: boolean
        backoffice:
          type: boolean
        editarContrato:
          type: boolean
        llenarConsultas:
          type: boolean
        corregirDictamen:
          type: boolean
        verAuditoria:
          type: boolean
        verVolumetria:
          type: boolean
        backofficeOperacion:
          type: boolean
          description: >
            Override del dictamen y llenado manual del backoffice (política de operación FLIT). Un SuperAdmin de una
            compañía que no es FLIT tiene backoffice=true y backofficeOperacion=false.

    ResumenEmpresaBackoffice:
      type: object
      required: [empresa, configuracion, diagnosticos, vehiculos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía indicada en ?empresa=.
        configuracion:
          type: boolean
          description: La compañía ya tiene fila en configuracion_empresa.
        diagnosticos:
          type: integer
          format: int32
          minimum: 0
        vehiculos:
          type: integer
          format: int32
          minimum: 0

    IntentosConsulta:
      type: object
      required: [consulta, intentos]
      properties:
        consulta:
          type: string
          format: uuid
        intentos:
          type: array
          items:
            $ref: "#/components/schemas/IntentoConsulta"

    IntentoConsulta:
      type: object
      required: [id, fuente, servicio, identificador, disparador, inicio, fin, estado, tipo_error, mensaje_error, transaccion_proveedor_id, desde_cache, usuario_id]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        servicio:
          type: string
          nullable: true
          enum: [VERIFIK, KYVERUM, INTEMPO, SMARTCLOUD, FASECOLDA, MERCADOLIBRE, BASEGRAVABLE, SCRAPING, FLITFINES, OTRO, null]
          description: Proveedor que respondió; null si no llegó a ninguno.
        identificador:
          type: string
          nullable: true
          maxLength: 17
          description: >
            Placa o VIN consultado; null si la consulta es por persona (nunca un documento). Las celdas de persona
            (HU #13792, #13794) dejan un intento por cada persona consultada.
        disparador:
          type: string
          enum: [AUTO, REPROCESO, MANUAL]
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        estado:
          type: string
          enum: [SUCCESS, ERROR]
        tipo_error:
          type: string
          nullable: true
          description: >
            Código del error (null si SUCCESS). Transitorios, que se reintentan con backoff 5 s × 2^(n−1) hasta
            Diagnostico:Consultas:MaxReintentos ∈ [0, 3] (por defecto 1): TIMEOUT, RED, HTTP_5XX, LIMITE_PROVEEDOR (el
            proveedor respondió 429). Definitivos: RESPUESTA_INVALIDA, AUTENTICACION (también credencial del proveedor
            rechazada, 401/403: error de configuración), ESTADO_NO_OK (también solicitud rechazada por el proveedor, 400/422),
            NO_CONECTADO y cualquier otro.
        mensaje_error:
          type: string
          nullable: true
        transaccion_proveedor_id:
          type: string
          nullable: true
        desde_cache:
          type: boolean
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Usuario del reproceso o del llenado manual; null si fue el procesador.

    Fuente:
      type: string
      enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    FuenteConfigurable:
      type: string
      description: Valor del enum Fuente salvo RUNT, que no se configura en el catálogo de fuentes obligatorias.
      enum: [RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    DefinicionFuentesObligatorias:
      type: object
      required: [familia, tipo_tramite_codigo, fuentes, tipo_tramite_etiqueta, familia_etiqueta]
      description: >
        Una definición del catálogo global. familia y tipo_tramite_codigo son excluyentes; la que no aplica es null.
        fuentes vacío con la definición presente es la lista vacía explícita. tipo_tramite_etiqueta y familia_etiqueta
        (punto 5, 2026-11-11) son los nombres que se muestran: el del tipo es el que publica Trámites y, si no responde o el
        tipo no está publicado, el respaldo del servicio; null cuando su código es null.
      properties:
        familia:
          type: string
          nullable: true
          example: TRASPASO
        tipo_tramite_codigo:
          type: string
          nullable: true
          example: TRASPASO_STANDARD
        fuentes:
          type: array
          items:
            $ref: "#/components/schemas/FuenteConfigurable"
        tipo_tramite_etiqueta:
          type: string
          nullable: true
          example: Traspaso
        familia_etiqueta:
          type: string
          nullable: true
          example: Traspaso
      example:
        familia: null
        tipo_tramite_codigo: TRASPASO_STANDARD
        fuentes: [SIMIT_PROPIETARIO]
        tipo_tramite_etiqueta: Traspaso
        familia_etiqueta: null

    ListaDefinicionesFuentesObligatorias:
      type: object
      required: [definiciones]
      properties:
        definiciones:
          type: array
          items:
            $ref: "#/components/schemas/DefinicionFuentesObligatorias"

    VisibilidadUsuario:
      type: string
      enum: [PROPIOS, EMPRESA]

    EstimadoConsultas:
      type: string
      enum: [NO_MOSTRAR, ANTES_DE_LANZAR, AL_FINALIZAR]

    FuentesDisponibles:
      type: array
      description: >
        Fuentes que hoy se pueden habilitar en el contrato y pedir en un diagnóstico (HU #13863, F09-C8), en el orden
        del enum Fuente. Se calcula con la misma regla del 422 FUENTE_NO_DISPONIBLE: la fuente tiene ejecutor y su
        adaptador no es el no conectado; para IMPUESTO_DEPARTAMENTAL además la bandera
        Diagnostico:Fuentes:ImpuestoDisponible en true y al menos un departamento soportado en la réplica
        departamentos_impuesto (Q5). No depende de la compañía: una fuente habilitada que dejó de estar disponible
        sigue en fuentes_habilitadas pero no aparece aquí (pedirla responde 422).
      items:
        $ref: "#/components/schemas/Fuente"
      example: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO]

    Configuracion:
      type: object
      required: [empresa, contrato, operacion, fuentes_disponibles]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía del token.
        contrato:
          type: object
          required: [solo_lectura, fuentes_habilitadas, limite_vehiculos_lote, actualizado_en]
          properties:
            solo_lectura:
              type: boolean
              description: Siempre true para la compañía; el contrato lo edita el backoffice FLIT.
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        operacion:
          type: object
          required: [visibilidad_usuario, fuentes_por_defecto, estimado_consultas, actualizado_por, actualizado_en]
          properties:
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              description: Subconjunto de contrato.fuentes_habilitadas.
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
            actualizado_por:
              type: string
              format: uuid
              nullable: true
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        fuentes_disponibles:
          $ref: "#/components/schemas/FuentesDisponibles"
      example:
        empresa: 3f1c2b9e-0d4a-4c1e-9a77-2b5d8e6f1a10
        contrato:
          solo_lectura: true
          fuentes_habilitadas: [RUNT, AVALUO, IMPUESTO_DEPARTAMENTAL]
          limite_vehiculos_lote: 500
          actualizado_en: "2026-10-22T14:00:00Z"
        operacion:
          visibilidad_usuario: EMPRESA
          fuentes_por_defecto: [RUNT]
          estimado_consultas: NO_MOSTRAR
          actualizado_por: null
          actualizado_en: null
        fuentes_disponibles: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO]

    EdicionOperativa:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        visibilidad_usuario:
          $ref: "#/components/schemas/VisibilidadUsuario"
        fuentes_por_defecto:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        estimado_consultas:
          $ref: "#/components/schemas/EstimadoConsultas"
      example:
        visibilidad_usuario: PROPIOS
        estimado_consultas: ANTES_DE_LANZAR

    EmpresaBackoffice:
      type: object
      description: Una empresa con Diagnóstico encendido, según Identidad (HU #13741).
      required: [id, nombre, nit]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        nit:
          type: string
          nullable: true
          description: NIT tal como lo tiene Identidad; null si no lo informa.
      example:
        id: 3f2a9c1e-0000-4000-8000-000000000001
        nombre: Empresa Ficticia SAS
        nit: "900000001"

    ContratoBackoffice:
      type: object
      required: [empresa, fuentes_habilitadas, limite_vehiculos_lote, redaccion_ia_suspendida, fuentes_por_defecto, actualizado_por, actualizado_en, fuentes_disponibles]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía de la ruta.
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
          description: Interruptor de emergencia de la redacción IA (R-2). Solo lo ve el backoffice.
        fuentes_por_defecto:
          type: array
          description: Solo lectura aquí (las edita el admin de la compañía); se recortan al reducir las habilitadas.
          items:
            $ref: "#/components/schemas/Fuente"
        actualizado_por:
          type: string
          format: uuid
          nullable: true
          description: Usuario del backoffice del último cambio contractual.
        actualizado_en:
          type: string
          format: date-time
          nullable: true
        fuentes_disponibles:
          $ref: "#/components/schemas/FuentesDisponibles"
      example:
        empresa: 3f1c2b9e-0d4a-4c1e-9a77-2b5d8e6f1a10
        fuentes_habilitadas: [RUNT, AVALUO]
        limite_vehiculos_lote: 500
        redaccion_ia_suspendida: false
        fuentes_por_defecto: [RUNT]
        actualizado_por: 7a0e5d3c-1b2f-4e8a-9c6d-5f4e3d2c1b0a
        actualizado_en: "2026-10-22T14:00:00Z"
        fuentes_disponibles: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO]

    EdicionContrato:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
      example:
        limite_vehiculos_lote: 200

    TiposTramite:
      type: object
      required: [tipos]
      properties:
        tipos:
          type: array
          items:
            $ref: "#/components/schemas/TipoTramite"

    TipoTramite:
      type: object
      required: [codigo, nombre, familia, fuentesObligatorias]
      properties:
        codigo:
          type: string
          description: Código estable del tipo en Trámites.
          example: TRASPASO_STANDARD
        nombre:
          type: string
          example: TRASPASO
        familia:
          type: string
          description: MATRICULAS, TRASPASO u OTROS.
          example: TRASPASO
        fuentesObligatorias:
          type: array
          description: >
            Fuentes que el tipo exige en el alcance. Sale del catálogo global de FLIT (ADR-0078): la cabecera del
            tipo, aunque no tenga líneas; si no hay cabecera de tipo, la de su familia; si tampoco, vacío. No llega
            vacío por defecto. Con la semilla, TRASPASO_STANDARD y TRASPASO_TRANSFERENCIA_DE_DOMINIO incluyen
            SIMIT_PROPIETARIO, y TRASPASO_UNILATERAL queda vacío. RUNT no forma parte de esta lista.
          items:
            $ref: "#/components/schemas/FuenteConfigurable"

    ModoDiagnostico:
      type: string
      enum: [SIMPLE, CON_ANALISIS]

    EstadoDiagnostico:
      type: string
      enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO]

    Alcance:
      type: object
      description: >
        Fuentes en sus tres grupos (R-24). por_vehiculo: RUNT, SIMIT_VEHICULO, AVALUO, IMPUESTO_DEPARTAMENTAL;
        por_propietario: RUNT_PROPIETARIO, SIMIT_PROPIETARIO; por_locatario: RUNT_LOCATARIO, SIMIT_LOCATARIO. Una fuente
        en un grupo que no es el suyo responde 422 FUENTE_EN_GRUPO_AJENO. RUNT siempre. Un grupo ausente equivale a vacío.
      properties:
        por_vehiculo:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_propietario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_locatario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"

    CabeceraEntrada:
      type: object
      required: [nombre, modo, alcance]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS (código de GET /tipos-tramite); se descarta con SIMPLE.
          example: TRASPASO_STANDARD
        alcance:
          $ref: "#/components/schemas/Alcance"
      example:
        nombre: Flota norte
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT, SIMIT_VEHICULO]
          por_propietario: [RUNT_PROPIETARIO]
          por_locatario: []

    Diagnostico:
      type: object
      required: [id, nombre, modo, tipo_tramite_codigo, es_express, estado, alcance, configuracion, usuario_creador_id, creado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        alcance:
          $ref: "#/components/schemas/Alcance"
        configuracion:
          type: object
          description: Copia inmutable de la configuración de la compañía al crear (sin redaccion_ia_suspendida).
          required: [fuentes_habilitadas, limite_vehiculos_lote, visibilidad_usuario, fuentes_por_defecto, estimado_consultas]
          properties:
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
        usuario_creador_id:
          type: string
          format: uuid
        creado_en:
          type: string
          format: date-time

    ResumenValidacion:
      type: object
      required: [total_filas, validos, erroneos, duplicados, puede_continuar, limite_vehiculos_lote, supera_limite, avisos, filas]
      properties:
        total_filas:
          type: integer
          description: Filas de datos no vacías del archivo.
        validos:
          type: integer
        erroneos:
          type: integer
        duplicados:
          type: integer
          description: Repeticiones de un identificador válido ya presente (consolidadas en su primera fila).
        puede_continuar:
          type: boolean
          description: false sin válidos o con más válidos que el límite por lote.
        limite_vehiculos_lote:
          type: integer
          description: Límite de la copia de configuración de la cabecera.
        supera_limite:
          type: boolean
        avisos:
          type: array
          items:
            $ref: "#/components/schemas/AvisoCarga"
        filas:
          type: array
          description: Una por fila leída, salvo los duplicados consolidados, en el orden del archivo.
          items:
            $ref: "#/components/schemas/FilaResumen"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración; en otro caso no viene.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    AvisoCarga:
      type: object
      required: [code, mensaje]
      properties:
        code:
          type: string
          enum: [SIN_VALIDOS, LIMITE_SUPERADO]
        mensaje:
          type: string

    FilaResumen:
      type: object
      required: [fila, identificador, identificador_norm, tipo_identificador, tipo_documento_locatario, documento_locatario, valida, filas_duplicadas, errores]
      properties:
        fila:
          type: integer
          description: Número de fila de la hoja o del CSV (el encabezado es la 1).
        identificador:
          type: string
          description: Tal como vino en el archivo.
        identificador_norm:
          type: string
          description: Normalizado con la regla de Trámites; si es demasiado largo, el valor limpio sin recortar.
        tipo_identificador:
          type: string
          nullable: true
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, PLACA_MOTOCARRO, VIN, null]
        tipo_documento_locatario:
          type: string
          nullable: true
          example: CC
        documento_locatario:
          type: string
          nullable: true
          description: Siempre enmascarado.
          example: "****4050"
        valida:
          type: boolean
        filas_duplicadas:
          type: array
          items:
            type: integer
        errores:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFila"

    ErrorFila:
      type: object
      required: [campo, code, mensaje]
      properties:
        campo:
          type: string
          enum: [Identificador_Vehiculo, Tipo_Documento_Locatario, Documento_Locatario]
        code:
          type: string
          enum: [IDENTIFICADOR_REQUERIDO, IDENTIFICADOR_INVALIDO, IDENTIFICADOR_DEMASIADO_LARGO, TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO]
        mensaje:
          type: string

    EstimadoFuente:
      type: object
      description: >-
        Consultas previstas de una fuente del alcance (HU #13747). Lo usan el resumen de carga, la confirmación de
        vehículos, Express y la vista previa de Express. Las fuentes de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO,
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO) consultan una vez por persona, que antes de lanzar aún no se conocen: su
        número es un mínimo de uno por vehículo (locatario, uno por vehículo con documento declarado) y llevan
        `minimo=true`, para rotularlo «al menos N» (HU #13796, Q7).
      required: [fuente, consultas, minimo]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        consultas:
          type: integer
        minimo:
          type: boolean
          description: >-
            true si `consultas` es un mínimo («al menos N»): fuente de persona con algún vehículo válido cuyas personas
            aún no se conocen. Siempre false en las fuentes del vehículo y en un lote sin vehículos válidos.
      example: { fuente: SIMIT_PROPIETARIO, consultas: 10, minimo: true }

    FilaCapturada:
      type: object
      description: Una fila capturada (HU #13751). El documento del locatario es opcional; si viene, tipo y número juntos.
      properties:
        fila:
          type: integer
          description: Número de fila del archivo (para el resumen de validar-filas).
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número del documento; se guarda cifrado y nunca vuelve en claro."

    FilasAValidar:
      type: object
      properties:
        filas:
          type: array
          items:
            $ref: "#/components/schemas/FilaCapturada"

    ConfirmacionVehiculos:
      type: object
      description: Multipart de POST /diagnosticos/{id}/vehiculos (HU #13751, «Reenviar el archivo»).
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: "@pii:high El MISMO .xlsx o .csv enviado a POST /diagnosticos/{id}/carga."
        correcciones:
          type: string
          description: >
            JSON (texto del campo del formulario) con una lista de CorreccionFila; vacío o ausente es sin correcciones.
            Ejemplo: [{"fila": 2, "identificador": "ABC123"}, {"fila": 5, "tipo_documento_locatario": "CC", "documento_locatario": "1020304050"}]

    CorreccionFila:
      type: object
      description: >
        Corrección de una fila del archivo (va dentro del JSON de `correcciones`). `fila` es el número de fila del análisis
        (encabezado en la fila 1). Un campo ausente conserva el valor del archivo; con null o vacío lo deja vacío. No envíe
        el documento enmascarado del análisis («****…»): es inválido y la fila se descarta; omita el campo para conservar
        el del archivo.
      required: [fila]
      properties:
        fila:
          type: integer
        identificador:
          type: string
          nullable: true
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número completo del documento; se guarda cifrado y nunca vuelve en claro."

    ResultadoConfirmacion:
      type: object
      required: [diagnostico_id, confirmados, invalidos, duplicados, limite_vehiculos_lote, vehiculos]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        confirmados:
          type: integer
        invalidos:
          type: integer
          description: Vehículos descartados por identificador o documento inválido.
        duplicados:
          type: integer
          description: Vehículos descartados por repetir un identificador válido anterior.
        limite_vehiculos_lote:
          type: integer
        vehiculos:
          type: array
          items:
            $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    VehiculoConfirmado:
      type: object
      required: [id, orden, identificador, identificador_norm, tipo_identificador]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
        identificador_norm:
          type: string
        tipo_identificador:
          type: string
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, PLACA_MOTOCARRO, VIN]
        tipo_documento_locatario:
          type: string
          nullable: true
        documento_locatario:
          type: string
          nullable: true
          description: Enmascarado («****» y los 4 últimos).

    ExpressEntrada:
      type: object
      description: >
        Cuerpo de POST /express y POST /express/estimado (HU #13753): la cabecera como en CabeceraEntrada, pero con el
        nombre opcional, y el único vehículo con el documento del locatario opcional (tipo y número juntos).
      required: [modo, alcance, identificador]
      properties:
        nombre:
          type: string
          nullable: true
          maxLength: 150
          description: Vacío o ausente se autogenera «Express IDENTIFICADOR» (sin fecha, HU #14087).
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS; se descarta con SIMPLE.
        alcance:
          $ref: "#/components/schemas/Alcance"
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número del documento; se guarda cifrado y nunca vuelve en claro."
      example:
        identificador: ABC123
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT]
          por_propietario: []
          por_locatario: []

    ExpressCreado:
      type: object
      required: [id, nombre, modo, es_express, estado, creado_en, vehiculo]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        creado_en:
          type: string
          format: date-time
        vehiculo:
          $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    EstimadoExpress:
      type: object
      required: [mostrar_estimado]
      properties:
        mostrar_estimado:
          type: boolean
          description: Verdadero con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de la compañía.
        estimado_consultas:
          type: array
          description: Solo cuando mostrar_estimado es verdadero.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    Grilla:
      type: object
      required: [id, nombre, estado, estado_etiqueta, version, desde, columnas, avance, vehiculos]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo de negocio del estado del lote (Sin lanzar, En proceso, Completado, Incompleto); el código sigue en estado.
          example: En proceso
        version:
          type: integer
          format: int64
          description: Versión actual del tablero; el cliente la manda como `desde` en el siguiente sondeo.
        desde:
          type: integer
          format: int64
          description: La versión pedida (eco).
        columnas:
          $ref: "#/components/schemas/Alcance"
        avance:
          $ref: "#/components/schemas/AvanceLote"
        vehiculos:
          type: array
          description: Solo los vehículos con celdas cambiadas desde `desde` (todos con desde=0), en el orden del lote.
          items:
            $ref: "#/components/schemas/FilaVehiculo"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas=AL_FINALIZAR y el lote COMPLETADO o INCOMPLETO; si no, la clave no viene.
          items:
            $ref: "#/components/schemas/EstimadoVsConsumido"
        total_pegadas:
          type: integer
          minimum: 0
          description: >
            Ajuste 2026-11-11 (Punto 3). Grilla de la compañía (no la de backoffice): placas del lote con alguna consulta pegada
            (ERROR, o PENDIENTE/EN_CURSO sin cambio hace más de 10 min; con la RUNT sin completar cuenta solo la RUNT). Viene
            siempre, también en el sondeo incremental (una placa se pega sin que cambie ninguna celda). Es la N de
            «Reintentar pegadas (N)».
        vehiculos_pegados:
          type: array
          description: Punto 3. Ids de las placas pegadas (las de total_pegadas), en el orden del lote; siempre presente.
          items:
            type: string
            format: uuid

    AvanceLote:
      type: object
      required: [vehiculos, terminados]
      properties:
        vehiculos:
          type: integer
          description: Vehículos del lote.
        terminados:
          type: integer
          description: Vehículos con todas sus celdas en COMPLETADO o NA (R-7).

    FilaVehiculo:
      type: object
      required: [id, orden, identificador, tipo_identificador, tipo_identificador_etiqueta, placa, vin, terminado, celdas, documento_declarado, propietarios]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
          description: Placa o VIN normalizado.
        tipo_identificador:
          type: string
          example: PLACA_CARRO
        tipo_identificador_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo del tipo de identificador (Placa de carro, Placa de moto, Placa de remolque, Placa de maquinaria, Placa de motocarro, VIN).
          example: Placa de carro
        placa:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        terminado:
          type: boolean
          description: Todas sus celdas (no solo las de esta respuesta) en COMPLETADO o NA.
        celdas:
          type: array
          description: Solo las celdas cambiadas desde `desde`, en el orden del alcance.
          items:
            $ref: "#/components/schemas/CeldaGrilla"
        documento_declarado:
          allOf:
            - $ref: "#/components/schemas/DocumentoDeclaradoGrilla"
          nullable: true
          description: >
            HU #14087. El documento que declaró el cliente para el vehículo (hoy el locatario de la captura masiva o
            Express); null si no declaró ninguno. Es el origen del documento, no el de la celda (que sigue sin viajar, R-20).
        propietarios:
          type: array
          description: >
            HU #14087. Los propietarios que trajo el RUNT, en su orden; siempre presente, vacío mientras el RUNT no
            los registre. Solo tipo y número enmascarado.
          items:
            $ref: "#/components/schemas/PropietarioGrilla"
        pegada:
          type: boolean
          description: >
            Ajuste 2026-11-11 (Punto 3). Grilla de la compañía (no la de backoffice): la placa tiene alguna consulta que
            «Reintentar placa» reencolaría. Solo viaja en las filas de la respuesta; para las que no viajan, usar
            vehiculos_pegados del lote.
        derivacion:
          allOf:
            - $ref: "#/components/schemas/DerivacionFila"
          nullable: true
          description: >
            Punto 4 (ADR-0084). Crear trámite de la fila; null con Diagnostico:Derivacion:Habilitada=false. Solo viaja en las
            filas de la respuesta (en el sondeo incremental, las que cambiaron celdas): tras crear el trámite, el cliente
            actualiza la fila con la respuesta del POST.

    DerivacionFila:
      type: object
      required: [elegible, motivo_no_elegible, estado, tramite]
      properties:
        elegible:
          type: boolean
          description: Se puede crear el trámite ahora (misma regla que revalida el POST).
        motivo_no_elegible:
          type: string
          nullable: true
          enum: [NO_TERMINADO, NO_VIABLE, YA_TIENE_TRAMITE, EN_CURSO, null]
          description: Null si es elegible. En orden de prioridad YA_TIENE_TRAMITE, EN_CURSO, NO_TERMINADO, NO_VIABLE.
        estado:
          type: string
          nullable: true
          enum: [PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO, null]
          description: Estado del último intento del vehículo; null si nunca se intentó. OMITIDO y FALLIDO no impiden volver a intentar.
        tramite:
          allOf:
            - $ref: "#/components/schemas/TramiteFila"
          nullable: true
          description: El borrador creado (Ver trámite #N); null si no hay.

    TramiteFila:
      type: object
      required: [id, numero, url]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          description: reference_number del trámite en Trámites.
          example: TR-000123
        url:
          type: string
          description: >
            Enlace al borrador en Trámites ({Diagnostico:Derivacion:UrlTramites}/tramites/{id}?t={empresa}); relativo
            (/tramites/{id}?t={empresa}) si no hay base configurada.

    CrearTramiteEntrada:
      type: object
      properties:
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio en lotes SIMPLE (código de GET /tipos-tramite); ignorado en CON_ANALISIS.
          example: TRASPASO_STANDARD

    CrearTramitesEntrada:
      type: object
      required: [vehiculo_ids]
      properties:
        vehiculo_ids:
          type: array
          minItems: 1
          maxItems: 5000
          description: Vehículos elegidos del lote, en el orden de la selección (Diagnostico:Derivacion:MaxItemsPorOperacion).
          items:
            type: string
            format: uuid
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio en lotes SIMPLE (código de GET /tipos-tramite); ignorado en CON_ANALISIS.
          example: TRASPASO_STANDARD

    OperacionEncolada:
      type: object
      required: [operacion_id, total, encolados, no_elegibles]
      properties:
        operacion_id:
          type: string
          format: uuid
        total:
          type: integer
          description: Vehículos de la operación (sin repetidos).
        encolados:
          type: integer
          description: Ítems PENDIENTE (los primeros, hasta el crédito de la compañía, ya salieron hacia Trámites).
        no_elegibles:
          type: array
          description: Vehículos que quedaron OMITIDO de inmediato.
          items:
            type: object
            required: [vehiculo_id, motivo_codigo]
            properties:
              vehiculo_id:
                type: string
                format: uuid
              motivo_codigo:
                type: string
                enum: [NO_TERMINADO, NO_VIABLE, YA_TIENE_TRAMITE, EN_CURSO]
      example:
        operacion_id: 0199f3a1-0000-7000-8000-0000000000a1
        total: 3
        encolados: 2
        no_elegibles:
          - { vehiculo_id: 0199f3a1-0000-7000-8000-0000000000b3, motivo_codigo: NO_VIABLE }

    ProgresoOperacion:
      type: object
      required: [operacion_id, tipo, estado, tipo_tramite_codigo, total, creadas, omitidas, fallidas, pendientes, creada_en, terminada_en]
      properties:
        operacion_id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [INDIVIDUAL, MASIVA]
        estado:
          type: string
          enum: [EN_CURSO, TERMINADA]
        tipo_tramite_codigo:
          type: string
        total:
          type: integer
        creadas:
          type: integer
        omitidas:
          type: integer
        fallidas:
          type: integer
        pendientes:
          type: integer
          description: total − creadas − omitidas − fallidas (PENDIENTE y ENVIADO).
        creada_en:
          type: string
          format: date-time
        terminada_en:
          type: string
          format: date-time
          nullable: true

    DetalleOperacionDerivacion:
      allOf:
        - $ref: "#/components/schemas/ProgresoOperacion"
        - type: object
          required: [motivos, pagina, tamano_pagina, total_items, items]
          properties:
            motivos:
              type: array
              description: Ítems OMITIDO y FALLIDO por motivo (resumen «omitidas por motivo»), de más a menos.
              items:
                type: object
                required: [estado, motivo_codigo, motivo, cantidad]
                properties:
                  estado:
                    type: string
                    enum: [OMITIDO, FALLIDO]
                  motivo_codigo:
                    type: string
                  motivo:
                    type: string
                    description: Texto claro, sin datos personales.
                  cantidad:
                    type: integer
            pagina:
              type: integer
            tamano_pagina:
              type: integer
              example: 50
            total_items:
              type: integer
              description: Ítems que cumplen el filtro estado.
            items:
              type: array
              items:
                type: object
                required: [vehiculo_id, orden, placa, estado, motivo_codigo, motivo, tramite_id, tramite_numero, tramite_url]
                properties:
                  vehiculo_id:
                    type: string
                    format: uuid
                  orden:
                    type: integer
                  placa:
                    type: string
                    description: Placa (o VIN, o el identificador cargado).
                  estado:
                    type: string
                    enum: [PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO]
                  motivo_codigo:
                    type: string
                    nullable: true
                  motivo:
                    type: string
                    nullable: true
                  tramite_id:
                    type: string
                    format: uuid
                    nullable: true
                  tramite_numero:
                    type: string
                    nullable: true
                  tramite_url:
                    type: string
                    nullable: true
                    description: Igual que TramiteFila.url.

    ReintentoFallidas:
      type: object
      required: [reencolados, omitidas]
      properties:
        reencolados:
          type: integer
          description: FALLIDO que volvieron a PENDIENTE (el mismo ítem).
        omitidas:
          type: integer
          description: FALLIDO que ya no eran elegibles y quedaron OMITIDO.

    TramiteCreado:
      type: object
      required: [tramite_id, numero, url, ya_existia]
      properties:
        tramite_id:
          type: string
          format: uuid
        numero:
          type: string
          example: TR-000123
        url:
          type: string
          description: Igual que TramiteFila.url.
        ya_existia:
          type: boolean
          description: Trámites ya tenía el borrador de este vehículo (idempotencia por empresa y external_ref).

    ConflictoTramite:
      type: object
      required: [code, error, tramite_id, numero]
      properties:
        code:
          type: string
          example: YA_TIENE_TRAMITE
        error:
          type: string
        tramite_id:
          type: string
          format: uuid
        numero:
          type: string

    NoElegibleDerivacion:
      type: object
      required: [code, error, motivo_codigo, motivo]
      properties:
        code:
          type: string
          example: NO_ELEGIBLE
        error:
          type: string
          description: Igual a motivo.
        motivo_codigo:
          type: string
          example: OT_NO_HABILITADO
        motivo:
          type: string
          example: OT no habilitado para la compañía

    DocumentoDeclaradoGrilla:
      type: object
      description: Documento declarado por el cliente, enmascarado en el servidor («****» + 4 últimos alfanuméricos).
      required: [rol, tipo_documento, documento_enmascarado]
      properties:
        rol:
          type: string
          enum: [PROPIETARIO, LOCATARIO]
        tipo_documento:
          type: string
          example: CC
        documento_enmascarado:
          type: string
          example: "****5678"
          description: Nunca el número en claro; «****» si tiene 4 caracteres o menos o no se puede leer.

    PropietarioGrilla:
      type: object
      description: Un propietario del RUNT, enmascarado en el servidor («****» + 4 últimos alfanuméricos).
      required: [tipo_documento, documento_enmascarado]
      properties:
        tipo_documento:
          type: string
          example: NIT
        documento_enmascarado:
          type: string
          example: "****4567"
          description: Nunca el número en claro.

    CeldaGrilla:
      type: object
      description: Sin origen, usuario manual, payload ni documentos (R-20).
      required: [id, fuente, estado, estado_etiqueta, motivo_na, motivo_na_etiqueta, tipo_error, dato_obtenido_en, reutilizada, version]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA]
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo del estado de la celda (Pendiente, En curso, Completado, Error, No aplica).
          example: No aplica
        motivo_na:
          type: string
          nullable: true
          description: "Solo con estado NA: SERVICIO_PUBLICO, DEPARTAMENTO_NO_SOPORTADO o SIN_DOCUMENTO_LOCATARIO."
        motivo_na_etiqueta:
          type: string
          nullable: true
          description: Punto 5 (2026-11-11). Texto de negocio del motivo de N/A; null cuando motivo_na es null.
          example: "El vehículo es de servicio público: esta consulta no aplica."
        tipo_error:
          type: string
          nullable: true
          description: >
            Solo con estado ERROR: código del tipo de error de la fuente o BLOQUEADA_POR_RUNT. En las celdas de persona
            (RUNT_PROPIETARIO, RUNT_LOCATARIO, HU #13792; SIMIT_PROPIETARIO, SIMIT_LOCATARIO, HU #13794), PERSONAS_CON_ERROR si falló al menos una persona y no todas por
            la misma causa (si fallan todas por la misma, esa causa); lo que sí respondió se conserva. En SIMIT_VEHICULO
            (HU #13793), SIN_PLACA si el vehículo no tiene placa tras el RUNT (definitivo, sin consulta ni consumo). En AVALUO
            (HU #13795), SIN_IDENTIFICADOR si no tiene placa ni VIN tras el RUNT (definitivo); un avalúo sin valor en ninguna
            fuente NO es error: la celda queda COMPLETADO con sin_valor_comercial=true y no se reprocesa.
          example: TIMEOUT
        dato_obtenido_en:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora del dato (D-10); en la reutilizada, la del dato original.
        reutilizada:
          type: boolean
          description: El dato se reutilizó de una consulta del mismo día de la compañía, sin consumo (D-10).
        tiene_deuda:
          type: boolean
          description: >
            Solo IMPUESTO_DEPARTAMENTAL en COMPLETADO cuando la fuente confirmó deuda, con o sin monto.
            Ausente si es false. El semáforo no se pinta en verde.
        version:
          type: integer
          format: int64
          description: Versión del tablero en el último cambio de la celda.

    EstimadoVsConsumido:
      type: object
      required: [fuente, estimadas, consumidas, minimo]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        estimadas:
          type: integer
          description: >-
            Estimado de la fuente (vehículos menos N/A previsibles, HU #13747). En las fuentes de persona, las personas
            registradas del rol en los vehículos del lote (personas_vehiculo, HU #13796).
        consumidas:
          type: integer
          description: >-
            Intentos con desde_cache=false, sin los de llenado manual. En las fuentes de persona hay un intento por
            persona (cada reintento real también consume).
        minimo:
          type: boolean
          description: >-
            true solo si la fuente es de persona y algún vehículo del lote no tiene personas registradas (lote anterior a
            D3 o RUNT sin respuesta): ese vehículo cuenta uno, y el estimado es «al menos N».
      example: { fuente: RUNT_PROPIETARIO, estimadas: 3, consumidas: 3, minimo: false }

    CierrePanel:
      type: object
      required: [id, estado, cerrado_en]
      properties:
        id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        cerrado_en:
          type: string
          format: date-time

    ReprocesoConsulta:
      type: object
      required: [id, diagnostico_id, estado, estado_lote, version]
      properties:
        id:
          type: string
          format: uuid
          description: Id de la celda.
        diagnostico_id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [PENDIENTE]
        estado_lote:
          $ref: "#/components/schemas/EstadoDiagnostico"
        version:
          type: integer
          format: int64
          description: version_tablero del lote tras el reproceso (la celda la lleva para el sondeo ?desde=).

    ReintentoPegadas:
      type: object
      required: [reencoladas]
      properties:
        reencoladas:
          type: integer
          minimum: 0
          description: Celdas que se reencolaron con un trabajo_id nuevo (0 si no había ninguna pegada).

    HistorialLote:
      type: object
      required: [diagnostico_id, estado, transiciones]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        transiciones:
          type: array
          items:
            $ref: "#/components/schemas/TransicionLote"

    TransicionLote:
      type: object
      required: [estado_anterior, estado_nuevo, disparador, usuario_id, en]
      properties:
        estado_anterior:
          type: string
          nullable: true
          description: Null en la creación del lote; si no, CREADO, EN_PROCESO, COMPLETADO o INCOMPLETO.
        estado_nuevo:
          $ref: "#/components/schemas/EstadoDiagnostico"
        disparador:
          type: string
          enum: [AUTO, CIERRE_PANEL, REPROCESO]
          description: El llenado manual (MANUAL) se presenta a la compañía como AUTO (HU #13798, Q5); el backoffice ve el real.
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Usuario que la provocó; null si fue el procesador o el llenado manual.
        en:
          type: string
          format: date-time

    ListaDiagnosticos:
      type: object
      description: Página de lotes de la compañía del token visibles para el usuario (HU #13845).
      required: [pagina, tamano, total, diagnosticos]
      properties:
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          description: Lotes visibles que cumplen los filtros (todas las páginas).
        diagnosticos:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoListado"
      example:
        pagina: 1
        tamano: 10
        total: 2
        diagnosticos:
          - id: 0199f3a1-2222-7000-8000-000000000002
            nombre: Flota octubre
            creado_en: "2026-10-22T14:00:00+00:00"
            modo: CON_ANALISIS
            tipo_tramite: { codigo: TRASPASO_STANDARD, nombre: TRASPASO }
            estado: EN_PROCESO
            usuario_creador: { id: 5f0c7a2e-1b2c-4d3e-8f90-0a1b2c3d4e5f, nombre: Ana Prueba }
            es_express: false
          - id: 0199f3a1-1111-7000-8000-000000000001
            nombre: Lote sin lanzar
            creado_en: "2026-10-21T13:00:00+00:00"
            modo: SIMPLE
            tipo_tramite: null
            estado: CREADO
            usuario_creador: { id: 6a1d8b3f-2c3d-4e5f-9a01-1b2c3d4e5f60, nombre: No disponible }
            es_express: false

    DiagnosticoListado:
      type: object
      required: [id, nombre, creado_en, modo, tipo_tramite, estado, estado_etiqueta, usuario_creador, es_express]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        creado_en:
          type: string
          format: date-time
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite:
          type: object
          nullable: true
          description: null en SIMPLE; el nombre es el código si el tipo ya no está publicado.
          required: [codigo, nombre]
          properties:
            codigo:
              type: string
            nombre:
              type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo de negocio del estado del lote (Sin lanzar, En proceso, Completado, Incompleto); el código sigue en estado.
          example: En proceso
        usuario_creador:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
              description: Nombre visible según Identidad; «No disponible» si no se pudo resolver.
        es_express:
          type: boolean
          description: HU #14087. true si el lote nació del Diagnóstico Express (columna «Modalidad»); false en el masivo.

    ListaDiagnosticosBackoffice:
      type: object
      description: Página de lotes de una compañía para el backoffice FLIT (HU #13799).
      required: [empresa, pagina, tamano, total, diagnosticos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía consultada (eco de ?empresa=).
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          description: Lotes que cumplen los filtros (todas las páginas).
        diagnosticos:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoBackoffice"
      example:
        empresa: 7b1f0c2e-6d1a-4c55-9a43-2f6f0d1b9e10
        pagina: 1
        tamano: 10
        total: 1
        diagnosticos:
          - { id: 0199f3a1-1111-7000-8000-000000000001, nombre: Lote octubre, estado: EN_PROCESO, estado_etiqueta: En proceso, creado_en: "2026-10-22T14:00:00+00:00", vehiculos: 2, celdas_en_error: 2 }

    DiagnosticoBackoffice:
      type: object
      required: [id, nombre, estado, estado_etiqueta, creado_en, vehiculos, celdas_en_error]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        estado_etiqueta:
          type: string
          description: Punto 5 (2026-11-11). Rótulo de negocio del estado del lote (Sin lanzar, En proceso, Completado, Incompleto); el código sigue en estado.
          example: En proceso
        creado_en:
          type: string
          format: date-time
        vehiculos:
          type: integer
          description: Vehículos del lote.
        celdas_en_error:
          type: integer
          description: Celdas del lote en estado ERROR.

    GrillaBackoffice:
      description: Grilla (schema Grilla) más la empresa consultada; las celdas llevan origen y usuario_manual_id (HU #13799).
      allOf:
        - $ref: "#/components/schemas/Grilla"
        - type: object
          required: [empresa, vehiculos]
          properties:
            empresa:
              type: string
              format: uuid
            vehiculos:
              type: array
              items:
                $ref: "#/components/schemas/FilaVehiculoBackoffice"

    FilaVehiculoBackoffice:
      description: FilaVehiculo (documentos enmascarados incluidos, HU #14087) con celdas del backoffice.
      allOf:
        - $ref: "#/components/schemas/FilaVehiculo"
        - type: object
          required: [celdas]
          properties:
            celdas:
              type: array
              items:
                $ref: "#/components/schemas/CeldaGrillaBackoffice"

    CeldaGrillaBackoffice:
      description: CeldaGrilla más el origen del dato y el usuario del llenado manual (solo backoffice, HU #13799).
      allOf:
        - $ref: "#/components/schemas/CeldaGrilla"
        - type: object
          required: [origen, usuario_manual_id]
          properties:
            origen:
              type: string
              nullable: true
              enum: [API, MANUAL]
              description: >
                API = consulta a la fuente (también la reutilizada del mismo día, que se distingue con reutilizada=true);
                MANUAL = llenado del backoffice; null mientras la celda no tiene dato.
            usuario_manual_id:
              type: string
              format: uuid
              nullable: true
              description: Usuario del backoffice que la llenó a mano; null si origen no es MANUAL.

    HistorialLoteBackoffice:
      type: object
      required: [diagnostico_id, estado, transiciones]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        transiciones:
          type: array
          items:
            $ref: "#/components/schemas/TransicionLoteBackoffice"

    TransicionLoteBackoffice:
      type: object
      description: Transición con el disparador y el usuario reales (HU #13799, Q5).
      required: [estado_anterior, estado_nuevo, disparador, usuario_id, en]
      properties:
        estado_anterior:
          type: string
          nullable: true
        estado_nuevo:
          $ref: "#/components/schemas/EstadoDiagnostico"
        disparador:
          type: string
          enum: [AUTO, CIERRE_PANEL, REPROCESO, MANUAL]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Null si fue el procesador (AUTO); MANUAL trae el usuario del backoffice.
        en:
          type: string
          format: date-time

    AlertaDictamen:
      type: object
      additionalProperties: false
      required: [codigo, texto, efecto, fuente, etiqueta, fuente_etiqueta]
      properties:
        codigo: { type: string }
        texto: { type: string }
        efecto: { type: string }
        fuente: { type: string }
        etiqueta:
          type: string
          description: >
            Punto 5 (2026-11-11). Rótulo de negocio de la regla (p. ej. «SOAT no vigente», «Multas del propietario»;
            FUENTE_PENDIENTE da «Consulta pendiente: nombre de la fuente»). Calculado al responder; un código sin rótulo
            da «Novedad sin clasificar», nunca el código.
          example: SOAT no vigente
        fuente_etiqueta:
          type: string
          description: Punto 5. Nombre de la fuente (RUNT, RUNT propietarios, SIMIT vehículo…); sin rótulo, «Novedad sin clasificar».
          example: RUNT

    DictamenVehiculo:
      type: object
      additionalProperties: false
      description: Dictamen vigente que ve la compañía. Sin override, lease, intentos ni empresa.
      required: [version, veredicto, estado_redaccion, alertamientos, catalogo_version, creado_en]
      properties:
        version: { type: integer, minimum: 1 }
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        estado_redaccion: { type: string, enum: [PENDIENTE, COMPLETADA] }
        alertamientos:
          type: array
          items:
            $ref: "#/components/schemas/AlertaDictamen"
        catalogo_version: { type: integer }
        creado_en: { type: string, format: date-time }

    DictamenVehiculoBackoffice:
      type: object
      additionalProperties: false
      description: El de la compañía más los tres campos de override. Sin lease, intentos ni texto de cola.
      required: [version, veredicto, estado_redaccion, alertamientos, catalogo_version, creado_en, analisis_override, usuario_override_id, override_en]
      properties:
        version: { type: integer, minimum: 1 }
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        estado_redaccion: { type: string, enum: [PENDIENTE, COMPLETADA] }
        alertamientos:
          type: array
          items:
            $ref: "#/components/schemas/AlertaDictamen"
        catalogo_version: { type: integer }
        creado_en: { type: string, format: date-time }
        analisis_override: { type: boolean }
        usuario_override_id: { type: string, format: uuid, nullable: true }
        override_en: { type: string, format: date-time, nullable: true }

    CuerpoOverrideDictamen:
      type: object
      additionalProperties: false
      required: [veredicto, confirmado]
      properties:
        veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
        confirmado: { type: boolean, description: Solo true escribe. Cualquier otro valor es 422 CONFIRMADO_REQUERIDO. }

    DetalleCelda:
      type: object
      description: >
        Detalle de una celda (HU #13798). DTO cerrado: sin origen, usuario manual, transacción ni payload en campos
        propios (R-20). Todas las claves van siempre. Desde HU #14087 AC8 (decisión del usuario 2026-10-27, enmienda de
        ADR-0075 en Propuesto) `respuesta_fuente` trae además la respuesta COMPLETA de la fuente, con datos personales.
      required: [id, vehiculo_id, fuente, estado, motivo_na, tipo_error, dato_obtenido_en, reutilizada, resultado, personas, respuesta_fuente, identificador, nombre_diagnostico, respuesta_proveedor]
      properties:
        id:
          type: string
          format: uuid
          description: Id de la celda (el mismo de la grilla).
        identificador:
          type: string
          description: >
            HU #14087 (detalle en pestaña nueva): la placa del vehículo; sin placa, su VIN (y sin ninguno, el identificador
            normalizado de la carga). Para que la página se titule sola.
        nombre_diagnostico:
          type: string
          description: HU #14087 (detalle en pestaña nueva) — nombre del diagnóstico (lote) al que pertenece el vehículo.
        vehiculo_id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA]
        motivo_na:
          type: string
          nullable: true
          description: "Solo con estado NA: SERVICIO_PUBLICO, DEPARTAMENTO_NO_SOPORTADO o SIN_DOCUMENTO_LOCATARIO."
        tipo_error:
          type: string
          nullable: true
          description: >
            Solo con estado ERROR; mismos códigos que CeldaGrilla.tipo_error. El impuesto añade NO_CONFIRMADO,
            MODELO_NO_ACEPTADO, DOCUMENTO_NO_COINCIDE, DOCUMENTO_NO_HOMOLOGADO, VEHICULO_NO_ENCONTRADO,
            VEHICULO_NO_CONSULTABLE, REQUIERE_ACTUALIZACION, SIN_DOCUMENTO, SIN_MODELO, ORGANISMO_INCOMPLETO
            y SIN_NOMBRE_PROPIETARIO.
        dato_parcial:
          type: boolean
          description: >
            Solo impuesto en ERROR cuando la fuente marcó dato parcial. El detalle lo rotula y no muestra el monto.
            Ausente cuando es false. No sale en PDF, Excel ni dictamen.
        dato_obtenido_en:
          type: string
          format: date-time
          nullable: true
        reutilizada:
          type: boolean
        resultado:
          nullable: true
          description: Solo en RUNT, SIMIT_VEHICULO, AVALUO e IMPUESTO_DEPARTAMENTAL con la celda COMPLETADO; el tipo depende de `fuente`.
          oneOf:
            - $ref: "#/components/schemas/ResultadoRuntDetalle"
            - $ref: "#/components/schemas/ResultadoSimitDetalle"
            - $ref: "#/components/schemas/ResultadoAvaluoDetalle"
            - $ref: "#/components/schemas/ResultadoImpuestoDetalle"
        personas:
          type: array
          nullable: true
          description: Solo en las fuentes de persona (null en las demás); una entrada por persona del rol, en orden.
          items:
            $ref: "#/components/schemas/PersonaDetalle"
        respuesta_fuente:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14087 AC8 — la respuesta COMPLETA de la fuente tal como la devolvió core-consultas: el `*Response` del rpc
            en proto-JSON, con los nombres de campo del .proto (snake_case) y los valores por defecto incluidos (false, 0,
            "" y listas vacías). Sin proyección: incluye datos personales (nombres, direcciones, teléfonos, documentos,
            histórico, acreedores, demandantes…) y lo que la fuente agregue. Solo en las fuentes del vehículo (RUNT,
            SIMIT_VEHICULO, AVALUO, IMPUESTO_DEPARTAMENTAL) con la celda COMPLETADO o ERROR; en las de persona va en cada
            `PersonaDetalle`. Null si no hay respuesta guardada (llenado manual, ERROR sin respuesta, celda anterior al
            AC8) o si no se pudo descifrar.
        respuesta_proveedor:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14183 — misma semántica que `PersonaDetalle.respuesta_proveedor`: el texto de
            `respuesta_fuente.resultado.respuesta_cruda.json` parseado como objeto JSON. Solo se llena en SIMIT_VEHICULO.
            En las celdas de persona el crudo sigue en `personas[].respuesta_proveedor`. Null si no hay crudo (llenado
            manual, consulta sin `incluir_respuesta_cruda`, otra fuente del vehículo), si no es JSON válido o si no es
            un objeto (se registra en el log sin el contenido).

    PersonaDetalle:
      type: object
      description: >
        Una persona de una celda de persona. El documento va enmascarado en `documento_enmascarado`; desde HU #14087 AC8
        `respuesta_fuente` trae la respuesta completa de la fuente para esa persona (con nombre, documento y lo que la
        fuente responda).
      required: [orden, rol, tipo_documento, documento_enmascarado, declarado_por_cliente, consulta, estado, tipo_error, consultado_en, resultado, respuesta_fuente, respuesta_proveedor]
      properties:
        orden:
          type: integer
          description: Posición dentro del rol, desde 1.
        rol:
          type: string
          enum: [PROPIETARIO, LOCATARIO]
        tipo_documento:
          type: string
          example: C
        documento_enmascarado:
          type: string
          description: "`****` más los cuatro últimos caracteres alfanuméricos; solo `****` si el documento tiene cuatro o menos."
          example: "****5678"
        declarado_por_cliente:
          type: boolean
          description: El documento lo declaró el cliente en la captura (locatario declarado), no el RUNT.
        consulta:
          type: string
          nullable: true
          enum: [RUNT_PERSONA, RUES, SIMIT]
          description: Qué se consultó para esta persona (RUES si es NIT, decisión Q2); null sin resultado.
        estado:
          type: string
          enum: [OK, ERROR, SIN_RESULTADO]
          description: SIN_RESULTADO si la celda aún no tiene dato de esta persona (pendiente, en curso o N/A).
        tipo_error:
          type: string
          nullable: true
        consultado_en:
          type: string
          format: date-time
          nullable: true
        resultado:
          nullable: true
          description: Solo con estado OK; RUNT_PERSONA, RUES o SIMIT según `consulta`.
          oneOf:
            - $ref: "#/components/schemas/ResultadoRuntPersonaDetalle"
            - $ref: "#/components/schemas/ResultadoRuesDetalle"
            - $ref: "#/components/schemas/ResultadoSimitDetalle"
        respuesta_fuente:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14087 AC8 — la respuesta COMPLETA de la fuente para esta persona (el `*Response` del rpc en proto-JSON, nombres
            del .proto en snake_case y valores por defecto incluidos), con datos personales. Null si la persona no tiene
            respuesta guardada (llenado manual, error sin respuesta, celda anterior al AC8) o no se pudo descifrar.
        respuesta_proveedor:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            HU #14153 (decisión del usuario 2026-10-28) — la respuesta ÍNTEGRA del proveedor para esta persona: el texto de
            `respuesta_fuente.resultado.respuesta_cruda.json` parseado como objeto JSON, tal cual lo devolvió el proveedor
            (Kyverum/Verifik conductor en RUNT_PERSONA, Verifik en RUES, Verifik SIMIT en SIMIT_PROPIETARIO y
            SIMIT_LOCATARIO), sin quitar ningún dato: identificadores internos,
            firma y campos técnicos incluidos. Objeto libre (su forma es la del proveedor). Incluye datos personales (licencias de
            conducción, representantes legales). Null si no hay respuesta cruda guardada (consulta anterior a la HU, llenado
            manual, error, otras fuentes), si no es JSON válido o si no es un objeto (se registra en el log sin el contenido).

    ResultadoRuntDetalle:
      type: object
      required: [placa, vin, servicio, clase, organismo, propietarios, locatarios]
      properties:
        placa: { type: string, nullable: true }
        vin: { type: string, nullable: true }
        servicio: { type: string, nullable: true, description: "Servicio del vehículo (PARTICULAR, PUBLICO...), no el proveedor." }
        clase: { type: string, nullable: true }
        organismo: { type: string, nullable: true }
        propietarios:
          type: array
          items:
            type: object
            required: [tipo_documento, tipo_propiedad]
            properties:
              tipo_documento: { type: string, nullable: true }
              tipo_propiedad: { type: string, nullable: true }
        locatarios: { type: integer }

    ResultadoSimitDetalle:
      type: object
      required: [semaforo, cantidad_comparendos, comparendos, comparendos_truncados]
      properties:
        semaforo: { type: string, nullable: true, enum: [VERDE, AMARILLO, ROJO] }
        cantidad_comparendos: { type: integer, description: "Total de comparendos (aunque la lista se corte)." }
        comparendos:
          type: array
          maxItems: 100
          items:
            type: object
            required: [numero, fecha, valor, estado, organismo]
            properties:
              numero: { type: string, nullable: true }
              fecha: { type: string, nullable: true, example: "2026-01-02" }
              valor: { type: string, nullable: true, description: "Texto decimal en pesos.", example: "500000" }
              estado: { type: string, nullable: true }
              organismo: { type: string, nullable: true }
        comparendos_truncados: { type: boolean, description: "true si había más de 100 comparendos." }

    ResultadoAvaluoDetalle:
      type: object
      required: [sin_valor_comercial, valor_sugerido, fuente_principal, fuentes]
      properties:
        sin_valor_comercial: { type: boolean, description: "Ninguna fuente con valor: mostrar «sin valor comercial» (Q4 = b)." }
        valor_sugerido: { type: integer, format: int64, nullable: true, description: "Pesos colombianos." }
        fuente_principal: { type: string, nullable: true, enum: [fasecolda, mercado_libre, base_gravable] }
        fuentes:
          type: array
          items:
            type: object
            required: [fuente, estado, valor, muestras, fecha]
            properties:
              fuente: { type: string, nullable: true, example: fasecolda }
              estado: { type: string, nullable: true, enum: [OK, SIN_DATOS, ERROR] }
              valor: { type: integer, format: int64, nullable: true }
              muestras: { type: integer, nullable: true }
              fecha: { type: string, nullable: true, example: "2026-10-22" }

    ResultadoImpuestoDetalle:
      type: object
      description: >
        Impuesto vehicular departamental. `tiene_deuda` confirma la deuda. `monto_total` es null y se omite cuando el
        servicio no informó valor: la pantalla, el PDF y el Excel dicen «Deuda sin valor informado», nunca `$ 0`.
        Sin deuda no trae fechas ni valores que no vinieron. Sin proveedor, transacción, origen ni departamento (R-20).
      required: [tiene_deuda, vigencias]
      properties:
        tiene_deuda: { type: boolean, description: "true si la fuente confirmó deuda, también sin monto." }
        monto_total:
          type: integer
          format: int64
          nullable: true
          description: "Total adeudado en pesos. Ausente o null si no se informó (no es 0)."
          example: 350000
        intereses_mora: { type: integer, format: int64, nullable: true }
        sanciones: { type: integer, format: int64, nullable: true }
        avaluo_comercial: { type: integer, format: int64, nullable: true }
        ultimo_pago: { $ref: "#/components/schemas/UltimoPagoImpuestoDetalle" }
        liquidacion_consolidada_id: { type: string, nullable: true }
        periodo_certificacion: { type: string, nullable: true }
        fecha_consulta: { type: string, nullable: true }
        vigencias:
          type: array
          description: Por año ascendente; vacía si no registra vigencias.
          items:
            $ref: "#/components/schemas/VigenciaImpuestoDetalle"
      example:
        tiene_deuda: true
        monto_total: 350000
        vigencias:
          - { anio: 2025, valor: 180000, pagada: true }
          - { anio: 2026, valor: 350000, pagada: false }

    UltimoPagoImpuestoDetalle:
      type: object
      properties:
        anio: { type: integer, nullable: true }
        valor: { type: integer, format: int64, nullable: true }
        fecha: { type: string, nullable: true }

    VigenciaImpuestoDetalle:
      type: object
      required: [anio, valor, pagada]
      properties:
        anio: { type: integer, example: 2026 }
        valor: { type: integer, format: int64, description: "Pesos colombianos.", example: 350000 }
        pagada: { type: boolean }

    ResultadoRuntPersonaDetalle:
      type: object
      required: [inscrito, estado_conductor, licencias]
      properties:
        inscrito: { type: boolean }
        estado_conductor: { type: string, nullable: true }
        licencias:
          type: array
          items:
            type: object
            required: [categoria, estado, vigente_hasta]
            properties:
              categoria: { type: string, nullable: true }
              estado: { type: string, nullable: true }
              vigente_hasta: { type: string, nullable: true }

    ResultadoRuesDetalle:
      type: object
      required: [encontrada, estado_matricula, ultima_renovacion]
      properties:
        encontrada: { type: boolean }
        estado_matricula: { type: string, nullable: true }
        ultima_renovacion: { type: string, nullable: true }

    FormularioLlenadoManual:
      type: object
      description: Formulario del llenado manual (HU #13800). Todas las claves van siempre.
      required: [id, diagnostico_id, vehiculo_id, fuente, estado, tipo_error, version, admite_manual, motivo, personas]
      properties:
        id: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        vehiculo_id: { type: string, format: uuid }
        fuente: { type: string, enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL] }
        estado: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA] }
        tipo_error: { type: string, nullable: true }
        version: { type: integer, format: int64, description: "Versión de la celda; va en el cuerpo del PUT." }
        admite_manual: { type: boolean }
        motivo: { type: string, nullable: true, enum: [FUENTE_NO_ADMITE_MANUAL, CELDA_NO_EN_ERROR, CELDA_BLOQUEADA_POR_RUNT, SIN_PERSONAS_EN_ERROR, null] }
        personas:
          type: array
          nullable: true
          description: Solo en fuentes de persona (null en las del vehículo); solo las personas en ERROR, por orden.
          items:
            $ref: "#/components/schemas/PersonaEnErrorManual"

    PersonaEnErrorManual:
      type: object
      required: [persona_id, orden, rol, tipo_documento, documento_enmascarado, declarado_por_cliente, consulta, tipo_error]
      properties:
        persona_id: { type: string, format: uuid, description: "Va en personas[].persona_id del PUT." }
        orden: { type: integer }
        rol: { type: string, enum: [PROPIETARIO, LOCATARIO] }
        tipo_documento: { type: string }
        documento_enmascarado: { type: string, example: "****0102" }
        declarado_por_cliente: { type: boolean }
        consulta: { type: string, enum: [RUNT_PERSONA, RUES, SIMIT], description: "Define el esquema del resultado de esa persona." }
        tipo_error: { type: string, nullable: true }

    LlenadoManualVehiculo:
      type: object
      description: Cuerpo para SIMIT_VEHICULO (resultado ResultadoManualSimit) y AVALUO (resultado ResultadoManualAvaluo).
      additionalProperties: false
      required: [version, resultado]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        resultado:
          oneOf:
            - $ref: "#/components/schemas/ResultadoManualSimit"
            - $ref: "#/components/schemas/ResultadoManualAvaluo"

    LlenadoManualPersonas:
      type: object
      description: Cuerpo para las fuentes de persona; todas las personas en ERROR de la celda y solo ellas, sin repetir.
      additionalProperties: false
      required: [version, personas]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        personas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [persona_id, resultado]
            properties:
              persona_id: { type: string, format: uuid }
              resultado:
                oneOf:
                  - $ref: "#/components/schemas/ResultadoManualRuntPersona"
                  - $ref: "#/components/schemas/ResultadoManualRues"
                  - $ref: "#/components/schemas/ResultadoManualSimit"

    ResultadoManualSimit:
      type: object
      description: >
        SIMIT (del vehículo o consulta SIMIT de una persona). `cantidad_comparendos`, si viene, debe ser igual al número de
        comparendos; sin él se calcula. Números de comparendo sin repetir.
      additionalProperties: false
      required: [comparendos]
      properties:
        semaforo: { type: string, nullable: true, enum: [VERDE, AMARILLO, ROJO, null] }
        cantidad_comparendos: { type: integer, minimum: 0 }
        comparendos:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [numero]
            properties:
              numero: { type: string, maxLength: 60 }
              fecha: { type: string, format: date, nullable: true }
              valor: { type: string, nullable: true, pattern: '^\d{1,15}(\.\d{1,2})?$', description: "Texto decimal en pesos.", example: "468500" }
              estado: { type: string, nullable: true, maxLength: 60 }
              organismo: { type: string, nullable: true, maxLength: 120 }

    ResultadoManualAvaluo:
      type: object
      description: >
        AVALUO. Con `sin_valor_comercial=false`, `valor_sugerido` (mayor que 0) y `fuente_principal` (una fuente enviada con
        estado OK) son obligatorios; con `true` no van y ninguna fuente puede estar en OK. `valor` solo (y obligatorio) en
        fuentes OK. Sin `fecha`: la pone el servidor (día de hoy en Colombia).
      additionalProperties: false
      required: [sin_valor_comercial, fuentes]
      properties:
        sin_valor_comercial: { type: boolean }
        valor_sugerido: { type: integer, format: int64, minimum: 1, nullable: true }
        fuente_principal: { type: string, nullable: true, enum: [fasecolda, mercado_libre, base_gravable, null] }
        fuentes:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [fuente, estado]
            properties:
              fuente: { type: string, enum: [fasecolda, mercado_libre, base_gravable] }
              estado: { type: string, enum: [OK, SIN_DATOS, ERROR] }
              valor: { type: integer, format: int64, minimum: 1, nullable: true }
              muestras: { type: integer, minimum: 1, nullable: true }

    ResultadoManualRuntPersona:
      type: object
      description: RUNT de una persona natural (consulta RUNT_PERSONA).
      additionalProperties: false
      required: [inscrito, licencias]
      properties:
        inscrito: { type: boolean }
        estado_conductor: { type: string, nullable: true, maxLength: 60 }
        licencias:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [categoria]
            properties:
              categoria: { type: string, maxLength: 10 }
              estado: { type: string, nullable: true, maxLength: 60 }
              vigente_hasta: { type: string, format: date, nullable: true }

    ResultadoManualRues:
      type: object
      description: RUES de una persona jurídica (consulta RUES).
      additionalProperties: false
      required: [encontrada]
      properties:
        encontrada: { type: boolean }
        estado_matricula: { type: string, nullable: true, maxLength: 60 }
        ultima_renovacion: { type: string, nullable: true, description: "AAAA-MM-DD o el año AAAA.", example: "2026-03-31" }

    LlenadoManualRespuesta:
      type: object
      required: [id, diagnostico_id, vehiculo_id, fuente, estado, origen, usuario_manual_id, dato_obtenido_en, version, estado_lote]
      properties:
        id: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        vehiculo_id: { type: string, format: uuid }
        fuente: { type: string }
        estado: { type: string, enum: [COMPLETADO] }
        origen: { type: string, enum: [MANUAL] }
        usuario_manual_id: { type: string, format: uuid }
        dato_obtenido_en: { type: string, format: date-time }
        version: { type: integer, format: int64, description: "Nueva versión del tablero (la de la celda)." }
        estado_lote: { type: string, enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO] }

    SolicitudEvidencia:
      type: object
      description: Pedido de una evidencia en segundo plano (HU #13850). Hoy solo el ZIP de los PDF del lote.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [ZIP]
    EstadoEvidencia:
      type: object
      description: >
        Estado del ZIP del lote (HU #13850). vehiculos_incluidos = vehículos con su PDF (los esperados mientras está en la cola, los
        del archivo cuando está LISTA); vehiculos_pendientes = los que quedan fuera por no haber terminado (van en el índice).
      required: [id, tipo, estado, vehiculos_incluidos, vehiculos_pendientes, creado_en, generado_en, tipo_error]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ZIP]
        estado:
          type: string
          enum: [PENDIENTE, GENERANDO, LISTA, ERROR]
        vehiculos_incluidos:
          type: integer
          minimum: 0
        vehiculos_pendientes:
          type: integer
          minimum: 0
        creado_en:
          type: string
          format: date-time
          description: Instante del pedido.
        generado_en:
          type: string
          format: date-time
          nullable: true
          description: Instante en que quedó LISTA; null mientras no.
        tipo_error:
          type: string
          nullable: true
          enum: [ALMACEN_NO_DISPONIBLE, GENERACION_FALLIDA, GENERACION_INTERRUMPIDA, SIN_VEHICULOS_TERMINADOS, null]
          description: Solo con estado ERROR. Nunca la causa técnica de una fuente.
    ErrorRegla:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: SIN_EMPRESA
        error:
          type: string
        campo:
          type: string
          description: Campo del cuerpo que incumple la regla (solo en las reglas de un campo, HU #13750).
          example: alcance.por_vehiculo
