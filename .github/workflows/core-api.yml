name: Core API (.NET 10)

on:
  push:
    branches: [develop, main]
    paths:
      - 'services/core-api/**'
      - 'services/core-identity/**'
      - 'services/core-consultas/**'
      - 'contracts/proto/**'
      - 'contracts/openapi/core-api.v1.yaml'
      - 'contracts/openapi/external-api.v1.json'
      - '.github/workflows/core-api.yml'
      - '.github/scripts/ci-core-api-pruebas.sh'
      # El catálogo del manual es texto generado. No debe disparar la suite completa,
      # que en develop ya falla por pruebas ajenas a ese archivo.
      - '!services/core-api/src/Flit.Api/Content/dr-flit/**'
  pull_request:
    branches: [develop]
    paths:
      - 'services/core-api/**'
      - 'services/core-identity/**'
      - 'services/core-consultas/**'
      - 'contracts/proto/**'
      - 'contracts/openapi/core-api.v1.yaml'
      - 'contracts/openapi/external-api.v1.json'
      - '.github/workflows/core-api.yml'
      - '.github/scripts/ci-core-api-pruebas.sh'
      - '!services/core-api/src/Flit.Api/Content/dr-flit/**'
  workflow_dispatch:

# Un push nuevo al mismo PR (o a la misma rama) cancela la corrida anterior: solo importa la última.
concurrency:
  group: core-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # La suite se reparte en carriles que corren en paralelo, cada uno en su runner (antes era un solo
  # job de ~44 min, con timeout de 45). El camino crítico es «admin» (~28 min) hasta que se aligere su
  # arnés. Reparto y detalles en .github/scripts/ci-core-api-pruebas.sh.
  pruebas:
    name: pruebas (${{ matrix.nombre }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: admin, carril: admin, shard: 0 }
          - { nombre: integration-0, carril: integration, shard: 0 }
          - { nombre: integration-1, carril: integration, shard: 1 }
          - { nombre: integration-2, carril: integration, shard: 2 }
          - { nombre: integration-3, carril: integration, shard: 3 }
          - { nombre: resto, carril: resto, shard: 0 }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flit_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flit_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Epic #13316 (HU #13338): broker real para las pruebas de la outbox del SDK y las de bus de
      # Integration. Usuario propio: guest solo entra desde loopback dentro del contenedor.
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: flit
          RABBITMQ_DEFAULT_PASS: flit-prueba
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      ConnectionStrings__Core: "Host=localhost;Port=5432;Database=flit_dev;Username=postgres;Password=postgres"
      FLIT_TEST_RABBITMQ: "amqp://flit:flit-prueba@localhost:5672/"
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/core-api/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Apply migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.1
          dotnet ef database update \
            --project src/Flit.Infrastructure \
            --startup-project src/Flit.Api \
            --no-build --configuration Release

      - name: Test
        run: ../../.github/scripts/ci-core-api-pruebas.sh "${{ matrix.carril }}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '4'
          # La cobertura solo se recoge en push: en el PR alarga la corrida sin que nadie la mire.
          COBERTURA: ${{ github.event_name == 'push' && '1' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-results-${{ matrix.nombre }}
          path: |
            services/core-api/tests/**/TestResults/
            services/core-api/TestResults-*.log

  # Check único que resume los carriles (el que se marcará como obligatorio, en vez de cada carril).
  core-api:
    if: always()
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Todos los carriles en verde
        run: test "${{ needs.pruebas.result }}" = success

  # Ya no espera a las pruebas: corre en paralelo y solo comprueba que el publish siga funcionando.
  aot-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/core-api/global.json

      # MVP Fase 11: JIT escape documentado (ADR-0002 §"AOT en .NET").
      # QuestPDF (Flit.Modules.Recibos) usa reflection + SkiaSharp y
      # aun no es AOT-compatible. Cuando lo sea (roadmap 2025) o se cambie
      # de motor PDF, volver a --self-contained con AOT.
      - name: Publish (linux-musl-x64, JIT)
        working-directory: services/core-api
        run: dotnet publish src/Flit.Api/Flit.Api.csproj -c Release -r linux-musl-x64 --self-contained -o publish /p:PublishAot=false
