# FLIT monorepo — SonarCloud multi-module configuration
# Doc: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/monorepo-support/
# Ejecutar:  sonar-scanner -Dsonar.token=$SONAR_TOKEN -Dsonar.organization=$SONAR_ORGANIZATION
# CI: .github/workflows/*.yml inyectan SONAR_TOKEN y SONAR_ORGANIZATION desde secrets.

# ============================================================================
# Identidad del proyecto
# ============================================================================
sonar.projectKey=flit-boilerplate
sonar.projectName=FLIT Boilerplate
sonar.projectVersion=1.0.0
# sonar.organization se inyecta como flag -Dsonar.organization=$SONAR_ORGANIZATION

# Encoding del proyecto
sonar.sourceEncoding=UTF-8

# Branch principal
sonar.branch.name=develop

# ============================================================================
# Estructura multi-módulo (post ADR-0014: core-api + python-ml + frontend)
# ============================================================================
sonar.modules=core-api,python-ml,frontend

# ----------------------------------------------------------------------------
# core-api — .NET 10 / C# 14 (incluye Flit.Api + Flit.Gateway + Modules.*)
# ----------------------------------------------------------------------------
core-api.sonar.projectBaseDir=services/core-api
core-api.sonar.projectName=FLIT Core API (.NET 10)
core-api.sonar.sources=src
core-api.sonar.tests=tests
core-api.sonar.cs.opencover.reportsPaths=tests/**/coverage.opencover.xml
core-api.sonar.cs.vstest.reportsPaths=tests/**/TestResults/*.trx
core-api.sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/Snapshots/**

# ----------------------------------------------------------------------------
# python-ml — Python 3.13 / FastAPI
# ----------------------------------------------------------------------------
python-ml.sonar.projectBaseDir=services/python-ml
python-ml.sonar.projectName=FLIT Python ML (FastAPI)
python-ml.sonar.sources=app
python-ml.sonar.tests=tests
python-ml.sonar.python.version=3.13
python-ml.sonar.python.coverage.reportPaths=coverage.xml
python-ml.sonar.exclusions=**/__pycache__/**,**/.venv/**,**/models/**

# ----------------------------------------------------------------------------
# frontend — Next.js 16 / React 19 / TypeScript
# ----------------------------------------------------------------------------
frontend.sonar.projectBaseDir=frontend
frontend.sonar.projectName=FLIT Frontend (Next.js)
frontend.sonar.sources=src
frontend.sonar.tests=e2e,tests
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.typescript.tsconfigPaths=tsconfig.json
frontend.sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/public/**

# ============================================================================
# Exclusiones globales
# ============================================================================
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/bin/**,**/obj/**,**/.venv/**,**/coverage/**,**/__pycache__/**,**/vendor/**,.ai/_generated/**,.ai/_legacy/**,infra/secrets/**

# ============================================================================
# Quality Gate
# ============================================================================
sonar.qualitygate.wait=true
# Quality gate condicional: usa el default "Sonar way" hasta que el equipo defina
# uno personalizado con: complejidad cyclomatic ≤ 15, cobertura nuevo código ≥ 80%,
# 0 vulnerabilidades High/Critical en nuevo código.
