            application/json:
              schema:
                $ref: "#/components/schemas/AlertRulesListResponse"
        "400":
          description: Falta tenant (SuperAdmin sin `tenantId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol AdminCompany, o tenant ajeno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Analytics · Alertas por umbral (Reportes 2.0)]
      operationId: analyticsAlertRulesCreate
      summary: Crea una regla de alerta
      description: >
        Reportes 2.0 (HU-D). Requiere policy AdminCompany. La regla se evalúa cada 60 s sobre su
        ventana (`windowMinutes`); si el operador se cumple y el cooldown venció, se registra un
        disparo en el historial y se notifica por correo a `recipients`. Validaciones de negocio
        → 400 con detalle en español.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; obligatorio para él.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "201":
          description: Regla de alerta creada (header `Location` con su URL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleDto"
        "400":
          description: Validación de negocio fallida (detalle en español) o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol AdminCompany, o tenant ajeno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/alert-rules/{id}:
    put:
      tags: [Analytics · Alertas por umbral (Reportes 2.0)]
      operationId: analyticsAlertRulesUpdate
      summary: Actualiza una regla de alerta
      description: >
        Reportes 2.0 (HU-D). Requiere policy AdminCompany. Reemplaza la definición completa de
        la regla (mismas validaciones que el alta). Un id inexistente O de otro tenant responde
        404 (sin revelar existencia cross-tenant).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; obligatorio para él.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "200":
          description: Regla de alerta actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleDto"
        "400":
          description: Validación de negocio fallida (detalle en español) o falta tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol AdminCompany, o tenant ajeno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La regla de alerta no existe (o pertenece a otro tenant).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Analytics · Alertas por umbral (Reportes 2.0)]
      operationId: analyticsAlertRulesDelete
      summary: Elimina (lógicamente) una regla de alerta
      description: >
        Reportes 2.0 (HU-D). Requiere policy AdminCompany. Borrado lógico (`deleted_at`): el
        scheduler deja de evaluarla; su historial de disparos se conserva. Un id inexistente O
        de otro tenant responde 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; obligatorio para él.
      responses:
        "204":
          description: Regla de alerta eliminada.
        "400":
          description: Falta tenant (SuperAdmin sin `tenantId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol AdminCompany, o tenant ajeno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La regla de alerta no existe (o pertenece a otro tenant).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/alert-events:
    get:
      tags: [Analytics · Alertas por umbral (Reportes 2.0)]
      operationId: analyticsAlertEventsList
      summary: Historial paginado de disparos de alertas (más recientes primero)
      description: >
        Reportes 2.0 (HU-D). Requiere policy AdminCompany. Devuelve los disparos registrados en
        `analytics.alert_events` del tenant, ordenados por `triggeredAt` descendente, con
        `totalCount` del universo filtrado. Filtrable por regla (`ruleId`). Mismo modelo de
        tenant que el resto del CRUD (SuperAdmin DEBE indicar `tenantId`).
      security:
        - bearerAuth: []
      parameters:
        - name: ruleId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Filtra por regla de alerta.
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; obligatorio para él.
      responses:
        "200":
          description: Página del historial de disparos (vacía con totalCount=0 si no hay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventsPageResponse"
        "400":
          description: Falta tenant (SuperAdmin sin `tenantId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol AdminCompany, o tenant ajeno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/analytics/alert-events/{id}/ack:
    post:
      tags: [Analytics · Alertas por umbral (Reportes 2.0)]
      operationId: analyticsAlertEventsAck
      summary: Marca un disparo de alerta como reconocido (set-once)
      description: >
        Reportes 2.0 (HU-D) / HU5 (observabilidad ICT). Requiere policy AdminCompany. Reconoce un
        disparo de `analytics.alert_events` de forma idempotente set-once (conserva el primer
        reconocimiento). Un id de otro tenant "no existe" (404). SuperAdmin DEBE indicar `tenantId`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id del disparo (alert_event).
        - name: tenantId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Solo SuperAdmin; obligatorio para él.
      responses:
        "200":
          description: Disparo reconocido; devuelve el evento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEventDto"
        "400":
          description: Falta tenant (SuperAdmin sin `tenantId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.
        "403":
          description: Sin rol AdminCompany, o tenant ajeno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: El disparo de alerta no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/improntas/generate:
    post:
      tags: [Admin · Improntas]
      operationId: adminImprontasGenerate
      summary: Genera, persiste y entrega el PDF del Certificado de Improntas Digitales (HU #10467)
      description: >
        Llama a Kyverum RUNT (HU #10465), decodifica el PDF del Data URI base64 devuelto, persiste
        el registro de trazabilidad (HU #10466: radicado, hash, fechaImpresa, datos del vehículo,
        organización, operador, tenant y usuario SuperAdmin que la generó) y responde con el binario
        íntegro, listo para descarga (`impronta_{radicado}.pdf`). Requiere rol SuperAdmin (AC2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarImprontaRequest"
      responses:
        "200":
          description: PDF del Certificado de Improntas Digitales.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: No autenticado, o Kyverum RUNT rechazó la autenticación (key inválida/scope insuficiente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario autenticado sin rol SuperAdmin (AC2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Falta placa/identificador de vehículo/organización/operador (validación local), o
            Kyverum RUNT respondió VALIDATION_ERROR (AC3).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Kyverum RUNT no disponible temporalmente (UPSTREAM_UNAVAILABLE, AC3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Trámites · Documentos (adjuntos, checklist, consolidado) — HU #10520 (RNF01) ──
  /api/v1/tramites/instances/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Subir un adjunto (multipart)
      operationId: uploadProcedureInstanceAttachment
      security:
        - bearerAuth: []
      description: >
        Sube el binario de un documento del trámite (solo en estado borrador). Valida tipo,
        MIME y tamaño; si el tipo existe en el catálogo document_types se aplican sus reglas
        (mime_types_allowed/max_size_bytes), con respaldo a los límites globales (pdf/jpeg/png/webp, 20 MB).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo, file]
              properties:
                tipo: { type: string, example: factura }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Adjunto creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400": { description: "tipo/MIME/tamaño inválido o archivo faltante." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "El trámite no está en borrador." }
    get:
      tags: [Trámites · Documentos]
      summary: Listar adjuntos del trámite
      operationId: listProcedureInstanceAttachments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de adjuntos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: "#/components/schemas/AttachmentDto" }
        "404": { description: "Trámite no encontrado." }

  /api/v1/tramites/instances/{id}/attachments/presign:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Abrir subida directa a S3 (presigned POST)
      operationId: presignProcedureInstanceAttachment
      security:
        - bearerAuth: []
      description: >
        Valida tipo/MIME/tamaño y estado borrador y devuelve una política presigned POST para
        subir el binario directo a S3, sin crear aún la fila del adjunto (se registra luego).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresignAttachmentRequest" }
      responses:
        "200":
          description: Política presigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  storagePath: { type: string }
                  url: { type: string, format: uri }
                  fields:
                    type: object
                    additionalProperties: { type: string }
        "400": { description: "tipo/MIME/tamaño inválido." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "El trámite no está en borrador." }

  /api/v1/tramites/instances/{id}/attachments/register:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Registrar la metadata de un adjunto ya subido a S3
      operationId: registerProcedureInstanceAttachment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAttachmentRequest" }
      responses:
        "201":
          description: Adjunto registrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "400": { description: "tipo/MIME/tamaño/storagePath/sha256 inválido." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "El trámite no está en borrador." }

  /api/v1/tramites/instances/{id}/attachments/{attachmentId}/download:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Descargar el binario de un adjunto
      operationId: downloadProcedureInstanceAttachment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Binario del adjunto.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: "Trámite o adjunto no encontrado, o binario perdido." }

  /api/v1/tramites/instances/{id}/attachments/{attachmentId}/preview-url:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Presigned URL inline para previsualización de adjunto
      operationId: getProcedureInstanceAttachmentPreviewUrl
      description: |
        Devuelve una presigned GET URL con `Content-Disposition: inline` para visualizar el
        adjunto en el navegador sin forzar descarga (Feature #10701 / ADR-0029). TTL ≈ 10 min.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: URL de previsualización firmada y su tiempo de expiración.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL presigned con Content-Disposition inline.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Momento de expiración de la URL (UTC, ≈ +10 min).
                required: [url, expiresAt]
        "404": { description: "Trámite o adjunto no encontrado." }
        "503": { description: "No se pudo obtener la URL de previsualización del backend de almacenamiento." }

  /api/v1/tramites/instances/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Trámites · Documentos]
      summary: Borrar un adjunto (solo en borrador)
      operationId: deleteProcedureInstanceAttachment
      security:
        - bearerAuth: []
      responses:
        "204": { description: "Adjunto borrado." }
        "404": { description: "Trámite o adjunto no encontrado." }
        "409": { description: "El trámite no está en borrador." }

  /api/v1/tramites/instances/{id}/checklist:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Trámites · Documentos]
      summary: Checklist documental computado del trámite
      operationId: getProcedureInstanceChecklist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checklist con estado de cada ítem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistResponse" }
        "404": { description: "Trámite no encontrado." }
        "422": { description: "La tipología del trámite no está configurada." }

  /api/v1/tramites/instances/{id}/consolidado:
    parameters:
      - $ref: "#/components/parameters/TenantIdHeader"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Trámites · Documentos]
      summary: Generar el PDF consolidado del expediente
      operationId: generarProcedureInstanceConsolidado
      security:
        - bearerAuth: []
      description: >
        Fusiona el FUR y los adjuntos del trámite en un PDF único y lo adjunta como
        tipo "consolidado". Requiere FUR generado y documentos obligatorios completos.
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Feature #11066 — cuando es true, invalida el consolidado vigente y lo regenera desde cero
            en lugar de servir el PDF cacheado.
      responses:
        "201":
          description: Consolidado generado (adjunto tipo "consolidado").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentDto" }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "Modalidad no soportada, FUR faltante, documentos incompletos o adjunto no disponible." }

  # ── Admin · OT · Documentos del trámite de cliente (Feature #10701 / HU #10704 + HU #10706) ──

  /api/v1/admin/ot/client-procedures/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin; opcional para OT admin).
    get:
      tags: [Admin · OT · Documentos]
      summary: Listar adjuntos del trámite de cliente OT (sin binarios)
      operationId: adminOtListClientProcedureDocuments
      description: |
        Devuelve la lista de adjuntos del trámite del cliente sin incluir los binarios,
        junto con flags que indican si existe un consolidado y/o un consolidado maestro
        (Feature #10701 / HU #10704).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de adjuntos con flags de consolidado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AttachmentDto" }
                  consolidado:
                    type: boolean
                    description: Indica si existe un adjunto de tipo "consolidado".
                  consolidado_maestro:
                    type: boolean
                    description: Indica si existe un adjunto de tipo "consolidado_maestro".
                required: [data, consolidado, consolidado_maestro]
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite." }
        "404": { description: "Trámite no encontrado." }

  /api/v1/admin/ot/client-procedures/{id}/documents/{attachmentId}/preview-url:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del adjunto.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin).
    get:
      tags: [Admin · OT · Documentos]
      summary: Presigned URL inline para previsualizar adjunto de trámite de cliente OT
      operationId: adminOtGetClientProcedureDocumentPreviewUrl
      description: |
        Devuelve una presigned GET URL con `Content-Disposition: inline` para visualizar el adjunto
        del trámite en el navegador sin forzar descarga (Feature #10701 / HU #10704 / ADR-0029).
        TTL ≈ 10 min. Valida grant de acceso de la OT antes de emitir la URL.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: URL de previsualización firmada y su tiempo de expiración.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL presigned con Content-Disposition inline.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Momento de expiración de la URL (UTC, ≈ +10 min).
                required: [url, expiresAt]
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite." }
        "404": { description: "Adjunto no encontrado." }
        "503": { description: "No se pudo obtener la URL de previsualización del backend de almacenamiento." }

  /api/v1/admin/ot/client-procedures/{id}/consolidado-maestro:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ID del trámite del cliente.
      - name: transitOfficeId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: ID de la OT a la que pertenece el trámite (requerido para superadmin).
    post:
      tags: [Admin · OT · Documentos]
      summary: Generar/regenerar el consolidado maestro del trámite de cliente OT
      operationId: adminOtGenerateClientProcedureConsolidadoMaestro
      description: |
        Fusiona todos los adjuntos activos del trámite del cliente (tabla maestra) en un PDF único,
        excluyendo consolidados previos. No requiere gate FUR a diferencia del consolidado del wizard.
        Si ya existe un consolidado_maestro previo, se reemplaza (Feature #10701 / HU #10706).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consolidado maestro generado (adjunto tipo "consolidado_maestro").
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  tipo: { type: string, example: consolidado_maestro }
                  filename: { type: string }
                  sha256: { type: string }
                required: [id, tipo, filename, sha256]
        "401": { description: "No autenticado." }
        "403": { description: "Sin acceso a este trámite o entidad en modo sólo lectura (QUIPUX_READONLY)." }
        "404": { description: "Trámite no encontrado." }
        "409": { description: "sin_adjuntos — No hay adjuntos disponibles para consolidar; o adjunto_no_disponible / mimetype_no_soportado." }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    # HU #10520 (RNF01) — header de tenant reutilizable por los endpoints operativos de documentos.
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Identificador del tenant (compañía) dueño del trámite.

  schemas:
    # ── Trámites · Configurador dinámico (FEATURE-08 / CFD-01) ────────────────
    ProcedureTypeSummaryF08:
      type: object
      description: Resumen de tipo publicado para el selector de operador (CFD-12, §6.1).
      required: [id, code, name, family, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: TRASPASO_SIMPLE }
        name: { type: string, example: Traspaso Simple }
        family: { type: string, example: traspaso }
        version: { type: integer, example: 1 }
    ProcedureConformationProfile:
      type: object
      description: >
        Perfil de conformación completo del tipo de trámite (§6.3 plan F08).
        `gateProfile` y `conformationRules` se materializan en HU-BE-01;
        `sources` (HU-BE-03) y `documentRequirements` (HU-BE-04) llegan como
        listas vacías hasta esas HUs — la clave siempre está presente.
      required: [procedureTypeId, code, publicationStatus, version, gateProfile, conformationRules, sources, documentRequirements]
      properties:
        procedureTypeId: { type: string, format: uuid }
        code: { type: string, example: MATRICULA_NUEVA }
        publicationStatus: { type: string, enum: [draft, published, archived] }
        version: { type: integer, example: 1 }
        gateProfile:
          type: object
          additionalProperties: true
          description: >
            Flags de conformación del tipo (ver DDL comment de
            `tramites.procedure_types.gate_profile`): entryMode, requiresBuyer,
            biometricActors, simitMode, etc. Objeto JSON abierto.
        conformationRules:
          type: array
          items:
            type: object
            required: [entityCode, validationProfile]
            properties:
              entityCode: { type: string, example: BUYER }
              validationProfile:
                type: object
                additionalProperties: true
        sources:
          type: array
          items:
            type: object
            required: [sourceCode, executionOrder, config]
            properties:
              sourceCode: { type: string, example: RUNT }
              executionOrder: { type: integer, example: 1 }
              config:
                type: object
                additionalProperties: true
        documentRequirements:
          type: array
          items:
            type: object
            required: [documentTypeCode, isRequired, isDummy]
            properties:
              documentTypeCode: { type: string, example: CEDULA }
              isRequired: { type: boolean }
              isDummy: { type: boolean }
              conditionGroup: { type: string, nullable: true }
    ProcedureConformationProfileInput:
      type: object
      description: >
        Cuerpo del PUT de perfil de conformación. HU-BE-01 persiste `gateProfile`;
        HU-BE-02 valida `entryMode` (PLATE/VIN/BOTH → 400 si es inválido) y las
        banderas de validación inicial. HUs BE-04/05 amplían el objeto.
      properties:
        gateProfile:
          type: object
          additionalProperties: true
          description: >
            Flags de conformación del tipo (objeto JSON abierto). Campos de HU-BE-02:
            `entryMode` (PLATE|VIN|BOTH), `validateCompanyRule`, `validateOtOperability`,
            `validateDuplicateProcedure` (bool). Ver el comentario DDL de
            `tramites.procedure_types.gate_profile` para el esquema completo.
          properties:
            entryMode:
              type: string
              enum: [PLATE, VIN, BOTH]
            validateCompanyRule: { type: boolean }
            validateOtOperability: { type: boolean }
            validateDuplicateProcedure: { type: boolean }
            requiresPlateRequest:
              type: boolean
              description: >
                HU-BE-05 / CFD-08. Si es true, el wizard incluye el paso `plate_request`
                (activación condicional en HU-BE-06).
        sources:
          type: array
          description: >
            Fuentes externas por tipo (HU-BE-03 / CFD-04). Se resuelven por `sourceCode`
            (RUNT, SIMIT, …); código inexistente → 422. `config` lleva p. ej. `simitMode`.
          items:
            type: object
            required: [sourceCode, executionOrder]
            properties:
              sourceCode: { type: string, example: RUNT }
              executionOrder: { type: integer, example: 1 }
              config:
                type: object
                additionalProperties: true
        conformationRules:
          type: array
          description: >
            Actores del tipo con su `validationProfile` (HU-BE-03 / CFD-05, incluye LESSEE).
            Se resuelven por `entityCode`; código inexistente → 422.
          items:
            type: object
            required: [entityCode]
            properties:
              entityCode: { type: string, example: LESSEE }
              validationProfile:
                type: object
                additionalProperties: true
              isActive: { type: boolean }
              sortOrder: { type: integer }
        documentRequirements:
          type: array
          description: >
            Documentos requeridos por tipo (HU-BE-04 / CFD-06). Se resuelven por
            `documentTypeCode`; código inexistente → 422. `isDummy` no bloquea el paso.
            Los flags `requiresCommercialValue`/`commercialValueSource`/`requiresBiometrics`/
            `biometricActors`/`requiresSignature` viajan dentro de `gateProfile`.
          items:
            type: object
            required: [documentTypeCode]
            properties:
              documentTypeCode: { type: string, example: CEDULA }
              isRequired: { type: boolean }
              isDummy: { type: boolean }
              conditionGroup: { type: string, nullable: true }
              sortOrder: { type: integer }
    # ── Trámites · Documentos (HU #10520, RNF01) ──────────────────────────────
    AttachmentDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, example: factura }
        filename: { type: string }
        mimetype: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        source: { type: string, example: user }
        uploadedAt: { type: string, format: date-time }
    PresignAttachmentRequest:
      type: object
      required: [tipo, filename, mimetype, sizeBytes]
      properties:
        tipo: { type: string, example: factura }
        filename: { type: string }
        mimetype: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
    RegisterAttachmentRequest:
      type: object
      required: [tipo, filename, mimetype, sizeBytes, sha256, storagePath]
      properties:
        tipo: { type: string, example: factura }
        filename: { type: string }
        mimetype: { type: string, example: application/pdf }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string }
        storagePath: { type: string }
    ChecklistItemDto:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        obligatorio: { type: boolean }
        satisfied: { type: boolean }
        docTipo: { type: string, nullable: true }
        maxSizeBytes:
          type: integer
          format: int64
          nullable: true
          description: Tamaño máximo por tipo (RF09). null ⇒ usar el límite global.
        mimeTypesAllowed:
          type: array
          nullable: true
          items: { type: string }
          description: Formatos MIME permitidos por tipo (RF08). null/vacío ⇒ formatos globales.
    ChecklistResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItemDto" }
        faltanObligatorios:
          type: array
          items: { type: string }
        completo: { type: boolean }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, expiresInSeconds, tokenType]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
        tokenType:
          type: string
          example: Bearer
    CurrentUserResponse:
      type: object
      required: [userId, email, tenantId, roles, permissions, companyName, companyNit, entityType]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        tenantId:
          type: string
          format: uuid
        roles:
          description: >
            TODOS los roles activos del usuario (HU #10616 AC3) — antes solo se exponía el
            primero.
          type: array
          items:
            $ref: '#/components/schemas/CurrentUserRole'
        permissions:
          description: Unión de permisos de todos los roles activos, igual que el JWT (HU #10616 AC3).
          type: array
          items:
            type: string
        companyName:
          description: Nombre de la empresa u organismo de tránsito asociado al tenant (HU #10616 AC1/AC2).
          type: string
        companyNit:
          description: NIT de la empresa/organismo de tránsito. Vacío si no está registrado (HU #10616 AC4).
          type: string
        entityType:
          description: Tipo de entidad del tenant (HU #10616 AC1/AC2).
          type: string
          enum: [COMPANY, TRANSIT_OFFICE]
    CurrentUserRole:
      type: object
      required: [roleId, roleCode]
      properties:
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
    AuthErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CompanyListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        nit: { type: string }
        razonSocial: { type: string }
        code: { type: string, description: Código único del tenant (inmutable). }
        tenantType:
          type: string
          enum: [RENTING, CONCESIONARIO, FLIT]
          description: >-
            Tipo de compañía del catálogo B2B. La migración RestrictTenantTypeCatalog
            normalizó los tipos heredados (p.ej. standard, transit_office) a RENTING y
            agregó el CHECK ck_tenants_tenant_type, por lo que la BD solo admite estos tres.
        estadoActivo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        rowVersion:
          type: integer
          format: int64
          description: >-
            Token de concurrencia optimista (identity.tenants.row_version). Se reenvía en
            UpdateCompanyRequest para detectar ediciones concurrentes (409).
      required: [id, nit, razonSocial, code, tenantType, estadoActivo, fechaCreacion, rowVersion]

    CompanyPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CompanyListItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateCompanyRequest:
      type: object
      properties:
        razonSocial:
          type: string
          maxLength: 255
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Razón social (legal_name). Solo letras, números, espacios y puntuación básica
            de nombres (. , & ( ) / ' ° -).
        nit:
          type: string
          maxLength: 20
          pattern: "^(?=.*[0-9])[0-9.\\-]+$"
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        code:
          type: string
          maxLength: 32
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9_-]+$"
          description: Código único del tenant. Alfanumérico con guion y guion bajo.
        tenantType:
          type: string
          enum: [RENTING, CONCESIONARIO, FLIT]
        estadoActivo: { type: boolean, default: true, description: Estado activo inicial. }
      required: [razonSocial, nit, code, tenantType]

    UpdateCompanyRequest:
      type: object
      description: Edición de compañía. El código es inmutable, por lo que no se incluye.
      properties:
        razonSocial:
          type: string
          maxLength: 255
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Razón social (legal_name). Solo letras, números, espacios y puntuación básica
            de nombres (. , & ( ) / ' ° -).
        nit:
          type: string
          maxLength: 20
          pattern: "^(?=.*[0-9])[0-9.\\-]+$"
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        tenantType:
          type: string
          description: >-
            Tipo de compañía. Para cambiarlo debe ser del catálogo B2B (RENTING,
            CONCESIONARIO, FLIT). Si coincide (ignorando mayúsculas) con el tipo actual
            del tenant se preserva tal cual, lo que permite editar tenants con tipos
            heredados (p.ej. standard, transit_office) sin alterar su tipo.
        estadoActivo: { type: boolean, default: true, description: Estado activo. }
        rowVersion:
          type: integer
          format: int64
          description: >-
            Versión de fila leída al abrir la edición. Opcional: si se envía y no coincide
            con la actual del tenant, la edición se rechaza con 409 (lost update).
      required: [razonSocial, nit, tenantType]

    SetCompanyStatusRequest:
      type: object
      properties:
        estadoActivo:
          type: boolean
          description: "true activa la compañía; false la desactiva (identity.tenants.is_active)."
      required: [estadoActivo]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    DocumentOcrResponse:
      type: object
      description: Resultado del OCR semántico de un documento de trámite.
      required: [ok, tipo]
      properties:
        ok:
          type: boolean
          description: true cuando el análisis fue correcto.
        tipo:
          type: string
          enum: [factura, aduana, impronta, soat]
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            JSON extraído por el modelo (campos según el tipo). Incluye la validez semántica
            (`es_factura_valida` para factura, `es_valido` para el resto), datos del documento/vehículo y,
            en PDFs multi-documento, `paginas_documento`/`total_paginas` (y `_paginas_extraidas` /
            `_paginas_originales` cuando hubo recorte).
        extractedPdfBase64:
          type: string
          nullable: true
          description: >
            PDF recortado (base64) cuando el documento ocupaba sólo un subconjunto de páginas de un PDF
            multi-documento; null si no hubo recorte (imagen, PDF de una página, o el tipo abarca todo el PDF).

    DocumentTypeAssociationsError:
      type: object
      description: Error 409 del soft-delete con los trámites que usan el documento.
      properties:
        error: { type: string }
        procedureTypes:
          type: array
          description: Tipos de trámite que referencian el documento.
          items:
            type: object
            properties:
              codigo: { type: string }
              nombre: { type: string }
            required: [codigo, nombre]
      required: [error, procedureTypes]

    SwitchesMatricula:
      type: object
      properties:
        allowInitialRegistration: { type: boolean }
        allowMiscNewVehicles: { type: boolean }
        onlyOwnVehicles: { type: boolean }
      required: [allowInitialRegistration, allowMiscNewVehicles, onlyOwnVehicles]

    TenantSettings:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        switchesMatricula:
          $ref: "#/components/schemas/SwitchesMatricula"
        baulFirmasActivo: { type: boolean }
        enrutamientoSMTP:
          type: string
          enum: [FLIT_SMTP, TENANT_API]
        notificationTarget:
          type: string
          enum: [COMPRADOR, RADICADOR, NINGUNO]
        metodosRecaudo:
          type: array
          items: { type: string }
        runtFailoverTimeoutMs:
          type: integer
          description: Presupuesto (ms) del proveedor de consulta primario antes de caer al fallback (HU #10478).
        consultationProviderConfig:
          type: object
          description: >-
            Override por tenant de la cadena de proveedores de consulta RUNT (HU #10478). Objeto vacío
            = usar los defaults globales. Claves: vehicle_vin, vehicle_plate, conductor.
          additionalProperties:
            $ref: "#/components/schemas/ConsultationProviderChoice"
      required:
        [tenantId, switchesMatricula, baulFirmasActivo, enrutamientoSMTP, notificationTarget, metodosRecaudo, runtFailoverTimeoutMs, consultationProviderConfig]

    ConsultationProviderChoice:
      type: object
      description: Proveedor primario + orden de fallback para un tipo de consulta (HU #10478).
      properties:
        primary:
          type: string
          description: Proveedor primario. vehicle_*, kyverum_runt|verifik; conductor, kyverum_runt_conductor|verifik_conductor.
        fallback:
          type: array
          items: { type: string }
      required: [primary, fallback]

    TenantSettingsUpdate:
      type: object
      properties:
        switchesMatricula:
          $ref: "#/components/schemas/SwitchesMatricula"
        baulFirmasActivo: { type: boolean }
        enrutamientoSMTP:
          type: string
          enum: [FLIT_SMTP, TENANT_API]
        notificationTarget:
          type: string
          enum: [COMPRADOR, RADICADOR, NINGUNO]
        metodosRecaudo:
          type: array
          items: { type: string }
        runtFailoverTimeoutMs:
          type: integer
          minimum: 500
          maximum: 60000
          description: Opcional. Si se omite, se conserva el valor previo (HU #10478).
        consultationProviderConfig:
          type: object
          description: >-
            Opcional (HU #10478). Override por tenant de la cadena de proveedores de consulta. Si se
            omite, se conserva el valor previo. Claves: vehicle_vin, vehicle_plate, conductor.
          additionalProperties:
            $ref: "#/components/schemas/ConsultationProviderChoice"
      required:
        [switchesMatricula, baulFirmasActivo, enrutamientoSMTP, notificationTarget, metodosRecaudo]

    ValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
      required: [field, message]

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required: [errors]

    WhitelistEntry:
      type: object
      description: Correo activo de la lista blanca (AC6).
      properties:
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        addedBy: { type: string, format: uuid, nullable: true }
      required: [email, createdAt]

    WhitelistAddRequest:
      type: object
      description: Alta masiva de correos exentos (AC4).
      properties:
        emails:
          type: array
          minItems: 1
          items: { type: string, format: email }
          description: Correos a exentar. Se normalizan a minúsculas y se deduplican.
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Motivo opcional de la excepción.
      required: [emails]

    WhitelistAddResponse:
      type: object
      description: Resultado del alta masiva (AC4).
      properties:
        added:
          type: array
          items: { type: string, format: email }
          description: Correos insertados (uno por fila + una fila de auditoría).
        skipped:
          type: array
          items: { type: string, format: email }
          description: Correos omitidos por ya existir (idempotencia).
      required: [added, skipped]

    WhitelistValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
        value: { type: string, nullable: true }
      required: [field, message]

    WhitelistValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/WhitelistValidationError"
      required: [errors]

    TransferStartRequest:
      type: object
      description: >
        Payload del stub de radicación (AC1/AC2). onlyOwnVehicles es la política
        efectiva ya resuelta (snapshot si in-flight, live si nuevo; AC3).
      properties:
        tenantId: { type: string, format: uuid }
        vehicleIdentifier: { type: string, nullable: true }
        userEmail: { type: string, format: email, nullable: true }
        onlyOwnVehicles: { type: boolean }
      required: [tenantId, onlyOwnVehicles]

    TransitOffice:
      type: object
      description: Organismo de tránsito del catálogo estático (AC1).
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        departmentCode: { type: string }
        cityCode: { type: string }
      required: [id, code, name, departmentCode, cityCode]

    TransitOfficeQuipuxFlags:
      type: object
      description: >
        Banderas de radicación Quipux por familia de trámite (HU #10710). Replican
        `id_parinttrasec_registration` / `_transfer` / `_otherservice` de FLIT 1.0: el alta es
        gradual y una secretaría puede estar integrada para traspasos y no para matrículas.
      properties:
        quipuxRegistration:
          type: boolean
          description: ¿Se radican las MATRÍCULAS de esta secretaría por Quipux?
        quipuxTransfer:
          type: boolean
          description: ¿Se radican los TRASPASOS de esta secretaría por Quipux?
        quipuxOther:
          type: boolean
          description: ¿Se radican los OTROS trámites de esta secretaría por Quipux?
      required: [quipuxRegistration, quipuxTransfer, quipuxOther]

    TransitOfficeQuipuxSettingsRequest:
      allOf:
        - $ref: "#/components/schemas/TransitOfficeQuipuxFlags"
        - type: object
          description: >
            Estado destino de la parametrización Quipux de una secretaría. Las tres banderas
            son obligatorias (un PUT sin ellas devuelve 422 en vez de apagarlas por omisión).
          properties:
            divipoCode:
              type: string
              nullable: true
              pattern: '^\d{1,20}$'
              example: "05001"
              description: >
                Código DIVIPO que espera Quipux. Numérico y **se trata como texto** para
                conservar los ceros a la izquierda (Medellín = `05001`). `null` o vacío =
                aún no se conoce: no es un error, y deja la secretaría no elegible.

    TransitOfficeQuipuxSettings:
      allOf:
        - $ref: "#/components/schemas/TransitOfficeQuipuxFlags"
        - type: object
          description: Parametrización Quipux persistida de una secretaría (HU #10710).
          properties:
            transitOfficeId: { type: string, format: uuid }
            divipoCode:
              type: string
              nullable: true
              example: "05001"
              description: Código DIVIPO ya normalizado, o `null` si aún no se conoce.
            elegible:
              type: boolean
              description: >
                Derivado: `true` solo si hay `divipoCode` **y** al menos una bandera activa.
                Con DIVIPO nulo es siempre `false` — sin DIVIPO no se radica, aunque las
                banderas estén activas. Es el fallo seguro frente a mandar un trámite a la
                secretaría equivocada.
          required: [transitOfficeId, elegible]

    TransitOfficeOperationalStatus:
      allOf:
        - $ref: "#/components/schemas/TransitOfficeQuipuxFlags"
        - type: object
          description: >
            Estado operativo de una oficina del catálogo (RF01) más su parametrización Quipux
            (HU #10710). Una fila por oficina activa.
          properties:
            id: { type: string, format: uuid, description: Id en `catalogs.transit_offices`. }
            code: { type: string }
            name: { type: string }
            departmentCode: { type: string }
            hasTenant:
              type: boolean
              description: ¿La oficina ya tiene tenant OT dado de alta (es cliente de FLIT)?
            tenantId:
              type: string
              format: uuid
              nullable: true
              description: Tenant OT asociado, o `null` si la oficina no tiene alta.
            estadoActivo:
              type: boolean
              nullable: true
              description: Estado del tenant OT, o `null` si la oficina no tiene alta.
            operationMode:
              type: string
              nullable: true
              enum: [dashboard, quipux, null]
              description: >
                Modo del perfil del OT-**cliente** (`admin.transit_office_profiles`): con
                `quipux` su consola queda en solo lectura porque aprueba dentro de Quipux.
                `null` si la oficina no tiene alta. **No decide** si FLIT radica a esta
                secretaría — eso son `divipoCode` y las banderas.
            divipoCode:
              type: string
              nullable: true
              example: "05001"
              description: >
                Código DIVIPO de la secretaría, o `null` si aún no se conoce (el caso
                mayoritario). Sin él la secretaría no es elegible para radicar.
          required: [id, code, name, departmentCode, hasTenant]

    CodeErrorResponse:
      type: object
      description: Error con código estable en SCREAMING_SNAKE para consumo programático.
      properties:
        code: { type: string, example: DIVIPO_CODE_INVALID }
      required: [code]

    CodeResponse:
      type: object
      description: OK con código estable (respuesta de una acción sin cuerpo relevante).
      properties:
        code: { type: string, example: OK }
      required: [code]

    QuipuxColaItem:
      type: object
      description: >
        Una radicación de la cola Quipux vista desde la consola (HU #10774): la submission
        (`tramites.quipux_submissions`) enriquecida con datos del trámite.
      properties:
        id: { type: string, format: uuid, description: Id de la submission. }
        procedureInstanceId: { type: string, format: uuid }
        referenceNumber: { type: string, description: Número de referencia del trámite. }
        procedureTypeName: { type: string }
        clientTenantName: { type: string, description: Razón social del cliente dueño del trámite. }
        documentName:
          type: string
          description: El "documento" enviado a Quipux; llave de correlación estable entre reintentos.
        status:
          type: string
          enum: [pendiente, registrado, aprobado, rechazado, fallido]
        attempts: { type: integer }
        pollCount: { type: integer }
        qxRegisterCode:
          type: integer
          nullable: true
          description: Último `codigo` del registro (81 = radicado).
        qxProcedureCode:
          type: integer
          nullable: true
          description: Último `estadoTramite.codigo` de la consulta (2 aprobado, 3 rechazado).
        rejectionReason:
          type: string
          nullable: true
          description: Motivo del rechazo de Quipux, si lo hubo.
        createdAt: { type: string, format: date-time }
        registeredAt: { type: string, format: date-time, nullable: true }
        lastPolledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
      required:
        [id, procedureInstanceId, referenceNumber, procedureTypeName, clientTenantName,
         documentName, status, attempts, pollCount, createdAt]

    QuipuxColaPage:
      type: object
      description: Página de la cola Quipux de una secretaría.
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/QuipuxColaItem" }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    LogQxEvent:
      type: object
      description: >
        Un evento de la línea de tiempo del LOG QX (HU #10793), proyectado de
        `tramites.quipux_submission_events`. `detail` es el jsonb SANITIZADO tal cual se persistió
        (nunca request/response crudos ni PII), o `null` = "sin payload disponible".
      properties:
        stage:
          type: string
          description: >
            Etapa: `claimed | consolidado_generado | s3_subido | registro_enviado | registro_respuesta
            | registro_error | consulta_enviada | consulta_respuesta | consulta_error | aprobado |
            rechazado | dead_letter | reintento_manual | cancelado_manual`.
        outcome:
          type: string
          description: "Resultado: `ok | error_transitorio | error_definitivo | omitido`."
        detail:
          type: object
          additionalProperties: true
          nullable: true
          description: >
            Detalle sanitizado (objeto JSON arbitrario) tal cual se persistió, o `null` para
            registros históricos sin detalle.
        durationMs:
          type: integer
          format: int64
          nullable: true
          description: Duración de la llamada HTTP en ms; `null` en eventos previos a la instrumentación.
        origin:
          type: string
          nullable: true
          description: >
            Worker que originó el evento (`quipux_register` / `quipux_status_poll`). Se toma del
            detalle instrumentado; para eventos históricos se deriva de la etapa como aproximación.
        responseCode:
          type: integer
          nullable: true
          description: Código de respuesta QX del evento, extraído del detalle si está presente.
        correlationId:
          type: string
          format: uuid
          nullable: true
        occurredAt: { type: string, format: date-time }
      required: [stage, outcome, occurredAt]

    LogQxEntry:
      type: object
      description: >
        Una radicación Quipux (`tramites.quipux_submissions`) enriquecida con datos del trámite y su
        línea de tiempo de eventos. El estado final y los códigos QX van en la cabecera; el paso a paso
        en `events`.
      properties:
        id: { type: string, format: uuid, description: Id de la submission. }
        procedureInstanceId: { type: string, format: uuid }
        referenceNumber: { type: string }
        procedureTypeName: { type: string }
        clientTenantName: { type: string, description: Razón social del cliente dueño del trámite. }
        plate:
          type: string
          nullable: true
          description: Placa proyectada de `procedure_instance_field_values`; `null` en trámites por VIN.
        documentName: { type: string }
        divipoCode: { type: string, nullable: true }
        status:
          type: string
          enum: [pendiente, registrado, aprobado, rechazado, fallido]
        attempts: { type: integer }
        pollCount: { type: integer }
        qxRegisterCode: { type: integer, nullable: true }
        qxProcedureCode: { type: integer, nullable: true }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        registeredAt: { type: string, format: date-time, nullable: true }
        lastPolledAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        events:
          type: array
          items: { $ref: "#/components/schemas/LogQxEvent" }
      required:
        [id, procedureInstanceId, referenceNumber, procedureTypeName, clientTenantName, documentName,
         status, attempts, pollCount, createdAt, events]

    LogQxPage:
      type: object
      description: Página del LOG QX con eco de paginación (HU #10793).
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/LogQxEntry" }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    TransitGrantRequest:
      type: object
      description: Habilitación de un organismo de tránsito a un tenant (AC2).
      properties:
        transitOfficeId:
          type: string
          format: uuid
          description: Id del organismo a habilitar. Debe existir en el catálogo estático.
      required: [transitOfficeId]

    TransitGrantCreatedResponse:
      type: object
      description: Resultado del alta de un grant (AC2).
      properties:
        transitOfficeId: { type: string, format: uuid }
        created:
          type: boolean
          description: true si se creó el grant; false si ya existía (idempotente).
      required: [transitOfficeId, created]

    TransitGrantListResponse:
      type: object
      description: Organismos de tránsito habilitados del tenant (AC5).
      properties:
        transitOfficeIds:
          type: array
          items: { type: string, format: uuid }
      required: [transitOfficeIds]

    TransitGrantValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
        value: { type: string, nullable: true }
      required: [field, message]

    TransitGrantValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/TransitGrantValidationError"
      required: [errors]

    OtConsultationRestrictionItem:
      type: object
      description: >
        Fila de restricción de consulta de un tenant para un OT puntual (HU #10759,
        AC1/AC5). Tabla dispersa: ausencia de fila para un consultationKind dado
        equivale a enabled=true (permisivo).
      properties:
        transitOfficeId: { type: string, format: uuid }
        consultationKind:
          type: string
          enum: [rnmc, fines]
          description: >
            Vocabulario propio de restricciones comerciales — no confundir con el
            tipo de dato consultado del motor de trámites (vehicle_vin|vehicle_plate|conductor).
        enabled:
          type: boolean
          description: Estado deseado — true permitida (default), false inhabilitada.
      required: [transitOfficeId, consultationKind, enabled]

    OtConsultationRestrictionListResponse:
      type: array
      description: Restricciones de consulta por OT configuradas explícitamente para el tenant (AC1/AC5).
      items:
        $ref: "#/components/schemas/OtConsultationRestrictionItem"

    SetOtConsultationRestrictionRequest:
      type: object
      description: >
        Cuerpo del PUT que fija el estado deseado de una restricción (HU #10759).
        Transporta el ESTADO DESEADO, no un verbo de alta/baja.
      properties:
        enabled:
          type: boolean
          description: true permite la consulta (default), false la inhabilita.
      required: [enabled]

    OtConsultationRestrictionValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
        value: { type: string, nullable: true }
      required: [field, message]

    OtConsultationRestrictionValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/OtConsultationRestrictionValidationError"
      required: [errors]

    OtBlockingPolicyItem:
      type: object
      description: >
        Fila de política de bloqueo de un tenant para un OT puntual (FEATURE 05). Tabla
        dispersa: la ausencia de fila para un criterio dado equivale al default del
        criterio (soat/rtm/estado_vehiculo bloquean; fines/rnmc advierten en el pre-vuelo).
      properties:
        transitOfficeId: { type: string, format: uuid }
        criterion:
          type: string
          enum: [soat, rtm, estado_vehiculo, fines, rnmc]
          description: >
            Criterio del preflight configurable — no confundir con RestrictedConsultationKinds
            (rnmc|fines, que decide SI se consulta) ni con el tipo de dato consultado
            (vehicle_vin|vehicle_plate|conductor).
        blocks:
          type: boolean
          description: true bloquea (fail→rojo, subsanable); false solo advierte (warn→amarillo).
      required: [transitOfficeId, criterion, blocks]

    OtBlockingPolicyListResponse:
      type: array
      description: Políticas de bloqueo por OT configuradas explícitamente para el tenant (FEATURE 05).
      items:
        $ref: "#/components/schemas/OtBlockingPolicyItem"

    SetOtBlockingPolicyRequest:
      type: object
      description: >
        Cuerpo del PUT que fija el carácter bloqueante de un criterio (FEATURE 05).
        Transporta el ESTADO DESEADO, no un verbo.
      properties:
        blocks:
          type: boolean
          description: true el criterio bloquea (rojo, subsanable); false solo advierte (amarillo).
      required: [blocks]

    OtBlockingPolicyValidationError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
        value: { type: string, nullable: true }
      required: [field, message]

    OtBlockingPolicyValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/OtBlockingPolicyValidationError"
      required: [errors]

    TransitOfficeTenantItem:
      type: object
      description: >
        Tenant Organismo de Tránsito (join identity.tenants +
        admin.transit_office_profiles, refactor adminOT).
      properties:
        id: { type: string, format: uuid }
        legalName: { type: string }
        taxId: { type: string }
        code: { type: string, description: Código único del tenant (inmutable). }
        tenantType:
          type: string
          enum: [RENTING]
          description: >-
            Siempre RENTING para tenants OT (decisión intencional — ver
            RestrictTenantTypeCatalog. admin.transit_office_profiles es la fuente de
            verdad de que un tenant "es" un OT, no tenantType).
        estadoActivo: { type: boolean }
        fechaCreacion: { type: string, format: date-time }
        rowVersion: { type: integer, format: int64 }
        transitOfficeId:
          type: string
          format: uuid
          description: Oficina del catálogo vinculada (admin.transit_office_profiles.transit_office_id).
        transitOfficeName: { type: string }
        transitOfficeCode: { type: string }
        operationMode:
          type: string
          enum: [dashboard, quipux]
      required:
        [id, legalName, taxId, code, tenantType, estadoActivo, fechaCreacion, rowVersion,
         transitOfficeId, transitOfficeName, transitOfficeCode, operationMode]

    TransitOfficeTenantPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransitOfficeTenantItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    ImprontaGenerationItem:
      type: object
      description: >
        Metadata de una generación de impronta (admin.impronta_generations — ADR-0022).
        Deliberadamente NO incluye el PDF (pdf_content): el listado nunca arrastra el
        binario del certificado, solo pdfSizeBytes como sustituto liviano.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        flitUserId: { type: string, format: uuid }
        radicado: { type: string }
        hashSha256: { type: string }
        fechaImpresa: { type: string, format: date-time }
        placa: { type: string }
        numMotor: { type: string, nullable: true }
        numChasis: { type: string, nullable: true }
        numSerie: { type: string, nullable: true }
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modelo: { type: string, nullable: true }
        orgNombre: { type: string }
        orgNit: { type: string }
        orgCiudad: { type: string }
        operador: { type: string }
        pdfSizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
      required:
        [id, tenantId, flitUserId, radicado, hashSha256, fechaImpresa, placa, orgNombre,
         orgNit, orgCiudad, operador, pdfSizeBytes, createdAt]

    ImprontaGenerationPagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ImprontaGenerationItem"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateTransitOfficeRequest:
      type: object
      description: Alta de tenant OT (refactor adminOT).
      properties:
        transitOfficeId:
          type: string
          format: uuid
          description: >-
            Oficina del catálogo catalogs.transit_offices a vincular. Debe existir,
            estar activa y no tener ya un TransitOfficeProfile asociado.
        legalName:
          type: string
          maxLength: 255
          description: Razón social (legal_name).
        taxId:
          type: string
          maxLength: 20
          description: NIT (tax_id). Solo dígitos, puntos y guiones.
        code:
          type: string
          maxLength: 32
          description: Código único del tenant. Alfanumérico con guion y guion bajo.
        operationMode:
          type: string
          enum: [dashboard, quipux]
          default: dashboard
      required: [transitOfficeId, legalName, taxId, code]

    InviteOtUserRequest:
      type: object
      description: Invitación de usuario al tenant OT (self-service).
      properties:
        email: { type: string, format: email }
        fullName: { type: string, nullable: true }
      required: [email]

    InviteOtUserResponse:
      type: object
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        emailSent: { type: boolean }
      required: [invitationId, email, emailSent]

    ResendInvitationResponse:
      type: object
      description: >
        Resultado de reenviar una invitación pendiente (HU #10625). Mismo shape en
        `/api/v1/security/invitations/{invitationId}/resend` y
        `/api/v1/admin/ot/invitations/{invitationId}/resend`.
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        emailSent: { type: boolean }
      required: [invitationId, email, emailSent]

    ResendCooldownErrorResponse:
      type: object
      description: >
        Error 429 del cooldown anti-abuso de reenvío (HU #10625 AC2). El endpoint
        Compañía usa `code`; el endpoint OT usa `error` — ambos incluyen `message` y
        `retryAfterSeconds`.
      properties:
        code: { type: string, example: RESEND_COOLDOWN_ACTIVE }
        error: { type: string, example: RESEND_COOLDOWN_ACTIVE }
        message: { type: string }
        retryAfterSeconds:
          type: integer
          description: Segundos hasta que se pueda reenviar de nuevo.
      required: [message, retryAfterSeconds]

    OtUserItem:
      type: object
      description: >
        Usuario (activo, sin rol o invitación pendiente) del tenant OT, o
        usuario eliminado cuando se lista con `?onlyDeleted=true` (#10624).
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, nullable: true }
        roleCode: { type: string, nullable: true }
        roleId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, inactive, pending]
        createdAt: { type: string, format: date-time, nullable: true }
        isSuspended: { type: boolean }
        rowVersion:
          type: integer
          format: int64
          description: >
            Versión de fila del usuario (#10621). Requerida para editar (PATCH
            /users/{userId}) con concurrencia optimista; 0 para invitaciones
            pendientes (no aplica edición de perfil).
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Fecha de eliminación (soft-delete, #10623). `null` en el listado
            normal; siempre poblado cuando se listó con `?onlyDeleted=true`
            (#10624).
      required: [id, fullName, email, status, isSuspended, rowVersion]

    UpdateOtUserRequest:
      type: object
      description: Edición de nombre/correo de un usuario del tenant OT (#10621).
      properties:
        displayName:
          type: string
          nullable: true
          description: Nombre nuevo. Omitido o vacío = no se modifica.
        email:
          type: string
          format: email
          nullable: true
          description: Correo nuevo. Omitido o vacío = no se modifica.
        rowVersion:
          type: integer
          format: int64
          description: Versión de fila leída por el cliente (concurrencia optimista, AC4).
      required: [rowVersion]

    OtUserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OtUserItem"
      required: [data]

    SuspendOtUserRequest:
      type: object
      description: >
        HU #10619: `endsAt` es opcional. Con valor, es una suspensión temporal que se
        reactiva sola al vencer (comportamiento previo, sin cambios). Omitido/null,
        es una desactivación indefinida: el usuario queda bloqueado hasta que un
        administrador levante la restricción explícitamente (`DELETE .../suspend`).
      properties:
        reason: { type: string }
        endsAt: { type: string, format: date-time, nullable: true }
      required: [reason]

    DeleteOtUserRequest:
      type: object
      description: >
        HU #10623: elimina (soft-delete reversible) a un usuario del tenant OT.
        `rowVersion` es obligatorio (concurrencia optimista, el valor leído de
        `OtUserItem.rowVersion`).
      properties:
        rowVersion:
          type: integer
          format: int64
          description: Versión de fila leída por el cliente (concurrencia optimista).
      required: [rowVersion]

    DeleteUserRequest:
      type: object
      description: >
        HU #10623: elimina (soft-delete reversible) a un usuario. `rowVersion` es
        obligatorio (concurrencia optimista, el valor leído de
        `TenantUserDto.rowVersion`).
      properties:
        rowVersion:
          type: integer
          format: int64
          description: Versión de fila leída por el cliente (concurrencia optimista).
      required: [rowVersion]

    TenantUserItem:
      type: object
      description: >
        Usuario (activo, sin rol o invitación pendiente) del alcance del
        caller, o usuario eliminado cuando se lista con `?onlyDeleted=true`
        (#10624).
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { type: string, nullable: true }
        roleCode: { type: string, nullable: true }
        roleId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [active, inactive, pending]
        createdAt: { type: string, format: date-time, nullable: true }
        isSuspended: { type: boolean }
        tenantId: { type: string, format: uuid, nullable: true }
        tenantName: { type: string, nullable: true }
        rowVersion:
          type: integer
          format: int64
          description: >
            Versión de fila del usuario (#10621). Requerida para editar (PATCH
            /users/{userId}) con concurrencia optimista; 0 para invitaciones
            pendientes (no aplica edición de perfil).
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Fecha de eliminación (soft-delete, #10623). `null` en el listado
            normal; siempre poblado cuando se listó con `?onlyDeleted=true`
            (#10624).
      required: [id, fullName, email, status, isSuspended, rowVersion]

    AuditLogEntry:
      type: object
      description: Entrada del historial de auditoría de gobernanza (AC4).
      properties:
        entityName: { type: string }
        fieldName: { type: string }
        oldValue: { type: string, nullable: true }
        newValue: { type: string, nullable: true }
        changedBy: { type: string, format: uuid, nullable: true }
        changedAt: { type: string, format: date-time }
      required: [entityName, fieldName, changedAt]

    AuditLogPageResponse:
      type: object
      description: Página del historial de auditoría (AC4).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    AdminAuditLogEntry:
      type: object
      description: >
        Entrada del rastro unificado de auditoría administrativa/seguridad
        (HU #10679): config (RNF01/ADR-0024) + operaciones sobre usuarios, roles,
        permisos y autenticación (HU #10678).
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        tenantType:
          type: string
          nullable: true
          enum: [COMPANY, TRANSIT_OFFICE]
        module:
          type: string
          nullable: true
          enum: [users, roles, permissions, authentication, security, config]
        entityName: { type: string }
        operation: { type: string, nullable: true }
        result:
          type: string
          nullable: true
          enum: [success, failure]
        errorCode: { type: string, nullable: true }
        changedBy:
          type: string
          format: uuid
          nullable: true
          description: Usuario actor que ejecutó la operación.
        targetEntityType: { type: string, nullable: true }
        targetEntityId:
          type: string
          format: uuid
          nullable: true
          description: Usuario/rol/permiso afectado por la operación.
        clientIp: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
      required: [id, entityName, changedAt]

    AdminAuditLogPageResponse:
      type: object
      description: Página del rastro unificado de auditoría administrativa/seguridad (HU #10679).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditLogEntry"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    DocumentTypeResponse:
      type: object
      description: Tipo de documento del catálogo maestro (HU #10193).
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        estado:
          type: string
          enum: [activo, inactivo]
          description: Estado derivado de is_active (soft-delete).
        fechaCreacion: { type: string, format: date-time }
      required: [id, codigo, nombre, estado, fechaCreacion]

    DocumentTypePagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTypeResponse"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateDocumentTypeRequest:
      type: object
      description: Payload de alta (AC1).
      properties:
        codigo:
          type: string
          maxLength: 50
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9-]+$"
          description: Código único (letras, números y guiones).
        nombre:
          type: string
          maxLength: 150
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Nombre. Solo letras, números, espacios y puntuación básica (. , & ( ) / ' ° -).
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: Opcional. No permite los caracteres < ni >.
        obligatorio:
          type: boolean
          nullable: true
          description: >
            Aceptado por el AC pero NO persistido en el catálogo; la obligatoriedad
            vive por trámite en procedure_document_requirements (HU #10195).
      required: [codigo, nombre]

    UpdateDocumentTypeRequest:
      type: object
      description: Payload de actualización (AC3).
      properties:
        codigo:
          type: string
          maxLength: 50
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9-]+$"
          description: Código único (letras, números y guiones).
        nombre:
          type: string
          maxLength: 150
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Nombre. Solo letras, números, espacios y puntuación básica (. , & ( ) / ' ° -).
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: Opcional. No permite los caracteres < ni >.
      required: [codigo, nombre]

    DocumentRef:
      type: object
      description: Datos del tipo de documento asociado (join a document_types).
      properties:
        codigo: { type: string }
        nombre: { type: string }
        estado:
          type: string
          enum: [activo, inactivo]
      required: [codigo, nombre, estado]

    ProcedureDocumentRequirementResponse:
      type: object
      description: Asociación trámite ↔ documento (HU #10195).
      properties:
        id: { type: string, format: uuid }
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        ordenDefault: { type: integer, minimum: 0, maximum: 32767 }
        obligatorio: { type: boolean }
        documento:
          $ref: "#/components/schemas/DocumentRef"
      required: [id, procedureTypeId, documentTypeId, ordenDefault, obligatorio, documento]

    ProcedureDocumentRequirementList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureDocumentRequirementResponse"
      required: [data]

    CreateProcedureDocumentRequirementRequest:
      type: object
      description: Payload de alta de la asociación (AC1).
      properties:
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        ordenDefault: { type: integer, minimum: 0, maximum: 32767 }
        obligatorio: { type: boolean }
      required: [procedureTypeId, documentTypeId, ordenDefault, obligatorio]

    UpdateProcedureDocumentRequirementRequest:
      type: object
      description: Payload de actualización de la asociación (AC3).
      properties:
        ordenDefault: { type: integer, minimum: 0, maximum: 32767 }
        obligatorio: { type: boolean }
      required: [ordenDefault, obligatorio]

    OverrideDocumentRef:
      type: object
      description: Datos mínimos del documento (join a document_types).
      properties:
        codigo: { type: string }
        nombre: { type: string }
      required: [codigo, nombre]

    DocumentOrderOverrideResponse:
      type: object
      description: Override de orden documental por OT/Cliente (HU #10196).
      properties:
        id: { type: string, format: uuid }
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        scope:
          type: string
          enum: [OT, CLIENTE]
        scopeRefId:
          type: string
          format: uuid
          description: transitOfficeId (scope OT) o clienteId (scope CLIENTE).
        orden: { type: integer, minimum: 0, maximum: 32767 }
        documento:
          $ref: "#/components/schemas/OverrideDocumentRef"
      required: [id, procedureTypeId, documentTypeId, scope, scopeRefId, orden, documento]

    DocumentOrderOverrideList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentOrderOverrideResponse"
      required: [data]

    CreateDocumentOrderOverrideRequest:
      type: object
      description: >
        Payload unificado de alta de override (AC1/AC2). El scope viaja como query;
        según el scope se usa transitOfficeId (OT) o clienteId (CLIENTE).
      properties:
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        transitOfficeId:
          type: string
          format: uuid
          description: Obligatorio si scope=OT.
        clienteId:
          type: string
          format: uuid
          description: Obligatorio si scope=CLIENTE.
        orden: { type: integer, minimum: 0, maximum: 32767 }
      required: [procedureTypeId, documentTypeId, orden]

    UpdateDocumentOrderOverrideRequest:
      type: object
      description: >
        Payload del reordenamiento por arrastre de un override (HU #10198). Solo el orden
        es mutable; la tupla del override no cambia.
      properties:
        orden: { type: integer, minimum: 0, maximum: 32767 }
      required: [orden]

    DocumentRequirementState:
      type: string
      enum: [REQUIRED, OPTIONAL, NOT_APPLICABLE]
      description: >
        Obligatoriedad de un documento para un OT: REQUIRED (obligatorio), OPTIONAL
        (opcional) o NOT_APPLICABLE (no aplica → se oculta de la matriz de ese OT).

    SetDocumentRequirementOverrideRequest:
      type: object
      description: >
        Upsert por tupla natural (trámite, documento, OT) de la obligatoriedad por OT
        (HU #10198). estado=DEFAULT limpia el override (hereda el default del trámite).
      properties:
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        transitOfficeId: { type: string, format: uuid }
        estado:
          type: string
          enum: [REQUIRED, OPTIONAL, NOT_APPLICABLE, DEFAULT]
      required: [procedureTypeId, documentTypeId, transitOfficeId, estado]

    DocumentRequirementOverrideResponse:
      type: object
      description: Override de obligatoriedad por OT (HU #10198).
      properties:
        id: { type: string, format: uuid }
        procedureTypeId: { type: string, format: uuid }
        documentTypeId: { type: string, format: uuid }
        transitOfficeId: { type: string, format: uuid }
        estado: { $ref: "#/components/schemas/DocumentRequirementState" }
        documento:
          type: object
          properties:
            codigo: { type: string }
            nombre: { type: string }
          required: [codigo, nombre]
      required: [id, procedureTypeId, documentTypeId, transitOfficeId, estado, documento]

    DocumentRequirementOverrideList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRequirementOverrideResponse"
      required: [data]

    ResolvedDocumentMatrixRow:
      type: object
      description: Fila de la matriz documental resuelta (RF18).
      properties:
        documentTypeId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        obligatorio: { type: boolean }
        ordenResuelto: { type: integer, minimum: 0, maximum: 32767 }
        nivelAplicado:
          type: string
          enum: [CLIENTE, OT, DEFAULT]
          description: Nivel que ganó la precedencia.
      required: [documentTypeId, codigo, nombre, obligatorio, ordenResuelto, nivelAplicado]

    ResolvedDocumentMatrix:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedDocumentMatrixRow"
      required: [data]

    CreateProcedureInstanceRequest:
      type: object
      properties:
        procedureTypeId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        transitOfficeId:
          type: string
          format: uuid
          nullable: true
          description: Organismo de tránsito (nivel OT) — opcional, afecta la precedencia.
        referenceNumber:
          type: string
          maxLength: 30
          description: Número de referencia del trámite, único por cliente.
        createdByUserId:
          type: string
          format: uuid
          nullable: true
          description: Usuario creador; si se omite, se resuelve del JWT (sub).
      required: [procedureTypeId, tenantId, referenceNumber]

    ProcedureInstanceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        status: { type: string, example: draft }
        snapshotAt: { type: string, format: date-time }
        documentCount: { type: integer, description: Documentos congelados en el snapshot. }
      required: [id, referenceNumber, status, snapshotAt, documentCount]

    ProcedureInstanceSummary:
      type: object
      description: Resumen de una instancia de trámite (devuelto por finalize-draft y submit).
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string }
        status: { type: string, example: draft }
        procedureTypeId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: Fecha de radicación (Draft→Submitted). Null mientras es borrador.
        plateFlowStatus:
          type: string
          nullable: true
          enum: [preasignado, asignado]
          description: >
            Feature #10587 / HU #10785 — sub-estado interno de la ruta de placa, ortogonal al status
            global (que permanece en 'entregado'): null (sin ruta de placa), 'preasignado' (entregado
            al OT, esperando placa) o 'asignado' (placa registrada; pendiente de SOAT + recepción del OT).
        draftFinalizedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            HU #10349 — fecha en que el borrador se finalizó (datos completos a la espera de la
            validación de identidad async). Null si el borrador no se ha finalizado.
      required: [id, referenceNumber, status, procedureTypeId, tenantId, createdAt]

    ProcedureDocumentRequirementSnapshotRow:
      type: object
      properties:
        documentTypeId: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        obligatorio: { type: boolean }
        ordenResuelto: { type: integer }
        nivelAplicado:
          type: string
          enum: [CLIENTE, OT, DEFAULT]
          description: Nivel que determinó el orden en el momento de creación.
      required: [documentTypeId, codigo, nombre, obligatorio, ordenResuelto, nivelAplicado]

    ProcedureDocumentRequirementSnapshotList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureDocumentRequirementSnapshotRow"
      required: [data]

    # ── Validación de identidad / Kyverum Verify (HU #10233) ──────────────────
    StuckIdentityValidation:
      type: object
      description: >
        Validación de identidad atascada (dead-letter), de cualquiera de las dos colas: el ENVÍO al proveedor
        (kind=envio, validación en error_envio) o el ENCADENAMIENTO async firma/FUR (kind=encadenamiento,
        outbox de completado). Incluye nombre y documento de la persona validada (vista autenticada del
        gestor; la UI enmascara el documento a los últimos 4) para saber de quién es. No expone el payload.
      required: [id, validationId, eventType, attempts, occurredAt, createdAt, kind]
      properties:
        id: { type: string, format: uuid }
        validationId:
          type: string
          format: uuid
          description: Validación biométrica de origen (procedure_instance_biometric_validations.id).
        kind:
          type: string
          enum: [envio, encadenamiento]
          description: >
            Cola en dead-letter: `envio` = el envío al proveedor (Kyverum) agotó reintentos
            (estado error_envio); `encadenamiento` = el encadenamiento async firma/FUR agotó reintentos.
        eventType: { type: string, example: identity_validation.completed }
        attempts:
          type: integer
          description: Intentos de entrega consumidos (>= maxDeliveryAttempts ⇒ dead-letter).
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        name:
          type: string
          nullable: true
          description: Nombre de la persona validada (null si la validación ya no existe).
        documentType:
          type: string
          nullable: true
          description: Tipo de documento (CC, CE…). Null si la validación ya no existe.
        documentNumber:
          type: string
          nullable: true
          description: Documento completo (la UI lo enmascara a los últimos 4). Null si ya no existe.
    StuckIdentityValidationsResponse:
      type: object
      description: Eventos de validación de identidad atascados (dead-letter) del tenant (HU #10349).
      required: [stuck, total, maxDeliveryAttempts]
      properties:
        stuck:
          type: array
          items:
            $ref: "#/components/schemas/StuckIdentityValidation"
        total:
          type: integer
          description: Cantidad de eventos atascados devueltos (acotado a 200 filas).
        maxDeliveryAttempts:
          type: integer
          description: Tope de reintentos a partir del cual un evento se considera dead-letter.
    ActorContactLookupResponse:
      type: object
      description: >
        Datos de CONTACTO ya conocidos de una persona (HU #10955). NUNCA incluye nombre ni documento
        — esos siempre vienen del RUNT en vivo. Los cuatro campos van en null si la persona nunca ha
        sido actor de un trámite del tenant (AC3).
      properties:
        ciudad:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
    EnsureIdentityResult:
      type: object
      description: Desenlace de asegurar la identidad vigente de una parte (HU #10350).
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [ya_vigente, en_proceso, reusada, requiere_validacion, sin_actor]
          description: >
            `ya_vigente`/`en_proceso`: el trámite ya tiene una validación utilizable. `reusada`: se clonó
            una validación vigente de la persona. `requiere_validacion`: no hay vigente → enviar a validar.
            `sin_actor`: la parte aún no tiene actor con documento.
        validationId:
          type: string
          format: uuid
          nullable: true
          description: Id de la validación clonada cuando `outcome=reusada`.
    IniciarBiometriaInput:
      type: object
      required: [nombre, tipoDoc, documento, email]
      properties:
        parte:
          type: string
          enum: [comprador, vendedor]
          nullable: true
          description: Parte del trámite (vacío/null en matrícula inicial).
        nombre: { type: string }
        tipoDoc: { type: string, example: CC }
        documento: { type: string }
        email: { type: string, format: email }
    BiometricValidationDto:
      type: object
      required: [id, status, intentos, maxIntentos, expiresAt, expired, provider]
      properties:
        id: { type: string, format: uuid }
        partyRole: { type: string, nullable: true }
        name: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        email: { type: string }
        status:
          type: string
          enum: [enviado, en_proceso, aprobado, rechazado, expirado, pendiente_envio, error_envio]
        intentos: { type: integer }
        maxIntentos: { type: integer }
        score: { type: integer, nullable: true }
        expiresAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        provider:
          type: string
          enum: [mock, kyverum]
          description: Proveedor de la validación (HU #10233).
        captureUrl:
          type: string
          nullable: true
          description: URL de captura de Kyverum. Solo presente con provider=kyverum y estado=en_proceso (AC9).
        rejectionReason:
          type: string
          nullable: true
          description: >
            Motivo de rechazo SANITIZADO (sin PII), solo presente con status=rechazado (HU #10234 AC4).
            Para mock proviene del scorer; para Kyverum se deriva de las coincidencias del payload.
    TenantBiometricValidationDto:
      type: object
      required: [id, name, documentType, documentNumber, status, provider, expired, createdAt, email, attempts, maxAttempts, resendCount, linkedProcedures]
      description: Fila de la vista transversal del submódulo de Validaciones (HU #10234).
      properties:
        id: { type: string, format: uuid }
        instanceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Instancia (trámite) a la que pertenece la validación (para navegar). Null para
            prevalidaciones standalone (HU #10865/#10867).
        referenceNumber:
          type: string
          nullable: true
          description: >
            Referencia del trámite (p.ej. TRM-2026-000007). Null para prevalidaciones standalone.
        modalidad:
          type: string
          nullable: true
          description: >
            Modalidad de entrada del trámite (matricula_inicial | traspaso). Null para prevalidaciones
            standalone.
        partyRole: { type: string, nullable: true }
        name: { type: string }
        documentType: { type: string }
        documentNumber:
          type: string
          description: Documento de la persona (la UI lo enmascara al pintarlo).
        status:
          type: string
          enum: [enviado, en_proceso, aprobado, rechazado, expirado, pendiente_envio, error_envio]
        score: { type: integer, nullable: true }
        provider:
          type: string
          enum: [mock, kyverum]
        expired: { type: boolean }
        rejectionReason:
          type: string
          nullable: true
          description: Motivo de rechazo SANITIZADO (sin PII), solo con status=rechazado.
        createdAt: { type: string, format: date-time }
        validatedAt: { type: string, format: date-time, nullable: true }
        email:
          type: string
          format: email
          description: >
            CF-05 (Feature #11004) — correo de la validación. Vista autenticada del gestor del tenant
            (D3): completo, sin enmascarar. Solo visible en Validaciones y Prevalidaciones — no en
            exports/Dashboard.
        attempts:
          type: integer
          description: Intentos ya realizados (CF-06, Feature #11004).
        maxAttempts:
          type: integer
          description: Tope de intentos permitidos.
        resendCount:
          type: integer
          description: Veces que se reenvió la validación (HU #10943).
        lastResentAt:
          type: string
          format: date-time
          nullable: true
          description: Momento del último reenvío. Null si nunca se ha reenviado.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: >
            Fin de vigencia de la identidad APROBADA (validatedAt + 30 días, medianoche Colombia). La
            estampa el código al aprobar. Null si no hay aprobación (HU #10350).
        daysRemaining:
          type: integer
          nullable: true
          description: >
            Días calendario restantes de vigencia (0 = vencida). Se calcula al vuelo contra HOY, no se
            persiste. Null si no hay aprobación (HU #10350).
        linkedProcedures:
          type: array
          description: >
            Feature #11066 — otros trámites del tenant con validaciones de la misma identidad (documento).
            El trámite primario sigue en instanceId/referenceNumber.
          items:
            $ref: "#/components/schemas/LinkedProcedureDto"
    LinkedProcedureDto:
      type: object
      required: [instanceId, referenceNumber, status]
      properties:
        instanceId: { type: string, format: uuid }
        referenceNumber: { type: string }
        status: { type: string }
    BiometricValidationStatsDto:
      type: object
      required: [total, aprobadas, enProceso, rechazadas, expiradas]
      description: KPIs agregados del submódulo de Validaciones (exactos, sin el cap de filas).
      properties:
        total: { type: integer }
        aprobadas: { type: integer }
        enProceso:
          type: integer
          description: Validaciones en curso (enviado + en_proceso).
        rechazadas: { type: integer }
        expiradas: { type: integer }
    TenantBiometricValidationsResponse:
      type: object
      required: [validations, stats, page, pageSize, total]
      properties:
        validations:
          type: array
          description: Filas de la PÁGINA pedida (no todo el conjunto).
          items:
            $ref: "#/components/schemas/TenantBiometricValidationDto"
        stats:
          $ref: "#/components/schemas/BiometricValidationStatsDto"
        page:
          type: integer
          description: Página devuelta (1-based).
        pageSize:
          type: integer
          description: Filas por página efectivas (acotadas a [10, 50]).
        total:
          type: integer
          description: Total de filas del conjunto filtrado completo (para calcular el nº de páginas).
    IdentityAuditEventDto:
      type: object
      required: [occurredAt, stage, outcome]
      description: Una fila de la bitácora de identidad, expuesta a la API (sin secretos ni PII).
      properties:
        occurredAt: { type: string, format: date-time }
        stage:
          type: string
          description: >
            send|send_response|send_error|webhook_received|webhook_not_verifiable|
            webhook_signature_invalid|webhook_applied|reconcile
        outcome: { type: string }
        httpStatus: { type: integer, nullable: true }
        signaturePresent: { type: boolean, nullable: true }
        secretPresent: { type: boolean, nullable: true }
        decryptOk: { type: boolean, nullable: true }
        providerStatus: { type: string, nullable: true }
        errorType: { type: string, nullable: true }
        message: { type: string, nullable: true }
    IdentityAuditResponse:
      type: object
      required: [validationId, events]
      description: >
        Respuesta de la bitácora (CF-07, Feature #11004). referencedFromOtherProcedure = true cuando la
        identidad está reutilizada de OTRO trámite del mismo cliente (solo aplica al endpoint por-instancia;
        el endpoint por-validationId no tiene ese contexto y siempre reporta false).
      properties:
        validationId: { type: string, format: uuid }
        referencedFromOtherProcedure:
          type: boolean
          default: false
        events:
          type: array
          items:
            $ref: "#/components/schemas/IdentityAuditEventDto"
    IniciarKyverumVerifyResult:
      type: object
      required: [validation, captureUrl]
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          description: URL que abre el participante para completar la validación en Kyverum (vacía si `queued`).
        queued:
          type: boolean
          default: false
          description: >
            true = el envío falló transitoriamente y quedó encolado para reintento (estado `pendiente_envio`).

    IniciarPrevalidacionRequest:
      type: object
      required: [documentType, documentNumber, name, email]
      description: >
        Entrada para crear una prevalidación de identidad standalone (sin trámite) — HU #10866, CF-01.
        Para persona jurídica (personType='juridical') se requieren los campos legalRep*.
      properties:
        documentType:
          type: string
          maxLength: 20
          example: "CC"
          description: Tipo de documento de la persona (CC, CE, NIT, PP…)
        documentNumber:
          type: string
          maxLength: 40
          example: "1234567890"
        name:
          type: string
          maxLength: 200
          description: Nombre completo de la persona (o razón social si es jurídica).
        email:
          type: string
          format: email
          maxLength: 320
          description: Correo al que se envía el enlace de captura.
        personType:
          type: string
          enum: [natural, juridical]
          default: natural
          description: >
            'natural' → valida al titular; 'juridical' → valida al representante legal
            (campos legalRep* requeridos si personType='juridical').
        legalRepDocumentType:
          type: string
          maxLength: 20
          nullable: true
          description: Tipo de documento del representante legal.
        legalRepDocumentNumber:
          type: string
          maxLength: 40
          nullable: true
        legalRepName:
          type: string
          maxLength: 200
          nullable: true
        legalRepEmail:
          type: string
          format: email
          maxLength: 320
          nullable: true
          description: Correo del RL. Si vacío se usa el email de la empresa.

    IniciarPrevalidacionResult:
      type: object
      required: [validation, captureUrl]
      description: Resultado de crear una prevalidación standalone — HU #10866, CF-01.
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          description: >
            URL de captura. Kyverum → URL real del proveedor. Mock → magic-link público.
            Vacío si queued=true (fallo transitorio).
        queued:
          type: boolean
          default: false
          description: >
            true = el proveedor Kyverum falló de forma transitoria y la validación quedó
            encolada para reintento automático (estado pendiente_envio, HTTP 202).

    EditarPrevalidacionRequest:
      type: object
      description: >
        Edición de una prevalidación standalone — HU #10943, CF-03, D7. Todos los campos son
        opcionales; documentType/documentNumber/legalRepDocumentType/legalRepDocumentNumber solo
        existen para DETECTAR un intento de cambiarlos (→ 422 documento_no_editable), nunca se
        persisten.
      properties:
        name:
          type: string
          maxLength: 200
          nullable: true
          description: Nuevo nombre del titular (persona natural o razón social).
        email:
          type: string
          format: email
          maxLength: 320
          nullable: true
          description: Nuevo correo del titular. Si difiere del actual, dispara el reenvío automático (D8).
        legalRepName:
          type: string
          maxLength: 200
          nullable: true
          description: Nuevo nombre del representante legal (solo persona jurídica).
        legalRepEmail:
          type: string
          format: email
          maxLength: 320
          nullable: true
          description: >
            Nuevo correo del representante legal (solo persona jurídica). Si difiere del actual,
            dispara el reenvío automático dirigido al RL (D8, AC3).
        documentType:
          type: string
          maxLength: 20
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).
        documentNumber:
          type: string
          maxLength: 40
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).
        legalRepDocumentType:
          type: string
          maxLength: 20
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).
        legalRepDocumentNumber:
          type: string
          maxLength: 40
          nullable: true
          description: NO editable. Presente solo para detectar el intento (→ 422).

    EditarPrevalidacionResult:
      type: object
      required: [validation, resent]
      description: Resultado de editar una prevalidación standalone — HU #10943, CF-03.
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          nullable: true
          description: >
            Enlace de captura NUEVO, solo si resent=true y el envío no quedó encolado (fallo
            transitorio del proveedor). Null si resent=false (no hubo cambio de correo).
        resent:
          type: boolean
          description: >
            true si el cambio de correo disparó el reenvío automático (D8); false si solo cambió
            el nombre (o ningún dato de contacto).

    ReenviarPrevalidacionResult:
      type: object
      required: [validation, captureUrl]
      description: Resultado de reenviar manualmente una prevalidación standalone — HU #10943, CF-03.
      properties:
        validation:
          $ref: "#/components/schemas/BiometricValidationDto"
        captureUrl:
          type: string
          description: >
            URL de captura NUEVA. Kyverum → URL real del proveedor. Mock → magic-link público.
            Vacío si queued=true (fallo transitorio).
        queued:
          type: boolean
          default: false
          description: >
            true = el proveedor Kyverum falló de forma transitoria y la validación quedó encolada
            para reintento automático (estado pendiente_envio, HTTP 202). El reenvío YA consumió
            cupo del tope (D10) aunque el envío no se completó.

    KyverumWebhookPayload:
      type: object
      required: [evento, data]
      properties:
        evento:
          type: string
          enum: [validation.completed, validation.rejected]
        requestId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        data:
          type: object
          required: [aprobado]
          properties:
            aprobado:
              type: boolean
              description: true = identidad aprobada; false = rechazada.
            closedAt:
              type: string
              format: date-time
            subjects:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  rol: { type: string }
                  documento: { type: string }
                  status: { type: string, enum: [aprobado, rechazado] }
                  score: { type: integer }
                  firmaSerie: { type: string }
                  coincidencias:
                    type: object
                    properties:
                      documento: { type: boolean }
                      nombre: { type: boolean }

    StatusCount:
      type: object
      description: Conteo de trámites en un estado dentro de una categoría.
      properties:
        status: { type: string, example: submitted }
        count: { type: integer, example: 40 }
      required: [status, count]

    CategoryMetrics:
      type: object
      description: Métricas de una categoría (matriculas/traspasos/otros).
      properties:
        category: { type: string, enum: [matriculas, traspasos, otros] }
        total: { type: integer, example: 120 }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
      required: [category, total, byStatus]

    AnalyticsOverviewResponse:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryMetrics"
      required: [tenantId, from, to, categories]

    TopProducer:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, example: "Ana Pérez" }
        submittedCount: { type: integer, example: 40 }
        approvedCount: { type: integer, example: 12 }
        rejectedCount: { type: integer, example: 3 }
      required: [userId, displayName, submittedCount, approvedCount, rejectedCount]

    TopProducersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopProducer"
      required: [items]

    ProcedureDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        referenceNumber: { type: string, example: "TRM-2026-000008" }
        procedureTypeName: { type: string, example: "Matrícula nueva de vehículo" }
        category: { type: string, enum: [matriculas, traspasos, otros] }
        status: { type: string, example: submitted }
        createdByDisplayName: { type: string, example: "Ana Pérez" }
        submittedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
      required: [id, referenceNumber, procedureTypeName, category, status, createdByDisplayName]

    ProcedureDetailsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureDetail"
        totalCount: { type: integer, example: 1268 }
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
      required: [items, totalCount, page, pageSize]

    ExecutivePdfRequest:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        tenantId: { type: string, format: uuid, nullable: true, description: "Solo SuperAdmin." }
      required: [from, to]

    GenerarImprontaRequest:
      type: object
      description: >
        Datos del vehículo y de la organización solicitante para generar el Certificado de
        Improntas Digitales (Res. 17145/2023). Placa y documento son obligatorios; Kyverum RUNT
        resuelve motor/chasis/serie internamente vía placa+documento cuando no se envían
        (verificado contra el proveedor real). El certificado siempre imprime los tres bloques,
        marcando "(SIN DATO)" los que no se resuelvan.
      properties:
        placa: { type: string }
        documento:
          type: string
          description: >
            Documento de identidad del propietario del vehículo. Requerido por Kyverum RUNT para
            toda consulta por placa (no documentado originalmente en el contrato del proveedor).
        numMotor: { type: string, nullable: true }
        numChasis: { type: string, nullable: true }
        numSerie: { type: string, nullable: true }
        marca: { type: string, nullable: true }
        linea: { type: string, nullable: true }
        modelo: { type: string, nullable: true }
        orgNombre: { type: string }
        orgNit: { type: string, nullable: true }
        orgCiudad: { type: string, nullable: true }
        operador: { type: string }
      required: [placa, documento, orgNombre, operador]

    # ──────────────────────────────────────────────────────────────────────────
    # Reportes 2.0 — métricas (§4 del contrato docs/contratos-reportes-v2.md)
    # ──────────────────────────────────────────────────────────────────────────

    EstadoTramiteN03:
      type: string
      description: Estado de negocio N03 del ciclo de vida del trámite (ADR-0022, vocabulario en español).
      enum: [borrador, anulado, preparado, entregado, aprobado, rechazado]

    ComparisonInfo:
      type: object
      description: >
        Metadato de la ventana de comparación aplicada (`compareWith`): `previous_period` =
        ventana de la misma duración inmediatamente anterior a `from`; `previous_year` = mismas
        fechas un año atrás. La variación porcentual la calcula el frontend.
      properties:
        mode: { type: string, enum: [previous_period, previous_year] }
        from: { type: string, format: date }
        to: { type: string, format: date }
      required: [mode, from, to]

    OtMetricsSummary:
      type: object
      description: KPIs de cabecera de la pestaña Organismo de Tránsito.
      properties:
        entregados:
          type: integer
          description: Transiciones a `entregado` dentro del rango (por `changed_at`).
        aprobados: { type: integer }
        rechazados: { type: integer }
        rejectionRatePct:
          type: number
          description: rechazados / (aprobados + rechazados) * 100.
        avgApprovalHours:
          type: number
          nullable: true
          description: >
            Horas entre la ÚLTIMA transición a `entregado` y la siguiente decisión
            (aprobado/rechazado) de la misma instancia, decidida dentro del rango. Null sin decididos.
        p50ApprovalHours: { type: number, nullable: true }
        p90ApprovalHours: { type: number, nullable: true }
        reincidencePct:
          type: number
          description: Porcentaje de rechazados que volvieron a borrador.
        stuckCount: { type: integer }
      required: [entregados, aprobados, rechazados, rejectionRatePct, avgApprovalHours, p50ApprovalHours, p90ApprovalHours, reincidencePct, stuckCount]

    RejectionByOfficeItem:
      type: object
      description: Tasa de rechazo por Organismo de Tránsito.
      properties:
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        entregados: { type: integer }
        aprobados: { type: integer }
        rechazados: { type: integer }
        rejectionRatePct: { type: number }
      required: [transitOfficeId, transitOfficeName, entregados, aprobados, rechazados, rejectionRatePct]

    RejectionByReasonItem:
      type: object
      description: Distribución de causales de rechazo (texto libre de `reason`).
      properties:
        reason: { type: string, example: Documento ilegible }
        count: { type: integer }
        pct: { type: number }
      required: [reason, count, pct]

    RejectionByTypeItem:
      type: object
      description: Tasa de rechazo por tipo de trámite.
      properties:
        procedureTypeId: { type: string, format: uuid }
        procedureTypeName: { type: string }
        entregados: { type: integer }
        rechazados: { type: integer }
        rejectionRatePct: { type: number }
      required: [procedureTypeId, procedureTypeName, entregados, rechazados, rejectionRatePct]

    ApprovalTimesByOfficeItem:
      type: object
      description: Tiempos entregado→decisión por OT (avg/p50/p90 en horas).
      properties:
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        decididos: { type: integer }
        avgHours: { type: number, nullable: true }
        p50Hours: { type: number, nullable: true }
        p90Hours: { type: number, nullable: true }
      required: [transitOfficeId, transitOfficeName, decididos, avgHours, p50Hours, p90Hours]

    OfficeRankingItem:
      type: object
      description: >
        Ranking de agilidad de OTs: orden por p50 de horas de decisión ascendente, desempate por
        tasa de rechazo ascendente; solo OTs con al menos un trámite decidido.
      properties:
        transitOfficeId: { type: string, format: uuid }
        transitOfficeName: { type: string }
        rank: { type: integer, example: 1 }
        p50Hours: { type: number }
        rejectionRatePct: { type: number }
        volumen: { type: integer }
      required: [transitOfficeId, transitOfficeName, rank, p50Hours, rejectionRatePct, volumen]

    ReincidenceInfo:
      type: object
      description: >
        Reincidencia: instancias con transición rechazado→borrador; ciclos = veces que la
        instancia pasó por `rechazado`.
      properties:
        rechazadas: { type: integer }
        reintentadas: { type: integer }
        avgCiclos: { type: number }
        maxCiclos: { type: integer }
      required: [rechazadas, reintentadas, avgCiclos, maxCiclos]

    StuckItem:
      type: object
      description: Trámite atascado (más de `stuckDays` días sin transición en estado no final).
      properties:
        instanceId: { type: string, format: uuid }
        referenceNumber: { type: string, example: "TRM-2026-000007" }
        status:
          $ref: "#/components/schemas/EstadoTramiteN03"
        daysInStatus: { type: number, example: 12.3 }
        transitOfficeName: { type: string, nullable: true }
        procedureTypeName: { type: string }
        createdByDisplayName: { type: string }
      required: [instanceId, referenceNumber, status, daysInStatus, transitOfficeName, procedureTypeName, createdByDisplayName]

    StuckInfo:
      type: object
      description: Atascados del universo filtrado; `items` trae el top 50 por días en el estado.
      properties:
        totalCount: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StuckItem"
      required: [totalCount, items]

    OtMetricsData:
      type: object
      description: Cuerpo de métricas OT de una ventana (current o previous).
      properties:
        summary:
          $ref: "#/components/schemas/OtMetricsSummary"
        rejectionByOffice:
          type: array
          items:
            $ref: "#/components/schemas/RejectionByOfficeItem"
        rejectionByReason:
          type: array
          items:
            $ref: "#/components/schemas/RejectionByReasonItem"
        rejectionByType:
          type: array
          items:
            $ref: "#/components/schemas/RejectionByTypeItem"
        approvalTimesByOffice:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalTimesByOfficeItem"
        officeRanking:
          type: array
          items:
            $ref: "#/components/schemas/OfficeRankingItem"
        reincidence:
          $ref: "#/components/schemas/ReincidenceInfo"
        stuck:
          $ref: "#/components/schemas/StuckInfo"
      required: [summary, rejectionByOffice, rejectionByReason, rejectionByType, approvalTimesByOffice, officeRanking, reincidence, stuck]

    OtMetricsResponse:
      type: object
      description: >
        Respuesta de `GET /analytics/ot-metrics` (§4.2). `previous` y `comparison` solo vienen
        con `compareWith`; el backend NO manda deltas (los calcula el frontend).
      properties:
        current:
          $ref: "#/components/schemas/OtMetricsData"
        previous:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OtMetricsData"
          description: Misma forma que `current` sobre la ventana comparada; null sin `compareWith`.
        comparison:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ComparisonInfo"
      required: [current, previous, comparison]

    WizardStepMetric:
      type: object
      description: >
        Métrica agregada de un paso del wizard (telemetría HU-A). abandonmentPct =
        (1 - completions/views) * 100 (0 si views = 0); duraciones desde `duration_ms` de
        `wizard_step_complete`.
      properties:
        stepKey: { type: string, example: comprador }
        views: { type: integer }
        completions: { type: integer }
        abandonmentPct: { type: number }
        avgDurationMs: { type: number, nullable: true }
        medianDurationMs: { type: number, nullable: true }
      required: [stepKey, views, completions, abandonmentPct, avgDurationMs, medianDurationMs]

    FunnelStage:
      type: object
      description: Etapa del funnel (instancias distintas que la alcanzaron dentro del rango).
      properties:
        stage:
          $ref: "#/components/schemas/EstadoTramiteN03"
        count: { type: integer }
        pctOfFirst:
          type: number
          description: Porcentaje sobre la primera etapa (borrador).
        pctOfPrev:
          type: number
          description: Porcentaje sobre la etapa anterior.
      required: [stage, count, pctOfFirst, pctOfPrev]

    FunnelData:
      type: object
      description: Cuerpo del funnel de una ventana (current o previous).
      properties:
        states:
          type: array
          description: Etapas borrador→preparado→entregado→aprobado (por `created_at` de la instancia).
          items:
            $ref: "#/components/schemas/FunnelStage"
        anulados: { type: integer }
        rechazadosVigentes:
          type: integer
          description: Rechazados cuyo estado ACTUAL sigue siendo rechazado.
        wizardSteps:
          type: array
          description: Métricas por paso del wizard; vacío si no hay telemetría.
          items:
            $ref: "#/components/schemas/WizardStepMetric"
      required: [states, anulados, rechazadosVigentes, wizardSteps]

    FunnelResponse:
      type: object
      description: Respuesta de `GET /analytics/funnel` (§4.3), con la misma envoltura comparada que ot-metrics.
      properties:
        current:
          $ref: "#/components/schemas/FunnelData"
        previous:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FunnelData"
        comparison:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ComparisonInfo"
      required: [current, previous, comparison]

    ModuleUsageItem:
      type: object
      description: Uso agregado de un módulo del aplicativo (`module_view` + `api_module_access`).
      properties:
        module: { type: string, example: tramites }
        events: { type: integer }
        uniqueUsers: { type: integer }
      required: [module, events, uniqueUsers]

    PeakHourItem:
      type: object
      description: Celda del heatmap de horas pico (hora America/Bogota), sobre TODOS los eventos.
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo … 6 = sábado.
        hour: { type: integer, minimum: 0, maximum: 23 }
        events: { type: integer }
      required: [dayOfWeek, hour, events]

    DocumentReplacementItem:
      type: object
      description: >
        Reemplazos de documentos por tipo. "Reemplazo" = filas adicionales con el mismo
        (instancia, tipo) en attachments más allá de la primera (orden por `uploaded_at`).
      properties:
        documentTipo: { type: string, example: cedula }
        uploads: { type: integer }
        replacements: { type: integer }
      required: [documentTipo, uploads, replacements]

    ExternalApiMetricItem:
      type: object
      description: >
        Llamadas a integraciones externas desde `admin.ot_api_call_logs`; errores =
        `response_code >= 400` o `error_message` no nulo.
      properties:
        endpoint: { type: string }
        direction: { type: string, example: outbound }
        calls: { type: integer }
        errors: { type: integer }
        errorRatePct: { type: number }
        avgDurationMs: { type: number, nullable: true }
        p90DurationMs: { type: number, nullable: true }
      required: [endpoint, direction, calls, errors, errorRatePct, avgDurationMs, p90DurationMs]

    UsageData:
      type: object
      description: Cuerpo de métricas de uso de una ventana (current o previous).
      properties:
        moduleUsage:
          type: array
          items:
            $ref: "#/components/schemas/ModuleUsageItem"
        wizardSteps:
          type: array
          items:
            $ref: "#/components/schemas/WizardStepMetric"
        peakHours:
          type: array
          items:
            $ref: "#/components/schemas/PeakHourItem"
        documentReplacements:
          type: array
          items:
            $ref: "#/components/schemas/DocumentReplacementItem"
        externalApis:
          type: array
          items:
            $ref: "#/components/schemas/ExternalApiMetricItem"
        avgWizardDurationMs:
          type: number
          nullable: true
          description: Duración media del wizard completo (ms); null sin datos.
        medianWizardDurationMs: { type: number, nullable: true }
      required: [moduleUsage, wizardSteps, peakHours, documentReplacements, externalApis, avgWizardDurationMs, medianWizardDurationMs]

    UsageResponse:
      type: object
      description: Respuesta de `GET /analytics/usage` (§4.4), con la misma envoltura comparada que ot-metrics.
      properties:
        current:
          $ref: "#/components/schemas/UsageData"
        previous:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/UsageData"
        comparison:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ComparisonInfo"
      required: [current, previous, comparison]

    LiveStatusCount:
      type: object
      description: Conteo por estado ACTUAL de instancias activas (no finales) del tenant.
      properties:
        status:
          $ref: "#/components/schemas/EstadoTramiteN03"
        count: { type: integer }
      required: [status, count]

    LiveTodayInfo:
      type: object
      description: Actividad de HOY (día calendario America/Bogota).
      properties:
        creados: { type: integer }
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/LiveStatusCount"
        entregados:
          type: integer
          description: Transiciones de hoy a `entregado`.
        aprobados: { type: integer }
        rechazados: { type: integer }
      required: [creados, byStatus, entregados, aprobados, rechazados]

    IntegrationsLastHourInfo:
      type: object
      description: Integraciones externas de la última hora.
      properties:
        calls: { type: integer }
        errors: { type: integer }
        avgDurationMs: { type: number, nullable: true }
      required: [calls, errors, avgDurationMs]

    LiveOverviewResponse:
      type: object
      description: Respuesta de `GET /analytics/live-overview` (§4.5). Sin envoltura comparada.
      properties:
        generatedAt: { type: string, format: date-time }
        today:
          $ref: "#/components/schemas/LiveTodayInfo"
        stuckCount: { type: integer }
        pendingIdentityValidations:
          type: integer
          description: Validaciones biométricas con estado pendiente/en proceso.
        integrationsLastHour:
          $ref: "#/components/schemas/IntegrationsLastHourInfo"
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
          description: Último cambio de estado o evento de telemetría; null si no hay actividad.
      required: [generatedAt, today, stuckCount, pendingIdentityValidations, integrationsLastHour, lastActivityAt]

    # ──────────────────────────────────────────────────────────────────────────
    # Reportes 2.0 — telemetría de uso (§4.6/§7 del contrato)
    # ──────────────────────────────────────────────────────────────────────────

    UsageEventType:
      type: string
      description: >
        Taxonomía CERRADA de eventos de telemetría (§7): los tipos desconocidos se descartan
        silenciosamente en el endpoint batch.
      enum:
        - module_view
        - api_module_access
        - wizard_server_view
        - wizard_step_view
        - wizard_step_complete
        - wizard_step_exit
        - wizard_abandon
        - wizard_complete

    UsageEventInput:
      type: object
      description: >
        Evento individual del lote. Sin tenant ni userId: SIEMPRE salen del JWT. `metadata` es
        un objeto JSON pequeño SIN PII (prohibido: nombres, documentos, emails, placas, VIN).
      properties:
        eventType:
          $ref: "#/components/schemas/UsageEventType"
        module: { type: string, nullable: true, maxLength: 40, example: tramites }
        stepKey: { type: string, nullable: true, maxLength: 40, example: comprador }
        procedureInstanceId: { type: string, format: uuid, nullable: true }
        durationMs:
          type: integer
          nullable: true
          minimum: 0
          description: Duración asociada (ms); negativa se descarta a null.
        occurredAt:
          type: string
          format: date-time
          nullable: true
          description: Instante del evento; ausente = now() del servidor.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: jsonb libre SIN PII; si no es un objeto (o es demasiado grande) colapsa a {}.
      required: [eventType]

    UsageEventBatchRequest:
      type: object
      description: Lote de eventos de telemetría del frontend (máx. 50; más → 400 en español).
      properties:
        events:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/UsageEventInput"
      required: [events]

    UsageEventBatchAcceptedResponse:
      type: object
      description: Resultado del encolado best-effort del lote de telemetría.
      properties:
        accepted:
          type: integer
          description: Eventos aceptados (los fuera de taxonomía o descartados por saturación no cuentan).
          example: 3
      required: [accepted]

    # ──────────────────────────────────────────────────────────────────────────
    # Reportes 2.0 — informes programados y alertas (§4.7/§8 del contrato)
    # ──────────────────────────────────────────────────────────────────────────

    ReportScheduleDto:
      type: object
      description: Informe programado (tabla `analytics.report_schedules`).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120, example: Informe semanal OT }
        reportType:
          type: string
          enum: [resumen, operacion, ot, uso, productividad]
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        dayOfWeek:
          type: integer
          nullable: true
          minimum: 0
          maximum: 6
          description: Solo weekly; 0 = domingo … 6 = sábado.
        dayOfMonth:
          type: integer
          nullable: true
          minimum: 1
          maximum: 28
          description: Solo monthly (1..28 para existir en todos los meses).
        sendHour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hora de envío (hora America/Bogota).
        format:
          type: string
          enum: [excel, pdf]
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean }
        lastSentAt: { type: string, format: date-time, nullable: true }
      required: [id, name, reportType, frequency, dayOfWeek, dayOfMonth, sendHour, format, recipients, isActive, lastSentAt]

    ReportScheduleInput:
      type: object
      description: >
        Alta/edición de un informe programado. Reglas: daily sin día; weekly requiere dayOfWeek
        (0-6) y sin dayOfMonth; monthly requiere dayOfMonth (1-28) y sin dayOfWeek; 1..10
        destinatarios válidos sin duplicados. Violaciones → 400 con detalle en español.
      properties:
        name: { type: string, maxLength: 120 }
        reportType:
          type: string
          enum: [resumen, operacion, ot, uso, productividad]
        frequency:
          type: string
          enum: [daily, weekly, monthly]
        dayOfWeek: { type: integer, nullable: true, minimum: 0, maximum: 6 }
        dayOfMonth: { type: integer, nullable: true, minimum: 1, maximum: 28 }
        sendHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 7
          description: Hora de envío (hora America/Bogota); ausente = 7.
        format:
          type: string
          enum: [excel, pdf]
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean, default: true }
      required: [name, reportType, frequency, format, recipients]

    ReportSchedulesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReportScheduleDto"
      required: [items]

    AlertRuleDto:
      type: object
      description: Regla de alerta por umbral (tabla `analytics.alert_rules`).
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120, example: Rechazo OT alto }
        metric:
          type: string
          enum: [rejection_rate_pct, stuck_count, external_api_errors, pending_identity_validations, ict_stuck_in_validation, ict_novelty_rate_pct, ict_webhook_delivery_failures, ict_jobs_out_of_sla]
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold: { type: number, example: 25.0 }
        windowMinutes:
          type: integer
          minimum: 5
          maximum: 43200
          description: Ventana de evaluación de la métrica (minutos).
        cooldownMinutes:
          type: integer
          minimum: 5
          maximum: 10080
          description: No re-disparar dentro del cooldown (minutos).
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean }
        lastTriggeredAt: { type: string, format: date-time, nullable: true }
      required: [id, name, metric, operator, threshold, windowMinutes, cooldownMinutes, recipients, isActive, lastTriggeredAt]

    AlertRuleInput:
      type: object
      description: >
        Alta/edición de una regla de alerta. `windowMinutes` ausente = 1440; `cooldownMinutes`
        ausente = 240; 1..10 destinatarios válidos. Violaciones → 400 con detalle en español.
      properties:
        name: { type: string, maxLength: 120 }
        metric:
          type: string
          enum: [rejection_rate_pct, stuck_count, external_api_errors, pending_identity_validations, ict_stuck_in_validation, ict_novelty_rate_pct, ict_webhook_delivery_failures, ict_jobs_out_of_sla]
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        threshold: { type: number }
        windowMinutes: { type: integer, minimum: 5, maximum: 43200, default: 1440 }
        cooldownMinutes: { type: integer, minimum: 5, maximum: 10080, default: 240 }
        recipients:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: email }
        isActive: { type: boolean, default: true }
      required: [name, metric, operator, threshold, recipients]

    AlertRulesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertRuleDto"
      required: [items]

    AlertEventDto:
      type: object
      description: Disparo registrado de una alerta (tabla `analytics.alert_events`).
      properties:
        id: { type: string, format: uuid }
        alertRuleId: { type: string, format: uuid }
        ruleName: { type: string }
        triggeredAt: { type: string, format: date-time }
        metricValue: { type: number, example: 31.2 }
        threshold: { type: number, example: 25.0 }
        notified:
          type: boolean
          description: true si el correo a los destinatarios se envió (best-effort).
        message: { type: string, nullable: true }
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: Momento del reconocimiento (null = sin reconocer).
        acknowledgedBy:
          type: string
          format: uuid
          nullable: true
          description: Usuario (claim sub) que reconoció el disparo.
      required: [id, alertRuleId, ruleName, triggeredAt, metricValue, threshold, notified, message, acknowledgedAt, acknowledgedBy]

    AlertEventsPageResponse:
      type: object
      description: Página del historial de disparos (más recientes primero).
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertEventDto"
        totalCount: { type: integer }
      required: [items, totalCount]
