name: Core API (.NET 10)

# Sin filtro `paths:` en el disparador: «core-api» es check OBLIGATORIO del ruleset, y un workflow que no
# se dispara deja el PR esperando ese check para siempre. Las rutas se evalúan en el job «cambios»; si el
# PR no toca core-api, las pruebas se saltan y el check «core-api» queda en verde.
# PRs a staging y release también: los ports *-qa / *-pdn pasan por las mismas pruebas.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, staging, release]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Etiqueta del runner (vacio = la variable RUNNER o ubuntu-latest; flit-ci = pool propio de la 177)'
        required: false
        default: ''

# Un push nuevo al mismo PR (o a la misma rama) cancela la corrida anterior: solo importa la última.
concurrency:
  group: core-api-${{ github.event.pull_request.number || github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # ¿El cambio toca core-api? Las mismas rutas que antes filtraba el disparador.
  cambios:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      core: ${{ steps.rutas.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: rutas
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENTO" in
            pull_request) archivos=$(git diff --name-only "origin/$BASE...HEAD") ;;
            push)
              if [ -z "$ANTES" ] || [ "$ANTES" = 0000000000000000000000000000000000000000 ] \
                 || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
                archivos=TODO   # rama nueva o historia reescrita: se corre todo
              else
                archivos=$(git diff --name-only "$ANTES" "$GITHUB_SHA")
              fi ;;
            *) archivos=TODO ;;
          esac
          # El catálogo del manual (dr-flit) es texto generado: no dispara la suite.
          if [ "$archivos" = TODO ] || echo "$archivos" | grep -v '^services/core-api/src/Flit.Api/Content/dr-flit/' | grep -qE \
               '^(services/core-(api|identity|consultas)/|contracts/proto/|contracts/openapi/(core-api\.v1\.yaml|external-api\.v1\.json)$|\.github/workflows/core-api\.yml$|\.github/scripts/ci-core-api-pruebas\.sh$)'; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "Toca core-api: corren las pruebas."
          else
            echo "core=false" >> "$GITHUB_OUTPUT"; echo "No toca core-api: se saltan las pruebas."
          fi

  # La suite se reparte en carriles que corren en paralelo, cada uno en su runner (antes era un solo
  # job de ~44 min, con timeout de 45). El camino crítico es «admin» (~22 min) hasta que se aligere su
  # arnés. Reparto y detalles en .github/scripts/ci-core-api-pruebas.sh.
  pruebas:
    name: pruebas (${{ matrix.nombre }})
    needs: cambios
    if: needs.cambios.outputs.core == 'true'
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: admin, carril: admin, shard: 0 }
          - { nombre: integration-0, carril: integration, shard: 0 }
          - { nombre: integration-1, carril: integration, shard: 1 }
          - { nombre: integration-2, carril: integration, shard: 2 }
          - { nombre: integration-3, carril: integration, shard: 3 }
          - { nombre: resto, carril: resto, shard: 0 }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flit_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # Puerto dinamico: en el pool propio el 5432 es del Postgres del host.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d flit_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Epic #13316 (HU #13338): broker real para las pruebas de la outbox del SDK y las de bus de
      # Integration. Usuario propio: guest solo entra desde loopback dentro del contenedor.
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: flit
          RABBITMQ_DEFAULT_PASS: flit-prueba
        ports: ['5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4

      - name: Conexiones a los servicios del job
        run: |
          echo "ConnectionStrings__Core=Host=localhost;Port=${{ job.services.postgres.ports['5432'] }};Database=flit_dev;Username=postgres;Password=postgres" >> "$GITHUB_ENV"
          echo "FLIT_TEST_RABBITMQ=amqp://flit:flit-prueba@localhost:${{ job.services.rabbitmq.ports['5672'] }}/" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/core-api/global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Apply migrations
        run: |
          # En una carpeta del runner y no en ~/.dotnet/tools: en el pool propio los runners comparten HOME.
          ef="${{ runner.tool_cache }}/dotnet-ef-10.0.1"
          [ -x "$ef/dotnet-ef" ] || dotnet tool install dotnet-ef --version 10.0.1 --tool-path "$ef"
          "$ef/dotnet-ef" database update \
            --project src/Flit.Infrastructure \
            --startup-project src/Flit.Api \
            --no-build --configuration Release

      - name: Test
        run: ../../.github/scripts/ci-core-api-pruebas.sh "${{ matrix.carril }}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '4'
          # La cobertura solo se recoge en push: en el PR alarga la corrida sin que nadie la mire.
          COBERTURA: ${{ github.event_name == 'push' && '1' || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-results-${{ matrix.nombre }}
          path: |
            services/core-api/tests/**/TestResults/
            services/core-api/TestResults-*.log

  # Check único y OBLIGATORIO (ruleset proteger-produccion): resume los carriles y el publish. En verde si
  # todo pasó o si el cambio no toca core-api; en rojo si algo falló o se canceló.
  core-api:
    if: always()
    needs: [cambios, pruebas, aot-publish]
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Resultado
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          CORE: ${{ needs.cambios.outputs.core }}
          PRUEBAS: ${{ needs.pruebas.result }}
          AOT: ${{ needs.aot-publish.result }}
        run: |
          echo "cambios=$CAMBIOS core=$CORE pruebas=$PRUEBAS aot-publish=$AOT"
          [ "$CAMBIOS" = success ] || { echo "::error::falló la detección de cambios"; exit 1; }
          if [ "$CORE" != true ]; then echo "El cambio no toca core-api: no aplica."; exit 0; fi
          [ "$PRUEBAS" = success ] && [ "$AOT" = success ]

  # No espera a las pruebas: corre en paralelo y solo comprueba que el publish siga funcionando.
  aot-publish:
    needs: cambios
    if: needs.cambios.outputs.core == 'true'
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/core-api/global.json

      # MVP Fase 11: JIT escape documentado (ADR-0002 §"AOT en .NET").
      # QuestPDF (Flit.Modules.Recibos) usa reflection + SkiaSharp y
      # aun no es AOT-compatible. Cuando lo sea (roadmap 2025) o se cambie
      # de motor PDF, volver a --self-contained con AOT.
      - name: Publish (linux-musl-x64, JIT)
        working-directory: services/core-api
        run: dotnet publish src/Flit.Api/Flit.Api.csproj -c Release -r linux-musl-x64 --self-contained -o publish /p:PublishAot=false
