openapi: 3.0.3
info:
  title: FLIT Suite — API de Diagnóstico Vehicular
  version: "1.0.0"
  description: >
    Endpoints REST del producto Diagnóstico (core-diagnostico) bajo /api/v1/diagnostico, plan
    docs/diagnosticos/plan-implementacion-diagnostico-vehicular-v2.md §6.1. La app web llega por el
    gateway con el token del producto (aud=diagnostico). Una sesión = una compañía (D-03): la compañía
    sale siempre del token y ningún parámetro la cambia. Los permisos tienen el formato
    diagnostico.<modulo>.<accion> (§6.2) y se registran con el manifiesto del producto
    (PUT /api/v1/platform/products/diagnostico/manifest, ver platform.v1.yaml). Diagnóstico no publica
    rutas para crear o modificar compañías, usuarios, roles ni suscripciones (R-4). Los errores de
    regla responden { code, error } con un code estable. Toda ruta bajo /api/v1/diagnostico pasa por el
    guard de suscripción (HU #13726): si la compañía del token no tiene Diagnóstico activo, o no se puede
    verificar con Identidad (fail-closed), responde 403 con code PRODUCTO_NO_HABILITADO. /health y
    /health/ready no pasan por el guard.
  license:
    name: Propietario FLIT
    url: https://flitsas.com

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4029
    description: Local (core-diagnostico)

security:
  - bearerAuth: []

tags:
  - name: Sesion
    description: Lo que la app necesita al abrir.
  - name: Configuracion
    description: >
      Configuración de Diagnóstico en dos niveles (D-04, HU #13741): el contractual lo edita solo el backoffice
      FLIT y el operativo el admin de la compañía. Los valores son los códigos de la base (RUNT, EMPRESA,
      NO_MOSTRAR...) y los campos van en snake_case.
  - name: Catalogos
    description: Catálogos de la plataforma que Diagnóstico ofrece (tipos de trámite de Trámites).
  - name: Diagnosticos
    description: >
      Cabecera del diagnóstico (MOD01, HU #13750): nombre, modo, tipo de trámite y alcance sobre una copia fija de la
      configuración de la compañía. Campos en snake_case y códigos de la base.
  - name: Carga
    description: >
      Carga masiva de vehículos (MOD02, HU #13749): plantilla .xlsx y análisis local del archivo (.xlsx o .csv) en un
      resumen de validación, sin guardar filas ni consultar fuentes. Campos en snake_case y códigos de la base.
  - name: Vehiculos
    description: >
      Confirmación de los vehículos del lote (MOD02, HU #13751): revalidación en servidor, documento del locatario
      cifrado y entrega de la lista limpia al motor de consultas. Campos en snake_case y códigos de la base.
  - name: Express
    description: >
      Diagnóstico Express de un solo vehículo (MOD02, HU #13753): cabecera y vehículo en una transacción, con las mismas
      reglas de la cabecera y de la confirmación, y el estimado de vista previa. Campos en snake_case y códigos de la base.
  - name: Backoffice
    description: >
      Lectura entre compañías del backoffice FLIT (D-16, ADR-0073): permiso diagnostico.backoffice.ver y
      tenant_type=FLIT a la vez, empresa explícita y auditoría de cada lectura.

paths:
  /api/v1/diagnostico/sesion:
    get:
      tags: [Sesion]
      operationId: obtenerSesionDiagnostico
      summary: Sesión del usuario en Diagnóstico
      description: >
        Usuario, compañía, roles, permisos de Diagnóstico y capacidades, todo leído del token (HU #13724).
        Usuario del producto (política diagnostico.usuario): al menos un permiso diagnostico.* o SuperAdmin;
        un token de servicio o un rol de otro producto sin permisos de Diagnóstico recibe 403 (HU #13726). No acepta parámetros: si llega un parámetro o la cabecera X-Flit-Tenant-Id con otra
        compañía, se ignora. `permisos` solo trae slugs diagnostico.* (el token también lleva los de
        plataforma). Las capacidades del backoffice FLIT exigen además tenant_type=FLIT (D-16).
      responses:
        "200":
          description: Sesión de la compañía del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Token de servicio o usuario sin permisos de Diagnóstico; usuario sin compañía (`code` = SIN_EMPRESA);
            compañía sin Diagnóstico activo o suscripción no verificable (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/configuracion:
    get:
      tags: [Configuracion]
      operationId: obtenerConfiguracionDiagnostico
      summary: Configuración de la compañía del token (dos niveles)
      description: >
        Permiso diagnostico.configuracion.ver. Devuelve el nivel contractual marcado de solo lectura y el
        operativo de la compañía del token (HU #13741). Nunca trae redaccion_ia_suspendida ni el autor de los
        cambios contractuales. Sin fila guardada devuelve los valores por defecto (RUNT, 500, EMPRESA, RUNT,
        NO_MOSTRAR) sin escribir.
      responses:
        "200":
          description: Configuración de la compañía del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.configuracion.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Configuracion]
      operationId: editarConfiguracionOperativa
      summary: Edita el nivel operativo de la compañía del token
      description: >
        Permiso diagnostico.configuracion.editar. Solo visibilidad_usuario, fuentes_por_defecto y
        estimado_consultas; se guardan los campos que llegan, con el usuario y la fecha (sin fila, la crea con
        los valores contractuales por defecto). Orden de validación: un campo que no es operativo (los
        contractuales, redaccion_ia_suspendida, usuarios, roles, suscripción o cualquier otro) responde 403
        CAMPO_NO_EDITABLE y no guarda ningún campo; un valor fuera de su conjunto responde 422
        VALOR_FUERA_DE_CONJUNTO; una fuente por defecto que no está habilitada, 422
        POR_DEFECTO_FUERA_DE_HABILITADAS. Una regla de la base que aun así falle (CHECK, SQLSTATE 23514)
        responde 422 VALOR_INVALIDO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionOperativa"
      responses:
        "200":
          description: Configuración guardada (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracion"
        "400":
          description: El cuerpo no es un objeto JSON o repite un campo (`code` = CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.configuracion.editar (sin cuerpo); campo no operativo (`code` = CAMPO_NO_EDITABLE);
            sin usuario (`code` = SIN_USUARIO), sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico
            activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, POR_DEFECTO_FUERA_DE_HABILITADAS o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/tipos-tramite:
    get:
      tags: [Catalogos]
      operationId: listarTiposTramiteDiagnostico
      summary: Tipos de trámite de la etapa (modo Con Análisis IA)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13742). Proxy del rpc ListarTiposTramite de
        flit.tramites.v1.CatalogosService (core-api, token de servicio svc-diagnostico con scope
        platform.tramites.catalogos). Solo los tipos publicados cuyo código está en la lista blanca
        Diagnostico:TiposTramite:Habilitados (TRASPASO_STANDARD, TRASPASO_UNILATERAL,
        TRASPASO_TRANSFERENCIA_DE_DOMINIO), filtrados por código y nunca por nombre, en el orden de la
        publicación. Catálogo global, igual para toda compañía. La última respuesta correcta se guarda 5
        minutos; con esa copia vigente no se llama al rpc. Si el rpc falla con Unavailable o DeadlineExceeded
        se reintenta 2 veces (200 ms y 600 ms, 3 s por llamada); PermissionDenied y Unauthenticated no se
        reintentan. fuentesObligatorias llega vacía en D1 (R-17, hasta el catálogo de reglas de D6).
      responses:
        "200":
          description: Tipos de trámite de la etapa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiposTramite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = CATALOGO_NO_DISPONIBLE: Trámites no respondió tras los reintentos (o rechazó al cliente de
            servicio) y no hay copia vigente. No se devuelve ninguna lista fija ni una copia vencida.
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos:
    post:
      tags: [Diagnosticos]
      operationId: crearDiagnostico
      summary: Crea la cabecera de un diagnóstico en CREADO
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13750, F01-H4). El backoffice FLIT no lo tiene (R-6): 403. Guarda la
        cabecera en CREADO con la copia inmutable del alcance y de la configuración vigente de la compañía del token (un
        cambio posterior de la configuración no la altera) y la fila inicial del historial (estado_anterior nulo,
        disparador AUTO), en la misma transacción. Validación (422 con code y campo, sin guardar nada), en este orden:
        nombre vacío o de más de 150 caracteres (NOMBRE_INVALIDO); fuente en un grupo que no es el suyo
        (FUENTE_EN_GRUPO_AJENO); alcance sin RUNT (ALCANCE_SIN_RUNT); fuente fuera de fuentes_habilitadas
        (FUENTE_NO_HABILITADA); fuente habilitada sin adaptador disponible, como IMPUESTO_DEPARTAMENTAL mientras
        Diagnostico:Fuentes:ImpuestoDisponible sea false (FUENTE_NO_DISPONIBLE); CON_ANALISIS sin tipo
        (TIPO_TRAMITE_REQUERIDO). Solo si todo eso se cumple y el modo es CON_ANALISIS se consulta el catálogo de
        GET /tipos-tramite: tipo fuera del catálogo de la etapa (TIPO_TRAMITE_NO_DISPONIBLE) o faltan las fuentes
        obligatorias del tipo (FUENTES_OBLIGATORIAS_FALTANTES, R-17; la lista llega vacía en D1). Un modo o una fuente
        con un código desconocido responde 422 VALOR_FUERA_DE_CONJUNTO con su campo. En modo SIMPLE el tipo de trámite
        se descarta. El nombre se guarda sin los espacios de los extremos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CabeceraEntrada"
      responses:
        "201":
          description: Cabecera creada en CREADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostico"
        "400":
          description: El cuerpo no es un JSON con la forma de CabeceraEntrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.crear (sin cuerpo; el backoffice FLIT, R-6); sin usuario (`code` = SIN_USUARIO),
            sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: Regla de la cabecera incumplida (ver la descripción); `campo` nombra el campo del cuerpo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = CATALOGO_NO_DISPONIBLE: CON_ANALISIS y el catálogo de tipos de trámite no está disponible (misma
            conducta degradada de GET /tipos-tramite). No se guarda nada.
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    put:
      tags: [Diagnosticos]
      operationId: editarDiagnostico
      summary: Edita nombre, modo, tipo y alcance de la cabecera mientras está en CREADO
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13750, F01-H4, F01-C9). Mismo cuerpo y mismas reglas que la creación,
        validadas contra la copia de configuración guardada en la cabecera (no contra la configuración de hoy). La copia,
        el creador y la fecha de creación no cambian. Solo en CREADO: en cualquier otro estado responde 409
        DIAGNOSTICO_NO_EDITABLE y no cambia nada. Una cabecera de otra compañía, o que no existe, responde 404.
        Este endpoint no está en la tabla §6.1 del plan (se agrega aquí y se informa al architecture-agent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CabeceraEntrada"
      responses:
        "200":
          description: Cabecera editada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostico"
        "400":
          description: El cuerpo no es un JSON con la forma de CabeceraEntrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: no existe o es de otra compañía."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = DIAGNOSTICO_NO_EDITABLE: la cabecera ya no está en CREADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: Regla de la cabecera incumplida (mismos códigos que la creación).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "`code` = CATALOGO_NO_DISPONIBLE (CON_ANALISIS con el catálogo caído)."
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/plantilla:
    get:
      tags: [Carga]
      operationId: descargarPlantillaDiagnostico
      summary: Plantilla .xlsx de carga masiva
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13749, F02-C5). Libro con una hoja «Vehiculos» y el encabezado
        Identificador_Vehiculo (obligatoria), Tipo_Documento_Locatario y Documento_Locatario (opcionales, R-3), con
        formato de texto en las tres columnas. El documento del propietario no se pide: sale del RUNT por placa (D-02).
        Archivo fijo, igual para toda compañía.
      responses:
        "200":
          description: La plantilla.
          headers:
            Content-Disposition:
              description: attachment; filename=plantilla-diagnostico.xlsx
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/carga:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    post:
      tags: [Carga]
      operationId: analizarCargaDiagnostico
      summary: Analiza el archivo de carga y devuelve el resumen de validación
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13749, F02-H4). Solo con la cabecera en CREADO. Sin estado en el
        servidor: no guarda filas ni consulta fuentes externas (el lote se confirma después). Formatos (por extensión y
        por firma del contenido): .xlsx (primera hoja) y .csv (UTF-8, con o sin BOM, separador coma o punto y coma
        detectado en el encabezado). La fila 1 es el encabezado; los nombres de columna no distinguen mayúsculas y las
        opcionales pueden faltar. Por fila: el identificador se normaliza y clasifica con la regla de Trámites
        (ValidadorIdentificador, HU #13740); si el valor limpio (mayúsculas, solo A-Z y 0-9, antes de recortar) pasa de 8
        caracteres en una placa o de 17 en un VIN, la fila es errónea (IDENTIFICADOR_DEMASIADO_LARGO): nunca se acepta
        recortado. El documento del locatario es opcional; si viene, tipo CC, CE, NIT, PAS o TI y número de hasta 20
        caracteres, solo dígitos salvo PAS (TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO si falta
        uno de los dos). Los identificadores válidos repetidos se consolidan en la primera fila (filas_duplicadas) y se
        cuentan como duplicados: total_filas = validos + erroneos + duplicados. El límite por lote y el estimado salen
        de la copia de configuración de la cabecera: con estimado_consultas = ANTES_DE_LANZAR el resumen trae
        estimado_consultas (por cada fuente del alcance, los válidos menos los N/A previsibles de locatario, HU #13747);
        con otro valor no trae la propiedad. Sin válidos (aviso SIN_VALIDOS) o con más válidos que el límite (aviso
        LIMITE_SUPERADO), puede_continuar es false. El documento del locatario vuelve siempre enmascarado («****» y los
        4 últimos). El contenido de las filas no se escribe en logs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: El archivo .xlsx o .csv.
      responses:
        "200":
          description: Resumen de validación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenValidacion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la cabecera no existe o es de otra compañía."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = DIAGNOSTICO_NO_EDITABLE: la cabecera ya no está en CREADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "413":
          description: >
            `code` = ARCHIVO_DEMASIADO_GRANDE: el archivo supera Diagnostico:Carga:TamanoMaximoBytes (5 MB por defecto).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "415":
          description: >
            `code` = FORMATO_NO_ADMITIDO (otra extensión, o un .csv que no es texto) o ARCHIVO_ILEGIBLE (.xlsx dañado o
            que no es un libro, .csv que no está en UTF-8). No se analiza ninguna fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `code` = FORMATO_XLS_NO_ADMITIDO (.xls, por extensión o por firma), con el mensaje «El formato .xls no se
            admite: guarde el archivo como .xlsx y vuelva a subirlo»; ARCHIVO_REQUERIDO (sin el campo archivo o vacío);
            COLUMNA_REQUERIDA (sin la columna Identificador_Vehiculo, campo = Identificador_Vehiculo). No se analiza
            ninguna fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/carga/validar-filas:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    post:
      tags: [Carga]
      operationId: validarFilasCargaDiagnostico
      summary: Revalida filas corregidas con el mismo análisis de la carga, sin guardar nada
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13751, F02-H5, F02-C9). Solo con la cabecera en CREADO. Aplica a las
        filas recibidas exactamente el análisis de POST /diagnosticos/{id}/carga (regla de Trámites, longitud después de
        limpiar, documento del locatario, duplicados consolidados en la primera fila, límite y estimado de la copia de
        configuración) y devuelve el mismo resumen. No escribe en la base ni consulta fuentes. Una fila sin `fila` toma su
        posición (la primera es la 2, como en la hoja con encabezado). El documento del locatario vuelve enmascarado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilasAValidar"
      responses:
        "200":
          description: Resumen de validación de las filas recibidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenValidacion"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la cabecera no existe o es de otra compañía."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = DIAGNOSTICO_NO_EDITABLE: la cabecera ya no está en CREADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    post:
      tags: [Vehiculos]
      operationId: confirmarVehiculosDiagnostico
      summary: Confirma los vehículos del lote (solo los válidos) y los entrega al motor de consultas
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13751, F02-H5, F02-C4/C9/C10/C11/C13/C14). Solo con la cabecera en
        CREADO y sin vehículos confirmados antes. Multipart con el MISMO archivo del análisis (`archivo`, mismas reglas y
        topes que POST /diagnosticos/{id}/carga) y, opcional, `correcciones` (decisión del usuario 2026-10-21 «Reenviar el
        archivo»: el análisis devuelve el documento del locatario enmascarado y solo el archivo lo trae completo, R-3). El
        servidor re-analiza el archivo, aplica las correcciones por número de fila (un campo ausente conserva el del archivo)
        y revalida todo con la regla de la carga (no confía en el cliente; un archivo distinto del analizado también se
        revalida entero): descarta los inválidos (también los identificadores de más de 8 caracteres de placa o 17 de VIN
        después de limpiar, nunca recortados) y los duplicados (gana el primero). Sin ningún válido, o con más válidos que
        limite_vehiculos_lote de la copia de configuración, responde 422 y no guarda nada. En una sola transacción guarda
        los válidos en el orden del archivo, cifra el documento completo del locatario declarado (origen DECLARADO_CLIENTE; nunca en
        logs ni eventos), deja el estimado de consultas en la cabecera y entrega la lista limpia al motor de consultas
        (en D1 la entrega no hace nada; #13719 crea las celdas y pasa el lote a EN_PROCESO). No cambia el estado de la
        cabecera. La respuesta trae estimado_consultas solo con estimado_consultas = ANTES_DE_LANZAR.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConfirmacionVehiculos"
      responses:
        "201":
          description: Vehículos confirmados (documento del locatario enmascarado «****» y los 4 últimos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoConfirmacion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la cabecera no existe o es de otra compañía (no se guarda nada)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = DIAGNOSTICO_NO_EDITABLE (la cabecera ya no está en CREADO) o VEHICULOS_YA_CONFIRMADOS (el lote ya
            tiene vehículos, también si otra confirmación ganó en paralelo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "413":
          description: "`code` = ARCHIVO_DEMASIADO_GRANDE: el archivo supera Diagnostico:Carga:TamanoMaximoBytes (5 MB por defecto)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "415":
          description: >
            `code` = FORMATO_NO_ADMITIDO (otra extensión, o un .csv que es zip, PDF u OLE2) o ARCHIVO_ILEGIBLE (.xlsx dañado
            o .csv que no es UTF-8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            No se guarda nada. `campo` = vehiculos: `code` = SIN_VALIDOS (ningún vehículo válido o archivo sin filas) o
            LIMITE_SUPERADO (los válidos superan limite_vehiculos_lote; el mensaje trae ambos números). `campo` = archivo:
            ARCHIVO_REQUERIDO (sin archivo, vacío o cuerpo que no es multipart). FORMATO_XLS_NO_ADMITIDO (.xls).
            `campo` = Identificador_Vehiculo: COLUMNA_REQUERIDA. `campo` = correcciones: CORRECCIONES_INVALIDAS (JSON mal
            formado, no es una lista, sin `fila` entera, fila repetida, fila que el archivo no tiene o un valor que no es
            texto ni null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express:
    post:
      tags: [Express]
      operationId: crearDiagnosticoExpress
      summary: Crea un diagnóstico Express de un solo vehículo (cabecera y vehículo en una transacción)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F02-H6, F02-C4/C12/C13, F01-C10). El backoffice FLIT no lo tiene
        (R-6): 403. Primero revalida el vehículo con la regla de fila de la carga y de la confirmación: identificador
        ausente (IDENTIFICADOR_REQUERIDO), que no es placa ni VIN (IDENTIFICADOR_INVALIDO), de más de 8 caracteres de placa
        o 17 de VIN después de limpiar, nunca recortado (IDENTIFICADOR_DEMASIADO_LARGO), o documento del locatario mal
        formado (TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO): 422 con `campo` y no se crea nada.
        Después, en una sola transacción, crea la cabecera en CREADO con es_express = true y las mismas reglas de
        POST /diagnosticos (422 con su campo; 503 con CON_ANALISIS y el catálogo caído) y confirma el vehículo como
        POST /diagnosticos/{id}/vehiculos (documento del locatario cifrado con origen DECLARADO_CLIENTE, estimado en la
        cabecera, entrega al motor de consultas). Si algo falla no queda cabecera ni vehículo. Sin nombre (o solo
        espacios) se autogenera «Express IDENTIFICADOR dd/mm/aaaa» con el identificador normalizado y la fecha de
        Colombia; un nombre enviado se valida como en POST /diagnosticos (máximo 150).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "201":
          description: Diagnóstico Express creado con su único vehículo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressCreado"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.crear (sin cuerpo; el backoffice FLIT, R-6); sin usuario (`code` = SIN_USUARIO),
            sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Regla del vehículo (`campo` = identificador, tipo_documento_locatario o documento_locatario) o de la cabecera
            (los códigos de POST /diagnosticos). No se crea nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "`code` = CATALOGO_NO_DISPONIBLE: CON_ANALISIS y el catálogo de tipos de trámite no está disponible. No se crea nada."
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express/estimado:
    post:
      tags: [Express]
      operationId: estimarDiagnosticoExpress
      summary: Estimado de consultas por fuente del Express antes de lanzarlo (no persiste nada)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F01-C11). Endpoint nuevo frente al plan §6.1. Recibe el mismo
        cuerpo que POST /express y no guarda nada. Con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de
        la compañía del token responde mostrar_estimado = true y el estimado por fuente del alcance para un vehículo (las
        fuentes del locatario cuentan 0 sin documento de locatario); con otro valor responde mostrar_estimado = false sin
        estimado_consultas. Un código de fuente desconocido es 422 VALOR_FUERA_DE_CONJUNTO y un documento del locatario mal
        formado es 422 con su campo. No valida el identificador ni las fuentes habilitadas (eso lo hace POST /express).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "200":
          description: Estimado de vista previa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimadoExpress"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear (el backoffice FLIT, R-6); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: "`code` = VALOR_FUERA_DE_CONJUNTO (fuente desconocida) o error de forma del documento del locatario, con `campo`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas/{empresa}/configuracion/contrato:
    parameters:
      - name: empresa
        in: path
        required: true
        description: >
          Compañía cuyo contrato se lee o edita (uuid distinto de cero). Si además llega ?empresa=, debe
          coincidir (si no, 400 EMPRESA_REQUERIDA).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice, Configuracion]
      operationId: obtenerContratoEmpresaBackoffice
      summary: Contrato de una compañía para el backoffice FLIT
      description: >
        Política diagnostico.backoffice (diagnostico.backoffice.ver + tenant_type=FLIT) y además
        diagnostico.configuracion.contrato.editar (HU #13741). La lectura queda en diagnostico.lecturas_backoffice
        antes de leer. Sin fila guardada devuelve los valores por defecto.
      responses:
        "200":
          description: Contrato de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida o distinta en la ruta y en la consulta (`code` = EMPRESA_REQUERIDA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); token sin
            compañía (SIN_EMPRESA) o sin usuario (SIN_USUARIO); PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Configuracion]
      operationId: editarContratoEmpresaBackoffice
      summary: Edita el contrato de una compañía (backoffice FLIT)
      description: >
        Mismos permisos que el GET. Edita fuentes_habilitadas, limite_vehiculos_lote (mayor que cero) y el
        interruptor de emergencia redaccion_ia_suspendida (R-2) de la compañía de la ruta, por la vía de
        escritura entre compañías del módulo Backoffice (ADR-0073). Se guardan los campos que llegan. Reducir
        las habilitadas recorta fuentes_por_defecto en el mismo comando. Cada campo que cambia (también el
        recorte) queda en diagnostico.cambios_contrato con el usuario, la compañía, el valor anterior y el nuevo;
        el PUT no se registra en lecturas_backoffice. Orden de validación: un campo que no es del contrato da
        403 CAMPO_NO_EDITABLE; un valor fuera de conjunto, 422 VALOR_FUERA_DE_CONJUNTO; un límite que no es un
        entero positivo, 422 LIMITE_INVALIDO; habilitar IMPUESTO_DEPARTAMENTAL mientras
        Diagnostico:Fuentes:ImpuestoDisponible sea false (C3, R-9), 422 FUENTE_NO_DISPONIBLE. Con un error no
        se guarda ningún campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionContrato"
      responses:
        "200":
          description: Contrato guardado (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida (EMPRESA_REQUERIDA) o cuerpo que no es un objeto o repite un campo (CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); campo que no
            es del contrato (CAMPO_NO_EDITABLE); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, LIMITE_INVALIDO, FUENTE_NO_DISPONIBLE o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/resumen:
    get:
      tags: [Backoffice]
      operationId: obtenerResumenEmpresaBackoffice
      summary: Resumen de una compañía cliente para el backoffice FLIT
      description: >
        Ruta mínima de D0 (HU #13728): si la compañía indicada tiene configuración y cuántos diagnósticos y
        vehículos tiene. Política diagnostico.backoffice: exige a la vez el permiso diagnostico.backoffice.ver
        (o SuperAdmin) y el claim tenant_type=FLIT del token; con el rol backoffice_diagnostico en una compañía
        que no es FLIT, o en la compañía FLIT sin el permiso, responde 403, igual que cualquier otra ruta
        /backoffice/* (también una que no existe). La compañía nunca sale del token: se indica en ?empresa=
        (o en el segmento {empresa} de las rutas que lo lleven; si llegan los dos deben coincidir). Cada
        lectura queda en diagnostico.lecturas_backoffice con el usuario, la empresa consultada, la ruta y la
        fecha, antes de leer. Sin empresa válida responde 400 y no se audita.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía a consultar (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen de la compañía indicada (solo sus datos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenEmpresaBackoffice"
        "400":
          description: Falta ?empresa=, no es un uuid, es cero, llega repetido o no coincide con la ruta (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT (falta el permiso o tenant_type no es FLIT; sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Sin sesión, token inválido o de otro producto.

  schemas:
    Sesion:
      type: object
      required: [usuario, empresa, roles, permisos, capacidades]
      properties:
        usuario:
          type: object
          required: [id, email, esSuperAdmin]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            esSuperAdmin:
              type: boolean
        empresa:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Claim tenant_id del token.
            nombre:
              type: string
              nullable: true
            tipo:
              type: string
              nullable: true
              description: Claim tenant_type (FLIT para la compañía FLIT).
        roles:
          type: array
          description: Códigos de rol del token (claim role_code).
          items:
            type: string
          example: [usuario_diagnostico]
        permisos:
          type: array
          description: Slugs diagnostico.* que tiene el usuario.
          items:
            type: string
          example: [diagnostico.diagnosticos.crear, diagnostico.diagnosticos.ver]
        capacidades:
          $ref: "#/components/schemas/Capacidades"

    Capacidades:
      type: object
      description: >
        Ayuda para armar el menú; cada endpoint vuelve a exigir su permiso. Las seis últimas son del
        backoffice FLIT y exigen además tenant_type=FLIT.
      required:
        - crearDiagnosticos
        - verDiagnosticos
        - descargarReportes
        - derivar
        - verConfiguracion
        - editarConfiguracion
        - reprocesarConsultas
        - backoffice
        - editarContrato
        - llenarConsultas
        - corregirDictamen
        - verAuditoria
        - verVolumetria
      properties:
        crearDiagnosticos:
          type: boolean
        verDiagnosticos:
          type: boolean
        descargarReportes:
          type: boolean
        derivar:
          type: boolean
        verConfiguracion:
          type: boolean
        editarConfiguracion:
          type: boolean
        reprocesarConsultas:
          type: boolean
        backoffice:
          type: boolean
        editarContrato:
          type: boolean
        llenarConsultas:
          type: boolean
        corregirDictamen:
          type: boolean
        verAuditoria:
          type: boolean
        verVolumetria:
          type: boolean

    ResumenEmpresaBackoffice:
      type: object
      required: [empresa, configuracion, diagnosticos, vehiculos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía indicada en ?empresa=.
        configuracion:
          type: boolean
          description: La compañía ya tiene fila en configuracion_empresa.
        diagnosticos:
          type: integer
          format: int32
          minimum: 0
        vehiculos:
          type: integer
          format: int32
          minimum: 0

    Fuente:
      type: string
      enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    VisibilidadUsuario:
      type: string
      enum: [PROPIOS, EMPRESA]

    EstimadoConsultas:
      type: string
      enum: [NO_MOSTRAR, ANTES_DE_LANZAR, AL_FINALIZAR]

    Configuracion:
      type: object
      required: [empresa, contrato, operacion]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía del token.
        contrato:
          type: object
          required: [solo_lectura, fuentes_habilitadas, limite_vehiculos_lote, actualizado_en]
          properties:
            solo_lectura:
              type: boolean
              description: Siempre true para la compañía; el contrato lo edita el backoffice FLIT.
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        operacion:
          type: object
          required: [visibilidad_usuario, fuentes_por_defecto, estimado_consultas, actualizado_por, actualizado_en]
          properties:
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              description: Subconjunto de contrato.fuentes_habilitadas.
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
            actualizado_por:
              type: string
              format: uuid
              nullable: true
            actualizado_en:
              type: string
              format: date-time
              nullable: true

    EdicionOperativa:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        visibilidad_usuario:
          $ref: "#/components/schemas/VisibilidadUsuario"
        fuentes_por_defecto:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        estimado_consultas:
          $ref: "#/components/schemas/EstimadoConsultas"
      example:
        visibilidad_usuario: PROPIOS
        estimado_consultas: ANTES_DE_LANZAR

    ContratoBackoffice:
      type: object
      required: [empresa, fuentes_habilitadas, limite_vehiculos_lote, redaccion_ia_suspendida, fuentes_por_defecto, actualizado_por, actualizado_en]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía de la ruta.
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
          description: Interruptor de emergencia de la redacción IA (R-2). Solo lo ve el backoffice.
        fuentes_por_defecto:
          type: array
          description: Solo lectura aquí (las edita el admin de la compañía); se recortan al reducir las habilitadas.
          items:
            $ref: "#/components/schemas/Fuente"
        actualizado_por:
          type: string
          format: uuid
          nullable: true
          description: Usuario del backoffice del último cambio contractual.
        actualizado_en:
          type: string
          format: date-time
          nullable: true

    EdicionContrato:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
      example:
        limite_vehiculos_lote: 200

    TiposTramite:
      type: object
      required: [tipos]
      properties:
        tipos:
          type: array
          items:
            $ref: "#/components/schemas/TipoTramite"

    TipoTramite:
      type: object
      required: [codigo, nombre, familia, fuentesObligatorias]
      properties:
        codigo:
          type: string
          description: Código estable del tipo en Trámites.
          example: TRASPASO_STANDARD
        nombre:
          type: string
          example: TRASPASO
        familia:
          type: string
          description: MATRICULAS, TRASPASO u OTROS.
          example: TRASPASO
        fuentesObligatorias:
          type: array
          description: Fuentes que el tipo exige en el alcance (códigos RUNT, SIMIT_VEHICULO...). Vacía en D1.
          items:
            type: string

    ModoDiagnostico:
      type: string
      enum: [SIMPLE, CON_ANALISIS]

    EstadoDiagnostico:
      type: string
      enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO]

    Alcance:
      type: object
      description: >
        Fuentes en sus tres grupos (R-24). por_vehiculo: RUNT, SIMIT_VEHICULO, AVALUO, IMPUESTO_DEPARTAMENTAL;
        por_propietario: RUNT_PROPIETARIO, SIMIT_PROPIETARIO; por_locatario: RUNT_LOCATARIO, SIMIT_LOCATARIO. Una fuente
        en un grupo que no es el suyo responde 422 FUENTE_EN_GRUPO_AJENO. RUNT siempre. Un grupo ausente equivale a vacío.
      properties:
        por_vehiculo:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_propietario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_locatario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"

    CabeceraEntrada:
      type: object
      required: [nombre, modo, alcance]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS (código de GET /tipos-tramite); se descarta con SIMPLE.
          example: TRASPASO_STANDARD
        alcance:
          $ref: "#/components/schemas/Alcance"
      example:
        nombre: Flota norte
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT, SIMIT_VEHICULO]
          por_propietario: [RUNT_PROPIETARIO]
          por_locatario: []

    Diagnostico:
      type: object
      required: [id, nombre, modo, tipo_tramite_codigo, es_express, estado, alcance, configuracion, usuario_creador_id, creado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        alcance:
          $ref: "#/components/schemas/Alcance"
        configuracion:
          type: object
          description: Copia inmutable de la configuración de la compañía al crear (sin redaccion_ia_suspendida).
          required: [fuentes_habilitadas, limite_vehiculos_lote, visibilidad_usuario, fuentes_por_defecto, estimado_consultas]
          properties:
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
        usuario_creador_id:
          type: string
          format: uuid
        creado_en:
          type: string
          format: date-time

    ResumenValidacion:
      type: object
      required: [total_filas, validos, erroneos, duplicados, puede_continuar, limite_vehiculos_lote, supera_limite, avisos, filas]
      properties:
        total_filas:
          type: integer
          description: Filas de datos no vacías del archivo.
        validos:
          type: integer
        erroneos:
          type: integer
        duplicados:
          type: integer
          description: Repeticiones de un identificador válido ya presente (consolidadas en su primera fila).
        puede_continuar:
          type: boolean
          description: false sin válidos o con más válidos que el límite por lote.
        limite_vehiculos_lote:
          type: integer
          description: Límite de la copia de configuración de la cabecera.
        supera_limite:
          type: boolean
        avisos:
          type: array
          items:
            $ref: "#/components/schemas/AvisoCarga"
        filas:
          type: array
          description: Una por fila leída, salvo los duplicados consolidados, en el orden del archivo.
          items:
            $ref: "#/components/schemas/FilaResumen"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración; en otro caso no viene.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    AvisoCarga:
      type: object
      required: [code, mensaje]
      properties:
        code:
          type: string
          enum: [SIN_VALIDOS, LIMITE_SUPERADO]
        mensaje:
          type: string

    FilaResumen:
      type: object
      required: [fila, identificador, identificador_norm, tipo_identificador, tipo_documento_locatario, documento_locatario, valida, filas_duplicadas, errores]
      properties:
        fila:
          type: integer
          description: Número de fila de la hoja o del CSV (el encabezado es la 1).
        identificador:
          type: string
          description: Tal como vino en el archivo.
        identificador_norm:
          type: string
          description: Normalizado con la regla de Trámites; si es demasiado largo, el valor limpio sin recortar.
        tipo_identificador:
          type: string
          nullable: true
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, VIN, null]
        tipo_documento_locatario:
          type: string
          nullable: true
          example: CC
        documento_locatario:
          type: string
          nullable: true
          description: Siempre enmascarado.
          example: "****4050"
        valida:
          type: boolean
        filas_duplicadas:
          type: array
          items:
            type: integer
        errores:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFila"

    ErrorFila:
      type: object
      required: [campo, code, mensaje]
      properties:
        campo:
          type: string
          enum: [Identificador_Vehiculo, Tipo_Documento_Locatario, Documento_Locatario]
        code:
          type: string
          enum: [IDENTIFICADOR_REQUERIDO, IDENTIFICADOR_INVALIDO, IDENTIFICADOR_DEMASIADO_LARGO, TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO]
        mensaje:
          type: string

    EstimadoFuente:
      type: object
      required: [fuente, consultas]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        consultas:
          type: integer

    FilaCapturada:
      type: object
      description: Una fila capturada (HU #13751). El documento del locatario es opcional; si viene, tipo y número juntos.
      properties:
        fila:
          type: integer
          description: Número de fila del archivo (para el resumen de validar-filas).
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número del documento; se guarda cifrado y nunca vuelve en claro."

    FilasAValidar:
      type: object
      properties:
        filas:
          type: array
          items:
            $ref: "#/components/schemas/FilaCapturada"

    ConfirmacionVehiculos:
      type: object
      description: Multipart de POST /diagnosticos/{id}/vehiculos (HU #13751, «Reenviar el archivo»).
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: "@pii:high El MISMO .xlsx o .csv enviado a POST /diagnosticos/{id}/carga."
        correcciones:
          type: string
          description: >
            JSON (texto del campo del formulario) con una lista de CorreccionFila; vacío o ausente es sin correcciones.
            Ejemplo: [{"fila": 2, "identificador": "ABC123"}, {"fila": 5, "tipo_documento_locatario": "CC", "documento_locatario": "1020304050"}]

    CorreccionFila:
      type: object
      description: >
        Corrección de una fila del archivo (va dentro del JSON de `correcciones`). `fila` es el número de fila del análisis
        (encabezado en la fila 1). Un campo ausente conserva el valor del archivo; con null o vacío lo deja vacío. No envíe
        el documento enmascarado del análisis («****…»): es inválido y la fila se descarta; omita el campo para conservar
        el del archivo.
      required: [fila]
      properties:
        fila:
          type: integer
        identificador:
          type: string
          nullable: true
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número completo del documento; se guarda cifrado y nunca vuelve en claro."

    ResultadoConfirmacion:
      type: object
      required: [diagnostico_id, confirmados, invalidos, duplicados, limite_vehiculos_lote, vehiculos]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        confirmados:
          type: integer
        invalidos:
          type: integer
          description: Vehículos descartados por identificador o documento inválido.
        duplicados:
          type: integer
          description: Vehículos descartados por repetir un identificador válido anterior.
        limite_vehiculos_lote:
          type: integer
        vehiculos:
          type: array
          items:
            $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    VehiculoConfirmado:
      type: object
      required: [id, orden, identificador, identificador_norm, tipo_identificador]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
        identificador_norm:
          type: string
        tipo_identificador:
          type: string
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, VIN]
        tipo_documento_locatario:
          type: string
          nullable: true
        documento_locatario:
          type: string
          nullable: true
          description: Enmascarado («****» y los 4 últimos).

    ExpressEntrada:
      type: object
      description: >
        Cuerpo de POST /express y POST /express/estimado (HU #13753): la cabecera como en CabeceraEntrada, pero con el
        nombre opcional, y el único vehículo con el documento del locatario opcional (tipo y número juntos).
      required: [modo, alcance, identificador]
      properties:
        nombre:
          type: string
          nullable: true
          maxLength: 150
          description: Vacío o ausente se autogenera «Express IDENTIFICADOR dd/mm/aaaa».
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS; se descarta con SIMPLE.
        alcance:
          $ref: "#/components/schemas/Alcance"
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número del documento; se guarda cifrado y nunca vuelve en claro."
      example:
        identificador: ABC123
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT]
          por_propietario: []
          por_locatario: []

    ExpressCreado:
      type: object
      required: [id, nombre, modo, es_express, estado, creado_en, vehiculo]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        creado_en:
          type: string
          format: date-time
        vehiculo:
          $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    EstimadoExpress:
      type: object
      required: [mostrar_estimado]
      properties:
        mostrar_estimado:
          type: boolean
          description: Verdadero con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de la compañía.
        estimado_consultas:
          type: array
          description: Solo cuando mostrar_estimado es verdadero.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    ErrorRegla:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: SIN_EMPRESA
        error:
          type: string
        campo:
          type: string
          description: Campo del cuerpo que incumple la regla (solo en las reglas de un campo, HU #13750).
          example: alcance.por_vehiculo
