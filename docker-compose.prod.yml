# Production docker-compose — VPS deploy (front + gateway + core-api + python-ml).
#
# CONVENCION DE PUERTOS: cada servicio usa el MISMO puerto en host e interno
# (expuesto == interno), publicado solo en 127.0.0.1 (el reverse-proxy del HOST
# termina TLS y enruta los dominios). Los puertos son PARAMETRIZABLES por ambiente:
#
#   Servicio   var               DEV    QA     PDN
#   frontend   FRONTEND_PORT     4001   5001   6001   (Next.js)
#   gateway    GATEWAY_PORT      4002   5002   6002   (API publica YARP: /api, /hubs, /ml)
#   core-api   CORE_API_PORT     4003   5003   6003   (Flit.Api interno/debug, detras de YARP)
#   core-ict   CORE_ICT_PORT     4020   5020   6020   (Flit.Ict.Api interno, detras de YARP)
#   python-ml  PYTHON_ML_PORT    4012   5012   6012   (FastAPI OCR/ML, detras de YARP)
#
# Los defaults son los de QA. El CD exporta las vars segun la rama (develop/staging/
# gRPC este-oeste (interno, NO publicado): core-ict -> core-api en CORE_API_GRPC_PORT (default 8082);
# el callback de estados va core-api -> core-ict en CORE_ICT_PORT (h2c en el mismo puerto REST).
#
# Los defaults son los de QA. El CD exporta las vars segun la rama (develop/staging/
# release); para operacion manual, fijalas en el .env del VPS de ese ambiente.
#
# Mapeo de dominios en el reverse-proxy del HOST (ejemplo DEV):
#   qa.flitsas.online      -> 127.0.0.1:${FRONTEND_PORT}  (frontend)
#   api.qa.flitsas.online  -> 127.0.0.1:${GATEWAY_PORT}   (gateway / API publica)
#   core.qa.flitsas.online -> 127.0.0.1:${CORE_API_PORT}  (core-api, opcional/debug)
#
# Postgres NO esta aqui: corre en el HOST (host.docker.internal:5432).
#
# Variables requeridas en .env (junto al compose):
#   CONNECTION_STRING_CORE  cadena Npgsql .NET (Host=...;Port=5432;Database=...;Username=...;Password=...)
#   CORS_ORIGIN             origen permitido del frontend (https://<env>.flitsas.online)
#   VERIFIK_API_TOKEN       token Verifik (RUNT)
#   ICT_SERVICE_TOKEN_SECRET  secreto HMAC del canal gRPC este-oeste ICT (core-api <-> core-ict).
#                             Sin el, la orquestacion y el callback quedan fail-closed.
# Variables de puerto (defaults DEV; el CD las inyecta por ambiente):
#   FRONTEND_PORT / GATEWAY_PORT / CORE_API_PORT / PYTHON_ML_PORT
# Variables para AISLAR este proyecto del resto del VPS:
#   COMPOSE_PROJECT_NAME    nombre del proyecto Compose (default: flitqa)
# Variables opcionales:
#   CORE_API_TAG / FRONTEND_TAG / PYTHON_ML_TAG   tag de imagen (default: latest)
#   VERIFIK_BASE_URL / VERIFIK_TIMEOUT_SECONDS
#
# NOTA: login deshabilitado temporalmente -> NO se requieren llaves JWT.
# NOTA: la imagen python-ml debe construirse/publicarse en el pipeline CD
#       (ghcr.io/flitsas/flitqa/python-ml) para que `docker compose pull` la encuentre.
# NOTA: todas las imagenes se publican en GHCR (ghcr.io). El VPS debe hacer
#       `docker login ghcr.io` (lo hace el CD con GHCR_PAT) antes del pull.
#
# Despliegue:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

# Nombre del proyecto: UNICO por proyecto en el VPS. Si dos repos comparten el
# mismo nombre, `up --remove-orphans` borra los contenedores del otro. Sobrescribir
# con COMPOSE_PROJECT_NAME en el .env de cada proyecto.
name: flitqa

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Configuracion del migrador V1 -> V2. UNA sola definicion para los DOS consumidores
# (`migrador`, por comando; `migracion-api`, por HTTP) porque ejecutan el MISMO motor.
#
# No es cosmetico: si los dos bloques divergieran —por ejemplo en TargetFileManager—
# uno subiria los binarios a un file-manager y el otro leeria de otro. Los adjuntos
# existirian en la tabla, el tramite se veria completo, y no abriria ninguno.
#
# REGLA: las TRES variables de origen (V1Source, SourceFileManager, V1Snapshot) tienen
# que apuntar al MISMO ambiente de V1. Los ids de V1 son enteros y se repiten entre
# ambientes: una base copia de pdn con la API de snapshot de dev le pide a dev el
# tramite 26350, que existe, es otro y es de otra empresa. No da error.
x-flitmig-env: &flitmig-env
  # ── Bases de datos ──
  # V1 es SOLO LECTURA: el migrador nunca escribe en el origen.
  FLITMIG_ConnectionStrings__V1Source: ${FLITMIG_V1_SOURCE}
  FLITMIG_ConnectionStrings__V2Target: ${FLITMIG_V2_TARGET:-${CONNECTION_STRING_CORE}}
  # ── Lote y usuario ──
  # En el endpoint HTTP este es el valor POR DEFECTO: cada peticion puede
  # sobreescribirlo con ?batchId=, para no reiniciar el contenedor entre olas.
  FLITMIG_Migration__BatchId: ${FLITMIG_BATCH_ID:-sin-lote}
  FLITMIG_Migration__SystemUserEmail: ${FLITMIG_SYSTEM_USER_EMAIL:-migracion.v1@flitsas.io}
  # NUNCA true en produccion: un NIT sin tenant es cuarentena, no algo que se
  # cree solo. tenant_id es NOT NULL pero SIN foreign key, asi que la base no
  # frena un id inventado y RLS esconderia los tramites de su dueño real.
  # El host HTTP ademas lo fuerza a false en codigo, pase lo que pase aqui.
  FLITMIG_Migration__CreateTenantIfMissing: "false"
  # ── Adjuntos (instancia 2) ──
  # Copy porque V2 se pasa a MinIO: origen y destino son stores distintos.
  # Reference solo valdria si V2 leyera del MISMO file-manager que V1.
  FLITMIG_Attachments__Mode: ${FLITMIG_ATTACHMENTS_MODE:-Copy}
  FLITMIG_SourceFileManager__BaseUrl: ${FLITMIG_SOURCE_FM_BASE_URL}
  FLITMIG_SourceFileManager__FilesPath: ${FLITMIG_SOURCE_FM_FILES_PATH:-api/v1/files}
  FLITMIG_SourceFileManager__AuthToken: ${FLITMIG_SOURCE_FM_AUTH_TOKEN:-}
  # MISMA URL que FileManager__BaseUrl de core-api. Ver el comentario del servicio.
  FLITMIG_TargetFileManager__BaseUrl: ${FILE_MANAGER_BASE_URL}
  FLITMIG_TargetFileManager__FilesPath: ${FLITMIG_TARGET_FM_FILES_PATH:-api/v1/files}
  FLITMIG_TargetFileManager__AuthToken: ${FLITMIG_TARGET_FM_AUTH_TOKEN:-}
  # ── Documentos generados (instancia 3) ──
  # API de V1 del MISMO ambiente, con el endpoint de snapshot desplegado.
  FLITMIG_V1Snapshot__BaseUrl: ${FLITMIG_V1_SNAPSHOT_BASE_URL:-}
  FLITMIG_V1Snapshot__AuthToken: ${FLITMIG_V1_SNAPSHOT_AUTH_TOKEN:-}
  FLITMIG_V1Snapshot__Include: ${FLITMIG_V1_SNAPSHOT_INCLUDE:-generated}
  FLITMIG_V1Snapshot__Consolidated: ${FLITMIG_V1_SNAPSHOT_CONSOLIDATED:-auto}

services:
  # ── Flit.Api (interno, detras de YARP) — CORE_API_PORT ────────────────────
  core-api:
    image: ghcr.io/flitsas/flitqa/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/api/Flit.Api.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:${CORE_API_PORT:-5003}
      ConnectionStrings__Core: ${CONNECTION_STRING_CORE}
      Cors__AllowedOrigins: ${CORS_ORIGIN:-https://qa.flitsas.online}
      # File Manager: DONDE LEE V2 los binarios de los adjuntos. Sin esta variable
      # cae al default de appsettings.json, que apunta a AWS pdn. Al pasar V2 a MinIO
      # hay que definirla, y tiene que ser EXACTAMENTE la misma URL que recibe el
      # migrador en FLITMIG_TargetFileManager__BaseUrl: si difieren, el migrador sube
      # a un sitio y la API lee de otro, los adjuntos migrados existen en la tabla
      # pero no abren. Falla en silencio.
      FileManager__BaseUrl: ${FILE_MANAGER_BASE_URL:-https://ny46zhyeti.execute-api.us-east-1.amazonaws.com/pdn/}
      # Login deshabilitado temporalmente: DevGenerate evita exigir llaves JWT
      # montadas. Para reactivar login, montar jwt-private/public.pem y quitar esto.
      Jwt__DevGenerate: "true"
      # Verifik se configura por env vars CRUDAS (no por convención .NET `Verifik__`):
      # InfrastructureExtensions lee Environment.GetEnvironmentVariable("VERIFIK_*").
      # Pasar las claves `Verifik__*` NO funciona (el código no las lee) → token vacío → 401.
      VERIFIK_API_TOKEN: ${VERIFIK_API_TOKEN:-}
      VERIFIK_BASE_URL: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      VERIFIK_TIMEOUT_SECONDS: ${VERIFIK_TIMEOUT_SECONDS:-30}
      # Modos real|mock por proveedor (explícitos para un deploy determinista).
      VERIFIK_VEHICLE_MODE: ${VERIFIK_VEHICLE_MODE:-real}
      VERIFIK_CONDUCTOR_MODE: ${VERIFIK_CONDUCTOR_MODE:-mock}
      VERIFIK_SIMIT_MODE: ${VERIFIK_SIMIT_MODE:-mock}
      VERIFIK_RNMC_MODE: ${VERIFIK_RNMC_MODE:-mock}
      VERIFIK_RUES_MODE: ${VERIFIK_RUES_MODE:-mock}
      INTEMPO_MODE: ${INTEMPO_MODE:-mock}
      # Avalúo Fasecolda (Feature #10707). Mismo patrón CRUDO que Verifik/Kyverum:
      # InfrastructureExtensions lee Environment.GetEnvironmentVariable("FASECOLDA_*");
      # pasar `Fasecolda__*` NO funciona. Sin FASECOLDA_MODE el proveedor cae a mock y
      # suggested-value responde "Sin valor de referencia mock para el VIN".
      # Credenciales solo en el .env del VPS — NUNCA en el repo.
      FASECOLDA_MODE: ${FASECOLDA_MODE:-mock}
      FASECOLDA_API_USERNAME: ${FASECOLDA_API_USERNAME:-}
      FASECOLDA_API_PASSWORD: ${FASECOLDA_API_PASSWORD:-}
      FASECOLDA_BY_VIN_API_BASE_URL: ${FASECOLDA_BY_VIN_API_BASE_URL:-https://fasecoldaback.quantil.co}
      FASECOLDA_BY_VIN_API_PATH: ${FASECOLDA_BY_VIN_API_PATH:-/api/busquedaVin}
      FASECOLDA_API_BASE_URL: ${FASECOLDA_API_BASE_URL:-https://guiadevalores.fasecolda.com/apifasecolda}
      FASECOLDA_AUTH_API_PATH: ${FASECOLDA_AUTH_API_PATH:-/token}
      FASECOLDA_LIST_CODE_API_PATH: ${FASECOLDA_LIST_CODE_API_PATH:-/api/listacodigosid/consultabycodigo}
      FASECOLDA_API_GRANT_TYPE: ${FASECOLDA_API_GRANT_TYPE:-password}
      FASECOLDA_API_SECONDS_TIMEOUT: ${FASECOLDA_API_SECONDS_TIMEOUT:-55}
      # HU #10970 — modo por AMBIENTE de las validaciones transversales del ciclo de vida:
      #   · CF-01 duplicidad de trámite en curso (409 DUPLICATE_ACTIVE_PROCEDURE)
      #   · CF-03 precondición registral / vehículo ya matriculado (422 VEHICLE_STATE_INVALID_FOR_TYPE)
      # Valores: block (bloquea) | warn (no bloquea, deja el check amarillo) | off (no evalúa).
      # Este compose es el MISMO en DEV, QA y PDN y los tres corren con ASPNETCORE_ENVIRONMENT=Development,
      # así que el ambiente se distingue por el .env del VPS, NO por appsettings.{Environment}.json.
      # Default block en los tres: si el .env no define la variable, la regla sigue bloqueando (fail-safe).
      # Matriz acordada: DEV warn/warn · QA block/warn · PDN block/block (local va por appsettings.Development.json).
      TramiteValidations__DuplicateActiveProcedure__Mode: ${TRAMITE_VALIDATION_DUPLICATE_MODE:-block}
      TramiteValidations__VehicleRegistrationState__Mode: ${TRAMITE_VALIDATION_VEHICLE_STATE_MODE:-block}
      # SMTP — vars ya presentes en el .env del VPS
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
      Smtp__DisableAuthentication: ${SMTP_DISABLE_AUTH:-false}
      Smtp__DefaultSenderEmail: ${SMTP_FROM:-}
      Smtp__DefaultSenderPassword: ${SMTP_PASSWORD:-}
      Smtp__DefaultSenderName: ${SMTP_FROM_NAME:-FLIT Tramites}
      # Biometría (HU #10233 — Kyverum Verify). Mismo patrón que Verifik: el código
      # lee env vars CRUDAS (BIOMETRICS_PROVIDER / KYVERUM_*), no `Kyverum__*`.
      # Default mock ⇒ no rompe regresión si el .env no define el proveedor.
      BIOMETRICS_PROVIDER: ${BIOMETRICS_PROVIDER:-mock}
      KYVERUM_API_KEY: ${KYVERUM_API_KEY:-}
      KYVERUM_BASE_URL: ${KYVERUM_BASE_URL:-https://verify.kyverum.com}
      KYVERUM_AUTH_SCHEME: ${KYVERUM_AUTH_SCHEME:-Bearer}
      KYVERUM_TIMEOUT_SECONDS: ${KYVERUM_TIMEOUT_SECONDS:-30}
      KYVERUM_WEBHOOK_CALLBACK_URL: ${KYVERUM_WEBHOOK_CALLBACK_URL:-}
      # Kyverum RUNT — dominio DISTINTO de Kyverum Verify (runt.kyverum.com vs
      # verify.kyverum.com): mismo proveedor, otro producto y otra API key/scope.
      # UN SOLO bloque alimenta DOS consumidores porque comparten ImprontaRuntOptions:
      #   · improntas (HU #10465, ImprontaRuntClient — endpoint improntas:generar)
      #   · consultas RUNT (HU #10478, KyverumRuntApiClient — vehículo/conductor default,
      #     con fallback a Verifik).
      # Mismo patrón CRUDO: InfrastructureExtensions.AddImprontas lee
      # Environment.GetEnvironmentVariable("KYVERUM_RUNT_*"), NO `ImprontaRunt__*`.
      KYVERUM_RUNT_BASE_URL: ${KYVERUM_RUNT_BASE_URL:-https://runt.kyverum.com}
      KYVERUM_RUNT_API_KEY: ${KYVERUM_RUNT_API_KEY:-}
      KYVERUM_RUNT_AUTH_SCHEME: ${KYVERUM_RUNT_AUTH_SCHEME:-Bearer}
      KYVERUM_RUNT_TIMEOUT_SECONDS: ${KYVERUM_RUNT_TIMEOUT_SECONDS:-30}
      # OCR de trámites (Anthropic). Mismo patrón: el código lee env vars CRUDAS
      # (OCR_PROVIDER / ANTHROPIC_*), no `Anthropic__*`. Default mock ⇒ no rompe si el .env no lo define.
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-60}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2000}
      # ── Integración con Terceros (ICT, Feature #10888) ──────────────────────
      # gRPC este-oeste dedicado (SOLO HTTP/2, puerto aparte del REST): core-ict llama la
      # orquestación/consulta aquí. Puerto interno (no publicado a host).
      Ict__GrpcPort: ${CORE_API_GRPC_PORT:-8082}
      # Secreto HMAC compartido con core-ict (valida el canal directo y firma el inverso).
      Ict__ServiceToken__Secret: ${ICT_SERVICE_TOKEN_SECRET:-}
      # Plano C: reflejo del estado del trámite hacia core-ict (callback gRPC).
      Ict__StateCallback__Address: http://core-ict:${CORE_ICT_PORT:-5020}
    ports:
      - "127.0.0.1:${CORE_API_PORT:-5003}:${CORE_API_PORT:-5003}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${CORE_API_PORT:-5003}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  # ── Flit.Ict.Api (Integración con Terceros, detras de YARP) — CORE_ICT_PORT ─
  core-ict:
    image: ghcr.io/flitsas/flitqa/core-ict:${CORE_ICT_TAG:-latest}
    # content root = working_dir, para que .NET encuentre su appsettings.json (dll en /app/api).
    working_dir: /app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:${CORE_ICT_PORT:-5020}
      Urls: http://0.0.0.0:${CORE_ICT_PORT:-5020}
      ConnectionStrings__Core: ${CONNECTION_STRING_CORE}
      # gRPC hacia core-api (orquestación + consultas): puerto interno dedicado HTTP/2.
      CoreApiGrpc__Address: http://core-api:${CORE_API_GRPC_PORT:-8082}
      # Secreto HMAC compartido con core-api (canal directo e inverso).
      Ict__ServiceToken__Secret: ${ICT_SERVICE_TOKEN_SECRET:-}
      # File Manager: DONDE SUBE ICT los binarios de los adjuntos. Tiene que ser EXACTAMENTE la
      # misma URL que FileManager__BaseUrl de core-api (misma var FILE_MANAGER_BASE_URL): si difieren,
      # ICT sube a un sitio y core-api lee de otro → el adjunto transferido por referencia al borrador
      # existe en la tabla pero no abre. Falla en silencio.
      FileManager__BaseUrl: ${FILE_MANAGER_BASE_URL:-https://ny46zhyeti.execute-api.us-east-1.amazonaws.com/pdn/}
    ports:
      - "127.0.0.1:${CORE_ICT_PORT:-5020}:${CORE_ICT_PORT:-5020}"
    depends_on:
      core-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${CORE_ICT_PORT:-5020}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  # ── Migrador V1 -> V2 (herramienta de operacion, NO un servicio) ──────────
  #
  # Vive tras el perfil `migracion`, asi que `docker compose up` NO lo levanta.
  # Se invoca a mano cuando toca migrar:
  #
  #   docker compose -f docker-compose.prod.yml --profile migracion run --rm \
  #     migrador --tipo registration --ids-file /work/ids.txt --dry-run
  #
  # Los ids y los reportes se intercambian por el volumen ./migracion -> /work.
  # Las credenciales salen del .env del VPS (ver .env.prod.example, bloque FLITMIG_).
  migrador:
    profiles: ["migracion"]
    image: ghcr.io/flitsas/flitqa/core-api:${CORE_API_TAG:-latest}
    entrypoint: ["dotnet", "/app/migrador/Flit.DataMigration.V1.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/migrador
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Archivos de ids de entrada y reportes de salida. Se crea en el VPS.
      - ./migracion:/work
    environment: *flitmig-env
    # Sin restart: es un proceso de un solo uso, no un servicio. Si falla, se
    # revisa el reporte y se vuelve a lanzar a mano.
    restart: "no"
    logging: *default-logging

  # ── API de migracion V1 -> V2 (mismo motor, un tramite por peticion) ───────
  #
  # Existe para que quien haga la migracion la dispare desde Postman (Runner sobre un
  # CSV de ids) sin entrar por SSH al VPS. Es un servicio normal del stack: sube con
  # `docker compose up -d` como cualquier otro y se alcanza por el gateway:
  #
  #   POST https://api.<env>.flitsas.online/api/v1/migracion/registration/26350
  #        ?instancias=todas&dryRun=true   +   cabecera X-Migration-Key
  #
  # NO publica puerto en el host: el gateway lo alcanza por la red interna del compose
  # (migracion-api:4030). Por eso el puerto interno es FIJO y no necesita variable —
  # no puede chocar con nada aunque los tres ambientes compartan VPS.
  #
  # El gateway lo enruta por un cluster PROPIO (`migracion-cluster`, ActivityTimeout
  # 00:30:00). No usar core-api-cluster: sus 30 s convertirian en 504 migraciones de
  # instancia 3 que SI se completaron.
  #
  # La cabecera X-Migration-Key es la UNICA cerradura: el gateway no exige JWT en
  # ningun ambiente (JwtRequired = RequireAssertion(true)). Si se filtra, se cambia
  # FLITMIG_MIGRACION_API_KEY en el .env y se recrea el contenedor; no exige desplegar.
  #
  # OJO al ser un servicio normal: un despliegue (`up -d`) RECREA este contenedor y
  # corta la migracion que este en vuelo. Se pierde solo la peticion en curso — cada
  # tramite va en su propia transaccion y el candado es de sesion, asi que no queda a
  # medias — pero ese id hay que volver a lanzarlo. No desplegar durante una ola.
  migracion-api:
    image: ghcr.io/flitsas/flitdev/core-api:${CORE_API_TAG:-latest}
    entrypoint: ["dotnet", "/app/migracion-api/Flit.DataMigration.Api.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/migracion-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # El MISMO bloque que el migrador de consola: si divergieran, el comando subiria
      # los adjuntos a un file-manager y el endpoint leeria de otro. Falla en silencio.
      <<: *flitmig-env
      # Puerto interno fijo: tiene que coincidir con migracion-cluster del gateway.
      ASPNETCORE_URLS: http://+:4030
      # Con false las rutas ni se registran: responden 404, no 403. Cambiarlo NO exige
      # desplegar, solo recrear el contenedor.
      FLITMIG_MigracionApi__Enabled: ${FLITMIG_MIGRACION_API_ENABLED:-false}
      # Sin llave configurada el host arranca pero NADA valida (fail-closed).
      FLITMIG_MigracionApi__ApiKey: ${FLITMIG_MIGRACION_API_KEY:-}
      FLITMIG_MigracionApi__MaxConcurrentRuns: ${FLITMIG_MIGRACION_API_MAX_CONCURRENT:-2}
    # Healthcheck propio: el HEALTHCHECK de la imagen trae el puerto 8081 en duro y se
    # heredaria roto.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  # ── Flit.Gateway (API publica YARP: /api, /hubs, /ml) — GATEWAY_PORT ──────
  gateway:
    image: ghcr.io/flitsas/flitqa/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/gateway/Flit.Gateway.dll"]
    # content root = working_dir, para que YARP cargue sus rutas de appsettings.json
    working_dir: /app/gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:${GATEWAY_PORT:-5002}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://qa.flitsas.online}
      # Destinos internos del YARP: apuntan al puerto interno de cada servicio.
      # (sobrescriben appsettings.json, que trae los puertos por defecto)
      ReverseProxy__Clusters__core-api-cluster__Destinations__core-api-1__Address: http://core-api:${CORE_API_PORT:-4003}/
      ReverseProxy__Clusters__python-ml-cluster__Destinations__python-ml-1__Address: http://python-ml:${PYTHON_ML_PORT:-4012}/
      ReverseProxy__Clusters__core-ict-cluster__Destinations__core-ict-1__Address: http://core-ict:${CORE_ICT_PORT:-4020}/
      ReverseProxy__Clusters__core-api-cluster__Destinations__core-api-1__Address: http://core-api:${CORE_API_PORT:-5003}/
      ReverseProxy__Clusters__python-ml-cluster__Destinations__python-ml-1__Address: http://python-ml:${PYTHON_ML_PORT:-5012}/
      ReverseProxy__Clusters__core-ict-cluster__Destinations__core-ict-1__Address: http://core-ict:${CORE_ICT_PORT:-5020}/
      ReverseProxy__Clusters__core-api-cluster__Destinations__core-api-1__Address: http://core-api:${CORE_API_PORT:-4003}/
      ReverseProxy__Clusters__python-ml-cluster__Destinations__python-ml-1__Address: http://python-ml:${PYTHON_ML_PORT:-4012}/
      ReverseProxy__Clusters__core-ict-cluster__Destinations__core-ict-1__Address: http://core-ict:${CORE_ICT_PORT:-4020}/
      # migracion-cluster NO se sobrescribe: migracion-api escucha en el 4030 fijo en
      # los tres ambientes (no publica puerto en el host, no hay nada con que chocar),
      # asi que vale el destino que ya trae appsettings.json.
      # Login deshabilitado temporalmente: sin llave JWT el gateway no valida firma
      # ni exige autenticación (ver Flit.Gateway/Program.cs).
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5002}:${GATEWAY_PORT:-5002}"
    depends_on:
      core-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${GATEWAY_PORT:-5002}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  # ── python-ml (FastAPI OCR/ML, detras de YARP /ml) — PYTHON_ML_PORT ────────
  python-ml:
    image: ghcr.io/flitsas/flitqa/python-ml:${PYTHON_ML_TAG:-latest}
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${PYTHON_ML_PORT:-5012}"]
    ports:
      - "127.0.0.1:${PYTHON_ML_PORT:-5012}:${PYTHON_ML_PORT:-5012}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PYTHON_ML_PORT:-5012}/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  # ── Frontend (Next.js) — FRONTEND_PORT ────────────────────────────────────
  frontend:
    image: ghcr.io/flitsas/flitqa/frontend:${FRONTEND_TAG:-latest}
    environment:
      # Next.js (next dev/start) escucha en este puerto interno.
      PORT: "${FRONTEND_PORT:-5001}"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5001}:${FRONTEND_PORT:-5001}"
    depends_on:
      - gateway
    restart: *restart
    logging: *default-logging
