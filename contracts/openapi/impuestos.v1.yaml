        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    Periodo:
      type: object
      required: [periodo, avaluo, impuesto, sancion, intereses, descuentos, pagosPrevios, totalAPagar, otrosCargos, vencimiento, referenciaPago, noLiquidable]
      description: Una vigencia adeudada. Todo monto puede ser null («Sin dato»).
      properties:
        periodo: { type: string, example: "2025" }
        avaluo: { type: number, nullable: true }
        impuesto: { type: number, nullable: true }
