      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        estado:
          type: string
          enum: [activo, inactivo]
          description: Estado derivado de is_active (soft-delete).
        fechaCreacion: { type: string, format: date-time }
      required: [id, codigo, nombre, estado, fechaCreacion]

    DocumentTypePagedResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentTypeResponse"
        totalCount: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
      required: [data, totalCount, page, pageSize]

    CreateDocumentTypeRequest:
      type: object
      description: Payload de alta (AC1).
      properties:
        codigo:
          type: string
          maxLength: 50
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9-]+$"
          description: Código único (letras, números y guiones).
        nombre:
          type: string
          maxLength: 150
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Nombre. Solo letras, números, espacios y puntuación básica (. , & ( ) / ' ° -).
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: Opcional. No permite los caracteres < ni >.
        obligatorio:
          type: boolean
          nullable: true
          description: >
            Aceptado por el AC pero NO persistido en el catálogo; la obligatoriedad
            vive por trámite en procedure_document_requirements (HU #10195).
      required: [codigo, nombre]

    UpdateDocumentTypeRequest:
      type: object
      description: Payload de actualización (AC3).
      properties:
        codigo:
          type: string
          maxLength: 50
          pattern: "^(?=.*[A-Za-z0-9])[A-Za-z0-9-]+$"
          description: Código único (letras, números y guiones).
        nombre:
          type: string
          maxLength: 150
          pattern: "^(?=.*[A-Za-zÁÉÍÓÚÜÑáéíóúüñ])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9](?:[A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9\\s]|[.,&()/'°-](?![.,&()/'°-]))*$"
          description: >-
            Nombre. Solo letras, números, espacios y puntuación básica (. , & ( ) / ' ° -).
        descripcion:
          type: string
          nullable: true
          maxLength: 500
          pattern: "^[^<>]*$"
          description: Opcional. No permite los caracteres < ni >.
      required: [codigo, nombre]

    DocumentRef:
      type: object
