  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/dictamen:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema: { type: string, format: uuid }
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote.
        schema: { type: string, format: uuid }
    get:
      tags: [Tablero]
      operationId: obtenerDictamenVehiculo
      summary: Dictamen vigente de un vehículo
      description: >
        Corte 7. Permiso diagnostico.diagnosticos.ver y la misma visibilidad que la grilla (AccesoLote). Devuelve la fila
        vigente: versión, veredicto, estado de redacción, alertamientos en el orden guardado, versión del catálogo y fecha.
        No trae override, lease, intentos ni empresa. Sin fila vigente, 404 SIN_DICTAMEN (el panel lo trata como vacío).
        No hay PUT en esta ruta: el reemplazo es del backoffice y un PUT aquí responde 404.
      responses:
        "200":
          description: Dictamen vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictamenVehiculo"
              example:
                version: 1
                veredicto: BLOQUEADO
                estado_redaccion: PENDIENTE
                alertamientos:
                  - { codigo: SOAT_NO_VIGENTE, texto: "El SOAT no está vigente, así que el traspaso queda bloqueado.", efecto: BLOQUEA, fuente: RUNT }
                catalogo_version: 1
                creado_en: "2026-11-03T15:00:00+00:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO si el lote no se ve o el vehículo no es de ese lote. `code` = SIN_DICTAMEN si el
            vehículo se ve y no tiene fila vigente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote (el de la grilla).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarPdfVehiculo
      summary: PDF corporativo de un vehículo
      description: >
        HU #13848 (F07-H3, F07-C1..C4/C8..C11). Permiso diagnostico.reportes.descargar y la misma visibilidad que la grilla.
        Se emite si el vehículo terminó (todas sus celdas en COMPLETADO o N/A) aunque el lote siga EN_PROCESO, o si el lote está
        INCOMPLETO con todas sus celdas cerradas: la fuente en ERROR sale «consulta no disponible», sin código de error ni causa
        (Q7). Encabezado con ID del diagnóstico, nombre del lote, empresa (claim company_name), creador («No disponible» si
        Identidad no responde), fecha y hora de creación (hora Colombia), tipo de análisis («Diagnóstico Simple» o «Diagnóstico
        Con Análisis IA — TRÁMITE») e identificación; una sección por fuente del alcance en el orden de la grilla (SIMIT con hasta
        100 comparendos y «y N más»; avalúo con valor sugerido o «sin valor comercial»; personas con «****» + 4 últimos y el
        rótulo «Declarado por el cliente»; impuesto departamental con «Total adeudado» y la grilla Vigencia / Valor / Estado
        «Pagada» o «Pendiente», o «No registra vigencias», HU #13864; N/A con su motivo); pie con «Generado el …» y «Página X de Y». Sin origen, usuario
        manual, proveedor ni transacción (R-20): una celda llenada a mano produce el mismo texto que una de API. Mientras no
        cambie ninguna entrada (celdas, versión del tablero, nombres del encabezado, documentos enmascarados), la descarga
        devuelve los mismos bytes ya guardados; si cambió, genera un PDF nuevo e invalida el anterior (se conserva).
      responses:
        "200":
          description: El PDF del vehículo.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}-{placa o VIN}.pdf
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario; o el vehículo no es
            de ese lote. El cuerpo no trae datos del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = VEHICULO_NO_TERMINADO: el vehículo todavía tiene consultas sin terminar y el lote no está INCOMPLETO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/excel:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarExcelLote
      summary: Excel del lote con columnas según el alcance y lo ya completado
      description: >
        HU #13849 (F07-H4, F07-C5/C6/C8..C11). Permiso diagnostico.reportes.descargar y la misma visibilidad que la grilla. Se
        emite con el lote EN_PROCESO, COMPLETADO o INCOMPLETO (lo no terminado sale con su estado). Hojas, en este orden:
        «Vehículos»: una fila por vehículo en el orden de la carga. Columnas fijas Orden, Identificador, Tipo de identificador
        (código, p. ej. PLACA_CARRO), Placa, VIN y Estado del vehículo (Terminado, En proceso o Con error). Luego, por cada fuente
        del alcance en el orden de la grilla, «{fuente} — Estado» (Completado, Pendiente, «No aplica: {motivo}» o «Consulta no
        disponible», sin código de error ni causa) y sus columnas de dato, que solo se llenan con la fuente Completado (catálogo
        ColumnasExcel): RUNT → Servicio, Clase, Organismo de tránsito, Marca, Línea, Modelo, Propietarios (cantidad), Locatarios
        (cantidad); SIMIT vehículo → Semáforo, Comparendos, Valor total; RUNT propietarios / RUNT locatarios → Personas
        consultadas, Personas con error, Documentos («TIPO ****1234» separados por «; », con «(Declarado por el cliente)» si lo
        declaró el cliente); SIMIT propietarios / SIMIT locatarios → las mismas más Comparendos y Valor total sumados de las
        personas; Avalúo → Valor sugerido, Fuente principal, Sin valor comercial (Sí/No); Impuesto departamental → Total adeudado (número,
        pesos enteros) y Vigencias pendientes (cantidad de vigencias no pagadas), HU #13864.
        El valor total en pesos es número; si el SIMIT trajo más comparendos de los que se listan (tope 100) sale el texto
        «al menos N». «Diagnóstico»: ID del diagnóstico, nombre del lote, empresa (claim company_name), usuario creador («No
        disponible» si Identidad no responde), fecha de creación (hora Colombia) y tipo de análisis («Diagnóstico Simple» o
        «Diagnóstico Con Análisis IA — TRÁMITE»). «Consultas»: solo con estimado_consultas=AL_FINALIZAR en la copia de
        configuración del lote y el lote COMPLETADO o INCOMPLETO; fuente, consultas estimadas, consultas consumidas y
        «al menos» si el estimado es mínimo (el mismo cálculo de la grilla). Sin origen, usuario manual, proveedor ni transacción
        (R-20): una celda llenada a mano produce la misma fila que una de API. Toda celda de texto que empiece por =, +, -, @,
        tabulador o retorno de carro se escribe como texto literal (sin fórmula, con quotePrefix). Mientras no cambie ninguna
        entrada (celdas, versión del tablero, nombres del encabezado, documentos enmascarados, estado del lote, lo que muestra
        el libro), la descarga devuelve los mismos bytes ya guardados; si cambió, genera un Excel nuevo e invalida el anterior
        (se conserva).
      responses:
        "200":
          description: El Excel del lote.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}.xlsx
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario. El cuerpo no trae datos
            del lote. Se comprueba antes del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = LOTE_SIN_LANZAR: el lote sigue CREADO (sin vehículos lanzados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    post:
      tags: [Reportes]
      operationId: pedirZipLote
      summary: Pide el ZIP con los PDF del lote, que se genera en segundo plano
      description: >
        HU #13850 (F07-H5, F07-C4/C7/C8/C9/C11/C12; decisiones Q2, Q5 y Q7). Permiso diagnostico.reportes.descargar y la misma
        visibilidad que la grilla. Solo `tipo` = ZIP. Entran los vehículos que pueden emitir su PDF (la regla del PDF del vehículo:
        terminados, aunque el lote siga EN_PROCESO, y con el lote INCOMPLETO también los que tienen fuentes en ERROR, que salen
        «consulta no disponible»); los demás van en el índice. Huella del ZIP = versión de la plantilla + entradas del lote (celdas con
        su versión del tablero, cabecera, empresa, creador, documentos enmascarados, estado del lote) + lista ordenada de los
        vehículos incluidos. Si el ZIP vigente está LISTA con esa huella responde 200 con él (no encola); si hay uno PENDIENTE o
        GENERANDO con esa huella responde 202 con el mismo id (no duplica, tampoco con pedidos simultáneos); si no, encola uno nuevo
        (202) con quien lo pidió (claim sub) y la empresa del claim company_name. Mientras el nuevo está en la cola, el anterior LISTA
        sigue vigente y descargable; al quedar LISTA el nuevo, el anterior pasa a no vigente (se conserva). Sin tope propio de
        vehículos: lo acota limite_vehiculos_lote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudEvidencia"
      responses:
        "200":
          description: Ya hay un ZIP LISTA y vigente con la misma huella (nada cambió desde que se generó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "202":
          description: El ZIP está en la cola (nuevo, o el que ya estaba con la misma huella). Sondear el estado hasta LISTA o ERROR.
          headers:
            Location:
              description: /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid} (estado del ZIP).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario. Sin datos del lote. Se
            comprueba antes del 422 y del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = SIN_VEHICULOS_TERMINADOS: ningún vehículo del lote puede emitir todavía su PDF. No se crea evidencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `code` = TIPO_INVALIDO, `campo` = tipo: el tipo no es ZIP (los PDF y el Excel se descargan directo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: eid
        in: path
        required: true
        description: Id del ZIP (el que devolvió el pedido).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: estadoZipLote
      summary: Estado del ZIP del lote
      description: >
        HU #13850 (F07-H5). Permiso diagnostico.reportes.descargar y la visibilidad de la grilla. Para sondear tras el pedido
        (Cache-Control no-store). PENDIENTE → GENERANDO → LISTA, o ERROR tras agotar los reintentos (por defecto 2, con espera
        creciente). Un fallo con reintentos pendientes vuelve a PENDIENTE.
      responses:
        "200":
          description: El estado del ZIP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.reportes.descargar (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no se ve (otra compañía o PROPIOS de otro usuario) o el ZIP no es de ese lote. Sin datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid}/archivo:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: eid
        in: path
        required: true
        description: Id del ZIP.
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarZipLote
      summary: Descarga el ZIP del lote cuando está LISTA
      description: >
        HU #13850 (F07-H5, F07-C9/C11). Permiso diagnostico.reportes.descargar y la visibilidad de la grilla. Un PDF por vehículo
        incluido (diagnostico-{8 primeros del id}-{placa o VIN}.pdf, el mismo PDF del vehículo: si su huella coincide se reutiliza el
        PDF vigente) e indice.xlsx (ajustes 2026-11-11, punto 8; reemplaza a indice.txt), una sola hoja: arriba el nombre del
        diagnóstico, la fecha y hora de generación (Colombia) y «N de M vehículos con PDF»; debajo una tabla con encabezado y
        autofiltro con todos los vehículos del lote en el orden de la carga: Orden, Placa/VIN (texto), Estado (Terminado, En proceso
        o Con error), En el ZIP (Sí / No), Archivo (nombre del PDF con vínculo relativo dentro del ZIP; vacío si no va), Dictamen
        (Viable, Bloqueado o Pendiente si no hay dictamen emitido), Motivos de bloqueo (rótulos de las reglas que bloquean,
        separados por «; », solo con Bloqueado) y Trámite (número del borrador creado desde el diagnóstico; vacío si no hay).
        Sin documentos completos, nombres de personas, origen, usuario manual, proveedor ni transacción
        (R-20). Un ZIP LISTA que ya no es el vigente se sigue pudiendo descargar por su id.
      responses:
        "200":
          description: El ZIP.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}.zip
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.reportes.descargar (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no se ve o el ZIP no es de ese lote. Se comprueba antes del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = EVIDENCIA_NO_LISTA: el ZIP está PENDIENTE, GENERANDO o en ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/consultas/{cid}/reprocesar:
    parameters:
      - name: cid
        in: path
        required: true
        description: Id de la celda (diagnostico.consultas).
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reprocesarConsulta
      summary: Reprocesa una celda en ERROR repitiendo la consulta real
      description: >
        HU #13746 (F03-H8, R-1, R-8, plan §6.1 fila 03). Permiso diagnostico.consultas.reprocesar (admin de la compañía;
        el usuario del producto recibe 403). Sin cuerpo: lo que venga se ignora y nunca se escriben datos de resultado.
        La celda vuelve a PENDIENTE con intentos_auto=0 y sube version_tablero (el sondeo de la grilla la ve volver a
        gris); el procesador repite la consulta real, sin reutilizar el dato del mismo día, y el intento queda con
        disparador=REPROCESO y el usuario del token. Si el lote estaba COMPLETADO o INCOMPLETO vuelve a EN_PROCESO, sin
        cerrado_en, con una fila del historial disparador=REPROCESO y el usuario; al terminar, el recalculador fija el
        estado final (COMPLETADO con historial AUTO si todo quedó bien). Las celdas COMPLETADO no se tocan. Al reprocesar
        la RUNT de un vehículo y terminar en OK, sus celdas BLOQUEADA_POR_RUNT vuelven a PENDIENTE en la misma
        transacción (pasando por las reglas de no aplica) y corren con disparador=REPROCESO y el mismo usuario; si la RUNT
        vuelve a fallar, siguen en ERROR. En una celda de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO, HU #13792;
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO, HU #13794) solo se vuelve a consultar a las personas que quedaron en
        ERROR: las que respondieron conservan su resultado y no se vuelven a consumir.
      responses:
        "202":
          description: La celda quedó en cola para repetir la consulta real.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocesoConsulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe, es de otra compañía o su lote (con PROPIOS) es de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            No es reprocesable y nada cambia: `code` = CELDA_NO_EN_ERROR (la celda no está en ERROR),
            CELDA_BLOQUEADA_POR_RUNT (tipo_error=BLOQUEADA_POR_RUNT y la RUNT del vehículo no está COMPLETADO: se
            reprocesa la RUNT) o CELDA_MODIFICADA (la celda cambió mientras se pedía: volver a leer la grilla).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/reintentar:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reintentarPlaca
      summary: Reencola las consultas pegadas de una placa
      description: >
        Ajuste 2026-11-11 (Punto 3, decisiones 3.2-3.4). Permiso diagnostico.consultas.reprocesar. Sin cuerpo. Reencola solo
        las celdas pegadas de la placa: en ERROR, o en PENDIENTE/EN_CURSO sin cambio hace más de
        Diagnostico:Consultas:UmbralPegada (10 min por defecto). Si la RUNT del vehículo no está COMPLETADO solo se reencola
        la RUNT (las demás esperan su cierre). Las COMPLETADO, NA y las recientes no se tocan. Cada celda sale por el camino
        del reproceso: PENDIENTE, intentos_auto=0 (vuelve a tener sus reintentos automáticos), disponible_desde=ahora, intento
        con disparador=REPROCESO y el usuario, y un trabajo con trabajo_id NUEVO; la respuesta tardía del trabajo anterior se
        descarta. Un lote COMPLETADO o INCOMPLETO vuelve a EN_PROCESO (historial REPROCESO). Idempotente: pulsar dos veces
        seguidas responde reencoladas=0 la segunda (una celda recién reencolada no cuenta como pegada). El dictamen de la placa
        se recalcula al completarse sus consultas.
      responses:
        "200":
          description: Celdas reencoladas (0 si no había ninguna pegada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReintentoPegadas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario, o el vehículo no es del lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = CELDA_MODIFICADA: una celda cambió mientras se pedía el reintento; volver a leer la grilla."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/tramite:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Derivacion]
      operationId: crearTramiteDesdeVehiculo
      summary: Crea el borrador del trámite de una placa (individual, síncrono)
      description: >
        Punto 4, incremento 2 (ADR-0084, diseño §5.1). Permiso diagnostico.derivacion.crear (el rol de backoffice no lo tiene).
        Solo existe con Diagnostico:Derivacion:Habilitada=true (apagada por defecto: 404). Desde el contexto de backoffice
        (petición con la empresa explícita ?empresa=) responde 403 DERIVACION_DESDE_BACKOFFICE aunque se tenga el permiso.
        Revalida en el servidor la misma regla de la grilla (fila derivacion): vehículo terminado, dictamen vigente VIABLE
        (solo en lotes CON_ANALISIS; los SIMPLE no tienen dictamen), sin trámite y sin otro intento en curso. Tipo de trámite:
        en CON_ANALISIS el del lote (se ignora el del cuerpo); en SIMPLE el tipo_tramite_codigo del cuerpo, validado contra
        GET /tipos-tramite. Llama al rpc CrearBorradorDesdeDiagnostico de core-api con la empresa del lote, el usuario que
        lanza como autor, external_ref = id del vehículo y el OT de matrícula del RUNT (nombre y código de la réplica). Es
        idempotente en Trámites: si el borrador ya existía responde 201 con ya_existia=true. Un rechazo de Trámites deja el
        intento OMITIDO (la placa se puede volver a intentar); Trámites caído lo deja FALLIDO. Al crearse, el vehículo guarda
        el trámite (id y número) una sola vez.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTramiteEntrada"
      responses:
        "201":
          description: Borrador creado (o ya existente en Trámites).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TramiteCreado"
        "400":
          description: >
            code = TIPO_TRAMITE_REQUERIDO (lote SIMPLE sin tipo_tramite_codigo, campo = tipo_tramite_codigo),
            TIPO_TRAMITE_INVALIDO (no está en el catálogo de la etapa) o CUERPO_INVALIDO (JSON inválido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.derivacion.crear; desde el backoffice (code = DERIVACION_DESDE_BACKOFFICE); sin compañía
            (code = SIN_EMPRESA); compañía sin Diagnóstico activo (code = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            code = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario, o el vehículo no es
            del lote. También si la derivación está apagada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "code = YA_TIENE_TRAMITE: el vehículo ya tiene su trámite; no se llama a Trámites."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictoTramite"
        "422":
          description: >
            code = NO_ELEGIBLE. motivo_codigo: NO_TERMINADO, NO_VIABLE, EN_CURSO (otro intento del vehículo en vuelo, p. ej.
            doble clic) o un rechazo de Trámites (TIPO_NO_DISPONIBLE, FAMILIA_BLOQUEADA, USUARIO_SIN_PERMISO, OT_NO_HABILITADO,
            REGLA_COMPANIA, TRAMITE_ACTIVO_DUPLICADO, EMPRESA_INACTIVA, REFERENCIA_DE_OTRO_ORIGEN, DATOS_INVALIDOS,
            RECHAZO_TRAMITES). motivo en lenguaje claro, sin datos personales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoElegibleDerivacion"
        "503":
          description: >
            code = TRAMITES_NO_DISPONIBLE (o CATALOGO_NO_DISPONIBLE si en un lote SIMPLE el catálogo no responde). Con
            Retry-After solo si es transitorio (UNAVAILABLE, RESOURCE_EXHAUSTED, DEADLINE_EXCEEDED, INTERNAL); sin él si es de
            configuración (cliente de servicio rechazado o derivación apagada en core-api). El intento queda FALLIDO y se puede
            volver a pedir. Incremento 3: con el freno hacia Trámites abierto (varios transitorios seguidos) responde 503 sin
            llamar ni crear el intento, con Retry-After = lo que falta de la pausa.
          headers:
            Retry-After:
              description: Segundos antes de reintentar (solo transitorio).
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Derivacion]
      operationId: crearTramitesDesdeDiagnostico
      summary: Crea los borradores de trámite de una selección del lote (masivo, encolado)
      description: >
        Punto 4, incremento 3 (ADR-0084, diseño §5.1 y §5.3). Permiso diagnostico.derivacion.crear; 403
        DERIVACION_DESDE_BACKOFFICE desde el contexto de backoffice. Solo existe con Diagnostico:Derivacion:Habilitada=true.
        vehiculo_ids son los vehículos elegidos, en el orden de la selección (los repetidos cuentan una vez), entre 1 y
        Diagnostico:Derivacion:MaxItemsPorOperacion (5000). Todos deben ser del lote (si no, 400 VEHICULO_FUERA_DEL_LOTE y no
        se crea nada). Tipo de trámite: el del lote en CON_ANALISIS (se ignora el del cuerpo); en SIMPLE el del cuerpo,
        validado contra GET /tipos-tramite. En una transacción crea la operación MASIVA con un ítem por vehículo: los
        elegibles PENDIENTE y los no elegibles OMITIDO de inmediato con su motivo (no_elegibles); luego libera como mucho
        Diagnostico:Derivacion:CreditoPorCompania ítems de la compañía (2 por defecto) publicando por la outbox el evento
        diagnostico.derivacion.solicitada (solo ids). Cada ítem que cierra libera el siguiente de la compañía. No llama a
        Trámites en la petición. Idempotente ante el doble clic: un vehículo con un ítem vivo (de este envío o de otro) queda
        en no_elegibles con EN_CURSO; nunca hay dos ítems vivos del mismo vehículo. El progreso se lee en Location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTramitesEntrada"
      responses:
        "202":
          description: Operación creada y encolada.
          headers:
            Location:
              description: /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones/{operacion_id}
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacionEncolada"
        "400":
          description: >
            code = VEHICULOS_REQUERIDOS (lista vacía o ausente, campo = vehiculo_ids), DEMASIADOS_VEHICULOS (más de
            MaxItemsPorOperacion), VEHICULO_FUERA_DEL_LOTE (algún vehículo no es del lote), TIPO_TRAMITE_REQUERIDO,
            TIPO_TRAMITE_INVALIDO o CUERPO_INVALIDO. Las dos primeras y CUERPO_INVALIDO se deciden sin tocar la base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.derivacion.crear o desde el backoffice (code = DERIVACION_DESDE_BACKOFFICE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no existe o no es visible para el usuario. También con la derivación apagada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "code = CATALOGO_NO_DISPONIBLE: lote SIMPLE y el catálogo de tipos no responde (con Retry-After)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: ultima
        in: query
        required: false
        description: Con true, las operaciones EN_CURSO del lote y la más reciente (para retomar al volver a la pantalla).
        schema:
          type: boolean
    get:
      tags: [Derivacion]
      operationId: listarOperacionesDerivacion
      summary: Operaciones «Crear trámite» del lote
      description: >
        Punto 4, incremento 3. Permiso diagnostico.diagnosticos.ver. De la más reciente a la más antigua (20). Lee solo los
        contadores propios de Diagnóstico; nunca llama a core-api.
      responses:
        "200":
          description: Operaciones del lote.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgresoOperacion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no existe o no es visible. También con la derivación apagada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones/{opId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: opId
        in: path
        required: true
        description: Id de la operación.
        schema:
          type: string
          format: uuid
      - name: estado
        in: query
        required: false
        description: Filtra los ítems por estado.
        schema:
          type: string
          enum: [PENDIENTE, ENVIADO, CREADO, OMITIDO, FALLIDO]
      - name: pagina
        in: query
        required: false
        description: Página de ítems (50 por página), desde 1.
        schema:
          type: integer
          minimum: 1
          default: 1
    get:
      tags: [Derivacion]
      operationId: leerOperacionDerivacion
      summary: Progreso de una operación «Crear trámite»
      description: >
        Punto 4, incremento 3. Permiso diagnostico.diagnosticos.ver. Contadores (pendientes = total − creadas − omitidas −
        fallidas, incluye los en vuelo), motivos agrupados de OMITIDO y FALLIDO y una página de ítems por orden de la
        selección. El front lo sondea cada 3 s mientras está EN_CURSO. Lee solo tablas de Diagnóstico; nunca llama a core-api.
      responses:
        "200":
          description: Progreso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleOperacionDerivacion"
        "400":
          description: "code = ESTADO_INVALIDO: el filtro estado no es uno de los cinco."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no es visible o la operación no es de ese lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/tramites/operaciones/{opId}/reintentar-fallidas:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
      - name: opId
        in: path
        required: true
        description: Id de la operación.
        schema:
          type: string
          format: uuid
    post:
      tags: [Derivacion]
      operationId: reintentarFallidasDerivacion
      summary: Vuelve a encolar los ítems FALLIDO de una operación
      description: >
        Punto 4, incremento 3. Permiso diagnostico.derivacion.crear; 403 DERIVACION_DESDE_BACKOFFICE desde el backoffice.
        Solo con la operación sin ítems PENDIENTE ni ENVIADO (si no, 409 OPERACION_EN_CURSO). Cada FALLIDO se revalida:
        si sigue elegible se reabre el MISMO ítem a PENDIENTE (sin motivo ni intentos) y la operación vuelve a EN_CURSO; si ya
        no lo es, queda OMITIDO con su motivo. Luego se libera el crédito de la compañía. Sin fallidos responde 202 con 0.
      responses:
        "202":
          description: Fallidos reencolados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReintentoFallidas"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.derivacion.crear o desde el backoffice (code = DERIVACION_DESDE_BACKOFFICE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "code = NO_ENCONTRADO: el lote no es visible o la operación no es de ese lote."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "code = OPERACION_EN_CURSO: quedan ítems en vuelo, otro reintento corre a la vez o algún vehículo ya tiene otro ítem vivo."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/reintentar-pegadas:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote.
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reintentarPegadasLote
      summary: Reencola las consultas pegadas de todo el lote
      description: >
        Ajuste 2026-11-11 (Punto 3). Igual que reintentarPlaca, para todas las placas del lote en una sola transacción. Permiso
        diagnostico.consultas.reprocesar. Idempotente. El tablero lo ofrece como «Reintentar pegadas (N)» con N = total_pegadas
        de la grilla.
      responses:
        "200":
          description: Celdas reencoladas (0 si no había ninguna pegada).
