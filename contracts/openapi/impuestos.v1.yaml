    ItemDetalle:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [empresa, creadaPor, creadaEn, resultado, periodos, recibos]
          properties:
            empresa: { $ref: "#/components/schemas/Referencia" }
            creadaPor: { $ref: "#/components/schemas/Referencia" }
            creadaEn: { type: string, format: date-time }
            consultaStatus: { type: string, nullable: true, enum: [succeeded, partial, failed], description: "consulta.status del proveedor." }
            resultado:
              type: object
              nullable: true
              description: >
                result completo del proveedor (guía §6), tal cual: totals, lastPayment, clearance, validations (enviado
                frente a portal), warnings, file_errors y error. null sin resultado.
            periodos: { type: array, items: { $ref: "#/components/schemas/Periodo" } }
            recibos: { type: array, items: { $ref: "#/components/schemas/Recibo" } }

    AnalisisCarga:
      type: object
      required: [validas, duplicadas, invalidas, tope, superaTope]
      properties:
        validas: { type: integer, description: "Placas únicas válidas." }
        duplicadas: { type: integer }
        invalidas:
          type: array
          items:
            type: object
