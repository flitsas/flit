        intereses: { type: number, nullable: true }
        descuentos: { type: number, nullable: true }
        pagosPrevios: { type: number, nullable: true }
        totalAPagar: { type: number, nullable: true }
        otrosCargos:
          type: array
          items:
            type: object
            required: [descripcion, monto]
            properties:
              descripcion: { type: string }
              monto: { type: number, nullable: true }
        vencimiento: { type: string, format: date, nullable: true }
        referenciaPago: { type: string, nullable: true }
