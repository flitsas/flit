services:
  # ── Base de Datos: PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flit-postgres-dev
    environment:
      POSTGRES_DB: flit_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flit_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend: core-api (ASP.NET Core) ──────────────────────────────────────
  backend:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: flit-backend-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Core: Host=postgres;Port=5432;Database=flit_dev;Username=postgres;Password=postgres
      # SMTP → Office365
      Smtp__Host: smtp.office365.com
      Smtp__Port: "587"
      Smtp__UseStartTls: "true"
      Smtp__DisableAuthentication: "false"
      Smtp__DefaultSenderEmail: tramitesvehiculos@flitsas.com
      Smtp__DefaultSenderPassword: "TramitesNoti2024*"
      Smtp__DefaultSenderName: FLIT Tramites
    ports:
      - "4003:8081"
    depends_on:
      postgres:
        condition: service_healthy
    # volume configuration can be added if code changes need to be reflected dynamically (though usually require rebuilding for .NET unless dotnet watch is configured inside container)

  # ── Backend: core-ict (Integración con Terceros) ──────────────────────────
  core-ict:
    build:
      context: ./services/core-ict
      dockerfile: Dockerfile
    container_name: flit-core-ict-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:4020
      ConnectionStrings__Core: Host=postgres;Port=5432;Database=flit_dev;Username=postgres;Password=postgres
      # gRPC hacia core-api (orquestación de creación del borrador). core-api expone el server en HU4.
      CoreApiGrpc__Address: http://backend:8081
    ports:
      - "4020:4020"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  # ── Frontend: Next.js ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* se bake en build-time. Apunta al backend expuesto en el host.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4003
    container_name: flit-frontend-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Para Next.js rewrites server-side: la red interna Docker.
      CORE_API_ORIGIN: http://backend:8081
    depends_on:
      - backend

  # ── Mailhog: captura SMTP en desarrollo ───────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: flit-mailhog-dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
