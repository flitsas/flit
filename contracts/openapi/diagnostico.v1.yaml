    get:
      tags: [Tablero]
      operationId: obtenerDetalleCelda
      summary: Detalle normalizado de una celda
      description: >
        HU #13798 (F06-H1, F06-C1..C4/C12). Permiso diagnostico.diagnosticos.ver, misma visibilidad que la grilla. Devuelve
        el resultado normalizado de la celda en un DTO propio y cerrado: nunca origen, usuario manual, transacción ni payload
        en campos propios; una celda llenada a mano y una consultada por API tienen las mismas claves. HU #14087 AC8
        (decisión del usuario 2026-10-27, enmienda de ADR-0075 en Propuesto): `respuesta_fuente` (en la celda para las
        fuentes del vehículo y en cada persona para las de persona) trae la respuesta COMPLETA de la fuente en proto-JSON,
        con datos personales; null sin respuesta guardada.
        Todas las claves van siempre (null si no aplican). Fuentes del vehículo (RUNT, SIMIT_VEHICULO, AVALUO,
        IMPUESTO_DEPARTAMENTAL): `resultado`
        solo con la celda COMPLETADO y `personas` null. Fuentes de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO,
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO): `resultado` null y `personas` con una entrada por persona del rol (vacía si el
        vehículo no tiene personas de ese rol), con el documento como `****` más los cuatro últimos caracteres alfanuméricos.
        Una celda ERROR PERSONAS_CON_ERROR trae el resultado de las personas que sí respondieron. SIMIT trae como mucho 100
        comparendos por resultado (`comparendos_truncados=true` si había más; `cantidad_comparendos` es el total).
        IMPUESTO_DEPARTAMENTAL (HU #13864): `resultado` = ResultadoImpuestoDetalle (total adeudado y vigencias en pesos
        enteros) solo con la celda COMPLETADO; en N/A el `motivo_na` es DEPARTAMENTO_NO_SOPORTADO o SERVICIO_PUBLICO y `resultado`
        null; el `resultado` normalizado nunca trae el proveedor, la transacción, el origen ni el departamento consultado
        (`respuesta_fuente` sí trae lo que respondió la fuente).
      responses:
        "200":
          description: Detalle de la celda.
