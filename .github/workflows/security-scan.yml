name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 6 * * 1'  # Lunes 6am
  workflow_dispatch:
    inputs:
      runner:
        description: 'Etiqueta de runner para validar (p. ej. flit-ci); vacío = vars.RUNNER o ubuntu-latest'
        required: false
        default: ''

# runs-on: la variable de repo RUNNER (p. ej. flit-ci = runners propios de la 177) mueve estos jobs fuera de GitHub;
# sin ella siguen en ubuntu-latest. El input `runner` del workflow_dispatch sirve para validar sin tocar la variable.
jobs:
  dependency-audit:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend audit
        run: pnpm --filter @flit/backend audit --prod --audit-level high

      - name: Frontend audit
        run: pnpm --filter @flit/frontend audit --prod --audit-level high

  secret-scan:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          for i in 1 2 3; do
            curl -fL --retry 3 --retry-all-errors --retry-delay 2 -o gitleaks.tgz "$url" \
              && tar -xzf gitleaks.tgz gitleaks \
              && break
            echo "intento $i falló; reintentando..."
            sleep $((i * 2))
          done
          test -f gitleaks
          # Sin sudo (los runners propios no lo tienen): al PATH del job.
          mkdir -p "$RUNNER_TEMP/bin" && mv gitleaks "$RUNNER_TEMP/bin/" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --exit-code 1
