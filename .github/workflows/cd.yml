name: CD - Build & Deploy to VPS

on:
  push:
    branches: [release, staging, develop]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Nombres de imagen UNIFICADOS y con prefijo de registry ghcr.io/ (GHCR), igual que
  # el pull del docker-compose.prod.yml en el VPS. El ambiente se diferencia por TAG
  # (dev/qa/pdn), no por nombre de repo.
  CORE_API_IMAGE: ghcr.io/flitsas/flitdev/core-api
  # Epic #13217 (HU #13234): el servicio de identidad, con su propia imagen y su propio build.
  CORE_IDENTITY_IMAGE: ghcr.io/flitsas/flitdev/core-identity
  CORE_ICT_IMAGE: ghcr.io/flitsas/flitdev/core-ict
  FRONTEND_IMAGE: ghcr.io/flitsas/flitdev/frontend
  PYTHON_ML_IMAGE: ghcr.io/flitsas/flitdev/python-ml
  # FLIT Suite (B-09): hub en flitsas.online. Una sola imagen por ambiente, sin build-args (config en runtime).
  FRONTEND_HUB_IMAGE: ghcr.io/flitsas/flitdev/frontend-hub

jobs:
  # ── Resolver ambiente segun la rama ─────────────────────────────────────────
  # develop -> dev, staging -> qa, release -> pdn.
  # Centraliza el mapeo rama -> {ambiente, dominios, tag} en un solo lugar.
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      gh_env: ${{ steps.env.outputs.gh_env }}
      front_domain: ${{ steps.env.outputs.front_domain }}
      api_domain: ${{ steps.env.outputs.api_domain }}
      image_tag: ${{ steps.env.outputs.image_tag }}
      deploy_tag: ${{ steps.env.outputs.deploy_tag }}
      front_port: ${{ steps.env.outputs.front_port }}
      gateway_port: ${{ steps.env.outputs.gateway_port }}
      core_port: ${{ steps.env.outputs.core_port }}
      python_port: ${{ steps.env.outputs.python_port }}
      migracion_port: ${{ steps.env.outputs.migracion_port }}
      hub_port: ${{ steps.env.outputs.hub_port }}
      identity_port: ${{ steps.env.outputs.identity_port }}
      suite_env: ${{ steps.env.outputs.suite_env }}
      tramites_domain: ${{ steps.env.outputs.tramites_domain }}
      internal_subnet: ${{ steps.env.outputs.internal_subnet }}
    steps:
      - name: Map branch to environment
        id: env
        run: |
          # Puertos por ambiente: DEV 40xx, QA 50xx, PDN 60xx (front/gateway/core/python/migracion).
          # migracion_port es SOLO de la red interna del compose (no se publica en el host),
          # pero se exporta igual porque el gateway y migracion-api tienen que leer el mismo valor.
          # gh_env: nombre del GitHub Environment donde viven los secrets del VPS
          # (los Environments configurados son develop/staging/production). env_name
          # (dev/qa/pdn) se usa solo para tags de imagen y etiquetas de display.
          # FLIT_INTERNAL_SUBNET (Marca Blanca #12421): CIDR distinto por stack si DEV/QA/PDN
          # comparten VPS — Docker rechaza subredes solapadas ("Pool overlaps...").
          # Convencion: DEV 10.114.40.0/24 · QA 10.114.50.0/24 · PDN 10.114.60.0/24.
          case "${{ github.ref_name }}" in
            release)
              env_name=pdn
              gh_env=production
              # Dominios reales del VPS/nginx (NO pdn.flitsas.online — ese host no sirve el stack).
              front_domain=flitsas.online
              api_domain=api.flitsas.online
              image_tag=pdn
              front_port=6001; gateway_port=6002; core_port=6003; python_port=6012; migracion_port=6030; hub_port=6022; identity_port=6025
              # FLIT Suite (contrato §1): prefijo de ambiente de los hosts; vacío en PDN.
              suite_env=
              tramites_domain=tramites.flitsas.online
              internal_subnet=10.114.60.0/24
              ;;
            staging)
              env_name=qa
              gh_env=staging
              front_domain=qa.flitsas.online
              api_domain=api.qa.flitsas.online
              image_tag=qa
              front_port=5001; gateway_port=5002; core_port=5003; python_port=5012; migracion_port=5030; hub_port=5022; identity_port=5025
              suite_env=qa
              tramites_domain=qa.tramites.flitsas.online
              internal_subnet=10.114.50.0/24
              ;;
            develop)
              env_name=dev
              gh_env=develop
              front_domain=dev.flitsas.online
              api_domain=api.dev.flitsas.online
              image_tag=dev
              front_port=4001; gateway_port=4002; core_port=4003; python_port=4012; migracion_port=4030; hub_port=4022; identity_port=4025
              suite_env=dev
              tramites_domain=dev.tramites.flitsas.online
              # 172.28.40.0/24 (doc) ya estaba ocupado en el VPS compartido → Pool overlaps.
              # CIDR 10.114.x/24: el rango 172.28.x/24 choca en el VPS compartido (Pool overlaps).
              internal_subnet=10.114.40.0/24
              ;;
            *)
              echo "::error::Rama no soportada para deploy: ${{ github.ref_name }}"
              exit 1
              ;;
          esac
          # Tag con el que se DESPLIEGA (lo que el VPS hace pull):
          #   PDN -> sha-<commit> inmutable (rollback determinista en produccion).
          #   DEV/QA -> tag movil del ambiente (siempre lo ultimo de la rama).
          if [ "$env_name" = "pdn" ]; then
            deploy_tag="sha-${GITHUB_SHA}"
          else
            deploy_tag="$image_tag"
          fi
          {
            echo "env_name=$env_name"
            echo "gh_env=$gh_env"
            echo "front_domain=$front_domain"
            echo "api_domain=$api_domain"
            echo "image_tag=$image_tag"
            echo "deploy_tag=$deploy_tag"
            echo "front_port=$front_port"
            echo "gateway_port=$gateway_port"
            echo "core_port=$core_port"
            echo "python_port=$python_port"
            echo "migracion_port=$migracion_port"
            echo "hub_port=$hub_port"
            echo "identity_port=$identity_port"
            echo "suite_env=$suite_env"
            echo "tramites_domain=$tramites_domain"
            echo "internal_subnet=$internal_subnet"
          } >> "$GITHUB_OUTPUT"
          echo "Ambiente: $env_name | front: $front_domain ($front_port) | api: $api_domain ($gateway_port) | build-tag: $image_tag | deploy-tag: $deploy_tag | subnet: $internal_subnet"

  build-core-api:
    name: Build & push core-api (.NET) image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HU #13329: digest de la imagen que queda vigente (reutilizada o recién construida). El despliegue por servicio
    # despliega tag@digest, así compose solo recrea los contenedores cuya imagen cambió de verdad.
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para comparar contra el commit de la imagen vigente

      # El driver docker-container de Buildx baja moby/buildkit de Docker Hub al
      # arrancar y a veces da timeout (context deadline exceeded). La pre-descargamos
      # con reintentos; si queda local, Buildx no la vuelve a bajar.
      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HU #13329 (Epic #13316): si nada de lo que compila la imagen cambió, se reetiqueta la vigente en vez de
      # reconstruirla (acción .github/actions/reuse-image, la misma lógica que nació aquí en la HU #13234).
      - name: Reuse previous image when unchanged
        id: reuse
        uses: ./.github/actions/reuse-image
        with:
          image: ${{ env.CORE_API_IMAGE }}
          tag: ${{ needs.setup.outputs.image_tag }}
          paths: |
            services/core-api
            services/core-ict/Directory.Build.props
            services/core-ict/Directory.Packages.props
            services/core-ict/src/Flit.Ict.Grpc.Contracts
            # Transición (hasta el corte, HU #13235): core-api todavía compila estos proyectos de identidad.
            services/core-identity/Directory.Build.props
            services/core-identity/Directory.Packages.props
            services/core-identity/src/Flit.Identity.Application
            services/core-identity/src/Flit.Identity.Web

      - name: Extract metadata — core-api
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_API_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push core-api
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          # Context = services/ para incluir Flit.Ict.Grpc.Contracts (ProjectReference desde core-api).
          context: ./services
          file: ./services/core-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,mode=max,scope=core-api

  build-core-identity:
    name: Build & push core-identity (.NET) image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HU #13329: digest de la imagen que queda vigente (reutilizada o recién construida). El despliegue por servicio
    # despliega tag@digest, así compose solo recrea los contenedores cuya imagen cambió de verdad.
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para comparar contra el commit de la imagen vigente

      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HU #13329 (Epic #13316): si nada de lo que compila la imagen cambió, se reetiqueta la vigente en vez de
      # reconstruirla (acción .github/actions/reuse-image, la misma lógica que nació aquí en la HU #13234).
      - name: Reuse previous image when unchanged
        id: reuse
        uses: ./.github/actions/reuse-image
        with:
          image: ${{ env.CORE_IDENTITY_IMAGE }}
          tag: ${{ needs.setup.outputs.image_tag }}
          paths: |
            services/core-identity
            services/core-api/global.json
            services/core-api/Directory.Build.props
            services/core-api/Directory.Packages.props
            services/core-api/src/Flit.Api/appsettings.json
            services/core-api/src/Flit.Api/appsettings.Development.json
            services/core-api/src/Flit.Admin.Application
            services/core-api/src/Flit.Admin.Domain
            services/core-api/src/Flit.Identity.Infrastructure
            services/core-api/src/Flit.Modules.Improntas.Domain
            services/core-api/src/Flit.Modules.Platform
            services/core-api/src/Flit.Modules.Security.Application
            services/core-api/src/Flit.Modules.Security.Domain
            services/core-api/src/Flit.Platform.Sdk
            services/core-api/src/Flit.Queries.Domain
            services/core-api/src/Flit.Suite.AspNetCore
            contracts/proto

      - name: Extract metadata — core-identity
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_IDENTITY_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push core-identity
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          # Context = services/: core-identity compila librerías compartidas de core-api (ver su Dockerfile).
          context: ./services
          # HU #13334: los contratos gRPC entran como contexto con nombre (COPY --from=contracts en el Dockerfile).
          build-contexts: |
            contracts=./contracts/proto
          file: ./services/core-identity/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-identity
          cache-to: type=gha,mode=max,scope=core-identity


  build-frontend:
    name: Build & push frontend image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HU #13329: digest de la imagen que queda vigente (reutilizada o recién construida). El despliegue por servicio
    # despliega tag@digest, así compose solo recrea los contenedores cuya imagen cambió de verdad.
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reuse-image compara contra el commit de la imagen vigente

      # El driver docker-container de Buildx baja moby/buildkit de Docker Hub al
      # arrancar y a veces da timeout (context deadline exceeded). La pre-descargamos
      # con reintentos; si queda local, Buildx no la vuelve a bajar.
      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HU #13329 (Epic #13316): si nada de lo que compila la imagen cambió, se reetiqueta la vigente en vez de
      # reconstruirla (acción .github/actions/reuse-image, la misma lógica que nació aquí en la HU #13234).
      - name: Reuse previous image when unchanged
        id: reuse
        uses: ./.github/actions/reuse-image
        with:
          image: ${{ env.FRONTEND_IMAGE }}
          tag: ${{ needs.setup.outputs.image_tag }}
          paths: |
            frontend
            packages
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            .nvmrc
            # Los build-args del frontend (dominios del API, hosts FLIT) viven en este workflow.
            .github/workflows/cd.yml

      - name: Extract metadata — frontend
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push frontend
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La URL del API depende del ambiente (api.<env>.flitsas.online).
          # Prefijo NEXT_PUBLIC_: Next.js solo embebe en el bundle del cliente las
          # variables con este prefijo presentes durante `next build`.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ needs.setup.outputs.api_domain }}/api/v1
            NEXT_PUBLIC_TRASPASOS_API_BASE_URL=https://${{ needs.setup.outputs.api_domain }}/api/v1/procedures
            NEXT_PUBLIC_DEV_USER_ID=01900000-100b-7001-8001-000000000001
            # Marca Blanca (HU #12419, delta-hechos-post-adr.md #25) — hosts que se consideran
            # FLIT (sin marca de red). No hay salida de dominio de frontend en `needs.setup`,
            # así que se usa el respaldo de dominios propios de la plataforma.
            # Las entradas con "!" (HU #12761) excluyen los hosts de prueba de marca blanca, que
            # viven bajo *.flitsas.online pero deben tratarse como dominios de red. Se hornean los
            # tres a la vez porque este workflow construye una imagen por ambiente y cada ambiente
            # solo sirve su propio host: las negaciones de los otros dos son inertes.
            # El dominio raíz (flitsas.online / flitsas.com) va explícito: en PDN el frontend se
            # sirve en la raíz y debe ser host FLIT (arreglo 5ae9578f, traído de release).
            NEXT_PUBLIC_FLIT_HOSTS=flitsas.online,*.flitsas.online,flitsas.com,*.flitsas.com,!marcablancadev.flitsas.online,!marcablancaqa.flitsas.online,!marcablancapdn.flitsas.online
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # FLIT Suite (B-09) — hub. Sin build-args: la misma imagen sirve a los tres ambientes y lee su
  # configuración en runtime. En los servidores no arranca hasta encender el perfil `suite` del compose.
  build-frontend-hub:
    name: Build & push frontend-hub image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HU #13329: digest de la imagen que queda vigente (reutilizada o recién construida). El despliegue por servicio
    # despliega tag@digest, así compose solo recrea los contenedores cuya imagen cambió de verdad.
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reuse-image compara contra el commit de la imagen vigente

      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HU #13329 (Epic #13316): si nada de lo que compila la imagen cambió, se reetiqueta la vigente en vez de
      # reconstruirla (acción .github/actions/reuse-image, la misma lógica que nació aquí en la HU #13234).
      - name: Reuse previous image when unchanged
        id: reuse
        uses: ./.github/actions/reuse-image
        with:
          image: ${{ env.FRONTEND_HUB_IMAGE }}
          tag: ${{ needs.setup.outputs.image_tag }}
          paths: |
            frontend-hub
            packages/ui
            packages/brand
            packages/auth
            packages/shell
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .npmrc
            .nvmrc

      - name: Extract metadata — frontend-hub
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_HUB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push frontend-hub
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend-hub/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-hub
          cache-to: type=gha,mode=max,scope=frontend-hub

