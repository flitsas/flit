openapi: 3.0.3
info:
  title: FLIT Suite — API de Diagnóstico Vehicular
  version: "1.0.0"
  description: >
    Endpoints REST del producto Diagnóstico (core-diagnostico) bajo /api/v1/diagnostico, plan
    docs/diagnosticos/plan-implementacion-diagnostico-vehicular-v2.md §6.1. La app web llega por el
    gateway con el token del producto (aud=diagnostico). Una sesión = una compañía (D-03): la compañía
    sale siempre del token y ningún parámetro la cambia. Los permisos tienen el formato
    diagnostico.<modulo>.<accion> (§6.2) y se registran con el manifiesto del producto
    (PUT /api/v1/platform/products/diagnostico/manifest, ver platform.v1.yaml). Diagnóstico no publica
    rutas para crear o modificar compañías, usuarios, roles ni suscripciones (R-4). Los errores de
    regla responden { code, error } con un code estable. Toda ruta bajo /api/v1/diagnostico pasa por el
    guard de suscripción (HU #13726): si la compañía del token no tiene Diagnóstico activo, o no se puede
    verificar con Identidad (fail-closed), responde 403 con code PRODUCTO_NO_HABILITADO. /health y
    /health/ready no pasan por el guard.
  license:
    name: Propietario FLIT
    url: https://flitsas.com

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4032
    description: Local (core-diagnostico)

security:
  - bearerAuth: []

tags:
  - name: Sesion
    description: Lo que la app necesita al abrir.
  - name: Configuracion
    description: >
      Configuración de Diagnóstico en dos niveles (D-04, HU #13741): el contractual lo edita solo el backoffice
      FLIT y el operativo el admin de la compañía. Los valores son los códigos de la base (RUNT, EMPRESA,
      NO_MOSTRAR...) y los campos van en snake_case.
  - name: Catalogos
    description: Catálogos de la plataforma que Diagnóstico ofrece (tipos de trámite de Trámites).
  - name: Diagnosticos
    description: >
      Cabecera del diagnóstico (MOD01, HU #13750): nombre, modo, tipo de trámite y alcance sobre una copia fija de la
      configuración de la compañía. Campos en snake_case y códigos de la base.
  - name: Carga
    description: >
      Carga masiva de vehículos (MOD02, HU #13749): plantilla .xlsx y análisis local del archivo (.xlsx o .csv) en un
      resumen de validación, sin guardar filas ni consultar fuentes. Campos en snake_case y códigos de la base.
  - name: Vehiculos
    description: >
      Confirmación de los vehículos del lote (MOD02, HU #13751): revalidación en servidor, documento del locatario
      cifrado y entrega de la lista limpia al motor de consultas. Campos en snake_case y códigos de la base.
  - name: Tablero
    description: >
      Tablero del lote (MOD04, HU #13743): grilla incremental por versión (polling cada 3 s), estado global, cierre
      del panel e historial de estados. Todo con diagnostico.diagnosticos.ver y la visibilidad de la compañía
      (visibilidad_usuario=PROPIOS limita al creador; el admin de la compañía ve todos). Campos en snake_case.
  - name: Derivacion
    description: >
      Crear trámite desde el diagnóstico (Punto 4, ADR-0084): borrador en Trámites servidor a servidor, sin wizard.
      Incremento 2: individual síncrono. Apagado por defecto (Diagnostico:Derivacion:Habilitada).
  - name: Express
    description: >
      Diagnóstico Express de un solo vehículo (MOD02, HU #13753): cabecera y vehículo en una transacción, con las mismas
      reglas de la cabecera y de la confirmación, y el estimado de vista previa. Campos en snake_case y códigos de la base.
  - name: Reportes
    description: >
      Evidencias de la compañía (MOD07, F07): PDF corporativo de un vehículo (HU #13848) con el membrete FLIT y Excel del lote
      (HU #13849). Permiso
      diagnostico.reportes.descargar y la visibilidad de la grilla. Nunca origen, usuario manual, proveedor, transacción ni
      documentos completos (R-20).
  - name: Backoffice
    description: >
      Lectura entre compañías del backoffice (D-16, ADR-0073; ajustes 2026-11-11, punto 1). Dos políticas: la de
      configuración (diagnostico.backoffice: SuperAdmin de cualquier compañía, o diagnostico.backoffice.ver y
      tenant_type=FLIT a la vez) para resumen, contrato, diagnósticos, intentos, fuentes obligatorias y empresas; y la de
      operación FLIT (diagnostico.backoffice.operacion: compañía FLIT con el permiso o SuperAdmin de FLIT) para el
      override del dictamen y el llenado manual. Empresa explícita y auditoría de cada lectura.

paths:
  /api/v1/diagnostico/sesion:
    get:
      tags: [Sesion]
      operationId: obtenerSesionDiagnostico
      summary: Sesión del usuario en Diagnóstico
      description: >
        Usuario, compañía, roles, permisos de Diagnóstico y capacidades, todo leído del token (HU #13724).
        Usuario del producto (política diagnostico.usuario): al menos un permiso diagnostico.* o SuperAdmin;
        un token de servicio o un rol de otro producto sin permisos de Diagnóstico recibe 403 (HU #13726). No acepta parámetros: si llega un parámetro o la cabecera X-Flit-Tenant-Id con otra
        compañía, se ignora. `permisos` solo trae slugs diagnostico.* (el token también lleva los de
        plataforma). `capacidades.backoffice` sigue la política de configuración del backoffice (SuperAdmin de
        cualquier compañía, o diagnostico.backoffice.ver + tenant_type=FLIT) y `capacidades.backofficeOperacion`, la de
        operación FLIT (override del dictamen y llenado manual; ajustes 2026-11-11, punto 1).
      responses:
        "200":
          description: Sesión de la compañía del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sesion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Token de servicio o usuario sin permisos de Diagnóstico; usuario sin compañía (`code` = SIN_EMPRESA);
            compañía sin Diagnóstico activo o suscripción no verificable (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/configuracion:
    get:
      tags: [Configuracion]
      operationId: obtenerConfiguracionDiagnostico
      summary: Configuración de la compañía del token (dos niveles)
      description: >
        Permiso diagnostico.configuracion.ver. Devuelve el nivel contractual marcado de solo lectura y el
        operativo de la compañía del token (HU #13741). Nunca trae redaccion_ia_suspendida ni el autor de los
        cambios contractuales. Sin fila guardada devuelve los valores por defecto (RUNT, 500, EMPRESA, RUNT,
        NO_MOSTRAR) sin escribir.
      responses:
        "200":
          description: Configuración de la compañía del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.configuracion.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Configuracion]
      operationId: editarConfiguracionOperativa
      summary: Edita el nivel operativo de la compañía del token
      description: >
        Permiso diagnostico.configuracion.editar. Solo visibilidad_usuario, fuentes_por_defecto y
        estimado_consultas; se guardan los campos que llegan, con el usuario y la fecha (sin fila, la crea con
        los valores contractuales por defecto). Orden de validación: un campo que no es operativo (los
        contractuales, redaccion_ia_suspendida, usuarios, roles, suscripción o cualquier otro) responde 403
        CAMPO_NO_EDITABLE y no guarda ningún campo; un valor fuera de su conjunto responde 422
        VALOR_FUERA_DE_CONJUNTO; una fuente por defecto que no está habilitada, 422
        POR_DEFECTO_FUERA_DE_HABILITADAS. Una regla de la base que aun así falle (CHECK, SQLSTATE 23514)
        responde 422 VALOR_INVALIDO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionOperativa"
      responses:
        "200":
          description: Configuración guardada (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Configuracion"
        "400":
          description: El cuerpo no es un objeto JSON o repite un campo (`code` = CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.configuracion.editar (sin cuerpo); campo no operativo (`code` = CAMPO_NO_EDITABLE);
            sin usuario (`code` = SIN_USUARIO), sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico
            activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, POR_DEFECTO_FUERA_DE_HABILITADAS o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/tipos-tramite:
    get:
      tags: [Catalogos]
      operationId: listarTiposTramiteDiagnostico
      summary: Tipos de trámite de la etapa (modo Con Análisis IA)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13742). Proxy del rpc ListarTiposTramite de
        flit.tramites.v1.CatalogosService (core-api, token de servicio svc-diagnostico con scope
        platform.tramites.catalogos). Solo los tipos publicados cuyo código está en la lista blanca
        Diagnostico:TiposTramite:Habilitados (TRASPASO_STANDARD, TRASPASO_UNILATERAL,
        TRASPASO_TRANSFERENCIA_DE_DOMINIO), filtrados por código y nunca por nombre, en el orden de la
        publicación. Catálogo global, igual para toda compañía. La última respuesta correcta se guarda 5
        minutos; con esa copia vigente no se llama al rpc. Si el rpc falla con Unavailable o DeadlineExceeded
        se reintenta 2 veces (200 ms y 600 ms, 3 s por llamada); PermissionDenied y Unauthenticated no se
        reintentan. La copia de 5 minutos guarda código, nombre y familia de Trámites, no las fuentes.
        fuentesObligatorias sale del catálogo global de FLIT (ADR-0078): cabecera del tipo, si no la de su
        familia, si no []. Cada listado las lee en Postgres, así que un guardado del backoffice se ve en el
        GET siguiente sin esperar la vigencia. Si esa lectura falla, la respuesta no es un arreglo vacío.
      responses:
        "200":
          description: Tipos de trámite de la etapa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiposTramite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = CATALOGO_NO_DISPONIBLE: Trámites no respondió tras los reintentos (o rechazó al cliente de
            servicio) y no hay copia vigente. No se devuelve ninguna lista fija ni una copia vencida.
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos:
    get:
      tags: [Diagnosticos]
      operationId: listarDiagnosticos
      summary: Lotes de la compañía del token con filtros y visibilidad por usuario
      description: >
        Permiso diagnostico.diagnosticos.ver (HU #13845, F08-H1). Solo lotes de la compañía del token (nunca un parámetro),
        con la misma visibilidad que la lectura individual del tablero (AccesoLote): visibilidad_usuario EMPRESA (o sin
        configurar) ve todos los de la compañía; PROPIOS, solo los que creó el usuario; el admin de la compañía
        (diagnostico.configuracion.editar) ve todos. Orden creado_en desc e id desc, paginado. Fechas en días de Colombia
        (UTC-5), desde y hasta inclusivos. Sin filtro de estado aparecen también los lotes sin lanzar (estado CREADO,
        rótulo «Sin lanzar» en la interfaz); no se puede filtrar por CREADO. nombre filtra por «contiene» sin distinguir
        mayúsculas (% y _ son literales). tipo_tramite es null en SIMPLE; su nombre sale del catálogo de tipos de trámite
        y, si el código ya no está publicado o el catálogo no responde, es el código. usuario_creador.nombre lo da
        Identidad (ObtenerUsuario, caché de 10 min); si no responde o no conoce al usuario, «No disponible» (la respuesta
        sigue siendo 200). No trae configuración, alcance ni documentos.
      parameters:
        - name: desde
          in: query
          required: false
          description: Primer día (AAAA-MM-DD, hora Colombia), inclusivo.
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: hasta
          in: query
          required: false
          description: Último día (AAAA-MM-DD, hora Colombia), inclusivo; no puede ser anterior a desde.
          schema:
            type: string
            format: date
            example: "2026-10-22"
        - name: modo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModoDiagnostico"
        - name: estado
          in: query
          required: false
          description: Estado del lote; CREADO no es filtrable (los lotes sin lanzar salen solo sin este filtro).
          schema:
            type: string
            enum: [EN_PROCESO, COMPLETADO, INCOMPLETO]
        - name: nombre
          in: query
          required: false
          description: Texto que contiene el nombre del lote, sin distinguir mayúsculas.
          schema:
            type: string
            maxLength: 100
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Página de lotes visibles para el usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDiagnosticos"
        "400":
          description: >
            `code` = RANGO_INVALIDO (`campo` = hasta: hasta anterior a desde); FILTRO_INVALIDO (`campo` = desde o hasta si
            no es AAAA-MM-DD, modo o estado si el código es desconocido, en minúsculas o CREADO, nombre si pasa de 100
            caracteres); PAGINACION_INVALIDA (`campo` = pagina o tamano: no entero, pagina < 1 o tamano fuera de 1..100).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
              example:
                code: RANGO_INVALIDO
                error: hasta no puede ser anterior a desde.
                campo: hasta
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.ver (sin cuerpo); sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico
            activo (`code` = PRODUCTO_NO_HABILITADO).
    post:
      tags: [Diagnosticos]
      operationId: crearDiagnostico
      summary: Crea la cabecera de un diagnóstico en CREADO
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13750, F01-H4). El backoffice FLIT no lo tiene (R-6): 403. Guarda la
        cabecera en CREADO con la copia inmutable del alcance y de la configuración vigente de la compañía del token (un
        cambio posterior de la configuración no la altera) y la fila inicial del historial (estado_anterior nulo,
        disparador AUTO), en la misma transacción. Validación (422 con code y campo, sin guardar nada), en este orden:
        nombre vacío o de más de 150 caracteres (NOMBRE_INVALIDO); fuente en un grupo que no es el suyo
        (FUENTE_EN_GRUPO_AJENO); alcance sin RUNT (ALCANCE_SIN_RUNT); fuente fuera de fuentes_habilitadas
        (FUENTE_NO_HABILITADA); fuente habilitada sin adaptador registrado (en D2 solo RUNT lo tiene, HU #13733) o
        IMPUESTO_DEPARTAMENTAL mientras no esté disponible (HU #13863, Q5: bandera Diagnostico:Fuentes:ImpuestoDisponible
        en true, adaptador conectado y al menos un departamento soportado en la réplica departamentos_impuesto;
        en simulación LOCAL/DEV se ofrece con la bandera encendida y la réplica con departamentos) (FUENTE_NO_DISPONIBLE);
        CON_ANALISIS sin tipo
        (TIPO_TRAMITE_REQUERIDO). Solo si todo eso se cumple y el modo es CON_ANALISIS se consulta el catálogo de
        GET /tipos-tramite: tipo fuera del catálogo de la etapa (TIPO_TRAMITE_NO_DISPONIBLE) o faltan las fuentes
        obligatorias del tipo (FUENTES_OBLIGATORIAS_FALTANTES, R-17; la lista llega vacía en D1). Un modo o una fuente
        con un código desconocido responde 422 VALOR_FUERA_DE_CONJUNTO con su campo. En modo SIMPLE el tipo de trámite
        se descarta. El nombre se guarda sin los espacios de los extremos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CabeceraEntrada"
      responses:
        "201":
          description: Cabecera creada en CREADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostico"
        "400":
          description: El cuerpo no es un JSON con la forma de CabeceraEntrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.crear (sin cuerpo; el backoffice FLIT, R-6); sin usuario (`code` = SIN_USUARIO),
            sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: Regla de la cabecera incumplida (ver la descripción); `campo` nombra el campo del cuerpo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: >
            `code` = CATALOGO_NO_DISPONIBLE: CON_ANALISIS y el catálogo de tipos de trámite no está disponible (misma
            conducta degradada de GET /tipos-tramite). No se guarda nada.
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    put:
      tags: [Diagnosticos]
      operationId: editarDiagnostico
      summary: Edita nombre, modo, tipo y alcance de la cabecera mientras está en CREADO
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13750, F01-H4, F01-C9). Mismo cuerpo y mismas reglas que la creación,
        validadas contra la copia de configuración guardada en la cabecera (no contra la configuración de hoy). La copia,
        el creador y la fecha de creación no cambian. Solo en CREADO: en cualquier otro estado responde 409
        DIAGNOSTICO_NO_EDITABLE y no cambia nada. Una cabecera de otra compañía, o que no existe, responde 404.
        Este endpoint no está en la tabla §6.1 del plan (se agrega aquí y se informa al architecture-agent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CabeceraEntrada"
      responses:
        "200":
          description: Cabecera editada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostico"
        "400":
          description: El cuerpo no es un JSON con la forma de CabeceraEntrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: no existe o es de otra compañía."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = DIAGNOSTICO_NO_EDITABLE: la cabecera ya no está en CREADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: Regla de la cabecera incumplida (mismos códigos que la creación).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "`code` = CATALOGO_NO_DISPONIBLE (CON_ANALISIS con el catálogo caído)."
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/plantilla:
    get:
      tags: [Carga]
      operationId: descargarPlantillaDiagnostico
      summary: Plantilla .xlsx de carga masiva
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13749, F02-C5). Libro con una hoja «Vehiculos» y el encabezado
        Identificador_Vehiculo (obligatoria), Tipo_Documento_Locatario y Documento_Locatario (opcionales, R-3), con
        formato de texto en las tres columnas. El documento del propietario no se pide: sale del RUNT por placa (D-02).
        Archivo fijo, igual para toda compañía.
      responses:
        "200":
          description: La plantilla.
          headers:
            Content-Disposition:
              description: attachment; filename=plantilla-diagnostico.xlsx
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/carga:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    post:
      tags: [Carga]
      operationId: analizarCargaDiagnostico
      summary: Analiza el archivo de carga y devuelve el resumen de validación
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13749, F02-H4). Solo con la cabecera en CREADO. Sin estado en el
        servidor: no guarda filas ni consulta fuentes externas (el lote se confirma después). Formatos (por extensión y
        por firma del contenido): .xlsx (primera hoja) y .csv (UTF-8, con o sin BOM, separador coma o punto y coma
        detectado en el encabezado). La fila 1 es el encabezado; los nombres de columna no distinguen mayúsculas y las
        opcionales pueden faltar. Por fila: el identificador se normaliza y clasifica con la regla de Trámites
        (ValidadorIdentificador, HU #13740); si el valor limpio (mayúsculas, solo A-Z y 0-9, antes de recortar) pasa de 8
        caracteres en una placa o de 17 en un VIN, la fila es errónea (IDENTIFICADOR_DEMASIADO_LARGO): nunca se acepta
        recortado. El documento del locatario es opcional; si viene, tipo CC, CE, NIT, PAS o TI y número de hasta 20
        caracteres, solo dígitos salvo PAS (TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO si falta
        uno de los dos). Los identificadores válidos repetidos se consolidan en la primera fila (filas_duplicadas) y se
        cuentan como duplicados: total_filas = validos + erroneos + duplicados. El límite por lote y el estimado salen
        de la copia de configuración de la cabecera: con estimado_consultas = ANTES_DE_LANZAR el resumen trae
        estimado_consultas (por cada fuente del alcance, los válidos menos los N/A previsibles de locatario, HU #13747);
        con otro valor no trae la propiedad. Sin válidos (aviso SIN_VALIDOS) o con más válidos que el límite (aviso
        LIMITE_SUPERADO), puede_continuar es false. El documento del locatario vuelve siempre enmascarado («****» y los
        4 últimos). El contenido de las filas no se escribe en logs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: El archivo .xlsx o .csv.
      responses:
        "200":
          description: Resumen de validación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenValidacion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la cabecera no existe o es de otra compañía."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = DIAGNOSTICO_NO_EDITABLE: la cabecera ya no está en CREADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "413":
          description: >
            `code` = ARCHIVO_DEMASIADO_GRANDE: el archivo supera Diagnostico:Carga:TamanoMaximoBytes (5 MB por defecto).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "415":
          description: >
            `code` = FORMATO_NO_ADMITIDO (otra extensión, o un .csv que no es texto) o ARCHIVO_ILEGIBLE (.xlsx dañado o
            que no es un libro, .csv que no está en UTF-8). No se analiza ninguna fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `code` = FORMATO_XLS_NO_ADMITIDO (.xls, por extensión o por firma), con el mensaje «El formato .xls no se
            admite: guarde el archivo como .xlsx y vuelva a subirlo»; ARCHIVO_REQUERIDO (sin el campo archivo o vacío);
            COLUMNA_REQUERIDA (sin la columna Identificador_Vehiculo, campo = Identificador_Vehiculo). No se analiza
            ninguna fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/carga/validar-filas:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    post:
      tags: [Carga]
      operationId: validarFilasCargaDiagnostico
      summary: Revalida filas corregidas con el mismo análisis de la carga, sin guardar nada
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13751, F02-H5, F02-C9). Solo con la cabecera en CREADO. Aplica a las
        filas recibidas exactamente el análisis de POST /diagnosticos/{id}/carga (regla de Trámites, longitud después de
        limpiar, documento del locatario, duplicados consolidados en la primera fila, límite y estimado de la copia de
        configuración) y devuelve el mismo resumen. No escribe en la base ni consulta fuentes. Una fila sin `fila` toma su
        posición (la primera es la 2, como en la hoja con encabezado). El documento del locatario vuelve enmascarado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilasAValidar"
      responses:
        "200":
          description: Resumen de validación de las filas recibidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenValidacion"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la cabecera no existe o es de otra compañía."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: "`code` = DIAGNOSTICO_NO_EDITABLE: la cabecera ya no está en CREADO."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cabecera.
        schema:
          type: string
          format: uuid
    post:
      tags: [Vehiculos]
      operationId: confirmarVehiculosDiagnostico
      summary: Confirma los vehículos del lote (solo los válidos) y los entrega al motor de consultas
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13751, F02-H5, F02-C4/C9/C10/C11/C13/C14). Solo con la cabecera en
        CREADO y sin vehículos confirmados antes. Multipart con el MISMO archivo del análisis (`archivo`, mismas reglas y
        topes que POST /diagnosticos/{id}/carga) y, opcional, `correcciones` (decisión del usuario 2026-10-21 «Reenviar el
        archivo»: el análisis devuelve el documento del locatario enmascarado y solo el archivo lo trae completo, R-3). El
        servidor re-analiza el archivo, aplica las correcciones por número de fila (un campo ausente conserva el del archivo)
        y revalida todo con la regla de la carga (no confía en el cliente; un archivo distinto del analizado también se
        revalida entero): descarta los inválidos (también los identificadores de más de 8 caracteres de placa o 17 de VIN
        después de limpiar, nunca recortados) y los duplicados (gana el primero). Sin ningún válido, o con más válidos que
        limite_vehiculos_lote de la copia de configuración, responde 422 y no guarda nada. En una sola transacción guarda
        los válidos en el orden del archivo, cifra el documento completo del locatario declarado (origen DECLARADO_CLIENTE; nunca en
        logs ni eventos), deja el estimado de consultas en la cabecera y entrega la lista limpia al motor de consultas
        (HU #13727: crea una celda PENDIENTE por vehículo y fuente del alcance, que es la cola durable del procesador, y
        pasa el lote de CREADO a EN_PROCESO con historial AUTO). Responde 202: las consultas corren en segundo plano y
        el avance se lee en el tablero. La respuesta trae estimado_consultas solo con estimado_consultas = ANTES_DE_LANZAR.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConfirmacionVehiculos"
      responses:
        "202":
          description: >
            Vehículos confirmados y encolados; el lote queda EN_PROCESO (documento del locatario enmascarado «****» y los
            4 últimos). Hasta HU #13727 era 201.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoConfirmacion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la cabecera no existe o es de otra compañía (no se guarda nada)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = DIAGNOSTICO_NO_EDITABLE (la cabecera ya no está en CREADO) o VEHICULOS_YA_CONFIRMADOS (el lote ya
            tiene vehículos, también si otra confirmación ganó en paralelo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "413":
          description: "`code` = ARCHIVO_DEMASIADO_GRANDE: el archivo supera Diagnostico:Carga:TamanoMaximoBytes (5 MB por defecto)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "415":
          description: >
            `code` = FORMATO_NO_ADMITIDO (otra extensión, o un .csv que es zip, PDF u OLE2) o ARCHIVO_ILEGIBLE (.xlsx dañado
            o .csv que no es UTF-8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            No se guarda nada. `campo` = vehiculos: `code` = SIN_VALIDOS (ningún vehículo válido o archivo sin filas) o
            LIMITE_SUPERADO (los válidos superan limite_vehiculos_lote; el mensaje trae ambos números). `campo` = archivo:
            ARCHIVO_REQUERIDO (sin archivo, vacío o cuerpo que no es multipart). FORMATO_XLS_NO_ADMITIDO (.xls).
            `campo` = Identificador_Vehiculo: COLUMNA_REQUERIDA. `campo` = correcciones: CORRECCIONES_INVALIDAS (JSON mal
            formado, no es una lista, sin `fila` entera, fila repetida, fila que el archivo no tiene o un valor que no es
            texto ni null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/grilla:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Tablero]
      operationId: obtenerGrillaDiagnostico
      summary: Grilla incremental del lote (solo lo cambiado desde la versión del cliente)
      description: >
        HU #13743 (F04-H1, F04-C1/C3/C8/C10/C11/C13, plan §6.1 fila 04). Permiso diagnostico.diagnosticos.ver.
        Devuelve la versión actual del tablero (`version`), el estado global, las columnas del alcance agrupadas y el
        avance del lote, y SOLO las celdas con versión mayor que `desde` (con `desde=0`, o sin él, todo el lote). En
        `vehiculos` van solo los vehículos con alguna celda cambiada y, de cada uno, solo esas celdas; `terminado` se
        calcula con todas sus celdas (COMPLETADO o NA, R-7). El cliente guarda `version`, la manda como `desde` en el
        siguiente sondeo y fusiona por `vehiculos[].id` y `celdas[].fuente`. DTO de cliente: nunca lleva el origen de
        la celda, el usuario que la llenó a mano, el payload ni documentos en claro (R-20); cada fila que viaja lleva
        sus documentos actuales enmascarados en el servidor (`documento_declarado`, `propietarios`, HU #14087). Con estimado_consultas=AL_FINALIZAR
        en la copia de configuración del lote y el lote COMPLETADO o INCOMPLETO trae `estimado_consultas` (estimado por
        fuente frente a consumidas: intentos con desde_cache=false, sin los de llenado manual); en otro caso la clave
        no viene. Otra compañía, o un lote de otro usuario con visibilidad_usuario=PROPIOS, responde 404.
      parameters:
        - name: desde
          in: query
          required: false
          description: Versión del tablero que ya tiene el cliente (0 o mayor; por defecto 0 = todo).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Grilla del lote desde la versión dada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grilla"
        "400":
          description: "`code` = DESDE_INVALIDO (`campo` = desde): desde es negativo. Un desde no numérico también responde 400."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: no existe, es de otra compañía o (con PROPIOS) de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/cerrar-panel:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: cerrarPanelDiagnostico
      summary: Cierra el panel de un lote con celdas en ERROR (pasa a INCOMPLETO)
      description: >
        HU #13743 (F04-C5/C7, plan §3.5 y §6.1 fila 04). Permiso diagnostico.diagnosticos.ver, misma visibilidad que la
        grilla. Sin cuerpo. Un lote EN_PROCESO con todas sus celdas terminadas y al menos una en ERROR pasa a
        INCOMPLETO con cerrado_en y una fila del historial disparador=CIERRE_PANEL con el usuario del token. Un lote
        sin ERROR se completa solo (lo hace el procesador, disparador AUTO). Ningún endpoint edita el estado a mano.
      responses:
        "200":
          description: Lote cerrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CierrePanel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: no existe, es de otra compañía o (con PROPIOS) de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            No procede y nada cambia: `code` = LOTE_NO_EN_PROCESO (CREADO, COMPLETADO o INCOMPLETO),
            CELDAS_SIN_TERMINAR (hay celdas PENDIENTE o EN_CURSO), LOTE_SIN_ERRORES (todas terminaron sin ERROR) o
            LOTE_MODIFICADO (el lote cambió mientras se cerraba: volver a leer la grilla).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/historial:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Tablero]
      operationId: obtenerHistorialDiagnostico
      summary: Historial de estados del lote
      description: >
        HU #13743 (F04-C7, R-8). Permiso diagnostico.diagnosticos.ver, misma visibilidad que la grilla. Transiciones de
        diagnostico.historial_estado_diagnostico (solo inserción), de la más antigua a la más reciente: anterior (null en
        la creación), nuevo, disparador, usuario (null si fue el procesador) y fecha. Vista de la compañía (HU #13798,
        decisión Q5): una transición MANUAL (llenado del backoffice) llega como AUTO y con usuario_id null.
      responses:
        "200":
          description: Estado actual y transiciones del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialLote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.ver; sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: no existe, es de otra compañía o (con PROPIOS) de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/consultas/{fuente}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote (el de la grilla).
        schema:
          type: string
          format: uuid
      - name: fuente
        in: path
