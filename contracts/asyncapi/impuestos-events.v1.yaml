asyncapi: '2.6.0'
info:
  title: FLIT — trabajos y eventos de Impuestos
  version: 1.2.0
  description: |
    Mensajes del exchange `flit.impuestos` (producto Impuestos, core-impuestos; ADR-0093, plan
    docs/impuestos/plan-implementacion.md §5.5). Mensajes en JSON con el sobre común (comun/sobre.v1.yaml). Sin datos
    personales: solo ids, el código de producto y el cambio (A-H10).

    Hay dos clases de mensaje:
    - Trabajos que la plataforma le deja a core-impuestos (`impuestos.producto.cambiado` e
      `impuestos.aprovisionamiento.reintentar`). Los publican core-api (productor `tramites`) y core-identity (productor
      `plataforma`) por su outbox con EnqueueJob, en la misma transacción del cambio, porque el PUT de productos lo
      atienden los dos hosts según FLIT_IDENTITY_CLUSTER_ENABLED (plan §1.1, decisión E2). Sus usuarios del broker
      necesitan permiso de escritura en `flit.impuestos` (gate LT G-8). Los consume la cola `impuestos.plataforma`.
    - Eventos internos de core-impuestos (`impuestos.liquidacion.solicitada` e `impuestos.recibos.descargar`) que el
      propio servicio publica por su outbox y consume en sus colas `impuestos.liquidaciones` e `impuestos.recibos`.
    - 1.1.0 (HU #14694 M07b, plan §5.8): trabajos internos de credenciales `impuestos.credencial.propagar` e
      `impuestos.secreto.refrescar`, que el servicio deja en su outbox y consume en la cola `impuestos.credenciales` (solo
      del productor `impuestos`). Solo llevan la empresa: la llave y el secreto nunca viajan por el bus.
    - 1.2.0 (HU #14711, plan docs/diagnosticos/plan-alta-credencial-impuesto-diagnostico.md §3.4): trabajo
      `impuestos.credencial_diagnostico.actualizada`, que la plataforma (core-identity `plataforma` o core-api `tramites`)
      deja por su outbox con EnqueueJob cuando el alta del proveedor cambió la llave del impuesto de Diagnóstico. Llega a la
      cola `impuestos.plataforma`. No lleva la llave: core-impuestos la relee por `ObtenerCredencialImpuestoParaCopia`.

    El correo «Lote terminado» no es de este exchange: core-impuestos deja el trabajo `notificaciones.email.send`
    (notificaciones-events.v1.yaml) en `flit.notificaciones`, con el correo ya armado y sin datos del propietario.

    Consumo idempotente por `eventId` con bandeja de entrada. El canal `platform.tenant_product.changed` de
    plataforma-events.v1.yaml queda como deuda declarada (plan R-10): no se emite desde core-api y no lo usa Impuestos.
defaultContentType: application/json

channels:
  impuestos.producto.cambiado:
    description: |
      Trabajo. Se encendió o apagó el producto `impuestos` para una empresa (PUT
      /api/v1/platform/admin/tenants/{tenantId}/products/impuestos). Solo se encola si hubo cambio (`changed=true`): un
      PUT que deja el mismo valor no produce trabajo, y un rollback del cambio lo quita. core-impuestos aprovisiona al
      encender (PENDIENTE y evaluación) y suspende al apagar (SUSPENDIDO, guarda el estado previo). La empresa va en el
      sobre y también en `data.tenantId`.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    publish:
      operationId: productoCambiado
      message:
        $ref: '#/components/messages/ProductoCambiado'

  impuestos.aprovisionamiento.reintentar:
    description: |
      Trabajo. El Super Admin pulsó «Reintentar» en el admin de compañías (POST
      /api/v1/platform/admin/tenants/{tenantId}/products/impuestos/aprovisionamiento/reintentar). core-impuestos lo
      aplica solo desde ERROR, INCIERTO o REQUIERE_REVISION_NIT (pasa a PENDIENTE); en otro estado lo confirma sin
      efecto. Se encola por la outbox en la transacción de la petición.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    publish:
      operationId: aprovisionamientoReintentar
      message:
        $ref: '#/components/messages/AprovisionamientoReintentar'

  impuestos.credencial_diagnostico.actualizada:
    description: |
      Trabajo (HU #14711). El alta idempotente del proveedor (botón «Obtener del proveedor» del admin de compañías o alta
      automática al encender `diagnostico`) cambió la `impuesto_api_key` de Diagnóstico de la empresa. Se encola en el
      mismo guardado de la credencial y solo si la llave cambió (si el alta devolvió los mismos valores no hay trabajo).
      core-impuestos relee la llave por gRPC (`CredencialesProductoService.ObtenerCredencialImpuestoParaCopia`) y reemplaza
      la suya si es una copia de Diagnóstico (`COPIA_DIAGNOSTICO`) o tiene otro prefijo, conservando el secreto del webhook;
      si es propia con el mismo prefijo, o no tiene credencial, lo confirma sin efecto. Idempotente.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    publish:
      operationId: credencialDiagnosticoActualizada
      message:
        $ref: '#/components/messages/CredencialDiagnosticoActualizada'

  impuestos.liquidacion.solicitada:
    description: |
      Evento interno. Un ítem de liquidación recibió el crédito de su compañía (DespachadorCredito: 2 en vuelo por
      compañía y 6 en total, configurables) y espera que el consumidor `impuestos.liquidaciones` consulte el RUNT y
      envíe la solicitud al proveedor. Lo publica el despachador por la outbox al crear la liquidación, al liberar un
      crédito o al vencer un reintento programado. Solo ids: ni placa, ni documento, ni nombre.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: liquidacionSolicitada
      message:
        $ref: '#/components/messages/LiquidacionSolicitada'

  impuestos.recibos.descargar:
    description: |
      Evento interno. Se aplicó un resultado `succeeded` o `partial` con `fileId` y hay que descargar sus recibos PDF del
      proveedor y guardarlos en el file-manager (categoría `impuestos`, ADR-0057). Lo consume la cola `impuestos.recibos`.
      Un fileId repetido entre vigencias se descarga una sola vez.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: recibosDescargar
      message:
        $ref: '#/components/messages/RecibosDescargar'

  impuestos.credencial.propagar:
    description: |
      Trabajo interno (1.1.0, D-ALTA-IDEM). El alta del proveedor respondió `api_key_rotated=true` y la llave anterior ya
      no sirve: se lee la llave vigente cifrada y se reemplaza la de Diagnóstico con el rpc de Identidad
      `CredencialesProductoService.ActualizarCredencialImpuestoDiagnostico` (solo si Diagnóstico tenía llave). Se encola
      en la misma transacción que guarda la llave nueva. Reintentos del SDK si Identidad no responde.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: credencialPropagar
      message:
        $ref: '#/components/messages/CredencialPropagar'

  impuestos.secreto.refrescar:
    description: |
      Trabajo interno (1.1.0, plan §5.8 punto 7). Se encendió `modo_respaldo_firma` (5 firmas inválidas seguidas): un alta
      idempotente trae el `webhook_secret` vigente. Si cambió, el anterior se conserva 24 h para verificar avisos y se
      apaga el modo respaldo. Reintentos del SDK si el alta no responde.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.impuestos, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: secretoRefrescar
      message:
        $ref: '#/components/messages/SecretoRefrescar'

components:
  messages:
    ProductoCambiado:
      name: impuestos.producto.cambiado
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [tramites, plataforma], description: "core-api (tramites) o core-identity (plataforma)." }
              data:
                type: object
                additionalProperties: false
                required: [tenantId, productCode, enabled, changedAt]
                properties:
                  tenantId: { type: string, format: uuid, description: "Empresa del cambio (la misma del sobre)." }
                  productCode: { type: string, enum: [impuestos] }
                  enabled: { type: boolean, description: "true = encendido; false = apagado (suspensión reversible, D-DESACT)." }
                  changedAt: { type: string, format: date-time, description: "updated_at de platform.tenant_products tras el cambio." }
    AprovisionamientoReintentar:
      name: impuestos.aprovisionamiento.reintentar
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [tramites, plataforma] }
              data:
                type: object
                additionalProperties: false
                required: [tenantId, solicitadoPor]
                properties:
                  tenantId: { type: string, format: uuid }
                  solicitadoPor: { type: string, format: uuid, description: "Id del Super Admin que pulsó Reintentar (va al historial)." }
    CredencialDiagnosticoActualizada:
      name: impuestos.credencial_diagnostico.actualizada
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [tramites, plataforma], description: "core-api (tramites) o core-identity (plataforma)." }
              data:
                type: object
                additionalProperties: false
                required: [tenantId, productCode, version, occurredAt]
                properties:
                  tenantId: { type: string, format: uuid, description: "Empresa (la misma del sobre)." }
                  productCode: { type: string, enum: [diagnostico] }
                  version: { type: integer, format: int64, minimum: 0, description: "row_version de platform.tenant_product_credentials (diagnostico/impuesto_api_key) tras el cambio." }
                  occurredAt: { type: string, format: date-time, description: "updated_at de la llave tras el cambio." }
    LiquidacionSolicitada:
      name: impuestos.liquidacion.solicitada
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [impuestos] }
              data:
                type: object
                additionalProperties: false
                required: [liquidacionId, itemId]
                properties:
                  liquidacionId: { type: string, format: uuid, description: "Cabecera (impuestos.liquidaciones)." }
                  itemId: { type: string, format: uuid, description: "Ítem (impuestos.liquidacion_items)." }
    RecibosDescargar:
      name: impuestos.recibos.descargar
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [impuestos] }
              data:
                type: object
                additionalProperties: false
                required: [itemId]
                properties:
                  itemId: { type: string, format: uuid, description: "Ítem con resultado aplicado (impuestos.liquidacion_items)." }
    CredencialPropagar:
      name: impuestos.credencial.propagar
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [impuestos] }
              data:
                type: object
                additionalProperties: false
                required: [tenantId]
                properties:
                  tenantId: { type: string, format: uuid, description: "La empresa del sobre; nunca la llave." }
    SecretoRefrescar:
      name: impuestos.secreto.refrescar
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              producer: { type: string, enum: [impuestos] }
              data:
                type: object
                additionalProperties: false
                required: [tenantId]
                properties:
                  tenantId: { type: string, format: uuid, description: "La empresa del sobre; nunca el secreto." }
