name: Core API (.NET 10)

on:
  push:
    branches: [develop, main]
    paths:
      - 'services/core-api/**'
      - 'services/core-identity/**'
      - 'services/core-consultas/**'
      - 'contracts/proto/**'
      - 'contracts/openapi/core-api.v1.yaml'
      - 'contracts/openapi/external-api.v1.json'
      # El catálogo del manual es texto generado. No debe disparar la suite completa,
      # que en develop ya falla por pruebas ajenas a ese archivo.
      - '!services/core-api/src/Flit.Api/Content/dr-flit/**'
  pull_request:
    branches: [develop]
    paths:
      - 'services/core-api/**'
      - 'services/core-identity/**'
      - 'services/core-consultas/**'
      - 'contracts/proto/**'
      - 'contracts/openapi/core-api.v1.yaml'
      - 'contracts/openapi/external-api.v1.json'
      - '!services/core-api/src/Flit.Api/Content/dr-flit/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    # La suite completa ya cierra cerca de 18-22 min en develop; con 20 el job se cancela
    # antes de publicar resultados (p. ej. PR #545 y #565). Restaura el valor de 6f4fa2a91,
    # que se perdió al integrar 553a2160e.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flit_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flit_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Epic #13316 (HU #13338): broker real para las pruebas de la outbox del SDK (Flit.Platform.Sdk.Tests), con la
      # misma decisión que Postgres: servicio del job, sin Testcontainers. Usuario propio: guest solo entra desde
      # loopback dentro del contenedor.
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: flit
          RABBITMQ_DEFAULT_PASS: flit-prueba
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/core-api/global.json

      - name: Restore
        working-directory: services/core-api
        run: dotnet restore

      - name: Build
        working-directory: services/core-api
        run: dotnet build --no-restore --configuration Release

      - name: Apply migrations
        working-directory: services/core-api
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.1
          dotnet ef database update \
            --project src/Flit.Infrastructure \
            --startup-project src/Flit.Api \
            --no-build --configuration Release
        env:
          ConnectionStrings__Core: "Host=localhost;Port=5432;Database=flit_dev;Username=postgres;Password=postgres"

      - name: Test
        working-directory: services/core-api
        run: dotnet test --no-build --configuration Release --logger "trx" --collect "XPlat Code Coverage"
        env:
          ConnectionStrings__Core: "Host=localhost;Port=5432;Database=flit_dev;Username=postgres;Password=postgres"
          FLIT_TEST_RABBITMQ: "amqp://flit:flit-prueba@localhost:5672/"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-api-test-results
          path: services/core-api/tests/**/TestResults/

  aot-publish:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/core-api/global.json

      # MVP Fase 11: JIT escape documentado (ADR-0002 §"AOT en .NET").
      # QuestPDF (Flit.Modules.Recibos) usa reflection + SkiaSharp y
      # aun no es AOT-compatible. Cuando lo sea (roadmap 2025) o se cambie
      # de motor PDF, volver a --self-contained con AOT.
      - name: Publish (linux-musl-x64, JIT)
        working-directory: services/core-api
        run: dotnet publish src/Flit.Api/Flit.Api.csproj -c Release -r linux-musl-x64 --self-contained -o publish /p:PublishAot=false
