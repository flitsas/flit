        La compañía sale solo del token: un parámetro empresa responde 400 EMPRESA_NO_PERMITIDA. Delega en
        flit.platform.v1.UsuariosProductoService.ListarUsuariosProducto de core-api, que reverifica al actor. Solo usuarios con rol
        usuario_diagnostico o admin_diagnostico (D-5). Orden: estado (ACTIVO, INVITADO, SUSPENDIDO) y nombre.
      parameters:
        - $ref: "#/components/parameters/BusquedaUsuarios"
        - $ref: "#/components/parameters/RolUsuarios"
