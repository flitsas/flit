name: CI

on:
  pull_request:
    branches: [main, develop, staging,release]
  push:
    branches: [develop, staging, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm -r --if-present format:check

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Type check
        run: pnpm -r --if-present typecheck

      # Google Fonts en el build hizo fallar este job por lo que respondía el servicio externo.
      - name: Fuentes locales
        run: |
          if grep -rl --include='*.ts' --include='*.tsx' 'next/font/google' frontend*/app frontend*/components; then
            echo "::error::Usa next/font/local con los archivos de app/fonts, no next/font/google."
            exit 1
          fi

      - name: Build
        run: pnpm -r --if-present build
