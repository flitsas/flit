  /api/v1/diagnostico/diagnosticos/{id}/vehiculos/{vid}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: vid
        in: path
        required: true
        description: Id del vehículo del lote (el de la grilla).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarPdfVehiculo
      summary: PDF corporativo de un vehículo
      description: >
        HU #13848 (F07-H3, F07-C1..C4/C8..C11). Permiso diagnostico.reportes.descargar y la misma visibilidad que la grilla.
        Se emite si el vehículo terminó (todas sus celdas en COMPLETADO o N/A) aunque el lote siga EN_PROCESO, o si el lote está
        INCOMPLETO con todas sus celdas cerradas: la fuente en ERROR sale «consulta no disponible», sin código de error ni causa
        (Q7). Encabezado con ID del diagnóstico, nombre del lote, empresa (claim company_name), creador («No disponible» si
        Identidad no responde), fecha y hora de creación (hora Colombia), tipo de análisis («Diagnóstico Simple» o «Diagnóstico
        Con Análisis IA — TRÁMITE») e identificación; una sección por fuente del alcance en el orden de la grilla (SIMIT con hasta
        100 comparendos y «y N más»; avalúo con valor sugerido o «sin valor comercial»; personas con «****» + 4 últimos y el
        rótulo «Declarado por el cliente»; N/A con su motivo); pie con «Generado el …» y «Página X de Y». Sin origen, usuario
        manual, proveedor ni transacción (R-20): una celda llenada a mano produce el mismo texto que una de API. Mientras no
        cambie ninguna entrada (celdas, versión del tablero, nombres del encabezado, documentos enmascarados), la descarga
        devuelve los mismos bytes ya guardados; si cambió, genera un PDF nuevo e invalida el anterior (se conserva).
      responses:
        "200":
          description: El PDF del vehículo.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}-{placa o VIN}.pdf
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario; o el vehículo no es
            de ese lote. El cuerpo no trae datos del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = VEHICULO_NO_TERMINADO: el vehículo todavía tiene consultas sin terminar y el lote no está INCOMPLETO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/excel:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarExcelLote
      summary: Excel del lote con columnas según el alcance y lo ya completado
      description: >
        HU #13849 (F07-H4, F07-C5/C6/C8..C11). Permiso diagnostico.reportes.descargar y la misma visibilidad que la grilla. Se
        emite con el lote EN_PROCESO, COMPLETADO o INCOMPLETO (lo no terminado sale con su estado). Hojas, en este orden:
        «Vehículos»: una fila por vehículo en el orden de la carga. Columnas fijas Orden, Identificador, Tipo de identificador
        (código, p. ej. PLACA_CARRO), Placa, VIN y Estado del vehículo (Terminado, En proceso o Con error). Luego, por cada fuente
        del alcance en el orden de la grilla, «{fuente} — Estado» (Completado, Pendiente, «No aplica: {motivo}» o «Consulta no
        disponible», sin código de error ni causa) y sus columnas de dato, que solo se llenan con la fuente Completado (catálogo
        ColumnasExcel): RUNT → Servicio, Clase, Organismo de tránsito, Marca, Línea, Modelo, Propietarios (cantidad), Locatarios
        (cantidad); SIMIT vehículo → Semáforo, Comparendos, Valor total; RUNT propietarios / RUNT locatarios → Personas
        consultadas, Personas con error, Documentos («TIPO ****1234» separados por «; », con «(Declarado por el cliente)» si lo
        declaró el cliente); SIMIT propietarios / SIMIT locatarios → las mismas más Comparendos y Valor total sumados de las
        personas; Avalúo → Valor sugerido, Fuente principal, Sin valor comercial (Sí/No); Impuesto departamental → solo estado.
        El valor total en pesos es número; si el SIMIT trajo más comparendos de los que se listan (tope 100) sale el texto
        «al menos N». «Diagnóstico»: ID del diagnóstico, nombre del lote, empresa (claim company_name), usuario creador («No
        disponible» si Identidad no responde), fecha de creación (hora Colombia) y tipo de análisis («Diagnóstico Simple» o
        «Diagnóstico Con Análisis IA — TRÁMITE»). «Consultas»: solo con estimado_consultas=AL_FINALIZAR en la copia de
        configuración del lote y el lote COMPLETADO o INCOMPLETO; fuente, consultas estimadas, consultas consumidas y
        «al menos» si el estimado es mínimo (el mismo cálculo de la grilla). Sin origen, usuario manual, proveedor ni transacción
        (R-20): una celda llenada a mano produce la misma fila que una de API. Toda celda de texto que empiece por =, +, -, @,
        tabulador o retorno de carro se escribe como texto literal (sin fórmula, con quotePrefix). Mientras no cambie ninguna
        entrada (celdas, versión del tablero, nombres del encabezado, documentos enmascarados, estado del lote, lo que muestra
        el libro), la descarga devuelve los mismos bytes ya guardados; si cambió, genera un Excel nuevo e invalida el anterior
        (se conserva).
      responses:
        "200":
          description: El Excel del lote.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}.xlsx
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario. El cuerpo no trae datos
            del lote. Se comprueba antes del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = LOTE_SIN_LANZAR: el lote sigue CREADO (sin vehículos lanzados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    post:
      tags: [Reportes]
      operationId: pedirZipLote
      summary: Pide el ZIP con los PDF del lote, que se genera en segundo plano
      description: >
        HU #13850 (F07-H5, F07-C4/C7/C8/C9/C11/C12; decisiones Q2, Q5 y Q7). Permiso diagnostico.reportes.descargar y la misma
        visibilidad que la grilla. Solo `tipo` = ZIP. Entran los vehículos que pueden emitir su PDF (la regla del PDF del vehículo:
        terminados, aunque el lote siga EN_PROCESO, y con el lote INCOMPLETO también los que tienen fuentes en ERROR, que salen
        «consulta no disponible»); los demás van en el índice. Huella del ZIP = versión de la plantilla + entradas del lote (celdas con
        su versión del tablero, cabecera, empresa, creador, documentos enmascarados, estado del lote) + lista ordenada de los
        vehículos incluidos. Si el ZIP vigente está LISTA con esa huella responde 200 con él (no encola); si hay uno PENDIENTE o
        GENERANDO con esa huella responde 202 con el mismo id (no duplica, tampoco con pedidos simultáneos); si no, encola uno nuevo
        (202) con quien lo pidió (claim sub) y la empresa del claim company_name. Mientras el nuevo está en la cola, el anterior LISTA
        sigue vigente y descargable; al quedar LISTA el nuevo, el anterior pasa a no vigente (se conserva). Sin tope propio de
        vehículos: lo acota limite_vehiculos_lote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudEvidencia"
      responses:
        "200":
          description: Ya hay un ZIP LISTA y vigente con la misma huella (nada cambió desde que se generó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "202":
          description: El ZIP está en la cola (nuevo, o el que ya estaba con la misma huella). Sondear el estado hasta LISTA o ERROR.
          headers:
            Location:
              description: /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid} (estado del ZIP).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.reportes.descargar (sin cuerpo); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no existe, es de otra compañía o (con PROPIOS) de otro usuario. Sin datos del lote. Se
            comprueba antes del 422 y del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = SIN_VEHICULOS_TERMINADOS: ningún vehículo del lote puede emitir todavía su PDF. No se crea evidencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            `code` = TIPO_INVALIDO, `campo` = tipo: el tipo no es ZIP (los PDF y el Excel se descargan directo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid}:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: eid
        in: path
        required: true
        description: Id del ZIP (el que devolvió el pedido).
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: estadoZipLote
      summary: Estado del ZIP del lote
      description: >
        HU #13850 (F07-H5). Permiso diagnostico.reportes.descargar y la visibilidad de la grilla. Para sondear tras el pedido
        (Cache-Control no-store). PENDIENTE → GENERANDO → LISTA, o ERROR tras agotar los reintentos (por defecto 2, con espera
        creciente). Un fallo con reintentos pendientes vuelve a PENDIENTE.
      responses:
        "200":
          description: El estado del ZIP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoEvidencia"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.reportes.descargar (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no se ve (otra compañía o PROPIOS de otro usuario) o el ZIP no es de ese lote. Sin datos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/diagnosticos/{id}/evidencias/{eid}/archivo:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
      - name: eid
        in: path
        required: true
        description: Id del ZIP.
        schema:
          type: string
          format: uuid
    get:
      tags: [Reportes]
      operationId: descargarZipLote
      summary: Descarga el ZIP del lote cuando está LISTA
      description: >
        HU #13850 (F07-H5, F07-C9/C11). Permiso diagnostico.reportes.descargar y la visibilidad de la grilla. Un PDF por vehículo
        incluido (diagnostico-{8 primeros del id}-{placa o VIN}.pdf, el mismo PDF del vehículo: si su huella coincide se reutiliza el
        PDF vigente) e indice.txt (UTF-8, separado por tabuladores) con todos los vehículos del lote en el orden de la carga: orden,
        identificador (placa o VIN), estado (Terminado, En proceso o Con error) y si su PDF va en el ZIP (Incluido / No incluido) con
        el nombre del archivo. Sin documentos completos, nombres de personas, origen, usuario manual, proveedor ni transacción
        (R-20). Un ZIP LISTA que ya no es el vigente se sigue pudiendo descargar por su id.
      responses:
        "200":
          description: El ZIP.
          headers:
            Content-Disposition:
              description: attachment; filename=diagnostico-{8 primeros caracteres del id}.zip
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.reportes.descargar (sin cuerpo); SIN_EMPRESA o PRODUCTO_NO_HABILITADO (con cuerpo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: >
            `code` = NO_ENCONTRADO: el lote no se ve o el ZIP no es de ese lote. Se comprueba antes del 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            `code` = EVIDENCIA_NO_LISTA: el ZIP está PENDIENTE, GENERANDO o en ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/consultas/{cid}/reprocesar:
    parameters:
      - name: cid
        in: path
        required: true
        description: Id de la celda (diagnostico.consultas).
        schema:
          type: string
          format: uuid
    post:
      tags: [Tablero]
      operationId: reprocesarConsulta
      summary: Reprocesa una celda en ERROR repitiendo la consulta real
      description: >
        HU #13746 (F03-H8, R-1, R-8, plan §6.1 fila 03). Permiso diagnostico.consultas.reprocesar (admin de la compañía;
        el usuario del producto recibe 403). Sin cuerpo: lo que venga se ignora y nunca se escriben datos de resultado.
        La celda vuelve a PENDIENTE con intentos_auto=0 y sube version_tablero (el sondeo de la grilla la ve volver a
        gris); el procesador repite la consulta real, sin reutilizar el dato del mismo día, y el intento queda con
        disparador=REPROCESO y el usuario del token. Si el lote estaba COMPLETADO o INCOMPLETO vuelve a EN_PROCESO, sin
        cerrado_en, con una fila del historial disparador=REPROCESO y el usuario; al terminar, el recalculador fija el
        estado final (COMPLETADO con historial AUTO si todo quedó bien). Las celdas COMPLETADO no se tocan. Al reprocesar
        la RUNT de un vehículo y terminar en OK, sus celdas BLOQUEADA_POR_RUNT vuelven a PENDIENTE en la misma
        transacción (pasando por las reglas de no aplica) y corren con disparador=REPROCESO y el mismo usuario; si la RUNT
        vuelve a fallar, siguen en ERROR. En una celda de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO, HU #13792;
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO, HU #13794) solo se vuelve a consultar a las personas que quedaron en
        ERROR: las que respondieron conservan su resultado y no se vuelven a consumir.
      responses:
        "202":
          description: La celda quedó en cola para repetir la consulta real.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocesoConsulta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.consultas.reprocesar; sin compañía (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe, es de otra compañía o su lote (con PROPIOS) es de otro usuario."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            No es reprocesable y nada cambia: `code` = CELDA_NO_EN_ERROR (la celda no está en ERROR),
            CELDA_BLOQUEADA_POR_RUNT (tipo_error=BLOQUEADA_POR_RUNT y la RUNT del vehículo no está COMPLETADO: se
            reprocesa la RUNT) o CELDA_MODIFICADA (la celda cambió mientras se pedía: volver a leer la grilla).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express:
    post:
      tags: [Express]
      operationId: crearDiagnosticoExpress
      summary: Crea un diagnóstico Express de un solo vehículo (cabecera y vehículo en una transacción)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F02-H6, F02-C4/C12/C13, F01-C10). El backoffice FLIT no lo tiene
        (R-6): 403. Primero revalida el vehículo con la regla de fila de la carga y de la confirmación: identificador
        ausente (IDENTIFICADOR_REQUERIDO), que no es placa ni VIN (IDENTIFICADOR_INVALIDO), de más de 8 caracteres de placa
        o 17 de VIN después de limpiar, nunca recortado (IDENTIFICADOR_DEMASIADO_LARGO), o documento del locatario mal
        formado (TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO): 422 con `campo` y no se crea nada.
        Después, en una sola transacción, crea la cabecera en CREADO con es_express = true y las mismas reglas de
        POST /diagnosticos (422 con su campo; 503 con CON_ANALISIS y el catálogo caído) y confirma el vehículo como
        POST /diagnosticos/{id}/vehiculos (documento del locatario cifrado con origen DECLARADO_CLIENTE, estimado en la
        cabecera, entrega al motor de consultas, que crea las celdas y deja el lote EN_PROCESO, HU #13727; por eso
        `estado` llega EN_PROCESO). Si algo falla no queda cabecera ni vehículo. Sin nombre (o solo
        espacios) se autogenera «Express IDENTIFICADOR dd/mm/aaaa» con el identificador normalizado y la fecha de
        Colombia; un nombre enviado se valida como en POST /diagnosticos (máximo 150).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "201":
          description: Diagnóstico Express creado con su único vehículo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressCreado"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Sin diagnostico.diagnosticos.crear (sin cuerpo; el backoffice FLIT, R-6); sin usuario (`code` = SIN_USUARIO),
            sin compañía (`code` = SIN_EMPRESA) o compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Regla del vehículo (`campo` = identificador, tipo_documento_locatario o documento_locatario) o de la cabecera
            (los códigos de POST /diagnosticos). No se crea nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "503":
          description: "`code` = CATALOGO_NO_DISPONIBLE: CON_ANALISIS y el catálogo de tipos de trámite no está disponible. No se crea nada."
          headers:
            Retry-After:
              description: Segundos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/express/estimado:
    post:
      tags: [Express]
      operationId: estimarDiagnosticoExpress
      summary: Estimado de consultas por fuente del Express antes de lanzarlo (no persiste nada)
      description: >
        Permiso diagnostico.diagnosticos.crear (HU #13753, F01-C11). Endpoint nuevo frente al plan §6.1. Recibe el mismo
        cuerpo que POST /express y no guarda nada. Con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de
        la compañía del token responde mostrar_estimado = true y el estimado por fuente del alcance para un vehículo (las
        fuentes del locatario cuentan 0 sin documento de locatario); con otro valor responde mostrar_estimado = false sin
        estimado_consultas. Un código de fuente desconocido es 422 VALOR_FUERA_DE_CONJUNTO y un documento del locatario mal
        formado es 422 con su campo. No valida el identificador ni las fuentes habilitadas (eso lo hace POST /express).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressEntrada"
      responses:
        "200":
          description: Estimado de vista previa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimadoExpress"
        "400":
          description: Cuerpo que no es JSON válido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Sin diagnostico.diagnosticos.crear (el backoffice FLIT, R-6); sin compañía (`code` = SIN_EMPRESA); compañía sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: "`code` = VALOR_FUERA_DE_CONJUNTO (fuente desconocida) o error de forma del documento del locatario, con `campo`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/empresas/{empresa}/configuracion/contrato:
    parameters:
      - name: empresa
        in: path
        required: true
        description: >
          Compañía cuyo contrato se lee o edita (uuid distinto de cero). Si además llega ?empresa=, debe
          coincidir (si no, 400 EMPRESA_REQUERIDA).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice, Configuracion]
      operationId: obtenerContratoEmpresaBackoffice
      summary: Contrato de una compañía para el backoffice FLIT
      description: >
        Política diagnostico.backoffice (diagnostico.backoffice.ver + tenant_type=FLIT) y además
        diagnostico.configuracion.contrato.editar (HU #13741). La lectura queda en diagnostico.lecturas_backoffice
        antes de leer. Sin fila guardada devuelve los valores por defecto.
      responses:
        "200":
          description: Contrato de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida o distinta en la ruta y en la consulta (`code` = EMPRESA_REQUERIDA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); token sin
            compañía (SIN_EMPRESA) o sin usuario (SIN_USUARIO); PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice, Configuracion]
      operationId: editarContratoEmpresaBackoffice
      summary: Edita el contrato de una compañía (backoffice FLIT)
      description: >
        Mismos permisos que el GET. Edita fuentes_habilitadas, limite_vehiculos_lote (mayor que cero) y el
        interruptor de emergencia redaccion_ia_suspendida (R-2) de la compañía de la ruta, por la vía de
        escritura entre compañías del módulo Backoffice (ADR-0073). Se guardan los campos que llegan. Reducir
        las habilitadas recorta fuentes_por_defecto en el mismo comando. Cada campo que cambia (también el
        recorte) queda en diagnostico.cambios_contrato con el usuario, la compañía, el valor anterior y el nuevo;
        el PUT no se registra en lecturas_backoffice. Orden de validación: un campo que no es del contrato da
        403 CAMPO_NO_EDITABLE; un valor fuera de conjunto, 422 VALOR_FUERA_DE_CONJUNTO; un límite que no es un
        entero positivo, 422 LIMITE_INVALIDO; habilitar una fuente sin adaptador registrado (en D2 solo RUNT lo
        tiene, HU #13733) o IMPUESTO_DEPARTAMENTAL mientras Diagnostico:Fuentes:ImpuestoDisponible sea false
        (C3, R-9), 422 FUENTE_NO_DISPONIBLE. Con un error no
        se guarda ningún campo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdicionContrato"
      responses:
        "200":
          description: Contrato guardado (misma forma que el GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContratoBackoffice"
        "400":
          description: Empresa inválida (EMPRESA_REQUERIDA) o cuerpo que no es un objeto o repite un campo (CUERPO_INVALIDO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.configuracion.contrato.editar (sin cuerpo); campo que no
            es del contrato (CAMPO_NO_EDITABLE); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: VALOR_FUERA_DE_CONJUNTO, LIMITE_INVALIDO, FUENTE_NO_DISPONIBLE o VALOR_INVALIDO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/consultas/{consulta}/intentos:
    get:
      tags: [Backoffice]
      operationId: listarIntentosConsultaBackoffice
      summary: Intentos de una celda (auditoría del backoffice FLIT)
      description: >
        HU #13737 (F03-H6, F03-C11, plan §6.1 fila 03). Cada ejecución de una celda deja un intento de solo
        inserción en diagnostico.intentos_consulta (disparador AUTO y usuario_id nulo cuando lo hace el
        procesador; los reintentos de errores transitorios con backoff también dejan su intento). Política
        diagnostico.backoffice (diagnostico.backoffice.ver + tenant_type=FLIT) y además diagnostico.auditoria.ver:
        un usuario de la compañía recibe 403. Empresa explícita en ?empresa=; la lectura queda en
        diagnostico.lecturas_backoffice. Los intentos nunca llevan documentos: solo la placa o el VIN consultado.
        Orden: inicio ascendente.
      parameters:
        - name: consulta
          in: path
          required: true
          description: Id de la celda (diagnostico.consultas.id).
          schema:
            type: string
            format: uuid
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña de la celda (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Intentos de la celda, del más antiguo al más reciente (lista vacía si aún no se ejecutó).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentosConsulta"
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT o le falta diagnostico.auditoria.ver (sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "404":
          description: La celda no existe en la compañía indicada (`code` = CONSULTA_NO_ENCONTRADA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/consultas/{consulta}/manual:
    parameters:
      - name: consulta
        in: path
        required: true
        description: Id de la celda (`vehiculos[].celdas[].id` de obtenerGrillaDiagnosticoBackoffice).
        schema:
          type: string
          format: uuid
      - name: empresa
        in: query
        required: true
        description: Id de la compañía dueña de la celda (uuid distinto de cero, un solo valor).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerFormularioLlenadoManualBackoffice
      summary: Formulario del llenado manual de una celda (backoffice FLIT)
      description: >
        HU #13800 (F06-H3). Política diagnostico.backoffice (diagnostico.backoffice.ver + tenant_type=FLIT) y además
        diagnostico.consultas.llenar; empresa explícita en ?empresa= (la lectura queda en diagnostico.lecturas_backoffice).
        Devuelve la versión de la celda que se manda en el PUT, si admite el llenado (`admite_manual`) y, si no, el `motivo`
        (FUENTE_NO_ADMITE_MANUAL, CELDA_NO_EN_ERROR, CELDA_BLOQUEADA_POR_RUNT o SIN_PERSONAS_EN_ERROR). En las fuentes de persona
        (RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO) trae SOLO las personas en ERROR con su
        `persona_id` (el que va en el PUT), el documento enmascarado y la `consulta` que define el esquema de su resultado
        (RUNT_PERSONA, RUES o SIMIT); en las del vehículo, `personas` es null. Nunca el documento en claro ni el payload.
      responses:
        "200":
          description: Formulario de la celda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormularioLlenadoManual"
              example:
                id: 0199f3a1-6666-7000-8000-000000000006
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                vehiculo_id: 0199f3a1-2222-7000-8000-000000000002
                fuente: SIMIT_PROPIETARIO
                estado: ERROR
                tipo_error: PERSONAS_CON_ERROR
                version: 2
                admite_manual: true
                motivo: null
                personas:
                  - { persona_id: 0199f3a1-7777-7000-8000-000000000007, orden: 2, rol: PROPIETARIO, tipo_documento: C, documento_enmascarado: "****0102", declarado_por_cliente: false, consulta: SIMIT, tipo_error: TIMEOUT }
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No es backoffice FLIT o le falta diagnostico.consultas.llenar (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
    put:
      tags: [Backoffice]
      operationId: llenarConsultaManualBackoffice
      summary: Llenar a mano una celda en ERROR (backoffice FLIT)
      description: >
        HU #13800 (F06-H3, F06-C8..C11, R-1, R-8, R-20). Misma autorización que el GET (sin diagnostico.consultas.llenar: 403;
        el admin y el usuario de la compañía: 403). Solo una celda en ERROR que no sea BLOQUEADA_POR_RUNT, de una fuente distinta
        de RUNT e IMPUESTO_DEPARTAMENTAL (Q3, R-9). El cuerpo lleva la `version` de la celda que vio el backoffice (la de la
        grilla del backoffice o la del GET) y, según la fuente, `resultado` (SIMIT_VEHICULO: ResultadoManualSimit; AVALUO:
        ResultadoManualAvaluo) o `personas` (fuentes de persona: TODAS las personas en ERROR y solo ellas, cada una con el
        esquema de su `consulta`: RUNT_PERSONA, ResultadoManualRuntPersona; RUES, ResultadoManualRues; SIMIT,
        ResultadoManualSimit). Esquema cerrado: un campo desconocido es 422. La fecha del dato la fija el servidor (el avalúo
        no acepta `fecha`). En una transacción: la celda queda COMPLETADO con origen MANUAL y el usuario, tipo_error null y
        dato_obtenido_en del servidor; sube la versión del tablero; queda un intento disparador=MANUAL con el usuario, sin
        servicio ni transacción del proveedor (uno por persona llenada en las de persona; no consume); si el lote estaba
        COMPLETADO o INCOMPLETO vuelve a EN_PROCESO (historial MANUAL con el usuario) y se recalcula (sin más errores pasa a
        COMPLETADO, historial AUTO). Las personas que respondieron por API no cambian. La compañía no distingue el dato
        (mismo payload que la API; su historial muestra MANUAL como AUTO, Q5). Una celda MANUAL nunca se reutiliza el mismo día.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/LlenadoManualVehiculo"
                - $ref: "#/components/schemas/LlenadoManualPersonas"
            examples:
              simitVehiculo:
                summary: SIMIT_VEHICULO
                value:
                  version: 14
                  resultado:
                    semaforo: AMARILLO
                    cantidad_comparendos: 1
                    comparendos:
                      - { numero: TST-C-0001, fecha: "2026-09-30", valor: "468500", estado: PENDIENTE, organismo: Organismo de prueba }
              avaluo:
                summary: AVALUO con valor
                value:
                  version: 9
                  resultado:
                    sin_valor_comercial: false
                    valor_sugerido: 48500000
                    fuente_principal: fasecolda
                    fuentes:
                      - { fuente: fasecolda, estado: OK, valor: 48500000, muestras: 3 }
                      - { fuente: mercado_libre, estado: SIN_DATOS }
              avaluoSinValor:
                summary: AVALUO sin valor comercial
                value:
                  version: 9
                  resultado: { sin_valor_comercial: true, fuentes: [{ fuente: fasecolda, estado: SIN_DATOS }] }
              simitPersona:
                summary: SIMIT_PROPIETARIO (solo las personas en ERROR)
                value:
                  version: 2
                  personas:
                    - persona_id: 0199f3a1-7777-7000-8000-000000000007
                      resultado: { semaforo: VERDE, cantidad_comparendos: 0, comparendos: [] }
              runtPersona:
                summary: RUNT_PROPIETARIO, persona natural (consulta RUNT_PERSONA)
                value:
                  version: 5
                  personas:
                    - persona_id: 0199f3a1-8888-7000-8000-000000000008
                      resultado: { inscrito: true, estado_conductor: ACTIVO, licencias: [{ categoria: B1, estado: VIGENTE, vigente_hasta: "2030-01-01" }] }
              rues:
                summary: RUNT_PROPIETARIO con NIT (consulta RUES)
                value:
                  version: 5
                  personas:
                    - persona_id: 0199f3a1-9999-7000-8000-000000000009
                      resultado: { encontrada: true, estado_matricula: ACTIVA, ultima_renovacion: "2026-03-31" }
      responses:
        "200":
          description: Celda llenada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlenadoManualRespuesta"
              example:
                id: 0199f3a1-4444-7000-8000-000000000004
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                vehiculo_id: 0199f3a1-2222-7000-8000-000000000002
                fuente: SIMIT_VEHICULO
                estado: COMPLETADO
                origen: MANUAL
                usuario_manual_id: 0199f3a1-5555-7000-8000-000000000005
                dato_obtenido_en: "2026-10-22T17:30:00+00:00"
                version: 15
                estado_lote: COMPLETADO
        "400":
          description: Falta ?empresa= o no es válido (`code` = EMPRESA_REQUERIDA), o el cuerpo no es JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No es backoffice FLIT o le falta diagnostico.consultas.llenar (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: la celda no existe en la compañía indicada (nada cambia)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "409":
          description: >
            Nada cambia. `code` = CELDA_MODIFICADA (la `version` enviada no es la actual, p. ej. un reproceso en curso:
            recargar la grilla), CELDA_NO_EN_ERROR (COMPLETADO, también el avalúo «sin valor comercial»; PENDIENTE, EN_CURSO o NA)
            o CELDA_BLOQUEADA_POR_RUNT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "422":
          description: >
            Nada cambia. `code` = FUENTE_NO_ADMITE_MANUAL (RUNT o IMPUESTO_DEPARTAMENTAL), RESULTADO_INVALIDO con `campo` (ruta del
            cuerpo, p. ej. `version`, `resultado`, `resultado.proveedor`, `resultado.fuentes[0].valor`, `personas`,
            `personas[0].resultado.licencias[1].categoria`) o PERSONA_NO_EN_ERROR con `campo` = `personas[i].persona_id` (la persona
            no está en ERROR en la celda: las que respondieron por API no se llenan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
              example: { code: RESULTADO_INVALIDO, error: "El campo «proveedor» no existe en el esquema de esta fuente.", campo: resultado.proveedor }

  /api/v1/diagnostico/backoffice/diagnosticos:
    get:
      tags: [Backoffice]
      operationId: listarDiagnosticosBackoffice
      summary: Lotes de una compañía para el backoffice FLIT
      description: >
        HU #13799 (F06-H2, F06-C6). Política diagnostico.backoffice (diagnostico.backoffice.ver + tenant_type=FLIT):
        el rol backoffice_diagnostico en una compañía que no es FLIT, o el admin de la compañía, reciben 403 sin cuerpo.
        Empresa explícita en ?empresa= (nunca la del token); la lectura queda en diagnostico.lecturas_backoffice con el
        usuario, la empresa consultada, la ruta y la fecha, antes de leer. Solo lotes de esa compañía, del más reciente
        al más antiguo (creado_en, id), paginados. `celdas_en_error` = celdas del lote en estado ERROR.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
        - name: estado
          in: query
          required: false
          description: Filtra por estado del lote.
          schema:
            $ref: "#/components/schemas/EstadoDiagnostico"
        - name: con_errores
          in: query
          required: false
          description: true = solo lotes con al menos una celda en ERROR; false = solo lotes sin ERROR; sin él, todos.
          schema:
            type: boolean
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Página de lotes de la compañía indicada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDiagnosticosBackoffice"
        "400":
          description: >
            `code` = EMPRESA_REQUERIDA (falta ?empresa= o no es válido; no se audita), ESTADO_INVALIDO (`campo` = estado)
            o PAGINACION_INVALIDA (`campo` = pagina o tamano). Un con_errores que no es booleano también responde 400.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT (sin cuerpo); token sin compañía (`code` = SIN_EMPRESA) o sin usuario
            (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo (`code` = PRODUCTO_NO_HABILITADO).

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/grilla:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerGrillaDiagnosticoBackoffice
      summary: Grilla de un lote de una compañía con el origen de cada celda (backoffice FLIT)
      description: >
        HU #13799 (F06-H2, F06-C5/C6). Misma política y empresa explícita que listarDiagnosticosBackoffice (la lectura
        queda auditada). Es la grilla de obtenerGrillaDiagnostico (misma semántica de `desde`/`version`, columnas, avance
        y estimado_consultas) más `empresa` y, en cada celda, `origen` y `usuario_manual_id`. Sin payload ni documentos.
        No aplica la visibilidad_usuario de la compañía. El DTO de la compañía no cambia.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
        - name: desde
          in: query
          required: false
          description: Versión del tablero que ya tiene el cliente (0 o mayor; por defecto 0 = todo).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Grilla del lote con el origen de cada celda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrillaBackoffice"
              example:
                empresa: 7b1f0c2e-6d1a-4c55-9a43-2f6f0d1b9e10
                id: 0199f3a1-1111-7000-8000-000000000001
                nombre: Lote octubre
                estado: COMPLETADO
                version: 14
                desde: 0
                columnas: { por_vehiculo: [RUNT, SIMIT_VEHICULO], por_propietario: [], por_locatario: [] }
                avance: { vehiculos: 1, terminados: 1 }
                vehiculos:
                  - id: 0199f3a1-2222-7000-8000-000000000002
                    orden: 1
                    identificador: TST611
                    tipo_identificador: PLACA_CARRO
                    placa: TST611
                    vin: null
                    terminado: true
                    celdas:
                      - { id: 0199f3a1-3333-7000-8000-000000000003, fuente: RUNT, estado: COMPLETADO, motivo_na: null, tipo_error: null, dato_obtenido_en: "2026-10-22T15:00:00+00:00", reutilizada: false, version: 1, origen: API, usuario_manual_id: null }
                      - { id: 0199f3a1-4444-7000-8000-000000000004, fuente: SIMIT_VEHICULO, estado: COMPLETADO, motivo_na: null, tipo_error: null, dato_obtenido_en: "2026-10-22T15:10:00+00:00", reutilizada: false, version: 14, origen: MANUAL, usuario_manual_id: 0199f3a1-5555-7000-8000-000000000005 }
        "400":
          description: "`code` = EMPRESA_REQUERIDA (no se audita) o DESDE_INVALIDO (`campo` = desde)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No es backoffice FLIT (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/diagnosticos/{id}/historial:
    parameters:
      - name: id
        in: path
        required: true
        description: Id del lote (cabecera).
        schema:
          type: string
          format: uuid
    get:
      tags: [Backoffice]
      operationId: obtenerHistorialDiagnosticoBackoffice
      summary: Historial real de un lote de una compañía (backoffice FLIT)
      description: >
        HU #13799 (F06-H2, F06-C5, decisión Q5). Política diagnostico.backoffice y además diagnostico.auditoria.ver.
        Empresa explícita en ?empresa= (la lectura queda auditada). A diferencia de obtenerHistorialDiagnostico (vista de
        la compañía, donde MANUAL llega como AUTO y sin usuario), aquí el disparador y el usuario son los reales.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía dueña del lote (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Estado actual y transiciones reales del lote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorialLoteBackoffice"
              example:
                diagnostico_id: 0199f3a1-1111-7000-8000-000000000001
                estado: COMPLETADO
                transiciones:
                  - { estado_anterior: INCOMPLETO, estado_nuevo: COMPLETADO, disparador: MANUAL, usuario_id: 0199f3a1-5555-7000-8000-000000000005, en: "2026-10-22T15:10:00+00:00" }
        "400":
          description: "`code` = EMPRESA_REQUERIDA (no se audita)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: No es backoffice FLIT o le falta diagnostico.auditoria.ver (sin cuerpo); SIN_EMPRESA, SIN_USUARIO o PRODUCTO_NO_HABILITADO.
        "404":
          description: "`code` = NO_ENCONTRADO: el lote no existe en la compañía indicada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

  /api/v1/diagnostico/backoffice/resumen:
    get:
      tags: [Backoffice]
      operationId: obtenerResumenEmpresaBackoffice
      summary: Resumen de una compañía cliente para el backoffice FLIT
      description: >
        Ruta mínima de D0 (HU #13728): si la compañía indicada tiene configuración y cuántos diagnósticos y
        vehículos tiene. Política diagnostico.backoffice: exige a la vez el permiso diagnostico.backoffice.ver
        (o SuperAdmin) y el claim tenant_type=FLIT del token; con el rol backoffice_diagnostico en una compañía
        que no es FLIT, o en la compañía FLIT sin el permiso, responde 403, igual que cualquier otra ruta
        /backoffice/* (también una que no existe). La compañía nunca sale del token: se indica en ?empresa=
        (o en el segmento {empresa} de las rutas que lo lleven; si llegan los dos deben coincidir). Cada
        lectura queda en diagnostico.lecturas_backoffice con el usuario, la empresa consultada, la ruta y la
        fecha, antes de leer. Sin empresa válida responde 400 y no se audita.
      parameters:
        - name: empresa
          in: query
          required: true
          description: Id de la compañía a consultar (uuid distinto de cero, un solo valor).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen de la compañía indicada (solo sus datos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenEmpresaBackoffice"
        "400":
          description: Falta ?empresa=, no es un uuid, es cero, llega repetido o no coincide con la ruta (`code` = EMPRESA_REQUERIDA). No se audita.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            No es backoffice FLIT (falta el permiso o tenant_type no es FLIT; sin cuerpo); token sin compañía
            (`code` = SIN_EMPRESA) o sin usuario (`code` = SIN_USUARIO); la compañía FLIT sin Diagnóstico activo
            (`code` = PRODUCTO_NO_HABILITADO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRegla"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Sin sesión, token inválido o de otro producto.

  schemas:
    Sesion:
      type: object
      required: [usuario, empresa, roles, permisos, capacidades]
      properties:
        usuario:
          type: object
          required: [id, email, esSuperAdmin]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            esSuperAdmin:
              type: boolean
        empresa:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
              description: Claim tenant_id del token.
            nombre:
              type: string
              nullable: true
            tipo:
              type: string
              nullable: true
              description: Claim tenant_type (FLIT para la compañía FLIT).
        roles:
          type: array
          description: Códigos de rol del token (claim role_code).
          items:
            type: string
          example: [usuario_diagnostico]
        permisos:
          type: array
          description: Slugs diagnostico.* que tiene el usuario.
          items:
            type: string
          example: [diagnostico.diagnosticos.crear, diagnostico.diagnosticos.ver]
        capacidades:
          $ref: "#/components/schemas/Capacidades"

    Capacidades:
      type: object
      description: >
        Ayuda para armar el menú; cada endpoint vuelve a exigir su permiso. Las seis últimas son del
        backoffice FLIT y exigen además tenant_type=FLIT.
      required:
        - crearDiagnosticos
        - verDiagnosticos
        - descargarReportes
        - derivar
        - verConfiguracion
        - editarConfiguracion
        - reprocesarConsultas
        - backoffice
        - editarContrato
        - llenarConsultas
        - corregirDictamen
        - verAuditoria
        - verVolumetria
      properties:
        crearDiagnosticos:
          type: boolean
        verDiagnosticos:
          type: boolean
        descargarReportes:
          type: boolean
        derivar:
          type: boolean
        verConfiguracion:
          type: boolean
        editarConfiguracion:
          type: boolean
        reprocesarConsultas:
          type: boolean
        backoffice:
          type: boolean
        editarContrato:
          type: boolean
        llenarConsultas:
          type: boolean
        corregirDictamen:
          type: boolean
        verAuditoria:
          type: boolean
        verVolumetria:
          type: boolean

    ResumenEmpresaBackoffice:
      type: object
      required: [empresa, configuracion, diagnosticos, vehiculos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía indicada en ?empresa=.
        configuracion:
          type: boolean
          description: La compañía ya tiene fila en configuracion_empresa.
        diagnosticos:
          type: integer
          format: int32
          minimum: 0
        vehiculos:
          type: integer
          format: int32
          minimum: 0

    IntentosConsulta:
      type: object
      required: [consulta, intentos]
      properties:
        consulta:
          type: string
          format: uuid
        intentos:
          type: array
          items:
            $ref: "#/components/schemas/IntentoConsulta"

    IntentoConsulta:
      type: object
      required: [id, fuente, servicio, identificador, disparador, inicio, fin, estado, tipo_error, mensaje_error, transaccion_proveedor_id, desde_cache, usuario_id]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        servicio:
          type: string
          nullable: true
          enum: [VERIFIK, KYVERUM, INTEMPO, SMARTCLOUD, FASECOLDA, MERCADOLIBRE, BASEGRAVABLE, SCRAPING, FLITFINES, OTRO, null]
          description: Proveedor que respondió; null si no llegó a ninguno.
        identificador:
          type: string
          nullable: true
          maxLength: 17
          description: >
            Placa o VIN consultado; null si la consulta es por persona (nunca un documento). Las celdas de persona
            (HU #13792, #13794) dejan un intento por cada persona consultada.
        disparador:
          type: string
          enum: [AUTO, REPROCESO, MANUAL]
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        estado:
          type: string
          enum: [SUCCESS, ERROR]
        tipo_error:
          type: string
          nullable: true
          description: >
            Código del error (null si SUCCESS). Transitorios, que se reintentan con backoff 5 s × 2^(n−1) hasta
            Diagnostico:Consultas:MaxReintentos ∈ [0, 3] (por defecto 1): TIMEOUT, RED, HTTP_5XX. Definitivos:
            RESPUESTA_INVALIDA, AUTENTICACION, ESTADO_NO_OK, NO_CONECTADO y cualquier otro.
        mensaje_error:
          type: string
          nullable: true
        transaccion_proveedor_id:
          type: string
          nullable: true
        desde_cache:
          type: boolean
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Usuario del reproceso o del llenado manual; null si fue el procesador.

    Fuente:
      type: string
      enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL]

    VisibilidadUsuario:
      type: string
      enum: [PROPIOS, EMPRESA]

    EstimadoConsultas:
      type: string
      enum: [NO_MOSTRAR, ANTES_DE_LANZAR, AL_FINALIZAR]

    Configuracion:
      type: object
      required: [empresa, contrato, operacion]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía del token.
        contrato:
          type: object
          required: [solo_lectura, fuentes_habilitadas, limite_vehiculos_lote, actualizado_en]
          properties:
            solo_lectura:
              type: boolean
              description: Siempre true para la compañía; el contrato lo edita el backoffice FLIT.
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            actualizado_en:
              type: string
              format: date-time
              nullable: true
        operacion:
          type: object
          required: [visibilidad_usuario, fuentes_por_defecto, estimado_consultas, actualizado_por, actualizado_en]
          properties:
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              description: Subconjunto de contrato.fuentes_habilitadas.
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
            actualizado_por:
              type: string
              format: uuid
              nullable: true
            actualizado_en:
              type: string
              format: date-time
              nullable: true

    EdicionOperativa:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        visibilidad_usuario:
          $ref: "#/components/schemas/VisibilidadUsuario"
        fuentes_por_defecto:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        estimado_consultas:
          $ref: "#/components/schemas/EstimadoConsultas"
      example:
        visibilidad_usuario: PROPIOS
        estimado_consultas: ANTES_DE_LANZAR

    ContratoBackoffice:
      type: object
      required: [empresa, fuentes_habilitadas, limite_vehiculos_lote, redaccion_ia_suspendida, fuentes_por_defecto, actualizado_por, actualizado_en]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía de la ruta.
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
          description: Interruptor de emergencia de la redacción IA (R-2). Solo lo ve el backoffice.
        fuentes_por_defecto:
          type: array
          description: Solo lectura aquí (las edita el admin de la compañía); se recortan al reducir las habilitadas.
          items:
            $ref: "#/components/schemas/Fuente"
        actualizado_por:
          type: string
          format: uuid
          nullable: true
          description: Usuario del backoffice del último cambio contractual.
        actualizado_en:
          type: string
          format: date-time
          nullable: true

    EdicionContrato:
      type: object
      description: Solo estos campos; cualquier otro responde 403 CAMPO_NO_EDITABLE.
      additionalProperties: false
      properties:
        fuentes_habilitadas:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        limite_vehiculos_lote:
          type: integer
          format: int32
          minimum: 1
        redaccion_ia_suspendida:
          type: boolean
      example:
        limite_vehiculos_lote: 200

    TiposTramite:
      type: object
      required: [tipos]
      properties:
        tipos:
          type: array
          items:
            $ref: "#/components/schemas/TipoTramite"

    TipoTramite:
      type: object
      required: [codigo, nombre, familia, fuentesObligatorias]
      properties:
        codigo:
          type: string
          description: Código estable del tipo en Trámites.
          example: TRASPASO_STANDARD
        nombre:
          type: string
          example: TRASPASO
        familia:
          type: string
          description: MATRICULAS, TRASPASO u OTROS.
          example: TRASPASO
        fuentesObligatorias:
          type: array
          description: Fuentes que el tipo exige en el alcance (códigos RUNT, SIMIT_VEHICULO...). Vacía en D1.
          items:
            type: string

    ModoDiagnostico:
      type: string
      enum: [SIMPLE, CON_ANALISIS]

    EstadoDiagnostico:
      type: string
      enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO]

    Alcance:
      type: object
      description: >
        Fuentes en sus tres grupos (R-24). por_vehiculo: RUNT, SIMIT_VEHICULO, AVALUO, IMPUESTO_DEPARTAMENTAL;
        por_propietario: RUNT_PROPIETARIO, SIMIT_PROPIETARIO; por_locatario: RUNT_LOCATARIO, SIMIT_LOCATARIO. Una fuente
        en un grupo que no es el suyo responde 422 FUENTE_EN_GRUPO_AJENO. RUNT siempre. Un grupo ausente equivale a vacío.
      properties:
        por_vehiculo:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_propietario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"
        por_locatario:
          type: array
          items:
            $ref: "#/components/schemas/Fuente"

    CabeceraEntrada:
      type: object
      required: [nombre, modo, alcance]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS (código de GET /tipos-tramite); se descarta con SIMPLE.
          example: TRASPASO_STANDARD
        alcance:
          $ref: "#/components/schemas/Alcance"
      example:
        nombre: Flota norte
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT, SIMIT_VEHICULO]
          por_propietario: [RUNT_PROPIETARIO]
          por_locatario: []

    Diagnostico:
      type: object
      required: [id, nombre, modo, tipo_tramite_codigo, es_express, estado, alcance, configuracion, usuario_creador_id, creado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        alcance:
          $ref: "#/components/schemas/Alcance"
        configuracion:
          type: object
          description: Copia inmutable de la configuración de la compañía al crear (sin redaccion_ia_suspendida).
          required: [fuentes_habilitadas, limite_vehiculos_lote, visibilidad_usuario, fuentes_por_defecto, estimado_consultas]
          properties:
            fuentes_habilitadas:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            limite_vehiculos_lote:
              type: integer
              format: int32
              minimum: 1
            visibilidad_usuario:
              $ref: "#/components/schemas/VisibilidadUsuario"
            fuentes_por_defecto:
              type: array
              items:
                $ref: "#/components/schemas/Fuente"
            estimado_consultas:
              $ref: "#/components/schemas/EstimadoConsultas"
        usuario_creador_id:
          type: string
          format: uuid
        creado_en:
          type: string
          format: date-time

    ResumenValidacion:
      type: object
      required: [total_filas, validos, erroneos, duplicados, puede_continuar, limite_vehiculos_lote, supera_limite, avisos, filas]
      properties:
        total_filas:
          type: integer
          description: Filas de datos no vacías del archivo.
        validos:
          type: integer
        erroneos:
          type: integer
        duplicados:
          type: integer
          description: Repeticiones de un identificador válido ya presente (consolidadas en su primera fila).
        puede_continuar:
          type: boolean
          description: false sin válidos o con más válidos que el límite por lote.
        limite_vehiculos_lote:
          type: integer
          description: Límite de la copia de configuración de la cabecera.
        supera_limite:
          type: boolean
        avisos:
          type: array
          items:
            $ref: "#/components/schemas/AvisoCarga"
        filas:
          type: array
          description: Una por fila leída, salvo los duplicados consolidados, en el orden del archivo.
          items:
            $ref: "#/components/schemas/FilaResumen"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración; en otro caso no viene.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    AvisoCarga:
      type: object
      required: [code, mensaje]
      properties:
        code:
          type: string
          enum: [SIN_VALIDOS, LIMITE_SUPERADO]
        mensaje:
          type: string

    FilaResumen:
      type: object
      required: [fila, identificador, identificador_norm, tipo_identificador, tipo_documento_locatario, documento_locatario, valida, filas_duplicadas, errores]
      properties:
        fila:
          type: integer
          description: Número de fila de la hoja o del CSV (el encabezado es la 1).
        identificador:
          type: string
          description: Tal como vino en el archivo.
        identificador_norm:
          type: string
          description: Normalizado con la regla de Trámites; si es demasiado largo, el valor limpio sin recortar.
        tipo_identificador:
          type: string
          nullable: true
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, VIN, null]
        tipo_documento_locatario:
          type: string
          nullable: true
          example: CC
        documento_locatario:
          type: string
          nullable: true
          description: Siempre enmascarado.
          example: "****4050"
        valida:
          type: boolean
        filas_duplicadas:
          type: array
          items:
            type: integer
        errores:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFila"

    ErrorFila:
      type: object
      required: [campo, code, mensaje]
      properties:
        campo:
          type: string
          enum: [Identificador_Vehiculo, Tipo_Documento_Locatario, Documento_Locatario]
        code:
          type: string
          enum: [IDENTIFICADOR_REQUERIDO, IDENTIFICADOR_INVALIDO, IDENTIFICADOR_DEMASIADO_LARGO, TIPO_DOCUMENTO_INVALIDO, DOCUMENTO_INVALIDO, DOCUMENTO_INCOMPLETO]
        mensaje:
          type: string

    EstimadoFuente:
      type: object
      description: >-
        Consultas previstas de una fuente del alcance (HU #13747). Lo usan el resumen de carga, la confirmación de
        vehículos, Express y la vista previa de Express. Las fuentes de persona (RUNT_PROPIETARIO, RUNT_LOCATARIO,
        SIMIT_PROPIETARIO, SIMIT_LOCATARIO) consultan una vez por persona, que antes de lanzar aún no se conocen: su
        número es un mínimo de uno por vehículo (locatario, uno por vehículo con documento declarado) y llevan
        `minimo=true`, para rotularlo «al menos N» (HU #13796, Q7).
      required: [fuente, consultas, minimo]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        consultas:
          type: integer
        minimo:
          type: boolean
          description: >-
            true si `consultas` es un mínimo («al menos N»): fuente de persona con algún vehículo válido cuyas personas
            aún no se conocen. Siempre false en las fuentes del vehículo y en un lote sin vehículos válidos.
      example: { fuente: SIMIT_PROPIETARIO, consultas: 10, minimo: true }

    FilaCapturada:
      type: object
      description: Una fila capturada (HU #13751). El documento del locatario es opcional; si viene, tipo y número juntos.
      properties:
        fila:
          type: integer
          description: Número de fila del archivo (para el resumen de validar-filas).
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número del documento; se guarda cifrado y nunca vuelve en claro."

    FilasAValidar:
      type: object
      properties:
        filas:
          type: array
          items:
            $ref: "#/components/schemas/FilaCapturada"

    ConfirmacionVehiculos:
      type: object
      description: Multipart de POST /diagnosticos/{id}/vehiculos (HU #13751, «Reenviar el archivo»).
      required: [archivo]
      properties:
        archivo:
          type: string
          format: binary
          description: "@pii:high El MISMO .xlsx o .csv enviado a POST /diagnosticos/{id}/carga."
        correcciones:
          type: string
          description: >
            JSON (texto del campo del formulario) con una lista de CorreccionFila; vacío o ausente es sin correcciones.
            Ejemplo: [{"fila": 2, "identificador": "ABC123"}, {"fila": 5, "tipo_documento_locatario": "CC", "documento_locatario": "1020304050"}]

    CorreccionFila:
      type: object
      description: >
        Corrección de una fila del archivo (va dentro del JSON de `correcciones`). `fila` es el número de fila del análisis
        (encabezado en la fila 1). Un campo ausente conserva el valor del archivo; con null o vacío lo deja vacío. No envíe
        el documento enmascarado del análisis («****…»): es inválido y la fila se descarta; omita el campo para conservar
        el del archivo.
      required: [fila]
      properties:
        fila:
          type: integer
        identificador:
          type: string
          nullable: true
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número completo del documento; se guarda cifrado y nunca vuelve en claro."

    ResultadoConfirmacion:
      type: object
      required: [diagnostico_id, confirmados, invalidos, duplicados, limite_vehiculos_lote, vehiculos]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        confirmados:
          type: integer
        invalidos:
          type: integer
          description: Vehículos descartados por identificador o documento inválido.
        duplicados:
          type: integer
          description: Vehículos descartados por repetir un identificador válido anterior.
        limite_vehiculos_lote:
          type: integer
        vehiculos:
          type: array
          items:
            $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    VehiculoConfirmado:
      type: object
      required: [id, orden, identificador, identificador_norm, tipo_identificador]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
        identificador_norm:
          type: string
        tipo_identificador:
          type: string
          enum: [PLACA_CARRO, PLACA_MOTO, PLACA_REMOLQUE, PLACA_MAQUINARIA, VIN]
        tipo_documento_locatario:
          type: string
          nullable: true
        documento_locatario:
          type: string
          nullable: true
          description: Enmascarado («****» y los 4 últimos).

    ExpressEntrada:
      type: object
      description: >
        Cuerpo de POST /express y POST /express/estimado (HU #13753): la cabecera como en CabeceraEntrada, pero con el
        nombre opcional, y el único vehículo con el documento del locatario opcional (tipo y número juntos).
      required: [modo, alcance, identificador]
      properties:
        nombre:
          type: string
          nullable: true
          maxLength: 150
          description: Vacío o ausente se autogenera «Express IDENTIFICADOR dd/mm/aaaa».
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite_codigo:
          type: string
          nullable: true
          description: Obligatorio con CON_ANALISIS; se descarta con SIMPLE.
        alcance:
          $ref: "#/components/schemas/Alcance"
        identificador:
          type: string
          nullable: true
          description: Placa o VIN tal como lo escribió el cliente.
        tipo_documento_locatario:
          type: string
          nullable: true
          description: CC, CE, NIT, PAS o TI.
        documento_locatario:
          type: string
          nullable: true
          description: "@pii:high Número del documento; se guarda cifrado y nunca vuelve en claro."
      example:
        identificador: ABC123
        modo: SIMPLE
        alcance:
          por_vehiculo: [RUNT]
          por_propietario: []
          por_locatario: []

    ExpressCreado:
      type: object
      required: [id, nombre, modo, es_express, estado, creado_en, vehiculo]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        es_express:
          type: boolean
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        creado_en:
          type: string
          format: date-time
        vehiculo:
          $ref: "#/components/schemas/VehiculoConfirmado"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas = ANTES_DE_LANZAR en la copia de configuración.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    EstimadoExpress:
      type: object
      required: [mostrar_estimado]
      properties:
        mostrar_estimado:
          type: boolean
          description: Verdadero con estimado_consultas = ANTES_DE_LANZAR en la configuración vigente de la compañía.
        estimado_consultas:
          type: array
          description: Solo cuando mostrar_estimado es verdadero.
          items:
            $ref: "#/components/schemas/EstimadoFuente"

    Grilla:
      type: object
      required: [id, nombre, estado, version, desde, columnas, avance, vehiculos]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        version:
          type: integer
          format: int64
          description: Versión actual del tablero; el cliente la manda como `desde` en el siguiente sondeo.
        desde:
          type: integer
          format: int64
          description: La versión pedida (eco).
        columnas:
          $ref: "#/components/schemas/Alcance"
        avance:
          $ref: "#/components/schemas/AvanceLote"
        vehiculos:
          type: array
          description: Solo los vehículos con celdas cambiadas desde `desde` (todos con desde=0), en el orden del lote.
          items:
            $ref: "#/components/schemas/FilaVehiculo"
        estimado_consultas:
          type: array
          description: Solo con estimado_consultas=AL_FINALIZAR y el lote COMPLETADO o INCOMPLETO; si no, la clave no viene.
          items:
            $ref: "#/components/schemas/EstimadoVsConsumido"

    AvanceLote:
      type: object
      required: [vehiculos, terminados]
      properties:
        vehiculos:
          type: integer
          description: Vehículos del lote.
        terminados:
          type: integer
          description: Vehículos con todas sus celdas en COMPLETADO o NA (R-7).

    FilaVehiculo:
      type: object
      required: [id, orden, identificador, tipo_identificador, placa, vin, terminado, celdas]
      properties:
        id:
          type: string
          format: uuid
        orden:
          type: integer
        identificador:
          type: string
          description: Placa o VIN normalizado.
        tipo_identificador:
          type: string
          example: PLACA_CARRO
        placa:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        terminado:
          type: boolean
          description: Todas sus celdas (no solo las de esta respuesta) en COMPLETADO o NA.
        celdas:
          type: array
          description: Solo las celdas cambiadas desde `desde`, en el orden del alcance.
          items:
            $ref: "#/components/schemas/CeldaGrilla"

    CeldaGrilla:
      type: object
      description: Sin origen, usuario manual, payload ni documentos (R-20).
      required: [id, fuente, estado, motivo_na, tipo_error, dato_obtenido_en, reutilizada, version]
      properties:
        id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA]
        motivo_na:
          type: string
          nullable: true
          description: "Solo con estado NA: SERVICIO_PUBLICO, DEPARTAMENTO_NO_SOPORTADO o SIN_DOCUMENTO_LOCATARIO."
        tipo_error:
          type: string
          nullable: true
          description: >
            Solo con estado ERROR: código del tipo de error de la fuente o BLOQUEADA_POR_RUNT. En las celdas de persona
            (RUNT_PROPIETARIO, RUNT_LOCATARIO, HU #13792; SIMIT_PROPIETARIO, SIMIT_LOCATARIO, HU #13794), PERSONAS_CON_ERROR si falló al menos una persona y no todas por
            la misma causa (si fallan todas por la misma, esa causa); lo que sí respondió se conserva. En SIMIT_VEHICULO
            (HU #13793), SIN_PLACA si el vehículo no tiene placa tras el RUNT (definitivo, sin consulta ni consumo). En AVALUO
            (HU #13795), SIN_IDENTIFICADOR si no tiene placa ni VIN tras el RUNT (definitivo); un avalúo sin valor en ninguna
            fuente NO es error: la celda queda COMPLETADO con sin_valor_comercial=true y no se reprocesa.
          example: TIMEOUT
        dato_obtenido_en:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora del dato (D-10); en la reutilizada, la del dato original.
        reutilizada:
          type: boolean
          description: El dato se reutilizó de una consulta del mismo día de la compañía, sin consumo (D-10).
        version:
          type: integer
          format: int64
          description: Versión del tablero en el último cambio de la celda.

    EstimadoVsConsumido:
      type: object
      required: [fuente, estimadas, consumidas, minimo]
      properties:
        fuente:
          $ref: "#/components/schemas/Fuente"
        estimadas:
          type: integer
          description: >-
            Estimado de la fuente (vehículos menos N/A previsibles, HU #13747). En las fuentes de persona, las personas
            registradas del rol en los vehículos del lote (personas_vehiculo, HU #13796).
        consumidas:
          type: integer
          description: >-
            Intentos con desde_cache=false, sin los de llenado manual. En las fuentes de persona hay un intento por
            persona (cada reintento real también consume).
        minimo:
          type: boolean
          description: >-
            true solo si la fuente es de persona y algún vehículo del lote no tiene personas registradas (lote anterior a
            D3 o RUNT sin respuesta): ese vehículo cuenta uno, y el estimado es «al menos N».
      example: { fuente: RUNT_PROPIETARIO, estimadas: 3, consumidas: 3, minimo: false }

    CierrePanel:
      type: object
      required: [id, estado, cerrado_en]
      properties:
        id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        cerrado_en:
          type: string
          format: date-time

    ReprocesoConsulta:
      type: object
      required: [id, diagnostico_id, estado, estado_lote, version]
      properties:
        id:
          type: string
          format: uuid
          description: Id de la celda.
        diagnostico_id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [PENDIENTE]
        estado_lote:
          $ref: "#/components/schemas/EstadoDiagnostico"
        version:
          type: integer
          format: int64
          description: version_tablero del lote tras el reproceso (la celda la lleva para el sondeo ?desde=).

    HistorialLote:
      type: object
      required: [diagnostico_id, estado, transiciones]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        transiciones:
          type: array
          items:
            $ref: "#/components/schemas/TransicionLote"

    TransicionLote:
      type: object
      required: [estado_anterior, estado_nuevo, disparador, usuario_id, en]
      properties:
        estado_anterior:
          type: string
          nullable: true
          description: Null en la creación del lote; si no, CREADO, EN_PROCESO, COMPLETADO o INCOMPLETO.
        estado_nuevo:
          $ref: "#/components/schemas/EstadoDiagnostico"
        disparador:
          type: string
          enum: [AUTO, CIERRE_PANEL, REPROCESO]
          description: El llenado manual (MANUAL) se presenta a la compañía como AUTO (HU #13798, Q5); el backoffice ve el real.
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Usuario que la provocó; null si fue el procesador o el llenado manual.
        en:
          type: string
          format: date-time

    ListaDiagnosticos:
      type: object
      description: Página de lotes de la compañía del token visibles para el usuario (HU #13845).
      required: [pagina, tamano, total, diagnosticos]
      properties:
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          description: Lotes visibles que cumplen los filtros (todas las páginas).
        diagnosticos:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoListado"
      example:
        pagina: 1
        tamano: 25
        total: 2
        diagnosticos:
          - id: 0199f3a1-2222-7000-8000-000000000002
            nombre: Flota octubre
            creado_en: "2026-10-22T14:00:00+00:00"
            modo: CON_ANALISIS
            tipo_tramite: { codigo: TRASPASO_STANDARD, nombre: TRASPASO }
            estado: EN_PROCESO
            usuario_creador: { id: 5f0c7a2e-1b2c-4d3e-8f90-0a1b2c3d4e5f, nombre: Ana Prueba }
          - id: 0199f3a1-1111-7000-8000-000000000001
            nombre: Lote sin lanzar
            creado_en: "2026-10-21T13:00:00+00:00"
            modo: SIMPLE
            tipo_tramite: null
            estado: CREADO
            usuario_creador: { id: 6a1d8b3f-2c3d-4e5f-9a01-1b2c3d4e5f60, nombre: No disponible }

    DiagnosticoListado:
      type: object
      required: [id, nombre, creado_en, modo, tipo_tramite, estado, usuario_creador]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        creado_en:
          type: string
          format: date-time
        modo:
          $ref: "#/components/schemas/ModoDiagnostico"
        tipo_tramite:
          type: object
          nullable: true
          description: null en SIMPLE; el nombre es el código si el tipo ya no está publicado.
          required: [codigo, nombre]
          properties:
            codigo:
              type: string
            nombre:
              type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        usuario_creador:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
              description: Nombre visible según Identidad; «No disponible» si no se pudo resolver.

    ListaDiagnosticosBackoffice:
      type: object
      description: Página de lotes de una compañía para el backoffice FLIT (HU #13799).
      required: [empresa, pagina, tamano, total, diagnosticos]
      properties:
        empresa:
          type: string
          format: uuid
          description: La compañía consultada (eco de ?empresa=).
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
          description: Lotes que cumplen los filtros (todas las páginas).
        diagnosticos:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticoBackoffice"
      example:
        empresa: 7b1f0c2e-6d1a-4c55-9a43-2f6f0d1b9e10
        pagina: 1
        tamano: 50
        total: 1
        diagnosticos:
          - { id: 0199f3a1-1111-7000-8000-000000000001, nombre: Lote octubre, estado: EN_PROCESO, creado_en: "2026-10-22T14:00:00+00:00", vehiculos: 2, celdas_en_error: 2 }

    DiagnosticoBackoffice:
      type: object
      required: [id, nombre, estado, creado_en, vehiculos, celdas_en_error]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        creado_en:
          type: string
          format: date-time
        vehiculos:
          type: integer
          description: Vehículos del lote.
        celdas_en_error:
          type: integer
          description: Celdas del lote en estado ERROR.

    GrillaBackoffice:
      description: Grilla (schema Grilla) más la empresa consultada; las celdas llevan origen y usuario_manual_id (HU #13799).
      allOf:
        - $ref: "#/components/schemas/Grilla"
        - type: object
          required: [empresa, vehiculos]
          properties:
            empresa:
              type: string
              format: uuid
            vehiculos:
              type: array
              items:
                $ref: "#/components/schemas/FilaVehiculoBackoffice"

    FilaVehiculoBackoffice:
      description: FilaVehiculo con celdas del backoffice.
      allOf:
        - $ref: "#/components/schemas/FilaVehiculo"
        - type: object
          required: [celdas]
          properties:
            celdas:
              type: array
              items:
                $ref: "#/components/schemas/CeldaGrillaBackoffice"

    CeldaGrillaBackoffice:
      description: CeldaGrilla más el origen del dato y el usuario del llenado manual (solo backoffice, HU #13799).
      allOf:
        - $ref: "#/components/schemas/CeldaGrilla"
        - type: object
          required: [origen, usuario_manual_id]
          properties:
            origen:
              type: string
              nullable: true
              enum: [API, MANUAL]
              description: >
                API = consulta a la fuente (también la reutilizada del mismo día, que se distingue con reutilizada=true);
                MANUAL = llenado del backoffice; null mientras la celda no tiene dato.
            usuario_manual_id:
              type: string
              format: uuid
              nullable: true
              description: Usuario del backoffice que la llenó a mano; null si origen no es MANUAL.

    HistorialLoteBackoffice:
      type: object
      required: [diagnostico_id, estado, transiciones]
      properties:
        diagnostico_id:
          type: string
          format: uuid
        estado:
          $ref: "#/components/schemas/EstadoDiagnostico"
        transiciones:
          type: array
          items:
            $ref: "#/components/schemas/TransicionLoteBackoffice"

    TransicionLoteBackoffice:
      type: object
      description: Transición con el disparador y el usuario reales (HU #13799, Q5).
      required: [estado_anterior, estado_nuevo, disparador, usuario_id, en]
      properties:
        estado_anterior:
          type: string
          nullable: true
        estado_nuevo:
          $ref: "#/components/schemas/EstadoDiagnostico"
        disparador:
          type: string
          enum: [AUTO, CIERRE_PANEL, REPROCESO, MANUAL]
        usuario_id:
          type: string
          format: uuid
          nullable: true
          description: Null si fue el procesador (AUTO); MANUAL trae el usuario del backoffice.
        en:
          type: string
          format: date-time

    DetalleCelda:
      type: object
      description: >
        Detalle de una celda (HU #13798). DTO cerrado: sin origen, usuario manual, proveedor, transacción, payload,
        nombres ni documentos completos (R-20). Todas las claves van siempre.
      required: [id, vehiculo_id, fuente, estado, motivo_na, tipo_error, dato_obtenido_en, reutilizada, resultado, personas]
      properties:
        id:
          type: string
          format: uuid
          description: Id de la celda (el mismo de la grilla).
        vehiculo_id:
          type: string
          format: uuid
        fuente:
          $ref: "#/components/schemas/Fuente"
        estado:
          type: string
          enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA]
        motivo_na:
          type: string
          nullable: true
          description: "Solo con estado NA: SERVICIO_PUBLICO, DEPARTAMENTO_NO_SOPORTADO o SIN_DOCUMENTO_LOCATARIO."
        tipo_error:
          type: string
          nullable: true
          description: Solo con estado ERROR; mismos códigos que CeldaGrilla.tipo_error.
        dato_obtenido_en:
          type: string
          format: date-time
          nullable: true
        reutilizada:
          type: boolean
        resultado:
          nullable: true
          description: Solo en RUNT, SIMIT_VEHICULO y AVALUO con la celda COMPLETADO; el tipo depende de `fuente`.
          oneOf:
            - $ref: "#/components/schemas/ResultadoRuntDetalle"
            - $ref: "#/components/schemas/ResultadoSimitDetalle"
            - $ref: "#/components/schemas/ResultadoAvaluoDetalle"
        personas:
          type: array
          nullable: true
          description: Solo en las fuentes de persona (null en las demás); una entrada por persona del rol, en orden.
          items:
            $ref: "#/components/schemas/PersonaDetalle"

    PersonaDetalle:
      type: object
      required: [orden, rol, tipo_documento, documento_enmascarado, declarado_por_cliente, consulta, estado, tipo_error, consultado_en, resultado]
      properties:
        orden:
          type: integer
          description: Posición dentro del rol, desde 1.
        rol:
          type: string
          enum: [PROPIETARIO, LOCATARIO]
        tipo_documento:
          type: string
          example: C
        documento_enmascarado:
          type: string
          description: "`****` más los cuatro últimos caracteres alfanuméricos; solo `****` si el documento tiene cuatro o menos."
          example: "****5678"
        declarado_por_cliente:
          type: boolean
          description: El documento lo declaró el cliente en la captura (locatario declarado), no el RUNT.
        consulta:
          type: string
          nullable: true
          enum: [RUNT_PERSONA, RUES, SIMIT]
          description: Qué se consultó para esta persona (RUES si es NIT, decisión Q2); null sin resultado.
        estado:
          type: string
          enum: [OK, ERROR, SIN_RESULTADO]
          description: SIN_RESULTADO si la celda aún no tiene dato de esta persona (pendiente, en curso o N/A).
        tipo_error:
          type: string
          nullable: true
        consultado_en:
          type: string
          format: date-time
          nullable: true
        resultado:
          nullable: true
          description: Solo con estado OK; RUNT_PERSONA, RUES o SIMIT según `consulta`.
          oneOf:
            - $ref: "#/components/schemas/ResultadoRuntPersonaDetalle"
            - $ref: "#/components/schemas/ResultadoRuesDetalle"
            - $ref: "#/components/schemas/ResultadoSimitDetalle"

    ResultadoRuntDetalle:
      type: object
      required: [placa, vin, servicio, clase, organismo, propietarios, locatarios]
      properties:
        placa: { type: string, nullable: true }
        vin: { type: string, nullable: true }
        servicio: { type: string, nullable: true, description: "Servicio del vehículo (PARTICULAR, PUBLICO...), no el proveedor." }
        clase: { type: string, nullable: true }
        organismo: { type: string, nullable: true }
        propietarios:
          type: array
          items:
            type: object
            required: [tipo_documento, tipo_propiedad]
            properties:
              tipo_documento: { type: string, nullable: true }
              tipo_propiedad: { type: string, nullable: true }
        locatarios: { type: integer }

    ResultadoSimitDetalle:
      type: object
      required: [semaforo, cantidad_comparendos, comparendos, comparendos_truncados]
      properties:
        semaforo: { type: string, nullable: true, enum: [VERDE, AMARILLO, ROJO] }
        cantidad_comparendos: { type: integer, description: "Total de comparendos (aunque la lista se corte)." }
        comparendos:
          type: array
          maxItems: 100
          items:
            type: object
            required: [numero, fecha, valor, estado, organismo]
            properties:
              numero: { type: string, nullable: true }
              fecha: { type: string, nullable: true, example: "2026-01-02" }
              valor: { type: string, nullable: true, description: "Texto decimal en pesos.", example: "500000" }
              estado: { type: string, nullable: true }
              organismo: { type: string, nullable: true }
        comparendos_truncados: { type: boolean, description: "true si había más de 100 comparendos." }

    ResultadoAvaluoDetalle:
      type: object
      required: [sin_valor_comercial, valor_sugerido, fuente_principal, fuentes]
      properties:
        sin_valor_comercial: { type: boolean, description: "Ninguna fuente con valor: mostrar «sin valor comercial» (Q4 = b)." }
        valor_sugerido: { type: integer, format: int64, nullable: true, description: "Pesos colombianos." }
        fuente_principal: { type: string, nullable: true, enum: [fasecolda, mercado_libre, base_gravable] }
        fuentes:
          type: array
          items:
            type: object
            required: [fuente, estado, valor, muestras, fecha]
            properties:
              fuente: { type: string, nullable: true, example: fasecolda }
              estado: { type: string, nullable: true, enum: [OK, SIN_DATOS, ERROR] }
              valor: { type: integer, format: int64, nullable: true }
              muestras: { type: integer, nullable: true }
              fecha: { type: string, nullable: true, example: "2026-10-22" }

    ResultadoRuntPersonaDetalle:
      type: object
      required: [inscrito, estado_conductor, licencias]
      properties:
        inscrito: { type: boolean }
        estado_conductor: { type: string, nullable: true }
        licencias:
          type: array
          items:
            type: object
            required: [categoria, estado, vigente_hasta]
            properties:
              categoria: { type: string, nullable: true }
              estado: { type: string, nullable: true }
              vigente_hasta: { type: string, nullable: true }

    ResultadoRuesDetalle:
      type: object
      required: [encontrada, estado_matricula, ultima_renovacion]
      properties:
        encontrada: { type: boolean }
        estado_matricula: { type: string, nullable: true }
        ultima_renovacion: { type: string, nullable: true }

    FormularioLlenadoManual:
      type: object
      description: Formulario del llenado manual (HU #13800). Todas las claves van siempre.
      required: [id, diagnostico_id, vehiculo_id, fuente, estado, tipo_error, version, admite_manual, motivo, personas]
      properties:
        id: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        vehiculo_id: { type: string, format: uuid }
        fuente: { type: string, enum: [RUNT, RUNT_PROPIETARIO, RUNT_LOCATARIO, SIMIT_VEHICULO, SIMIT_PROPIETARIO, SIMIT_LOCATARIO, AVALUO, IMPUESTO_DEPARTAMENTAL] }
        estado: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADO, ERROR, NA] }
        tipo_error: { type: string, nullable: true }
        version: { type: integer, format: int64, description: "Versión de la celda; va en el cuerpo del PUT." }
        admite_manual: { type: boolean }
        motivo: { type: string, nullable: true, enum: [FUENTE_NO_ADMITE_MANUAL, CELDA_NO_EN_ERROR, CELDA_BLOQUEADA_POR_RUNT, SIN_PERSONAS_EN_ERROR, null] }
        personas:
          type: array
          nullable: true
          description: Solo en fuentes de persona (null en las del vehículo); solo las personas en ERROR, por orden.
          items:
            $ref: "#/components/schemas/PersonaEnErrorManual"

    PersonaEnErrorManual:
      type: object
      required: [persona_id, orden, rol, tipo_documento, documento_enmascarado, declarado_por_cliente, consulta, tipo_error]
      properties:
        persona_id: { type: string, format: uuid, description: "Va en personas[].persona_id del PUT." }
        orden: { type: integer }
        rol: { type: string, enum: [PROPIETARIO, LOCATARIO] }
        tipo_documento: { type: string }
        documento_enmascarado: { type: string, example: "****0102" }
        declarado_por_cliente: { type: boolean }
        consulta: { type: string, enum: [RUNT_PERSONA, RUES, SIMIT], description: "Define el esquema del resultado de esa persona." }
        tipo_error: { type: string, nullable: true }

    LlenadoManualVehiculo:
      type: object
      description: Cuerpo para SIMIT_VEHICULO (resultado ResultadoManualSimit) y AVALUO (resultado ResultadoManualAvaluo).
      additionalProperties: false
      required: [version, resultado]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        resultado:
          oneOf:
            - $ref: "#/components/schemas/ResultadoManualSimit"
            - $ref: "#/components/schemas/ResultadoManualAvaluo"

    LlenadoManualPersonas:
      type: object
      description: Cuerpo para las fuentes de persona; todas las personas en ERROR de la celda y solo ellas, sin repetir.
      additionalProperties: false
      required: [version, personas]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        personas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [persona_id, resultado]
            properties:
              persona_id: { type: string, format: uuid }
              resultado:
                oneOf:
                  - $ref: "#/components/schemas/ResultadoManualRuntPersona"
                  - $ref: "#/components/schemas/ResultadoManualRues"
                  - $ref: "#/components/schemas/ResultadoManualSimit"

    ResultadoManualSimit:
      type: object
      description: >
        SIMIT (del vehículo o consulta SIMIT de una persona). `cantidad_comparendos`, si viene, debe ser igual al número de
        comparendos; sin él se calcula. Números de comparendo sin repetir.
      additionalProperties: false
      required: [comparendos]
      properties:
        semaforo: { type: string, nullable: true, enum: [VERDE, AMARILLO, ROJO, null] }
        cantidad_comparendos: { type: integer, minimum: 0 }
        comparendos:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [numero]
            properties:
              numero: { type: string, maxLength: 60 }
              fecha: { type: string, format: date, nullable: true }
              valor: { type: string, nullable: true, pattern: '^\d{1,15}(\.\d{1,2})?$', description: "Texto decimal en pesos.", example: "468500" }
              estado: { type: string, nullable: true, maxLength: 60 }
              organismo: { type: string, nullable: true, maxLength: 120 }

    ResultadoManualAvaluo:
      type: object
      description: >
        AVALUO. Con `sin_valor_comercial=false`, `valor_sugerido` (mayor que 0) y `fuente_principal` (una fuente enviada con
        estado OK) son obligatorios; con `true` no van y ninguna fuente puede estar en OK. `valor` solo (y obligatorio) en
        fuentes OK. Sin `fecha`: la pone el servidor (día de hoy en Colombia).
      additionalProperties: false
      required: [sin_valor_comercial, fuentes]
      properties:
        sin_valor_comercial: { type: boolean }
        valor_sugerido: { type: integer, format: int64, minimum: 1, nullable: true }
        fuente_principal: { type: string, nullable: true, enum: [fasecolda, mercado_libre, base_gravable, null] }
        fuentes:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [fuente, estado]
            properties:
              fuente: { type: string, enum: [fasecolda, mercado_libre, base_gravable] }
              estado: { type: string, enum: [OK, SIN_DATOS, ERROR] }
              valor: { type: integer, format: int64, minimum: 1, nullable: true }
              muestras: { type: integer, minimum: 1, nullable: true }

    ResultadoManualRuntPersona:
      type: object
      description: RUNT de una persona natural (consulta RUNT_PERSONA).
      additionalProperties: false
      required: [inscrito, licencias]
      properties:
        inscrito: { type: boolean }
        estado_conductor: { type: string, nullable: true, maxLength: 60 }
        licencias:
          type: array
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required: [categoria]
            properties:
              categoria: { type: string, maxLength: 10 }
              estado: { type: string, nullable: true, maxLength: 60 }
              vigente_hasta: { type: string, format: date, nullable: true }

    ResultadoManualRues:
      type: object
      description: RUES de una persona jurídica (consulta RUES).
      additionalProperties: false
      required: [encontrada]
      properties:
        encontrada: { type: boolean }
        estado_matricula: { type: string, nullable: true, maxLength: 60 }
        ultima_renovacion: { type: string, nullable: true, description: "AAAA-MM-DD o el año AAAA.", example: "2026-03-31" }

    LlenadoManualRespuesta:
      type: object
      required: [id, diagnostico_id, vehiculo_id, fuente, estado, origen, usuario_manual_id, dato_obtenido_en, version, estado_lote]
      properties:
        id: { type: string, format: uuid }
        diagnostico_id: { type: string, format: uuid }
        vehiculo_id: { type: string, format: uuid }
        fuente: { type: string }
        estado: { type: string, enum: [COMPLETADO] }
        origen: { type: string, enum: [MANUAL] }
        usuario_manual_id: { type: string, format: uuid }
        dato_obtenido_en: { type: string, format: date-time }
        version: { type: integer, format: int64, description: "Nueva versión del tablero (la de la celda)." }
        estado_lote: { type: string, enum: [CREADO, EN_PROCESO, COMPLETADO, INCOMPLETO] }

    SolicitudEvidencia:
      type: object
      description: Pedido de una evidencia en segundo plano (HU #13850). Hoy solo el ZIP de los PDF del lote.
      required: [tipo]
      properties:
        tipo:
          type: string
          enum: [ZIP]
    EstadoEvidencia:
      type: object
      description: >
        Estado del ZIP del lote (HU #13850). vehiculos_incluidos = vehículos con su PDF (los esperados mientras está en la cola, los
        del archivo cuando está LISTA); vehiculos_pendientes = los que quedan fuera por no haber terminado (van en el índice).
      required: [id, tipo, estado, vehiculos_incluidos, vehiculos_pendientes, creado_en, generado_en, tipo_error]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [ZIP]
        estado:
          type: string
          enum: [PENDIENTE, GENERANDO, LISTA, ERROR]
        vehiculos_incluidos:
          type: integer
          minimum: 0
        vehiculos_pendientes:
          type: integer
          minimum: 0
        creado_en:
          type: string
          format: date-time
          description: Instante del pedido.
        generado_en:
          type: string
          format: date-time
          nullable: true
          description: Instante en que quedó LISTA; null mientras no.
        tipo_error:
          type: string
          nullable: true
          enum: [ALMACEN_NO_DISPONIBLE, GENERACION_FALLIDA, GENERACION_INTERRUMPIDA, SIN_VEHICULOS_TERMINADOS, null]
          description: Solo con estado ERROR. Nunca la causa técnica de una fuente.
    ErrorRegla:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          example: SIN_EMPRESA
        error:
          type: string
        campo:
          type: string
          description: Campo del cuerpo que incumple la regla (solo en las reglas de un campo, HU #13750).
          example: alcance.por_vehiculo
