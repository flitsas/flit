      x-flit-etiquetas:
        periodo: Vigencia
        avaluo: Avalúo
        impuesto: Impuesto
        sancion: Sanción
        intereses: Intereses
        descuentos: Descuentos
        pagosPrevios: Pagos previos
        totalAPagar: Total a pagar
        otrosCargos: Otros cargos
        vencimiento: Vencimiento
        referenciaPago: Referencia de pago
        noLiquidable: El portal no permite liquidar esta vigencia

    Recibo:
      type: object
      required: [id, tipo, periodos, estado, motivo]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: "#/components/schemas/TipoRecibo" }
        periodos: { type: array, items: { type: string } }
        estado: { $ref: "#/components/schemas/EstadoRecibo" }
        motivo: { $ref: "#/components/schemas/MotivoRecibo" }
