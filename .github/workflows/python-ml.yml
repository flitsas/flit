name: Python ML

on:
  push:
    branches: [develop, main]
    paths: ['services/python-ml/**', 'contracts/openapi/python-ml.v1.yaml']
  pull_request:
    branches: [develop]
    paths: ['services/python-ml/**', 'contracts/openapi/python-ml.v1.yaml']
  workflow_dispatch:
    inputs:
      runner:
        description: 'Etiqueta de runner para validar (p. ej. flit-ci); vacío = vars.RUNNER o ubuntu-latest'
        required: false
        default: ''

# runs-on: la variable de repo RUNNER (p. ej. flit-ci = runners propios de la 177) mueve estos jobs fuera de GitHub;
# sin ella siguen en ubuntu-latest. El input `runner` del workflow_dispatch sirve para validar sin tocar la variable.
jobs:
  lint-test:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.x'
          enable-cache: true
          cache-dependency-glob: 'services/python-ml/pyproject.toml'

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Sync deps
        working-directory: services/python-ml
        run: uv sync --extra dev

      - name: Ruff (lint + format)
        working-directory: services/python-ml
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        working-directory: services/python-ml
        run: uv run mypy app

      - name: pytest with coverage
        working-directory: services/python-ml
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ml-coverage
          path: services/python-ml/coverage.xml
