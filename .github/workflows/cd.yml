          cache-to: type=gha,mode=max,scope=python-ml

  build-core-ict:
    name: Build & push core-ict (.NET) image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # HU #13329: digest de la imagen que queda vigente (reutilizada o recién construida). El despliegue por servicio
    # despliega tag@digest, así compose solo recrea los contenedores cuya imagen cambió de verdad.
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # reuse-image compara contra el commit de la imagen vigente

      - name: Pre-pull BuildKit (reintentos ante timeouts de Docker Hub)
        run: |
          for i in 1 2 3 4 5; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            echo "Intento $i fallo; reintentando en 15s..."
            sleep 15
          done
          echo "No se pudo descargar moby/buildkit tras 5 intentos"; exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HU #13329 (Epic #13316): si nada de lo que compila la imagen cambió, se reetiqueta la vigente en vez de
      # reconstruirla (acción .github/actions/reuse-image, la misma lógica que nació aquí en la HU #13234).
      - name: Reuse previous image when unchanged
        id: reuse
        uses: ./.github/actions/reuse-image
        with:
          image: ${{ env.CORE_ICT_IMAGE }}
          tag: ${{ needs.setup.outputs.image_tag }}
          paths: |
            services/core-ict

      - name: Extract metadata — core-ict
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CORE_ICT_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ needs.setup.outputs.image_tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}

      - name: Build and push core-ict
        id: build
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/core-ict
          file: ./services/core-ict/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core-ict
          cache-to: type=gha,mode=max,scope=core-ict

  deploy-to-vps:
    name: Deploy to VPS (${{ needs.setup.outputs.env_name }})
    needs: [setup, build-core-api, build-core-identity, build-core-ict, build-frontend, build-frontend-hub, build-python-ml]
    # HU #13329: corre aunque falle el build de algún servicio. En despliegue por servicio (FLIT_DEPLOY_ROLLING) se
    # despliegan los demás y el que falló conserva su versión; sin él, se detiene sin tocar nada, como antes.
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    # Incluye margen para reintentos SCP + pausa UFW (hasta ~4×45s + 120s dial).
    timeout-minutes: 15
    # GitHub Environment por ambiente: cada uno (dev/qa/pdn) tiene SUS PROPIOS secrets
    # (HOSTINGER_SSH_*, HOSTINGER_DEPLOY_PATH, GHCR_PAT). Asi un mismo workflow despliega
    # al VPS correcto segun la rama.
    environment:
      name: ${{ needs.setup.outputs.gh_env }}
      url: https://${{ needs.setup.outputs.front_domain }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SCP nativo (OpenSSH) + reintentos en shell.
      # Historial: wretry + appleboy/scp-action (Docker) falló por (1) PEM multilínea
      # dentro del YAML anidado, (2) key_path fuera del mount del contenedor, (3)
      # timeouts SSH. El último CD verde usaba `key:` como input nativo; aquí
      # replicamos ese modelo sin Docker y con espera > ventana UFW `limit ssh`.
      - name: Copy compose file to VPS
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          KEY_FILE="${RUNNER_TEMP}/hostinger_deploy_key"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          cleanup() { rm -f "$KEY_FILE"; }
          trap cleanup EXIT

          SSH_OPTS=(
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -i "$KEY_FILE"
            -P 22
          )

          for i in 1 2 3 4; do
            echo "SCP attempt ${i}/4 → ${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
            if scp "${SSH_OPTS[@]}" \
                docker-compose.prod.yml \
                "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"; then
              echo "SCP OK"
              exit 0
            fi
            echo "SCP attempt ${i} failed (posible UFW limit ssh). Esperando 45s..."
            sleep 45
          done
          echo "::error::SCP falló tras 4 intentos hacia ${SSH_HOST}"
          exit 1

      # Pausa breve para no encadenar el SSH de deploy dentro de la ventana UFW.
      - name: Wait before SSH deploy (UFW rate limit)
        run: sleep 35

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          timeout: 120s
          script: |
            set -eo pipefail
            DEPLOY_PATH="${{ secrets.HOSTINGER_DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            if [ ! -f docker-compose.prod.yml ]; then
              echo "::error::docker-compose.prod.yml no encontrado en $DEPLOY_PATH"
              ls -la "$DEPLOY_PATH" || true
              exit 1
            fi

            # Carpeta de intercambio del migrador V1->V2 (perfil `migracion`): por aqui
            # entran los archivos de ids y salen los reportes. Se crea aqui, con el
            # usuario del deploy, y no se deja que la cree Docker al montar el bind:
            # Docker la crearia como root y quien entre por SSH no podria escribir
            # dentro, con un "permission denied" que no dice de donde viene.
            mkdir -p migracion

            # Tag + puertos segun ambiente (override del .env del VPS).
            # deploy_tag: sha-<commit> inmutable en PDN; tag movil (dev/qa) en DEV/QA.
            export CORE_API_TAG=${{ needs.setup.outputs.deploy_tag }}
            export CORE_IDENTITY_TAG=${{ needs.setup.outputs.deploy_tag }}
            export CORE_ICT_TAG=${{ needs.setup.outputs.deploy_tag }}
            export FRONTEND_TAG=${{ needs.setup.outputs.deploy_tag }}
            export FRONTEND_HUB_TAG=${{ needs.setup.outputs.deploy_tag }}
            export PYTHON_ML_TAG=${{ needs.setup.outputs.deploy_tag }}
            export FRONTEND_PORT=${{ needs.setup.outputs.front_port }}
            export GATEWAY_PORT=${{ needs.setup.outputs.gateway_port }}
            export CORE_API_PORT=${{ needs.setup.outputs.core_port }}
            export PYTHON_ML_PORT=${{ needs.setup.outputs.python_port }}
            export MIGRACION_API_PORT=${{ needs.setup.outputs.migracion_port }}
            export HUB_PORT=${{ needs.setup.outputs.hub_port }}
            # HU #13226 (Epic #13217): core-identity (perfil "identity"); sin el perfil no se levanta.
            export CORE_IDENTITY_PORT=${{ needs.setup.outputs.identity_port }}
            # FLIT Suite: hosts de los productos en este ambiente (Suite:Hosts:Environment de core-api).
            export FLIT_SUITE_ENV=${{ needs.setup.outputs.suite_env }}
            # URL pública del hub (emisor OIDC) para @flit/auth.
            export FLIT_HUB_URL=https://${{ needs.setup.outputs.front_domain }}
            # Host propio de Trámites en la suite (A-11); el hub redirige ahí cuando FLIT_TRAMITES_HOST_ENABLED=true.
            export FLIT_TRAMITES_URL=https://${{ needs.setup.outputs.tramites_domain }}
            # Marca Blanca (#12421): CIDR de la red Docker de ESTE stack (distinto por ambiente).
            export FLIT_INTERNAL_SUBNET=${{ needs.setup.outputs.internal_subnet }}

            # Feature #13220 (Epic #13217): despliegue por servicio, detrás de la variable FLIT_DEPLOY_ROLLING del
            # GitHub Environment. Sin ella (hoy) se hace como siempre: down de todo el stack y up.
            # Con "true": sin down global; core-api primero (migra), luego el resto y core-identity al final, así el
            # login nunca se cae junto con core-api (ver docs/suite/identidad-frontera.md §9).
            ROLLING="${{ vars.FLIT_DEPLOY_ROLLING }}"

            # HU #13329 (Epic #13316): resultado y digest del build de cada imagen (sin arreglos asociativos, para
            # que el script corra igual en cualquier bash).
            IMAGE_TAG="${{ needs.setup.outputs.image_tag }}"
            SERVICES="core-api core-identity core-ict frontend frontend-hub python-ml"
            build_result() {
              case "$1" in
                core-api) echo "${{ needs.build-core-api.result }}" ;;
                core-identity) echo "${{ needs.build-core-identity.result }}" ;;
                core-ict) echo "${{ needs.build-core-ict.result }}" ;;
                frontend) echo "${{ needs.build-frontend.result }}" ;;
                frontend-hub) echo "${{ needs.build-frontend-hub.result }}" ;;
                python-ml) echo "${{ needs.build-python-ml.result }}" ;;
              esac
            }
            build_digest() {
              case "$1" in
                core-api) echo "${{ needs.build-core-api.outputs.digest }}" ;;
                core-identity) echo "${{ needs.build-core-identity.outputs.digest }}" ;;
                core-ict) echo "${{ needs.build-core-ict.outputs.digest }}" ;;
                frontend) echo "${{ needs.build-frontend.outputs.digest }}" ;;
                frontend-hub) echo "${{ needs.build-frontend-hub.outputs.digest }}" ;;
                python-ml) echo "${{ needs.build-python-ml.outputs.digest }}" ;;
              esac
            }
            tag_var() {
              case "$1" in
                core-api) echo CORE_API_TAG ;; core-identity) echo CORE_IDENTITY_TAG ;; core-ict) echo CORE_ICT_TAG ;;
                frontend) echo FRONTEND_TAG ;; frontend-hub) echo FRONTEND_HUB_TAG ;; python-ml) echo PYTHON_ML_TAG ;;
              esac
            }
            FAILED_BUILDS=""
            for svc in $SERVICES; do
              [ "$(build_result "$svc")" = "success" ] || FAILED_BUILDS="$FAILED_BUILDS $svc"
            done
            if [ -n "$FAILED_BUILDS" ] && [ "$ROLLING" != "true" ]; then
              echo "::error::Fallaron builds:$FAILED_BUILDS. Sin despliegue por servicio no se despliega nada."
              exit 1
            fi
            if [ "$ROLLING" = "true" ]; then
              # Cada imagen se despliega como <tag>@<digest>. Si la imagen no cambió, el digest es el mismo que corre y
              # compose no recrea el contenedor (antes, en PDN, la etiqueta sha-<commit> lo recreaba siempre). Si su
              # build falló, se despliega la referencia que ya corre: el contenedor queda como estaba.
              current_ref() {
                c=$(docker compose -f docker-compose.prod.yml ps -q "$1" 2>/dev/null | head -n1)
                [ -n "$c" ] || return 1
                img=$(docker inspect -f '{{.Config.Image}}' "$c") || return 1
                echo "${img#*:}"
              }
              for svc in $SERVICES; do
                var=$(tag_var "$svc")
                digest=$(build_digest "$svc")
                if [ "$(build_result "$svc")" = "success" ] && [ -n "$digest" ]; then
                  export "$var=${IMAGE_TAG}@${digest}"
                elif ref=$(current_ref "$svc"); then
                  export "$var=$ref"
                  echo "::warning::$svc: su build falló o no dio digest; se deja la versión que corre ($ref)"
                else
                  echo "::warning::$svc: su build falló y no está corriendo; se usa ${!var}"
                fi
                echo "$svc -> ${!var}"
              done
            fi

            if [ "$ROLLING" != "true" ]; then
              # Recrear la red del proyecto si el compose ahora fija IPAM (evita quedar
              # con un bridge viejo sin subnet / conflicto al "Creating" de nuevo).
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
            fi

            # GHCR login: el usuario DEBE ser el dueño del PAT (GHCR_USERNAME), NO github.actor.
            # Si el merge lo hace otro usuario, login con github.actor falla en ~10s (exit 1).
            GHCR_USER="${{ secrets.GHCR_USERNAME }}"
            if [ -z "$GHCR_USER" ]; then
              GHCR_USER="${{ vars.GHCR_USERNAME }}"
            fi
            if [ -z "$GHCR_USER" ]; then
              # Fallback histórico: PAT del equipo asociado a deploys exitosos previos.
              GHCR_USER="jormancopeteflit"
              echo "::warning::GHCR_USERNAME no configurado; usando fallback $GHCR_USER. Configura secret GHCR_USERNAME en el repo."
            fi
            if ! echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              echo "::error::docker login ghcr.io falló para usuario $GHCR_USER"
              exit 1
            fi

            # Pull latest images and restart services
            docker compose -f docker-compose.prod.yml pull
            if [ "$ROLLING" != "true" ]; then
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            else
              wait_healthy() {
                for i in $(seq 1 30); do
                  state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.prod.yml ps -q "$1")" 2>/dev/null || echo missing)
                  [ "$state" = "healthy" ] && return 0
                  sleep 5
                done
                echo "::error::$1 no quedó healthy"; docker compose -f docker-compose.prod.yml logs --tail=100 "$1"; return 1
              }
              docker compose -f docker-compose.prod.yml up -d --no-deps core-api
              wait_healthy core-api
              others=$(docker compose -f docker-compose.prod.yml config --services | grep -vx -e core-api -e core-identity | tr '\n' ' ')
              docker compose -f docker-compose.prod.yml up -d --remove-orphans $others
              if docker compose -f docker-compose.prod.yml config --services | grep -qx core-identity; then
                docker compose -f docker-compose.prod.yml up -d --no-deps core-identity
                wait_healthy core-identity
              fi
            fi

            # Remove dangling images to free space
            docker image prune -f

            # Health check: hit the container directly (bypass host nginx)
            echo "Waiting for application to start..."
            sleep 15
            ok=0
            for i in 1 2 3 4 5 6; do
              # Front + API publica del gateway (puertos del ambiente) deben responder.
              if curl -fsS http://127.0.0.1:${{ needs.setup.outputs.front_port }}/ > /dev/null \
                 && curl -fsS http://127.0.0.1:${{ needs.setup.outputs.gateway_port }}/health > /dev/null; then
                echo "Health check OK (attempt $i)"
                ok=1
                break
              fi
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Health check FAILED"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=100
              exit 1
            fi
            # HU #13226: si core-identity corre (perfil "identity"), también tiene que estar listo.
            if [ -n "$(docker compose -f docker-compose.prod.yml ps -q core-identity 2>/dev/null)" ]; then
              if ! curl -fsS http://127.0.0.1:${{ needs.setup.outputs.identity_port }}/health/ready > /dev/null; then
                echo "::error::core-identity no está listo (/health/ready)"
                docker compose -f docker-compose.prod.yml logs --tail=100 core-identity
                exit 1
              fi
              echo "core-identity listo."
            fi
            if [ -n "$FAILED_BUILDS" ]; then
              echo "::error::Despliegue parcial: fallaron los builds de$FAILED_BUILDS; esos servicios conservan su versión anterior."
              exit 1
            fi
            echo "Deploy OK."

      - name: Notify success
        if: success()
        run: echo "Deploy a ${{ needs.setup.outputs.env_name }} (https://${{ needs.setup.outputs.front_domain }}) exitoso."

      - name: Notify failure
        if: failure()
        run: |
          echo "Deploy a ${{ needs.setup.outputs.env_name }} FALLIDO. Revisa los logs arriba."
          echo "Rollback manual: ssh al VPS y ejecuta:"
          echo "  cd <deploy-path> && docker compose down && docker compose up -d"
