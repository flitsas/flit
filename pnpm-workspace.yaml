packages:
  - 'frontend'

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  '@biomejs/biome': true

# ESTE es el sitio de los overrides. pnpm 11 ya NO lee el campo `pnpm` de package.json, así que
# escribirlos allí no hace nada y solo avisa por consola. Si un override no surte efecto, mirar aquí.
#
# next@16.2.x pinnea sharp ^0.34.5 (CVE libvips). Forzar parche hasta que Next actualice.
# next@16.2.x pinnea postcss 8.4.31 (GHSA-6g55-p6wh-862q). Forzar >=8.5.12.
# postcss pide nanoid ^3.3.16 y resuelve a 3.3.16 (GHSA-2v37-7h3g-55p8). Forzar >=3.3.17.
overrides:
  sharp: 0.35.3
  postcss: 8.5.22
  nanoid: 3.3.17
