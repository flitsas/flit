name: arquitectura

# Modelos LikeC4 de FLIT (Atlas HU 6.2, plan 01 §10.1). Valida en cada PR que los toque; en push a develop o release
# puede además publicar en Atlas con el token OIDC de GitHub Actions, sin secretos.
#
# La publicación necesita dos variables: ATLAS_URL y ATLAS_PUBLICAR_ARQUITECTURA='true'. ATLAS_URL ya existe como variable
# de organización (la usa atlas-publicar-contratos.yml), así que por sí sola no apaga nada; la segunda se enciende cuando
# Atlas tenga el endpoint de arquitectura y la lista blanca de este workflow. [por verificar: la ruta del POST sale del
# plan 01 §10.2 y Atlas aún no la expone].

on:
  pull_request:
    paths:
      - 'arquitectura/**'
      - 'docs/arquitectura/**'
      - 'contracts/**'
      - '.github/workflows/arquitectura.yml'
  push:
    branches: [develop, release]
    paths:
      - 'arquitectura/**'
      - 'docs/arquitectura/**'
      - 'contracts/**'
      - '.github/workflows/arquitectura.yml'

permissions: {}

concurrency:
  group: arquitectura-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LIKEC4_VERSION: '1.59.4'

jobs:
  validar:
    name: validar modelos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Se instala fuera del repo para que no lo afecten su package.json ni su .npmrc.
      - name: Instalar LikeC4
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix likec4 --ignore-scripts --no-audit --no-fund "likec4@${LIKEC4_VERSION}"
          echo "$PWD/likec4/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validar landscape
        run: likec4 validate arquitectura/landscape

      - name: Validar FLIT 2.0
        run: likec4 validate docs/arquitectura

      - name: Exportar JSON
        run: |
          mkdir -p out
          likec4 export json --project landscape -o out/landscape.json arquitectura/landscape
          likec4 export json --project flit -o out/flit.json docs/arquitectura

      - name: Validar metadatos y revisión de repo público
        run: node docs/arquitectura/tools/validar-metadata.mjs out/flit.json arquitectura/landscape docs/arquitectura

      - uses: actions/upload-artifact@v4
        with:
          name: arquitectura
          path: out/
          retention-days: 14

  publicar:
    name: publicar en Atlas
    needs: validar
    if: github.event_name == 'push' && vars.ATLAS_URL != '' && vars.ATLAS_PUBLICAR_ARQUITECTURA == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arquitectura
          path: out

      - name: Publicar los modelos
        env:
          ATLAS_URL: ${{ vars.ATLAS_URL }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_URL}" | jq -r .value)
          echo "::add-mask::${token}"
          for proyecto in landscape flit; do
            jq -n --arg proyecto "$proyecto" --arg rama "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" --arg version "$LIKEC4_VERSION" \
              --slurpfile modelo "out/${proyecto}.json" \
              '{proyecto: $proyecto, tipo: "modelo", rama: $rama, commitSha: $sha, herramienta: {nombre: "likec4", version: $version}, modelo: $modelo[0]}' \
              > "out/cuerpo-${proyecto}.json"
            curl -fsS --retry 3 --max-time 60 -X POST "${ATLAS_URL%/}/api/v1/atlas/publicaciones/arquitectura" \
              -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
              --data-binary "@out/cuerpo-${proyecto}.json"
          done
