            total: { type: integer }
            individuales: { type: integer }
            masivas: { type: integer }
            lotesEnProceso: { type: integer }
          x-flit-etiquetas:
            total: Liquidaciones
            individuales: Individuales
            masivas: Masivas
            lotesEnProceso: Lotes en proceso
        resultados:
          type: object
          required: [exitosas, conError, pendientesWebhook, pendientesConsulta, datosIncompletos, departamentoNoHabilitado, inciertas, sinResultado]
          properties:
            exitosas: { type: integer }
            conError: { type: integer }
            pendientesWebhook: { type: integer }
            pendientesConsulta: { type: integer }
            datosIncompletos: { type: integer }
            departamentoNoHabilitado: { type: integer }
            inciertas: { type: integer }
            sinResultado: { type: integer }
          x-flit-etiquetas:
            exitosas: Exitosas
            conError: Con error
            pendientesWebhook: Pendientes de webhook
            pendientesConsulta: Pendientes por consulta
            datosIncompletos: Datos incompletos
            departamentoNoHabilitado: Departamento no habilitado
            inciertas: Inciertas
            sinResultado: Sin resultado
        deuda:
          type: object
          required: [placasConDeuda, placasAlDia]
          properties:
            placasConDeuda: { type: integer }
            placasAlDia: { type: integer }
          x-flit-etiquetas:
            placasConDeuda: Placas con deuda
            placasAlDia: Placas al día
        montoTotal:
          type: number
          nullable: true
          description: >
            Suma de totalAPagar sin los null. Etiqueta «Monto total liquidado». null (1.1.0) cuando ninguna liquidación
            del rango trae monto: se muestra x-flit-literales.pantalla.montoSinDato, nunca 0.
        liquidacionesSinMonto: { type: integer, description: "Con N > 0 se muestra x-flit-literales.pantalla.liquidacionesSinMonto y la marca Parcial." }
        parcial: { type: boolean }
        serie:
          type: array
          items:
            type: object
            required: [fecha, total]
            properties:
              fecha: { type: string, format: date }
              total: { type: integer }
              individuales: { type: integer, description: "Liquidaciones INDIVIDUAL del día (1.1.0). total = individuales + masivas." }
              masivas: { type: integer, description: "Placas de lotes MASIVA del día (1.1.0)." }
            x-flit-etiquetas:
              individuales: Individuales
              masivas: Masivas
        porDepartamento:
          type: array
          items:
            type: object
            required: [codigo, nombre, total]
            properties:
              codigo: { type: string }
              nombre: { type: string }
              total: { type: integer }
              monto: { type: number, nullable: true, description: "Suma de totalAPagar del departamento sin los null; null = «Sin dato» (1.1.0)." }
            x-flit-etiquetas:
              total: Liquidaciones
              monto: Monto liquidado
        ultimosLotes:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ResumenLiquidacion" }
        ranking:
          type: array
          nullable: true
          description: Solo Super Admin en la vista global; null en los demás.
          items:
            type: object
            required: [empresa, total]
            properties:
              empresa: { $ref: "#/components/schemas/Referencia" }
              total: { type: integer }

