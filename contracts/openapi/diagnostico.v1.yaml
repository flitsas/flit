          description: Página de usuarios con lo que el actor puede hacer en cada fila.
          content: { application/json: { schema: { $ref: "#/components/schemas/ListaUsuariosDiagnostico" } } }
        "400":
          description: FILTRO_INVALIDO, PAGINACION_INVALIDA o EMPRESA_NO_PERMITIDA.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProhibidoUsuarios"
        "503":
          $ref: "#/components/responses/PlataformaUsuariosNoDisponible"

  /api/v1/diagnostico/usuarios/invitaciones:
    post:
      tags: [Usuarios]
      operationId: invitarUsuarioDiagnostico
      summary: Invitar a una persona a Diagnóstico o darle el acceso
      description: >
        HU #14587 (SP-10, SP-11, SP-15, SP-16). Solo el código de rol (lista blanca); un rol_id u otro campo se ignora. Un
        admin_diagnostico solo da usuario_diagnostico (403 ROL_NO_ASIGNABLE). Respuesta 202 uniforme en todos los casos (correo nuevo,
        miembro sin rol de Diagnóstico, ya con rol, invitación pendiente o correo de otra compañía): la causa solo va a la auditoría de
        core-api y nunca se mueve a un usuario de compañía. El correo no se escribe en los logs. Límite diagnostico-invitaciones
        (20/h por actor, 100/h por compañía).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InvitacionUsuarioDiagnostico" } } }
      responses:
        "202":
          description: Aceptada (cuerpo uniforme).
          content: { application/json: { schema: { $ref: "#/components/schemas/InvitacionAceptada" } } }
        "400":
          description: CORREO_INVALIDO (campo correo), NOMBRE_REQUERIDO (campo nombre) o EMPRESA_NO_PERMITIDA.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProhibidoUsuarios"
        "413":
          $ref: "#/components/responses/CuerpoMuyGrande"
        "422":
          description: ROL_NO_PERMITIDO (campo rol), fuera de la lista blanca.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "429":
          description: DEMASIADAS_SOLICITUDES (20/h por actor, 100/h por compañía).
          headers:
            Retry-After: { schema: { type: integer }, description: Segundos para reintentar. }
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "503":
          $ref: "#/components/responses/PlataformaUsuariosNoDisponible"

  /api/v1/diagnostico/usuarios/{usuario}/rol:
    parameters:
      - $ref: "#/components/parameters/UsuarioDiagnosticoId"
    put:
      tags: [Usuarios]
      operationId: cambiarRolUsuarioDiagnostico
      summary: Cambiar el rol de Diagnóstico de un usuario
      description: >
        HU #14587 (SP-9 = a). Solo toca la asignación del producto diagnostico; los roles de otros productos se conservan. Idempotente.
        Solo el SuperAdmin da o quita admin_diagnostico (SP-11 = a).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CambioRolDiagnostico" } } }
      responses:
        "200":
          description: La fila actualizada, con las acciones recalculadas.
          content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioDiagnostico" } } }
        "400":
          description: ACCION_SOBRE_SI_MISMO o EMPRESA_NO_PERMITIDA.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProhibidoAccionUsuario"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "409":
          description: USUARIO_SUSPENDIDO, INVITACION_PENDIENTE o ULTIMO_ADMINISTRADOR.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "422":
          description: ROL_NO_PERMITIDO (campo rol).
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "503":
          $ref: "#/components/responses/PlataformaUsuariosNoDisponible"

  /api/v1/diagnostico/usuarios/{usuario}/suspension:
    parameters:
      - $ref: "#/components/parameters/UsuarioDiagnosticoId"
    post:
      tags: [Usuarios]
      operationId: suspenderUsuarioDiagnostico
      summary: Suspender a un usuario en Diagnóstico
      description: >
        HU #14587 (SP-12 = a). Cierra solo la asignación del rol de Diagnóstico y guarda la marca de suspensión del producto; la cuenta y
        los demás productos no cambian. Idempotente.
      responses:
        "200":
          description: La fila con estado SUSPENDIDO.
          content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioDiagnostico" } } }
        "400":
          description: ACCION_SOBRE_SI_MISMO o EMPRESA_NO_PERMITIDA.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProhibidoAccionUsuario"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "409":
          description: ULTIMO_ADMINISTRADOR o INVITACION_PENDIENTE.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "503":
          $ref: "#/components/responses/PlataformaUsuariosNoDisponible"
    delete:
      tags: [Usuarios]
      operationId: reactivarUsuarioDiagnostico
      summary: Reactivar a un usuario en Diagnóstico
      description: >
        HU #14587. Recrea la asignación con el rol que tenía al suspenderse y borra la marca. Idempotente. Si la cuenta está inactiva en la
        plataforma, la fila sale ACTIVO con motivo_sin_acciones CUENTA_INACTIVA.
      responses:
        "200":
          description: La fila con estado ACTIVO.
          content: { application/json: { schema: { $ref: "#/components/schemas/UsuarioDiagnostico" } } }
        "400":
          description: ACCION_SOBRE_SI_MISMO o EMPRESA_NO_PERMITIDA.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ProhibidoAccionUsuario"
        "404":
          $ref: "#/components/responses/UsuarioNoEncontrado"
        "409":
          description: ROL_YA_VIGENTE (el hub le dio otro rol de Diagnóstico; la marca se borra) o INVITACION_PENDIENTE.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorRegla" } } }
        "503":
          $ref: "#/components/responses/PlataformaUsuariosNoDisponible"

