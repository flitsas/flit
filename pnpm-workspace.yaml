packages:
  - 'frontend'

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  '@biomejs/biome': true

# ESTE es el sitio de los overrides. pnpm 11 ya NO lee el campo `pnpm` de package.json, así que
# escribirlos allí no hace nada y solo avisa por consola. Si un override no surte efecto, mirar aquí.
#
# sharp: next@16.3.4 ya pide ^0.35.4, pero el pin explícito se mantiene porque `node-linker=hoisted`
#   deja una sola copia de sharp para todo el workspace. 0.35.4 es la versión parcheada de
#   GHSA-rgj7-g3m4-5g8c (libheif: GHSA-g89c-p67h-r497 y GHSA-2jg2-4ch7-h545); 0.35.3 se reportaba con
#   severidad alta y era una de las tres que rompían `dependency-audit` el 2026-09-09.
# postcss: next@16.3.4 ya pinnea 8.5.23, así que este override quedó redundante y se conserva solo como
#   piso explícito. Histórico: next@16.2.x pinneaba 8.4.31 (GHSA-6g55-p6wh-862q) y la corrección de la
#   serie 8.5.x era incompleta —exige >=8.5.23—, así que 8.5.22 seguía reportando el aviso moderado.
# postcss pide nanoid ^3.3.16 y resuelve a 3.3.16 (GHSA-2v37-7h3g-55p8, severidad alta). El aviso se
#   actualizó: la versión PARCHEADA es >=3.3.18 (3.3.17 SIGUE reportándose como vulnerable con el umbral
#   `high` del workflow, que era lo que rompía `dependency-audit`). Se sube a 3.3.18. postcss pide
#   ^3.3.16, así que 3.3.18 es compatible; verificar con build de producción del frontend.
# next → styled-jsx → @babel/core → browserslist <=4.28.6 (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g).
#   Parche >=4.28.7. Es transitiva; se fuerza aquí para que `dependency-audit --audit-level high` pase.
overrides:
  sharp: 0.35.4
  postcss: 8.5.23
  nanoid: 3.3.18
  browserslist: 4.28.7
