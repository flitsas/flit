name: Reusar imagen sin cambios
description: >-
  HU #13329 (Epic #13316). Si nada de lo que compila la imagen cambió desde la imagen vigente del ambiente, la
  reetiqueta con este commit en vez de reconstruirla. Es la lógica que nació en el build de core-api (Epic #13217,
  HU #13234), llevada a una acción para que todos los servicios la usen igual. La comparación es contra el commit con
  que se construyó la imagen vigente (etiqueta org.opencontainers.image.revision), no contra otra rama: si un build
  anterior falló, sus cambios siguen pendientes y se construye. Sin etiqueta, sin historial o en un despliegue manual,
  se construye. Requiere checkout con fetch-depth 0 y sesión iniciada en el registro.

inputs:
  image:
    description: Imagen sin etiqueta (por ejemplo ghcr.io/flitsas/flitdev/core-api).
    required: true
  tag:
    description: Etiqueta móvil del ambiente (dev, qa o pdn).
    required: true
  paths:
    description: Rutas (una por línea) que compila la imagen. Si ninguna cambió, se reutiliza.
    required: true

outputs:
  reused:
    description: '"true" si se reutilizó la imagen vigente; "false" si hay que construir.'
    value: ${{ steps.reuse.outputs.reused }}
  digest:
    description: Digest de la imagen reutilizada (vacío si hay que construir).
    value: ${{ steps.reuse.outputs.digest }}

runs:
  using: composite
  steps:
    - id: reuse
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        PATHS: ${{ inputs.paths }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        src="${IMAGE}:${TAG}"
        paths=()
        while IFS= read -r line; do
          line="${line%%#*}"
          line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          [ -n "$line" ] && paths+=("$line")
        done <<< "$PATHS"
        if [ "${#paths[@]}" -eq 0 ]; then
          echo "::error::reuse-image: no se indicaron rutas para ${IMAGE}"
          exit 1
        fi
        rev=$(docker buildx imagetools inspect "$src" --format '{{ json .Image }}' 2>/dev/null \
          | jq -r 'if has("config") then .config.Labels["org.opencontainers.image.revision"] // empty else ([to_entries[] | select(.key != "unknown/unknown")][0].value.config.Labels["org.opencontainers.image.revision"] // empty) end' || true)
        if [ "$EVENT_NAME" = "push" ] && [ -n "$rev" ] && git cat-file -e "$rev^{commit}" 2>/dev/null \
           && git diff --quiet "$rev" "$GITHUB_SHA" -- "${paths[@]}"; then
          tags=(-t "${IMAGE}:sha-${GITHUB_SHA}")
          if [ "$REF_NAME" = "release" ]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$src"
          digest=$(docker buildx imagetools inspect "$src" --format '{{ json .Manifest }}' | jq -r '.digest')
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}: sin cambios desde $rev; se reutiliza $src (${digest})"
        else
          echo "reused=false" >> "$GITHUB_OUTPUT"
          echo "digest=" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}: se construye (cambios desde '${rev:-sin etiqueta}' o despliegue manual)"
        fi
