openapi: 3.0.3
info:
  title: FLIT Core API
  version: "1.0.0"
  description: >
    Contrato público de FLIT Core API (services/core-api). Cubre el carril de
    Seguridad/Autenticación (HU #10168 — login email/contraseña y emisión JWT 12h)
    y el módulo Administrador de Compañías (HU #10189 — index paginado y
    seguridad SuperAdmin).

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4002
    description: Local (Gateway)

tags:
  - name: Auth
    description: Autenticación y sesión (login, perfil del usuario).
  - name: Security · Invitaciones
    description: >
      Reenvío de invitaciones pendientes (rol SuperAdmin cualquier tenant, o
      AdminCompany/ot_admin solo su propio tenant).
  - name: Admin · Compañías
    description: Gestión multi-tenant de compañías B2B (rol SuperAdmin).
  - name: Admin · Tenants OT
    description: >
      Alta y listado de tenants Organismo de Tránsito (rol SuperAdmin, refactor
      adminOT). El self-service de usuarios OT vive bajo el tag Admin · OT.
  - name: Admin · OT
    description: >
      Perfil OT, módulo operativo y self-service de usuarios del tenant OT (rol
      SuperAdmin u ot_admin).
  - name: Admin · Documentos
    description: Catálogo maestro de tipos de documento por trámite (rol SuperAdmin).
  - name: Admin · Documentos por Trámite
    description: Asociación de tipos de documento a tipos de trámite (rol SuperAdmin).
  - name: Admin · Órdenes documentales
    description: >
      Overrides de orden documental por OT/Cliente y matriz documental resuelta
      con precedencia Cliente > OT > Default (rol SuperAdmin).
  - name: Admin · Improntas
    description: >
      Historial del Certificado de Improntas Digitales vehicular (Res. 17145/2023
      Mintransporte, integración Kyverum RUNT — ADR-0022). Vista global cross-tenant
      sin RLS, rol SuperAdmin.
  - name: Trámites · Documentos
    description: >
      Alta de trámite con snapshot documental inmutable y lectura de los documentos
      requeridos congelados al crear el trámite (cualquier JWT válido).
  - name: Trámites · Traspaso
    description: Radicación de traspasos vehiculares.
  - name: Admin · Improntas
    description: >
      Generación del Certificado de Improntas Digitales vehicular (Res. 17145/2023
      Mintransporte) vía Kyverum RUNT, con persistencia de trazabilidad (rol SuperAdmin).
  - name: Admin · LOG QX
    description: >
      Trazabilidad de punta a punta de la integración Quipux (HU #10793): búsqueda de
      radicaciones por placa/trámite/radicado y línea de tiempo de eventos con detalle
      técnico sanitizado y enmascarado. Solo lectura; permiso logqx.read (HU #10794,
      SuperAdmin bypassa).

paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      security: []          # endpoint público: no requiere JWT (satisface la regla security-defined)
      summary: Login con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: >
            Cuenta bloqueada temporalmente (código `ACCOUNT_TEMPORARILY_BLOCKED`, HU #10170 AC2)
            o todos los roles asignados al usuario están inactivos (código `ALL_ROLES_INACTIVE`,
            HU #10507 AC2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/me:
    get:
      operationId: authGetCurrentUser
      tags: [Auth]
      summary: Perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: No autenticado o sesión expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [Auth]
      summary: Solicitar recuperación de contraseña (HU #10169, RF19)
      security: []
      description: >
        Genera un token de un solo uso y envía un correo con el enlace de
        restablecimiento. Responde siempre 202 con un mensaje genérico, sin
        revelar si el email está registrado (anti-enumeración, AC2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Solicitud aceptada (respuesta genérica).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [Auth]
      summary: Restablecer contraseña con token de recuperación (HU #10169)
      security: []
      description: >
        Valida el token vigente y fija la nueva contraseña. El token se invalida
        tras su uso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token inválido/expirado o contraseña débil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
  /api/v1/security/invitations/{invitationId}/resend:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Security · Invitaciones]
      operationId: securityResendInvitation
      summary: Reenvía una invitación pendiente (HU #10625)
      description: >
        SIEMPRE regenera el token de activación (solo se persiste su hash — el enlace
        anterior queda invalidado) y reenvía el correo. SuperAdmin puede reenviar
        cualquier invitación del sistema; AdminCompany solo las de su propio tenant
        (mismo alcance que `POST /api/v1/security/invitations`). Rechaza el reenvío si
        la invitación ya no está pendiente (409) o si no ha pasado el cooldown
        anti-abuso (~2 minutos, configurable) desde el último envío (429).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invitación reenviada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponse"
        "401":
          description: No autenticado o falta el claim tenant_id.
        "404":
          description: La invitación no existe o no pertenece al alcance del caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "409":
          description: La invitación ya no está pendiente (fue aceptada o cancelada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "429":
          description: Cooldown anti-abuso activo — debes esperar antes de reenviar de nuevo.
          headers:
            Retry-After:
              description: Segundos hasta que se pueda reenviar de nuevo.
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendCooldownErrorResponse"

  /api/v1/admin/companies/index:
    get:
      tags: [Admin · Compañías]
      operationId: adminCompaniesIndex
      summary: Listado paginado de compañías (RF02)
      description: >
        Retorna el listado paginado de compañías registradas, ordenado por
        fecha de creación descendente. Filtros opcionales e independientes.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      parameters:
        - name: nit
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial sobre el NIT (tax_id).
        - name: razonSocial
          in: query
          required: false
          schema: { type: string }
          description: Coincidencia parcial e insensible a mayúsculas sobre la razón social.
        - name: estadoActivo
          in: query
          required: false
          schema: { type: boolean }
          description: Filtra por estado activo/inactivo.
        - name: fechaDesde
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite inferior inclusivo de fecha de creación (YYYY-MM-DD).
        - name: fechaHasta
          in: query
          required: false
          schema: { type: string, format: date }
          description: Límite superior inclusivo de fecha de creación (YYYY-MM-DD).
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPagedResult"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies:
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyCreate
      summary: Alta de compañía (#10118)
      description: >
        Crea una compañía (tenant) en identity.tenants. El código debe ser único.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Compañía creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Datos inválidos (campos requeridos, longitudes, tipo o código duplicado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanyUpdate
      summary: Edita una compañía (#10118)
      description: >
        Actualiza razón social, NIT, tipo y estado de la compañía. El código es
        inmutable (no se acepta en el payload). Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Compañía actualizada; devuelve la compañía con sus datos nuevos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La compañía no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Edición concurrente: el `rowVersion` enviado no coincide con el actual
            (otra persona modificó la compañía). No se persiste nada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Datos inválidos (campos requeridos, longitudes o tipo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/status:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanySetStatus
      summary: Activa o desactiva una compañía (#10118)
      description: >
        Cambia el estado activo/inactivo de la compañía (identity.tenants.is_active).
        Idempotente: aplicar el mismo estado retorna 200 sin cambios. Requiere JWT con
        rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCompanyStatusRequest"
      responses:
        "200":
          description: Estado actualizado; devuelve la compañía con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListItem"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La compañía no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/companies/{tenantId}/settings:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetSettings
      summary: Configuración operativa actual del tenant (RF03, AC3)
      description: >
        Retorna la configuración operativa vigente del tenant. Requiere JWT con
        rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuración operativa actual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No existe configuración para el tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Admin · Compañías]
      operationId: adminCompanyUpdateSettings
      summary: Guardado atómico de configuración operativa + audit log (RF03/RF07–RF10, AC1/AC2)
      description: >
        Persiste de forma atómica (todo o nada) la configuración operativa del
        tenant y genera una entrada de auditoría por cada campo modificado. Si la
        validación falla (p. ej. notificationTarget fuera del enum) retorna 422 sin
        persistir ni auditar. Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSettingsUpdate"
      responses:
        "200":
          description: Configuración persistida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSettings"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Payload inválido. No se persiste ni se audita ningún cambio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/v1/admin/companies/{tenantId}/whitelist:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identificador del tenant (compañía).
    get:
      tags: [Admin · Compañías]
      operationId: adminCompanyGetWhitelist
      summary: Lista blanca de correos exentos de la regla de propiedad vehicular (RF05, AC6)
      description: >
        Retorna los correos activos exentos de la regla only_own_vehicles del tenant.
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de correos exentos (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhitelistEntry"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Admin · Compañías]
      operationId: adminCompanyAddWhitelist
      summary: Alta masiva de correos en la lista blanca + audit log (RF05, AC4/AC5)
      description: >
        Da de alta de forma atómica uno o más correos en la lista blanca del tenant y
        genera una entrada de auditoría por cada correo insertado. Los duplicados ya
        existentes se omiten sin error (idempotente, 201 parcial). Si algún correo es
        inválido retorna 422 con la lista de inválidos sin persistir ninguno (atómico).
        Requiere JWT con rol SuperAdmin (RF01).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhitelistAddRequest"
      responses:
        "201":
          description: Correos procesados. Devuelve insertados y omitidos (duplicados).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistAddResponse"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Uno o más correos inválidos. No se persiste ninguno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistValidationErrorResponse"

  /api/v1/internal/transfers/start:
    post:
      tags: [Trámites · Traspaso]
      operationId: internalTransfersStart
      summary: Stub de radicación de traspaso con interceptor de propiedad vehicular (RF04, AC1/AC2)
      description: >
        Endpoint mínimo que cablea el interceptor de propiedad vehicular: valida la
        regla only_own_vehicles efectiva del trámite (snapshot si está in-flight, AC3)
        contemplando la exención por lista blanca (AC2). Si el vehículo no es del
        tenant y el usuario no está exento, retorna 422 con el mensaje de bloqueo
        (AC1). Exige usuario autenticado (rol operador), no SuperAdmin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferStartRequest"
      responses:
        "200":
          description: El traspaso puede iniciarse.
        "401":
          description: No autenticado (sin token JWT).
        "422":
          description: El interceptor bloquea el traspaso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesSearch
      summary: Catálogo de organismos de tránsito con búsqueda (RF13, AC1)
      description: >
        Retorna el catálogo de organismos de tránsito desde `catalogs.transit_offices`.
        El parámetro opcional `search` filtra por nombre o código (case-insensitive e
        insensible a tildes). Requiere JWT con rol SuperAdmin u ot_admin (OtModulePolicy).
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Término opcional de búsqueda (nombre o código).
      responses:
        "200":
          description: Catálogo de organismos (filtrado si se informó `search`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitOffice"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin u ot_admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/operational-status:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesOperationalStatus
      summary: Estado operativo y parametrización Quipux de los organismos de tránsito (RF01)
      description: >
        Una fila por oficina activa del catálogo (`catalogs.transit_offices` LEFT JOIN
        `admin.transit_office_profiles` + `identity.tenants`), ordenada por nombre. Incluye
        tanto el estado del tenant OT —si la oficina es cliente de FLIT— como la
        parametrización Quipux del catálogo (`divipoCode` + banderas, HU #10710), que existe
        para las 317 oficinas sean o no clientes. Requiere SuperAdmin.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado operativo por oficina del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitOfficeOperationalStatus"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin (ot_admin incluido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-settings:
    put:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesUpdateQuipuxSettings
      summary: Parametriza la radicación Quipux de una secretaría (HU #10710)
      description: >
        Reemplaza (PUT completo) el código DIVIPO y las tres banderas por familia de trámite
        de `catalogs.transit_offices`. Describe a la secretaría **DESTINO** a la que FLIT
        radica trámites vía Quipux, que normalmente **no** es cliente de FLIT.


        No confundir con `admin.transit_office_profiles.operation_mode = 'quipux'`
        (HU #10215): aquello describe al OT-**cliente** cuya consola queda en solo lectura
        porque aprueba dentro de Quipux. Son conceptos distintos que comparten el nombre.


        Reglas: `divipoCode` nulo o vacío significa «aún no se conoce» — **no es un error**
        mientras no haya banderas activas —, es el estado normal de las secretarías todavía no
        integradas (hoy 311 de 317), y se normaliza a `null` dejando la secretaría NO elegible.
        En cambio, activar una bandera sin DIVIPO se **rechaza** (`422 DIVIPO_REQUIRED_FOR_FLAGS`):
        el DIVIPO es obligatorio en cuanto se enciende una familia, para que no exista el estado
        inconsistente «declara pero no radica». Requiere SuperAdmin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la oficina en `catalogs.transit_offices`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitOfficeQuipuxSettingsRequest"
      responses:
        "200":
          description: Parametrización persistida (estado ya normalizado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitOfficeQuipuxSettings"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin rol SuperAdmin (ot_admin incluido).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: La oficina no existe o está descatalogada (`TRANSIT_OFFICE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        "422":
          description: >
            `DIVIPO_CODE_INVALID` (el DIVIPO no es numérico o excede 20 dígitos),
            `QUIPUX_FLAGS_REQUIRED` (falta alguna bandera en el PUT) o
            `DIVIPO_REQUIRED_FOR_FLAGS` (se activó una bandera sin cargar el DIVIPO).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-submissions:
    get:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesListQuipuxCola
      summary: Cola de radicaciones Quipux de una secretaría (HU #10774)
      description: >
        Lista `tramites.quipux_submissions` de los trámites cuyo `transit_office_id` es esta
        secretaría **destino**, enriquecidas con el número de referencia, el tipo de trámite y
        la razón social del cliente. Incluye todos los estados (activa + histórico:
        `pendiente`, `registrado`, `aprobado`, `rechazado`, `fallido`), ordenados del más nuevo
        al más viejo. Requiere SuperAdmin u ot_admin (OtModulePolicy); el ot_admin solo puede
        consultar su propia secretaría: el `{id}` de la ruta debe coincidir con el
        `transit_office_id` que su perfil OT resuelve desde su `tenant_id` (recuerda que
        `tenant_id` ≠ `transit_office_id`), de lo contrario 403 `TRANSIT_OFFICE_FORBIDDEN`.
        El SuperAdmin es cross-tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la secretaría destino en `catalogs.transit_offices`.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de la cola.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuipuxColaPage"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o un ot_admin consultando una secretaría
            que no es la de su perfil OT (`TRANSIT_OFFICE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-submissions/{submissionId}/retry:
    post:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesRetryQuipuxSubmission
      summary: Re-encola una radicación Quipux fallida (HU #10774)
      description: >
        Lleva una submission `fallido` de vuelta a `pendiente` con presupuesto de intentos
        fresco, de modo que el registrador la vuelva a reclamar. Requiere SuperAdmin u ot_admin;
        el ot_admin solo opera la secretaría de su perfil OT (403 `TRANSIT_OFFICE_FORBIDDEN` si el
        `{id}` no coincide con su `transit_office_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la secretaría destino (scope de la submission).
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Re-encolada (código OK)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "401":
          description: No autenticado.
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o un ot_admin operando una secretaría ajena
            (`TRANSIT_OFFICE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            No hay submission con ese id en esta secretaría
            (`QUIPUX_SUBMISSION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        "409":
          description: >
            `QUIPUX_SUBMISSION_INVALID_STATE` (no está en `fallido`) o
            `QUIPUX_SUBMISSION_CONFLICT` (el trámite ya tiene otra radicación viva).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"

  /api/v1/admin/transit-offices/{id}/quipux-submissions/{submissionId}/cancel:
    post:
      tags: [Admin · Compañías]
      operationId: adminTransitOfficesCancelQuipuxSubmission
      summary: Cancela una radicación Quipux pendiente (HU #10774)
      description: >
        Lleva una submission `pendiente` a `fallido` terminal antes de que se radique.
        La transición está guardada por estado: si un worker la registró entre la carga de la
        pantalla y el clic, responde 409. Requiere SuperAdmin u ot_admin; el ot_admin solo opera
        la secretaría de su perfil OT (403 `TRANSIT_OFFICE_FORBIDDEN` si el `{id}` no coincide con
        su `transit_office_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Id de la secretaría destino (scope de la submission).
        - name: submissionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Cancelada (código OK)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeResponse"
        "401":
          description: No autenticado.
        "403":
          description: >
            Sin rol SuperAdmin u ot_admin, o un ot_admin operando una secretaría ajena
            (`TRANSIT_OFFICE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No hay submission con ese id en esta secretaría (`QUIPUX_SUBMISSION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        "409":
          description: >
            `QUIPUX_SUBMISSION_INVALID_STATE`: ya no está en `pendiente`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"

  /api/v1/admin/log-qx:
    get:
      tags: [Admin · LOG QX]
      operationId: adminLogQxSearch
      summary: Consulta el LOG QX de una radicación (HU #10793)
      description: >
        Trazabilidad de la integración Quipux para soporte/administración. Dado una placa, un id de
        trámite (`instanceId`) o un radicado, devuelve la(s) radicación(es) que corresponden —el
        estado final y los códigos QX de `tramites.quipux_submissions`— cada una con su línea de
        tiempo completa reconstruida de `tramites.quipux_submission_events` (etapa, resultado, detalle
        sanitizado, `occurred_at`), incluidos los eventos de error y de reintento. Cada evento expone,
        cuando el detalle instrumentado lo trae, el código de respuesta, la duración de la llamada HTTP
        (`durationMs`) y el origen (worker `quipux_register` / `quipux_status_poll`); los eventos
        históricos sin detalle se devuelven con `detail: null` ("sin payload disponible") sin romper la
        respuesta. La respuesta NUNCA incluye request/response crudos ni PII: solo el `detail` ya
        sanitizado en captura, sobre el que además se enmascaran los datos sensibles (HU #10794).
        Paginado (`page`/`pageSize`). Requiere el permiso `logqx.read` (SuperAdmin bypassa). Sin
        ningún filtro, lista todas las radicaciones paginadas.
      security:
        - bearerAuth: []
      parameters:
        - name: placa
          in: query
          required: false
          schema: { type: string }
          description: Placa del vehículo; casa por valor normalizado (mayúsculas, sin espacios).
        - name: instanceId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Id del trámite (`procedure_instance_id`). Se espera un UUID; si el valor no tiene formato
            de UUID, la respuesta es una página vacía (no un error), igual que `radicado` no numérico.
        - name: radicado
          in: query
          required: false
          schema: { type: string }
          description: >
            Número de radicación ≈ código QX (registro o trámite). Si no es numérico, la respuesta es
            una página vacía.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de radicaciones con su línea de tiempo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogQxPage"
        "401":
          description: No autenticado (sin token JWT).
        "403":
          description: Autenticado pero sin el permiso logqx.read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/ot/profile:
    get:
      tags: [Admin · OT]
      operationId: adminOtGetProfile
      summary: Perfil OT del tenant autenticado
      security:
        - bearerAuth: []
