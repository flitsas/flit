  /api/v1/analytics/events:
    post:
      tags: [Analytics · Telemetría]
      operationId: analyticsUsageEventsBatch
      summary: Recibe un lote (máx. 50) de eventos de telemetría de uso del frontend
      description: >
        Reportes 2.0 (HU-A, §4.6 del contrato). Encola en memoria (escritura asíncrona por
        lotes en `analytics.app_usage_events`) los eventos de uso emitidos por el frontend.
        El tenant y el userId salen SIEMPRE del JWT (claims `tenant_id` y `sub`), nunca del
        body. La taxonomía de `eventType` es CERRADA: los eventos con tipo desconocido se
        descartan silenciosamente y solo se cuenta lo aceptado. `metadata` NO debe contener
        PII (nombres, documentos, emails, placas, VIN). Best-effort: nunca responde 5xx por
        errores de persistencia ni saturación de la cola (se degrada a 202 con menos aceptados);
        lote de más de 50 eventos → 400 en español.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEventBatchRequest"
      responses:
        "202":
          description: Lote encolado; `accepted` = eventos aceptados (los fuera de taxonomía se descartan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventBatchAcceptedResponse"
        "400":
          description: El lote supera el máximo de 50 eventos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autenticado.

