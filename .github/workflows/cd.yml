  # ── DEV, QA y PDN: GitOps (Argo CD) ──────────────────────────────────────────
  # Ningun ambiente se despliega ya por SSH (el antiguo deploy-to-vps se retiro al nivelar
  # release con staging, #658): este job NO toca ningun servidor. Escribe los digests recien
  # publicados en flit-gitops/services/flit2-<dev|qa|pdn>/kustomization.yaml y Argo CD los aplica:
  #   develop -> flit2-dev  (k3s de la 177, root-vps-177)
  #   staging -> flit2-qa   (k3s de la 177, root-vps-177)
  #   release -> flit2-pdn  (k3s de la 169, root-vps-169; antes era el job deploy-pdn-gitops, #587)
  # El ambiente sale de setup.env_name; el Environment de GitHub (develop/staging/production)
  # aporta su GITOPS_TOKEN y, en production, sus reglas de proteccion.
  #
  # Por digest y no por tag: el tag `dev`/`qa`/`pdn` se mueve, el digest no, y asi git dice que
  # corre en el ambiente. Rollback = revertir ese commit en flit-gitops.
  #
  # Si el build de una imagen falla, su digest no se toca (ese servicio conserva su version)
  # y el job termina en rojo.
  #
  # OJO: la CONFIGURACION de los tres ambientes ya no sale de docker-compose.prod.yml ni de un
  # .env. Vive en flit-gitops/services/flit2-<ambiente>/ (configmaps.yaml + sealed-secrets.yaml).
  # Una variable nueva en el compose NO llega sola: hay que agregarla alla, en cada ambiente.
  deploy-gitops:
    name: Deploy ${{ needs.setup.outputs.env_name }} (GitOps → Argo CD)
    needs: [setup, build-core-api, build-core-identity, build-core-consultas, build-core-notificaciones, build-core-comparendos, build-core-ict, build-frontend, build-frontend-hub, build-frontend-comparendos, build-python-ml]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # develop / staging / production: cada Environment tiene su GITOPS_TOKEN.
      name: ${{ needs.setup.outputs.gh_env }}
      url: https://${{ needs.setup.outputs.front_domain }}
    env:
      AMBIENTE: ${{ needs.setup.outputs.env_name }}
      FRONT_DOMAIN: ${{ needs.setup.outputs.front_domain }}
      API_DOMAIN: ${{ needs.setup.outputs.api_domain }}
      R_CORE_API: ${{ needs.build-core-api.result }}
      D_CORE_API: ${{ needs.build-core-api.outputs.digest }}
      R_CORE_IDENTITY: ${{ needs.build-core-identity.result }}
      D_CORE_IDENTITY: ${{ needs.build-core-identity.outputs.digest }}
      R_CORE_CONSULTAS: ${{ needs.build-core-consultas.result }}
      D_CORE_CONSULTAS: ${{ needs.build-core-consultas.outputs.digest }}
      R_CORE_NOTIFICACIONES: ${{ needs.build-core-notificaciones.result }}
      D_CORE_NOTIFICACIONES: ${{ needs.build-core-notificaciones.outputs.digest }}
      R_CORE_COMPARENDOS: ${{ needs.build-core-comparendos.result }}
      D_CORE_COMPARENDOS: ${{ needs.build-core-comparendos.outputs.digest }}
      R_CORE_ICT: ${{ needs.build-core-ict.result }}
      D_CORE_ICT: ${{ needs.build-core-ict.outputs.digest }}
      R_FRONTEND: ${{ needs.build-frontend.result }}
      D_FRONTEND: ${{ needs.build-frontend.outputs.digest }}
      R_FRONTEND_HUB: ${{ needs.build-frontend-hub.result }}
      D_FRONTEND_HUB: ${{ needs.build-frontend-hub.outputs.digest }}
      R_FRONTEND_COMPARENDOS: ${{ needs.build-frontend-comparendos.result }}
      D_FRONTEND_COMPARENDOS: ${{ needs.build-frontend-comparendos.outputs.digest }}
      R_PYTHON_ML: ${{ needs.build-python-ml.result }}
      D_PYTHON_ML: ${{ needs.build-python-ml.outputs.digest }}
    steps:
      - name: Checkout (para comparar el compose)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Aviso, no bloqueo: si este push cambio docker-compose.prod.yml, lo mas probable es que
      # traiga una variable de entorno nueva que hay que replicar a mano en flit-gitops.
      - name: Avisar si cambio docker-compose.prod.yml
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Sin commit previo para comparar (workflow_dispatch o rama nueva)."
            exit 0
          fi
          if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docker-compose.prod.yml; then
            echo "::warning title=Revisar config de ${AMBIENTE^^}::docker-compose.prod.yml cambio en este despliegue. ${AMBIENTE^^} ya no lo usa: si hay variables nuevas o distintas, replicalas en flit-gitops/services/flit2-${AMBIENTE}/configmaps.yaml (o sealed-secrets.yaml si son secretas)."
            git diff "$BEFORE" "$GITHUB_SHA" -- docker-compose.prod.yml | grep -E '^[+-][^+-]' | head -60 || true
          fi

      - name: Actualizar digests en flit-gitops
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/${{ github.repository_owner }}/flit-gitops.git" gitops
          cd gitops
          K="services/flit2-${AMBIENTE}/kustomization.yaml"
          FAILED=""
          MSG=""
          # servicio:imagen:variable (R_<variable> = resultado del build, D_<variable> = digest)
          for entry in \
              "core-api:${{ env.CORE_API_IMAGE }}:CORE_API" \
              "core-identity:${{ env.CORE_IDENTITY_IMAGE }}:CORE_IDENTITY" \
              "core-consultas:${{ env.CORE_CONSULTAS_IMAGE }}:CORE_CONSULTAS" \
              "core-notificaciones:${{ env.CORE_NOTIFICACIONES_IMAGE }}:CORE_NOTIFICACIONES" \
              "core-comparendos:${{ env.CORE_COMPARENDOS_IMAGE }}:CORE_COMPARENDOS" \
              "core-ict:${{ env.CORE_ICT_IMAGE }}:CORE_ICT" \
              "frontend:${{ env.FRONTEND_IMAGE }}:FRONTEND" \
              "frontend-hub:${{ env.FRONTEND_HUB_IMAGE }}:FRONTEND_HUB" \
              "frontend-comparendos:${{ env.FRONTEND_COMPARENDOS_IMAGE }}:FRONTEND_COMPARENDOS" \
              "python-ml:${{ env.PYTHON_ML_IMAGE }}:PYTHON_ML"; do
            svc=${entry%%:*}; rest=${entry#*:}; img=${rest%:*}; var=${rest##*:}
            r="R_$var"; d="D_$var"
            if [ "${!r}" != "success" ] || [[ ! "${!d}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning::$svc: build '${!r}' sin digest valido; conserva la version que corre"
              FAILED="$FAILED $svc"
              continue
            fi
            # Falla si la imagen no esta en la kustomization (evita un despliegue a medias).
            yq -e "(.images[] | select(.name == \"$img\"))" "$K" > /dev/null
            yq -i "(.images[] | select(.name == \"$img\")).digest = \"${!d}\"" "$K"
            yq -i "del((.images[] | select(.name == \"$img\")).newTag)" "$K"
            MSG="$MSG"$'\n'"$svc ${!d}"
          done
          git diff --stat
          git config user.name "flit-ci"
          git config user.email "ci@flitsas.com"
          git add "$K"
          if git diff --cached --quiet; then
            echo "Los digests ya eran estos: nada que desplegar."
            echo "GITOPS_SHA=" >> "$GITHUB_ENV"
          else
            git commit -m "flit2-${AMBIENTE}: despliegue ${GITHUB_SHA::7} (flitsas/flit ${GITHUB_REF_NAME})" -m "${MSG#$'\n'}"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "Push rechazado (intento $i); rebase y reintento..."
              git pull --rebase
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::No se pudo empujar a flit-gitops tras 3 intentos"
              exit 1
            fi
            echo "GITOPS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
          if [ -n "$FAILED" ]; then
            echo "::error::Despliegue parcial: fallaron los builds de$FAILED; esos servicios conservan su version anterior."
            exit 1
          fi

      # Argo CD (notificaciones, flit-gitops/docs/argocd-notificaciones) publica el commit status
      # «argocd/flit2-<ambiente>» = success en la revision de flit-gitops que quedo Synced + Healthy.
      # Se espera ESE status en lugar de un sleep fijo. Si entro otro commit despues del nuestro, el status
      # cae en ese commit posterior (que contiene el nuestro): se revisan los commits de main desde la punta
      # hasta el nuestro. Si el status no aparece o no se puede leer, se sigue con la comprobacion de salud
      # de siempre: una notificacion rota nunca frena un despliegue.
      - name: Esperar a Argo CD (Synced + Healthy)
        if: env.GITOPS_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP: flit2-${{ needs.setup.outputs.env_name }}
          REPO: ${{ github.repository_owner }}/flit-gitops
        run: |
          fin=$((SECONDS+600))
          while [ $SECONDS -lt $fin ]; do
            if ! shas=$(gh api "repos/$REPO/commits?sha=main&per_page=30" --jq '.[].sha' 2>/dev/null); then
              echo "::warning::No se pueden leer los commits de $REPO; se sigue con la comprobacion de salud."; exit 0
            fi
            for sha in $shas; do
              st=$(gh api "repos/$REPO/commits/$sha/statuses" --jq "[.[] | select(.context==\"argocd/$APP\")][0].state // empty" 2>/dev/null || true)
              case "$st" in
                success) echo "Argo CD: $APP Synced + Healthy en ${sha::7} ($((SECONDS/60)) min)."; echo "ARGO_OK=1" >> "$GITHUB_ENV"; exit 0 ;;
                failure|error) echo "::error::Argo CD informa '$st' en $APP (${sha::7}). Revisar Argo CD; rollback = revertir el commit de flit-gitops."; exit 1 ;;
              esac
              [ "$sha" = "$GITOPS_SHA" ] && break
            done
            sleep 10
          done
          echo "::warning::Argo CD no confirmo $APP en 10 min (sin status). Ojo: Argo puede decir Synced estando ciego. Se sigue con la comprobacion de salud."

      - name: Comprobar que el ambiente responde
        run: |
          # Sin confirmacion de Argo se da tiempo a que sincronice (sondea cada 60 s).
          [ -n "${ARGO_OK:-}" ] || [ -z "${GITOPS_SHA:-}" ] || sleep 90
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 -o /dev/null "https://${API_DOMAIN}/health" \
               && curl -fsS --max-time 10 -o /dev/null "https://${FRONT_DOMAIN}/"; then
              echo "${AMBIENTE^^} responde (intento $i)."
              exit 0
            fi
            echo "Intento $i: aun no responde; reintento en 15 s"
            sleep 15
          done
          echo "::error::${AMBIENTE^^} no responde 10 min despues del despliegue. Revisar Argo CD (flit2-${AMBIENTE}; dev/qa en la 177, pdn en la 169); rollback = revertir el commit de flit-gitops."
          exit 1
