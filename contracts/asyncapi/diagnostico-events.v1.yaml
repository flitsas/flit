asyncapi: '2.6.0'
info:
  title: FLIT — eventos de Diagnóstico
  version: 1.0.0
  description: |
    Eventos que publica Diagnóstico Vehicular (core-diagnostico) en el exchange `flit.diagnostico` (ADR-0064,
    ADR-0075). Mensajes en JSON con el sobre común (comun/sobre.v1.yaml). Sin datos personales: ids, estados y totales.
    Los trabajos de consulta que Diagnóstico deja a Consultas están en consultas-events.v1.yaml.
defaultContentType: application/json

channels:
  diagnostico.lote.terminado:
    description: |
      Un diagnóstico (lote o Express) llegó a COMPLETADO o INCOMPLETO (HU #13743, ADR-0075). Se publica por la outbox en
      la misma transacción del cierre. Si un reproceso o un llenado manual lo reabre y lo vuelve a cerrar, se publica otra
      vez con una `version` mayor: los consumidores deduplican por `(diagnosticoId, version)`. Por ahora sin consumidor.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.diagnostico, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: loteTerminado
      message:
        $ref: '#/components/messages/LoteTerminado'

  diagnostico.dictamen.emitido:
    description: |
      Nació una versión del dictamen de un vehículo (cierre del lote o override del backoffice). Se publica por la
      outbox en la misma transacción de quien escribe la fila. Completar el texto de una versión que ya existía no
      publica otro. Los consumidores deduplican por `(vehiculoId, version)`. Sin placa, VIN, documentos ni el texto
      de los alertamientos. La empresa va en el sobre.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.diagnostico, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: dictamenEmitido
      message:
        $ref: '#/components/messages/DictamenEmitido'

  diagnostico.derivacion.solicitada:
    description: |
      Punto 4, incremento 3 (ADR-0084): un ítem de una creación masiva de trámites recibió el crédito de su compañía y espera
      que el consumidor `diagnostico.derivaciones` del propio Diagnóstico llame a Trámites (rpc CrearBorradorDesdeDiagnostico).
      Lo publica el despachador de crédito por la outbox, en la misma transacción que deja el ítem ENVIADO (al encolar, al
      cerrar el ítem anterior de la compañía, al reintentar fallidas o al re-publicar un ítem colgado desde el reconciliador).
      SOLO ids: ni placa, ni VIN, ni documentos (el documento viaja por gRPC interno al llamar). La empresa va en el sobre.
      La cola solo acepta mensajes del productor `diagnostico` (user_id validado por el broker); un eventId repetido no repite
      el efecto (bandeja) y un ítem ya cerrado se confirma sin efecto.
    bindings:
      amqp:
        is: routingKey
        exchange: { name: flit.diagnostico, type: topic, durable: true, autoDelete: false, vhost: flit }
    subscribe:
      operationId: derivacionSolicitada
      message:
        $ref: '#/components/messages/DerivacionSolicitada'

components:
  messages:
    LoteTerminado:
      name: diagnostico.lote.terminado
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                required: [diagnosticoId, estado, esExpress, version, terminadoEn, vehiculos, celdas, erroresPorTipo]
                properties:
                  diagnosticoId: { type: string, format: uuid }
                  estado: { type: string, enum: [COMPLETADO, INCOMPLETO] }
                  esExpress: { type: boolean }
                  version: { type: integer, minimum: 1, description: version_tablero del lote en el cierre. }
                  terminadoEn: { type: string, format: date-time, description: cerrado_en del lote. }
                  vehiculos: { type: integer, minimum: 0, description: Vehículos del lote. }
                  celdas:
                    type: object
                    description: Celdas por estado (códigos de diagnostico.consultas.estado); solo los estados que tienen celdas.
                    additionalProperties: { type: integer, minimum: 1 }
                  erroresPorTipo:
                    type: object
                    description: Celdas en ERROR por tipo_error (TIMEOUT, RED, BLOQUEADA_POR_RUNT…); vacío si no hay.
                    additionalProperties: { type: integer, minimum: 1 }
    DictamenEmitido:
      name: diagnostico.dictamen.emitido
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                required: [diagnosticoId, vehiculoId, dictamenId, version, veredicto, catalogoVersion, modo, tipoTramiteCodigo, estadoRedaccion, override]
                properties:
                  diagnosticoId: { type: string, format: uuid, description: Lote. }
                  vehiculoId: { type: string, format: uuid, description: Vehículo. }
                  dictamenId: { type: string, format: uuid, description: Id de la versión que nace. }
                  version: { type: integer, minimum: 1, description: Versión de negocio del dictamen. }
                  veredicto: { type: string, enum: [VIABLE, BLOQUEADO] }
                  catalogoVersion: { type: integer, description: Versión del catálogo guardada en la fila. }
                  modo: { type: string, description: Código del modo de la cabecera. }
                  tipoTramiteCodigo: { type: string, description: Código de trámite de la cabecera. }
                  estadoRedaccion: { type: string, enum: [PENDIENTE, COMPLETADA] }
                  override: { type: boolean, description: true solo en el reemplazo del backoffice. }
                  ajuste_alertamientos:
                    type: boolean
                    description: >
                      HU #14563 (aditivo, opcional). Solo sale, en true, cuando soporte FLIT ajustó los alertamientos (redacción
                      MANUAL). Ausente en el cierre y en el override de solo veredicto. Sin motivo ni texto libre del ajuste.
    DerivacionSolicitada:
      name: diagnostico.derivacion.solicitada
      payload:
        allOf:
          - $ref: './comun/sobre.v1.yaml#/Sobre'
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                required: [operacionId, itemId, vehiculoId]
                properties:
                  operacionId: { type: string, format: uuid, description: Operación «Crear trámite» (diagnostico.derivacion_operaciones). }
                  itemId: { type: string, format: uuid, description: Ítem de la operación (diagnostico.derivaciones). }
                  vehiculoId: { type: string, format: uuid, description: Vehículo (external_ref del borrador en Trámites). }
