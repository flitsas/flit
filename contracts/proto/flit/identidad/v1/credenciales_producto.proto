syntax = "proto3";

package flit.identidad.v1;

option csharp_namespace = "Flit.Identidad.Grpc.V1";

// Credenciales de un producto por empresa para el servicio que llama a un tercero en su nombre (ADR-0092).
// Lo atiende core-identity, dueño de platform.tenant_product_credentials (cifrada con Data Protection).
//
// Autenticación (ADR-0070, contrato §3):
//   - authorization: token de servicio con aud=plataforma y scope platform.identidad.credenciales.impuesto.
//   - x-flit-tenant-id: OBLIGATORIA; la empresa del sobre del trabajo. Sin ella INVALID_ARGUMENT.
//   - Cada rpc tiene su cliente y su scope (abajo). Otro sub -> PERMISSION_DENIED reason CLIENTE_NO_PERMITIDO.
// Canal h2c interno: la llave viaja en claro dentro de la red de contenedores (riesgo aceptado en ADR-0092, pendiente
// aval de Seguridad). El campo 6 queda libre para un sobre flit.platform.v1.LlaveCifrada si Seguridad lo exige.
// core-identity NUNCA escribe la llave en logs. Errores con google.rpc.ErrorInfo (domain flitsas.com).
service CredencialesProductoService {
  // Solo svc-consultas, scope platform.identidad.credenciales.impuesto.
  // Idempotente y sin efectos. Fail-closed: con Diagnóstico apagado para la empresa o algún ancestro, disponible=false.
  rpc ObtenerCredencialImpuesto(ObtenerCredencialImpuestoRequest) returns (ObtenerCredencialImpuestoResponse);

  // Solo svc-impuestos, scope platform.identidad.credenciales.impuesto.copia (ADR-0093, DA-2=b, DA-3 residual).
  // Devuelve el par diagnostico/impuesto_api_key AUNQUE Diagnóstico esté apagado para la empresa o un ancestro: lo usa
  // core-impuestos una sola vez, al aprovisionar, para copiar la llave a su propio almacén (D-CRED-DIAG). Sin efectos
  // sobre la credencial de Diagnóstico. Cada llamada queda en admin.tenant_config_audit_logs (sin valor ni huella).
  rpc ObtenerCredencialImpuestoParaCopia(ObtenerCredencialImpuestoParaCopiaRequest) returns (ObtenerCredencialImpuestoParaCopiaResponse);

  // Solo svc-impuestos, scope platform.identidad.credenciales.impuesto.actualizar (HU #14694, D-ALTA-IDEM, plan §5.8).
  // El alta del proveedor respondió api_key_rotated=true: la llave anterior de la empresa ya no sirve y core-impuestos
  // propaga la nueva a Diagnóstico. Solo REEMPLAZA una fila diagnostico/impuesto_api_key que ya existe para la empresa;
  // nunca la crea (actualizada = false sin fila). No mira si Diagnóstico está encendido. Idempotente: repetir con la misma
  // llave deja el mismo valor. Cada reemplazo queda en admin.tenant_config_audit_logs (sin valor ni huella, con el cliente).
  // Llave con forma inválida -> INVALID_ARGUMENT reason CREDENCIAL_INVALIDA (no se reintenta).
  rpc ActualizarCredencialImpuestoDiagnostico(ActualizarCredencialImpuestoDiagnosticoRequest) returns (ActualizarCredencialImpuestoDiagnosticoResponse);
}

// La empresa va en la metadata x-flit-tenant-id. api_key: la nueva llave del impuesto (texto visible, 16 a 256 caracteres).
message ActualizarCredencialImpuestoDiagnosticoRequest {
  string api_key = 1;
}

message ActualizarCredencialImpuestoDiagnosticoResponse {
  bool actualizada = 1;  // false => no hay fila diagnostico/impuesto_api_key para la empresa (no se crea)
}

message ObtenerCredencialImpuestoRequest {}

// La empresa va en la metadata x-flit-tenant-id.
message ObtenerCredencialImpuestoParaCopiaRequest {}

message ObtenerCredencialImpuestoParaCopiaResponse {
  bool existe = 1;     // false => no hay fila diagnostico/impuesto_api_key para la empresa
  string api_key = 2;  // solo con existe = true
  int64 version = 3;   // row_version de la fila; 0 sin fila
}

message ObtenerCredencialImpuestoResponse {
  bool disponible = 1;                    // false => el consumidor NO llama a la fuente
  MotivoCredencialNoDisponible motivo = 2;  // UNSPECIFIED con disponible = true
  string api_key = 3;                     // solo con disponible = true
  int64 version = 4;                      // row_version de la fila; 0 sin fila. Versión de la caché del consumidor
  int32 ttl_segundos = 5;                 // caché sugerida: 300 con llave, 60 sin llave
}

enum MotivoCredencialNoDisponible {
  MOTIVO_CREDENCIAL_NO_DISPONIBLE_UNSPECIFIED = 0;
  MOTIVO_CREDENCIAL_NO_DISPONIBLE_SIN_CONFIGURAR = 1;     // no hay fila diagnostico/impuesto_api_key para la empresa
  MOTIVO_CREDENCIAL_NO_DISPONIBLE_PRODUCTO_APAGADO = 2;   // diagnostico apagado para la empresa o un ancestro (ADR-0057)
}
