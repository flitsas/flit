name: Contracts (OpenAPI + AsyncAPI)

on:
  push:
    branches: [develop, main]
    paths: ['contracts/**']
  pull_request:
    branches: [develop]
    paths: ['contracts/**']

jobs:
  lint-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint core-api OpenAPI
        run: |
          if [ -f contracts/openapi/core-api.v1.yaml ]; then
            npx -y @redocly/cli@latest lint contracts/openapi/core-api.v1.yaml
          else
            echo "::notice::contracts/openapi/core-api.v1.yaml aún no existe, omitido"
          fi
      # HU #13082 (Épica #12737) — contrato de la API externa (clientes de integración, p. ej. Flito).
      # Sin el «if -f» de los demás: si el archivo desaparece o queda inválido, el job falla.
      - name: Lint external API OpenAPI
        run: npx -y @redocly/cli@latest lint contracts/openapi/external-api.v1.json
      - name: Lint python-ml OpenAPI
        run: |
          if [ -f contracts/openapi/python-ml.v1.yaml ]; then
            npx -y @redocly/cli@latest lint contracts/openapi/python-ml.v1.yaml
          else
            echo "::notice::contracts/openapi/python-ml.v1.yaml aún no existe, omitido"
          fi
      - name: Lint platform OpenAPI (FLIT Suite, HU #12966)
        run: |
          if [ -f contracts/openapi/platform.v1.yaml ]; then
            npx -y @redocly/cli@latest lint contracts/openapi/platform.v1.yaml
          else
            echo "::notice::contracts/openapi/platform.v1.yaml aún no existe, omitido"
          fi

  # HU #13328 (Epic #13316, ADR-0064) — valida TODOS los contratos AsyncAPI de contracts/asyncapi con
  # @asyncapi/parser en versión fija. Reemplaza `@asyncapi/cli validate events.v1.yaml`, que nunca corría: el
  # archivo se renombró por el CLI roto (docs/ci/asyncapi-cli-broken-generator-hooks.md) y hoy el CLI exige Node 24.
  validate-asyncapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar @asyncapi/parser
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/asyncapi" @asyncapi/parser@3.4.0
      - name: Validar contratos AsyncAPI
        env:
          ASYNCAPI_PARSER_DIR: ${{ runner.temp }}/asyncapi
        run: node contracts/asyncapi/validate.cjs

  # HU #13326 (Epic #13316, ADR-0070) — contratos gRPC entre servicios en contracts/proto.
  # lint: convenciones de buf (STANDARD). breaking: un cambio que rompe a quien ya usa un .proto
  # publicado no se fusiona (regla FILE). Se compara contra la rama destino del PR, o contra el
  # commit anterior en un push a develop/main. Si la base aún no tiene contracts/proto (el primer PR
  # que lo crea), no hay nada publicado contra qué comparar y el paso se omite con un aviso.
  lint-proto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: buf lint
        working-directory: contracts/proto
        run: npx -y @bufbuild/buf@1.73.0 lint
      - name: buf breaking
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_REF}:contracts/proto/buf.yaml" 2>/dev/null; then
            echo "::notice::La base (${BASE_REF}) aún no tiene contracts/proto; no hay contratos publicados contra qué comparar"
            exit 0
          fi
          npx -y @bufbuild/buf@1.73.0 breaking contracts/proto --against ".git#ref=${BASE_REF},subdir=contracts/proto"
