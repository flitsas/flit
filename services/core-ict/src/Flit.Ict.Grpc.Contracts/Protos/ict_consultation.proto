syntax = "proto3";

package flit.ict.v1;

option csharp_namespace = "Flit.Ict.Grpc.Contracts";

import "google/protobuf/timestamp.proto";

// Consulta de fuentes externas (RUNT/SOAT/RTM/RNMC/conductor). core-ict = cliente, core-api = servidor.
// core-api reutiliza su subsistema de consultas (IConsultationProviderChainResolver / Registry, con su
// toggle mock|real y credenciales) y normaliza el resultado a los 5 hechos que valida core-ict. El
// tenant viaja explícito; el service-token autoriza a ICT como sistema (TODO ICT-GRPC-AUTH).
service IctConsultation {
  rpc Query (ConsultationRequest) returns (ConsultationReply);
}

message ConsultationRequest {
  string tenant_id = 1;
  string query_type = 2;        // VEHICLE | VIN | RNMC | DRIVER
  string plate = 3;
  string vin = 4;
  string document_type = 5;
  string document_number = 6;
}

message ConsultationReply {
  // "" = desconocido / no aplica: core-ict lo trata como null y NO bloquea por esa fuente.
  string soat_status = 1;             // "VIGENTE" | "NO_VIGENTE" | ""
  string rtm_status = 2;              // "VIGENTE" | "NO_VIGENTE" | ""
  int32 vehicle_model_year = 3;       // 0 = desconocido
  bool has_active_sanctions = 4;      // RNMC: medidas correctivas activas
  bool paz_y_salvo_known = 5;         // false => paz_y_salvo desconocido (no bloquea)
  bool paz_y_salvo = 6;
  string error_code = 7;              // "" en éxito; si viene, core-ict reintenta (no marca válido)
  string transit_office_name = 8;     // organismo de matrícula del RUNT (solo VEHICLE); "" = desconocido
  // Bug #13304 — resultado COMPLETO de vehículo (solo VEHICLE/VIN y solo si la cadena respondió).
  // JSON opaco para core-ict: PreflightVehicleSnapshot serializado por core-api. Contiene PII
  // (titular, acreedor): no loguear, no exponer en trazabilidad, purgar tras materializar.
  string vehicle_snapshot_json = 9;
  google.protobuf.Timestamp consulted_at = 10;  // reloj de core-api
  string provider = 11;                         // p. ej. "kyverum_runt"
  string consultation_kind = 12;                // "VehiclePlate" | "VehicleVin"
}
