openapi: 3.0.3
info:
  title: FLIT Core API
  version: 1.0.0
  description: Contrato público core-api — carril Seguridad (HU #10168)
paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Login con email y contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      operationId: authGetCurrentUser
      tags: [Auth]
      summary: Perfil del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: No autenticado o sesión expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, expiresInSeconds, tokenType]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
        tokenType:
          type: string
          example: Bearer
    CurrentUserResponse:
      type: object
      required: [userId, email, tenantId, roleId, permissions]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        tenantId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        roleCode:
          type: string
        permissions:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
