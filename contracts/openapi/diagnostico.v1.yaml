      tags: [Usuarios, Backoffice]
      operationId: listarEmpresasUsuariosBackoffice
      summary: Compañías con Diagnóstico y sus conteos de usuarios (SuperAdmin)
      description: >
        HU #14587. Solo SuperAdmin. Las compañías de Identidad con Diagnóstico (EmpresasService.ListarEmpresasConProducto) con los conteos
        de UsuariosProductoConteoService.ContarPorEmpresa: usuarios_diagnostico = ACTIVO + INVITADO + SUSPENDIDO con rol de Diagnóstico;
        administradores_diagnostico = ACTIVO con admin_diagnostico. estado siempre ACTIVA (H-U3). GET /backoffice/empresas no cambia (C7).
      parameters:
        - name: busqueda
          in: query
          required: false
          description: Contiene sobre el nombre sin tildes ni mayúsculas, o prefijo del NIT si es numérico; hasta 100 caracteres.
          schema: { type: string, maxLength: 100 }
        - name: usuarios
          in: query
          required: false
          description: CON (al menos un usuario de Diagnóstico) o SIN.
          schema: { type: string, enum: [CON, SIN] }
        - name: orden
          in: query
          required: false
          description: nombre (alfabético, por defecto) o usuarios (de más a menos usuarios, luego nombre).
          schema: { type: string, enum: [nombre, usuarios], default: nombre }
        - $ref: "#/components/parameters/PaginaUsuarios"
        - $ref: "#/components/parameters/TamanoUsuarios"
      responses:
