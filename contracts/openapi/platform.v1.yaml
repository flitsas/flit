openapi: 3.0.3
info:
  title: FLIT Suite — API de plataforma
  version: "1.1.0"
  description: >
    Endpoints de plataforma de la FLIT Suite (contrato de plataforma v1, §6), servidos por core-api
    bajo /api/v1/platform. Productos de la suite, su habilitación por empresa y el manifiesto que
    registra cada producto (HU #12966, tarea B-06). Los errores siguen RFC 7807 con un campo `code`
    estable (contrato §10). Las consultas externas compartidas no son REST: las atiende core-consultas
    por gRPC (flit.consultas.v1, contracts/proto; ADR-0065 y ADR-0070).


    Versión 1.1.0 (HU #14694, producto Impuestos, ADR-0093; plan docs/impuestos/plan-implementacion.md §5.4): cambio
    aditivo. Las rutas /api/v1/platform/admin/tenants/{tenantId}/products* las mapean core-api y core-identity
    (Flit.Identity.Web PlatformEndpoints). GET .../products suma `provisioning` (null en los productos sin
    aprovisionamiento; hoy solo `impuestos` lo tiene). Rutas nuevas: GET .../products/{productCode}/alta-previa y POST
    .../products/{productCode}/aprovisionamiento/reintentar. PUT .../products/{productCode} suma el 409
    PROVISIONING_PREREQUISITE_MISSING al encender un producto con aprovisionamiento sin AdminCompany activo. Los textos
    visibles están cerrados en `x-flit-etiquetas` (por enum) y en los ejemplos de Problem: el front no redacta otros.
  license:
    name: Propietario FLIT
    url: https://flitsas.com

servers:
  - url: https://api.flit.co
    description: Producción (vía Gateway YARP)
  - url: http://localhost:4002
    description: Local (Gateway)

security:
  - bearerAuth: []

tags:
  - name: Platform
    description: Productos de la suite y su habilitación por empresa.

paths:
  /api/v1/platform/me/apps:
    get:
      tags: [Platform]
      operationId: listMyApps
      summary: Productos que el usuario puede abrir
      description: >
        La plataforma (el hub) siempre aparece. Otro producto aparece si está encendido para la
        empresa del usuario y para su cabeza, y el usuario tiene rol en él. Al SuperAdmin se le
        devuelven todos los productos activos. `current` marca el producto del host de la petición.
      responses:
        "200":
          description: Productos, en el orden del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyApp"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/platform/products/{code}/manifest:
    put:
      tags: [Platform]
      operationId: applyProductManifest
      summary: Registrar el manifiesto de un producto
      description: >
        Lo llama cada servicio al arrancar, con token de servicio y scope `platform.manifest`.
        Idempotente: crea o actualiza módulos, permisos y roles por defecto del producto, y no borra
        nada. Cada `slug` debe empezar por `<code>.`.
      parameters:
        - $ref: "#/components/parameters/ProductCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductManifest"
      responses:
        "200":
          description: Manifiesto aplicado; cuenta lo que se creó.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestApplyResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El token no tiene el scope platform.manifest.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/v1/platform/admin/tenants/{tenantId}/products:
    get:
      tags: [Platform]
      operationId: listTenantProducts
      summary: Productos de una empresa (SuperAdmin)
      description: Todo el catálogo salvo la plataforma, con su estado para la empresa. Sin fila = apagado.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Estado de cada producto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Solo el SuperAdmin.
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/platform/admin/tenants/{tenantId}/products/{productCode}:
    put:
      tags: [Platform]
      operationId: setTenantProduct
      summary: Encender o apagar un producto para una empresa (SuperAdmin)
      description: >
        Idempotente y auditado en admin.tenant_config_audit_logs. Una empresa hija no puede encender un
        producto que su cabeza tiene apagado (409 PRODUCT_NOT_ENABLED_FOR_HEAD). Apagar la cabeza deja
        sin el producto a sus hijas sin reescribir sus filas.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: productCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                notes:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "200":
          description: Estado resultante. `changed` es false si ya estaba igual.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TenantProductState"
                  - type: object
                    properties:
                      changed:
                        type: boolean
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Solo el SuperAdmin.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: >
            PRODUCT_NOT_ENABLED_FOR_HEAD (la cabeza lo tiene apagado), PRODUCT_INACTIVE, PRODUCT_ALWAYS_ON o, al
            encender un producto con aprovisionamiento (hoy `impuestos`), PROVISIONING_PREREQUISITE_MISSING: la compañía
            no tiene un AdminCompany activo (D-EMAIL). Con ese código no se guarda nada ni se encola trabajo; `detail` es
            el literal del ejemplo y el front lo muestra tal cual. Apagar nunca exige la precondición.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Falta un requisito para activar el producto
                status: 409
                detail: La compañía no tiene un Administrador de Compañía activo
                code: PROVISIONING_PREREQUISITE_MISSING

  /api/v1/platform/admin/tenants/{tenantId}/products/{productCode}/alta-previa:
    get:
      tags: [Platform]
      operationId: getTenantProductProvisioningPreview
      summary: Vista previa de los datos del alta en el proveedor (SuperAdmin)
      description: >
        HU #14694 (ADR-0093, plan §1.3 decisión P1). La usa el diálogo de activación de Impuestos antes de confirmar:
        muestra el NIT base (`taxIdBase`) y el correo (`contactEmail`) que core-impuestos enviará al proveedor. El mismo
        handler atiende el rpc flit.identidad.v1.EmpresasService.ObtenerDatosAltaProveedor. Solo lectura; no llama al
        proveedor. `blocking` = SIN_ADMIN cuando no hay AdminCompany activo: el diálogo deshabilita «Confirmar» (el PUT
        respondería 409 PROVISIONING_PREREQUISITE_MISSING). Un `nitStatus` distinto de VALIDO no bloquea el PUT (supuesto
        S-C): la compañía queda activada y su aprovisionamiento en REQUIERE_REVISION_NIT; el diálogo lo advierte con la
        etiqueta del estado y ofrece «Corregir NIT».
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProvisionedProductCode"
      responses:
        "200":
          description: Datos que se enviarán.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Solo el SuperAdmin.
        "404":
          description: TENANT_NOT_FOUND, o PRODUCT_WITHOUT_PROVISIONING si `productCode` no tiene aprovisionamiento.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/platform/admin/tenants/{tenantId}/products/{productCode}/aprovisionamiento/reintentar:
    post:
      tags: [Platform]
      operationId: retryTenantProductProvisioning
      summary: Reintentar el aprovisionamiento del producto (SuperAdmin)
      description: >
        HU #14694 (plan §1.2 decisión R1). Encola por la outbox, en la misma transacción, el trabajo
        `impuestos.aprovisionamiento.reintentar` (contracts/asyncapi/impuestos-events.v1.yaml) con el id del SuperAdmin.
        No espera a core-impuestos: el estado nuevo llega cuando el servicio lo reporta (GET .../products). El front solo
        muestra «Reintentar» cuando `provisioning.action` = REINTENTAR (estados ERROR e INCIERTO); core-impuestos ignora
        el trabajo en cualquier otro estado. Sin cuerpo.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProvisionedProductCode"
      responses:
        "202":
          description: Trabajo encolado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Solo el SuperAdmin.
        "404":
          description: TENANT_NOT_FOUND, o PRODUCT_WITHOUT_PROVISIONING si `productCode` no tiene aprovisionamiento.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: PRODUCT_NOT_ENABLED, el producto está apagado para la compañía.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/platform/admin/tenants/{tenantId}/products/{productCode}/credentials/{credentialCode}:
    put:
      tags: [Platform]
      operationId: setTenantProductCredential
      summary: Guardar o reemplazar la API key de un producto (SuperAdmin)
      description: >
        ADR-0092. v1 solo admite (diagnostico, impuesto_api_key). El valor se cifra con Data Protection
        antes de persistir. Nunca se devuelve. 204 crea o reemplaza.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: productCode
          in: path
          required: true
          schema:
            type: string
        - name: credentialCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  minLength: 16
                  maxLength: 256
                  description: ASCII imprimible sin espacios. Nunca se ecoa en errores.
      responses:
        "204":
          description: Credencial guardada o reemplazada.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Solo el SuperAdmin.
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Platform]
      operationId: deleteTenantProductCredential
      summary: Borrar la API key de un producto (SuperAdmin)
      description: Idempotente. 204 también si no había fila.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: productCode
          in: path
          required: true
          schema:
            type: string
        - name: credentialCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Credencial borrada o ya ausente.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Solo el SuperAdmin.
        "404":
          $ref: "#/components/responses/Problem"

  /api/v1/platform/issuers:
    get:
      tags: [Platform]
      operationId: listIssuers
      summary: Emisores de token válidos
      description: >
        Hub de la plataforma en este ambiente y dominios de red activos (Marca Blanca), como URL con
        barra final, igual que el `iss` de los tokens del servidor OIDC del hub (A-05). Los servicios
        aceptan solo tokens de estos emisores y guardan la lista 5 minutos. Anónimo.
      security: []
      responses:
        "200":
          description: Emisores, sin repetidos.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
              example: ["https://dev.flitsas.online/", "https://app.movilidadandina.com/"]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductCode:
      name: code
      in: path
      required: true
      description: Código del contrato §1 (plataforma, tramites, comparendos, diagnostico, caja, impuestos).
      schema:
        type: string
    ProvisionedProductCode:
      name: productCode
      in: path
      required: true
      description: Producto con aprovisionamiento (ProductosConAprovisionamiento). Hoy solo `impuestos`.
      schema:
        type: string
        example: impuestos
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Sin sesión o token inválido.
    Problem:
      description: Error RFC 7807 con `code` estable (contrato §10).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    MyApp:
      type: object
      required: [code, name, icon, url, current, comingSoon]
      properties:
        code:
          type: string
          example: tramites
        name:
          type: string
          example: Trámites
        icon:
          type: string
          description: Nombre de ícono lucide.
          example: file-text
        url:
          type: string
          example: https://tramites.flitsas.online
        current:
          type: boolean
        comingSoon:
          type: boolean
          description: Todavía no desplegado en este ambiente; `url` lleva a su pantalla «Próximamente» del hub (v1.2).

    TenantProductState:
      type: object
      required: [productCode, enabled]
      properties:
        productCode:
          type: string
        enabled:
          type: boolean
        notes:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          format: uuid
          nullable: true

    TenantProduct:
      allOf:
        - $ref: "#/components/schemas/TenantProductState"
        - type: object
          required: [name, comingSoon]
          properties:
            name:
              type: string
            updatedByEmail:
              type: string
              nullable: true
              description: Correo de quien lo cambió por última vez (HU 12967).
            comingSoon:
              type: boolean
              description: Todavía no desplegado en este ambiente; se puede encender igual (HU 12967).
            impuestoApiKeyConfigurada:
              type: boolean
              nullable: true
              description: >
                ADR-0092. true/false solo en diagnostico (si hay fila de impuesto_api_key).
                null en los demás productos. Nunca el valor.
            provisioning:
              type: object
              allOf:
                - $ref: "#/components/schemas/TenantProductProvisioning"
              nullable: true
              description: >
                HU #14694. Estado de aprovisionamiento que reporta el servicio del producto
                (platform.tenant_product_provisioning, DDL 205). null en los productos sin aprovisionamiento y en un
                producto con aprovisionamiento del que la plataforma aún no recibe reporte.

    TenantProductProvisioning:
      type: object
      description: >
        Último estado reportado por el servicio del producto (rpc ReportarEstadoAprovisionamiento, versión monotónica).
        Consistencia eventual: puede ir unos segundos detrás del servicio. El chip del admin muestra la etiqueta de
        `status` (texto e icono, nunca solo color), `message` como motivo legible y la acción de `action`.
      required: [status, reason, message, action, signatureConfirmed, updatedAt]
      properties:
        status:
          $ref: "#/components/schemas/ProvisioningStatus"
        reason:
          type: string
          nullable: true
          description: Código del motivo (MotivoAprovisionamiento de contracts/openapi/impuestos.v1.yaml). null = sin motivo.
          example: EMPRESA_YA_REGISTRADA
        message:
          type: string
          nullable: true
          maxLength: 300
          description: >
            Motivo legible: el literal cerrado de `reason` (x-flit-etiquetas de MotivoAprovisionamiento en
            impuestos.v1.yaml), ya puesto por el servicio. Sin secretos ni datos personales.
        action:
          $ref: "#/components/schemas/ProvisioningAction"
        signatureConfirmed:
          type: boolean
          nullable: true
          description: >
            Solo en LISTO. false = marca «Firma sin confirmar» (aún no llega el primer webhook con firma válida). null en
            los demás estados.
          x-flit-etiquetas:
            "false": Firma sin confirmar
        updatedAt:
          type: string
          format: date-time

    ProvisioningStatus:
      type: string
      enum: [PENDIENTE, LISTO, LISTO_SIN_WEBHOOK, ERROR, INCIERTO, REQUIERE_CREDENCIALES, REQUIERE_REVISION_NIT, SUSPENDIDO]
      description: Estados del plan §3.1. Texto visible en x-flit-etiquetas.
      x-flit-etiquetas:
        PENDIENTE: Pendiente
        LISTO: Listo
        LISTO_SIN_WEBHOOK: Listo sin webhook
        ERROR: Error
        INCIERTO: Incierto
        REQUIERE_CREDENCIALES: Requiere credenciales
        REQUIERE_REVISION_NIT: Requiere revisión del NIT
        SUSPENDIDO: Suspendido

    ProvisioningAction:
      type: string
      nullable: true
      enum: [REINTENTAR, CARGAR_SECRETO, CARGAR_CREDENCIALES, CORREGIR_NIT]
      description: >
        Acción del SuperAdmin por estado (AC-FE-04): ERROR e INCIERTO -> REINTENTAR (botón que llama a
        .../aprovisionamiento/reintentar); LISTO_SIN_WEBHOOK -> CARGAR_SECRETO y REQUIERE_CREDENCIALES ->
        CARGAR_CREDENCIALES (enlace al backoffice del producto Impuestos, /backoffice/empresas/{tenantId});
        REQUIERE_REVISION_NIT -> CORREGIR_NIT (abre la pestaña de datos de la compañía). null en PENDIENTE, LISTO y
        SUSPENDIDO.
      x-flit-etiquetas:
        REINTENTAR: Reintentar
        CARGAR_SECRETO: Cargar secreto
        CARGAR_CREDENCIALES: Cargar credenciales
        CORREGIR_NIT: Corregir NIT

    ProvisioningPreview:
      type: object
      required: [legalName, taxIdBase, nitStatus, contactEmail, blocking]
      properties:
        legalName:
          type: string
          description: Razón social de la compañía (identity.tenants.legal_name).
        taxIdBase:
          type: string
          nullable: true
          description: NIT base sin dígito de verificación que se enviará (regla D-TAXID). null si nitStatus no es VALIDO.
          example: "900123456"
        nitStatus:
          type: string
          enum: [VALIDO, AMBIGUO, AUSENTE, IGUAL_A_CABEZA]
          description: >
            Todo lo que no es VALIDO es «Requiere revisión del NIT» (DA-8). La etiqueta es el motivo que muestra el
            diálogo junto a la etiqueta del estado.
          x-flit-etiquetas:
            VALIDO: NIT válido
            AMBIGUO: No se puede separar el dígito de verificación del NIT
            AUSENTE: La compañía no tiene NIT
            IGUAL_A_CABEZA: El NIT es el mismo de su compañía cabeza
        contactEmail:
          type: string
          nullable: true
          description: Correo del AdminCompany activo más antiguo (D-EMAIL). null si no hay ninguno.
        blocking:
          type: string
          nullable: true
          enum: [SIN_ADMIN]
          description: SIN_ADMIN = no hay AdminCompany activo; no se puede confirmar la activación. null = sin bloqueo.
          x-flit-etiquetas:
            SIN_ADMIN: La compañía no tiene un Administrador de Compañía activo

    ProductManifest:
      type: object
      required: [version, modules, defaultRoles]
      properties:
        version:
          type: string
          example: "1.0.0"
        modules:
          type: array
          items:
            type: object
            required: [code, name, permissions]
            properties:
              code:
                type: string
              name:
                type: string
              permissions:
                type: array
                items:
                  type: object
                  required: [slug, name]
                  properties:
                    slug:
                      type: string
                      description: "<producto>.<módulo>.<acción>, por ejemplo comparendos.bandeja.read"
                    name:
                      type: string
        defaultRoles:
          type: array
          items:
            type: object
            required: [code, name, permissions]
            properties:
              code:
                type: string
              name:
                type: string
              permissions:
                type: array
                description: Slugs del mismo manifiesto.
                items:
                  type: string

    ManifestApplyResult:
      type: object
      required: [modulesCreated, permissionsCreated, rolesCreated]
      properties:
        modulesCreated:
          type: integer
        permissionsCreated:
          type: integer
        rolesCreated:
          type: integer

    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: >
            PRODUCT_NOT_ENABLED, PRODUCT_NOT_FOUND, PRODUCT_INACTIVE, PRODUCT_ALWAYS_ON,
            PRODUCT_NOT_ENABLED_FOR_HEAD, PRODUCT_NOTES_TOO_LONG, TENANT_NOT_FOUND,
            MANIFEST_INVALID, MANIFEST_SLUG_PREFIX, MANIFEST_CONFLICT,
            PROVISIONING_PREREQUISITE_MISSING y PRODUCT_WITHOUT_PROVISIONING (v1.1.0)
