# Production docker-compose — VPS deploy (topologia slim: front + gateway + core-api).
#
# Postgres NO esta aqui: corre en el HOST (host.docker.internal:5432).
# El reverse-proxy del HOST termina TLS y enruta los dominios a los puertos
# publicados en 127.0.0.1:
#   orca.flitsas.com      -> frontend  (127.0.0.1:4001)
#   api.orca.flitsas.com  -> gateway   (127.0.0.1:4002)  [API publica YARP]
#   core.orca.flitsas.com -> core-api  (127.0.0.1:4003)  [Flit.Api interno/debug]
#
# Variables requeridas en .env (junto al compose):
#   CONNECTION_STRING_CORE  cadena Npgsql .NET (Host=...;Port=5432;Database=...;Username=...;Password=...)
#   CORS_ORIGIN             origen permitido del frontend (https://orca.flitsas.com)
#   VERIFIK_API_TOKEN       token Verifik (RUNT)
# Variables opcionales:
#   CORE_API_TAG / FRONTEND_TAG   tag de imagen (default: latest)
#   VERIFIK_BASE_URL / VERIFIK_TIMEOUT_SECONDS
#
# NOTA: login deshabilitado temporalmente -> NO se requieren llaves JWT.
#
# Despliegue:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

name: flit-prod

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ── Flit.Api (interno, detras de YARP) ────────────────────────────────────
  core-api:
    image: ghcr.io/flitsas/flit-boilerplate/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/api/Flit.Api.dll"]
    # content root = working_dir, para que .NET encuentre su appsettings.json
    working_dir: /app/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Core: ${CONNECTION_STRING_CORE}
      Cors__AllowedOrigins: ${CORS_ORIGIN:-https://orca.flitsas.com}
      # Login deshabilitado temporalmente: DevGenerate evita exigir llaves JWT
      # montadas. Para reactivar login, montar jwt-private/public.pem y quitar esto.
      Jwt__DevGenerate: "true"
      Verifik__BearerToken: ${VERIFIK_API_TOKEN:-}
      Verifik__BaseUrl: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      Verifik__TimeoutSeconds: ${VERIFIK_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:4003:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  # ── Flit.Gateway (API publica YARP: /api, /hubs) ──────────────────────────
  gateway:
    image: ghcr.io/flitsas/flit-boilerplate/core-api:${CORE_API_TAG:-latest}
    command: ["dotnet", "/app/gateway/Flit.Gateway.dll"]
    # content root = working_dir, para que YARP cargue sus rutas de appsettings.json
    working_dir: /app/gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://orca.flitsas.com}
      # Login deshabilitado temporalmente: sin llave JWT el gateway no valida firma
      # ni exige autenticación (ver Flit.Gateway/Program.cs).
    ports:
      - "127.0.0.1:4002:8080"
    depends_on:
      core-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  # ── Frontend (React/Vite + nginx, solo estaticos) ─────────────────────────
  frontend:
    image: ghcr.io/flitsas/flit-boilerplate/frontend:${FRONTEND_TAG:-latest}
    ports:
      - "127.0.0.1:4001:80"
    depends_on:
      - gateway
    restart: *restart
    logging: *default-logging
